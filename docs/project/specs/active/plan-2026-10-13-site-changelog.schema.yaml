$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:SiteChangelog/v1
title: Draft project changelog contract
description: Planning contract; extensions are allowed until the production fields settle.
type: object
required: [repository, entries]
additionalProperties: true
properties:
  repository:
    type: string
    const: https://github.com/jlevy/squares
  entries:
    type: array
    items:
      type: object
      required: [id, date, title, pull_requests, summary]
      additionalProperties: true
      properties:
        id:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: UTC merge date; calendar validity is a semantic check.
        title:
          type: string
          minLength: 1
        pull_requests:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer, minimum: 1}
        summary:
          type: string
          minLength: 1
          description: Reader-facing Markdown, normally a sentence to a few lines.
        details:
          type: string
          minLength: 1
          description: Optional Markdown, including nested bullets for significant efforts.
        stack_id:
          type: integer
          minimum: 1
        categories:
          type: array
          uniqueItems: true
          items:
            enum: [records, pipeline, regularization, site, documentation]
        result_ids:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^T-\d{3,}$'}
        artifacts:
          type: array
          items:
            type: object
            required: [kind, label, target]
            additionalProperties: true
            properties:
              kind: {enum: [paper, pdf, result, page, graphic]}
              label: {type: string, minLength: 1}
              target:
                type: string
                pattern: '^https://'
                description: Canonical public destination, checked against the site URL registry.
        publication:
          type: object
          required: [evidence]
          additionalProperties: true
          properties:
            date:
              type: string
              pattern: '^\d{4}-\d{2}-\d{2}$'
              description: Evidenced UTC date when the complete announced artifact set became public; distinct from merge date. Omit when unknown.
            evidence:
              type: string
              pattern: '^https://'
        releases:
          type: array
          items:
            type: object
            required: [component, version]
            additionalProperties: true
            properties:
              component:
                type: string
                pattern: '^(?:site|infographics|paper:[a-z0-9]+(?:-[a-z0-9]+)*)$'
              version:
                type: string
                pattern: '^v\d+\.\d+\.\d+$'
                description: Edition core referencing release.py history, not a current-version authority.
        references:
          type: array
          items:
            type: object
            required: [label, target]
            additionalProperties: true
            properties:
              label: {type: string, minLength: 1}
              target:
                type: string
                minLength: 1
                description: HTTPS URL or repository-relative path; resolve per destination.
