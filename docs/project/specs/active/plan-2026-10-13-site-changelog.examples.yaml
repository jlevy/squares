  - id: regularization-foundations
    date: '2026-10-13'
    title: Regularization Policy and Reproducible Tooling
    pull_requests: [497, 509]
    stack_id: 498
    categories: [regularization, pipeline]
    summary: |
      Established the regularization policy and retained Evan Daniel’s regularizer
      as the foundation for improving the project’s packing representations.
    details: |
      - Assessed adaptation across n = 1…324 and documented the admission policy.
      - Added a reproducible comparison tool for evaluating the proposed workflow.
      - Vendored the upstream regularizer with credit, recorded provenance and a pin check.

      Driver, exact re-solving, grid cleanup, review-gallery and admission layers
      remain open; this delivery changes no drawing or bound.
    references:
      - label: Regularization policy
        target: docs/project/policies/regularization-policy.md
      - label: Retained regularizer
        target: vendor/evand-regularize/README.md
