exclusions:
  - pattern: packing/resources/papers/**/*.md
    reason: Source-faithful transcriptions and raw extraction are governed by resources/README.md.
  - pattern: packing/resources/web/**/*.md
    reason: Retained first-party and web-source content is archival evidence, not project prose.
  - pattern: packing/resources/private-correspondence/**/*.md
    reason: >-
      Verbatim transcriptions of unpublished correspondence, governed by
      resources/README.md. Archival evidence attributed to its author, not project prose.
  - pattern: AGENTS.md
    reason: >-
      Assembled from generated tbd, flowmark and pprose blocks by their own installers,
      plus a summary of operating-rules.md that the gate checks for drift.
  - pattern: CLAUDE.md
    reason: Generated by `pprose install`; a one-line bridge to AGENTS.md.
  - pattern: docs/tbd/README.md
    reason: Generated index owned by `tbd docs fork`; the forked shortcut sources are mapped individually.
  - pattern: packing/tests/fixtures/**/*.md
    reason: >-
      Test inputs whose exact text is what a test or a measuring tool reads, such as the
      GitHub math probe `devtools.check_github_math --probe` fetches: not documents.
  - pattern: packing/devtools/templates/*.md
    reason: >-
      Manuscripts and templates for the paper, site and claim renderers:
      Markdown with placeholders and stamping markers. The rendered papers and pages
      and the generated claim documents are the published documents.
