    coordinate_provenance: verified
    method: exact-algebraic
    limitations: Verifies this known-best upper-bound construction, not uniqueness; optimality comes only
      from the separately cited frontier lower bound.
  source:
    key: E-basic-grid-upper
    path: frontier/n-001.md
  certificate:
    kind: exact-rational-sat
    replay: uv run --frozen packing-witness verify witnesses/known-best/n-001.yaml
