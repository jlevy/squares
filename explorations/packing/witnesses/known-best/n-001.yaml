  n: 1
  side: '1'
  square_size: '1'
  representation: corners
  scalar:
    kind: rational
  coordinates:
    origin: lower-left
    axes: x-right-y-up
    angle_unit: not-applicable
  squares:
  - id: 1
    corners:
    - - '0'
      - '0'
    - - '1'
      - '0'
    - - '1'
      - '1'
    - - '0'
      - '1'
