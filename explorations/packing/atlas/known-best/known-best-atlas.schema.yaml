$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:KnownBestAtlas/v1
title: Known-best square-packing atlas
type: object
additionalProperties: false
required: [range, generated_by, policy, entries]
properties:
  range:
    type: object
    additionalProperties: false
    required: [first_n, last_n, count]
    properties:
      first_n: {const: 1}
      last_n: {const: 100}
      count: {const: 100}
  generated_by: {type: string, minLength: 1}
  policy:
    type: object
    additionalProperties: false
    required: [source_layer, witness_layer, rendering_layer, annotation_layer]
    properties:
      source_layer: {type: string, minLength: 1}
      witness_layer: {type: string, minLength: 1}
      rendering_layer: {type: string, minLength: 1}
      annotation_layer: {type: string, minLength: 1}
  entries:
    type: array
    minItems: 100
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required:
        [n, frontier_path, reported_side, source, witness, rendering, chunk_annotation]
      properties:
        n: {type: integer, minimum: 1, maximum: 100}
        frontier_path: {type: string, pattern: '^frontier/n-[0-9]{3}\.md$'}
        reported_side: {type: string, minLength: 1}
        source:
          type: object
          additionalProperties: false
          required: [kind, path, source_n, listed_n, derivation]
          properties:
            kind: {enum: [exact-grid, kingbird-derived-facts, unitsquare-rendering]}
            path: {type: string, minLength: 1}
            url: {type: string, minLength: 1}
            source_n: {type: integer, minimum: 1, maximum: 100}
            listed_n:
              type: array
              minItems: 1
              items: {type: integer, minimum: 1, maximum: 100}
            derivation: {type: string, minLength: 1}
        witness:
          type: object
          additionalProperties: false
          required: [id, path, assurance, method]
          properties:
            id: {type: string, pattern: '^W-known-best-n[0-9]{3}$'}
            path: {type: string, pattern: '^witnesses/known-best/n-[0-9]{3}\.yaml$'}
            assurance: {enum: [numerically-checked, verified]}
            method: {enum: [numerical-multiprecision, exact-algebraic]}
            tolerance: {type: string, minLength: 1}
        rendering:
          type: object
          additionalProperties: false
          required: [path, renderer]
          properties:
            path: {type: string, pattern: '^atlas/known-best/rendering/n-[0-9]{3}\.svg$'}
            renderer: {const: sqpack deterministic house renderer}
        chunk_annotation:
          type: object
          additionalProperties: false
          required: [status, path, note]
          properties:
            status: {enum: [unreviewed, calibration, holdout, annotated]}
            path: {type: [string, 'null']}
            note: {type: string, minLength: 1}
