  <title id="figure-title">Exact optimal configuration spaces for three unit squares in side 2</title>
  <desc id="figure-description">Two labelled 12-cycles quotient to one unlabelled four-cycle and then to the C-G-M interval. Packing glyphs show the corner, generic, and centred strata.</desc>
