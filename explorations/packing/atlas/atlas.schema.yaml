# Contract for one provisional atlas: every distinct endpoint key observed at one `n`.
#
# Written by sqpack.atlas, never by hand. The file is APPEND-ONLY -- a basin once seen
# remains an observation, and a later run that fails to rediscover it does not erase it.
# This makes the key-discovery curve monotone. A plateau is regime-specific and does not
# prove that connected terminal components or local optima are saturated.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:BasinAtlas/v1
title: BasinAtlas
type: object
additionalProperties: false
required: [n, quantum, contact_tol, proposals, non_converged, distinct_basins, basins]
properties:
  n:
    type: integer
    minimum: 1
    description: The instance this atlas covers. One file per n.
  quantum:
    type: number
    exclusiveMinimum: 0
    description: >-
      The geometric key's quantization step. Recorded because it decides what counts as
      one endpoint key, not because it defines a mathematical basin. A store built at
      one quantum may not be merged with a store built at another.
  contact_tol:
    type: number
    exclusiveMinimum: 0
    description: >-
      The separation below which a pair counts as touching, and so the tolerance the
      contact certificate was computed at. Same merge caveat as `quantum`.
  proposals:
    type: integer
    minimum: 0
    description: >-
      Configurations offered to the store, including rediscoveries. The denominator of
      the discovery curve; without it a basin count is a number with no exposure behind
      it and saturation cannot be claimed.
  non_converged:
    type: integer
    minimum: 0
    description: >-
      Proposals whose quench never proved convergence. They are retained as observations
      but are not stationary components or local optima. A census where this is most of
      `proposals` is measuring the sweep limit rather than the landscape. Measured
      2026-08-23 at n = 5: 11 of 12 uniform multistarts hit the cap, and every structural
      check still passed green. Required, so no atlas can hide the question.
  distinct_basins:
    type: integer
    minimum: 0
    description: >-
      Legacy name for the length of `basins`, carried so a reader need not count and a
      drift check can. It is currently an endpoint-key count, not a certified count of
      connected terminal components.
  closest_pair:
    type: ["number", "null"]
    description: >-
      Legacy name for the smallest scalar side gap between two rows, or null below two
      rows. D-021 bounds error in the side objective only. This field cannot establish
      whether endpoint candidates or connected terminal components are equal or
      distinct; pose, topology, repeatability, and interval evidence are required.
  basins:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        [geometric, contact, side, angle_signature, contact_count, quench_frequency,
         converged_frequency]
      properties:
        geometric:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Quantized key, invariant under the container's symmetries and relabelling.
        contact:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: >-
            Contact graph canonical up to isomorphism. One comparison signal, not ground
            truth for a terminal component: one component may cross contact strata and
            distinct metric realizations may share a graph. A row currently requires
            both this and the geometric key to agree; see sqpack/canonical.py.
        side:
          type: number
          exclusiveMinimum: 0
          description: >-
            Best side seen for this basin, at the `polished` tier -- exact within a cell
            to solver precision, floor about 1e-11. NEVER `exact`: promotion routes
            through sqpack.verify, and only that may claim a record.
        angle_signature:
          type: array
          items: {type: integer, minimum: 1}
          description: >-
            Sorted sizes of the angle classes. The cheapest structural descriptor there
            is, and the one that separates a grid (all one class) from an oblique record.
        contact_count:
          type: integer
          minimum: 0
          description: >-
            Contacts in the packing. A rigid optimum is highly contacted; a
            barely-jammed one is not, and the difference is visible here before any
            geometry is read.
        quench_frequency:
          type: integer
          minimum: 1
          description: >-
            Times this endpoint key was observed. Divided by `proposals`, it estimates a
            probability only for the exact proposer, quench and identity regime that
            produced the shard; it is not an intrinsic basin volume.
        converged_frequency:
          type: integer
          minimum: 0
          description: >-
            Of `quench_frequency`, how many proved convergence. Zero means nothing that
            landed here ever finished descending, so the row is a stopping point rather
            than an established optimum -- a different kind of object, and the census
            must be able to say which without re-running anything.
        first_seen_seed:
          type: ["integer", "null"]
          description: Seed that first produced it, so a single basin can be re-derived alone.
