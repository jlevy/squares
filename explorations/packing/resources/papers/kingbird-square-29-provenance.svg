<!--
    Found by Thomas Schadt on December 8, 2025 using a computer program he wrote, starting from randomness.
        Source: Private communication from Thomas Schadt to David Ellsworth, December 8, 2025.
            URL: https://github.com/BalthasarStrauss/Squares-packing_S-29-_New-Record
    Improved by David Ellsworth on December 10, 2025, with exact analytic solution.

    Unset[{s, a, b, c, d, i, r1, r2, r3, r4, r5, r8, rB, rC, rD, f1, f2, f3, f4, f5, solution}];
    r1 = (s - 5)*Sin[a];
    r2 = 1 - (s - 5)*Cos[b];
    r3 = (({s - 1, 3} + RotationTransform[-c][{-1, 1}])[[2]] - (s - 2))/Cos[c];
    r4 = (({s - 3, 1} + RotationTransform[a][{1 - (s - 5)*Cos[a], 0}])[[2]] - 1)/Cos[d];
    r5 = ((s - 1) - ({2, 1} + RotationTransform[a][{1, -r1}] + RotationTransform[d][{1, -r4}] + RotationTransform[d][{1, 0}])[[1]])/Sin[d];
    r8 = 2 - RotationTransform[-b][{2, s - 1} - {s - 2, s - 2}][[2]];
    rB = -({s - 2, s - 2} + RotationTransform[b][{-4, 1 - r8}])[[1]]/Sin[b];
    rC = 1 - RotationTransform[-i][({s - 2, s - 2} + RotationTransform[b][{-3, -r8 - rB}]) - {1, 2}][[2]];
    rD = RotationTransform[-b][({2, 1} + RotationTransform[a][{1, 1 - r1}]) - ({1, 2} + RotationTransform[i][{1, -rC}])][[2]]/Cos[i - b];
    f1 = RotationTransform[-a][({1, 2} + RotationTransform[i][{1, -rC}]) - ({2, 1} + RotationTransform[a][{0, 1 - r1}])][[2]];
    f2 = RotationTransform[-d][({1, 2} + RotationTransform[i][{1, -rC + rD}] + RotationTransform[b][{2, 0}]) - ({2, 1} + RotationTransform[a][{1, -r1}] + RotationTransform[d][{1, -r4}] + RotationTransform[d][{0, 1 - r5}])][[2]];
    f3 = RotationTransform[-b][({1, 2} + RotationTransform[i][{1, -rC + rD}] + RotationTransform[b][{2, 0}]) - ({2, 1} + RotationTransform[a][{1, -r1}] + RotationTransform[d][{1, 1 - r4}])][[2]];
    f4 = RotationTransform[-b][({s - 1, 3} + RotationTransform[-c][{-1, -r3}]) - ({1, 2} + RotationTransform[i][{1, -rC + rD}] + RotationTransform[b][{2, 0}])][[1]];
    f5 = RotationTransform[-b][({s - 2, s - 2} + RotationTransform[b][{-1, -r8}]) - ({1, 2} + RotationTransform[i][{1, -rC + rD}] + RotationTransform[b][{0, 1}])][[2]];
    f6 = RotationTransform[c][{s - 1, 3} - ({s - 2, s - 2} + RotationTransform[b][{0, -r8}])][[1]] - 1;
    solution = FindRoot[{f1==0, f2==0, f3==0, f4==0, f5==0, f6==0}, {{s, 5.9339}, {a, 24.95*Pi/180}, {b, 20.77*Pi/180}, {c, 17.89*Pi/180}, {d, 24.70*Pi/180}, {i, 24.20*Pi/180}}, WorkingPrecision -> 200];
    N[{s, a*180/Pi, b*180/Pi, c*180/Pi, d*180/Pi, i*180/Pi, r1, r2, r3, r4, r5, r8, rB, rC, rD, {f1, f2, f3, f4, f5, f6}} /. solution, 100]
-->
