      source: resources/papers/kearney-shiu-2002-efficient-packing-unit-squares.pdf
      theorem: Theorem 1, s(6) = 3
      scope: Six pairwise interior-disjoint unit squares in a square, with arbitrary rotations.
      pinpoints: Section 3, Proof of Theorem 1; prerequisite dual unavoidable lattices and Lemmas 1-3 in Section 2.
      assumptions:
        - Packings permit arbitrary orientations and boundary contact.
        - The paper's shrinking argument converts its open-box statement to unit-square lower bounds.
    limitations: Complete external published proof; not independently audited here.
    source_reviewed: '2026-08-25'

