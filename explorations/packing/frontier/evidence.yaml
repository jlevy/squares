  - id: E-nagamochi-lower
    claim: lower-bound
    scope: {n_min: 4, n_max: 100}
    assurance: verified
    method: published-proof
    performed_by: source-author
    relationship_to_generator: not-applicable
    origin: external
    source_key: '[Nagamochi 2005]'
    replay_status: not-attempted
    proof:
      source: resources/papers/nagamochi-2005-packing-unit-squares-in-a-rectangle.pdf
      theorem: Theorem 2
      scope: Every integer N at least 4; exact values for N in {m^2, m^2-1, m^2-2}.
      pinpoints: Theorem 2 on printed pages 1-2; derivation from Theorem 1 in Section 2.
      assumptions:
        - Unit squares may rotate inside an open square container.
        - The square-packing side function is the paper's s(N).
    limitations: External published proof; its arithmetic is not independently replayed here.
    source_reviewed: '2026-08-24'

