  - id: E-n005-gobel-proof
    claim: lower-bound
    scope: {n_values: [5]}
    assurance: verified
    method: published-proof
    performed_by: source-author
    relationship_to_generator: not-applicable
    origin: external
    source_key: '[Göbel 1979]'
    replay_status: not-attempted
    proof:
      source: resources/papers/gobel-1979-geometrical-packing-and-covering-problems.pdf
      theorem: Proposition 1, z*(5) = 2 + sqrt(2)/2
      scope: Five pairwise interior-disjoint unit squares in an enclosing square, with arbitrary rotations.
      pinpoints: Printed pages 180-181, Proposition 1, Figure 2, and its three-case proof outline.
      assumptions:
        - Packings permit arbitrary orientations and boundary contact.
        - The epsilon argument proves every strict smaller side impossible and passes to the infimum.
    limitations: The source calls this an outline and omits routine analytic calculations; not independently audited here.
    source_reviewed: '2026-08-25'

