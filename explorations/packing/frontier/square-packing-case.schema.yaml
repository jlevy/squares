$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:SquarePackingCase/v2
title: SquarePackingCase
description: >-
  Reported and formally supported bounds for one square-packing instance. Decimal
  literals remain strings; evidence records carry assurance and replay details.
type: object
additionalProperties: false
required:
  - n
  - reported_status
  - status
  - source_reviewed
  - reported_upper_bound
  - verified_upper_bound
  - reported_lower_bound
  - verified_lower_bound
  - evidence
  - conflicts
  - blockers
  - resources
properties:
  n: {type: integer, minimum: 1}
  reported_status:
    enum: [proved, open]
    description: Literal mathematical status reported by the tracked source set.
  status:
    enum: [proved, open]
    description: Proved only when verified upper and lower bounds match exactly.
  source_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  reported_upper_bound: {$ref: '#/$defs/reportedUpper'}
  verified_upper_bound: {$ref: '#/$defs/verifiedBound'}
  reported_lower_bound: {$ref: '#/$defs/reportedLower'}
  verified_lower_bound: {$ref: '#/$defs/verifiedBound'}
  conjectured_optimum: {type: [string, 'null']}
  priority_notes:
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [claim]
      properties:
        claim: {type: string, minLength: 1}
        claimed_by: {type: array, items: {type: string}, default: []}
        published: {type: [string, 'null']}
        year: {type: [integer, 'null']}
  evidence:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^E-[a-z0-9-]+$'}
  conflicts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, detail, evidence]
      properties:
        kind: {enum: [source-disagreement, replay-failure, scope-ambiguity, stale-source]}
        detail: {type: string, minLength: 1}
        evidence:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^E-[a-z0-9-]+$'}
  blockers:
    type: array
    items: {$ref: '#/$defs/blocker'}
  resources:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [key, role]
      properties:
        key: {type: string, minLength: 1}
        role:
          enum:
            - upper-bound-report
            - lower-bound-proof
            - record-catalogue
            - survey
            - numerical-witness
            - formal-certificate
            - context
        local: {type: [string, 'null']}
        url: {type: [string, 'null']}
        retrieved: {type: [boolean, 'null']}
$defs:
  evidenceRefs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^E-[a-z0-9-]+$'}
  verifiedBound:
    type: object
    additionalProperties: false
    required: [value, exact_form, evidence]
    properties:
      value:
        type: string
        minLength: 1
        description: Reader display literal; exact_form is authoritative when present.
      exact_form: {type: [string, 'null']}
      evidence: {$ref: '#/$defs/evidenceRefs'}
  reportedUpper:
    type: object
    additionalProperties: false
    required: [value, exact_form, construction_method, source_key, evidence]
    properties:
      value: {type: string, minLength: 1}
      exact_form: {type: [string, 'null']}
      algebraic_degree: {type: [integer, 'null'], minimum: 1}
      minimal_polynomial: {type: [string, 'null']}
      analytically_optimized: {type: [boolean, 'null']}
      rigid: {type: [boolean, 'null']}
      construction_method:
        enum:
          - trivial-grid
          - hand-construction
          - diagonal-strip
          - pattern-family
          - extension
          - composition
          - simulated-annealing
          - inflation-billiard
          - unknown
      tilt_angles_deg:
        type: [array, 'null']
        items: {type: number}
      found_by: {type: array, items: {type: string}, default: []}
      found_year: {type: [integer, 'null']}
      improved_by: {type: array, items: {type: string}, default: []}
      catalogue_pictured: {type: boolean}
      source_key: {type: string, minLength: 1}
      source_date: {type: [string, 'null']}
      retrieved_date: {type: [string, 'null']}
      witnesses: {type: array, items: {type: string}, default: []}
      evidence: {$ref: '#/$defs/evidenceRefs'}
  reportedLower:
    type: object
    additionalProperties: false
    required: [value, exact_form, kind, source_key, evidence]
    properties:
      value: {type: string, minLength: 1}
      exact_form: {type: [string, 'null']}
      kind:
        enum: [area, perfect-square, nagamochi, monotonicity, unavoidable-points, counting]
      proved_by: {type: array, items: {type: string}, default: []}
      proved_year: {type: [integer, 'null']}
      source_key: {type: [string, 'null']}
      note: {type: [string, 'null']}
      scope: {type: [string, 'null']}
      evidence: {$ref: '#/$defs/evidenceRefs'}
  blocker:
    type: object
    additionalProperties: false
    required: [kind, detail]
    properties:
      kind: {enum: [source-evidence, importer, checker, field-precondition, mathematics]}
      detail: {type: string, minLength: 1}
      evidence:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^E-[a-z0-9-]+$'}
