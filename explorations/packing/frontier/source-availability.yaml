# Every source the research documents cite that is NOT in the local archive,
# with the specific obstacle and what depends on it.
#
# Homogeneous rows, no per-row narrative, so this is plain YAML rather than one
# artifact per source -- see README.md on format choice. The Markdown table in
# the research document is generated from this file by python -m devtools.render_research_tables.
#
# RE-TEST RATHER THAN INHERIT. A "not retrievable" verdict is a negative search
# result. This list has now been wrong eight times: Gensane-Ryckelynck, Nagamochi
# and Wang-Dong-Li were all freely available when re-tested on 2026-08-22, and
# Markot 2021 was open access at PMC the whole time. Roth-Vaughan was supplied
# by the requester on the same day. Stromquist's three memoranda were linked
# directly from the author's publication page. Every entry below carries the
# date it was last checked and the exact evidence. Trump 2023 and El Moumni
# 1999 were recovered from public author and institutional routes on 2026-08-27.
softschema:
  contract: packing.squares:SourceAvailability/v1
  schema: source-availability.schema.yaml
  status: enforced

last_checked: '2026-08-27'
archive: explorations/packing/resources/

# Cleared since the first pass. Kept so the correction is visible, and as
# evidence for the re-test rule above.
recovered:
  - key: "[Roth–Vaughan 1978]"
    title: Inefficiency in Packing Squares with Unit Squares
    how: Supplied by the requester after ScienceDirect refused automated clients.
    impact: >
      Settled the single most consequential open question in the corpus. The
      theorem is w(a) >> (||a|| a)^{1/2} under a(a - [a]) > 1/6, where ||a|| is
      the distance from a to the nearest integer. Both secondary renderings were
      wrong: DS7 and McClenagan each report a 10^{-100} constant that appears
      nowhere in the paper, and the relation is Vinogradov >>, not >.
  - key: "[Markót 2021]"
    title: Improved interval methods for solving circle packing problems in the unit square
    how: Open access at PMC; the earlier pass recorded it unretrieved without testing.
  - key: "[Gensane–Ryckelynck 2005]"
    title: Improved Dense Packings of Congruent Squares in a Square
    how: Springer serves the PDF openly at its /content/pdf/ URL; the earlier attempt fetched the article landing page.
  - key: "[Nagamochi 2005]"
    title: Packing Unit Squares in a Rectangle
    how: Open access in Electron. J. Combin.; cited by exact title in the archived DS7 reference list all along.
  - key: "[Wang–Dong–Li 2016]"
    title: A New Result on Packing Unit Squares into a Large Square
    how: On arXiv.
  - key: "[Stromquist 1984]"
    title: Packing Unit Squares Inside Squares, I-III
    how: >
      The author's official publication page at
      https://www.walterstromquist.com/publications.html links squares1.pdf,
      squares2.pdf and squares3.pdf directly; "unpublished" described their
      publication status, not their present-day retrievability.
    impact: >
      Memoranda I and II contain the detailed n = 6 and n = 10 proofs. Memorandum III
      proves only the 0/45-degree n = 11 bound at 2 + (4/3)sqrt(2); page 10 separately
      asserts the unrestricted 2 + (4/5)sqrt(5) bound without coordinates, cover
      routing or proof. It therefore supplies no repair for the printed 2003 Figure 14
      gap.
  - key: "[El Moumni 1999]"
    title: Optimal Packings of Unit Squares in a Square
    how: >
      The Hungarian Academy's REAL-J institutional repository publicly serves the
      complete published volume at https://real-j.mtak.hu/5478/; the article is PDF
      pages 287-296 (printed pages 281-290). The full source scan and faithful text
      extraction are retained locally. No article DOI was verified.
    impact: >
      Confirms the published proofs of s(7) = 3 and s(15) = 4 directly. The n = 7
      proof combines a near-3-by-3 dissection, center forcing, a parallel-line
      intersection bound, and three finite symmetry cases. The n = 15 proof applies
      the paper's general parallel-line bound. This supplies a concrete proof-lane
      replay control; it does not bear on n = 11 feasibility or optimality.
  - key: "[Trump 2023]"
    title: Packing of 11 unit squares in a square with minimum size
    how: >
      Walter Trump's public author page at https://trump.de/square-packing/index.htm
      links the full PDF directly. The author copy and faithful text extraction are
      retained locally; ResearchGate's blocked download is no longer the acquisition
      route.
    impact: >
      Confirms the incidence description, degree-8 angle equation, and the author's
      local-rigidity claim for the 1979 arrangement. It says that an improvement would
      require an essentially different arrangement; it does not prove global
      optimality.

# Still missing. `blocker` is the mechanism, not a guess.
unretrieved:
