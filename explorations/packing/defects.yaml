- id: D-052
  title: Coordinatewise quench stopping was reported as a certified local optimum
  date: '2026-08-23'
  layer: quench
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: outstanding
  what: >-
    A clean cyclic one-angle sweep establishes only no detected coordinate improvement
    under finite brackets and tolerances. Coupled directions may improve; golden-section
    assumes an unverified unimodal bracket over a nonsmooth multi-cell objective. The
    atlas and docs nevertheless promoted converged true as a local optimum. Related
    prose turned two tested derivative-free failures into a theorem that Powell and
    Nelder-Mead cannot converge to a corner.
  consequence: >-
    A coordinatewise saddle, missed bracket minimum, or tolerance-limited point can be
    counted as a basin. Method choices can also be ruled out by an invalid generalization
    from one implementation and start.
  fix: >-
    The registered claim and living summaries now scope the evidence to Trump's tested
    one-dimensional shared-tilt slice and treat Powell/Nelder-Mead failures as empirical.
    Certification remains open: use honest states such as coordinatewise_stationary;
    test coupled feasible directions, multiple brackets and nonsmooth active-set/KKT
    conditions; reserve locally_certified for an independently checked neighborhood
    claim.
  regression: none
  bead: think-zcx4
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-053
  title: The generic number-field API accepts reducible or multi-root certificates
  date: '2026-08-23'
  layer: verifier
  class: soundness
  direction: neutral
  detected_by: review
  severity: critical
  status: outstanding
  what: >-
    NumberField documents an irreducible minimal polynomial and an interval containing
    exactly one real root but checks only an endpoint sign change. For
    (x-1)(x-2) on (0,7/5), the selected root is 1 while the quotient representation says
    alpha-1 is nonzero. Equality can be wrong and sign refinement can fail to terminate.
  consequence: >-
    The advertised API for a new packing can accept malformed field metadata and return
    unsound exact comparisons. The built-in Trump witness remains independently checked;
    the generic trust boundary does not.
  fix: >-
    none yet. Verify primitive squarefree irreducibility and exactly one interval root
    with a Sturm sequence, or require independently checked proof-carrying field
    metadata; resource-bound every sign decision.
  regression: none
  bead: think-zcx4
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-054
  title: Move budgets overshoot and final-best records cannot support trajectory claims
