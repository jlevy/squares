- id: D-047
  title: Contact certificates changed under container reflection while the D4 test checked only geometry
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    The contact key ranked folded angle classes by representative value. Reflection maps
    a to pi/2-a and can reverse those ranks, changing an attributed contact graph for the
    same packing. The existing D4 test asserted invariance only for the geometric key.
  consequence: >-
    One physical endpoint could be split by orientation, inflating component counts and
    making its observed frequency look smaller. The named symmetry test stayed green
    because it omitted the failing half of the identity.
  fix: >-
    Contact certificates are minimized across all eight container images and the
    independent canonical checker compares both key fields for every image.
  regression: >-
    tools/canonical_check.py exercises all eight D4 transforms and square relabelling for
    the full key pair.
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-048
