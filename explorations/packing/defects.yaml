- id: D-009
  title: The overlap guard was asserted against a drifting accumulator
  date: '2026-08-23'
  layer: engine
  class: soundness
  direction: neutral
  detected_by: review
  latent_for: one branch
  severity: high
  status: fixed
  what: >-
    Overlap was tracked incrementally across roughly 4e5 moves per anneal and thousands
    of anneals per chain, and the reported guard value was that accumulator rather than
    a recomputation from the stored configuration.
  consequence: >-
    Accumulated cancellation error sits at the scale of the feasibility threshold
    itself, and drifts either way: silently recording a real overlap, or silently
    refusing a genuine record.
  fix: 'Recomputed from the stored configuration at record time.'
  regression: 'selftest asserts the recomputed value matches the stored one'
  recorded_in: docs/project/reviews/review-2026-08-23-experiment-loop-and-campaign.md
- id: D-010
  title: A three-cell sweep recorded as a one-cell round
  date: '2026-08-23'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: one branch
  severity: medium
  status: fixed
  what: >-
    A round measured n = 10, 11 and 12 but declared a single instance, so the ledger
    showed two of three swept cells as unfilled.
  consequence: >-
    An unattended runner reads unfilled cells as queue items and re-runs work already
