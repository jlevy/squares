  layer: docs
  class: soundness
  direction: flattering
  detected_by: review
  latent_for: inherited source prose and PR 20 draft
  severity: high
  status: fixed
  what: >-
    The numeric-to-exact narrative said only discrete data crosses the boundary, that
    contact equations have only side and distinct angles as unknowns, and that an exact
    rational LP is the general remedy for solver noise. Numerical coordinates may seed
    or select a candidate root; the general contact system still contains centres until
    a particular graph permits their elimination; and fixed-angle coefficients can be
    algebraic rather than rational.
  consequence: >-
    A recovery instrument could omit necessary variables or choose an inapplicable exact
    scalar, then present a special-case derivation as a general promotion pipeline.
  fix: >-
    Treat the contact structure as the unchecked discrete hypothesis while allowing
    numerical values only as non-decisive root-finding hints. Require centre elimination
    to be derived from each contact graph. Describe the solver target as an exact LP over
    certified rational or algebraic coefficients, with a rational LP only as the
    rational-coefficient special case.
