# The defect logbook. Generated view: defects.md (run python -m devtools.render_defects).
#
# Scope: defects in the packing toolchain -- the engine, the quench, the verifier, the
# experiment record, and the tooling around them. Approaches tried and rejected on
# their merits are not defects; those live in campaign/ideas.md under Dead ends.
#
# Every entry names what caught it. That column is the deliverable: it is how we learn
# which detectors are worth building more of.
softschema:
  contract: packing.squares:DefectLog/v1
  schema: defects.schema.yaml
  envelope: null
  status: enforced
count: 232
defects:
- id: D-001
  title: Fixed-side search never left the grid basin
  date: '2026-08-22'
  layer: engine
  class: validity
  direction: conservative
  detected_by: control_cell
  latent_for: caught during construction, before any recorded round
  severity: high
  status: fixed
  what: >-
    The first formulation fixed a container side and asked whether the squares fit,
    needing an outer loop to decide when an anneal had failed. It started from the
    trivial grid, which is exactly jammed, so no local move escaped it.
  consequence: >-
    A whole night of confident, meaningless numbers at n = 11 -- the search would have
    reported the grid for every n.
  fix: >-
    Removed the container from the variables: minimise required_side + lambda * overlap
    directly, so every compacting move is rewarded and no feasibility oracle is needed.
  regression: 'n = 10 positive control, which is not the grid and so cannot be passed by returning it'
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-001-baseline-sweep.md
- id: D-002
  title: A restart cap made the declared move budget inert
  date: '2026-08-22'
  layer: engine
  class: validity
  direction: neutral
  detected_by: anomaly
  latent_for: two engine versions
  severity: high
  status: fixed
  what: >-
    A hard cap of 24 restarts stopped every chain before --budget-moves did, so the
    declared budget did nothing and two strategies compared "at equal budget" would
    have done unequal work.
  consequence: >-
    Every strategy comparison in the campaign would have been invalid, and silently so.
  fix: 'Cap raised to u64::MAX; the move budget is what binds.'
  regression: none
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-001-baseline-sweep.md
- id: D-003
  title: Squared overlap penalty has a vanishing gradient
  date: '2026-08-22'
  layer: engine
  class: performance
  detected_by: inspection
  latent_for: caught during construction
  severity: medium
  status: fixed
  what: >-
    A squared penalty's gradient dies as the overlap closes, so the search never quite
    reaches zero overlap and hovers just inside infeasibility.
  consequence: 'Screening would reject valid packings, or accept configurations that never became valid.'
  fix: 'Linear penalty, which has an exact finite-lambda constrained optimum.'
  regression: 'selftest asserts the reported packing is overlap-free'
  recorded_in: campaign/ideas.md
- id: D-004
  title: Half the test suite was silently unreachable
  date: '2026-08-22'
  layer: tooling
  class: validity
  direction: flattering
  detected_by: inspection
  latent_for: one branch
  severity: high
  status: fixed
  what: >-
    test.sh ran its frontier and schema checks under a bare python3 that lacked PyYAML,
    so `import yaml` failed and every check below it was skipped -- while the suite
    still reported success.
  consequence: >-
    A green gate that checked almost nothing. The most dangerous shape a test suite can
    take, because it actively buys false confidence.
  fix: >-
    Interpreter selection at the top of test.sh, preferring one that already has the
    dependencies and falling back to a pinned zero-install runner; the chosen runner is
