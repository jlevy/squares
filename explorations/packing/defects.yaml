- id: D-011
  title: The annealer never scored its own starting configuration
  date: '2026-08-23'
  layer: engine
  class: soundness
  direction: conservative
  detected_by: control_cell
  latent_for: caught before the first recorded round of the experiment
  severity: high
  status: fixed
  what: >-
    The incumbent best was only updated on an accepted move, so a chain that started
    feasible and never improved reported that no feasible configuration was found.
  consequence: >-
    In a basin-entry test, which starts at the answer by design, a perfect return scores
    as total failure. The whole measurement would have been an artifact -- a zero return
    rate that was really total.
  fix: 'The starting configuration is scored on entry to the anneal.'
  regression: 'the eps = 0 cell of the basin-entry sweep, whose answer is known in advance'
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-005-basin-entry-n11.md
- id: D-012
  title: A zero perturbation made the cooling schedule degenerate
  date: '2026-08-23'
  layer: engine
  class: robustness
  detected_by: control_cell
  latent_for: caught before the first recorded round of the experiment
  severity: medium
  status: fixed
  what: >-
    Tying the starting temperature to the perturbation size made it zero at eps = 0,
    which gives an infinite geometric cooling ratio and NaN for every subsequent move.
  consequence: 'The one cell whose answer is known in advance could not be run.'
  fix: 'Starting temperature floored at the final temperature.'
  regression: 'the eps = 0 cell is part of the standing sweep'
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-005-basin-entry-n11.md
- id: D-013
  title: An infeasible chain would have reported a perfect return
  date: '2026-08-23'
  layer: engine
  class: soundness
  direction: flattering
  detected_by: design
  latent_for: never reached data
  severity: high
  status: avoided
  what: >-
    A chain that never reaches feasibility keeps the seed as its stored best, so
    comparing that best to the seed shows zero deviation.
  consequence: >-
    A complete failure recorded as a perfect success, in the flattering direction, in
    the measurement the round existed to make.
  fix: 'Infeasible trials report null and are counted as non-returns.'
  regression: 'a feasible flag is carried on every trial record and checked at analysis'
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-005-basin-entry-n11.md
- id: D-014
  title: The LP solver returned a packing that violated its own constraints
  date: '2026-08-23'
  layer: quench
  class: soundness
  direction: flattering
  detected_by: pre_registered_rule
  latent_for: minutes
  severity: critical
  status: fixed
  what: >-
    HiGHS defaults to a primal feasibility tolerance of 1e-7, which is larger than the
    quantity being measured, so a solution could violate a separation constraint by up
    to that much and still be reported optimal. One did, by 9.876e-08 on pair (4,8).
  consequence: >-
    A claimed side of 3.877083568 against Trump's 3.877083590 -- a false claim of
    beating a 47-year-old record. Overlapping squares fit in a smaller box, so this
    class of error always flatters.
  fix: >-
    Tolerance pinned at the solver's floor of 1e-10, and every returned solution is
    post-checked against the constraints that were imposed on it.
  regression: 'the post-check runs on every solve; a violation rejects the solve rather than being reported'
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-006-lp-quench-n5-n10-n11.md
- id: D-015
  title: The angle objective was not a function of the angles
  date: '2026-08-23'
  layer: quench
  class: validity
  direction: neutral
  detected_by: anomaly
  latent_for: one round
  severity: high
  status: fixed
  what: >-
    Evaluating s(theta) required choosing which axis separates each pair, and that was
    read from whichever centres the caller happened to hold. The LP then moved the
    centres, so the value depended on the path taken to reach it.
  consequence: >-
    Every optimiser assumes its objective is a function of its argument. Golden section
    converged to the wrong tilt by 1.2e-02, and Powell and Nelder-Mead both did worse
    than plain descent -- the tell that the objective, not the optimiser, was at fault.
  fix: 'Cell fixed-point iteration, and every evaluation re-solves from the same reference centres.'
  regression: none
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-006-lp-quench-n5-n10-n11.md
- id: D-016
  title: One variable served as both the finite-difference probe and the line-search step
  date: '2026-08-23'
  layer: quench
  class: validity
  direction: conservative
  detected_by: inspection
  latent_for: one round
  severity: medium
  status: fixed
  what: >-
    Every failed step halved both quantities, so once the probe fell below the LP's own
    precision the estimated gradient was noise and the search stopped on a spurious
    "no improving step".
  consequence: 'Answers 10-20x further from optimal than the method could actually reach.'
  fix: 'Separate fixed probe size; the line search resets each round.'
  regression: none
  recorded_in: campaign/series/series-000-smoke-and-calibration/experiments/exp-006-lp-quench-n5-n10-n11.md
- id: D-017
  title: A three-cell sweep recorded as a one-cell round, again
  date: '2026-08-23'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: one round
  severity: medium
  status: fixed
  recurrence_of: D-010
  what: >-
