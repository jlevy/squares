    compressed streams as text and `git diff --cached --check` emitted thousands of
    false trailing-whitespace diagnostics. The excluded hand-written reading aids also
    carried Markdown hard-break spaces that the same staged check correctly rejected.
  consequence: >-
    A faithful source archive could not pass the repository's precommit hygiene check.
    An agent could be tempted either to rewrite immutable PDF bytes or to bypass the
    staged-diff check, weakening both provenance and process discipline.
  fix: >-
