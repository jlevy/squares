  severity: medium
  status: contained
  what: >-
    A delegated audit was asked for read-only inspection while the parent phase excluded
    the strict/deep gate, but the task did not restate a command or wall-time ceiling.
    The reviewer launched ./test.sh --strict in an isolated temporary tree.
  consequence: >-
    The unauthorized branch consumed about two minutes and could have continued into
    the known n=4 blocker, recreating the unbounded delegated loop the campaign was
    designed to prevent. Its partial output could not count as merge evidence.
  fix: >-
    The coordinator identified process group 95566, sent TERM to that exact group,
    verified that no descendants remained, and discarded the partial result. Future
