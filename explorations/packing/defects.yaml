  date: '2026-08-23'
  layer: docs
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    The search-strategy corpus said the m by m grid is optimal for every n=m^2-3.
    Available proofs cover the finite cases m=3 through 7; n=61, 78 and 97 remain open
    in the repository. Nagamochi's general theorem covers m^2, m^2-1 and m^2-2, not this
    next family.
  consequence: >-
    Three live open questions were classified as solved and removed from the search and
    proof frontier.
  fix: >-
    The catalogue and generated views now scope the result to m=3 through 7 and identify
