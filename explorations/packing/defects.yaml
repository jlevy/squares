- id: D-132
  title: Fixed-cell iteration returns capped states without a settlement result
  date: '2026-08-24'
  layer: quench
  class: validity
  direction: flattering
  detected_by: review
  latent_for: since solve_to_fixed_point was introduced
  severity: high
  status: fixed
  what: >-
    `solve_to_fixed_point` returns the same untyped five-value tuple when a re-read cell
    is stable, when the next cell is infeasible or worse, and when its unexplained
    twelve-iteration cap expires. Downstream callers cannot tell whether the fixed-cell
    instrument actually settled before using its incumbent. The review also objected to
    exact equality over the cell's float fields; because `theta` is fixed inside this
    loop, the same discrete axis choices deterministically regenerate those fields, so
    no independent float-mismatch failure is established.
  consequence: >-
    A capped or rejected cell transition can feed the angle search and later receive an
    outer `converged: true` result. Basin and stationarity claims can therefore promote
    a configuration without evidence that their inner fixed-cell problem settled.
  fix: >-
    `solve_to_fixed_point` now returns a typed result with an explicit settled flag and
    reason for a fixed point, repeated-cell cycle, infeasible or worse transition, or
    iteration limit. Both angle-search variants refuse to report outer convergence from
    any unsettled evaluation. The cap remains a conservative resource stop, but it can
    no longer masquerade as mathematical settlement.
  regression: >-
    The historical regression suite exercises a known settled n=1 cell, an explicit
    zero-iteration cap, a mocked worse transition, and an outer quench fed an unsettled
    inner result; only the first may report settlement or convergence.
  bead: think-9qz0
  recorded_in: docs/project/reviews/review-2026-08-23-engineering-loops-and-efficiency.md
