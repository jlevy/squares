- id: D-164
  title: The fixed-cell solver mislabeled a numerical rejection as mathematical infeasibility
  date: '2026-08-24'
  layer: quench
  class: validity
  direction: conservative
  detected_by: control_cell
  latent_for: since solve_cell collapsed every failure to None
  severity: high
  status: fixed
  what: >-
    `solve_cell` returns the same `None` for a mathematically infeasible cell, a HiGHS
    failure, and a successful LP whose returned point fails the post-solve residual
    check. On the retained n=3 seed-1 calibration, HiGHS reports an optimum whose worst
    residual is 1.19996e-10; the 1e-10 post-check rejects it and the fixed-point layer
    reports `re-read cell infeasible`. With only the internal cutoff changed to 2e-10,
    the same start reaches the proved side 2 and reports a clean free pass.
  consequence: >-
    The calibration undercounts convergence and reports a numerical solver-boundary
    event as geometric evidence. More importantly, the loop cannot choose a principled
    retry, repair, or stop policy because the failure channel has erased its cause.
  fix: >-
    Return typed cell-solve outcomes for infeasibility, solver failure, post-check
    rejection, and accepted optima, retaining solver status, maximum residual, row index,
    row kind, and actual solver-call count. On a post-check rejection only, collect every
    row outside the unchanged 1e-10 screen, tighten each RHS by its measured violation
    plus that screen, and retry exactly once; replay the second result against every
    original row. The n=10 control uses 25 bounded retries, all accepted with worst final
    residual 1.55e-15, and reaches the proved side within 1.33e-15. An independent
    `sqpack.verify` screen accepts all 45 n=10 pairs with the identical required side.
    The retained n=3 seed-1 control reaches side 2.
  regression: >-
    The exact failing cell from n=3 seed 1 must replay its row-12 repair and side;
    synthetic post-check, infeasible, and solver-failure outcomes must remain distinct;
    a two-call repair must retain its complete row set and margins; and actual LP-call
    accounting includes the retry. A separately measured full n=3 seed-1 quench reaches
    side 2.
  recurrence_of: D-014
  bead: think-28x5
  recorded_in: golden/basin-maps.yaml
