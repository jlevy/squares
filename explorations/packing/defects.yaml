- id: D-124
  title: The portable negative-control fallback copied a needlessly broad repository surface
  date: '2026-08-24'
  layer: tooling
  class: performance
  detected_by: review
  latent_for: one stacked PR
  severity: medium
  status: fixed
  what: >-
    Private negative-control trees used cheap copy-on-write clones on APFS but fell back
    to unrestricted `cp -R` over the repository elsewhere. The fallback cost and disk
    multiplier were neither bounded nor measured.
  consequence: >-
    A fast local gate could become slow and disk-heavy in CI or on Linux, recreating the
    loop-cost problem the snapshot design was intended to remove.
