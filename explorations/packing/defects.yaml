  class: soundness
  direction: flattering
  detected_by: review
  latent_for: one committed but unexecuted candidate checker; caught before preregistration
  severity: high
  status: fixed
  what: >-
    The candidate exp-035 checker hand-wrote the active pair (0,4) differential once
    and reused it at endpoint A, the segment interior, and endpoint B. Rotating the
    owner axis differentiates the centre projection, whose coefficient changes with
    the slide parameter, so the advertised interior and endpoint-B witnesses were not
    checked against the true first-order row.
  consequence: >-
    Running the candidate as written would have recorded non-sheet tangent directions
    that do not satisfy the actual active contact system, falsely advancing the
    stationary-connectivity program.
  fix: >-
    Exp-035 derives every active contact row from the exact centre and orientation data
    separately at A, the interior, and B. Its corrected witnesses satisfy every exact
    row before a determination can be emitted.
  regression: >-
    The exact selftest reuses endpoint A's pair (0,4) coefficient at the interior and
    requires it to differ from the regenerated row and fail on the interior witness.
  bead: think-5hh9
  recorded_in: cases/n5/tangent_cones.py
- id: D-195
  title: The n=5 tangent checker treated tied support inequalities as alternatives
  date: '2026-08-24'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  latent_for: one committed but unexecuted candidate checker; caught before preregistration
  severity: high
  status: fixed
  what: >-
    For pair (3,4), the candidate checker modeled each tied support-feature derivative
    as its own SAT branch. For one chosen owner axis the support function is a maximum,
    so both tied feature inequalities must hold together; only the owner-axis choice is
    disjunctive.
  consequence: >-
    Treating a conjunction as a union enlarges the linearized feasible set and can
    accept a direction that violates one of the two one-sided support derivatives.
  fix: >-
    Retain two owner-axis branches, each containing both tied support rows, derive them
    exactly, and reject a record that drops either row. Exp-035 generation and replay
    now enforce this structure at all three strata.
  regression: >-
    The selftest removes one tied support row, coherently updates the redundant count
    and matrix digest, and requires semantic validation to reject the incomplete cone.
  bead: think-s41l
  recorded_in: cases/n5/tangent_cones.py
