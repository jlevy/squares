- id: D-063
  title: A non-converse was called the contrapositive of the rigidity premise
  date: '2026-08-23'
  layer: docs
  class: soundness
  direction: neutral
  detected_by: inspection
  severity: medium
  status: fixed
  what: >-
    The strategy board called the possibility that non-record optima are non-rigid the
    contrapositive of the claim that records are rigid. It is not: record implies rigid
