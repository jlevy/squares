- id: D-136
  title: A branch linearization was mislabeled as the true Bouligand tangent
  date: '2026-08-24'
  layer: record
  class: soundness
  direction: flattering
  detected_by: review
  latent_for: one preregistration checkpoint
  severity: high
  status: fixed
  what: >-
    H-026 and the claimed exp-013 described each one-sided branch linearization as a
    Bouligand tangent cone and said any nonzero vector would be a feasible first-order
    motion. The linearized cone is only an outer approximation to the true tangent.
  consequence: >-
    A nonzero algebraic vector could have been promoted as a structural flex even when
    no nonlinear feasible path realizes it. The opposite verdict is asymmetric: if
    every complete branch linearization is zero, then the true tangent is necessarily
    zero as well.
  fix: >-
    Recast H-026, exp-013, the session, checker, synopsis, and strategy review in terms
    of branchwise one-sided linearized cones. A nonzero vector now routes to nonlinear
    continuation; a zero union may support a separately stated finite-branch local-
    isolation argument. Orientations use open real charts rather than folded angle
    representatives.
  regression: >-
    The terminal artifact must retain the asymmetric interpretation beside its verdict,
    and the checker records the linearized-versus-true-tangent scope in its raw result.
  bead: think-4oos
  recorded_in: campaign/hypotheses/H-026-trump-first-order-rigidity.md
