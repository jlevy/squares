- id: D-029
  title: A single fixed-angle LP solve was called "the quench", and retracted a correct finding
  date: '2026-08-23'
  layer: quench
  class: validity
  direction: conservative
  detected_by: review
  recurrence_of: D-023
  latent_for: 'one round of analysis, on a side branch'
  severity: medium
  status: fixed
  what: >-
    Checking exp-001's claim that `n = 10` was a polish failure and `n = 11` an
    exploration failure, an agent built a probe that did one LP solve at fixed angles
    and called it "the quench". A quench is three things - solve the cell, re-read the
    cell to a fixed point, and refine the angles - and the probe was the first only. It
    did not reach the analytic optimum at `n = 10`, which was read as "wrong basin", and
    exp-001's reading was reported refuted.
  consequence: >-
    A correct finding was retracted. The most persuasive evidence was the most
    misleading: seeds whose value barely moved under the partial quench were read as
    "converged, therefore stuck", when a configuration already at its cell's optimum and
    still far from its basin's is exactly what the RIGHT basin looks like when the
    residual is angular. exp-001's reading stands, and agrees with exp-008 and exp-009,
    which had established it from the other direction.
  fix: >-
    Re-run on the identical archived configurations from exp-002, seed 2: as-found
    +5.6440e-04; a fixed-angle solve carried to its cell fixed point +5.6440e-04, an
    improvement of exactly nothing; `quench_bracket`, which includes the angle half,
    +4.4409e-16. SYNOPSIS.md now states next to T-2 that a cell is a slice at frozen
    angles and a basin is not, and that the cell solve alone is not a quench.

    Reproduction note: seeds 1-3 and 5 reproduce the side-branch figures to the digit;
    seed 4 landed at +6.5983e-05 against its +6.5775e-05, a difference well above the
    tier floor and dependent on the wall budget the angle search is given.
  regression: >-
    tools/regression_test.py, labelled D-029: a fixed-angle solve on exp-002 seed 2 must
    NOT approach the analytic optimum, and quench_bracket on the same input must reach
    1e-12. A probe that froze the angles and claimed to be a quench would fail it.
  recorded_in: docs/project/research/research-2026-08-23-search-philosophy-and-landscape-cartography.md

- id: D-030
  title: The angle window narrowed on a schedule, so a cold quench could never arrive
  date: '2026-08-23'
  layer: quench
  class: validity
  direction: flattering
  detected_by: control_cell
  severity: high
  status: fixed
  what: >-
    `quench_bracket` narrowed its angle search window unconditionally at the end of every
    sweep (`span = max(span * 0.5, 1e-9)`), and `_bracket_min` may only move an angle
    within `+-span`. From annealer output that is right: the angles arrive nearly correct
    and want small corrections. From a cold start they must move O(0.1) rad, and by sweep
    12 the window was already 2.4e-05. The search descended until the window ran out and
    then crawled - improving by about 1e-09 a sweep, forever above the 1e-12 improvement
    threshold, so `converged` never became true and `max_sweeps: 12` was reached every
    time. More budget did not help: 12, 40, 120 and 400 sweeps gave 3.078187, 3.078175,
    3.078175 and 3.078174, still descending, against the proved s(5) = 2.707107.
  consequence: >-
    The direction is flattering, which is the dangerous one. A census built on this reads
    every interrupted descent as a distinct basin: measured at n = 5, 11 of 12 uniform
    multistarts hit the sweep limit and the atlas recorded twelve stopping points as
    twelve distinct basins, every structural invariant passing green. The resulting
    discovery curve never plateaus, which presents as "the landscape is enormous" rather
    than "the instrument stopped early" - and H-011's saturation criterion, H-012's
    basin-rarity ranking and every basin statistic downstream would have inherited it.
  fix: >-
    The window now narrows only when a sweep FAILS to improve, which is the standard
    pattern-search rule and gives the schedule a reason rather than a cadence. Measured
    over six cold n = 5 starts and the polish case: unconditional halving converged 0 of
    8 and reached 3.048; adaptive narrowing at the same starting window converged 8 of 8
    and reached 2.707106781187, the proved optimum exactly. A LARGER starting window was
    tried and is worse (2.768), so the schedule was the whole defect and the default
    window is unchanged. The narrowing factor is 0.1 rather than 0.5, also measured:
    halving needs 26 narrowing sweeps to reach the floor and can exhaust the wall budget
    before the free-sweep certificate is reached, converging 5 of 6 where 0.1 converges
    6 of 6, at half the wall time and identical accuracy.
  regression: >-
    tools/atlas_check.py, labelled as the convergence guard: a census whose quenches
    mostly failed to converge is refused, measured on the census only rather than after
    the deduplication step. The six structural invariants around it all passed while this
    was live, so the guard is the one that had to exist. Also negative-controlled.
  recorded_in: docs/project/specs/active/plan-2026-08-23-overnight-cartography-run.md
- id: D-031
  title: Basin identity split an angle at the pi/2 seam, inflating counts near axis-aligned optima
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: control_cell
  latent_for: >-
    the life of one branch -- introduced with sqpack/canonical.py and found by the first
    golden run against it, before any recorded round consumed a basin count
  severity: high
  status: fixed
  what: >-
    The geometric key quantized an angle with plain `round(theta / quantum)`, which
    treats the angle as a point on a line. It is a point on a circle: a unit square is
    invariant under a quarter turn, so theta is periodic with period pi/2 and the
    quantizer had a seam at the wrap-around. An axis-aligned square whose angle floated
    one ULP BELOW pi/2 keyed as step 1570796; its identical twin at 0.0 keyed as 0, and
    the two configurations -- the same packing, square for square -- were stored as two
    distinct basins.
  consequence: >-
    Every basin count near an axis-aligned optimum was inflated, and the annealer makes
    that the common case rather than a corner one, because it accumulates rotations
    without wrapping them. The direction is flattering twice over: a split landscape
    reads as richer than it is, and splitting the basin a record lives in makes that
    basin look rarer -- which is the direction that CONFIRMS the cartography strategy's
    rarity premise. H-011's saturation criterion and H-012's rarity ranking would both
    have inherited it, and the contact certificate could not have caught it, because two
    images of one packing have identical contact graphs.
  fix: >-
    `_quantize_angle` now quantizes on the circle: `steps = round(QUARTER / quantum)`,
    then `round(theta / QUARTER * steps) % steps`, so the step index wraps where the
    angle does. Measured at n = 3: four proposals had produced four basins, two of them
    the same three-in-a-2x2 packing at 0 and at 90 degrees, with identical side, closed
    form, contact count and angle classes; after the fix, three basins, and the repeated
    one carries quench_frequency 2. Deliberately no `theta % QUARTER` in front of the
    arithmetic -- an earlier one was dead code, and a negative control mutating it went
    on reporting a guard that no longer guarded anything.
  regression: >-
    tools/canonical_check.py, "an angle one ULP below pi/2 keys as one at zero": the
    defect's own witness, `math.nextafter(math.pi / 2, 0)` against `0.0`, asserted to
    give one geometric key. Wired into the gate. The n = 3 row of golden/basin-maps.yaml
    is the second guard, and the one that found it: a trivial case whose basin count can
    be checked by hand.
  recorded_in: docs/project/specs/active/plan-2026-08-23-overnight-cartography-run.md
- id: D-032
  title: The in-progress stub was not schema-valid, so the recovery path corrupted the record
  date: '2026-08-23'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: >-
    one merged PR -- #13 shipped with `release` and `run` never once executed, and the
    bug was found by deciding to run the paths that had never run
  severity: high
  status: fixed
  what: >-
    `runner.py claim` wrote an in-progress stub carrying no `subject.engine`, which the
    round contract requires. `release` then did string surgery on that YAML to mark the
    round unresolved, so it produced an artifact the whole-set checker rejected.
  consequence: >-
    `release` is the recovery path: the step that runs when a round dies at 3am. A
    recovery path that corrupts the record is worst exactly when it is needed, and the
    night it is needed is the night nobody is reading. The failure was also silent until
    the next full check, so a session could have released several rounds before anything
    complained.
  fix: >-
    The stub carries `subject.engine`. `release` parses and re-serialises rather than
    editing YAML as text, and adds the `effort` block every terminal round must carry,
    with `stopped_by: error` -- the round died, so nothing may be concluded from it.
    `claim` now regenerates the generated views too, because an in-progress round is part
    of the record the moment it exists and a round runs for hours; without that the gate
    failed on a stale ledger.md for the whole session.
    The fix is real but UNGUARDED, and the regression field says so. ledger.py validating
    every artifact at load time (the D-005 guard) does reject an invalid stub -- but only
    during a gate run that happens to coincide with a round in flight, which is luck. The
    honest reading is that nothing exercises claim -> ledger -> release -> ledger, so this
    path can rot again between nights exactly as it rotted through PR #13.
  regression: none
  bead: think-5zwm
  recorded_in: docs/project/specs/active/plan-2026-08-23-overnight-cartography-run.md
- id: D-033
  title: The ledger crashed on any in-progress round, so the gate could not run during a session
  date: '2026-08-23'
  layer: record
  class: robustness
  detected_by: review
  latent_for: >-
    one merged PR, alongside D-032 and in the same stub -- both found by running the
    unrun paths rather than by any check
  severity: high
  status: fixed
  what: >-
    The in-progress stub writes a timezone-aware lease timestamp; ledger.py compared it
    against a naive UTC now(). Python refuses to order aware against naive, so the
    comparison raised TypeError and ledger.py died on any record containing an
    in-progress round.
  consequence: >-
    The gate runs ledger.py, so the gate could not be run at all while a round was in
    flight -- which during an unattended night is most of the night. The one window where
    an operator most wants to ask "is the record still sound" is precisely the window the
    question could not be asked in, and the crash gives no hint that a lease is the cause.
  fix: >-
    Both sides normalised to aware UTC at the comparison. Same unguarded status as D-032
    and for the same reason: the only thing that exercises it is a gate run that happens
    to coincide with an in-progress round.
  regression: none
  bead: think-5zwm
  recorded_in: docs/project/specs/active/plan-2026-08-23-overnight-cartography-run.md
- id: D-034
  title: Endpoint identity assumes isolated terminals and splits a connected optimum family
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: control_cell
  latent_for: >-
    since sqpack/canonical.py was written -- found by reading the n = 5 golden census,
    which is the campaign's first census cell, and before any census was recorded
  severity: high
  status: outstanding
  what: >-
    The exact n = 3 side-2 family with centres `(1/2,1/2)`, `(3/2,1/2)`, and
    `(t,3/2)` for `t in [1/2,3/2]` has one contact certificate but many geometric keys;
    `Atlas.add` requires both hashes to agree and therefore splits one connected optimum
    family into quantization-dependent rows. At n = 5, two rows also share side
    2.767766952966, short form, contact certificate, angle signature, and contact count
    while differing geometrically. That makes their identity unresolved, but does not by
    itself prove they lie in the same connected component or establish its dimension.
  consequence: >-
    `distinct_basins` is an endpoint-key count whose value changes with geometric
    quantum on a proved control. A discovery curve can therefore fail to plateau because
    it samples a terminal family, and H-012's rarity ratio inherits an arbitrary split.
    The error is flattering in both directions: the landscape reads as richer and an
    isolated record component can look rarer against an inflated denominator.
  fix: >-
    none yet. Detect active-constraint rank deficiency, continue every null direction,
    and define the counted object as an isolated endpoint or connected terminal
    component under a fully specified quench and quotient. Contact/side agreement alone
    may merge distinct components, while exact two-hash agreement splits the n = 3
    family. Reconcile think-1s0h with the more explicit acceptance test on think-0yo9.
  regression: none
  bead: think-1s0h
  recorded_in: docs/project/specs/active/plan-2026-08-23-overnight-cartography-run.md
- id: D-035
  title: An interrupted negative-control run leaves its deliberate sabotage in the working tree
  date: '2026-08-23'
  layer: tooling
  class: robustness
  detected_by: anomaly
  latent_for: >-
    since negctl was built (D-023) -- hit for the first time on 2026-08-23, when a gate
    run was interrupted mid-suite
  severity: high
  status: outstanding
  what: >-
    tools/negctl.py tests a guard by corrupting a tracked source file in place, running
    the check, asserting it fails, and restoring the bytes in a `finally:` block.
    `finally` covers exceptions; it does not cover SIGKILL, a killed process group, an
    OOM, or a harness cancelling the tool call. A `./test.sh` interrupted during the
    negative-controls step left the D-031 seam mutation in place -- `% steps` stripped
    from `_quantize_angle` -- and the next gate run reported
    `FAIL an angle one ULP below pi/2 keys as one at zero`, which reads exactly like a
    regression in the code under test rather than like a dirty tree.
  consequence: >-
    The residue is the most dangerous possible thing to leave behind, because negative
    controls are DESIGNED to be subtle and to point in the flattering direction: what
    was sitting in the tree was precisely the basin-splitting bug the project had just
    spent a day finding. `git add -A && git commit` would have committed it. An
    unattended session that commits on a cadence therefore has a live path to shipping a
    deliberate sabotage of basin identity behind a green-looking history, and the
    misleading failure message costs an investigation on top.
  fix: >-
    none yet. Written up on think-97pp: a marker file recording the target, its checksum
    and the control before mutating, restored-from and refused-on at startup (the
    `.gate-running` pattern already in this repo); SIGINT and SIGTERM handlers as a
    courtesy on top of it; the gate refusing to start while the marker exists; and
    runner.py refusing to stage a file the marker names. The stronger fix is to mutate a
    COPY and point the check at it, which removes the hazard rather than detecting it --
    constrained by the rule that a check must import the real module rather than a
    pasted copy.
  regression: none
  bead: think-97pp
  recorded_in: docs/project/specs/active/plan-2026-08-23-overnight-cartography-run.md
- id: D-036
  title: A timed-out free sweep was reported as a convergence certificate
  date: '2026-08-23'
  layer: quench
  class: validity
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    `_free_sweep` stopped iterating when its deadline expired and returned the same
    five-field tuple it returned after checking every angle. `quench_bracket` therefore
    had no completion bit to inspect and could label an incomplete pass `converged=True`
    with reason `free pass clean`. The probes inside `_free_sweep` did not check the
    deadline at all, so one line search could also overrun the declared wall budget.
  consequence: >-
    A budget-censored endpoint could enter the atlas as a coordinate-wise stationary
    basin. This points in the flattering direction: the stopping condition reads as a
    mathematical property of the endpoint when it is only a property of the clock.
    Any basin frequency, golden map, or local-optimum claim downstream could inherit the
    false status.
  fix: >-
    `_free_sweep` now raises `_OutOfTimeError` before every coordinate and inside every
    line-search probe, and checks the deadline again after the final LP solve. The caller
    converts that signal to `converged=False` with an explicit time-budget reason; only a
    pass that examined every coordinate can reach `free pass clean`.
  regression: >-
    tools/regression_test.py, labelled D-036: a free sweep handed an already-expired
    deadline must raise the timeout signal rather than return a completion-shaped tuple.
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-037
  title: The atlas checker reported its own synthetic re-offers as census proposals
  date: '2026-08-23'
  layer: tooling
  class: bookkeeping
  detected_by: review
  severity: low
  status: fixed
  what: >-
    At PR #14 head 5b1ae65, `tools/atlas_check.py` correctly captured the six-proposal
    census before exercising deduplication, but its final human-readable summary used
    `atlas.proposals` after the checker had re-offered every known basin. A six-proposal
    census was therefore printed as ten proposals even though the convergence guard used
    the right denominator.
  consequence: >-
    The assertions were sound, but the line a reader would copy into a report mixed
    scientific observations with test bookkeeping. Basin frequencies and proposal counts
    are meaningful only for the actual proposer run.
  fix: >-
    The stacked review first made the summary use the captured census counts. PR #14
    subsequently replaced the expensive census in this structural checker with one real
    smoke quench plus synthetic offers, removing the misleading summary entirely.
  regression: >-
    tools/atlas_check.py keeps real-quench output separate from synthetic offer counts;
    the strict gate runs the checker.
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-038
  title: Closed-form recognition was documented as a local-optimum oracle
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    `sqpack.closed_form` described matching a polished side to one of a short list of
    known constants as an oracle that said whether a quench had converged to a known
    optimum. It also justified a 1e-12 match by multiplying an optimizer's tolerance by
    an assumed uniform random-coincidence probability. Optimizer outputs are correlated,
    concentrated near known values, and selected after optimization; equality of one
    scalar says nothing about validity, stationarity, pose identity, or optimality.
  consequence: >-
    A censored, invalid, or distinct endpoint near a known side could acquire an
    oracle-shaped label and be promoted as a known local optimum. The false probability
    calculation made that promotion look statistically protected when it was not.
  fix: >-
    The module and atlas documentation now call the result a closed-form recognition
    heuristic for a scalar side. Convergence, validity, endpoint/component identity, and
    exact certification remain independent fields and checks.
  regression: none
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-039
  title: A scalar side-error floor was treated as a basin-resolution theorem
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: outstanding
  what: >-
    D-021 measures roughly 1e-11 variation in the optimized container side. The basin
    prose generalized that one-dimensional error bound into the claim that terminal
    objects farther apart were distinguishable and closer ones were not. The atlas key
    actually uses pose coordinates at a 1e-6 quantum, contacts at a 1e-9 tolerance, and
    no calibrated component-distance statistic. Equal sides may describe distinct
    components, while one connected component may contain poses arbitrarily far apart.
  consequence: >-
    Basin merges and splits could be justified by a tolerance that governs neither pose
    identity nor connectivity. Counts, discovery curves, and rarity ratios could then
    appear resolved to eleven decimal places without any corresponding identity result.
  fix: >-
    none yet. Calibrate pose, contact, active-set, and continuation stability separately;
    report lower and upper component-count bounds until an equivalence or ambiguity
    relation is validated. D-021 remains only a side-value floor.
  regression: none
  bead: think-3szr
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-040
  title: Basin rarity was reported without a proposer-conditioned estimand or durable sample
  date: '2026-08-23'
  layer: record
  class: validity
  direction: flattering
  detected_by: review
  severity: high
  status: outstanding
  what: >-
    The PR description interpreted a 12-start n = 5 multistart tally as evidence about
    record-basin rarity, but the result is not preserved as a replayable round at the
    merged head and the counted object is unresolved. More fundamentally, a basin hit
    probability is conditional on a proposer distribution P, deterministic quench Q,
    and terminal equivalence E. The raw-coordinate proposer also samples infeasible
    starts from an arbitrary initial-side box, so it is one named baseline rather than a
    canonical uniform null.
  consequence: >-
    A small, method-specific tally could be generalized into an intrinsic landscape
    property and used to abandon throughput or rank strategies. Even the quoted 1/12
    versus 4/12 split has wide binomial uncertainty and does not satisfy H-012's stated
    ratio threshold.
  fix: >-
    none yet. Preserve every observation with P/Q/E, seed, budget, pose, censoring, and
    regime digest; compare several named proposers at equal pair-test budgets; and report
    confidence intervals or predeclared sequential bounds rather than point ratios.
  regression: none
  bead: think-apwt
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-041
  title: Raw contact counts and a one-dimensional kink were used as rigidity and dimension proofs
  date: '2026-08-23'
  layer: docs
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: outstanding
  what: >-
    The merged documentation subtracted 11 reported contacts from 16 coordinates and
    declared the n = 5 optimum a connected five-dimensional family. Elsewhere it called
    Trump's n = 11 packing rigid because a class-angle slice has a kink and the contact
    picture looks pinned. Raw constraints may be dependent or encode different numbers
    of scalar equations; a one-dimensional slice does not rule out motions in the other
    coordinates; and matching side/contact summaries do not prove path connectivity.
  consequence: >-
    Unproved isolation and dimension claims were used to explain search difficulty and
    to choose the object an atlas should count. This makes the cartography premise look
    settled and can send implementation toward the wrong quotient or continuation
    model.
  fix: >-
    The rank-free claims are removed from the living docs. The underlying questions stay
    open: compute fixed-cell active-matrix rank, the full pose-and-angle Jacobian after
    quotienting symmetries, feasible null directions, and validated continuation across
    active-set changes before asserting rigidity, dimension, or connectivity.
  regression: none
  bead: think-1s0h
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-042
  title: An open n = 12 case was used as a known-answer negative control
  date: '2026-08-23'
  layer: record
  class: validity
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    Campaign schemas, runbooks, and rounds label n = 12 as a negative control whose
    correct outcome is failure to beat the 4 by 4 grid. But s(12) = 4 is not proved and
    the project's own frontier treats improving either bound at n = 12 as an open
    research target. Failure to improve an unproved incumbent is not a known-answer
    outcome.
  consequence: >-
    A weak proposer can pass the alleged guard precisely by finding nothing, so the
    control flatters the instrument and rejects a genuine improvement as a supposed
    breach. Any round accepted because n = 12 behaved this way lacks the claimed
    negative-control evidence.
  fix: >-
    n = 12 is now an open-case calibration in the schema, round, runbook, synopsis and
    series docs. campaign/ledger.py resolves every positive- or negative-control n
    against the frontier corpus and refuses the role unless that instance is proved.
    Deliberately invalid geometry fixtures remain the negative behavior check.
