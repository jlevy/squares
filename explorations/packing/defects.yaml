- id: D-046
  title: The unattended runner is not a closed, checked state machine
  date: '2026-08-23'
  layer: record
  class: robustness
  detected_by: review
  severity: critical
  status: outstanding
  what: >-
    Queueing ignores prerequisites; execute and record do not require an in-progress
    state; one deadline is shared across cells and may exceed the lease or session;
    process and persistence failures escape the failure policy; git return codes are
    discarded; broad campaign staging and --no-verify can still return success after a
    failed commit; release is not durably persisted; and lease offsets are stripped
    rather than converted to UTC.
  consequence: >-
    Work can run out of order, terminal rounds can be rewritten, leases can be judged
    against the wrong time, and a scientific success can be reported without durable
    persistence. These failures are worst during unattended operation.
  fix: >-
    none yet. Encode and enforce every transition, prerequisite, lease and deadline;
