collections:
  - pattern: frontier/n-*.md
    role: frontier-case
    authority: definitive
    lifecycle: maintained
    contract: packing.squares:SquarePackingCase/v2
    schema: frontier/square-packing-case.schema.yaml
  - pattern: campaign/hypotheses/H-*.md
    role: hypothesis-record
    authority: definitive
    lifecycle: maintained
    contract: packing.squares:Hypothesis/v1
    schema: campaign/schemas/hypothesis.schema.yaml
  - pattern: campaign/series/*/experiments/exp-*.md
    role: experiment-record
    authority: record
    lifecycle: retained
    contract: packing.squares:Experiment/v2
    schema: campaign/schemas/experiment.schema.yaml
  - pattern: campaign/agent-sessions/session-*.md
    role: session-record
    authority: record
    lifecycle: retained
    contract: packing.squares:AgentSession/v2
    schema: campaign/schemas/agent-session.schema.yaml
  - pattern: campaign/research-loop-logbook/run-*.md
    role: research-loop-run-record
    authority: record
    lifecycle: retained
    contract: packing.squares:ResearchLoopLogEntry/v1
    schema: campaign/schemas/research-loop-log-entry.schema.yaml
  - pattern: campaign/agendas/agenda-*.md
    role: agenda
    authority: current
    lifecycle: maintained
    contract: packing.squares:ExperimentAgenda/v1
    schema: campaign/schemas/agenda.schema.yaml
  - pattern: campaign/explorations/X-*.md
    role: exploration-report
    authority: record
    lifecycle: retained
    contract: packing.squares:Exploration/v1
    schema: campaign/schemas/exploration.schema.yaml
exclusions:
  - pattern: resources/papers/**/*.md
    reason: Source-faithful transcriptions and raw extraction are governed by resources/README.md.
  - pattern: resources/web/**/*.md
    reason: Retained first-party and web-source content is archival evidence, not project prose.
