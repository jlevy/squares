golden:
  note: Rebuilt by tools/golden_basins.py. Sides to 12 decimals, which is above the polished tier's 1e-11
    floor (D-021).
  how_to_read_a_basin_row: 'A row is an ESTABLISHED optimum when converged_frequency > 0 and closed_form
    is non-null. A row with converged_frequency 0, or with no closed form and a low contact count, is
    more likely an interrupted descent than a local optimum -- see D-030, where exactly that confusion
    passed every structural check. distinct_basins counts ROWS, so it is an upper bound on the number
    of real basins, never a measurement of it. At small n the count is not even well-posed: at n = 3 the
    optimum has slack, so the optimal set is a continuum rather than isolated points, and what the quantizer
    reports there is a sample of that continuum.'
  side_decimals: 12
  convergence_ladder:
  - n: 1
    proved: '1'
    annealer_gap: 0.0
    after_quench: '1'
    gap: 0.0
    converged: true
    valid: true
  - n: 2
    proved: '2'
    annealer_gap: 0.0
    after_quench: '2'
    gap: 0.0
    converged: true
    valid: true
  - n: 3
    proved: '2'
    annealer_gap: 0.0
    after_quench: '2'
    gap: 0.0
    converged: true
    valid: true
  - n: 4
    proved: '2'
    annealer_gap: 0.0
    after_quench: '2'
    gap: 0.0
    converged: true
    valid: true
  - n: 5
    proved: 2 + (1/2)sqrt(2)
    annealer_gap: 2.355319e-06
    after_quench: "(4 + \u221A2)/2"
    gap: 8.882e-15
    converged: true
    valid: true
  - n: 9
    proved: '3'
    annealer_gap: 0.0
    after_quench: '3'
    gap: 0.0
    converged: true
    valid: true
  - n: 10
