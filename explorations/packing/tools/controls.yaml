# Negative controls: each one corrupts something and asserts the guard complains.
#
# Every entry here was run by hand at least once and then thrown away. Checked in, they
# become the answer to "how do you know that check works?" -- and they are the
# regression layer the defect log kept recording as absent.
#
# Run:  python3 tools/negctl.py tools/controls.yaml
controls:

# --- the defect log's own invariants (D-018's class of bookkeeping failure) ---
- name: defect log - open defect with no bead
  file: defects.yaml
  replace: ["  bead: think-hg3u\n", ""]
  run: python3 tools/validate_schemas.py
  expect: "without a bead"

- name: defect log - soundness defect with no direction
  file: defects.yaml
  replace: ["  class: soundness\n  direction: flattering\n  detected_by: pre_registered_rule",
            "  class: soundness\n  detected_by: pre_registered_rule"]
  run: python3 tools/validate_schemas.py
  expect: "soundness without a direction"

- name: defect log - narrative link pointing nowhere
  file: defects.yaml
  replace: ["  recorded_in: test.sh", "  recorded_in: no/such/file.md"]
  run: python3 tools/validate_schemas.py
  expect: "recorded_in does not exist"

- name: defect log - recurrence naming a defect that does not exist
  file: defects.yaml
  replace: ["  recurrence_of: D-010", "  recurrence_of: D-999"]
  run: python3 tools/validate_schemas.py
  expect: "recurrence_of unknown"

# The only control whose anchor tracks a live number, because the thing under test IS
# a number. It needs updating whenever a defect is added -- and that is fine: negctl
# requires the anchor to appear exactly once, so a stale one fails the suite by name
# rather than quietly testing nothing.
- name: defect log - count disagreeing with the list
  file: defects.yaml
  replace: ["count: 42", "count: 20"]
  run: python3 tools/validate_schemas.py
  expect: "count 20 != 42"

# The unprotected-fix count in SYNOPSIS.md. This claim -- the list that predicts what
# comes back -- was hand-written, and it drifted: the prose said six while the generated
# view said seven. That is D-028 recurring inside the document D-028 is about, which is
# why the count is now derived and why it gets a control.
- name: synopsis - unprotected-fix count drifting from the log
  file: defects.yaml
  replace: ["    to coincide with an in-progress round.\n  regression: none\n  bead: think-5zwm\n",
            "    to coincide with an in-progress round.\n  regression: 'a check that does not exist'\n  bead: think-5zwm\n"]
  run: uv run --frozen --quiet python tools/check_synopsis.py
  expect: "does not state the unprotected-fix count"

- name: gate - strict handover skips deep golden regeneration
  file: test.sh
  replace: ['[ "$STRICT" = "1" ] && DEEP=1', '[ "$STRICT" = "1" ] && DEEP=0']
  run: bash test.sh --strict
  expect: "strict mode did not enable deep regeneration"

- name: defect log - generated view left stale
  file: defects.yaml
  replace: ["  title: A restart cap made the declared move budget inert",
            "  title: A restart cap made the declared move budget inert, edited"]
  run: python3 tools/render_defects.py --check
  expect: "defects.md is stale"

# --- the experiment record (D-005, D-018) ---
- name: campaign - artifact violating its declared schema
  file: campaign/hypotheses/H-016-stock-annealer-reaches-standing-best.md
  replace: ["  priority: 3", "  priority: 0"]
  run: python3 campaign/ledger.py --check
  expect: "schema violation"

- name: campaign - one round naming two hypotheses
  file: campaign/series/series-000-smoke-and-calibration/experiments/exp-010-angle-kink-n11.md
  replace: ["  hypotheses: [H-019]", "  hypotheses: [H-019, H-002]"]
  run: python3 campaign/ledger.py --check
  expect: "is too long"

- name: campaign - terminal round with no effort block
  file: campaign/series/series-000-smoke-and-calibration/experiments/exp-004-baseline-n12-negative-control.md
  replace: ["  effort:\n    wall_seconds: 108.8\n    stopped_by: criterion\n", ""]
  run: python3 campaign/ledger.py --check
  expect: "terminal round without an effort block"

- name: campaign - stopped on the clock without saying where to resume
  file: campaign/series/series-000-smoke-and-calibration/experiments/exp-004-baseline-n12-negative-control.md
  replace: ["    stopped_by: criterion", "    stopped_by: timebox"]
  run: python3 campaign/ledger.py --check
  expect: "without verdict.resume_from"

- name: campaign - exhausted verdict with no reopen condition
  file: campaign/series/series-000-smoke-and-calibration/experiments/exp-004-baseline-n12-negative-control.md
  replace: ["    decision: accepted", "    decision: exhausted"]
  run: python3 campaign/ledger.py --check
  expect: "exhausted without reopen_when"

- name: campaign - hypothesis on the board but not in the registry
  file: campaign/ideas.md
  replace: ["[H-018](hypotheses/H-018-basin-entry.md) is the most informative cheap\nexperiment runnable today",
            "[H-777](hypotheses/H-777-nonexistent.md) is the most informative cheap\nexperiment runnable today"]
  run: python3 campaign/ledger.py --check
  expect: "which is not in the registry"

# --- the frontier corpus ---
- name: frontier - generated table drifting from its source
  file: frontier/n-011.md
  # Mutate a digit the table actually SHOWS. The rendered cell carries 8 significant
  # digits, so a change at the 14th is invisible to it and the check is right not to
  # fire -- which this control asserted the wrong way round on its first attempt.
  replace: ["    value: 3.87708359002281", "    value: 3.88708359002281"]
  run: python3 tools/render_tables.py --check
  expect: "STALE (re-run tools/render_tables.py)"

- name: frontier - numeric value and its display string disagreeing
  file: frontier/n-011.md
  replace: ["    value_str: '3.87708359002281'", "    value_str: '3.87708359002282'"]
  run: python3 tools/validate_schemas.py
  expect: "value_str disagrees with value"

- name: generated view left un-exempt from the Markdown formatter
  file: ../../.flowmarkignore
  replace: ["explorations/packing/defects.md\n", ""]
  run: python3 tools/check_generated_exempt.py
  expect: "generated views not exempt from the Markdown formatter"

# --- basin identity (the census cannot count what it cannot tell apart) ---
#
# Each of these breaks one invariance the key claims, and each is a way a census would
# fail silently rather than loudly: an inflated basin count, a curve that never
# saturates, a key that agrees with everything. Watched failing, not assumed.
- name: canonical - container symmetry not quotiented out
  file: sqpack/canonical.py
  replace: ["    for flip in (False, True):\n", "    for flip in (False,):\n"]
  run: uv run --frozen --quiet python tools/canonical_check.py
  expect: "FAIL  invariant under all 8 container symmetries"

- name: canonical - square relabelling changes the key
  file: sqpack/canonical.py
  replace: ["        squares = sorted(\n", "        squares = list(\n"]
  run: uv run --frozen --quiet python tools/canonical_check.py
  expect: "FAIL  invariant under square relabelling"

# The SEAM is the property only one thing guards: an angle one ULP below pi/2 must key
# as one at zero. The quantizer's trailing `% steps` is the whole of it, so this control
# reaches it and nothing else does.
#
# Three dead ends here, all worth not repeating: a `theta % QUARTER` inside the quantizer
# (redundant with the upstream fold, so mutating it changed nothing and the control
# silently stopped firing); perturbing the step COUNT (harmless -- scaling and modulo use
# the same number, so the seam closes for any integer); and trying to break quarter-turn
# invariance, which has two independent guards -- see below.
- name: canonical - the angle seam at pi/2 splits identical squares
  file: sqpack/canonical.py
  replace: ["    return round(theta / QUARTER * steps) % steps",
            "    return round(theta / QUARTER * steps)"]
  run: uv run --frozen --quiet python tools/canonical_check.py
  expect: "FAIL  an angle one ULP below pi/2 keys as one at zero"

# There is deliberately NO control for "invariant under a quarter turn of one square",
# and the reason is worth recording rather than leaving as a hole. That property has two
# independent guards -- `canonical_key` folds angles into [0, pi/2) on the way in, and
# the quantizer's `% steps` folds them again -- so breaking either one leaves the check
# passing. Measured both ways. A control needs a single mutation that reaches the
# property, and here none exists; the honest options are to record that or to weaken the
# code so a control can fire, and weakening working code to make a test look better is
# not a trade this directory makes.

- name: canonical - the contact certificate agrees with everything
  file: sqpack/canonical.py
  replace: ["    digest = _certificate([ranks[a] for a in initial], adjacency).encode()",
            "    digest = b'constant'"]
  run: uv run --frozen --quiet python tools/canonical_check.py
  expect: "FAIL  a different arrangement keys differently"
