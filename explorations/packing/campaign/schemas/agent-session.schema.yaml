# Contract for one outer autonomous-agent work session.
#
# This is deliberately not a scheduler and not an experiment artifact. A coding agent,
# native goal, external watchdog, or human may drive continuation; tbd owns the work
# queue, and experiment artifacts own mathematical measurements. This record is the
# portable handoff that says what was attempted, what came back, how long it took, and
# what should happen next.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:AgentSession/v2
title: Agent session
type: object
additionalProperties: false
required:
  - id
  - title
  - date
  - goal
  - entry_workflow
  - workflow_phases
  - primary_bead
  - status
  - budget
  - stop_conditions
  - progress
  - delegations
  - outputs
  - checks
  - stop_reason
  - next_action
properties:
  id:
    type: string
    pattern: "^session-[0-9]{3}$"
    description: Stable, sequential, and never reused.
  title: {type: string, minLength: 1}
  date: {type: string, description: ISO date on which the session started.}
  goal:
    type: string
    minLength: 1
    description: The measurable outcome this session is advancing.
  entry_workflow:
    enum:
      - research-pass
      - factual-review
      - insight-iteration
      - process-review
      - efficiency-loop
      - research-loop
      - general-improvement
    description: The workflow under which the session began; the first phase must agree.
  workflow_phases:
    type: array
    minItems: 1
    description: >-
      Ordered, contiguous phases. Start a new phase when the workflow or focus changes;
      the checker enforces explicit transitions and terminal state.
    items:
      type: object
      additionalProperties: false
      required:
        - workflow
        - focus
        - objective
        - status
        - entered_by
        - switch_reason
        - budget_minutes
        - outcome
        - evidence
        - stop_reason
        - next_action
      properties:
        workflow:
          enum:
            - research-pass
            - factual-review
            - insight-iteration
            - process-review
            - efficiency-loop
            - research-loop
            - general-improvement
        focus:
          enum: [correctness, process, insight, efficiency]
          description: The one quality dimension optimized in this phase.
        objective: {type: string, minLength: 1}
        status: {enum: [in_progress, completed, stopped]}
        entered_by:
          enum: [session_start, planned_checkpoint, evidence_checkpoint, user_request]
        switch_reason:
          type: [string, "null"]
          description: Null only for the first phase; later phases state why purpose or focus changed.
        budget_minutes:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Declared phase budget; null only when a migrated historical record lacks one.
        outcome: {type: string, minLength: 1}
        evidence:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        stop_reason:
          type: [string, "null"]
          description: Null while in progress; explicit when completed or stopped.
        next_action: {type: string, minLength: 1}
  primary_bead:
    type: string
    pattern: "^think-[a-z0-9]+$"
    description: The integration bead; delegated subtasks may have their own beads.
  status:
    enum: [in_progress, completed, stopped]
  budget:
    type: object
    additionalProperties: false
    required: [wall_minutes]
    properties:
      wall_minutes: {type: number, exclusiveMinimum: 0}
      max_cycles: {type: integer, minimum: 1}
      orientation_minutes:
        type: number
        exclusiveMinimum: 0
        description: Optional session-specific bound for choosing and declaring one slice.
      checkpoint_minutes:
        type: number
        exclusiveMinimum: 0
        description: Optional session-specific bound before concrete evidence must be preserved.
      slice_minutes:
        type: number
        exclusiveMinimum: 0
        description: Optional hard bound before the active slice must stop or be restated.
      finalization_minutes:
        type: number
        minimum: 0
        description: Optional wall-time reserve for reconciliation before the session deadline.
  stop_conditions:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  progress:
    type: object
    additionalProperties: false
    required: [metric, before, after]
    properties:
      metric: {type: string, minLength: 1}
      before: {type: string, minLength: 1}
      after: {type: string, minLength: 1}
  delegations:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - task
        - operator
        - status
        - outcome
        - evidence
        - files
        - checks
        - uncertainty
        - elapsed_seconds
        - elapsed_quality
        - next_action
      properties:
        task: {type: string, minLength: 1}
        operator: {type: string, minLength: 1}
        status: {enum: [queued, in_progress, completed, blocked, canceled]}
        outcome: {type: string, minLength: 1}
        evidence:
          type: array
          items: {type: string, minLength: 1}
        files:
          type: array
          items: {type: string, minLength: 1}
        checks:
          type: array
          items: {type: string, minLength: 1}
        uncertainty: {type: string, minLength: 1}
        elapsed_seconds:
          type: [number, "null"]
          minimum: 0
          description: Measured or explicitly approximate wall time; null when unavailable.
        elapsed_quality:
          enum: [platform_measured, operator_reported_approximate, unavailable]
          description: Makes timing precision explicit instead of giving estimates false precision.
        next_action: {type: string, minLength: 1}
  outputs:
    type: array
    items: {type: string, minLength: 1}
  checks:
    type: array
    items: {type: string, minLength: 1}
  stop_reason:
    type: [string, "null"]
    description: Null while in progress; explicit when completed or stopped.
  next_action:
    type: string
    minLength: 1
