# Contract for one outer autonomous-agent work session.
#
# This is deliberately not a scheduler and not an experiment artifact. The platform
# goal drives continuation, tbd owns the work queue, and experiment artifacts own
# mathematical measurements. This record is the small durable handoff that says what
# the parent delegated, what came back, how long it took, and what should happen next.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:AgentSession/v1
title: Agent session
type: object
additionalProperties: false
required:
  - id
  - title
  - date
  - goal
  - focus
  - primary_bead
  - status
  - budget
  - stop_conditions
  - progress
  - delegations
  - outputs
  - checks
  - stop_reason
  - next_action
properties:
  id:
    type: string
    pattern: "^session-[0-9]{3}$"
    description: Stable, sequential, and never reused.
  title: {type: string, minLength: 1}
  date: {type: string, description: ISO date on which the session started.}
  goal:
    type: string
    minLength: 1
    description: The measurable outcome this session is advancing.
  focus:
    enum: [correctness, process, insight, efficiency]
    description: The one primary operating dimension for this session.
  primary_bead:
    type: string
    pattern: "^think-[a-z0-9]+$"
    description: The integration bead; delegated subtasks may have their own beads.
  status:
    enum: [in_progress, completed, stopped]
  budget:
    type: object
    additionalProperties: false
    required: [wall_minutes]
    properties:
      wall_minutes: {type: number, exclusiveMinimum: 0}
      max_cycles: {type: integer, minimum: 1}
  stop_conditions:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  progress:
    type: object
    additionalProperties: false
    required: [metric, before, after]
    properties:
      metric: {type: string, minLength: 1}
      before: {type: string, minLength: 1}
      after: {type: string, minLength: 1}
  delegations:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - task
        - operator
        - status
        - outcome
        - evidence
        - files
        - checks
        - uncertainty
        - elapsed_seconds
        - elapsed_quality
        - next_action
      properties:
        task: {type: string, minLength: 1}
        operator: {type: string, minLength: 1}
        status: {enum: [queued, in_progress, completed, blocked, canceled]}
        outcome: {type: string, minLength: 1}
        evidence:
          type: array
          items: {type: string, minLength: 1}
        files:
          type: array
          items: {type: string, minLength: 1}
        checks:
          type: array
          items: {type: string, minLength: 1}
        uncertainty: {type: string, minLength: 1}
        elapsed_seconds:
          type: [number, "null"]
          minimum: 0
          description: Measured or explicitly approximate wall time; null when unavailable.
        elapsed_quality:
          enum: [platform_measured, operator_reported_approximate, unavailable]
          description: Makes timing precision explicit instead of giving estimates false precision.
        next_action: {type: string, minLength: 1}
  outputs:
    type: array
    items: {type: string, minLength: 1}
  checks:
    type: array
    items: {type: string, minLength: 1}
  stop_reason:
    type: [string, "null"]
    description: Null while in progress; explicit when completed or stopped.
  next_action:
    type: string
    minLength: 1
