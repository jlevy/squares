# Contract for one registry entry of the squares search loop.
#
# One artifact per claim. STATUS IS NOT A FIELD: it is generated from the experiments
# that reference this id, the same way the ledger is. A referenced id with no registry
# artifact fails the reference check.
#
# Copy into the campaign, replace packing.squares, set the `lane` and
# `criterion.shape` enums to the ones the campaign declared, and delete what it does
# not use.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:Hypothesis/v1
title: Hypothesis
type: object
additionalProperties: false
required: [id, kind, claim, registered]
properties:
  id:
    type: string
    pattern: "^H-[0-9]{3}$"
    description: Never reused; next free number.
  kind:
    enum: [hypothesis, open_question]
    description: >-
      An idea that cannot be stated so it could be wrong is an open_question, not a
      badly written hypothesis. Open questions stay visible in the ledger and are not
      counted as measurable queue items.
  claim:
    type: string
    minLength: 1
    description: Stated so it can be wrong.
  lane:
    enum: [search, proof]
    description: >-
      Which side of the problem the claim is about: finding a packing (an upper
      bound on s(n)) or proving a bound. This campaign runs the search lane; proof
      hypotheses may be registered and will read as blocked until an instrument
      for them exists.
  derived_from:
    type: array
    default: []
    items: {type: string, pattern: "^X-[0-9]{3}$"}
    description: Exploration report(s) this claim was compressed out of.
  strategy_refs:
    type: array
    default: []
    items: {type: string, pattern: "^(search|proof):[0-9]+$"}
    description: >-
      Ids into the existing strategy catalogues, as "search:12" or "proof:7",
      indexing ../../frontier/search-strategies.yaml and proof-strategies.yaml.
      This is what lets the ledger report coverage by family -- which whole classes
      of approach have never been aimed at s(n) is a more useful question than
      which individual ideas are open.
  criterion:
    type: object
    additionalProperties: false
    required: [shape, metric, direction]
    description: Required for kind=hypothesis; omitted for kind=open_question.
    properties:
      shape: {enum: [paired, conditions, record, determination]}
      metric: {type: string, description: The metric or question that would show it.}
      direction: {type: string, description: Predicted direction or outcome.}
      threshold:
        type: [number, string, "null"]
        description: Pre-registered magnitude, when the claim makes one.
  instrument:
    type: string
    description: >-
      What would measure this, by path or command. A hypothesis whose instrument does
      not exist yet is blocked, not measured badly.
  instrument_ready:
    type: boolean
    default: true
    description: >-
      False when the instrument named above does not exist yet. Drives the blocked
      status in the ledger, which is a fact rather than an inference from an empty
      field: a hypothesis whose instrument does not exist is blocked, not measured badly.
  regime:
    type: string
    description: Where the claim applies (platform, cache state, scale, precision).
  instance:
    type: object
    additionalProperties: false
    required: [axis, point]
    description: The point on the campaign's instance axis where this claim is made.
    properties:
      axis: {type: string}
      point: {type: [string, number]}
  sweep:
    type: object
    additionalProperties: false
    required: [axis, points]
    description: >-
      Cells this claim should eventually cover. Declaring them up front is what turns
      scattered runs into a sweep with visible holes; a claim confirmed on one cell is
      confirmed on that cell only.
    properties:
      axis: {type: string}
      points: {type: array, minItems: 1, items: {type: [string, number]}}
  priority:
    type: integer
    minimum: 1
    description: 1 = do next. The codifier's ranking, revisable at any re-screen.
  cost_estimate:
    type: string
    description: What one round is expected to consume (time, attempts, tokens).
  prereqs:
    type: array
    default: []
    items: {type: string}
    description: Hypotheses or instruments that must land before this is runnable.
  replication:
    type: boolean
    default: false
    description: >-
      May a second operator re-run the same cell? Default false, or an overnight fleet
      spends the night agreeing with itself.
  registered:
    type: string
    description: >-
      ISO date, or "retroactive" for rows converted from a pre-existing hand-maintained
      table. Retroactive rows may not be used to justify a non-default criterion.
  runner:
    type: object
    additionalProperties: false
    required: [command, cells, seeds, timebox]
    description: >-
      The machine-runnable form of `instrument`, and the field that makes a hypothesis
      eligible for unattended execution. `instrument` is prose for a human; this is what
      campaign/runner.py reads. A hypothesis WITHOUT this block is never run unattended -
      the runner reports it as needing an operator rather than guessing an invocation.
    properties:
      command:
        type: string
        minLength: 1
        description: >-
          The experiment, as a command run once per (cell, seed) from the exploration
          root, with `{n}` and `{seed}` substituted. This is the harness/experiment
          boundary: the harness runs this and reads a fixed contract out of what it
          prints, and it contains no knowledge of any particular experiment. Adding an
          experiment therefore never edits the runner - if it would, the contract is
          wrong and the contract is what to fix.

          The contract, enforced by the harness on every round: print JSON Lines to
          stdout; carry `best_side` on every result line; carry `overlap` (or
          `best_overlap`) on those same lines and have it be exactly 0; exit 0. The
          seed's result is the minimum `best_side` over its lines, which needs no
          agreement about which line is the summary.
      cells:
        type: array
        minItems: 1
        items: {type: integer}
        description: >-
          Instance points to run, each of which must appear in `sweep.points`. The runner
          refuses a cell outside the declared sweep rather than widening the instance
          axis, which the refusal list forbids.
      seeds:
        type: array
        minItems: 5
        items: {type: integer}
        description: >-
          At least five, because the accept rule's evidence clause requires five per cell
          and a recipe that cannot satisfy it should fail at read time rather than after
          three hours of compute.
      timebox:
        type: string
        pattern: '^[0-9]+(s|m|h)$'
        description: >-
          The give-up bound for one cell, declared before the round starts. Expiry is an
          outcome (`stopped_by: timebox`), not a failure, and the runner writes
          `resume_from` so the spent budget is not lost.
  notes: {type: string}
