  (325..1024); scanning the watched repositories above 1024 is R1's change, with the
  walk above 1024's name in WALKS (above=1024, through=None), Release.walk_above on each
  lifted release, CLAIM_MAP_WALKS/WALK_READ_AT_MAIN entries, and Barnett's repository in
  WATCHED_HOLDERS.\\n\\n2026-10-24 c-w7-1024: W7 is draft PR
  https://github.com/jlevy/squares/pull/793 at 6d44159fc (S2, project), every hosted
  check passed; records nothing.\\n\\n2026-10-24 coord-intake-1024 on W7's two stops (PR
