  means the publication has NO row (held_problems refuses a row at any held count;
  declared_rows skips held counts; held_sentence prints \\\"have no row by
  {answer}\\\"), while D2's answer makes a decided recipe a row. W7 therefore does not
  settle recipes through Held.answer: a recipe the walk records and does not hold is a
  declared row carrying its recipe, decided by devtools.construction_checker into
  receipts/recipe-decisions.json, and the RECIPE class holds only recipes the checker
  refuses (classical parents, think-zkxy; Fang composites). No frozen walk changes:
  every recipe in them stays held as written. If the coordinator wants the Held.answer
  form instead, that is a change to Held's meaning (an answer that settles a publication
  AS a row), which the plan should state.\\n- Fang composites: the plan says the checker
  \\\"refuses a Fang composite unless his table states the composite's parts\\\", but
  states no rule for deciding a composite whose parts are stated. W7 refuses every
  composite, naming unstated parts when the table states none; a composite rule needs
  its own decision.\\n- The summary README threshold is 400 walked counts
  (intake_ledger.SUMMARY_FROM): above every retained walk (the history walk walks 392
