  rule exists is the safe default; a bead holds the rule.\\n\\n2026-10-24 c-w7-1024, PR
  #793 round 1 (reviews A senior, B correctness, C security; one push). Fixed: A1 A2 A4
  A10 (plan and rule text: a decided recipe is a declared row, RECIPE holds refused
  recipes only; composites wait on think-tj3x; a deletion is no recipe row, D6 or
