  C's out-of-diff load_manifest note -> think-eyrn. Each new test fails with its fix
  mutated out (13 of 13). No record changes.\\n\\n2026-10-24 c-w7-1024: #793 round 1
  pushed as acb59dba11f98bf2b8331f00e6a7e32a9e8b7b1d (fixes c3bb93b47, 72e2eba50,
