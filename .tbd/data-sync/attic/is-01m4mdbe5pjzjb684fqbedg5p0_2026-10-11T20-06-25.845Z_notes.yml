lost_value: "\"2026-10-11: cloned https://github.com/evand/square-packing in full into
  attic/evand-square-packing at 060c1a1 (main's head, 'Merge PR #6 (wand125): ValidTilt7
  / Valid7 in the kernel'), 377 MB, gitignored; search/regularize holds REGULARIZE.md,
  atlas.py, census.py, gallery.py, lists/, lists.py, refresh.py, reg.py,
  register_cert.py, samepacking.py. An examination lane (stage: research, read-only on
  the checkout) is writing the assessment to the coordinator's scratch; it goes into the
  stacked regularization PR (think-ux1v).\\n\\n2026-10-11, done: the assessment is
  docs/project/research/research-2026-10-11-evand-regularization-assessment.md on branch
  claude/regularization-2026-10-11 (commits fe9b53478, 217e909d2; mapped as a research
  report), in draft PR https://github.com/jlevy/squares/pull/497. [Corrected 2026-10-11
  under PR #497 review A, A8: this note first cited commits 4d013a44d and 2d0ca55c3,
  which do not exist in the repository, and called the PR the start of the stacked
  regularization PR.] Upstream run only on n = 10, 26, 70 in a scratch replica with
  python -I; checkout unmodified. Findings: (1) the process is a translation-LP display
  regularizer over an 80-digit KKT point of min S under the detected contacts (reg.py
  regularize :1074-1142; atlas.py compute :42-71): free angles merged, groups merged by
  policy (free = LP feasibility at S*; conservative = plus the sampled path test; fewest
  = plus merging determined groups within 5 degrees), orientation refit to this
  project's atlas, whole-packing symmetry, straight chains and a coincidence MILP over
  an iterated translation LP at fixed angles and S* (HiGHS 1e-10), an 80-digit refine
  and min-gap verify. (2) The certificate is never at S*: write_cert scales by 1 + 1e-20
  about the origin and rounds up at 30 places, because both upstream checkers refuse
  touching squares; this project's routes accept a zero gap. (3) 'KKT local min' and
  'level 2 same packing' are numerical, not proofs. (4) numpy, scipy (HiGHS LP/MILP),
  mpmath are already locked here; MIT covers search/regularize and search/exact; the
  regularizer's inputs (batch/work/*.exact.txt) are not committed and are regenerated by
  exactsolve from batch/inputs (float64 reductions of this register's witnesses). (5)
  Cost over 1..324 about 3 to 4 CPU-hours, 1 to 1.5 h wall at 4 workers. (6) Upstream
  changes 147 records (30 rattlers only, 117 level 2) and re-orients 48, rotation groups
  2400 to 1172; regularize_axis_components/2 changes 68, all of which upstream also
  changes, and upstream also changes 72 of the project's 74 refused and 7 of its
  unchanged (40, 65, 82, 101, 122, 145, 308). Recommendation: extend, not replace: a
  second generator in the regularized layer with a per-view method, admitted on the same
  obligations (exact over Q on both maintained routes and the third route; identity
  measured by arrangement_gap; non-regression by witness_shades; labelled); upstream
  kept as a pinned read-only generator run from a replica tree, not
  vendored.\\n\\n2026-10-11, owner decision on PR #497's framing (review A, A2):
  \\\"Retitle as the assessment\\\". PR #497 is the assessment and plan only, retitled
  \\\"research: assess Evan Daniel's regularization and plan its adaptation to n =
  1..324 (think-kl2v)\\\", to merge as the planning layer after the owner's own review.
  The regularization itself (think-ux1v) lands later in its own pull requests. Review
  A's factual corrections are in the report: the 45-degree membership and the refused
  records' tilt split (43 all at 45 degrees, n = 51 over Q(sqrt 2) among them; 31 with
  another tilt; none axis-only; review A said 42/31/1, counting n = 51 as axis-only), n
  = 11's degree-8 exact field (T-060), and the appendix's 0.0057-degree turn, which is
  exactsolve.place_free's perturbation of two axis rattlers being undone. The
  cross-tabulation is now a tool, devtools/compare_evand_regularization.py. Tracked
  under think-btdj.\""
