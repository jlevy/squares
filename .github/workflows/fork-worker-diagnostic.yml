name: Linux fork-worker full-suite diagnostic

# A new workflow cannot receive workflow_dispatch until it exists on the default branch.
# A push to this scratch branch runs the normal hosted suite with instrumented cleanup.
"on":
  push:
    branches: [codex/think-glad-linux-diagnostic]

permissions:
  contents: read

env:
  PACKING_VALIDATION_ARTIFACT_DIR: ${{ github.workspace }}-validation-artifacts

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the exact diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the required pull-request behavioral lane
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --suite --jobs 1 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
