  # A pull request builds and checks the pages without deploying them, so a change that
  # breaks a render fails review rather than the next deploy. It has no `paths:` filter:
  # the `scope` job below decides, per page, from each builder's declared inputs, and
  # names each page it skips in a notice that says why. A filter here would be a third
  # hand-kept list of the same inputs, and a pull request it excluded would carry no
  # Certificate page checks at all, which a reader cannot tell from a missing run.
  pull_request:

permissions:
  contents: read

concurrency:
  group: certificate-page-${{ github.ref }}
  # A superseded pull-request build is cancelled; a deployment in flight on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job graph, and why it has this shape.
#
#   scope ─┬─ n11-threshold-bound-review ──────────────┤
#          ├─ n11-optimality-review ───────────────────┤
#          ├─ packing-methods ─────────────────────────┤
#          ├─ workbench ───────────────────────────────┐
#          ├─ overview ────────────────────────────────┤
#          ├─ prepare ─┬─ pdf ─────────────────────────┼─ publish ─┐
#          │           ├─ print-layout                 │           ├─ pages-required (gate + wall)
#          │           ├─ typography                   │           │
#          │           ├─ screen                       │           │
#          │           ├─ geometry                     │           │
#          │           └─ startup-timing (dispatch)    │           │
#          ├─ font-loading (ff, wk) ── wait artifact ──┤           │
#          └─ browser-geometry (ff, wk) ─ wait artifact┘           │
#                                                      └───────────┴─ deploy ─ verify-deployment
#
# A page `scope` leaves out has no job of its own: `scope` posts a notice naming it and
# the reason, and every job of that page is skipped.
#
# A pull request waits for its slowest job, so what sets its wall is the longest chain,
# and until 2026-09-15 that chain was `prepare` then one `build` job running about 300 s
# of Chromium checks one after another on a four-cpu runner: 472 s median on the
# workbench stack's pull requests, 381 s on pull requests into `main`, and 471 s on the
# push to `main` that merged the stack (run 35017781374). None of those checks reads
# another's result -- each loads the one prepared page -- so they are split into jobs
# balanced by their measured step times. Firefox and WebKit provisioning starts beside
# `prepare`, then joins it through a bounded, fail-closed artifact wait immediately
# before the page is read. The long pole therefore overlaps independent setup rather
# than serializing it. Every check that ran before still runs, on the same prepared
# artifact; nothing moved off the pull request (`OR-13`).
#
# The papers are served under `papers/`, each by its slug (`render_overview.PAPERS`),
# and a job, an output or an artifact that is one paper's carries that slug. The three
# n = 11 papers and the standalone `packing-methods` explainer each render into
# `site/papers/` on their own runner, where they are served, so every check reads the
# page at its published path and `publish` renames nothing.
jobs:
  # Which builds this change can affect: each paper, the workbench, and the site's own
  # pages (the overview at `/` and the pages beside it). A pull request that touches
  # none of their inputs does no browser work at
  # all, and a workbench-only change no longer pays for the explainer's checks (#178
  # did: ten workbench probe files, about 330 s of explainer Chromium).
  # `devtools.pages_scope` derives each half's inputs from the builder's own declaration
  # and from the tools the jobs below run; see its docstring for the rule and its tests
  # for the comparison.
  #
  # It sits on the critical path, so it checks out without `packing/resources` and
  # `packing/campaign` (523 MB of a 665 MB tree) and fetches no blob it does not read.
  # The depth of two is what makes the merge commit's first parent -- the base as GitHub
  # merged it -- available to diff against.
  scope:
    runs-on: ubuntu-latest
    outputs:
      n11_lower_bounds_explainer: ${{ steps.scope.outputs.n11_lower_bounds_explainer }}
      n11_lower_bounds_explainer_reason: ${{ steps.scope.outputs.n11_lower_bounds_explainer_reason }}
      workbench: ${{ steps.scope.outputs.workbench }}
      workbench_reason: ${{ steps.scope.outputs.workbench_reason }}
      overview: ${{ steps.scope.outputs.overview }}
      overview_reason: ${{ steps.scope.outputs.overview_reason }}
      n11_threshold_bound_review: ${{ steps.scope.outputs.n11_threshold_bound_review }}
      n11_threshold_bound_review_reason: ${{ steps.scope.outputs.n11_threshold_bound_review_reason }}
      n11_optimality_review: ${{ steps.scope.outputs.n11_optimality_review }}
      n11_optimality_review_reason: ${{ steps.scope.outputs.n11_optimality_review_reason }}
      packing_methods: ${{ steps.scope.outputs.packing_methods }}
      packing_methods_reason: ${{ steps.scope.outputs.packing_methods_reason }}
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The declared inputs are read by importing the builders, and kpress is
          # installed from the submodule.
          submodules: true
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Decide which pages this change has to build
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            uv run --frozen --all-extras --group dev python -m devtools.pages_scope --diff HEAD^1 HEAD
          else
            uv run --frozen --all-extras --group dev python -m devtools.pages_scope --all "a $EVENT event"
          fi

      # A skipped page is skipped with a reason, not by a row of grey checks a reader has
      # to interpret. The step above writes every page's decision and reason to this job's
      # summary; this one puts a notice per skipped page on the run, where the checks list
      # shows it, and fails if the scope left a page out without a reason, so an empty
      # output cannot pass for a decision. Until 2026-10-05 each page had a `*-unchanged`
      # job of its own for this: up to five runner allocations per pull request, each to
      # print one line, and 20 to 25 of the first wave's allocations in each of that day's
      # stack cascades, against a pool of about 40.
      - name: Say why each skipped page is not built
        env:
          DECISIONS: ${{ toJSON(steps.scope.outputs) }}
        run: |
          while read -r half page; do
            [ "$(jq -r --arg half "$half" '.[$half] // ""' <<< "$DECISIONS")" = true ] && continue
            reason="$(jq -r --arg key "${half}_reason" '.[$key] // ""' <<< "$DECISIONS")"
            if [ -z "$reason" ]; then
              echo "::error title=No reason to skip the $page::the scope did not put the $page in scope and gave no reason"
              exit 1
            fi
            echo "::notice title=The $page is not built::$reason"
          done <<'PAGES'
          n11_lower_bounds_explainer lower-bounds explainer
          workbench workbench
          overview overview and the site's own pages
          n11_threshold_bound_review threshold-bound review
          n11_optimality_review optimality review
          packing_methods packing methods explainer
          PAGES

  n11-optimality-review:
    needs: scope
    if: needs.scope.outputs.n11_optimality_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository and the retained T-060 inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/
            /packing/resources/web/n11-optimality-2026-09-29/
            /packing/resources/papers/kingbird-square-11-provenance.svg
            /packing/resources/web/external-square-certificates-2026-09-22/kleddamag-11/README.md

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node 24 for KPress math
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Cache the pinned Chromium browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      - name: Check the paper's figures and renderer
        env:
          SQPACK_N11_OPTIMALITY_REVIEW_BROWSER: "1"
        run: |
          uv run --frozen --all-extras --group dev pytest -q tests/test_n11_optimality_figures.py tests/test_n11_optimality_overview_figures.py tests/test_n11_optimality_mechanism_figures.py
          uv run --frozen --all-extras --group dev pytest -q tests/test_render_n11_optimality_review.py tests/test_paper_publication.py

      # Rendered where it is served: `site/papers/n11-optimality-review.html`, with its
      # Markdown and its PDF beside it. Nothing else writes `site/papers` on this runner,
      # so the artifact keeps the paper and its shared assets at their served paths.
      - name: Render and check the paper in HTML, Markdown, and PDF
        run: |
          uv run --frozen --group dev python -m devtools.render_n11_optimality_review --site site --pdf
          uv run --frozen --group dev python -m devtools.render_n11_optimality_review --site site --check
          test -s site/papers/n11-optimality-review.pdf
          uv run --frozen --group dev python -m devtools.social_card --output-dir site
          uv run --frozen --group dev python -m devtools.check_published_site --local site --partial --producer paper:n11-optimality-review
          uv run --frozen --group dev python -m devtools.check_site_rendering site --page papers/n11-optimality-review.html

      - name: Share the checked paper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n11-optimality-review-page
          path: packing/site
          if-no-files-found: error
          retention-days: 7

  # Part II of the series, the review of Kleddamag's s(11) > 31/8 (T-037), built as
  # the optimality review is: its figures' and renderer's tests, then the page, its
  # Markdown and its PDF under `site/papers/`. Its partial checkout keeps the archived
  # proof it cites and reads, the T-059 replay journal and the native verifier's row
  # journal, which its figures draw (`RENDER_INPUTS` in
  # `devtools/render_n11_threshold_bound_review.py`).
  n11-threshold-bound-review:
    needs: scope
    if: needs.scope.outputs.n11_threshold_bound_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository and the retained T-037 inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/
            /packing/resources/web/external-square-certificates-2026-09-22/kleddamag-11/
            /packing/resources/web/wand125-tools-2026-09-29/receipts/n11-bound-full.jsonl.gz
            /packing/campaign/agent-sessions/session-153-native-full.rows.jsonl
            /packing/resources/web/external-square-certificates-2026-09-22/receipts/n11/full-replay/RESULT.json
            /packing/resources/web/external-square-certificates-2026-09-22/receipts/n11/independent-audit.json
            /packing/resources/web/wand125-tools-2026-09-29/README.md
            /packing/resources/web/wand125-tools-2026-09-29/receipts/n11-bound-full-summary.json
            /packing/campaign/agent-sessions/session-153-native-full.json
            /packing/campaign/agent-sessions/session-153-native-reconciliation.json

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node 24 for KPress math
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Cache the pinned Chromium browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      - name: Check the paper's figures and renderer
        env:
          SQPACK_N11_THRESHOLD_BOUND_REVIEW_BROWSER: "1"
        run: |
          uv run --frozen --all-extras --group dev pytest -q tests/test_n11_threshold_figures.py tests/test_paper_figures.py
          uv run --frozen --all-extras --group dev pytest -q tests/test_render_n11_threshold_bound_review.py tests/test_paper_publication.py

      # Rendered where it is served: `site/papers/n11-threshold-bound-review.html`, with
      # its Markdown and its PDF beside it. Nothing else writes `site/papers` on this
      # runner, so the artifact keeps the paper and its shared assets at their served paths.
      - name: Render and check the paper in HTML, Markdown, and PDF
        run: |
          uv run --frozen --group dev python -m devtools.render_n11_threshold_bound_review --site site --pdf
          uv run --frozen --group dev python -m devtools.render_n11_threshold_bound_review --site site --check
          test -s site/papers/n11-threshold-bound-review.pdf
          uv run --frozen --group dev python -m devtools.social_card --output-dir site
          uv run --frozen --group dev python -m devtools.check_published_site --local site --partial --producer paper:n11-threshold-bound-review
          uv run --frozen --group dev python -m devtools.check_site_rendering site --page papers/n11-threshold-bound-review.html

      - name: Share the checked paper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n11-threshold-bound-review-page
          path: packing/site
          if-no-files-found: error
          retention-days: 7

  # The standalone methods explainer uses the same paper publication path as the
  # reviews: its renderer contract, served HTML and Markdown, printed PDF, and checked
  # producer artifact. It reads no retained certificate packet.
  packing-methods:
    needs: scope
    if: needs.scope.outputs.packing_methods == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/
            /packing/campaign/series/series-000-smoke-and-calibration/experiments/exp-006-lp-quench-n5-n10-n11.md
            /packing/resources/papers/gensane-ryckelynck-2005-improved-dense-packings.raw.md
            /packing/resources/web/casson-square-packing-2026-09-23/griffcass-square-packing/README.md
            /packing/resources/web/de-winter-square-packing-211-2026-09-16/README.md
            /packing/resources/web/evand-square-packing-2026-10-05/README.md
            /packing/resources/web/evand-square-packing-2026-10-05/square-packing/s12/search/exact/README.md
            /packing/resources/web/franciscouzo-square-packing-2026-09-27/README.md
            /packing/resources/web/franciscouzo-square-packing-2026-10-03/README.md
            /packing/resources/web/friedman-ds7-survey-2009-html.md
            /packing/resources/web/kingbird-run-statistics-2026/README.md
            /packing/resources/web/kingbird-squares-in-squares-analytic-minimization.md
            /packing/resources/web/kingbird-squares-in-squares-compared-2026-08-22.md
            /packing/resources/web/schadt-s29-2025/README.md
            /packing/resources/web/squish-401-2026-10-07/README.md
            /packing/resources/web/squish-401-update-2026-10-07/README.md
            /packing/resources/web/squish-422-second-update-2026-10-07/README.md

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node 24 for KPress math
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Cache the pinned Chromium browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      - name: Check the paper's renderer
        env:
          SQPACK_PACKING_METHODS_BROWSER: "1"
        run: uv run --frozen --all-extras --group dev pytest -q tests/test_render_packing_methods.py tests/test_paper_publication.py

      - name: Render and check the paper in HTML, Markdown, and PDF
        run: |
          uv run --frozen --group dev python -m devtools.render_packing_methods --site site --pdf
          uv run --frozen --group dev python -m devtools.render_packing_methods --site site --check
          test -s site/papers/packing-methods.pdf
          uv run --frozen --group dev python -m devtools.artifact_dates --pdf site/papers/packing-methods.pdf --revised packing-methods
          uv run --frozen --group dev python -m devtools.social_card --output-dir site
          uv run --frozen --group dev python -m devtools.check_published_site --local site --partial --producer paper:packing-methods
          uv run --frozen --group dev python -m devtools.check_site_rendering site --page papers/packing-methods.html

      - name: Share the checked paper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packing-methods-page
          path: packing/site
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: scope
    if: needs.scope.outputs.n11_lower_bounds_explainer == 'true'
    runs-on: ubuntu-latest
    outputs:
      prepared_artifact_id: ${{ steps.prepared-page-upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: packing
    steps:
      # Without `packing/resources` and `packing/campaign`, but not without the two
      # directories: the renderer links the literature archive as a GitHub `tree/` URL
      # because `packing/resources` is a directory, and would write `blob/` if it were
      # missing, so each keeps its top-level files. Nothing else in the render's import
      # closure reads under either tree (2026-09-15, every module loaded by
      # `render_n11_lower_bounds_explainer` and `prepare_n11_lower_bounds_explainer_math`, searched for reads and walks).
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the page cannot be rendered without the submodule checked out.
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The math renderer shells out to Node for one batched KaTeX pass. Select the same
      # runtime as validation instead of inheriting the mutable ubuntu-latest image.
      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      # Geometry is measured using the pinned browser during publication. Every
      # browser check below consumes this one artifact, including its reserved boxes.
      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the browser that measures the mathematics
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      # The renderer re-decides Conditions 1 through 4 before it writes anything, so a
      # certificate those conditions refuse fails the build instead of being published
      # with an explanation of a bound it does not carry. Condition 5 is a sweep per
      # direction and the case replay gate owns it. The renderer also refuses a page that
      # references anything outside itself (a script or stylesheet source, a CSS import, a
      # url() that is not a data URI), so self-containment is the renderer's check.
      #
      # The page is not checked in, so this is where a render that did not reproduce
      # itself byte for byte would show: two independent renders have to agree on every
      # file they write. They used to run one after the other, 18 s and then 16 s on the
      # critical path of every run; they now run at once on this four-cpu runner, and the
      # second writes outside `site/` so neither can read or overwrite the other's output.
      # What the concurrent pair no longer re-tests is a second render that starts after
      # the first has finished and reads something it left behind -- and nothing in the
      # render leaves anything behind: its only writes are the output files (2026-09-15,
      # the render's import closure searched for writes and caches).
      - name: Render the page twice and require the renders to agree
        run: |
          twin="$RUNNER_TEMP/render-twin"
          uv run --frozen --group dev python -m devtools.render_n11_lower_bounds_explainer --prepare-math --site "$twin" &
          twin_pid=$!
          uv run --frozen --group dev python -m devtools.render_n11_lower_bounds_explainer --prepare-math
          wait "$twin_pid"
          diff --recursive site "$twin"
          test -s site/papers/n11-lower-bounds-explainer.html
          echo "two renders agree; one page, $(du -h site/papers/n11-lower-bounds-explainer.html | cut -f1)"

      - name: Share the prepared page with all browser checks
        id: prepared-page-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-page
          path: packing/site
          if-no-files-found: error
          retention-days: 7

  # The workbench is a second page inside the same artifact, and it reads nothing the
  # explainer's jobs produce, so it builds beside `prepare` rather than at the end of a
  # queue of explainer checks where it used to sit. It does no browser work. The builder
  # stamps whether the checkout is dirty into the published page; a sparse checkout keeps
  # omitted tracked files at `skip-worktree`, so `git status` gives the same clean answer
  # without downloading the 504 MB literature archive and campaign. Run 35052785989 made
  # this job the critical path when its full checkout took 171 s.
  workbench:
    needs: scope
    if: needs.scope.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workbench builder invokes Node too; keep publication on the validation pin.
      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the pinned workbench build toolchain
        working-directory: .
        run: npm ci --ignore-scripts

      # Pages takes `packing/site` whole, so a subdirectory is a URL: this puts the
      # workbench at `/workbench/`, as the papers are under `/papers/`. `--check` builds
      # it twice, at once, and requires the two builds to agree byte for byte.
      - name: Build the workbench at its own URL
        run: uv run --frozen --all-extras --group dev python -m workbench_tools.build_site --check --revision "${{ github.sha }}"

      - name: Check every declared workbench output
        run: |
          uv run --frozen --group dev python -m devtools.social_card --output-dir site
          uv run --frozen --group dev python -m devtools.check_published_site --local site --partial --producer workbench

      - name: Share the workbench with the publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workbench-page
          path: packing/site/workbench
          if-no-files-found: error
          retention-days: 7

  # The site's own pages: the overview at `/`, and every other page
  # `devtools.render_overview` owns (its `PAGES`), beside it at the root. They read the
  # register, the case records and the reader documents, never the explainer's build, so
  # they render beside `prepare` rather than after it; the pull-request wall had four
  # seconds to spare against its 180 s budget when this job was added, and a job queued
  # behind `prepare` would have spent them. This build also writes the forwarders at the
  # papers' old addresses (`explainer.html`, `n11-optimality/`), and the overview sends an
  # old deep link into the explainer on to `papers/n11-lower-bounds-explainer.html`; both
  # are one script of this build's own, so nothing here waits for a paper to exist.
  overview:
    needs: scope
    if: needs.scope.outputs.overview == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      # The same partial checkout as `prepare`, for the same reason. The one file the
      # render reads under `packing/resources` is `bibliography.yaml`, a top-level file the
      # pattern keeps (2026-09-29, every file the render opened, audited). The reader
      # documents' repository links, which name `main`, are resolved against the checked-out
      # commit's tree with `git ls-tree`, which reads only tree objects: a blobless clone of
      # depth one already holds every tree of that commit, so the render needs no history
      # and fetches none.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pages are kpress pages, and kpress is installed from the submodule.
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Node 24 for static mathematics
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      # The pages are not checked in, so a render that does not reproduce itself would
      # show only here: two renders, at once as `prepare`'s are, the second outside
      # `site/`, have to agree on every file they write, the shared assets under `assets/`
      # among them. The renderer refuses a page that would fetch anything at view time but
      # those assets, and a reader document with a link to a path the checked-out tree
      # lacks, so those failures stop the build here too.
      - name: Render the site's pages twice and require the renders to agree
        run: |
          twin="$RUNNER_TEMP/render-twin"
          uv run --frozen --group dev python -m devtools.render_overview --output "$twin" &
          twin_pid=$!
          uv run --frozen --group dev python -m devtools.render_overview --output site
          wait "$twin_pid"
          diff --recursive site "$twin"
          test -s site/index.html
          echo "two renders agree; $(find site -type f | wc -l) files, $(du -sh site | cut -f1)"

      # The picture every page's link preview names, the homepage's hero at 1200 by 630, is
      # drawn here and not checked in (`devtools.social_card`): a raster's bytes are the
      # rasteriser's, so the two drawings, into the twin and into `site/`, have to agree as
      # the pages do. Then every page's head is held to the site's identity and card tags,
      # and the card to its size, on the files about to be shared: the checks the deployed
      # site gets from `check_published_site`, before anything is deployed. The explainer,
      # the paper and the workbench are other jobs' pages, so they are reported as not in
      # this build; `publish` checks them in the assembled site, and `verify-deployment`
      # reads all of them as deployed.
      - name: Draw the link preview's card twice, and check every page's head
        run: |
          twin="$RUNNER_TEMP/render-twin"
          uv run --frozen --group dev python -m devtools.social_card --output-dir "$twin" &
          twin_pid=$!
          uv run --frozen --group dev python -m devtools.social_card --output-dir site
          wait "$twin_pid"
          # The overview uses preview media normally supplied by the lower-bounds
          # producer. Its partial browser check needs the same committed images.
          for destination in site "$twin"; do
            cp atlas/known-best/known-best-1-100-card.png \
               atlas/known-best/known-best-1-324.png \
               ../packages/workbench/assets/ascent-n1-324-poster.png "$destination/"
          done
          diff --recursive site "$twin"
          uv run --frozen --group dev python -m devtools.check_published_site --local site --partial --producer overview
          uv run --frozen --group dev python -m devtools.check_site_rendering site

      - name: Share the site's pages with the publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overview-pages
          path: packing/site
          if-no-files-found: error
          retention-days: 7

  # The five Chromium check jobs below were one `build` job of about 300 s. Their split is
  # by measured step time, and the readings are this workflow's own -- run 35039923396,
  # the second run of the split shape -- rather than the queue's they replaced:
  #
  #   pdf           print faces 9, PDF draw 4, PDF controls 22, artifact check 6,
  #                 print geometry 4 x 4.3                                            58 s
  #   print-layout  print layout 35, the page-width overflow control 31               66 s
  #   typography    typography 33, comparison variants 1, startup controls 17,
  #                 mobile screen geometry 4 x 5                                       70 s
  #   screen        math faces 29, font loading 18, reload 9                          56 s
  #   geometry      controls 41, three desktop settings and the alternate
  #                 certificate 4 x 5                                                 61 s
  #
  # on 15 to 30 s of setup each. The grouping follows the measurement where it has to:
  # the startup controls are a screen check, and the fourteen geometry configurations are
  # spread over three jobs, because balanced by cost is what keeps the longest job short.
  # Each job downloads the one prepared page, so all of them check the bytes that are
  # published, and a failure now names its job rather than a step in a 388 s queue.
  # Their checkout, Python and browser provisioning do not consume the page, so those
  # steps start beside `prepare`; each job joins the exact `prepared-page` artifact only
  # after setup. Run 35127260004 showed that leaving this setup behind `prepare` made
  # `typography` the new 194 s critical path after the cross-browser jobs were overlapped.

  # Everything the PDF is: drawn once, from the prepared page, then checked in place and
  # handed to `publish` unchanged.
  pdf:
    needs: scope
    if: needs.scope.outputs.n11_lower_bounds_explainer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      - name: Wait for the prepared page
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --group dev python -m devtools.wait_for_run_artifact
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --name prepared-page
          --producer prepare --github-output "$GITHUB_OUTPUT" --timeout 600

      # With `merge-multiple`, an empty `artifact-ids` downloads every artifact in the
      # run into `packing/site`, the workbench's `index.html` among them. Refuse it here.
      - name: Require the prepared page's artifact id
        env:
          ARTIFACT_ID: ${{ steps.prepared.outputs.artifact_id }}
        run: >-
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          || { echo "::error::the prepared page has no artifact id to download"; exit 1; }

      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact_id }}
          path: packing/site
          merge-multiple: true

      # After the page, not beside it: the exporter loads the page from disk
      # (`site/papers/n11-lower-bounds-explainer.html`), and Figure 2 references the composite that
      # the render copies into `site/` on its way out.
      - name: Check the print faces cover every sans weight the page requests
        run: uv run --frozen --group dev python -m devtools.sans_instances --check

      - name: Draw the PDF of the page
        run: uv run --frozen --group dev python -m devtools.render_n11_lower_bounds_explainer_pdf --update

      # The production exporter with normal math and with injected font errors and
      # timeouts. The normal-math control reads the PDF drawn above instead of drawing the
      # same production PDF a second time (4.5 s, one of the seven draws this job made);
      # the four fault controls still drive the exporter themselves, because a fault has to
      # be injected into a draw.
      - name: Check PDF math and real font-failure controls
        env:
          SQPACK_PDF_MATH_BROWSER: "1"
        run: uv run --frozen --group dev pytest -q tests/test_pdf_math_browser.py

      # Compare the saved PDF, including its HTML source receipt, to a fresh draw with
      # this runner's browser and fonts. Keep both raw PDFs outside the published site
      # if they disagree; the checker never rewrites the artifact it checks.
      - name: Check the PDF artifact that will be published
        run: uv run --frozen --group dev python -m devtools.render_n11_lower_bounds_explainer_pdf --check-artifact --diagnostics-dir /tmp/n11-lower-bounds-explainer-pdf-check

      # This opt-in observation can perturb timing. It supplements the ordinary,
      # uninstrumented artifact check above and never replaces its verdict.
      - name: Trace repeated PDF math layout
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf }}
        run: uv run --frozen --group dev python -m devtools.render_n11_lower_bounds_explainer_pdf --check --renders 20 --trace-math --diagnostics-dir /tmp/n11-lower-bounds-explainer-pdf-trace

      - name: Retain PDF math trace
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n11-lower-bounds-explainer-pdf-trace
          path: /tmp/n11-lower-bounds-explainer-pdf-trace
          if-no-files-found: error
          retention-days: 7

      # Use the same prepared HTML and runner for both arms. This intervention is
      # diagnostic only; the earlier control failure remains a workflow failure.
      - name: Test prepared math text reconstruction
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf && inputs.rebuild_pdf_math_text }}
        run: uv run --frozen --group dev python -m devtools.render_n11_lower_bounds_explainer_pdf --check --renders 20 --trace-math --rebuild-prepared-text --diagnostics-dir /tmp/n11-lower-bounds-explainer-pdf-rebuild

      - name: Retain PDF text reconstruction trace
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf && inputs.rebuild_pdf_math_text }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n11-lower-bounds-explainer-pdf-rebuild
          path: /tmp/n11-lower-bounds-explainer-pdf-rebuild
          if-no-files-found: error
          retention-days: 7

      - name: Retain PDF mismatch diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n11-lower-bounds-explainer-pdf-check
          path: /tmp/n11-lower-bounds-explainer-pdf-check
          if-no-files-found: ignore
          retention-days: 7

      - name: Check every declared lower-bounds paper output and static load
        run: |
          uv run --frozen --group dev python -m devtools.social_card --output-dir site
          uv run --frozen --group dev python -m devtools.check_published_site --local site --partial --producer paper:n11-lower-bounds-explainer
          uv run --frozen --group dev python -m devtools.check_site_rendering site --page papers/n11-lower-bounds-explainer.html

      # The print half of the saved-setting geometry; the screen half is `geometry`.
      # The trap is what lets a cancelled run stop here: `uv run` turns the runner's
      # interrupt into an ordinary exit status, which `|| geometry_status=1` absorbed, so
      # a superseded run kept measuring one setting after another for about 50 s and held
      # the concurrency group for all of it (run 34993121513). The trap exits once the
      # command in flight returns.
      - name: Check reserved print geometry under every saved font setting
        run: |
          trap 'exit 130' INT TERM
          mkdir -p /tmp/math-geometry
          geometry_status=0
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --print --output /tmp/math-geometry/chromium-1280-custom-serif-print.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --prose-font sans --print --output /tmp/math-geometry/chromium-1280-custom-sans-print.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --font-set system --print --output /tmp/math-geometry/chromium-1280-system-serif-print.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --font-set system --prose-font sans --print --output /tmp/math-geometry/chromium-1280-system-sans-print.json || geometry_status=1
          exit "$geometry_status"

      - name: Retain Chromium print geometry observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-geometry-chromium-print
          path: /tmp/math-geometry
          if-no-files-found: error
          retention-days: 7

      # The checked bytes, unchanged: `publish` puts this file beside the prepared page.
      - name: Share the checked PDF with the publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n11-lower-bounds-explainer-pdf
          path: packing/site/papers/n11-lower-bounds-explainer.pdf
          if-no-files-found: error
          retention-days: 7

  print-layout:
    needs: scope
    if: needs.scope.outputs.n11_lower_bounds_explainer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      - name: Wait for the prepared page
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --group dev python -m devtools.wait_for_run_artifact
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --name prepared-page
          --producer prepare --github-output "$GITHUB_OUTPUT" --timeout 600

      # With `merge-multiple`, an empty `artifact-ids` downloads every artifact in the
      # run into `packing/site`, the workbench's `index.html` among them. Refuse it here.
      - name: Require the prepared page's artifact id
        env:
          ARTIFACT_ID: ${{ steps.prepared.outputs.artifact_id }}
        run: >-
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          || { echo "::error::the prepared page has no artifact id to download"; exit 1; }

      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact_id }}
          path: packing/site
          merge-multiple: true

      # Reproducibility is not correctness: the PDF artifact check would have passed on
      # all three print defects a reader found in the finished PDF, because two identical
      # renders of a wrong page still agree. This one measures the print layout -- the
      # blocks the page declares centred, where the list markers sit, whether a footnote
      # reference opens a line -- at the column the PDF actually has, and the second
      # measures the same thing on a page mutated to overflow, so the probe is held to
      # catching what it exists to catch. The two Chromium launches do not share a page.
      - name: Check the print layout and its overflow self-check
        run: |
          set -euo pipefail
          uv run --frozen --group dev python -m devtools.check_print_layout &
          layout_pid=$!
          uv run --frozen --group dev python -m devtools.check_print_layout --self-check &
          self_pid=$!
          layout_status=0
          self_status=0
          wait "$layout_pid" || layout_status=$?
          wait "$self_pid" || self_status=$?
          test "$layout_status" -eq 0
          test "$self_status" -eq 0

  typography:
    needs: scope
    if: needs.scope.outputs.n11_lower_bounds_explainer == 'true'
    runs-on: ubuntu-latest
    permissions:
