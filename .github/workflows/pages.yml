name: Certificate page

"on":
  workflow_dispatch: {}
  # The page is rendered from the retained certificate, so it is republished
  # whenever that certificate, the renderer, or the template moves.
  push:
    branches: [main]
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/devtools/render_certificate_page.py
      - packing/devtools/templates/certificate_page.html
      - packing/pyproject.toml
      - packing/uv.lock
      - .github/workflows/pages.yml
  # On a pull request the page is built but not deployed, so a change that
  # breaks the render fails review rather than the next deploy.
  pull_request:
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/devtools/render_certificate_page.py
      - packing/devtools/templates/certificate_page.html
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: certificate-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The renderer re-decides C0 through C3 before it writes anything, so a
      # certificate those conditions refuse fails the build instead of being
      # published with an explanation of a bound it does not carry. C4 is a
      # sweep per direction and the case replay gate owns it.
      - name: Render the page from the retained certificate
        run: uv run --frozen --group dev python -m devtools.render_certificate_page

      - name: Check the page is one self-contained file
        run: |
          test -s site/index.html
          if grep -Eoq 'src="https?://|href="https?://[^"]*\.css' site/index.html; then
            echo "the page references an external script or stylesheet" >&2
            grep -Eo 'src="https?://[^"]*|href="https?://[^"]*\.css' site/index.html >&2
            exit 1
          fi
          echo "self-contained, $(du -h site/index.html | cut -f1)"

      - name: Upload the page artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packing/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
