          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --font-set system --width 390 --output /tmp/math-geometry/chromium-390-system-serif-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --font-set system --prose-font sans --width 390 --output /tmp/math-geometry/chromium-390-system-sans-screen.json || geometry_status=1
          exit "$geometry_status"

      - name: Retain Chromium mobile geometry observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-geometry-chromium-390
          path: /tmp/math-geometry
