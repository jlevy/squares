name: Certificate page

"on":
  workflow_dispatch:
    inputs:
      trace_pdf:
        description: Retain math geometry and repeated PDF draws for diagnosis
        type: boolean
        default: false
      rebuild_pdf_math_text:
        description: Also test unchanged math text reconstruction (requires trace_pdf)
        type: boolean
        default: false
  # The pages are rebuilt when their retained inputs, renderers, or templates move.
  # The list is every input the renderer reads or imports: the case directory
  # (certificates, coarsening rows, claim documents), the templates, the atlas
  # rendering it inlines as Figure 1, the composite assets it serves beside
  # the page, the figure record and the module it is read through, the frontier
  # register whose length the opening states, the sqpack modules it imports (it
  # asserts two palette colours at import), the vendored kpress, and the locked
  # environment.
  #
  # Do not maintain this list by reading the renderer. It is declared there, as
  # RENDER_INPUTS, and test_the_pages_filter_covers_every_render_input compares
  # the two; add the input there and the test names what to add here. Four of the
  # entries above are the ones that comparison found already missing (think-bl0n).
  #
  # The site's own pages (the overview at `/`, the tutorial, the frontier atlas) are published from the same run, so their inputs are here too: the register,
  # the case records and the evidence they cite, the bibliography that credits others'
  # results, the two reader documents, and the modules that format them. They are
  # declared by `render_overview.inputs()` and compared the same way, by
  # test_the_pages_filter_covers_every_overview_input.
  push:
    branches: [main]
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/cases/n11_threshold_certificate/**
      - packing/devtools/render_n11_lower_bounds_explainer.py
