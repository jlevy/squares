      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact_id }}
          path: packing/site
          merge-multiple: true

      # The trap: see the print geometry step in `typography`.
      - name: Check reserved math geometry under every saved font setting
        run: |
          trap 'exit 130' INT TERM
          mkdir -p /tmp/math-geometry
          geometry_status=0
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --host-check --self-test --output /tmp/math-geometry/chromium-1280-custom-serif-screen-controls.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --prose-font sans --output /tmp/math-geometry/chromium-1280-custom-sans-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --font-set system --output /tmp/math-geometry/chromium-1280-system-serif-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --font-set system --prose-font sans --output /tmp/math-geometry/chromium-1280-system-sans-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --alternate-certificate --output /tmp/math-geometry/chromium-1280-custom-serif-screen-alternate-certificate.json || geometry_status=1
          exit "$geometry_status"

      - name: Retain Chromium geometry observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-geometry-chromium
          path: /tmp/math-geometry
          if-no-files-found: error
          retention-days: 7

  # The same prepared page in Firefox and WebKit: mobile font loading and the saved font
  # settings at 1280 px here, the 390 px settings and the reload position in
  # `browser-geometry`. WebKit's page loads are about 7 s against Firefox's 5. The four
  # independent saved-font variants run in two pairs: exact-head run 35078515689 spent
  # 39 s on them serially and missed OR-14's 180 s outer edge by 9 s. Two pairs preserve
  # headroom on the four-CPU runner while removing roughly half that serial tail.
  font-loading:
    needs: scope
    if: needs.scope.outputs.n11_lower_bounds_explainer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('packing/uv.lock') }}

      # The browser binary was always cached; its system libraries were not. WebKit's are
      # 181 packages, 114 MB, fetched in 24.7 s of a 46 s install in run 34993754160, and
      # Firefox's 40 packages, 49 MB, in 8.9 s. apt now keeps what it downloads in a
      # directory the Actions cache saves, keyed on the runner image (whose package lists
      # decide the versions) and the lock (which pins Playwright and so the package list);
      # an older image's archives are restored as a start and apt fetches only what moved.
      # dpkg's per-file fsync and the man-db trigger are switched off for the unpack, on a
      # runner that is discarded when the job ends. The same packages at the same versions
      # are installed either way, so no browser sees a different system.
      - name: Name the runner image the system packages belong to
        id: image
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache the browser's system packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.browser }}-${{ steps.image.outputs.image }}-${{ hashFiles('packing/uv.lock') }}
          restore-keys: |
            apt-${{ matrix.browser }}-${{ steps.image.outputs.image }}-
            apt-${{ matrix.browser }}-

      - name: Install the pinned browser and its system libraries
        run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives/\";" | sudo tee /etc/apt/apt.conf.d/90-pages-archives > /dev/null
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/90-pages-unsafe-io > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean /var/lib/man-db/auto-update
          uv run --frozen --group dev python -m playwright install --with-deps ${{ matrix.browser }}
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      # Provisioning is independent of the page and starts beside `prepare`. Join only
      # at the first consumer, with a bounded tool that also observes producer failure.
      - name: Wait for the prepared page
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --group dev python -m devtools.wait_for_run_artifact
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --name prepared-page
          --producer prepare --github-output "$GITHUB_OUTPUT" --timeout 600

      # With `merge-multiple`, an empty `artifact-ids` downloads every artifact in the
      # run into `packing/site`, the workbench's `index.html` among them. Refuse it here.
      - name: Require the prepared page's artifact id
        env:
          ARTIFACT_ID: ${{ steps.prepared.outputs.artifact_id }}
        run: >-
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          || { echo "::error::the prepared page has no artifact id to download"; exit 1; }

      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact_id }}
          path: packing/site
          merge-multiple: true

      - name: Check mobile font loading on the published artifact
        run: |
          uv run --frozen --group dev python -m devtools.check_math_loading --browser ${{ matrix.browser }} --width 390

      # The trap: see the print geometry step in `typography`.
      - name: Check saved font settings retain geometry at 1280 px
        run: |
          trap 'exit 130' INT TERM
          mkdir -p /tmp/math-geometry
          geometry_status=0
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --width 1280 --host-check --output /tmp/math-geometry/${{ matrix.browser }}-1280-custom-serif-screen.json &
          custom_serif_pid=$!
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --prose-font sans --width 1280 --output /tmp/math-geometry/${{ matrix.browser }}-1280-custom-sans-screen.json &
          custom_sans_pid=$!
          wait "$custom_serif_pid" || geometry_status=1
          wait "$custom_sans_pid" || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --font-set system --width 1280 --output /tmp/math-geometry/${{ matrix.browser }}-1280-system-serif-screen.json &
          system_serif_pid=$!
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --font-set system --prose-font sans --width 1280 --output /tmp/math-geometry/${{ matrix.browser }}-1280-system-sans-screen.json &
          system_sans_pid=$!
          wait "$system_serif_pid" || geometry_status=1
          wait "$system_sans_pid" || geometry_status=1
          exit "$geometry_status"

      - name: Retain browser geometry observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-geometry-${{ matrix.browser }}
          path: /tmp/math-geometry
          if-no-files-found: error
          retention-days: 7

  browser-geometry:
    needs: scope
    if: needs.scope.outputs.n11_lower_bounds_explainer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('packing/uv.lock') }}

      # The browser binary was always cached; its system libraries were not. WebKit's are
      # 181 packages, 114 MB, fetched in 24.7 s of a 46 s install in run 34993754160, and
      # Firefox's 40 packages, 49 MB, in 8.9 s. apt now keeps what it downloads in a
      # directory the Actions cache saves, keyed on the runner image (whose package lists
      # decide the versions) and the lock (which pins Playwright and so the package list);
      # an older image's archives are restored as a start and apt fetches only what moved.
      # dpkg's per-file fsync and the man-db trigger are switched off for the unpack, on a
      # runner that is discarded when the job ends. The same packages at the same versions
      # are installed either way, so no browser sees a different system.
      - name: Name the runner image the system packages belong to
        id: image
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache the browser's system packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.browser }}-${{ steps.image.outputs.image }}-${{ hashFiles('packing/uv.lock') }}
          restore-keys: |
            apt-${{ matrix.browser }}-${{ steps.image.outputs.image }}-
            apt-${{ matrix.browser }}-

      - name: Install the pinned browser and its system libraries
        run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives/\";" | sudo tee /etc/apt/apt.conf.d/90-pages-archives > /dev/null
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/90-pages-unsafe-io > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean /var/lib/man-db/auto-update
          uv run --frozen --group dev python -m playwright install --with-deps ${{ matrix.browser }}
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Wait for the prepared page
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --group dev python -m devtools.wait_for_run_artifact
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --name prepared-page
          --producer prepare --github-output "$GITHUB_OUTPUT" --timeout 600

      # With `merge-multiple`, an empty `artifact-ids` downloads every artifact in the
      # run into `packing/site`, the workbench's `index.html` among them. Refuse it here.
      - name: Require the prepared page's artifact id
        env:
          ARTIFACT_ID: ${{ steps.prepared.outputs.artifact_id }}
        run: >-
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          || { echo "::error::the prepared page has no artifact id to download"; exit 1; }

      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact_id }}
          path: packing/site
          merge-multiple: true

      - name: Check reload preserves the reading position in both viewports
        run: |
          uv run --frozen --group dev python -m devtools.check_scroll_restoration site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --self-test --output /tmp/scroll-restoration/${{ matrix.browser }}-1280.json
          uv run --frozen --group dev python -m devtools.check_scroll_restoration site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --width 390 --output /tmp/scroll-restoration/${{ matrix.browser }}-390.json

      - name: Retain browser reload observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scroll-restoration-${{ matrix.browser }}
          path: /tmp/scroll-restoration
          if-no-files-found: error
          retention-days: 7

      # The trap: see the print geometry step in `typography`.
      - name: Check saved font settings retain geometry at 390 px
        run: |
          trap 'exit 130' INT TERM
          mkdir -p /tmp/math-geometry
          geometry_status=0
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --width 390 --output /tmp/math-geometry/${{ matrix.browser }}-390-custom-serif-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --prose-font sans --width 390 --output /tmp/math-geometry/${{ matrix.browser }}-390-custom-sans-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --font-set system --width 390 --output /tmp/math-geometry/${{ matrix.browser }}-390-system-serif-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_n11_lower_bounds_explainer_math site/papers/n11-lower-bounds-explainer.html --browser ${{ matrix.browser }} --font-set system --prose-font sans --width 390 --output /tmp/math-geometry/${{ matrix.browser }}-390-system-sans-screen.json || geometry_status=1
          exit "$geometry_status"

      - name: Retain browser geometry observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-geometry-${{ matrix.browser }}-390
          path: /tmp/math-geometry
          if-no-files-found: error
          retention-days: 7

  # A dedicated runner keeps PDF export and the other browser jobs from competing
  # with this descriptive timing experiment. Only an explicit dispatch runs it.
  startup-timing:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # With `merge-multiple`, an empty `artifact-ids` downloads every artifact in the
      # run into `packing/site`, the workbench's `index.html` among them. Refuse it here.
      - name: Require the prepared page's artifact id
        env:
          ARTIFACT_ID: ${{ needs.prepare.outputs.prepared_artifact_id }}
        run: >-
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          || { echo "::error::the prepared page has no artifact id to download"; exit 1; }

      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.prepared_artifact_id }}
          path: packing/site
          merge-multiple: true

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium browser
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      - name: Prepare retained timing inputs
        run: |
          mkdir -p /tmp/math-startup-timing
          cp site/papers/n11-lower-bounds-explainer.html /tmp/math-startup-timing/candidate.html
          gzip --decompress --stdout benchmarks/math-startup/fixtures/control-33cd4760.html.gz > /tmp/math-startup-timing/control-33cd4760.html

      - name: Check the parameter-only measurement controls
        id: timing-controls
        run: uv run --frozen --group dev python -m devtools.check_math_startup --mode parameters --self-test --output /tmp/math-startup-timing/controls.json

      # The tool alternates control/candidate order on successive pairs. Invalid
      # measurements fail the job; numerical speed acceptance is evaluated from
      # these retained observations under the registered experiment criterion.
      - name: Measure twelve desktop startup pairs
        run: uv run --frozen --group dev python -m devtools.check_math_startup --mode parameters --control /tmp/math-startup-timing/control-33cd4760.html --candidate site/papers/n11-lower-bounds-explainer.html --runs 12 --width 1280 --browser chromium --output /tmp/math-startup-timing/startup-1280.json

      - name: Measure twelve mobile startup pairs
        # Retain both widths even if the desktop observations are invalid, provided
        # the instrument's controls passed. A failure still leaves the job red.
        if: ${{ !cancelled() && steps.timing-controls.outcome == 'success' }}
        run: uv run --frozen --group dev python -m devtools.check_math_startup --mode parameters --control /tmp/math-startup-timing/control-33cd4760.html --candidate site/papers/n11-lower-bounds-explainer.html --runs 12 --width 390 --browser chromium --output /tmp/math-startup-timing/startup-390.json

      - name: Retain raw timings and both input pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-startup-timing
          path: /tmp/math-startup-timing
          if-no-files-found: error
          retention-days: 7

  # What the deployment publishes, assembled from the seven jobs that produce it: the
  # lower-bounds explainer and its Markdown under `/papers/`, with the atlas's files at
  # the root (`prepare`), its checked PDF beside it (`pdf`), the site's own pages at the
  # root with the forwarders at the papers' old addresses (`overview`), the workbench at
  # `/workbench/` (`workbench`), and the threshold-bound review and the optimality review,
  # each with its Markdown and PDF, under `/papers/` (`n11-threshold-bound-review`,
  # `n11-optimality-review`), and the standalone methods explainer (`packing-methods`).
  # It runs on pull requests too -- a missing artifact fails
  # review rather than the next deploy -- lists every file with its size and digest so
  # the tree can be compared across runs, and holds every page's head in it to the site's
  # contract (`check_published_site --local`); only a push to `main` uploads it for Pages.
  # It needs the producers and not the checks, so on a pull request it finishes beside
  # the checks rather than after them.
  #
  # It assembles only whole sites. A pull request that leaves any producer out of scope
  # skips it with that producer, as one that skipped the workbench always has; each
  # producer's own job has already built and checked what it would contribute, and the
  # assembly itself is exercised on every push to `main` and on every pull request that
  # touches an input all builds share (the workflow, the scope tool, kpress, the
  # lockfile). A partial tree is never a publication, so there is nothing to assemble.
  publish:
    needs: [prepare, pdf, overview, workbench, n11-threshold-bound-review, n11-optimality-review, packing-methods]
    runs-on: ubuntu-latest
    steps:
      # The assembled site is held to the head contract once it is whole, with the
      # checkout's own tool: the same partial checkout and the same uv and Python as the
      # `overview` job, which runs that check on its own build. The checkout comes before
      # the downloads, since a checkout clears the directory it checks out into.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # With `merge-multiple`, an empty `artifact-ids` downloads every artifact in the
      # run into `packing/site`, the workbench's `index.html` among them. Refuse it here.
      - name: Require the prepared page's artifact id
        env:
          ARTIFACT_ID: ${{ needs.prepare.outputs.prepared_artifact_id }}
        run: >-
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          || { echo "::error::the prepared page has no artifact id to download"; exit 1; }

      # The lower-bounds explainer arrives as it was rendered and checked: the page and
      # its Markdown under `papers/`, by the paper's slug, and at the root the atlas's
      # files the page shows, which the overview links by name. Nothing is renamed: the
      # PDF's source receipt is the digest of the page's bytes, and every check read them
      # at this path.
      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.prepared_artifact_id }}
          path: packing/site
          merge-multiple: true

      - name: Use the checked PDF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: n11-lower-bounds-explainer-pdf
          path: packing/site/papers

      # Staged apart and merged by hand, because a download into `packing/site` would
      # overwrite whatever it collided with and say nothing. The site's pages are served
      # beside the atlas's files the explainer's build wrote, which the overview links by
      # name, so a name both builds wrote is refused rather than resolved by download
      # order. The forwarders at the papers' old addresses come with the site's pages:
      # `explainer.html`, and `n11-optimality/` with its `t-060-explainer.html`.
      - name: Use the site's pages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: overview-pages
          path: ${{ runner.temp }}/overview-pages

      - name: Put the site's pages at the root, refusing any name already there
        env:
          STAGED: ${{ runner.temp }}/overview-pages
        working-directory: packing
        run: |
          test -s "$STAGED/index.html"
          uv run --frozen --group dev python -m devtools.assemble_site --destination site "$STAGED"

      - name: Use the workbench
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workbench-page
          path: packing/site/workbench

      # The second and third papers go beside the first, each staged for the same reason
      # the site's pages are: every paper is served from `papers/`, and a name two wrote
      # is refused rather than overwritten.
      - name: Use the checked threshold-bound review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: n11-threshold-bound-review-page
          path: ${{ runner.temp }}/n11-threshold-bound-review-page

      - name: Put the threshold-bound review beside the other paper, refusing any name already there
        env:
          STAGED: ${{ runner.temp }}/n11-threshold-bound-review-page
        working-directory: packing
        run: |
          test -s "$STAGED/papers/n11-threshold-bound-review.html"
          uv run --frozen --group dev python -m devtools.assemble_site --destination site "$STAGED"

      - name: Use the checked optimality review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: n11-optimality-review-page
          path: ${{ runner.temp }}/n11-optimality-review-page

      - name: Put the optimality review beside the other papers, refusing any name already there
        env:
          STAGED: ${{ runner.temp }}/n11-optimality-review-page
        working-directory: packing
        run: |
          test -s "$STAGED/papers/n11-optimality-review.html"
          uv run --frozen --group dev python -m devtools.assemble_site --destination site "$STAGED"

      - name: Use the checked methods explainer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packing-methods-page
          path: ${{ runner.temp }}/packing-methods-page

      - name: Put the methods explainer beside the other papers, refusing any name already there
        env:
          STAGED: ${{ runner.temp }}/packing-methods-page
        working-directory: packing
        run: |
          test -s "$STAGED/papers/packing-methods.html"
          uv run --frozen --group dev python -m devtools.assemble_site --destination site "$STAGED"

      # The papers moved to `papers/<slug>` on 2026-10-01. A page that moved is forwarded
      # by a page of the overview's build; a Markdown file or a PDF cannot forward, so
      # each is served at its old address too, as a copy of the checked file. The list is
      # `render_overview.MOVED_FILES`, and a test holds this step to it.
      - name: Serve each moved file at its old address too
        working-directory: packing/site
        run: |
          moved() {
            test -s "$2"
            if [ -e "$1" ]; then
              echo "::error::$1 is already published, so $2 cannot be copied there"
              exit 1
            fi
            mkdir -p "$(dirname "$1")"
            cp "$2" "$1"
          }
          moved t-018-explainer.md papers/n11-lower-bounds-explainer.md
          moved t-018-explainer.pdf papers/n11-lower-bounds-explainer.pdf
          moved n11-optimality/t-060-explainer.md papers/n11-optimality-review.md
          moved n11-optimality/t-060-explainer.pdf papers/n11-optimality-review.pdf

      - name: List what the publication holds
        working-directory: packing/site
        run: find . -type f -printf '%P\n' | sort | while read -r file; do printf '%10s  %s  %s\n' "$(stat -c %s "$file")" "$(sha256sum "$file" | cut -c1-16)" "$file"; done

      # Every page's head, as the `overview` job checks its own build's, but on the tree
      # that is published: the first that holds the papers and the workbench beside the
      # site's pages. So each of them is read with the rest, and each forwarder is held to
      # the head of the page it leads to, the papers' included. It fetches nothing.
      - name: Check every page's head in the assembled site
        working-directory: packing
        run: uv run --frozen --group dev python -m devtools.check_published_site --local site

      - name: Upload the page artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packing/site

  # The one context a branch rule would require. It passes when every job this run needed
  # passed, and when a job was skipped because its page was out of scope; it fails on any
  # failure or cancellation, and on a skip whose cause was an upstream failure -- that
  # upstream job is also needed here, so its own failure is what fails the aggregate. The
  # scope's outputs must be exactly `true` or `false`, so a scope that wrote nothing
  # cannot pass as a decision to skip everything.
  #
  # `!cancelled()` rather than `always()`, as `packing-required` has had since D-380. With
  # `always()` a run superseded by the next push still queued this job against its
  # cancelled prerequisites: 14 such aggregators on 2026-10-05, four of them waiting about
  # 19 minutes for a runner. A cancelled run now reports nothing here and the check stays
  # pending until the replacement run supplies it. A failed or cancelled prerequisite in a
  # run that goes on is not `cancelled()`, so this job still runs and still fails.
  pages-required:
    if: "!cancelled()"
    needs:
      - scope
      - prepare
      - workbench
      - overview
      - n11-threshold-bound-review
      - n11-optimality-review
      - packing-methods
      - pdf
      - print-layout
      - typography
      - screen
      - geometry
      - font-loading
      - browser-geometry
      - startup-timing
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every page this run builds to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$NEEDS"
          jq -e '
            .scope.result == "success"
            and ([.scope.outputs.n11_lower_bounds_explainer, .scope.outputs.workbench, .scope.outputs.overview, .scope.outputs.n11_threshold_bound_review, .scope.outputs.n11_optimality_review, .scope.outputs.packing_methods] | all(. == "true" or . == "false"))
            and (.scope.outputs.n11_threshold_bound_review != "true" or .["n11-threshold-bound-review"].result == "success")
            and (.scope.outputs.n11_optimality_review != "true" or .["n11-optimality-review"].result == "success")
            and (.scope.outputs.packing_methods != "true" or .["packing-methods"].result == "success")
            and ([.[].result] | all(. == "success" or . == "skipped"))
          ' <<< "$NEEDS" > /dev/null

      # A prerequisite cancelled while this run went on was never given a runner: GitHub
      # cancels a queued job it cannot place ("not acquired by Runner of type hosted even
      # after multiple attempts"), and on 2026-10-05 it did so to 96 jobs (run 37362926042).
      # The step above has already failed on that `cancelled`, and must: a required check
      # does not go green on work that never ran. This step only names the class, so the
      # red reads as infrastructure rather than as a test, and `rerun-starved.yml` re-runs
      # the run's failed jobs once. It runs only after a failure, so a green run pays
      # nothing for it, and a fault here cannot hide the verdict above.
      - name: Name every prerequisite that never acquired a runner
        if: failure()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r '
            [to_entries[] | select(.value.result == "cancelled") | .key] as $starved
            | ($starved[] | "::error title=Infrastructure::\(.) never acquired a runner (cancelled before start)"),
              if ($starved | length) > 0
              then "FAILURE CLASS: infrastructure (\($starved | length) of \(length) prerequisites never acquired a runner: \($starved | join(", ")))"
              else empty end
          ' <<< "$NEEDS" > "$RUNNER_TEMP/infrastructure"
          cat "$RUNNER_TEMP/infrastructure"
          grep '^FAILURE CLASS: ' "$RUNNER_TEMP/infrastructure" >> "$GITHUB_STEP_SUMMARY" || true

      # The wall-check step's start is the stable end of the measured wall: every job
      # above is settled, and this aggregator's checkout and setup are included while the
      # check itself is not. The checkout is blobless and sparse so evidence collection
      # does not become the wall's floor.
      - name: Check out the wall budget and its register
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            packing/devtools/check_pr_wall.py
            packing/devtools/gate-budgets.yaml
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false

      - name: Install uv and Python 3.14
        if: always() && github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          enable-cache: false

      - name: Hold the pull request's wall to its budget
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PREREQUISITES: ${{ toJSON(needs) }}
        run: >-
          uv run --no-project --python 3.14.7 --with PyYAML==6.0.3 python
          packing/devtools/check_pr_wall.py --workflow certificate-page

  # A job with no status function in its `if:` implicitly requires `success()`, which
  # GitHub evaluates over every ancestor, not just `needs:`. The dispatch-only timing job
  # skips on every push (as each page's `*-unchanged` notice job did until 2026-10-05), so
  # without explicit result checks these two jobs skip too: from 2026-09-16 no push to
  # `main` deployed.
  deploy:
    needs: [publish, pages-required]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.publish.result == 'success' && needs.pages-required.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages has to be enabled once, with GitHub Actions as its source: the
      # action's `enablement` input would do it but needs a token other than the
      # workflow's own, so a missing site fails here rather than being created.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-deployment:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The headless shell is all `check_published_site` launches, and it is what every
      # other `playwright-<os>-chromium-<lock>` cache entry holds. Installing full Chromium
      # under that key found the cache already hit, downloaded the browser again, and never
      # saved it, on every deploy (#160 R26).
      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned headless shell and its system libraries
        working-directory: packing
        run: uv run --frozen --group dev python -m playwright install --with-deps --only-shell chromium

      - name: Verify the deployed site
        working-directory: packing
        run: >-
          uv run --frozen --group dev python -m devtools.check_published_site
          --site "${{ needs.deploy.outputs.page-url }}"
          --commit "${{ github.sha }}"
