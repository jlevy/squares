  # A dedicated runner keeps PDF export and the other browser jobs from competing
  # with this descriptive timing experiment. Only an explicit dispatch runs it.
  startup-timing:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
