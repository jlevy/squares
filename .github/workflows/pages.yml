name: Certificate page

"on":
  workflow_dispatch: {}
  # The page is rendered from the retained certificate, so it is republished
  # whenever that certificate, the renderer, or the template moves.
  # The list is every input the renderer reads or imports: the case directory
  # (certificates, coarsening rows, claim documents), the templates, the atlas
  # rendering it inlines as Figure 2, the four composite assets it serves beside
  # the page, the figure record and the module it is read through, the frontier
  # register whose length the opening states, the sqpack modules it imports (it
  # asserts two palette colours at import), the vendored kpress, and the locked
  # environment.
  #
  # Do not maintain this list by reading the renderer. It is declared there, as
  # RENDER_INPUTS, and test_the_pages_filter_covers_every_render_input compares
  # the two; add the input there and the test names what to add here. Four of the
  # entries above are the ones that comparison found already missing (think-bl0n).
  push:
    branches: [main]
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/devtools/render_explainer.py
      - packing/devtools/measure_net_coarsening.py
      - packing/devtools/build_composite_figure_data.py
      - packing/devtools/render_explainer_pdf.py
      - packing/devtools/check_print_layout.py
      - packing/src/sqpack/**
      - packing/frontier/results.yaml
      - packing/atlas/known-best/composite-figure.json
      - packing/atlas/known-best/rendering/n-011.svg
      - packing/devtools/templates/explainer-shell.html
      - packing/devtools/templates/explainer-article.md
      - packing/atlas/known-best/known-best-1-100.svg
      - packing/atlas/known-best/known-best-1-100.png
      - packing/atlas/known-best/known-best-1-100.pdf
      - packing/atlas/known-best/known-best-1-100-card.png
      - vendor/kpress
      - packing/pyproject.toml
      - packing/uv.lock
      - .github/workflows/pages.yml
  # On a pull request the page is built but not deployed, so a change that
  # breaks the render fails review rather than the next deploy.
  pull_request:
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/devtools/render_explainer.py
      - packing/devtools/measure_net_coarsening.py
      - packing/devtools/build_composite_figure_data.py
      - packing/devtools/render_explainer_pdf.py
      - packing/devtools/check_print_layout.py
      - packing/src/sqpack/**
      - packing/frontier/results.yaml
      - packing/atlas/known-best/composite-figure.json
      - packing/atlas/known-best/rendering/n-011.svg
      - packing/devtools/templates/explainer-shell.html
      - packing/devtools/templates/explainer-article.md
      - packing/atlas/known-best/known-best-1-100.svg
      - packing/atlas/known-best/known-best-1-100.png
      - packing/atlas/known-best/known-best-1-100.pdf
      - packing/atlas/known-best/known-best-1-100-card.png
      - vendor/kpress
      - packing/pyproject.toml
      - packing/uv.lock
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: certificate-page-${{ github.ref }}
  # A superseded pull-request build is cancelled; a deployment in flight on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the page cannot be rendered without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The renderer re-decides Conditions 1 through 4 before it writes anything,
      # so a certificate those conditions refuse fails the build instead of being
      # published with an explanation of a bound it does not carry. Condition 5 is
      # a sweep per direction and the case replay gate owns it.
      - name: Render the page from the retained certificate
        run: uv run --frozen --group dev python -m devtools.render_explainer

      # The page is not checked in, so this is where a render that did not reproduce
      # itself byte for byte would show: a second render has to match the first. The
      # renderer also refuses a page that references anything outside itself (a script
      # or stylesheet source, a CSS import, a url() that is not a data URI), so the
      # self-containment check is the renderer's, not a grep here.
      - name: Check the render is deterministic and self-contained
        run: |
          uv run --frozen --group dev python -m devtools.render_explainer --check
          test -s site/index.html
          echo "one file, $(du -h site/index.html | cut -f1)"

      # Playwright's own Chromium, at the revision its pinned wheel names -- so the
      # browser moves when someone bumps that pin and not when a runner image rolls.
      # `--only-shell` is what `chromium.launch()` actually starts: 109 MB against the
      # 291 MB a full `install chromium` pulls, for a binary the exporter never uses.
      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the browser the exporter draws with
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      # After the page, not beside it: the exporter loads `site/index.html` from disk,
      # and Figure 1 references the composite that the render copies into `site/` on its
      # way out.
      - name: Draw the PDF of the page
        run: uv run --frozen --group dev python -m devtools.render_explainer_pdf --update

      # The same question the render answers above, asked of the PDF: two draws in one
      # browser have to agree. Not a comparison against a recorded digest -- the bytes
      # depend on the Chromium build and on the host's fonts, so a recorded digest would
      # fail on the next pin bump and on every contributor's machine, which is the
      # check-that-can-never-pass this repository has already been bitten by.
      - name: Check the PDF reproduces itself
        run: uv run --frozen --group dev python -m devtools.render_explainer_pdf --check

      # Reproducibility is not correctness: the check above would have passed on all
      # three print defects a reader found in the finished PDF, because two identical
      # renders of a wrong page still agree. This one measures the print layout -- the
      # blocks the page declares centred, where the list markers sit, whether a footnote
      # reference opens a line -- at the column the PDF actually has.
      - name: Check the print layout
        run: uv run --frozen --group dev python -m devtools.check_print_layout

      - name: Upload the page artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packing/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages has to be enabled once, with GitHub Actions as its source: the
      # action's `enablement` input would do it but needs a token other than the
      # workflow's own, so a missing site fails here rather than being created.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
