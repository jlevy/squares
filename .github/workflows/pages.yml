      # The trap: see the print geometry step in `typography`.
      - name: Check reserved math geometry under every saved font setting
        run: |
          trap 'exit 130' INT TERM
          mkdir -p /tmp/math-geometry
          geometry_status=0
          uv run --frozen --group dev python -m devtools.prepare_explainer_math site/index.html --host-check --self-test --output /tmp/math-geometry/chromium-1280-custom-serif-screen-controls.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_explainer_math site/index.html --prose-font sans --output /tmp/math-geometry/chromium-1280-custom-sans-screen.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_explainer_math site/index.html --font-set system --output /tmp/math-geometry/chromium-1280-system-serif-screen.json || geometry_status=1
