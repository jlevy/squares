          if-no-files-found: error
          retention-days: 7

  # Saved font settings select different prepared variants before the page hydrates, and
  # every setting must retain its own geometry on this same artifact. The first setting
  # carries the host check and the negative controls, about 41 s of this job's 61; the
  # mobile settings run in `typography` and the print settings in `pdf`.
  geometry:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
