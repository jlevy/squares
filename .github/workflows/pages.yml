name: Certificate page

"on":
  workflow_dispatch:
    inputs:
      trace_pdf:
        description: Retain math geometry and repeated PDF draws for diagnosis
        type: boolean
        default: false
      rebuild_pdf_math_text:
        description: Also test unchanged math text reconstruction (requires trace_pdf)
        type: boolean
        default: false
  # The page is rendered from the retained certificate, so it is republished
  # whenever that certificate, the renderer, or the template moves.
  # The list is every input the renderer reads or imports: the case directory
  # (certificates, coarsening rows, claim documents), the templates, the atlas
  # rendering it inlines as Figure 1, the composite assets it serves beside
  # the page, the figure record and the module it is read through, the frontier
  # register whose length the opening states, the sqpack modules it imports (it
  # asserts two palette colours at import), the vendored kpress, and the locked
  # environment.
  #
  # Do not maintain this list by reading the renderer. It is declared there, as
  # RENDER_INPUTS, and test_the_pages_filter_covers_every_render_input compares
  # the two; add the input there and the test names what to add here. Four of the
  # entries above are the ones that comparison found already missing (think-bl0n).
  push:
    branches: [main]
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/cases/n11_threshold_certificate/**
      - packing/devtools/render_explainer.py
      - packing/devtools/prepare_explainer_math.py
      - packing/devtools/measure_net_coarsening.py
      - packing/devtools/build_composite_figure_data.py
      - packing/devtools/render_explainer_pdf.py
      - packing/tests/test_pdf_math_browser.py
      - packing/devtools/sans_instances.py
      - packing/devtools/check_print_layout.py
      - packing/devtools/inspect_explainer_typography.py
      - packing/devtools/check_math_faces.py
      - packing/devtools/check_math_loading.py
      - packing/devtools/check_math_startup.py
      - packing/devtools/check_scroll_restoration.py
      - packing/devtools/compare_math_fonts.py
      - packing/devtools/sans_instances.py
      - packing/src/sqpack/**
      - packing/frontier/results.yaml
      - packing/atlas/known-best/composite-figure.json
      - packing/atlas/known-best/rendering/**
      - packing/witnesses/known-best/**
      - packing/devtools/templates/explainer-shell.html
      - packing/devtools/templates/explainer-article.md
      - packing/devtools/templates/fonts/**
      - packing/atlas/known-best/known-best-1-100.svg
      - packing/atlas/known-best/known-best-1-100.png
      - packing/atlas/known-best/known-best-1-100.pdf
      - packing/atlas/known-best/known-best-1-100-card.png
      - packing/atlas/known-best/known-best-1-324.svg
      - packing/atlas/known-best/known-best-1-324.png
      - packing/atlas/known-best/known-best-1-324.pdf
      - vendor/kpress
      - packing/pyproject.toml
      - packing/uv.lock
      - .node-version
      - package.json
      - package-lock.json
      - packages/workbench/**
      - packing/devtools/check_published_site.py
      - packing/devtools/pages_scope.py
      - packing/atlas/known-best/manifest.json
      - .github/workflows/pages.yml
  # A pull request builds and checks the pages without deploying them, so a change that
  # breaks a render fails review rather than the next deploy. It has no `paths:` filter:
  # the `scope` job below decides, per page, from each builder's declared inputs, and a
  # page it skips is skipped by a named job that says why. A filter here would be a third
  # hand-kept list of the same inputs, and a pull request it excluded would carry no
  # Certificate page checks at all, which a reader cannot tell from a missing run.
  pull_request:

permissions:
  contents: read

concurrency:
  group: certificate-page-${{ github.ref }}
  # A superseded pull-request build is cancelled; a deployment in flight on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job graph, and why it has this shape.
#
#   scope ─┬─ explainer-unchanged                  (only when the explainer is skipped)
#          ├─ workbench-unchanged                  (only when the workbench is skipped)
#          ├─ workbench ───────────────────────────────┐
#          └─ prepare ─┬─ pdf ─────────────────────────┼─ publish ─┐
#                      ├─ print-layout                 │           ├─ pages-required ─ (pr-wall)
#                      ├─ typography                   │           │
#                      ├─ screen                       │           │
#                      ├─ geometry                     │           │
#                      ├─ font-loading (ff, wk)        │           │
#                      ├─ browser-geometry (ff, wk)    │           │
#                      └─ startup-timing (dispatch)    │           │
#                                                      └───────────┴─ deploy ─ verify-deployment
#
# A pull request waits for its slowest job, so what sets its wall is the longest chain,
# and until 2026-09-15 that chain was `prepare` then one `build` job running about 300 s
# of Chromium checks one after another on a four-cpu runner: 472 s median on the
# workbench stack's pull requests, 381 s on pull requests into `main`, and 471 s on the
# push to `main` that merged the stack (run 35017781374). None of those checks reads
# another's result -- each loads the one prepared page -- so they are split into jobs
# balanced by their measured step times, and the long pole is now `scope`, `prepare` and
# one check job. Every check that ran before still runs, on the same prepared artifact;
# nothing moved off the pull request (`OR-13`).
jobs:
  # Which of the two pages this change can affect. A pull request that touches neither
  # page's inputs does no browser work at all, and a workbench-only change no longer
  # pays for the explainer's checks (#178 did: ten workbench probe files, about 330 s of
  # explainer Chromium). `devtools.pages_scope` derives each half's inputs from the
  # builder's own `RENDER_INPUTS` and from the tools the jobs below run; see its
  # docstring for the rule and its tests for the comparison.
  #
  # It sits on the critical path, so it checks out without `packing/resources` and
  # `packing/campaign` (523 MB of a 665 MB tree) and fetches no blob it does not read.
  # The depth of two is what makes the merge commit's first parent -- the base as GitHub
  # merged it -- available to diff against.
  scope:
    runs-on: ubuntu-latest
    outputs:
      explainer: ${{ steps.scope.outputs.explainer }}
      explainer_reason: ${{ steps.scope.outputs.explainer_reason }}
      workbench: ${{ steps.scope.outputs.workbench }}
      workbench_reason: ${{ steps.scope.outputs.workbench_reason }}
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The declared inputs are read by importing the two builders, and kpress is
          # installed from the submodule.
          submodules: true
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Decide which pages this change has to build
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            uv run --frozen --all-extras --group dev python -m devtools.pages_scope --diff HEAD^1 HEAD
          else
            uv run --frozen --all-extras --group dev python -m devtools.pages_scope --all "a $EVENT event"
          fi

  # A skipped page is skipped by a job with a name, not by a row of grey checks a reader
  # has to interpret. These run only when their page is out of scope, and they fail if
  # the scope job gave no reason, so an empty output cannot pass for a decision.
  explainer-unchanged:
    name: "explainer: no declared input changed, its build and browser checks are skipped"
    needs: scope
    if: needs.scope.outputs.explainer != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Say why the explainer is not built
        env:
          REASON: ${{ needs.scope.outputs.explainer_reason }}
        run: |
          test -n "$REASON"
          echo "The explainer is not built or checked on this run: $REASON."
          echo "The explainer is not built or checked on this run: $REASON." >> "$GITHUB_STEP_SUMMARY"

  workbench-unchanged:
    name: "workbench: no declared input changed, its build is skipped"
    needs: scope
    if: needs.scope.outputs.workbench != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Say why the workbench is not built
        env:
          REASON: ${{ needs.scope.outputs.workbench_reason }}
        run: |
          test -n "$REASON"
          echo "The workbench is not built on this run: $REASON."
          echo "The workbench is not built on this run: $REASON." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: scope
    if: needs.scope.outputs.explainer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      # Without `packing/resources` and `packing/campaign`, but not without the two
      # directories: the renderer links the literature archive as a GitHub `tree/` URL
      # because `packing/resources` is a directory, and would write `blob/` if it were
      # missing, so each keeps its top-level files. Nothing else in the render's import
      # closure reads under either tree (2026-09-15, every module loaded by
      # `render_explainer` and `prepare_explainer_math`, searched for reads and walks).
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the page cannot be rendered without the submodule checked out.
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The math renderer shells out to Node for one batched KaTeX pass. Select the same
      # runtime as validation instead of inheriting the mutable ubuntu-latest image.
      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      # Geometry is measured using the pinned browser during publication. Every
      # browser check below consumes this one artifact, including its reserved boxes.
      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the browser that measures the mathematics
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      # The renderer re-decides Conditions 1 through 4 before it writes anything, so a
      # certificate those conditions refuse fails the build instead of being published
      # with an explanation of a bound it does not carry. Condition 5 is a sweep per
      # direction and the case replay gate owns it. The renderer also refuses a page that
      # references anything outside itself (a script or stylesheet source, a CSS import, a
      # url() that is not a data URI), so self-containment is the renderer's check.
      #
      # The page is not checked in, so this is where a render that did not reproduce
      # itself byte for byte would show: two independent renders have to agree on every
      # file they write. They used to run one after the other, 18 s and then 16 s on the
      # critical path of every run; they now run at once on this four-cpu runner, and the
      # second writes outside `site/` so neither can read or overwrite the other's output.
      # What the concurrent pair no longer re-tests is a second render that starts after
      # the first has finished and reads something it left behind -- and nothing in the
      # render leaves anything behind: its only writes are the output files (2026-09-15,
      # the render's import closure searched for writes and caches).
      - name: Render the page twice and require the renders to agree
        run: |
          twin="$RUNNER_TEMP/render-twin"
          uv run --frozen --group dev python -m devtools.render_explainer --prepare-math --output "$twin/index.html" &
          twin_pid=$!
          uv run --frozen --group dev python -m devtools.render_explainer --prepare-math
          wait "$twin_pid"
          diff --recursive site "$twin"
          test -s site/index.html
          echo "two renders agree; one file, $(du -h site/index.html | cut -f1)"

      - name: Share the prepared page with all browser checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-page
          path: packing/site
          if-no-files-found: error
          retention-days: 7

  # The workbench is a second page inside the same artifact, and it reads nothing the
  # explainer's jobs produce, so it builds beside `prepare` rather than at the end of a
  # queue of explainer checks where it used to sit. It does no browser work. Its checkout
  # is the whole tree, as before: the builder stamps whether the checkout is dirty into
  # the published page, and that is not a reading to change for a few seconds of a job
  # that is not on the critical path.
  workbench:
    needs: scope
    if: needs.scope.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The workbench builder invokes Node too; keep publication on the validation pin.
      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the pinned workbench build toolchain
        working-directory: .
        run: npm ci --ignore-scripts

      # Pages takes `packing/site` whole, so a subdirectory is a URL: this puts the
      # workbench at `/workbench/` and leaves the explainer where it is, at `/`, which
      # readers may already have linked. `--check` builds it twice, at once, and requires
      # the two builds to agree byte for byte.
      - name: Build the workbench at its own URL
        run: uv run --frozen --all-extras --group dev python -m workbench_tools.build_site --check --revision "${{ github.sha }}"

      - name: Share the workbench with the publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workbench-page
          path: packing/site/workbench
          if-no-files-found: error
          retention-days: 7

  # The five Chromium check jobs below were one `build` job of about 300 s. Their split is
  # by measured step time, and the readings are this workflow's own -- run 35039923396,
  # the second run of the split shape -- rather than the queue's they replaced:
  #
  #   pdf           print faces 9, PDF draw 4, PDF controls 22, artifact check 6,
  #                 print geometry 4 x 4.3                                            58 s
  #   print-layout  print layout 35, the page-width overflow control 31               66 s
  #   typography    typography 33, comparison variants 1, startup controls 17,
  #                 mobile screen geometry 4 x 5                                       70 s
  #   screen        math faces 29, font loading 18, reload 9                          56 s
  #   geometry      controls 41, three desktop settings and the alternate
  #                 certificate 4 x 5                                                 61 s
  #
  # on 15 to 30 s of setup each. The grouping follows the measurement where it has to:
  # the startup controls are a screen check, and the fourteen geometry configurations are
  # spread over three jobs, because balanced by cost is what keeps the longest job short.
  # Each job downloads the one prepared page, so all of them check the bytes that are
  # published, and a failure now names its job rather than a step in a 388 s queue.

  # Everything the PDF is: drawn once, from the prepared page, then checked in place and
  # handed to `publish` unchanged.
  pdf:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prepared-page
          path: packing/site

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      # After the page, not beside it: the exporter loads `site/index.html` from disk,
      # and Figure 2 references the composite that the render copies into `site/` on its
      # way out.
      - name: Check the print faces cover every sans weight the page requests
        run: uv run --frozen --group dev python -m devtools.sans_instances --check

      - name: Draw the PDF of the page
        run: uv run --frozen --group dev python -m devtools.render_explainer_pdf --update

      # The production exporter with normal math and with injected font errors and
      # timeouts. The normal-math control reads the PDF drawn above instead of drawing the
      # same production PDF a second time (4.5 s, one of the seven draws this job made);
      # the four fault controls still drive the exporter themselves, because a fault has to
      # be injected into a draw.
      - name: Check PDF math and real font-failure controls
        env:
          SQPACK_PDF_MATH_BROWSER: "1"
        run: uv run --frozen --group dev pytest -q tests/test_pdf_math_browser.py

      # Compare the saved PDF, including its HTML source receipt, to a fresh draw with
      # this runner's browser and fonts. Keep both raw PDFs outside the published site
      # if they disagree; the checker never rewrites the artifact it checks.
      - name: Check the PDF artifact that will be published
        run: uv run --frozen --group dev python -m devtools.render_explainer_pdf --check-artifact --diagnostics-dir /tmp/explainer-pdf-check

      # This opt-in observation can perturb timing. It supplements the ordinary,
      # uninstrumented artifact check above and never replaces its verdict.
      - name: Trace repeated PDF math layout
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf }}
        run: uv run --frozen --group dev python -m devtools.render_explainer_pdf --check --renders 20 --trace-math --diagnostics-dir /tmp/explainer-pdf-trace

      - name: Retain PDF math trace
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explainer-pdf-trace
          path: /tmp/explainer-pdf-trace
          if-no-files-found: error
          retention-days: 7

      # Use the same prepared HTML and runner for both arms. This intervention is
      # diagnostic only; the earlier control failure remains a workflow failure.
      - name: Test prepared math text reconstruction
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf && inputs.rebuild_pdf_math_text }}
        run: uv run --frozen --group dev python -m devtools.render_explainer_pdf --check --renders 20 --trace-math --rebuild-prepared-text --diagnostics-dir /tmp/explainer-pdf-rebuild

      - name: Retain PDF text reconstruction trace
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.trace_pdf && inputs.rebuild_pdf_math_text }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explainer-pdf-rebuild
          path: /tmp/explainer-pdf-rebuild
          if-no-files-found: error
          retention-days: 7

      - name: Retain PDF mismatch diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explainer-pdf-check
          path: /tmp/explainer-pdf-check
          if-no-files-found: ignore
          retention-days: 7

      # The print half of the saved-setting geometry; the screen half is `geometry`.
      # The trap is what lets a cancelled run stop here: `uv run` turns the runner's
      # interrupt into an ordinary exit status, which `|| geometry_status=1` absorbed, so
      # a superseded run kept measuring one setting after another for about 50 s and held
      # the concurrency group for all of it (run 34993121513). The trap exits once the
      # command in flight returns.
      - name: Check reserved print geometry under every saved font setting
        run: |
          trap 'exit 130' INT TERM
          mkdir -p /tmp/math-geometry
          geometry_status=0
          uv run --frozen --group dev python -m devtools.prepare_explainer_math site/index.html --print --output /tmp/math-geometry/chromium-1280-custom-serif-print.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_explainer_math site/index.html --prose-font sans --print --output /tmp/math-geometry/chromium-1280-custom-sans-print.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_explainer_math site/index.html --font-set system --print --output /tmp/math-geometry/chromium-1280-system-serif-print.json || geometry_status=1
          uv run --frozen --group dev python -m devtools.prepare_explainer_math site/index.html --font-set system --prose-font sans --print --output /tmp/math-geometry/chromium-1280-system-sans-print.json || geometry_status=1
          exit "$geometry_status"

      - name: Retain Chromium print geometry observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-geometry-chromium-print
          path: /tmp/math-geometry
          if-no-files-found: error
          retention-days: 7

      # The checked bytes, unchanged: `publish` puts this file beside the prepared page.
      - name: Share the checked PDF with the publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explainer-pdf
          path: packing/site/t-018-explainer.pdf
          if-no-files-found: error
          retention-days: 7

  print-layout:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packing/resources/*/
            !/packing/campaign/*/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prepared-page
          path: packing/site

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium headless shell
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      # Reproducibility is not correctness: the PDF artifact check would have passed on
      # all three print defects a reader found in the finished PDF, because two identical
      # renders of a wrong page still agree. This one measures the print layout -- the
      # blocks the page declares centred, where the list markers sit, whether a footnote
      # reference opens a line -- at the column the PDF actually has, and the second
      # measures the same thing on a page mutated to overflow, so the probe is held to
      # catching what it exists to catch.
      - name: Check the print layout
        run: uv run --frozen --group dev python -m devtools.check_print_layout

      - name: Check the print-layout probe still catches a page-width overflow
        run: uv run --frozen --group dev python -m devtools.check_print_layout --self-check

  typography:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
