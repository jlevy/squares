  # The same prepared page in Firefox and WebKit: mobile font loading and the saved font
  # settings at 1280 px here, the 390 px settings and the reload position in
  # `browser-geometry`. WebKit's page loads are about 7 s against Firefox's 5, and the
  # eight settings in one job made WebKit the longest job of run 35039248281 at 120 s;
  # split this way its two jobs are about 80 s each, on top of an install that the
  # package cache below takes from 30 s to about 14 s.
  font-loading:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
