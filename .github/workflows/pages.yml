name: Certificate page

"on":
  workflow_dispatch: {}
  # The page is rendered from the retained certificate, so it is republished
  # whenever that certificate, the renderer, or the template moves.
  # The list is every input the renderer reads or imports: the case directory
  # (certificates, coarsening rows, claim documents), the templates, the atlas
  # rendering it inlines as Figure 2, the composite it serves beside the page,
  # the sqpack modules it imports (it asserts two palette colours at import),
  # the vendored kpress, and the locked environment.
  push:
    branches: [main]
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/devtools/render_certificate_page.py
      - packing/devtools/measure_net_coarsening.py
      - packing/src/sqpack/**
      - packing/atlas/known-best/rendering/n-011.svg
      - packing/devtools/templates/certificate_page.html
      - packing/devtools/templates/certificate_page.md
      - packing/atlas/known-best/known-best-1-100.png
      - packing/atlas/known-best/known-best-1-100.pdf
      - vendor/kpress
      - packing/pyproject.toml
      - packing/uv.lock
      - .github/workflows/pages.yml
  # On a pull request the page is built but not deployed, so a change that
  # breaks the render fails review rather than the next deploy.
  pull_request:
    paths:
      - packing/cases/n11_fractional_certificate/**
      - packing/devtools/render_certificate_page.py
      - packing/devtools/measure_net_coarsening.py
      - packing/src/sqpack/**
      - packing/atlas/known-best/rendering/n-011.svg
      - packing/devtools/templates/certificate_page.html
      - packing/devtools/templates/certificate_page.md
      - packing/atlas/known-best/known-best-1-100.png
      - packing/atlas/known-best/known-best-1-100.pdf
      - vendor/kpress
      - packing/pyproject.toml
      - packing/uv.lock
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: certificate-page-${{ github.ref }}
  # A superseded pull-request build is cancelled; a deployment in flight on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the page cannot be rendered without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The renderer re-decides Conditions 1 through 4 before it writes anything,
      # so a certificate those conditions refuse fails the build instead of being
      # published with an explanation of a bound it does not carry. Condition 5 is
      # a sweep per direction and the case replay gate owns it.
      - name: Render the page from the retained certificate
        run: uv run --frozen --group dev python -m devtools.render_certificate_page

      # The page is not checked in, so this is where a render that did not reproduce
      # itself byte for byte would show: a second render has to match the first. The
      # renderer also refuses a page that references anything outside itself (a script
      # or stylesheet source, a CSS import, a url() that is not a data URI), so the
      # self-containment check is the renderer's, not a grep here.
      - name: Check the render is deterministic and self-contained
        run: |
          uv run --frozen --group dev python -m devtools.render_certificate_page --check
          test -s site/index.html
          echo "one file, $(du -h site/index.html | cut -f1)"

      - name: Upload the page artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packing/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages has to be enabled once, with GitHub Actions as its source: the
      # action's `enablement` input would do it but needs a token other than the
      # workflow's own, so a missing site fails here rather than being created.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
