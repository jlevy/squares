        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned Chromium browser
        run: uv run --frozen --group dev python -m playwright install --only-shell chromium

      - name: Prepare retained timing inputs
        run: |
          mkdir -p /tmp/math-startup-timing
          cp site/index.html /tmp/math-startup-timing/candidate.html
          gzip --decompress --stdout benchmarks/math-startup/fixtures/control-33cd4760.html.gz > /tmp/math-startup-timing/control-33cd4760.html

      - name: Check the parameter-only measurement controls
        id: timing-controls
        run: uv run --frozen --group dev python -m devtools.check_math_startup --mode parameters --self-test --output /tmp/math-startup-timing/controls.json

      # The tool alternates control/candidate order on successive pairs. Invalid
      # measurements fail the job; numerical speed acceptance is evaluated from
      # these retained observations under the registered experiment criterion.
      - name: Measure twelve desktop startup pairs
        run: uv run --frozen --group dev python -m devtools.check_math_startup --mode parameters --control /tmp/math-startup-timing/control-33cd4760.html --candidate site/index.html --runs 12 --width 1280 --browser chromium --output /tmp/math-startup-timing/startup-1280.json

      - name: Measure twelve mobile startup pairs
        # Retain both widths even if the desktop observations are invalid, provided
        # the instrument's controls passed. A failure still leaves the job red.
        if: ${{ !cancelled() && steps.timing-controls.outcome == 'success' }}
        run: uv run --frozen --group dev python -m devtools.check_math_startup --mode parameters --control /tmp/math-startup-timing/control-33cd4760.html --candidate site/index.html --runs 12 --width 390 --browser chromium --output /tmp/math-startup-timing/startup-390.json

      - name: Retain raw timings and both input pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-startup-timing
          path: /tmp/math-startup-timing
          if-no-files-found: error
          retention-days: 7

  # What the deployment publishes, assembled from the three jobs that produce it: the
  # prepared page and its Markdown edition and composite assets (`prepare`), the checked
  # PDF (`pdf`), and the workbench at `/workbench/` (`workbench`). That is the same tree
  # `build` uploaded when all three were written in one job. It runs on pull requests too
  # -- a missing artifact fails review rather than the next deploy -- and lists every file
  # with its size and digest so the tree can be compared across runs; only a push to
  # `main` uploads it for Pages. It needs the producers and not the checks, so on a pull
  # request it finishes beside the checks rather than after them.
  publish:
    needs: [prepare, pdf, workbench]
    runs-on: ubuntu-latest
    steps:
      - name: Use the prepared page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prepared-page
          path: packing/site

      - name: Use the checked PDF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: explainer-pdf
          path: packing/site

      - name: Use the workbench
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workbench-page
          path: packing/site/workbench

      - name: List what the publication holds
        working-directory: packing/site
        run: find . -type f -printf '%P\n' | sort | while read -r file; do printf '%10s  %s  %s\n' "$(stat -c %s "$file")" "$(sha256sum "$file" | cut -c1-16)" "$file"; done

      - name: Upload the page artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packing/site

  # The one context a branch rule would require. It passes when every job this run needed
  # passed, and when a job was skipped because its page was out of scope; it fails on any
  # failure or cancellation, and on a skip whose cause was an upstream failure -- that
  # upstream job is also needed here, so its own failure is what fails the aggregate. The
  # scope's two outputs must be exactly `true` or `false`, so a scope that wrote nothing
  # cannot pass as a decision to skip everything.
  pages-required:
    if: always()
    needs:
      - scope
      - explainer-unchanged
      - workbench-unchanged
      - prepare
      - workbench
      - pdf
      - print-layout
      - typography
      - screen
      - geometry
      - font-loading
      - browser-geometry
      - startup-timing
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Require every page this run builds to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$NEEDS"
          jq -e '
            .scope.result == "success"
            and ([.scope.outputs.explainer, .scope.outputs.workbench] | all(. == "true" or . == "false"))
            and ([.[].result] | all(. == "success" or . == "skipped"))
          ' <<< "$NEEDS" > /dev/null

  # Lane 3 of think-xfqk (`claude/ci-wall-budget`) adds `pr-wall` here: a trailing job with
  # `needs: pages-required` and `if: always() && github.event_name == 'pull_request'`
  # that reads this run's job timings and holds the pull-request wall to its budget.
  # `pages-required` needs every job a pull request runs, so a job that needs it is the
  # last one in the graph; nothing below this comment runs on a pull request.

  deploy:
    needs: [publish, pages-required]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages has to be enabled once, with GitHub Actions as its source: the
      # action's `enablement` input would do it but needs a token other than the
      # workflow's own, so a missing site fails here rather than being created.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The headless shell is all `check_published_site` launches, and it is what every
      # other `playwright-<os>-chromium-<lock>` cache entry holds. Installing full Chromium
      # under that key found the cache already hit, downloaded the browser again, and never
      # saved it, on every deploy (#160 R26).
      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('packing/uv.lock') }}

      - name: Install the pinned headless shell and its system libraries
        working-directory: packing
        run: uv run --frozen --group dev python -m playwright install --with-deps --only-shell chromium

      - name: Verify the deployed explainer and workbench
        working-directory: packing
        run: >-
          uv run --frozen --group dev python -m devtools.check_published_site
          --site "${{ needs.deploy.outputs.page-url }}"
          --commit "${{ github.sha }}"
