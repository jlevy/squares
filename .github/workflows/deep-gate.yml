          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ needs.resolve-tree.outputs.sha }}
          # This selection has no historical-content review. Keep its shallow checkout;
          # the vendored submodule is still required to resolve the environment.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Bind the receipt to the immutable tree
        env:
          VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          mkdir -p "$PACKING_VALIDATION_ARTIFACT_DIR"
          printf '%s\n' "$VALIDATED_SHA" > "$PACKING_VALIDATION_ARTIFACT_DIR/tree-sha.txt"

      - name: Run exhaustive exact shard 3 of 3
        env:
          PACKING_VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "exhaustive exact behavioral tests"
          --exhaustive-shard 3/3
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  screen:
    # The escape screen alone, mirroring the post-merge `screen` job, and split here for
    # the same reason `D-484` split it there: it is a process pool sized by `PACK_JOBS`,
    # the original shared selection put it beside five other deferrals at
    # `--inner-jobs 2`, giving it two workers. This job uses `--inner-jobs 4` and
    # supplies four workers.
    #
    # Run 34177317419 killed the screen at the shared 900s cap on commit 831697c0.
    # Post-merge run 34176106076 finished the same code at 858.62s an hour earlier.
    # The runners and job selections differed, so those readings do not isolate the
    # cause of the variance. This job gives the pre-merge gate the same screen command
    # and pool allocation as the post-merge gate.
    #
    # This deep-gate job has three hosted readings, also used as the proxy for the
    # post-merge job's identical shape: 944s on run 34188003140, 861s on run 34189176373
    # and 949s on run 34190285360 -- spread 1.10x, geometric mean 917.09s, two of three above
    # the 900s cap this step no longer runs under (`SCREEN_BUDGET_SECONDS` is 1800s). The
    # one local reading, 794.5s at four workers on a four-cpu development box, is the
    # number to argue from least: the hosted runs sit 1.08x to 1.19x above it.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    needs: resolve-tree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the immutable tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.event.inputs` rather than the `inputs` context: the latter is
          # documented as available only to a dispatched or reusable workflow, and
          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ needs.resolve-tree.outputs.sha }}
          # This selection has no historical-content review. Keep its shallow checkout;
          # the vendored submodule is still required to resolve the environment.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Bind the receipt to the immutable tree
        env:
          VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          mkdir -p "$PACKING_VALIDATION_ARTIFACT_DIR"
          printf '%s\n' "$VALIDATED_SHA" > "$PACKING_VALIDATION_ARTIFACT_DIR/tree-sha.txt"

      - name: Run the single-square translation escape screen
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "single-square translation escape screen"
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  regularized-views:
    # The regularized atlas layer re-derived whole (think-bgkz): every record of
    # `atlas/known-best/regularized/` regularized again from its witness, both exact
    # verifications re-run, and the index and every view required byte-identical. The
    # pull request runs its 0.1s digest check in the records tier instead.
    #
    # Its own runner for the screen's reason: it is one process pool sized by
    # `PACK_JOBS`. Measured on 2026-10-02 on a four-cpu host also running other work,
    # it summed 810.6s of record time and took 406.32s at two workers and 223.35s at
    # four; at `--inner-jobs 2` beside the atlas rebuild it would have taken the
    # `deferred-atlas-grid` job (475s on run 36636552951) to about its whole 900s
    # ceiling. The exhaustive shards set this gate's wall, so this runner adds none.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    needs: resolve-tree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the immutable tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tree.outputs.sha }}
          # No historical-content review in this selection; the vendored submodule is
          # still required to resolve the environment.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Bind the receipt to the immutable tree
        env:
          VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          mkdir -p "$PACKING_VALIDATION_ARTIFACT_DIR"
          printf '%s\n' "$VALIDATED_SHA" > "$PACKING_VALIDATION_ARTIFACT_DIR/tree-sha.txt"

      - name: Re-derive the regularized atlas views
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "regularized atlas views re-derive exactly"
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  deep-gate-required:
    # One context for the whole deep surface, exactly as `packing-required` is one
    # context for the whole pull-request surface -- and for the same recorded reason.
    # `D-380` is what a fan-out of separately required checks did here once: superseded
    # runs reporting hard failures, waking a session twice in ten minutes to diagnose a
    # run that had already been replaced. `BC-218` set "the aggregate stays the single
    # required context" as the condition for allowing any job split at all, and this
    # workflow is a job split, so it inherits the condition. A reviewer watches
    # `packing-required` and, when the deep surface is in play, `deep-gate-required`.
    # Never a separately required context per worker.
    #
    # **This adds no always-pending context to an ordinary pull request**, which is the
    # other half of the `D-380` failure mode and the one a new workflow is most likely to
    # reintroduce. Two properties give that:
    #
    #   1. On a pull request with no `deep-gate` label, the `if` below is false and this
    #      job is *skipped*. A skipped job reports a conclusion; a check that never runs
    #      is what sits pending forever, and that is why the label is tested in the job
    #      condition rather than in the `pull_request` trigger's filters.
    #   2. This workflow does not become a prerequisite of `packing-required`.
    #      If it did, every pull request would
    #      wait for the surface this file exists to keep off every pull
    #      request.
    #
    # `!cancelled()` rather than `always()`, again for `D-380`: `cancel-in-progress` is
    # on for pull requests above, so supersession is routine, and a superseded run must
    # leave this unreported rather than report a hard failure. A genuine failure in
    # any job is not `cancelled()`, so it still fails here.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate'))
    needs:
      - resolve-tree
      - deferred-threshold-1440
      - deferred-atlas-grid
      - deferred-controls-finer
      - deferred-threshold-720-rigidity
      - deferred-slow-lane
      - exhaustive-1
      - exhaustive-2
      - exhaustive-3
      - screen
      - regularized-views
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The jobs endpoint, which is where this run's own walls are read from.
      actions: read
    steps:
      - name: Require every deep-gate prerequisite
        env:
          RESOLVE_RESULT: ${{ needs.resolve-tree.result }}
          THRESHOLD_1440_RESULT: ${{ needs.deferred-threshold-1440.result }}
          ATLAS_GRID_RESULT: ${{ needs.deferred-atlas-grid.result }}
          CONTROLS_FINER_RESULT: ${{ needs.deferred-controls-finer.result }}
          THRESHOLD_720_RIGIDITY_RESULT: ${{ needs.deferred-threshold-720-rigidity.result }}
          SLOW_RESULT: ${{ needs.deferred-slow-lane.result }}
          EXHAUSTIVE_1_RESULT: ${{ needs.exhaustive-1.result }}
          EXHAUSTIVE_2_RESULT: ${{ needs.exhaustive-2.result }}
          EXHAUSTIVE_3_RESULT: ${{ needs.exhaustive-3.result }}
          SCREEN_RESULT: ${{ needs.screen.result }}
          REGULARIZED_VIEWS_RESULT: ${{ needs.regularized-views.result }}
        run: |
          test "$RESOLVE_RESULT" = "success"
          test "$THRESHOLD_1440_RESULT" = "success"
          test "$ATLAS_GRID_RESULT" = "success"
          test "$CONTROLS_FINER_RESULT" = "success"
          test "$THRESHOLD_720_RIGIDITY_RESULT" = "success"
          test "$SLOW_RESULT" = "success"
          test "$EXHAUSTIVE_1_RESULT" = "success"
          test "$EXHAUSTIVE_2_RESULT" = "success"
          test "$EXHAUSTIVE_3_RESULT" = "success"
          test "$SCREEN_RESULT" = "success"
          test "$REGULARIZED_VIEWS_RESULT" = "success"

      # **The walls, read against the ceilings that declare them** (`OR-17`: a price
      # nothing reads is not a budget). `ci_gates` in `devtools/gate-budgets.yaml` carries
      # one entry per job above plus the gate's own wall, and this is what compares a
      # finished run against them -- the same rules `packing-validate` is judged by,
      # through `gate_budgets.band_findings`.
      #
      # It costs about 21s: checkout, uv and `uv sync` on a warm cache, measured on the
      # deep jobs' own step timings. It does not move the recorded predecessor wall,
      # which is measured to the last
      # *gating* job and deliberately excludes this one.
      #
      # `always()` because a run whose deep job died slowly is exactly the one whose
      # walls are worth reading, and the verdict above has already been decided by then.
      #
      # **Every step below is `continue-on-error`, including its checkout and its
      # toolchain**, and that is the whole of what keeps this addition safe. A long
      # pre-merge gate must never go red for the measurement tool: an unreachable API, a
      # cache miss or a checkout failure is not a regression, and a false red here costs
      # rerun to clear. The verdict this job reports is decided entirely by
      # the step above. The register's own `enforcement: reporting` is a separate and
      # separately argued relaxation, of the *bands* rather than of the step;
      # `think-haam` owns removing both.
      - name: Check out the wall register and the tool that reads it
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tree.outputs.sha }}
          # kpress is installed from the vendored submodule, so `uv sync` needs it.
          submodules: true

      - name: Install uv and Python 3.14
        if: always()
        continue-on-error: true
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Report every deep-gate wall against its declared ceiling
        if: always()
        continue-on-error: true
        working-directory: packing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --all-extras --group dev
          python -m devtools.check_ci_gate_walls --gate deep-gate
