        run: uv sync --frozen --all-extras --group dev

      - name: Bind the receipt to the immutable tree
        env:
          VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          mkdir -p "$PACKING_VALIDATION_ARTIFACT_DIR"
          printf '%s\n' "$VALIDATED_SHA" > "$PACKING_VALIDATION_ARTIFACT_DIR/tree-sha.txt"

      - name: Run the slow behavioural lane
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "slow behavioral tests"
          --jobs 1 --inner-jobs 2

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  exhaustive-1:
    # The predecessor `exhaustive-tier` job ran 58 independent exact tests serially and
    # set the wall on every measured deep run. The retained JUnit receipt from run
    # 35579234418 packs whole files into three 945.8s, 837.7s and 837.9s shards. Each
    # shard keeps the exact marker, test bodies and four-worker inner cap; only their
    # runner assignment changes.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    needs: resolve-tree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the immutable tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.event.inputs` rather than the `inputs` context: the latter is
          # documented as available only to a dispatched or reusable workflow, and
          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ needs.resolve-tree.outputs.sha }}
          # This selection has no historical-content review. Keep its shallow checkout;
          # the vendored submodule is still required to resolve the environment.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Bind the receipt to the immutable tree
        env:
          VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          mkdir -p "$PACKING_VALIDATION_ARTIFACT_DIR"
          printf '%s\n' "$VALIDATED_SHA" > "$PACKING_VALIDATION_ARTIFACT_DIR/tree-sha.txt"

      - name: Run exhaustive exact shard 1 of 3
        env:
          PACKING_VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "exhaustive exact behavioral tests"
          --exhaustive-shard 1/3
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  exhaustive-2:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    needs: resolve-tree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the immutable tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.event.inputs` rather than the `inputs` context: the latter is
          # documented as available only to a dispatched or reusable workflow, and
          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ needs.resolve-tree.outputs.sha }}
          # This selection has no historical-content review. Keep its shallow checkout;
          # the vendored submodule is still required to resolve the environment.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Bind the receipt to the immutable tree
        env:
          VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          mkdir -p "$PACKING_VALIDATION_ARTIFACT_DIR"
          printf '%s\n' "$VALIDATED_SHA" > "$PACKING_VALIDATION_ARTIFACT_DIR/tree-sha.txt"

      - name: Run exhaustive exact shard 2 of 3
        env:
          PACKING_VALIDATED_SHA: ${{ needs.resolve-tree.outputs.sha }}
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "exhaustive exact behavioral tests"
          --exhaustive-shard 2/3
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  exhaustive-3:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    needs: resolve-tree
    runs-on: ubuntu-latest
    defaults:
      run:
