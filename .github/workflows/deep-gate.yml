name: Deferred checkpoint

# The seven steps the pull-request surface defers, run against a pull request *before* it
# merges rather than after it. Not on every build, and that is the point: the selection
# here is 1943.05s in one step.
#
# **The hole this closes, and it is measured rather than feared.** The header of
# `packing-validation.yml` already concedes it in one sentence -- "a pull request can be
# green while a deferred test is broken" -- and on 2026-09-05 that sentence came true.
# `test_the_retained_n20_certificate_is_accepted_on_the_full_doubled_net` in
# `packing/tests/test_fractional_interval.py` asserted a certificate rung that a later
# commit displaced. It is marked `exhaustive_exact`, so no pull request ran it; every
# pull request was green. Run 34009814108, on the merge commit `6bd136b0` (PR #90),
# failed on `assert enclosure == (Fraction(50007, 50000), ...)` against the moved value,
# and `main` stayed red across `6bd136b0` -> `da06ac25` until `c743d7bb` merged the fix:
# about five hours and three merges. Twice in one day, through the same gap.
#
# The daily `cron: "17 8 * * *"` in `packing-validation.yml` is the only other thing that
# runs this surface, and its own comment is honest about what it is -- a backstop that
# reports a break "up to 24 hours late", by which time the break is on `main` and two
# more merges are sitting on top of it. A backstop is not a gate.
#
# **Why the steps are not simply promoted into `--fast` instead.** Because the
# measurements say no, and they are re-argued every time somebody asks:
# `test_the_pull_request_surface_defers_only_what_was_measured` prices the exhaustive
# tier at 1943.05s, the negative controls at 543.67s and the n=40 bracket at 221.36s
# against a `--fast` band of 700s in `devtools/gate-budgets.yaml`. Twenty-one steps were
# promoted on 2026-09-05 on exactly that arithmetic and these four were refused on it.
# What did not survive contact with `6bd136b0` is the *other* half of that decision --
# the unstated assumption that a deferred step only has to be reported eventually. It has
# to be reported before the merge. It does not have to be reported on every push.
#
# **Why there are three jobs and not two.** Since 2026-09-08 the slow behavioural lane
# has a runner to itself. Run 34177317419, dispatched against PR #116's merge ref, failed
# `deferred-steps` with nothing wrong but two subprocess timeouts -- `single-square
# translation escape screen` at the shared 900s cap and `slow behavioral tests` at its
# own 1800s budget -- while the same two steps passed the same day in the post-merge
# checkpoint (run 34176106076, job `validate`, four cpus at `--jobs 2 --inner-jobs 2`) at
# 858.62s and 1271.96s. What differs between the two runs is contention rather than the
# tree: since the known-best corpus tripled to n = 1..324 in PR #111 this workflow's
# selection is 3131.92s of measured step time, and in one job it has nothing cheap left
# to interleave. The split is argued on `deferred-slow-lane` below; the escape screen's
# own ceiling is argued in `sqpack/cli/validate.py`.
#
# Reviewers request this advisory evidence by label or dispatch. It does not enforce a
# merge prerequisite. This personal repository cannot enable GitHub's organization-only
# merge queue; future queue adoption also requires workflow changes because GitHub shares
# required checks between pull requests and merge groups. See `development.md`.

"on":
  # **The on-demand path, which is what exists today.** `deep-gate` on the pull request
  # runs this; no label runs nothing. `labeled` starts it, and `synchronize` is what
  # keeps it honest -- without it the label would attest to a commit that is no longer
  # the head, which is the same class of stale evidence as the daily backstop. Label
  # last, when the branch is otherwise ready: every push after the label costs another
  # deep run.
  #
  # `opened` creates a run even before the first push or label change. On a pull
  # request with no label every job below is skipped in seconds. A skipped job
  # reports a conclusion; it does not sit pending. That distinction is the whole of the
  # `D-380` argument at the bottom of this file.
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]

  # **The escape hatch.** `pull_request: <number>` checks out that pull request's merge
  # ref and runs the deep surface against it without touching labels -- useful for
  # re-running one after an infrastructure failure, and useful to a reviewer who wants
  # the evidence without changing the author's pull request. Blank runs against whatever
  # ref the dispatch was aimed at. GitHub only offers a `workflow_dispatch` that exists
  # on the default branch, so this input is inert until this file is on `main`.
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull request number to run against (blank: this ref)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Outside the checkout: receipts must not enter source scans or mutation snapshots.
  PACKING_VALIDATION_ARTIFACT_DIR: ${{ github.workspace }}-validation-artifacts

concurrency:
  # Deliberately *not* `packing-validation-...`. Concurrency groups are repository-wide
  # strings, and that group carries `cancel-in-progress` on pull requests: sharing it
  # would let an ordinary push cancel a 32-minute deep run and leave the label attesting
  # to a run that never finished. Different prefix, no interaction in either direction.
  #
  # Keyed by event as well as ref: a pull-request run uses `refs/pull/N/merge`,
  # while a dispatch can target the same ref independently.
  # The dispatch input joins the key so two dispatches aimed at different pull
  # requests do not queue behind one another on `refs/heads/main`.
  group: deep-gate-${{ github.event_name }}-${{ github.event.inputs.pull_request || github.ref }}
  # Supersede pull-request runs only, which is the opposite of the call
  # `packing-validation.yml` makes for its deep jobs -- and for the reason that file
  # gives for making it. There, a cancelled deep run is "the only deep coverage that tree
  # was going to get", because the tree is already merged. Here it is not: a superseded
  # commit is one nobody will merge, the replacement run gets its own deep coverage, and
  # `synchronize` guarantees there is a replacement.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deferred-steps:
    # Five of the seven deferrals: `negative controls` (347.17s), `n=40 rigidity bracket
    # still reproduces` (221.09s), and the three the widened known-best corpus put here
    # on 2026-09-07 -- `known-best n=1..324 atlas rebuild` (407.15s), `single-square
    # translation escape screen` (858.62s) and `exact rational grid replay` (25.93s).
    # The sixth is `deferred-slow-lane` and the seventh is `exhaustive-tier`, both below.
    # Those five figures are one reading each, from run 34176106076's own
    # `validation-timings-validate-1` receipts on 2026-09-08, taken at this job's shape.
    #
    # The three new ones are here on their own measurements, taken at n=1..324 on an idle
    # ten-cpu box and retained in `packing/benchmarks/gate-cost-at-324/`: 691.19s for the
    # rebuild and 766.26s for the screen, against the 210s ceiling on the pull-request
    # job that used to carry both; and 34.81s for the grid replay, inside a step that was
    # 133.4s of a `checks` job running 189.09s against a 195s ceiling. None is deferred
    # without a stand-in -- `known-best atlas records and sample`, `translation escape
    # screen records and sample` and the sampled replay inside `exact verification` run
    # on every pull request -- and this selection is the exact complement of those, not a
    # rerun of them.
    #
    # The grid replay costs this job nothing on the clock. It is 34.81s serial beside a
    # step that is now 858.62s, and its own pool takes it to 18.79s -- measured here, at
    # this job's own `--jobs 2 --inner-jobs 2`, replaying all 305 witnesses over 36.65s
    # of cpu; 25.93s in run 34176106076. A step that finishes inside the wall a longer
    # step already sets is free in the sense that decides where work goes.
    #
    # `--only` rather than a tier flag, and unlike in `packing-validation.yml` that is
    # the correct instrument here. There, `--only` on a pull-request job would have left
    # part of the surface with no declared ceiling, which is `D-466`. Here the selection is
    # by construction not a tier: it is the *complement* of one, it has no entry in
    # `devtools/gate-budgets.yaml`, and `_tier_id` returns `None` for an `--only` run so
    # nothing is judged against a ceiling it does not have. What bounds these steps is
    # their own `budget_seconds`, which `_execute_step` raises the subprocess timeout to
    # -- 1800s for the negative controls and, since 2026-09-08, 1800s for the escape
    # screen, which until then ran on the shared 900s cap it was measured 41s inside.
    # That is the same arrangement the `exhaustive` job in `packing-validation.yml`
    # already runs under.
    #
    # The names are typed here and cannot drift silently:
    # `test_the_deep_gate_runs_exactly_what_the_pull_request_defers` parses these commands
    # with the CLI's own parser, resolves them through its own selector, and requires the
    # union to equal the set no pull-request job runs. An eighth deferral added tomorrow
    # fails that test until it is added here, which is the property the daily backstop
    # never had, and the same test requires these three selections to be disjoint so a
    # step cannot be paid for in two jobs.
    #
    # `--jobs 2 --inner-jobs 2`: five steps, 1859.96s of measured step time, and one of
    # them is 858.62s of it. Two outer slots put the screen on one and the other four
    # (1001.34s between them) on the second, so this job's wall is about a thousand
    # seconds -- half of `exhaustive-tier`, which decides when the gate finishes either
    # way. `--inner-jobs 2` is what the two steps that arrived on 2026-09-07 read: both
    # size their pools from `PACK_JOBS`, and the atlas rebuild is 348.15s at two workers
    # against 691.19s serial on an idle ten-cpu box. Two slots times two workers is the
    # runner's four cpus; a third outer slot buys nothing and takes cpus from the pools,
    # which is `BC-218`'s finding one level down.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blank on every event but `workflow_dispatch`, where it names the pull
          # request's merge ref so a dispatch tests what a merge would produce rather
          # than a branch tip.
          # `github.event.inputs` rather than the `inputs` context: the latter is
          # documented as available only to a dispatched or reusable workflow, and
          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request) || '' }}
          # Kept at full history although the review that argued for it -- the slow
          # retained-theorem review, which reads exact historical Git contents -- left
          # with the slow lane on 2026-09-08. The five steps here reach git only through
          # the negative controls' timing provenance, which is HEAD-relative, but those
          # controls also run 163 declared mutations with commands of their own.
          # Narrowing this checkout is a separate change, and it needs its own evidence
          # rather than a line in a timeout fix.
          fetch-depth: 0
          # kpress is installed from the vendored submodule.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the deferred steps outside the slow lane and the exhaustive tier
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate
          --only "negative controls"
          --only "n=40 rigidity bracket still reproduces"
          --only "known-best n=1..324 atlas rebuild"
          --only "single-square translation escape screen"
          --only "exact rational grid replay"
          --jobs 2 --inner-jobs 2

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  deferred-slow-lane:
    # `slow behavioral tests` alone, on a runner of its own since 2026-09-08, because
    # that is the day it and the escape screen both died of sharing one.
    #
    # The evidence is two runs on the same tree. Run 34177317419, dispatched against
    # PR #116's merge ref, failed `deferred-steps` with two subprocess timeouts and
    # nothing else wrong: this lane at 1800s, its own `FAST_SUITE_BUDGET_SECONDS`, and
    # the escape screen at the 900s cap it then shared with every other step. Run
    # 34176106076, the post-merge checkpoint that day, ran both to completion in its
    # `validate` job at the same four cpus and the same `--jobs 2 --inner-jobs 2`:
    # 1271.96s here and 858.62s there. The difference is not the tree and not the shape,
    # it is what they were sharing a runner with -- sixty-odd steps costing seconds each
    # there, five deferrals costing 1859.96s here. Since PR #111 tripled the known-best
    # corpus to n = 1..324 there is nothing cheap left to interleave, and both of the two
    # long steps ran past their caps.
    #
    # A second job costs billed minutes -- its own checkout, its own `uv sync`, and two
    # lanes that no longer overlap -- and buys an uncontended wall. It buys no wall on
    # the gate itself: 1271.96s here against 1943.05s in `exhaustive-tier`, which decides
    # when the deep gate reports either way. `OR-14` is the rule this follows: put the
    # parallelism where the wall is. The wall this moves is a step's, not the run's, and
    # a step that is killed reports nothing about the five beside it -- which is `D-456`
    # again, one workflow further out.
    #
    # `--jobs 1`: one step, so the outer pool has nothing to schedule.
    #
    # `--inner-jobs 2` rather than 1, and this is the part a single-process lane makes
    # easy to get wrong. Pytest does run in one process here -- the xdist lane is the
    # quick one, which this workflow never runs -- but the lane's two corpus-scaled tests
    # pool their own work through `PACK_JOBS`, and they are 660.6s of the 1260.5s the
    # junit receipt records over 97 tests:
    # `test_known_best_composite_contains_every_case_and_square` at 472.8s, which builds
    # the whole n=1..324 atlas at 691.19s serial against 348.15s at two workers, and
    # `test_a_third_of_the_corpus_certifies_a_weaker_bound_than_it_reports` at 187.8s.
    # `--inner-jobs 1` would hand back about as much wall as this job removes. Four
    # workers on four cpus is what `exhaustive-tier` does and is deliberately not done
    # here: no reading of this lane exists at four, and a timeout fix is not where an
    # unmeasured speedup belongs.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.event.inputs` rather than the `inputs` context: the latter is
          # documented as available only to a dispatched or reusable workflow, and
          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request) || '' }}
          # Full history moved here with the step that needs it. The slow lane contains
          # `test_full_retained_review_and_three_falsifying_controls`, and the review
          # under it reads two historical commits -- `f9ba790a` and `01ca830a` --
          # through `git_content`, so a shallow checkout would fail it on a missing
          # object rather than on the mathematics.
          fetch-depth: 0
          # kpress is installed from the vendored submodule.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the slow behavioural lane
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "slow behavioral tests"
          --jobs 1 --inner-jobs 2

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  exhaustive-tier:
    # The exhaustive exact tier alone, on its own runner, for the reason think-tr2z split
    # it out of the post-merge gate: at 1943.05s it is the one step that decides whether
    # the *other* steps get reported at all. `D-456` is what that looked like -- the tier
    # outgrew its budget, the gate killed it with its output in an unflushed pipe, and
    # three consecutive merges went red saying nothing about the sixty other steps. Run
    # beside `deferred-steps` in one job it would do that here too, and the deep gate's
    # whole value is naming *which* deferral broke before the merge rather than after it.
    #
    # It costs a second runner and no wall: 1943.05s here against about 1000s in
    # `deferred-steps` and 1271.96s in `deferred-slow-lane`, so the gate finishes when
    # this job does whatever the others do. `BC-218` priced a second job at "+3 billed
    # minutes and zero wall" and took it; this one is dearer in minutes and buys a
    # separable verdict, on a workflow requested by label or dispatch. The 2026-09-08
    # split above is the same trade made a third time, and for the sharper reason: the
    # steps it separated were not merely late, they were being killed.
    #
    # Hosted provenance reports four available CPUs. This isolated job gives its
    # certificate pool up to four workers; actual CPU and grid-memory caps still apply.
    # This restores its prior allowed parallelism, without claiming a measured speedup.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.event.inputs` rather than the `inputs` context: the latter is
          # documented as available only to a dispatched or reusable workflow, and
          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request) || '' }}
          # This selection has no historical-content review. Keep its shallow checkout;
          # the vendored submodule is still required to resolve the environment.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the exhaustive exact tier
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "exhaustive exact behavioral tests"
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  deep-gate-required:
    # One context for the whole deep surface, exactly as `packing-required` is one
    # context for the whole pull-request surface -- and for the same recorded reason.
    # `D-380` is what a fan-out of separately required checks did here once: superseded
    # runs reporting hard failures, waking a session twice in ten minutes to diagnose a
    # run that had already been replaced. `BC-218` set "the aggregate stays the single
    # required context" as the condition for allowing any job split at all, and this
    # workflow is a job split, so it inherits the condition. A reviewer watches
    # `packing-required` and, when the deep surface is in play, `deep-gate-required`.
    # Never four contexts.
    #
    # **This adds no always-pending context to an ordinary pull request**, which is the
    # other half of the `D-380` failure mode and the one a new workflow is most likely to
    # reintroduce. Two properties give that:
    #
    #   1. On a pull request with no `deep-gate` label, the `if` below is false and this
    #      job is *skipped*. A skipped job reports a conclusion; a check that never runs
    #      is what sits pending forever, and that is why the label is tested in the job
    #      condition rather than in the `pull_request` trigger's filters. The condition
    #      is typed identically in all four jobs, and
    #      `test_an_unlabelled_opened_pull_request_reports_skipped_deep_jobs` compares
    #      each one against the exact string, so a job added to this workflow cannot
    #      arrive with a looser one -- which is what the 2026-09-08 split had to satisfy.
    #   2. This workflow does not become a prerequisite of `packing-required`, and
    #      `packing-validation.yml` is untouched. If it did, every pull request would
    #      wait 32 minutes for the surface this file exists to keep off every pull
    #      request.
    #
    # `!cancelled()` rather than `always()`, again for `D-380`: `cancel-in-progress` is
    # on for pull requests above, so supersession is routine, and a superseded run must
    # leave this unreported rather than report a hard failure. A genuine failure in any
    # of the three jobs is not `cancelled()`, so it still fails here.
    #
    # Three prerequisites since 2026-09-08 and still one context. The job split that
    # gave the slow lane its own runner changed what has to be waited on, not what is
    # reported, which is exactly the condition `BC-218` attached to splitting at all.
    # `test_the_deep_gate_reports_one_context_and_never_leaves_it_pending` reads `needs`
    # against the job list rather than a typed set, so a fourth job joins this gate or
    # fails that test; it cannot quietly go unrequired.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'deep-gate'))
    needs: [deferred-steps, deferred-slow-lane, exhaustive-tier]
    runs-on: ubuntu-latest
    steps:
      - name: Require every deep-gate prerequisite
        env:
          DEFERRED_RESULT: ${{ needs.deferred-steps.result }}
          SLOW_LANE_RESULT: ${{ needs.deferred-slow-lane.result }}
          EXHAUSTIVE_RESULT: ${{ needs.exhaustive-tier.result }}
        run: |
          test "$DEFERRED_RESULT" = "success"
          test "$SLOW_LANE_RESULT" = "success"
          test "$EXHAUSTIVE_RESULT" = "success"
