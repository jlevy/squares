name: Diagnose webkit fonts

"on":
  push:
    branches: [claude/fix-webkit-font-loading]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    defaults:
      run:
        working-directory: packing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv run --frozen --group dev python -m playwright install --with-deps ${{ matrix.browser }}

      - run: uv run --frozen --group dev python -m devtools.render_explainer

      - name: Diagnostic, held loads
        run: uv run --frozen --group dev python -m devtools.diag_fonts --browser ${{ matrix.browser }} --width 390 --repeat 4

      - name: Diagnostic, no hold
        run: uv run --frozen --group dev python -m devtools.diag_fonts --browser ${{ matrix.browser }} --width 390 --repeat 2 --no-hold

      - name: Real check, three times
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            uv run --frozen --group dev python -m devtools.check_math_loading \
              --browser ${{ matrix.browser }} --width 390 | tail -20 || echo "FAILED $i"
          done
