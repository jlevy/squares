    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the immutable tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.event.inputs` rather than the `inputs` context: the latter is
          # documented as available only to a dispatched or reusable workflow, and
          # this step also runs on `pull_request`, where the event
          # payload simply carries no inputs and this renders empty.
          ref: ${{ github.sha }}
          # This selection has no historical-content review. Keep its shallow checkout;
          # the vendored submodule is still required to resolve the environment.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Bind the receipt to the immutable tree
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          mkdir -p "$PACKING_VALIDATION_ARTIFACT_DIR"
          printf '%s\n' "$VALIDATED_SHA" > "$PACKING_VALIDATION_ARTIFACT_DIR/tree-sha.txt"

      - name: Run exhaustive exact shard 1 of 3
