  measure-verifier:
    # The clean-room measure verifier's tier on a runner of its own (think-th8p). In
    # `checks` it read 84.4s of a 168.3s tier on run 37098372802, and 45.3s of a 137.93s
    # tier against the 140s ceiling on run 37131940076, where every step ran about 1.9x
    # slow. Its compile, tests and controls no longer contend with the perimeter and
    # exact verification, and its cost is the `measure_verifier` tier's own record.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      # The clean-room measure verifier (think-gpe0) is keyed the same way, and every
      # lint, test, build and oracle check still runs in its gate step. Its sources move
      # on most pushes while its dependencies do not, so an exact-only key missed nearly
      # every time and the gate recompiled the whole tree: on run 37098372802 the step was
      # 84.4s of a 168.3s checks tier. So it restores by prefix as the engine does, and a
      # miss compiles the gate's own commands here, with the gate's flags, before the
      # exact-key save can bind this tree to the target. A partial restore leaves the
      # checkout's mtimes alone, so cargo rebuilds the crate and reuses its dependencies;
      # only an exact hit backdates the sources.
      - name: Key the measure verifier cache on its sources and compiler
        id: measure-key
        working-directory: packing/sqverify_fast
        run: |
          rustc_vv="$(rustc -vV)"
          echo "tree=$(git rev-parse HEAD:packing/sqverify_fast)" >> "$GITHUB_OUTPUT"
          echo "rustc=$(printf '%s' "$rustc_vv" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the measure verifier build
        id: measure-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packing/sqverify_fast/target
          key: >-
            ${{ runner.os }}-sqverify-fast-${{ steps.measure-key.outputs.rustc }}-${{
            steps.measure-key.outputs.tree }}
          restore-keys: |
            ${{ runner.os }}-sqverify-fast-${{ steps.measure-key.outputs.rustc }}-

      - name: Populate the measure verifier build for this exact tree
        id: measure-populate
        if: "steps.measure-cache.outputs.cache-hit != 'true'"
        working-directory: packing/sqverify_fast
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --locked --release --all-targets --quiet -- -D warnings
          cargo test --locked --profile gate-test --all-targets --no-run --quiet
          cargo doc --locked --no-deps --quiet
          cargo build --locked --release --quiet

      - name: Date measure verifier sources before their identical cached build
        if: "steps.measure-cache.outputs.cache-hit == 'true'"
        run: git ls-files -z -- sqverify_fast | xargs -0 touch -t 200001010000

      - name: Key the native n17 kernel cache on its sources and compiler
        id: n17-native-key
        working-directory: packing/n17bb_native
        run: |
          rustc_vv="$(rustc -vV)"
          echo "tree=$(git rev-parse HEAD:packing/n17bb_native)" >> "$GITHUB_OUTPUT"
          echo "rustc=$(printf '%s' "$rustc_vv" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the native n17 kernel build
        id: n17-native-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packing/n17bb_native/target
          key: >-
            ${{ runner.os }}-n17bb-native-${{ steps.n17-native-key.outputs.rustc }}-${{
            steps.n17-native-key.outputs.tree }}
          restore-keys: |
            ${{ runner.os }}-n17bb-native-${{ steps.n17-native-key.outputs.rustc }}-

      # The build helper runs the same floor and builds the gate's step uses, so a populated
      # target leaves the step only incremental work.
      - name: Populate the native n17 kernel build for this exact tree
        id: n17-native-populate
        if: "steps.n17-native-cache.outputs.cache-hit != 'true'"
        run: >-
          uv run --frozen --all-extras --group dev python -m devtools.build_n17_bb_native
          --output-dir n17bb_native/target/python

      - name: Date native n17 kernel sources before their identical cached build
        if: "steps.n17-native-cache.outputs.cache-hit == 'true'"
        run: git ls-files -z -- n17bb_native | xargs -0 touch -t 200001010000

      - name: Run the required pull-request measure verifier tier
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --measure-verifier --jobs 1 --inner-jobs 1

      - name: Save the measure verifier build intermediates
        if: >-
          always() && steps.measure-cache.outcome == 'success' &&
          steps.measure-cache.outputs.cache-hit != 'true' &&
          steps.measure-populate.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packing/sqverify_fast/target
          key: ${{ steps.measure-cache.outputs.cache-primary-key }}

      - name: Save the native n17 kernel build intermediates
        if: >-
          always() && steps.n17-native-cache.outcome == 'success' &&
          steps.n17-native-cache.outputs.cache-hit != 'true' &&
          steps.n17-native-populate.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packing/n17bb_native/target
          key: ${{ steps.n17-native-cache.outputs.cache-primary-key }}

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
