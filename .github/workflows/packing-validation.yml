          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  post-merge-required:
    # Separate complete-checkpoint verdict. Pull requests retain exactly ten fast jobs.
    if: "!cancelled() && github.event_name != 'pull_request'"
    needs:
      - validate
      - deferred-threshold-1440
      - deferred-atlas-grid
      - deferred-controls-finer
      - deferred-threshold-720-rigidity
      - slow-lane
      - exhaustive-1
      - exhaustive-2
      - exhaustive-3
      - screen
      - regularized-views
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every complete-checkpoint prerequisite
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          THRESHOLD_1440_RESULT: ${{ needs.deferred-threshold-1440.result }}
          ATLAS_GRID_RESULT: ${{ needs.deferred-atlas-grid.result }}
          CONTROLS_FINER_RESULT: ${{ needs.deferred-controls-finer.result }}
          THRESHOLD_720_RIGIDITY_RESULT: ${{ needs.deferred-threshold-720-rigidity.result }}
          SLOW_RESULT: ${{ needs.slow-lane.result }}
          EXHAUSTIVE_1_RESULT: ${{ needs.exhaustive-1.result }}
          EXHAUSTIVE_2_RESULT: ${{ needs.exhaustive-2.result }}
          EXHAUSTIVE_3_RESULT: ${{ needs.exhaustive-3.result }}
          SCREEN_RESULT: ${{ needs.screen.result }}
          REGULARIZED_VIEWS_RESULT: ${{ needs.regularized-views.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$THRESHOLD_1440_RESULT" = "success"
          test "$ATLAS_GRID_RESULT" = "success"
          test "$CONTROLS_FINER_RESULT" = "success"
          test "$THRESHOLD_720_RIGIDITY_RESULT" = "success"
          test "$SLOW_RESULT" = "success"
          test "$EXHAUSTIVE_1_RESULT" = "success"
          test "$EXHAUSTIVE_2_RESULT" = "success"
          test "$EXHAUSTIVE_3_RESULT" = "success"
          test "$SCREEN_RESULT" = "success"
          test "$REGULARIZED_VIEWS_RESULT" = "success"

      # Report the eleven prerequisite walls and their critical path after the verdict has
      # already been decided. Every reporting step continues on error: an API or setup
      # failure is not allowed to turn a successful complete checkpoint red, while the
      # register remains reporting-only under think-0atx until this topology is measured.
      - name: Check out the post-merge wall register and reader
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true

      - name: Install uv and Python 3.14 for wall reporting
        if: always()
        continue-on-error: true
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Report every post-merge wall against its declared ceiling
        if: always()
        continue-on-error: true
        working-directory: packing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --all-extras --group dev
          python -m devtools.check_ci_gate_walls --gate post-merge

  packing-required:
    # `!cancelled()` rather than `always()`. With `always()`, a run superseded by the next
    # push -- which `cancel-in-progress: true` above makes routine, and which `OR-3`'s
    # "push, then keep working" makes frequent -- reaches this job with
    # `needs.validate.result == 'cancelled'` and reports the required check as a hard
    # failure. Twice in ten minutes on 2026-08-30, each time waking a session to diagnose
    # a run that had been replaced by a newer one (D-380).
    #
    # This does not weaken the gate. A genuine `validate` failure is not `cancelled()`, so
    # the job still runs and still fails. A cancelled run reports nothing, which leaves the
    # required check pending rather than green -- the safe direction, and the reason the
    # header comment warns against *path* filtering is unaffected, since supersession
    # always starts a replacement run that supplies the check.
    #
    # Every part of the pull-request surface is named here, and this job staying the
    # single required context is the reason the split is allowed to exist: `BC-218` set
    # that as the condition for any fan-out, because `D-380` records what a fan-out of
    # separately required checks did to this repository once. A reviewer still watches one
    # context; it has ten prerequisites now.
    #
    # `needs` alone is not enough, which is why every prerequisite also has a `test` line
    # below. This job runs under `!cancelled()`, so it is reached even when a prerequisite
    # failed, and it is the shell that decides -- a job named in `needs` and missing from
    # the script is an advisory check nothing blocks on.
    #
    # `!cancelled()` is about the run. A prerequisite GitHub cancelled because no hosted
    # runner took it reaches this job as `cancelled` in a run that is not, and still fails
    # it; the step after the verdict names that class as infrastructure.
    if: "!cancelled() && github.event_name == 'pull_request'"
    needs:
      [validate, frontend, typecheck, geometry, suite-a, suite-b, suite-c, suite-d, sweeps,
       measure-verifier]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every pull-request prerequisite
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          GEOMETRY_RESULT: ${{ needs.geometry.result }}
          SUITE_A_RESULT: ${{ needs.suite-a.result }}
          SUITE_B_RESULT: ${{ needs.suite-b.result }}
          SUITE_C_RESULT: ${{ needs.suite-c.result }}
          SUITE_D_RESULT: ${{ needs.suite-d.result }}
          SWEEPS_RESULT: ${{ needs.sweeps.result }}
          MEASURE_VERIFIER_RESULT: ${{ needs.measure-verifier.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$TYPECHECK_RESULT" = "success"
          test "$GEOMETRY_RESULT" = "success"
          test "$SUITE_A_RESULT" = "success"
          test "$SUITE_B_RESULT" = "success"
          test "$SUITE_C_RESULT" = "success"
          test "$SUITE_D_RESULT" = "success"
          test "$SWEEPS_RESULT" = "success"
          test "$MEASURE_VERIFIER_RESULT" = "success"

      # A prerequisite cancelled while this run went on was never given a runner: GitHub
      # cancels a queued job it cannot place ("not acquired by Runner of type hosted even
      # after multiple attempts"), and on 2026-10-05 it did so to 96 jobs (run 37362926042).
      # The step above has already failed on that `cancelled`, and must: a required check
      # does not go green on work that never ran. This step only names the class, so the
      # red reads as infrastructure rather than as a test, and `rerun-starved.yml` re-runs
      # the run's failed jobs once. It runs only after a failure, so a green run pays
      # nothing for it, and a fault here cannot hide the verdict above.
      - name: Name every prerequisite that never acquired a runner
        if: failure()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r '
            [to_entries[] | select(.value.result == "cancelled") | .key] as $starved
            | ($starved[] | "::error title=Infrastructure::\(.) never acquired a runner (cancelled before start)"),
              if ($starved | length) > 0
              then "FAILURE CLASS: infrastructure (\($starved | length) of \(length) prerequisites never acquired a runner: \($starved | join(", ")))"
              else empty end
          ' <<< "$NEEDS" > "$RUNNER_TEMP/infrastructure"
          cat "$RUNNER_TEMP/infrastructure"
          grep '^FAILURE CLASS: ' "$RUNNER_TEMP/infrastructure" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Check out the wall budget and its register
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            packing/devtools/check_pr_wall.py
            packing/devtools/gate-budgets.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install uv and Python 3.14
        if: always() && github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          enable-cache: false

      - name: Hold the pull request's wall to its budget
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PREREQUISITES: ${{ toJSON(needs) }}
        run: >-
          uv run --no-project --python 3.14.7 --with PyYAML==6.0.3 python
          packing/devtools/check_pr_wall.py --workflow packing-validation

  macos-portability:
    # A second-architecture smoke check, deliberately minimal.
    #
    # This job used to run the complete validation surface plus a deep golden rebuild,
    # which duplicated the Linux `validate` job in full. That was both slow and wrong in
    # kind: the record, schema, lint, docs and provenance surfaces are platform
    # independent, so running them twice buys nothing. It also made the job depend on
    # `cairosvg`, whose `libcairo` is absent from the macOS runner, so the job failed on
    # every push to main regardless of the change -- and a check that can never pass
    # teaches everyone to ignore CI, which is worse than not having it.
    #
    # What belongs here is only what a second architecture could actually disagree
    # about: that the package builds and imports on arm64, that the exact predicates
    # decide the same way, and that the golden basin maps computed here match the ones
    # committed from Linux. That last one is the float-determinism canary and costs
    # under a second.
    #
    # Everything algorithmic, and everything about the research record, stays on Linux.
    #
    # It now runs on pull requests too. It was previously skipped on them, which is why
    # the libcairo breakage was only ever visible after a merge, on a branch nobody was
    # about to fix. At roughly thirty seconds that exclusion no longer buys anything: a
    # check this cheap belongs before the merge, where it can still change the outcome.
    #
    # The merge that matters is the one into `main`, so a pull request runs it only when
    # `main` is its base. A stacked pull request, whose base is the branch below it, is a
    # layer of a tree the stack's pull request into `main` will check again: on 2026-10-05
    # the stacks' layers ran 129 macOS jobs (309 macOS minutes) for that one question.
    # Every other event still runs it -- the push to `main`, the daily schedule, and a
    # dispatch, which is a request for it. Nothing waits on it: `packing-required` does not
    # name it, and the wall check treats it as `not_gating`, so a skip changes no verdict.
    if: "github.event_name != 'pull_request' || github.base_ref == 'main'"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Shallow is enough: the provenance step that needed full history runs on Linux.
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: The package builds and imports on arm64 macOS
        run: >-
          uv run --frozen --all-extras --group dev python -c "import sqpack, sqpack.field, sqpack.verify,
          sqpack.witness, sqpack.promote.refine, sqpack.promote.contacts;
          print('sqpack imports on', __import__('platform').machine())"

      - name: Results a second architecture could disagree about
        # Exact predicates, the small-n exact models, and the golden basin maps
        # committed from Linux. Roughly twenty seconds; if it grows, something
        # platform-independent has been added and belongs on Linux instead.
        run: >-
          uv run --frozen --all-extras --group dev packing-validate
          --only "exact verification"
          --only "verifier perturbation limits"
          --only "small-n exact models"
          --only "golden basin maps"
          --jobs 4 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
