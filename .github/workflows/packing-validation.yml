name: Packing validation

"on":
  workflow_dispatch: {}
  # Daily, not weekly, since BC-214. The pull-request surface no longer runs the slow
  # behavioural lane or the exhaustive tier, so this schedule is the backstop that reports
  # a deferred test breaking on a branch that never reached `main`. Weekly would put up to
  # seven days between the break and the run that names it, and the deep surface is runner
  # time nobody waits on -- which is the whole point of having moved it here.
  schedule:
    - cron: "17 8 * * *"
  # Keep the stable packing-required context present for every pull request. Path-level
  # filtering would leave a configured required check pending forever when no path matched.
  pull_request: {}
  # No path filter. The project now spans the repository root (README, SYNOPSIS,
  # TUTORIAL, conventions, development, defects and docs/, all of which the gate
  # checks) as well as packing/, so a filter that still named one subtree would
  # skip the gate on exactly the documents it validates.
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Outside the checkout: receipts must not enter source scans or mutation snapshots.
  PACKING_VALIDATION_ARTIFACT_DIR: ${{ github.workspace }}-validation-artifacts

concurrency:
  # Keyed by event as well as ref, so a scheduled deep run and a push-to-main deep run --
  # both on `refs/heads/main` -- stop cancelling each other.
  group: packing-validation-${{ github.event_name }}-${{ github.ref }}
  # Supersede pull-request runs only. Dropping a superseded pull-request run is what makes
  # "push, then keep working" cheap, and the `!cancelled()` guard on `packing-required`
  # below (D-380) exists because that supersession is routine. On `main` and on the
  # schedule the trade is now the other way round: since BC-214 those are the only runs
  # that execute the slow behavioural lane and the exhaustive tier, so a cancelled deep run
  # is not a superseded duplicate -- it is the only deep coverage that tree was going to
  # get.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # `actions: read` for one step, after a push to `main`: `devtools.verified_merge_tree`
    # reads this repository's artifacts and runs to find the pull-request run that already
    # passed the pushed tree. Nothing in this job writes to the repository.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The provenance step verifies historical engine commits, not just HEAD, and it
          # is an edit-tier step, so the pull-request surface needs the history too.
          fetch-depth: 0
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      # The tree this pull-request run validates, published as an artifact named for it,
      # so the post-merge run of the same bytes can prove this run passed them instead of
      # running the fast surface on them a second time (`devtools.verified_merge_tree`).
      # The id is the checked-out commit's -- GitHub's test merge, which every job in this
      # run checks out -- and the artifact proves nothing on its own: the post-merge step
      # accepts it only from a completed `pull_request` run of this workflow whose
      # conclusion is success, so a run that later fails or is cancelled licenses nothing.
      - name: Record the tree this pull-request run validates
        id: pull-request-tree
        if: "github.event_name == 'pull_request'"
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p "$RUNNER_TEMP/pull-request-tree"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/pull-request-tree/tree"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Publish the validated tree id
        if: "github.event_name == 'pull_request'"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pull-request-tree-${{ steps.pull-request-tree.outputs.tree }}
          path: ${{ runner.temp }}/pull-request-tree/tree
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      # Only this job builds the engine, and `_build_engine` runs it *before* the executor
      # rather than inside it, so `cargo build --locked --release` is a serial prefix on
      # this job's whole wall.
      #
      # **The cache hit on every run from 2026-09-06 to 09-15 and the build still cost
      # 12.6-13.5s**, with nothing under `packing/sqsearch` committed since 09-05. Cargo
      # judges a path crate by mtime: checkout dates `src/*.rs` now, and the restored
      # `dep-bin-sqsearch` fingerprint keeps the date of the run that saved it, so every
      # restore was older than its sources and the whole crate relinked under
      # `lto = "fat"`. Reproduced locally with `CARGO_LOG=cargo::core::compiler::fingerprint
      # =info`: `stale: changed src/main.rs` against `dep-bin-sqsearch`, one unit rebuilt.
      #
      # So the key is the tracked `packing/sqsearch` tree id plus `rustc -vV`, and only an
      # exact hit backdates the files that tree id covers. On an exact hit the restored
      # build was made from byte-identical sources by the same compiler, so dating them
      # before it is true. A partial restore leaves the checkout's mtimes alone and cargo
      # rebuilds; backdating a changed file was measured to serve the old binary, which is
      # why the `if:` below is not optional. The old key was `Cargo.lock` alone, so the one
      # entry saved on 09-06 was never replaced. `rustc -vV` also installs the pinned
      # toolchain from `rust-toolchain.toml` here rather than inside the gate's build.
      - name: Key the engine cache on its sources and its compiler
        id: engine-key
        working-directory: packing/sqsearch
        run: |
          rustc_vv="$(rustc -vV)"
          echo "tree=$(git rev-parse HEAD:packing/sqsearch)" >> "$GITHUB_OUTPUT"
          echo "rustc=$(printf '%s' "$rustc_vv" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the Rust build for the engine
        id: engine-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packing/sqsearch/target
          key: >-
            ${{ runner.os }}-sqsearch-${{ steps.engine-key.outputs.rustc }}-${{
            steps.engine-key.outputs.tree }}
          restore-keys: |
            ${{ runner.os }}-sqsearch-${{ steps.engine-key.outputs.rustc }}-

      - name: Date the engine sources before the build restored for them
        if: "steps.engine-cache.outputs.cache-hit == 'true'"
        run: git ls-files -z -- sqsearch | xargs -0 touch -t 200001010000

      # `--fast` is the pull-request surface, and two separate pieces of work in one day
      # made it what it is. They pull in opposite directions on purpose.
      #
      # **Coverage went up.** Since 2026-09-05 the tier is fifty-eight of sixty-one steps,
      # against thirty-seven before. Twenty-four steps used to run only after a merge, and
      # two defects reached main through that gap and sat red for nine hours -- `D-455` in
      # `deterministic SVG rendering` and `D-456` in the exhaustive tier -- neither of them
      # something a pull request could have caught. The three still deferred are argued by
      # their measurements above `STEPS`: the exhaustive tier at 1943.05s, the negative
      # controls at 543.67s, the n=40 bracket at 221.36s.
      #
      # **Cost went down**, which is what made that affordable. The tier was 1369.60s on
      # this runner (run 33982455466), of which `fast behavioral tests` was 96.7 per cent.
      # Three measured changes took it to 177.02s: the behavioural suite splits by marker
      # so the slow tail runs on the deep surface (`BC-214`); the quick lane runs under
      # xdist, because a second GitHub job cannot shorten a wall that is one step
      # (`BC-218`, which priced a second job at zero wall and +3 billed minutes); and the
      # surface moved to `--jobs 3`, which it has since left in both directions -- see the
      # three-way split below.
      #
      # Two results worth not rediscovering. Cutting the behavioural suite from the pull
      # request was the obvious move and the measurement refused it: the eight real
      # failures it caught that day were 0.46s of call time between them, so the wall was
      # never where the detection was -- which is `OR-13`. And the quick lane sizes itself
      # to `cpus - jobs + 1` rather than to the machine: asking for every cpu beside two
      # other lanes put nineteen ordinary tests over the per-test ceiling on contention
      # alone, and a ceiling measured under oversubscription exiles tests for having noisy
      # neighbours.
      #
      # Nothing became optional. `QUICK_TESTS` and `SLOW_TESTS` are complements within the
      # non-exhaustive suite and `EXHAUSTIVE_TESTS` is the rest, so every test is in
      # exactly one lane, and the post-merge jobs are checked disjoint and exhaustive by
      # `test_the_post_merge_jobs_partition_the_gate`. What the split costs is stated
      # rather than hidden: a pull request can be green while a deferred test is broken.
      #
      # **Then the promotion had to be paid for, and this is where.** The merged tier ran
      # 501.97s at commit `30706bcb`, of which `known-best n=1..100 atlas` was 254.92s and
      # `prospective n=101..324 source map and safe seed` 213.19s. Reverting the promotion
      # was refused on coverage grounds, so the cost is bought with more runners instead:
      # `--checks` here, `--geometry`, `--suite` and `--sweeps` in the three jobs below.
      # The four are a partition of `--fast`, they run concurrently, and a pull request
      # waits for the longest of them rather than for their sum. All four are required
      # through `packing-required`.
      #
      # **Two runners were not enough, and the second cut is measured too.** Run
      # 34010470187 on the two-job surface: `checks` 221.70s against `sweeps` 110.66s.
      # Two things were wrong with that. It was unbalanced by a factor of two, and
      # 142.43s of the longer half was a single step -- `fast behavioral tests` -- so no
      # `--jobs` setting could divide it, which is the same `BC-218` finding one level
      # down. Giving that step its own job takes it out of this queue *and* takes it from
      # two xdist workers to four, because `_pytest_workers` is `cpus - jobs + 1` and
      # this job was three of the four cpus.
      #
      # **Three runners were not enough either, and this is where `--jobs 4` was tried
      # and refused.** What was left here after the lane moved out was 57 steps of pure
      # outer-parallel work with no unit large enough to floor the job, so it was given
      # the freed cpu: four units on four cpus. Run 34016999060 priced that shape at
      # 198.22s of tier wall inside a 218s job, against 221.70s for the three-worker job
      # that still had the 142.43s lane inside it. Removing the largest step on the
      # surface and adding a worker bought 23.5s, because saturating the runner inflated
      # every step by thirty to eighty per cent against the same steps at `--jobs 3` on
      # the run before it:
      #
      #     soundness perimeter          60.62s -> 84.41s
      #     exact verification           61.75s -> 79.98s
      #     type floor (basedpyright)    40.37s -> 72.31s
      #     deterministic SVG rendering  41.30s -> 65.36s
      #     historical regressions       36.04s -> 50.00s
      #     the decimal route            40.40s -> 49.34s
      #     D-034's n=5 identity pair    34.18s -> 41.85s
      #
      # Four workers over 790 inflated worker-seconds is the same work bought at a worse
      # price than three over 470, and it is the lesson `_pytest_workers` already encodes
      # as `cpus - jobs + 1`. It is also not a scheduling problem: 790 worker-seconds
      # against four cpus has a floor no arrangement of one job reaches.
      #
      # **So the fourth job buys cpus, not schedule.** `--geometry` below is the other
      # half of this queue, and the two run at `--jobs 3` on separate runners: eight cpus
      # and two cores of headroom for work that had four cpus and none. The halves are
      # 269.60s and 275.48s of a local 545.08s step-time reading, within two per cent of
      # each other, and at the reference shape on that box they come in at 86.20s and
      # 93.27s of wall. The boundary between them is argued on `Step.geometry` -- only
      # `broad` steps may cross, so `--edit` stays wholly inside this job, and no engine
      # step or cargo step may cross, so only this job pays the serial
      # `cargo build --release` that `_build_engine` puts in front of everything. On a
      # cold runner that build is about 25s of this job's wall and none of the other's.
      #
      # `--jobs 3` rather than 4 for the reason the table above gives, and rather than 2
      # because the deflation does not pay for the idle worker: 244.77s of step time over
      # two workers is about 122s of wall against the 86.20s three workers actually
      # measured, so a second core of headroom would cost this job more than the fourth
      # worker ever cost it.
      #
      # **2026-09-15: the surface spiralled back to 284s, and the cut was more runners
      # again, not less coverage.** `suite` had grown to 262s of pytest over 5,664-6,095
      # tests with no single test to blame, and `checks` sat exactly at its cpu floor --
      # cargo plus step time over three slots, with basedpyright (79-104s, one process) and
      # `exact verification` (116-120s, seventeen serial processes) as its two largest
      # units. So `fast behavioral tests` is divided by test file across two shard jobs,
      # the type floor has a runner of its own (`--typecheck`), and `exact verification`
      # runs its subprocesses concurrently inside this job's free cpus. The readings are in
      # `devtools/gate-budgets.yaml`, one entry per part.
      #
      # Nothing left the surface to buy any of this. The six jobs still select every
      # step `--fast` does, and the two shards run every test the lane selects exactly
      # once, which is what `test_the_pull_request_jobs_partition_the_surface` checks --
      # `OR-13`, and the same refusal recorded two paragraphs up.
      #
      # Not a subset, and that distinction is the reason these are tier flags rather than
      # `--skip`. `--skip` narrows a tier while still reporting it, so this job would have
      # been judged against `--fast`'s recorded 502.3s and failed for finishing early;
      # `--only` reports no tier at all and would have left every part of the
      # pull-request surface with no declared ceiling, which is `D-466` exactly.
      # `--checks`, `--geometry`, `--typecheck`, `--sweeps` and each `--suite --shard`
      # carry their own entry in `devtools/gate-budgets.yaml`.
      #
      # `test_the_pull_request_jobs_partition_the_surface` reads this file, parses these
      # commands with the CLI's own parser and resolves them through its own selector, and
      # requires the step selections to be pairwise disjoint -- the two shards excepted,
      # which must name every shard once and share only the lane they divide -- and to
      # cover every step outside the ones
      # `test_the_pull_request_surface_defers_only_what_was_measured` pins. A step added
      # tomorrow lands in one of the jobs or fails that test.
      - name: Run the required pull-request checks
        if: "github.event_name == 'pull_request'"
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --checks --jobs 3 --inner-jobs 1

      # Everything except the two isolated behavioural lanes below. The three selections
      # partition the gate without paying for any step twice, and
      # `test_the_post_merge_jobs_partition_the_gate` is what keeps them a partition when a
      # step is added.
      #
      # `--skip` is the only narrowing allowed here, and only because that test proves it
      # is still a partition. A *tier* flag on this command would be a different thing and
      # is not allowed: a tier is a filter nothing checks the complement of, so it is how a
      # step ends up in neither surface, which is the gap `D-455` and `D-456` came through.
      #
      # Run numeric steps serially at two inner workers. Run 34181619739, on PR #121's
      # branch after it took PR #116's job split, timed out the escape screen at 1800s
      # with two numeric pools sharing a runner; the serial deferred replay in run
      # 34183723509 completed it in 1069.84s.
      # The slow lane also gets its own runner: run 34177317419 timed it out at 1800s
      # while it shared the deferred job. This changes scheduling, not coverage.
      #
      # After a push, the fast steps a successful pull-request run already passed on this
      # exact tree are not run again. On 2026-09-15 this job was 53 minutes after the merge
      # of #177 (run 35002298828), 830s of its step time the same fast steps that PR's run
      # had passed on byte-identical bytes -- and `development.md` measured 53 of 55 merges
      # carrying the pull-request head's tree unchanged. The proof is the tree id, not a
      # label: the step below finds the artifact the pull-request run published under that
      # id and accepts it only from a successful `pull_request` run of this workflow in
      # this repository, and otherwise names nothing and the complete surface runs.
      # Deferred steps and the three that read beyond the tree (`Step.reads_beyond_tree`)
      # run either way, which is what keeps `OR-13` whole. Never on the schedule: the daily
      # run is the backstop, and it re-reads a tree on purpose.
      - name: Find the pull-request run that already passed this tree
        id: verified-tree
        if: "github.event_name == 'push'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen --all-extras --group dev python -m devtools.verified_merge_tree
          --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

      - name: Run the complete integration surface
        if: "github.event_name != 'pull_request'"
        env:
          PACKING_VALIDATE_TREE_VERIFIED_BY_RUN: ${{ steps.verified-tree.outputs.run }}
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --skip "exhaustive exact behavioral tests"
          --skip "slow behavioral tests"
          --skip "single-square translation escape screen"
          --jobs 1 --inner-jobs 2

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  slow-lane:
    # The full slow lane stays off the ordinary pull-request surface. Its corpus tests
    # use PACK_JOBS internally, so retain two inner workers on this isolated runner.
    if: "github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Retained-theorem reviews read historical Git objects.
          fetch-depth: 0
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the slow behavioural lane
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "slow behavioral tests"
          --jobs 1 --inner-jobs 2

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  suite-1-of-2:
    # The pull request's quick behavioural lane, in two halves by test file, each alone on
    # a runner. This is the first; `suite-2-of-2` below is the other, and the argument for
    # both is here.
    #
    # The lane had its own runner since 2026-09-06 for one-sentence arithmetic -- a job
    # cannot be shorter than its longest step, and this step was the longest on the
    # surface -- and on 2026-09-15 the same arithmetic ran out a second time. `suite` was
    # the longest required job in 34 of 35 pull-request runs: 262s of pytest over 6,095
    # tests on the workbench stack and 243s over 5,664 on PRs into `main`, 870 and 825
    # test-seconds, and four runs failed the tier's 275s ceiling that day with every test
    # passing. The growth was in the many -- 115 new files since 09-08, the largest file 9
    # per cent of the lane -- so no marker buys it back, and four workers on four cpus
    # have a floor no scheduling reaches. A second runner is eight cpus; the audit's real
    # file partitions of the per-file medians predicted 138s and 134s of pytest.
    #
    # The partition is `devtools.suite_files`: the per-file costs recorded in
    # `devtools/suite-file-costs.json`, packed longest first, and `crc32(path) mod 2` for
    # a file the record does not name, so a new or renamed test lands in exactly one shard
    # without an edit. Each shard filters in `pytest_ignore_collect`, before import, so it
    # also collects only its half. Every run writes a per-file cost report beside the
    # junit file in the timing artifact, and re-recording from those reports is
    # `python -m devtools.suite_files record`, never a hand list.
    #
    # `--jobs 1` is not a throttle, it is what buys the workers. `_pytest_workers` sizes
    # xdist to `cpus - jobs + 1` because a lane that grabs every cpu beside other steps
    # fails ordinary tests against its per-test ceiling on contention alone (`BC-218`,
    # nineteen of them). Alone at `--jobs 1` it gives four, with nothing else on the
    # runner to contend with. `--inner-jobs 1` for the same reason: `PACK_JOBS` is the
    # per-step process cap, and a step already running four xdist workers must not have
    # each of them fan out again.
    #
    # Full history, unlike the shallow jobs below. Several tests shell out to git and read
    # old objects -- the calibration profile's `git show`, the BC-303 replay's clone of an
    # old revision, `test_release.py`'s `git cat-file` -- and which shard holds them is the
    # partition's business, so both clone the way `validate` does.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The behavioural lane includes tests that read git history rather than only
          # the worktree, so this job clones the same way `validate` does.
          fetch-depth: 0
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run shard 1 of the required pull-request behavioral lane
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --suite --shard 1/2 --jobs 1 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  suite-2-of-2:
    # The second half of the quick behavioural lane. Everything about the split -- why
    # two runners, how files are assigned, why `--jobs 1` and full history -- is argued
    # on `suite-1-of-2` above; the two jobs differ only in `--shard`.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The behavioural lane includes tests that read git history rather than only
          # the worktree, so this job clones the same way `validate` does.
          fetch-depth: 0
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run shard 2 of the required pull-request behavioral lane
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --suite --shard 2/2 --jobs 1 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  typecheck:
    # The type floor, alone on a runner. One step, and the reason is the same arithmetic
    # that gave the behavioural lane its runner: a job's queue is not shorter than what
    # its slots can divide, and basedpyright is one process no `--jobs` setting divides.
    #
    # On 2026-09-15 `checks` sat exactly at its cpu floor. A replay of one run's step times
    # through a longest-first scheduler reproduced its wall to within a second as cargo
    # plus step time over three slots, and basedpyright was 79s of that step time on
    # `main` and 104s on the workbench stack -- up from 57s nine days before. It has no
    # persistent cache or incremental CLI mode, and `--threads` bought about 8 per cent
    # locally for twice the cpu. The same replay put `checks` at 129s with this step moved
    # out and at 109s with `exact verification` also parallel, from 135s.
    #
    # `--edit` still selects the type floor: a contributor's edit loop is one selection on
    # one machine, and only the runner that reports it on a pull request moved. The rule
    # is on `Step.typecheck`, and `test_the_edit_tier_cannot_under_run` holds it.
    #
    # Shallow checkout and no Rust: basedpyright reads the Python the `include` list in
    # `packing/pyproject.toml` names and no git object.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the required pull-request type floor
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --typecheck --jobs 1 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  geometry:
    # The second half of the `checks` queue, and the one pull-request job that exists
    # for cpus rather than for a kind or a floor.
    #
    # The arithmetic is in the `validate` job's comment above and on `Step.geometry`; the
    # short form is that `checks` was 57 steps of pure outer-parallel work and about 790
    # worker-seconds on run 34016999060, that a queue of that shape is shortened by cpus
    # and by nothing else, and that `--jobs 4` on a four-cpu runner is not more cpus --
    # it is the same four bought at thirty to eighty per cent worse per step. Two jobs at
    # `--jobs 3` are eight cpus with a core of headroom on each.
    #
    # The nine steps here are 275.48s of a local 545.08s reading against 269.60s left in
    # `checks`, and the walls that follow are 93.27s here against 86.20s there, measured
    # at this shape on a four-cpu box. The split is not free-form: only a `broad` step may
    # move here, which keeps `--edit` wholly inside `--checks`, and no engine or cargo
    # step may, which is why this job needs no Rust toolchain at all.
    #
    # `--inner-jobs 1`, like `checks`: three outer slots on four cpus is already the
    # headroom, and `build_n5_identity_pair` -- which is in this job -- asks
    # `ProcessPoolExecutor` for the whole machine on its own.
    #
    # Shallow checkout: the step that needs full history is `provenance`, and it is in the
    # `validate` job's half. `needs_engine` is false for all nine, so no cargo build here.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the required pull-request geometry checks
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --geometry --jobs 3 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  sweeps:
    # One part of the pull-request surface, on its own runner and at the same time as the
    # others.
    #
    # Four steps, all of one kind: each re-derives a retained atlas from the witnesses
    # under it and compares the result byte for byte. They are the class `D-369` measured
    # -- a registry or generated view going stale is what actually breaks CI here -- so
    # they belong on every pull request, and `D-455` is what happened the last time work
    # of this kind ran only after a merge. What they cannot do is share three workers with
    # the quick behavioural lane: 468.11s of them beside it put five ordinary tests over
    # the lane's 5s per-test ceiling on contention alone.
    #
    # Two of the four names changed on 2026-09-07 and the corpus is why. The known-best
    # atlas widened from n=1..100 to n=1..324, and at that size the whole rebuild measured
    # 691.19s and the whole escape screen 766.26s on an idle ten-cpu box at this job's own
    # shape -- against a 210s ceiling, and, for the screen, within 134s of the gate's own
    # 900s per-step subprocess timeout on a machine faster than this runner. Both
    # re-derivations moved to `deep-gate.yml`; what runs here is the record layer of each
    # plus a fixed recorded sample of the cases, which is `known-best atlas records and
    # sample` and `translation escape screen records and sample`. The readings and the
    # argument are in `packing/benchmarks/gate-cost-at-324/`.
    #
    # `--jobs 4` because this job has four units and four cpus, so outer parallelism is
    # already saturated and the wall is the longest unit's wall. That unit is now
    # `known-best chunk census` at 90.38s, which `D4` pins at CALIBRATION_CORPUS so it
    # cannot grow with the corpus; both sampled steps are sized to sit under it, so the
    # tier's wall is the census's wall and the samples cost the job nothing.
    #
    # `--inner-jobs 2` is the lever inside a step, and three of the four now read it.
    # `screen_translation_escape` was given a process pool on 2026-09-06 and
    # `build_known_best_atlas` on 2026-09-07; both size themselves from `PACK_JOBS`, which
    # `--inner-jobs` sets. The atlas rebuild measured 691.19s serial against 184.34s at
    # four workers on the same idle box -- 3.75x, over 688.74s of cpu against the 691.19s
    # the serial run spent, so the pool divided the work rather than adding any.
    #
    # Two rather than four, and the reason is the table in the `validate` job above: four
    # outer slots already fill four cpus, so a step fanning out to four inner workers is
    # the oversubscription that cost `checks` thirty to eighty per cent per step.
    #
    # The census and prospective seed default to serial unless explicitly passed --jobs;
    # these gate invocations do not pass it. Historical pool experiments did not isolate
    # their effect on tier wall time (D-472).
    #
    # Shallow checkout: the step that needs full history is `provenance`, and it is in the
    # `validate` job's part. `needs_engine` is false for all four, so no cargo build here.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the required pull-request record sweeps
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --sweeps --jobs 4 --inner-jobs 2

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  exhaustive:
    # The exhaustive exact tier, on its own runner, reporting its own verdict against its
    # own budget (think-tr2z).
    #
    # It was 1943s of the complete surface's 2755s, sharing a two-core runner with the
    # behavioural suite. When it outgrew its budget on 2026-09-05 the gate killed it with
    # its output still in an unflushed pipe (D-456), so `validate` went red on three
    # consecutive merges while saying nothing at all about the sixty other steps, and a
    # real failure arriving behind it would have looked identical. Split, this job answers
    # one question -- do the complete finite certificate decisions still pass -- and the
    # job above answers the rest.
    #
    # No `packing-required` dependency: it does not run on pull requests, because at half
    # an hour it is the one step whose cost rules it out of the pull-request tier. The
    # workflow-level concurrency group still cancels it with the rest of a superseded run.
    if: "github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Shallow is enough: the provenance step that needs full history is not in this
        # selection. kpress is vendored at vendor/kpress and installed from that path, so
        # the environment does not resolve without the submodule checked out.
        with:
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      # Hosted provenance reports four available CPUs. This isolated step can use four
      # certificate workers, still under actual CPU and grid-memory caps. Concurrent
      # checkpoint steps retain their two-worker allowance. Speedup is not yet measured.
      - name: Run the exhaustive exact tier
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "exhaustive exact behavioral tests"
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  screen:
    # The whole single-square translation escape screen, on its own runner, for the reason
    # the exhaustive tier is on its own runner: its process pool is sized by PACK_JOBS,
    # and beside the rest of the gate it receives two workers instead of four.
    # A same-runner comparison is still needed to measure how the screen scales.
    #
    # `D-484` is what this fixes. The n=1..324 expansion (#111) took the corpus from about
    # 100 records to 318 screened, and the step went from comfortably inside the shared
    # 900s subprocess cap to killed at it -- 901.00s on run 34172652457, which is the cap
    # and not an uncensored duration. The split and the higher cap are evaluated together.
    # At `--jobs 2 --inner-jobs 2` the screen gets two pool workers and pays contention for
    # them, and no `--jobs` setting on that job can give it more without oversubscribing
    # the other slot (`BC-218`).
    #
    # Alone at `--jobs 1 --inner-jobs 4` it gets four, which is what `PACK_JOBS` hands
    # `sqpack.workers.worker_count` and what the pool then asks for.
    #
    # The identical deep-gate job provides three hosted proxy readings: 944s on run
    # 34188003140, 861s on run 34189176373 and 949s on run 34190285360 -- spread 1.10x,
    # geometric mean 917.09s. Two of the three are above the 900s cap the step used to run
    # under, which is why `SCREEN_BUDGET_SECONDS` raises it to 1800s rather than leaving
    # the split to do the work alone. There is also one local reading, 794.5s at four
    # workers on a four-cpu development box over the same 318 records; the hosted runs sit
    # 1.08x to 1.19x above it, so it is a development number and not the measurement to
    # size this job from.
    if: "github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Shallow is enough: the provenance step that needs full history is not in this
        # selection. kpress is vendored at vendor/kpress and installed from that path, so
        # the environment does not resolve without the submodule checked out.
        with:
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the single-square translation escape screen
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --only "single-square translation escape screen"
          --jobs 1 --inner-jobs 4

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  packing-required:
    # `!cancelled()` rather than `always()`. With `always()`, a run superseded by the next
    # push -- which `cancel-in-progress: true` above makes routine, and which `OR-3`'s
    # "push, then keep working" makes frequent -- reaches this job with
    # `needs.validate.result == 'cancelled'` and reports the required check as a hard
    # failure. Twice in ten minutes on 2026-08-30, each time waking a session to diagnose
    # a run that had been replaced by a newer one (D-380).
    #
    # This does not weaken the gate. A genuine `validate` failure is not `cancelled()`, so
    # the job still runs and still fails. A cancelled run reports nothing, which leaves the
    # required check pending rather than green -- the safe direction, and the reason the
    # header comment warns against *path* filtering is unaffected, since supersession
    # always starts a replacement run that supplies the check.
    #
    # Every part of the pull-request surface is named here, and this job staying the
    # single required context is the reason the split is allowed to exist: `BC-218` set
    # that as the condition for any fan-out, because `D-380` records what a fan-out of
    # separately required checks did to this repository once. A reviewer still watches one
    # context; it just has six prerequisites now.
    #
    # `needs` alone is not enough, which is why every prerequisite also has a `test` line
    # below. This job runs under `!cancelled()`, so it is reached even when a prerequisite
    # failed, and it is the shell that decides -- a job named in `needs` and missing from
    # the script is an advisory check nothing blocks on.
    if: "!cancelled() && github.event_name == 'pull_request'"
    needs: [validate, typecheck, geometry, suite-1-of-2, suite-2-of-2, sweeps]
    runs-on: ubuntu-latest
    steps:
      - name: Require every pull-request prerequisite
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          GEOMETRY_RESULT: ${{ needs.geometry.result }}
          SUITE_1_OF_2_RESULT: ${{ needs.suite-1-of-2.result }}
          SUITE_2_OF_2_RESULT: ${{ needs.suite-2-of-2.result }}
          SWEEPS_RESULT: ${{ needs.sweeps.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$TYPECHECK_RESULT" = "success"
          test "$GEOMETRY_RESULT" = "success"
          test "$SUITE_1_OF_2_RESULT" = "success"
          test "$SUITE_2_OF_2_RESULT" = "success"
          test "$SWEEPS_RESULT" = "success"

  macos-portability:
    # A second-architecture smoke check, deliberately minimal.
    #
    # This job used to run the complete validation surface plus a deep golden rebuild,
    # which duplicated the Linux `validate` job in full. That was both slow and wrong in
    # kind: the record, schema, lint, docs and provenance surfaces are platform
    # independent, so running them twice buys nothing. It also made the job depend on
    # `cairosvg`, whose `libcairo` is absent from the macOS runner, so the job failed on
    # every push to main regardless of the change -- and a check that can never pass
    # teaches everyone to ignore CI, which is worse than not having it.
    #
    # What belongs here is only what a second architecture could actually disagree
    # about: that the package builds and imports on arm64, that the exact predicates
    # decide the same way, and that the golden basin maps computed here match the ones
    # committed from Linux. That last one is the float-determinism canary and costs
    # under a second.
    #
    # Everything algorithmic, and everything about the research record, stays on Linux.
    #
    # It now runs on pull requests too. It was previously skipped on them, which is why
    # the libcairo breakage was only ever visible after a merge, on a branch nobody was
    # about to fix. At roughly thirty seconds that exclusion no longer buys anything: a
    # check this cheap belongs before the merge, where it can still change the outcome.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Shallow is enough: the provenance step that needed full history runs on Linux.
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: The package builds and imports on arm64 macOS
        run: >-
          uv run --frozen --all-extras --group dev python -c "import sqpack, sqpack.field, sqpack.verify,
          sqpack.witness, sqpack.promote.refine, sqpack.promote.contacts;
          print('sqpack imports on', __import__('platform').machine())"

      - name: Results a second architecture could disagree about
        # Exact predicates, the small-n exact models, and the golden basin maps
        # committed from Linux. Roughly twenty seconds; if it grows, something
        # platform-independent has been added and belongs on Linux instead.
        run: >-
          uv run --frozen --all-extras --group dev packing-validate
          --only "exact verification"
          --only "verifier perturbation limits"
          --only "small-n exact models"
          --only "golden basin maps"
          --jobs 4 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
