name: Packing validation

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "17 8 * * 6"
  # Keep the stable packing-required context present for every pull request. Path-level
  # filtering would leave a configured required check pending forever when no path matched.
  pull_request: {}
  push:
    branches: [main]
    paths:
      - ".agents/skills/experiment-loop/**"
      - ".claude/skills/experiment-loop/**"
      - ".github/workflows/packing-validation.yml"
      - "explorations/packing/**"

permissions:
  contents: read

concurrency:
  group: packing-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorations/packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The provenance step verifies historical engine commits, not just HEAD.
          fetch-depth: 0

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.7"
          working-directory: explorations/packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the required pull-request surface
        if: "github.event_name == 'pull_request'"
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --fast --jobs 2 --inner-jobs 1

      - name: Run the complete integration surface
        if: "github.event_name != 'pull_request'"
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --jobs 2 --inner-jobs 2

  packing-required:
    if: "always() && github.event_name == 'pull_request'"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require every pull-request prerequisite
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = "success"

  macos-portability:
    if: "github.event_name != 'pull_request'"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: explorations/packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The provenance step verifies historical engine commits, not just HEAD.
          fetch-depth: 0

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14.7"
          working-directory: explorations/packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the complete packing validation surface on a second architecture
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --jobs 2 --inner-jobs 2

      - name: Run the focused deep-golden portability check
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --deep --only "golden basin maps"
          --jobs 1 --inner-jobs 1
