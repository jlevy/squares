          cache-dependency-path: package-lock.json

      - name: Cache the Playwright browser
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('packing/uv.lock') }}

      # npm ci and Chromium apt are independent after uv sync. Serializing them was
      # 15-20 s of Node plus 13-19 s of apt on the frontend wall; overlapping them
      # is the same work on the same runner.
      - name: Install the npm toolchain and the pinned Chromium shell
        working-directory: .
        run: |
          set -euo pipefail
          npm ci --ignore-scripts &
          npm_pid=$!
          (
            cd packing
            uv run --frozen --all-extras --group dev \
              python -m playwright install --with-deps --only-shell chromium
          ) &
          playwright_pid=$!
          npm_status=0
          playwright_status=0
          wait "$npm_pid" || npm_status=$?
          wait "$playwright_pid" || playwright_status=$?
          test "$npm_status" -eq 0
          test "$playwright_status" -eq 0

      - name: Run the frontend source and built-page contracts
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --frontend --jobs 2 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  geometry:
    # The second half of the `checks` queue, and the only one of the four pull-request
    # jobs that exists for cpus rather than for a kind or a floor.
    #
    # The arithmetic is in the `validate` job's comment above and on `Step.geometry`; the
    # short form is that `checks` was 57 steps of pure outer-parallel work and about 790
    # worker-seconds on run 34016999060, that a queue of that shape is shortened by cpus
    # and by nothing else, and that `--jobs 4` on a four-cpu runner is not more cpus --
    # it is the same four bought at thirty to eighty per cent worse per step. Two jobs at
    # `--jobs 3` are eight cpus with a core of headroom on each.
    #
    # The nine steps here are 275.48s of a local 545.08s reading against 269.60s left in
    # `checks`, and the walls that follow are 93.27s here against 86.20s there, measured
    # at this shape on a four-cpu box. The split is not free-form: only a `broad` step may
    # move here, which keeps `--edit` wholly inside `--checks`, and no engine or cargo
    # step may, which is why this job needs no Rust toolchain at all.
    #
    # `--inner-jobs 1`, like `checks`: three outer slots on four cpus is already the
    # headroom, and `build_n5_identity_pair` -- which is in this job -- asks
    # `ProcessPoolExecutor` for the whole machine on its own.
    #
    # Shallow checkout: the step that needs full history is `provenance`, and it is in the
    # `validate` job's half. `needs_engine` is false for all nine, so no cargo build here.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the required pull-request geometry checks
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --geometry --jobs 3 --inner-jobs 1

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  sweeps:
    # One part of the pull-request surface, on its own runner and at the same time as
    # the other six.
    #
    # Four steps, all of one kind: each re-derives a retained atlas from the witnesses
    # under it and compares the result byte for byte. They are the class `D-369` measured
    # -- a registry or generated view going stale is what actually breaks CI here -- so
    # they belong on every pull request, and `D-455` is what happened the last time work
    # of this kind ran only after a merge. What they cannot do is share three workers with
    # the quick behavioural lane: 468.11s of them beside it put five ordinary tests over
    # the lane's 5s per-test ceiling on contention alone.
    #
    # Two of the four names changed on 2026-09-07 and the corpus is why. The known-best
    # atlas widened from n=1..100 to n=1..324, and at that size the whole rebuild measured
    # 691.19s and the whole escape screen 766.26s on an idle ten-cpu box at this job's own
    # shape -- against a 210s ceiling, and, for the screen, within 134s of the gate's own
    # 900s per-step subprocess timeout on a machine faster than this runner. Both
    # re-derivations moved to `deep-gate.yml`; what runs here is the record layer of each
    # plus a fixed recorded sample of the cases, which is `known-best atlas records and
    # sample` and `translation escape screen records and sample`. The readings and the
    # argument are in `packing/benchmarks/gate-cost-at-324/`.
    #
    # `--jobs 4` because this job has four units and four cpus, so outer parallelism is
    # already saturated and the wall is the longest unit's wall. That unit is now
    # `known-best chunk census` at 90.38s, which `D4` pins at CALIBRATION_CORPUS so it
    # cannot grow with the corpus; both sampled steps are sized to sit under it, so the
    # tier's wall is the census's wall and the samples cost the job nothing.
    #
    # `--inner-jobs 2` is the lever inside a step, and three of the four now read it.
    # `screen_translation_escape` was given a process pool on 2026-09-06 and
    # `build_known_best_atlas` on 2026-09-07; both size themselves from `PACK_JOBS`, which
    # `--inner-jobs` sets. The atlas rebuild measured 691.19s serial against 184.34s at
    # four workers on the same idle box -- 3.75x, over 688.74s of cpu against the 691.19s
    # the serial run spent, so the pool divided the work rather than adding any.
    #
    # Two rather than four, and the reason is the table in the `validate` job above: four
    # outer slots already fill four cpus, so a step fanning out to four inner workers is
    # the oversubscription that cost `checks` thirty to eighty per cent per step.
    #
    # The census and prospective seed default to serial unless explicitly passed --jobs;
    # these gate invocations do not pass it. Historical pool experiments did not isolate
    # their effect on tier wall time (D-472).
    #
    # Shallow checkout: the step that needs full history is `provenance`, and it is in the
    # `validate` job's part. `needs_engine` is false for all four, so no cargo build here.
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packing
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kpress is vendored at vendor/kpress and installed from that path, so
          # the environment does not resolve without the submodule checked out.
          submodules: true
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          # These four steps consume the package, tools, exact case/frontier/atlas
          # records and a small declared slice of the source archive. They do not read
          # the 130 MB campaign history or the rest of the 329 MB papers archive. Keep
          # this list paired with the workflow contract in test_module_boundaries.py.
          sparse-checkout: |
            /*
            !/*/
            /.gitmodules
            /vendor/kpress/
            /packages/workbench/
            /packing/
            !/packing/campaign/*/
            !/packing/resources/
            /packing/resources/
            !/packing/resources/*
            /packing/resources/README.md
            /packing/resources/bibliography.yaml
            /packing/resources/bibliography.schema.yaml
            /packing/resources/web/
            !/packing/resources/web/*
            /packing/resources/web/kingbird-squares-in-squares.html
            /packing/resources/web/known-best-packings/
            /packing/resources/web/prospective-packings/
            /packing/resources/web/unitsquare-release1-2026/
            /packing/resources/web/franciscouzo-square-packing-2026-09-27/
            /packing/resources/web/franciscouzo-square-packing-2026-10-03/
            /packing/resources/web/casson-square-packing-2026-09-23/
            /packing/resources/web/de-winter-square-packing-211-2026-09-16/
            /packing/resources/web/evand-square-packing-2026-10-05/
            /packing/resources/web/evand-new-arrangements-2026-10-07/
            /packing/resources/web/squish-401-2026-10-07/
            /packing/resources/web/squish-401-update-2026-10-07/
            /packing/resources/web/squish-422-second-update-2026-10-07/
            /packing/resources/web/rehwaldt-couzo-refinements-2026-10-07/
            /packing/resources/web/rehwaldt-n68-refinement-2026-10-07/
            /packing/resources/papers/
            !/packing/resources/papers/*
            /packing/resources/papers/kingbird-square-29-provenance.svg
            /packing/campaign/explorations/
            !/packing/campaign/explorations/*
            /packing/campaign/explorations/X049-families-data/

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          working-directory: packing
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked development environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run the required pull-request record sweeps
        run: >-
          uv run --frozen --all-extras --group dev
          packing-validate --sweeps --jobs 4 --inner-jobs 2

      - name: Preserve validation timings and partial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-timings-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ env.PACKING_VALIDATION_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  exhaustive-1:
    # The predecessor `exhaustive-tier` job ran 58 independent exact tests serially and
    # set the wall on every measured deep run. The retained JUnit receipt from run
    # 35579234418 packs whole files into three 945.8s, 837.7s and 837.9s shards. Each
    # shard keeps the exact marker, test bodies and four-worker inner cap; only their
    # runner assignment changes.
