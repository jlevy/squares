# Contract for one round of the <campaign> loop. Only fields something reads.
#
# Copy into the campaign, then:
#   - replace <project>.<campaign>
#   - replace `subject` and `instance` properties with what decides what a result
#     means here, and what dimension the campaign sweeps
#   - delete the result shapes the campaign did not declare
#   - replace `determination.outcome`'s description with the campaign's enum
# Keep additionalProperties: false everywhere. A typo that validates is a lie waiting.
$schema: https://json-schema.org/draft/2020-12/schema
$id: <project>.<campaign>:Experiment/v1
title: Experiment
type: object
additionalProperties: false
required: [id, series, title, date, hypotheses, tier, subject, method, results, verdict]
properties:
  id: {type: string, pattern: "^exp-[0-9]{3}$"}
  series:
    type: string
    pattern: "^series-[0-9]{3}$"
    description: >-
      Which pass of the loop this round belongs to. Ids stay globally monotonic
      across the campaign, so the series organises rounds without namespacing
      them.
  title: {type: string, minLength: 1}
  date: {type: string, description: ISO date the measurements were taken.}
  hypotheses:
    type: array
    minItems: 1
    items: {type: string, pattern: "^H-[0-9]{3}$"}
    description: Registry ids this round tested. Every id must exist in hypotheses/.
  tier: {type: string, enum: [exploratory, confirmatory]}
  subject:
    type: object
    additionalProperties: false
    description: REPLACE these fields with what decides what a result means here.
    required: [label]
    properties:
      label: {type: string}
      host_system: {type: string}
      regime: {type: string, description: Cache/scan/load/precision state the numbers were taken in.}
  instance:
    type: object
    additionalProperties: false
    required: [axis, point]
    description: >-
      The point on the campaign's instance axis. Separate from `subject` on purpose:
      the subject says what the numbers are evidence about, the instance is the
      dimension deliberately varied, so it is the grouping key for every sweep view.
    properties:
      axis: {type: string}
      point: {type: [string, number]}
  method:
    type: object
    additionalProperties: false
    required: [operator]
    properties:
      control: {type: string}
      candidate: {type: string}
      runs_per_condition: {type: integer, minimum: 1}
      trials: {type: integer, minimum: 1}
      interleaved: {type: boolean}
      operator:
        type: string
        description: >-
          Who or what ran the round (person, agent, model). One third of the
          duplication key, and what lets models be compared on one registry.
      commit: {type: string}
      dirty: {type: boolean, description: Whether the working tree was dirty at run time.}
      entry_point: {type: string, description: Path or command for the code this round built.}
      command: {type: string, description: The exact invocation, so the round can be re-run.}
      budget: {type: string, description: For searches - what was allotted (time, attempts, tokens).}
      record: {type: string, description: Path to the raw run data.}
  lease:
    type: object
    additionalProperties: false
    required: [expires]
    description: >-
      Present only while the round is in-progress; removed when the verdict is written.
      An in-progress artifact with an expired lease is a stale claim, reclaimable by
      any runner.
    properties:
      expires: {type: string, description: ISO timestamp after which the claim may be reclaimed.}
      host: {type: string}
      pid: {type: integer}
  results:
    type: array
    minItems: 1
    items:
      anyOf:
        - $ref: "#/$defs/paired"
        - $ref: "#/$defs/conditions"
        - $ref: "#/$defs/record"
        - $ref: "#/$defs/determination"
  complexity:
    type: object
    additionalProperties: false
    properties:
      lines_changed: {type: integer, minimum: 0}
      new_dependencies: {type: array, items: {type: string}}
      new_failure_modes: {type: array, items: {type: string}}
      notes: {type: string}
  verdict:
    type: object
    additionalProperties: false
    required: [decision, primary_criterion, reason]
    properties:
      decision:
        type: string
        enum: [accepted, rejected, unresolved, blocked, abandoned,
               superseded, baseline, in-progress]
      primary_criterion: {type: string, description: The metric or question the decision rests on.}
      reason: {type: string, minLength: 1, description: One sentence someone can disagree with.}
      commit: {type: string}
      budget_spent: {type: string, description: Required when decision is abandoned.}
      best_reached: {type: string, description: Required when decision is abandoned.}
      reopen_when: {type: string, description: Required when decision is abandoned.}
      superseded_by: {type: string, description: Required when decision is superseded.}
      needs_review:
        type: boolean
        default: false
        description: >-
          Set by an unattended runner when it declined on judgment or could not
          decide. Drives the "Needs review" section of the session report.
# NOTE: the cross-field rules -- abandoned requires budget_spent/best_reached/
# reopen_when, superseded requires superseded_by, in-progress requires a lease --
# are NOT expressed here as `allOf` conditionals. Measured on 2026-08-22 against
# softschema 0.6.2: any `allOf` object composition makes a `status: enforced`
# artifact fail with `enforcement_unsupported: enforced closure is unsupported for
# allOf object composition`, i.e. the conditional would invalidate every artifact
# rather than the offending ones -- and it masks the real violation, reporting the
# same generic message for a conforming document and a violating one. Filed upstream
# as jlevy/softschema#41. They are enforced in ledger.py instead, which is where
# whole-set rules already live. Re-test and remove the workaround when #41 lands.
$defs:
  paired:
    type: object
    additionalProperties: false
    required: [shape, metric, control_median, candidate_median, change_pct]
    properties:
      shape: {const: paired}
      metric: {type: string}
      role: {type: string, enum: [outcome, cost, guard, mechanism]}
      control_median: {type: number}
      candidate_median: {type: number}
      change_pct: {type: number, description: Median of paired differences. NOT the ratio of the medians.}
      ci95_low_pct: {type: number}
      ci95_high_pct: {type: number}
      passes_acceptance: {type: boolean}
      ci_excludes_zero: {type: boolean}
      direction: {type: string, enum: [improved, regressed, unclear, unknown]}
      pairs: {type: integer, minimum: 0}
  conditions:
    type: object
    additionalProperties: false
    required: [shape, metric, control_median, candidate_median, overlapping]
    properties:
      shape: {const: conditions}
      metric: {type: string}
      role: {type: string, enum: [outcome, cost, guard, mechanism]}
      control_median: {type: number}
      candidate_median: {type: number}
      control_range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
      candidate_range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
      change_pct: {type: number}
      overlapping: {type: boolean, description: Ranges overlap - not a result on its own.}
  record:
    type: object
    additionalProperties: false
    required: [shape, metric, direction, score, standing_best, beat_record]
    properties:
      shape: {const: record}
      metric: {type: string}
      role: {type: string, enum: [outcome, cost, guard, mechanism]}
      direction: {type: string, enum: [higher, lower]}
      score: {type: number}
      score_str: {type: string, description: Full precision when a float cannot carry it.}
      standing_best: {type: number}
      standing_best_source: {type: string, description: Where the standing best came from, by path or citation.}
      beat_record: {type: boolean}
      runs: {type: integer, minimum: 1}
  determination:
    type: object
    additionalProperties: false
    required: [shape, question, outcome]
    properties:
      shape: {const: determination}
      question: {type: string}
      role: {type: string, enum: [outcome, cost, guard, mechanism]}
      outcome: {type: string, description: REPLACE with your campaign's declared enum.}
      checked_by: {type: string, description: The independent checker that makes it real.}
