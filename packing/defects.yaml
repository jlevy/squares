- id: D-358
  title: An unattended run misread its own clock by a factor of four and stopped early
  date: '2026-08-29'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: the whole of run-002
  severity: medium
  status: fixed
  what: >-
    run-002 declared blocks of 150, 180, 180 and 40 minutes against a 690-minute target.
    The git timestamps say the planning commit landed at 03:04:56Z and the four block
    commits at 03:36:09Z, 04:18:15Z, 04:46:49Z and 05:09:32Z: blocks of 31, 42, 29 and 23
    minutes, and a whole run of 143 minutes rather than 690. The coordinating agent tracked
    elapsed time by estimating between tool calls instead of reading a clock, and the
    estimates ran roughly four times fast.
  consequence: >-
    Two things, and the second is worse than the first. Every declared clock in
    session-036, session-037, session-038 and run-002 was wrong, which is ordinary
    bookkeeping. But the misreading also drove a scheduling decision and then supplied a
    false reason for it: BC-055 was recorded `stopped` because "blocks 2 and 3 overran into
    this cell's slack", and nothing overran -- the run stopped with about eight hours of
    its declared budget unspent. That reason reads as a constraint the run met and was in
    fact a mistake the run made, which is the flattering direction.
  fix: >-
    Clocks in the four artifacts are corrected to the measured commit times, and BC-055's
    stop reason is replaced with what actually happened. The practice change is mechanical:
    read `date -u` at every block boundary and record it, rather than estimating elapsed
    time from the conversation.
  regression: >-
    It said "None automatic" for a day and then this recurred as D-386, which is what built
    the check: `devtools/check_session_clocks`, a records-tier gate step, refuses any
    session artifact declaring a start time later than the moment of checking -- a phase
    cannot have begun after the record of it was written -- along with a session that starts
    after its own phases and a deadline at or before its own start.

    Anchoring on the wall clock is sound here because the bound is monotone: a timestamp in
    the past stays in the past, so a run that passes today cannot fail tomorrow. Nine tests
    and two negative controls pin both directions.

    It also prints elapsed against budget, derived from the record's own successive
    timestamps, which is the part that addresses this entry rather than D-386. Had that line
    existed, run-002's declared 150 minutes standing beside a derived 31 would have been
    visible while the run was making the mistake instead of a day later.
  bead: think-qs6k
  recorded_in: packing/campaign/agent-sessions/session-039-block5-witness-plumbing.md
- id: D-359
  title: The generated atlas SVG's coordinate precision is inherited from ambient state
  date: '2026-08-29'
  layer: tooling
  class: robustness
  detected_by: gate
  latent_for: unknown; the emission has never pinned its digits
  severity: medium
  status: fixed
  what: >-
    `sqpack.render.numbers.format_svg_number` renders a `ScalarSource` from its
    `projected` decimal, whose digit count is whatever precision that scalar was last
    refined to. Nothing downstream quantises it. So `devtools.build_known_best_atlas`
    emits the `n = 11` card's corners with 27 fractional digits in a fresh process and
    with 50 in a process where any earlier caller has run `field.refine_to(40)` on the
    shared Trump field -- the same geometry, a different file.
  consequence: >-
    `known-best-1-100.svg` is not reproducible from its inputs alone, and
    `test_known_best_composite_png_is_derived_from_current_svg` -- which asserts the
    stored PNG's receipt matches the hash of the SVG the builder currently produces --
    passes or fails on test ordering rather than on whether the PNG is stale. It passes
    today because no test that refines a shared field runs before it in the gate's
    ordering, which is not a property anybody chose. The failure is silent in the
    direction that matters: a genuinely stale PNG would be indistinguishable from this.
  fix: >-
    Fixed under BC-066's successor block BC-068, in two halves. `NumberField.decimal` was
    setting the *thread-global* decimal precision and never restoring it, which is where
    the ambient state came from; its working precision now lives in a `localcontext`. And
    the emission side now pins its own digits: `SVG_EMISSION_PRECISION` in
    `sqpack.render.numbers`, applied as a decorator to the two document-level entry
    points so it covers arithmetic added inside them later rather than only the
    expressions someone remembered to wrap.

    Pinned at 28 -- the precision every retained figure in this repository was already
    drawn at -- so the pin declares where the emission is rather than moving it. That
    choice was measured rather than assumed. At 32, the value the projection layer
    promises for an exact source, `validate_translation_only_trajectory` breaks: two
    independently projected coordinates of the exact `n = 5` face differ by `8e-32`,
    which a 28-digit subtraction rounds away and a 32-digit one does not, and 66 stored
    known-best outputs change. At 17 the coarsening reaches the edge and centroid
    subtractions that feed angle classification, which decides hues and not only digits.

    No stored artifact moved: all four generators rebuild byte-identical output under the
    pin, which is the evidence that 28 is where they were already drawn.
  regression: >-
    `uv run --frozen --group dev python -m pytest tests/test_promote_system.py
    tests/test_known_best_atlas.py -q -p no:randomly` fails on the composite receipt;
    either module alone passes. That command is the detector until the emission is
    pinned.
  bead: think-mt4h
  recorded_in: packing/campaign/agent-sessions/session-040-block6-chirality.md
- id: D-360
  title: A null-space finding was read off a filtered display instead of being computed
  date: '2026-08-29'
  layer: record
  class: validity
  direction: neutral
  detected_by: review
  latent_for: about ten minutes, inside session-040 and never committed
  severity: low
  status: fixed
  what: >-
    session-040 phase 2 first recorded that the side `s` was absent from every vector of
    the n = 29 contact Jacobian's null space, and drew a contrast with n = 11 where it
    appears. Both halves came from a diagnostic printout that showed each vector's eight
    largest coordinates and collected square indices only from names beginning `x`, `y` or
    `t` -- which excludes `s` by construction. Computing the quantity the claim is about,
    the norm of the projection of `e_s` onto the null space, gives `1.14e-1` at n = 29 and
    `1.86e-1` at n = 11: the same behaviour, not opposite behaviour. The size that
    actually differs is n = 5, at `1.00e-16`.
  consequence: >-
    None shipped; the error was caught before the commit and the corrected measurement is
    what BC-059 receives. Had it not been, BC-059 would have inherited an inverted
    discriminating pair and looked for a first-order closure at n = 29, where no
    first-order condition can close the system at all.
  fix: >-
    The claim is replaced by the projection norms at all three sizes, and the session
    record keeps a section saying what the first version said and why it was wrong.
    Per-vector readings of a null space are not meaningful in any case: a null space is
    defined up to an orthonormal basis, so only basis-independent quantities are claims
    about it.
  regression: >-
    None automatic, and this is the second instance in run-002 of the same root cause --
    D-358 substituted an estimate for a clock, this substituted a display for a
    computation. The practice change is the same shape: when a record states a quantity,
    compute that quantity rather than reading something correlated with it.
  bead: think-km5r
  recorded_in: packing/campaign/agent-sessions/session-040-block6-chirality.md
- id: D-361
  title: An edge-edge contact was assembled as one equation, so the contact system did not
    determine the pose
  date: '2026-08-29'
  layer: tooling
  class: soundness
  direction: conservative
  detected_by: control_cell
  latent_for: from BC-054 in session-038 until BC-059 in session-041
  severity: high
  status: fixed
  what: >-
    `sqpack.promote.system` emitted one scalar equation per `edge-edge` contact, putting a
    single endpoint of one edge onto the other edge's line. Coincident lines in the plane
    are two conditions, not one: the edges parallel and one point shared. With only the
    incidence written down, the second square is free to pivot about that point, which
    keeps the equation satisfied and drives the squares into each other at first order.
    Measured at n = 11 by walking the contact Jacobian's null space in the direction that
    most decreases the side: three declared edge-edge pairs reached overlaps of `-5.1e-6`,
    `-4.2e-6` and `-3.2e-6` at a step of `1e-5`, growing linearly in the step.
  consequence: >-
    The assembled system did not isolate the pose it was assembled from, and the shortfall
    that left was named as something it was not. `close` reported four missing
    "stationarity conditions" at n = 11 and seven at n = 29, described as Lagrange or
    Fritz-John determinant conditions; they were four and seven missing collinearity
    equations. The record carried that reading into session-038, session-040, SYNOPSIS.md
    and BC-059's own framing, which had gone as far as concluding from the same numbers
    that no first-order condition could close either size. The error was conservative --
    it made the pipeline look further from a solvable system than it was -- and it blocked
    BC-060, which needs a square system to work on.
  fix: >-
    `edge-edge` contributes two equations, both endpoints of the right edge on the left
    edge's line. The contact Jacobian then reaches full rank at both retained sizes, `34`
    of `34` at n = 11 and `88` of `88` at n = 29, with residuals unmoved at `8.9e-16` and
    `1.3e-15`; `close` takes its `already-determined` refusal at both. Göbel's n = 5 has
    no edge-edge contact, is untouched by the repair, and keeps a genuine shortfall of one
    -- the only size where a stationarity condition still has to be derived.
  regression: >-
    Two controls. One restores the single-endpoint equation and requires the n = 11
    equation count to move; the other disables `close`'s `already-determined` guard and
    requires the test to catch a closure invented for a determined system. The positive
    check is a test that walks the null space and requires the projection of `e_s` onto it
    to vanish, which is the property the missing equation destroyed.
  bead: think-9c40
  recorded_in: packing/campaign/agent-sessions/session-041-block7-collinearity.md
- id: D-362
  title: The translation-only trajectory check compares independently rounded projections
    for exact equality
  date: '2026-08-29'
  layer: tooling
  class: robustness
