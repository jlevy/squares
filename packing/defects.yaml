- id: D-129
  title: Negative-control checker processes have no bounded timeout or child cleanup
  date: '2026-08-24'
  layer: tooling
  class: robustness
  detected_by: review
  latent_for: since the negative-control harness was introduced
  severity: medium
  status: fixed
  what: >-
    Source snapshots prevent a killed negative control from corrupting the checkout,
    but each checker still runs without a deadline and a shell child can outlive the
    harness. One stuck check can therefore stall the gate indefinitely.
  consequence: >-
    An unattended or delegated verification loop can lose its whole timebox and leave
    temporary descendants consuming resources even though the scientific tree remains
    safe.
  fix: >-
    Give every control a finite default or declared deadline, launch its command in a
    new process group, and terminate and reap the whole group with TERM followed by KILL
    on timeout or interruption.
  regression: >-
    tests/test_negative_controls.py launches a child that ignores TERM and requires the
    harness to time out, kill and reap it before returning a failure.
