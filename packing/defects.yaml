- id: D-369
  title: The gate's cheap checks were hostage to its expensive one, so drift reached CI
  date: '2026-08-29'
  layer: tooling
  class: performance
  detected_by: review
  latent_for: 'the whole of the 2026-08-29 branch'
  severity: medium
  status: fixed
  what: >-
    Seven CI failures on one branch, and every one of them was a registry, generated view,
    or declared contract going stale: a duplicated key in the declared-consumer registry,
    an undeclared `verified_upper_bound` consumer, two open beads sharing a title, a stale
    `ledger.md`, and an agenda cell with an empty `instances` list. None was a behavioural
    test. Those checks together run in about 70 seconds, but the only tier that contained
    them was `--fast`, which takes about eight minutes because one step -- the behavioural
    tests -- is roughly 87% of it. So the tier that catches everything that breaks was
    priced at the cost of the step that never broke, and pushing without it kept looking
    like the cheaper move.
  consequence: >-
    Wall clock and reviewer trust, not correctness. Each failure cost a CI round trip
    plus a fix commit, and three consecutive pushes failed on one unfixed cause because
    the next push went out before the first result landed. The gate's own cadence table
    made it worse by claiming sixty seconds for the eight-minute tier and two minutes for
    the eighteen-minute one, so the tier was being chosen against numbers that were wrong
    by an order of magnitude.
  fix: >-
    `packing-validate --records` selects the eleven record checks and nothing else, at
    about 70 seconds, and is the declared pre-push command. `conventions.md`'s cadence
    table is restated from measurement rather than intention. `OR-3` gains the other half:
    push first so CI runs concurrently with local checks, rather than serialising them.
  regression: >-
    A test asserts the tier is exactly the steps tagged `records`, that all of them are in
    the fast tier, and that the behavioural-test step is not among them -- tagging a test
    step into the tier would restore the cost that caused this. The structural question,
    whether these are the right tiers at all, is `BC-075`; this entry is the increment that
    stops the recurrence in the meantime.
  bead: think-c46d
  recorded_in: packing/src/sqpack/cli/validate.py
- id: D-370
  title: The registry checks were slow because they were not registry checks
  date: '2026-08-29'
  layer: tooling
  class: performance
  detected_by: review
  latent_for: 'since the soft-schema step was written'
  severity: medium
  status: fixed
  what: >-
    `soft-schema validation` took 67 seconds, which made the pre-push tier `D-369`
    introduced cost 70 seconds rather than the second or two a registry check should.
    Profiling found two causes and neither was schema validation. First, every YAML read
    in the repository used PyYAML's pure-Python scanner: 163 of 245 profiled seconds were
    `yaml.load`, over 12.6 million `check_token` calls, while libyaml ships with the
    pinned wheels and nothing was asking for it. Second, and larger in what remained,
    `cross_checks` runs `verify_packing` over 96 packings -- 166,134 separation tests and
    507,156 exact projections -- inside a step named for schemas.
  consequence: >-
    Wall clock and, through it, behaviour: a check that costs a minute is a check nobody
    runs before a push, which is the mechanism `D-369` records. Measured after the loader
    fix, the actual schema validation is `0.38s` for the 100 frontier cases, `0.03s` for
    the frontier datasets and `0.08s` for `defects.yaml`. The cost is `8.64s` of jsonschema
    descent over 208 witness files and `10.29s` of exact geometry. Nothing was validated
    wrongly; the step was priced as if schemas were expensive when they are not.
  fix: >-
    Three changes, `67.4s` to `15.5s`. `sqpack.yamlio` bases both loaders on
    `yaml.CSafeLoader` where libyaml is present, keeping the duplicate-key refusal, and
    adds a `safe_load` the 31 modules calling `yaml.safe_load` directly now use --
    `11.3x` on `defects.yaml` alone. `Draft202012Validator` is built once per schema
    rather than once per document, which had been re-reading and re-compiling each of 23
    schemas fourteen times over. And the grid replay is bucketed, which is sound rather
    than convenient: `verify_packing` establishes that every piece is a unit square, two
    unit squares overlap only if their centres are within `sqrt(2)`, and a bucket of side
    2 with its eight neighbours contains every such pair -- 166,650 exact pair tests
    become 57,665 and nothing a full sweep would have judged is skipped.

    ruamel.yaml was measured as an alternative and rejected. On 81 of this repository's
    own files, 1 MB: PyYAML `CSafeLoader` `0.128s`, PyYAML pure `1.370s`, ruamel
    `typ=safe` `1.991s`, ruamel `typ=safe, pure=False` `1.976s`, ruamel round-trip
    `2.730s`. Its `pure=False` buys nothing in this build and its value, comment-preserving
    round-trips, is not something this repository needs.

    What remained after those three was `6.06s` of jsonschema descent over 208 witness
    files carrying 3.7 MB of exact rationals, and `3.58s` of exact grid verification. Both
    are now fixed under `BC-077`, and the pre-push tier measures `16.05s` before and
    `4.48s` after on one container on 2026-08-30:

    The validator is `jsonschema-rs`, PyO3 bindings to the Rust crate, pinned to `0.49.9`
    rather than to the newest release because `0.52.0` was four days old on the day this
    landed and the 14-day cool-off applies to a validator as much as to anything else.
    Over the real corpus, 339 artifacts against 23 schemas, across five runs on
    2026-08-30: `jsonschema` validates in `7145-7750ms` and `jsonschema-rs` in `55-88ms`,
    a ratio between `83x` and `137x`. The range is quoted rather than a point because the
    Rust side is small enough that container scheduling noise moves it by half, while the
    Python side barely moves; a single run of this comparison is not a measurement.

    That matters for a second reason. The spec proposing the swap predicted `559x` from a
    scratch script over a 314-document subset, and no run of the real corpus reproduces
    it. The prediction was taken on a different corpus and stated as a point;
    `benchmarks/bench_schema_validation.py` is what makes the honest figure reproducible.
    The decision does not turn on which end of the range is taken, which is the useful
    property of a gap this size.

    Two corrections to that spec, both found by making the comparison repeatable rather
    than remembering it. First, the speedup above. Second, and the one that could have
    cost something: the spec recorded `error.message` as "byte-identical on the cases
    checked". It is not. The two libraries quote differently and systematically --
    `jsonschema` renders `'a' is a required property` where `jsonschema-rs` renders
    `"a" is a required property` -- so any consumer parsing that text would have broken
    silently. Nothing in this repository parses it, which is why the swap is still safe,
    but the equivalence that holds is verdict and instance path rather than message text,
    and the test asserts the quoting difference rather than normalising it away unstated.

    The exact grid replay moved out of `soft-schema validation` into `exact verification`,
    where a reader looks for exact geometry and where its cost is legible. Nothing about
    the check changed: the same cases are replayed with the same predicate to the same
    verdict, and `devtools.check_basic_bounds` run directly still does both halves.

    Measured on one container on 2026-08-30, `packing-validate --records`: `16.05s` before,
    `4.48s` after, with `soft-schema validation` falling from `15.71s` to `4.48s` and
    `exact verification` rising from `2.8s` to `6.35s` in a tier that does not contain it.
  regression: >-
    `test_yaml_is_read_only_through_the_project_loader` walks `src`, `devtools` and
    `cases` for `yaml.safe_load` or a bare `yaml.SafeLoader` and fails on either, so the
    pure-Python scanner cannot return one call site at a time. The duplicate-key guard was
    re-checked under the C loader before the base class changed.

    For the validator swap, `tests/test_schema_validator_equivalence.py` runs both
    libraries side by side over all 339 enforced artifacts and over generated mutations of
    them -- dropped required keys, retyped values, emptied arrays, unexpected properties --
    and fails on any disagreement in verdict or instance path. A faster validator that
    accepts one artifact the old one rejected is a soundness regression that buys six
    seconds, and it would be invisible in the timings that motivated the change. Three
    guards keep that test honest as it grows: one asserts the mutation generator actually
    produces rejections rather than quietly emitting valid documents, one asserts every
    schema in the corpus keeps a mutation representative through deduplication, and one
    asserts no mutation writes through to the shared payload.
  bead: think-64bw
  recorded_in: packing/src/sqpack/yamlio.py
- id: D-371
  title: The control snapshot guard was one artifact from refusing to run at all
  date: '2026-08-29'
  layer: tooling
  class: robustness
  detected_by: review
  latent_for: 'since the atlas renderings grew past 18 MiB'
  severity: low
  status: fixed
  what: >-
    `run_negative_controls` copies a source snapshot per worker and refuses to start if
    that snapshot exceeds `SNAPSHOT_MAX_BYTES`. Measured on 2026-08-29 the snapshot was
    39.20 MiB against a 40 MiB cap, 98% of it, with `atlas/` at 18.16 MiB the largest
    contributor. Any artifact of ordinary size would have taken it over, and the failure
    mode is not a slow run but a hard refusal to run the control suite at all.
  consequence: >-
    None yet, which is the point of recording it. The suite is what establishes that
    every guard in this project actually fires, so a cap that stops it is a
    claim-integrity outage wearing a resource-limit's clothes, and it would have arrived
    on whichever commit happened to add a figure.
  fix: >-
    Raised to 64 MiB with the reasoning written at the constant: the cap exists to stop a
    gigabyte of data being checked in, not to track the record's ordinary growth, and cost
    is the cap times the worker count, so 64 MiB across three private trees is still
    bounded. Pruning what no control reads is the alternative to raising it again and
    belongs with the tier work in `BC-075` rather than in an unrelated commit.
  regression: >-
    The guard already reports the measured size on every run, which is how this was seen.
    No new check: a second guard on the headroom of the first is the kind of process this
    project adds only for a named benefit, and the named benefit here is served by the
    number being printed.
  bead: think-c46d
  recorded_in: packing/devtools/run_negative_controls.py
- id: D-372
  title: The reader-facing tier said four built capabilities were unbuilt, for four days
  date: '2026-08-30'
  layer: docs
  class: bookkeeping
  detected_by: review
  latent_for: 'from BC-054 in session-038 until the first W8 pass'
  severity: medium
  status: fixed
  what: >-
    `SYNOPSIS.md`, `TUTORIAL.md` and `README.md` all described the numeric-to-symbolic
    promotion route as unbuilt after every one of its components had landed. The synopsis
    sentence read "The project does not generically infer corner-edge incidences, assemble
    and close contact equations, recognize an algebraic field, or certify existence and
    uniqueness near a numerical root", and all four clauses were false:
    `sqpack.promote.contacts`, `.system`, `.solve` and `.krawczyk` each existed and were
    exercised. The same paragraph then said, two sentences later, "The interval strategy is
    now built and replayable", so it contradicted itself in place. `TUTORIAL.md` carried the
    matching claim, and `README.md`'s code inventory listed three components where the
    record had six.
  consequence: >-
    Understatement rather than overstatement, which is the direction this project would
    choose if it had to choose, and still a claim-integrity failure: a reader deciding
    whether a capability exists got the wrong answer from all three reader-facing
    documents at once. The mechanism is what matters. `check_synopsis` binds the synopsis
    to the artifacts, so the synopsis absorbed each result as it landed -- and the binding
    covers generated blocks and aggregates, not prose, so a hand-written paragraph in the
    same file drifted for four days while the file passed its own checker every time.
    Nothing binds `README.md` or `TUTORIAL.md` at all.
  fix: >-
    All three reconciled in the first W8 documentation pass, against the modules rather
    than against each other. The claim boundary is now stated where it actually falls,
    which is not where either the old text or the first draft of the new text put it: the
    components are built and general, a case-specific driver has certified `n = 29`, the
    public `packing-witness promote --strategy interval-existence` still raises the typed
    `checker-not-built` gap because no generic route from an arbitrary `Witness/v2`
    exists, and the certificate that does exist is retained `unresolved` and promotes
    nothing pending human review.

    Worth recording that the first attempt at the fix overstated in the opposite
    direction. It said what remained was "a decision, not a component", which skipped the
    missing CLI wiring; the error was caught by checking which entry point actually
    produced the `n = 29` certificate rather than by rereading the prose. A documentation
    pass that reconciles prose against prose reproduces this failure with more confidence.
  regression: >-
    None added, and the absence is the finding rather than an omission. A checker that
    bound README and TUTORIAL prose to the artifacts the way `check_synopsis` binds the
    synopsis would have to decide what a sentence claims, which no check here can do.
    What this defect argues for instead is `OR-7`'s cadence and the W8 checklist: read the
    artifacts first and the documents second, because a pass that starts from the prose
    inherits the prose's mistakes. `BC-078` is the first pass run that way.
  bead: think-eb29
  recorded_in: SYNOPSIS.md
- id: D-373
  title: The identity acceptance rule named only controls whose answer was one
  date: '2026-08-30'
  layer: record
  class: validity
  direction: flattering
  detected_by: control_cell
  latent_for: 'from BC-046 registration on 2026-08-24 until it was first run'
  severity: medium
  status: fixed
  what: >-
    `BC-046` set its exit as "a declared identity relation with a criterion that the exact
    n = 3 sliding family and the exact n = 4 point both satisfy". Those are the `D4 x S3`
    and `D4 x S4` quotient controls, and both have component count **one**. Any relation
    that merges everything therefore passes the rule. `side alone` is such a relation --
    every point of an optimal configuration space carries the optimal side by definition,
    so it returns one at every level -- and it is independently known wrong, since `D-034`
    records two n = 5 rows sharing side `2.767766952966` while differing geometrically.
    Scored under the rule as written, three of four candidate relations survive. That
    count is two once `D-375` corrects the level `geometric + contact` was scored at; the
    finding is unchanged, since `side alone` and `contact + closure` remain
    indistinguishable under the rule.
  consequence: >-
    None realised, because the rule had not been run before `BC-080` ran it. The direction
    is flattering: a criterion satisfied by a merge-everything relation would have licensed
    declaring the identity question settled, and a settled identity relation is the
    precondition the census and the discovery curve are waiting on. The failure is not that
    the controls are wrong -- they are exact and proved -- but that every control in the set
    had the same answer, so the set was checking a constant.
  fix: >-
    The labelled controls join the set. `exp-014` proves the labelled n = 3 space is two
    circles and `exp-015` proves the labelled n = 4 space is 24 isolated grids, so the
    four proved answers are now `2`, `1`, `24`, `1` rather than `1` and `1`. Under the
    widened set exactly one candidate survives -- contact certificates merged along the
    retained strata closure -- and `side alone` is refuted by both labelled controls.

    The two controls also turn out to isolate independent failures rather than duplicate
    one test, which is why widening the set was available at all: n = 4 is pure symmetry
    with no connectivity anywhere, and n = 3 is pure connectivity inside a single orbit.
    `distinct_basins` is wrong on both counts and the errors compose, so it is a strict
    upper bound on the component count rather than an estimate of it.

    The generalisable half is recorded in `X-005` rather than only here: a criterion
    validated only on cases whose answer is one is validated against a constant, and that
    is not specific to identity.
  regression: >-
    `devtools/check_identity_relation.py` scores every candidate against all four proved
    answers, reading the component counts out of the retained experiment JSON rather than
    from a number typed into the checker, and refuses with `--check` if the control set
    stops separating the candidates. `tests/test_identity_relation.py` pins the verdicts,
    including the one that is the finding itself: `side alone` must still survive the
    quotient controls alone, because if it stops doing so this defect has silently changed
    rather than been fixed.
  bead: think-0yo9
  recorded_in: packing/campaign/explorations/X-005-identity-relation-and-its-controls.md
- id: D-374
  title: The agenda queue offered four finished commitments as takeable
  date: '2026-08-30'
  layer: record
  class: validity
  direction: flattering
  detected_by: inspection
  latent_for: 'from agenda-006 closing those cells on 2026-08-29 until the map was built'
  severity: medium
  status: fixed
  what: >-
    agenda-005 `BC-045` asks for outward-rounded interval certificates at n = 5, 10 and 11
    with refusal controls and n = 29 recorded unresolved. agenda-006 `BC-053` has that
    exact exit and is `complete`. The same holds for `BC-043` against `BC-054`, `BC-044`
    against `BC-060`, and `BC-048` against `BC-061`. All four stayed `ready`, so the queue
    advertised eleven takeable commitments where seven were takeable.

    Separately, four commitments were `blocked` with an empty `depends_on` and no other
    field naming a blocker, so what they waited on existed only in prose inside an `entry`
    string. `BC-029`'s stated predecessor `BC-027` had been complete since agenda-003
    closed, and nothing surfaced that.

    Only agenda-007 declared its discharges at all, and it declared them in `note`, which
    is prose no checker reads.
  consequence: >-
    None realised, because no session took one of the four. The direction is flattering in
    the way a stale queue always is: the work looks available, a session following `OR-4`
    correctly takes it, and the redone result agrees with the retained one, which reads as
    confirmation rather than as waste. Roughly four commitments' worth of research time was
    exposed.

    The narrower cost is that `OR-4` names the agenda queue as authoritative precisely so a
    coordinator does not have to reconstruct priority from `tbd ready`. A queue that
    misreports what is takeable removes the reason that rule exists.
  fix: >-
    Discharge is an edge, not prose. `discharged_by` joins the agenda schema and is carried
    by the eight commitments another commitment actually satisfied -- the four found here,
    plus the three agenda-007 had recorded only in prose, plus `BC-051`, whose scope moved
    to `BC-084` and which is therefore `stopped` rather than `complete`, since `BC-084` has
    not run.

    `blocked_on` joins the schema for a blocker that is not a commitment: an artifact that
    does not exist, or a decision. `BC-016` and `BC-050` wait on artifacts nothing produces,
    `BC-029` waits on an independent acceptance decision, and `BC-033` waits on `D-034`,
    which is still outstanding. `BC-029` and `BC-033` also gained the dependency edges their
    prose had named.

    agenda-006 is `completed`. Six of seven agendas had declared themselves `active`, which
    made the field unable to answer the question it looks like it answers.
  regression: >-
    `devtools/render_agenda_map.py` renders `packing/campaign/agenda-map.md` from every
    agenda's frontmatter and refuses, rather than reports, three shapes: a commitment that
    is `ready` while naming a `discharged_by`, a `blocked` commitment with neither a
    predecessor nor a `blocked_on`, and any edge pointing at an id that is not a
    commitment. The refusal runs before the render, so a contradictory queue cannot reach
    the generated document. Drift-checked in `packing-validate --records` at 0.14s.

    `tests/test_agenda_map.py` pins the two invariants and the state vocabulary against the
    schema enum rather than a copy of it. Four negative controls, each watched failing: the
    map edited by hand, a commitment changing state without the map following, a discharged
    commitment offered as takeable again, and a blocked commitment whose stated blocker is
    removed.
  bead: think-s424
  recorded_in: packing/campaign/agendas/agenda-008-queue-repair-and-the-discriminating-control.md
- id: D-375
  title: The atlas relation was scored at the wrong level, and the n=4 control separates nothing
  date: '2026-08-30'
  layer: record
  class: validity
  direction: flattering
  detected_by: control_cell
  latent_for: 'from X-005 on 2026-08-30 until exp-015 retained its per-sample keys the same day'
  severity: medium
  status: fixed
  what: >-
    `X-005` declared `geometric + contact` -- the relation `Atlas.add` implements -- at
    level `labelled`, and refuted it on the `n = 3` labelled control. It is a quotient
    statement and cannot distinguish two labelled components differing only by a
    relabelling. `X-005` made precisely that argument for `contact alone` and
    `contact + closure`, and did not apply it to this relation.

    **The first version of this defect said the two keys are relabelling-invariant "by
    construction", and that is too strong for one of them.** `geometric_key` is: it sorts
    the squares and minimises the digest over the eight container images, and 3000 fuzzed
    `D4` images produced no mismatch. `contact_certificate` is not a canonical form. Its
    colour refinement breaks ties among equal-sized classes in dict insertion order, which
    is input labelling; and `angle_classes` is a greedy first-fit against class
    representatives, so it chains order-dependently near its `1e-2` tolerance --
    `angle_classes([0, 1e-6, 2e-6])` gives `[[0,1],[2]]` while `angle_classes([1e-6, 0,
    2e-6])` gives `[[0,1,2]]`, flipping the angle signature for the same packing. Over
    well-separated angles, 400 fuzzed relabellings produced no mismatch, which is why this
    has never bitten here.

    The re-levelling stands, because it does not rest on the "by construction" argument:
    exp-015's 24 labelled states are measured to collapse to one geometric key and one
    contact certificate, so on the control in question the relation demonstrably is a
    quotient statement. It was the justification that was wrong, not the verdict.

    Two claims rested on the mis-levelling. First, "three of the four candidates survive
    the quotient controls alone" is two. Second, and more substantially, `X-005` argued
    that `distinct_basins` is "wrong twice over, and the two errors compose", making it a
    strict upper bound on the quotient component count. The `n = 4` half of that is a
    failure of *a relation that does not quotient*, and `distinct_basins` is not that
    relation: measured on the `n = 4` quotient control it reports 1 against a proved 1.
    There is one error, not two -- the geometric key's quantization splitting a connected
    family, which is `D-034`.

    Separately, the `n = 4` labelled control, once scoreable, refutes every candidate and
    separates none: its 24 states differ only by relabelling, every candidate relation is
    relabelling invariant, and each reports 1 against a proved 24.
  consequence: >-
    The conclusion did not move. `contact + closure` is still the sole survivor of all four
    proved answers, and the refutation of `geometric + contact` is unchanged in force --
    only reattributed to the control that can carry it, the `n = 3` quotient control at 4
    against 1.

    The direction is flattering in the specific way a mis-levelled score always is: the
    relation was refuted for a reason it was not guilty of, which makes the instrument look
    more discriminating than it is. Had the level been read off the implementation rather
    than assumed, the `n = 4` labelled control would have been recognised as unable to
    separate anything before it was cited as one of the two controls that do.
  fix: >-
    `BC-082` retained per-sample geometric keys and contact certificates for `exp-015`'s 24
    labelled states, which `X-005` had named as the cheap missing piece. They are produced
    by `grid_sample_record`, shared with the `n = 3` sampler rather than written a second
    time: keys computed by a different function would not have been comparable, and an
    incomparable verdict is worse than the `undecidable` it replaced. `exp-014` regenerates
    byte-identically after the refactor, and `exp-015` differs only by the added `samples`
    key -- no proved count moves.

    `geometric + contact` is redeclared `quotient`. `X-005` carries a dated addendum rather
    than a rewrite, since it is a dated record.
  regression: >-
    `tests/test_identity_relation.py` pins the corrected verdict -- refuted at `n = 3`
    quotient, `n/a` at both labelled controls -- and adds
    `test_no_relabelling_invariant_relation_can_pass_a_labelled_control`, which asserts
    that every candidate the `n = 4` labelled control can score reports exactly 1. That
    test is the finding: if a candidate ever reports something else there, the family has
    stopped being relabelling invariant and the reasoning behind `BC-083`'s exit wording
    has to be redone.
  bead: think-m2j8
  recorded_in: packing/campaign/explorations/X-005-identity-relation-and-its-controls.md
- id: D-376
  title: The n=5 pair D-034 has quoted since August was never retained
  date: '2026-08-30'
  layer: record
  class: bookkeeping
  direction: neutral
  detected_by: inspection
  latent_for: 'from D-034 on 2026-08-23 until BC-083 went looking for the two endpoints'
  severity: low
  status: fixed
  what: >-
    `D-034` states that two `n = 5` rows share side `2.767766952966`, closed form, contact
    certificate, angle signature and contact count while differing geometrically. That
    sentence has been cited by `D-034`, `X-005`, `H-023` and the ledger, and the two
    endpoints it describes were never retained anywhere. `golden/basin-maps.yaml` keeps the
    aggregate rows -- side, contact count, angle classes, frequencies -- and not the poses
    or the keys, so nothing downstream could check the claim or score a relation against
    it.

    The claim was true. Rebuilt from the fixed seed stream, the two endpoints share
    contact certificate `5dcbd27037e1bd5227723319c9f55c72`, differ in geometric key, and
    differ in side by `8.9e-16`, which is four orders of magnitude below the `1e-11` quench
    floor `D-021` records.
  consequence: >-
    None realised, and the direction is neutral rather than flattering: the claim held when
    it was finally checked. The cost was that the one control capable of separating
    `geometric + contact` from `contact + closure` could not be constructed, so `BC-046`
    and `BC-080` both ran without it and `X-005` reported the `n = 4` labelled control as
    the discriminating one -- which `D-375` then showed it is not.

    The general shape is worth more than this instance: a defect that quotes a measurement
    and retains nothing leaves a claim that can be repeated but not used.
  fix: >-
    `devtools/build_n5_identity_pair.py` reproduces the pair through `check_golden_basins`'s
    own census functions rather than a second census, and retains both poses, both keys and
    the measured invariants as `bc-083-n5-identity-pair.json`. `component_count` is `null`
    with a field saying why, so the artifact cannot be mistaken for a proof.

    `check_identity_relation` scores it as a prospective control: what each relation reports
    on the pair, and what each of the two possible answers would decide. `X-006` owns the
    argument.
  regression: >-
    `packing-validate` gains a step re-running the six-seed census and comparing the pair's
    keys, at 28s. It is deliberately not in `--records` or `--edit`: a census that stopped
    reproducing the pair would invalidate the control without changing a single file, which
    is exactly the failure a retained-but-unreplayed artifact allows.

    `tests/test_identity_relation.py` asserts the measured invariants, that the side
    difference is below the `D-021` floor, and that `component_count` stays `null` -- a
    proved count appearing there without closing `D-034` would be the same false claim
    this defect is about.
  bead: think-6zaz
  recorded_in: packing/campaign/explorations/X-006-the-discriminating-control-at-n5.md
- id: D-377
  title: A read-only delegation cannot be recorded while it is running
  date: '2026-08-30'
  layer: record
  class: bookkeeping
  direction: neutral
  detected_by: inspection
  latent_for: >-
    since the AgentSession/v2 write_scope invariant was written -- found the first time a
    session delegated purely read-only investigation and tried to record it live
  severity: low
  status: contained
  what: >-
    `packing-ledger check` requires an `in_progress` delegation to carry a `write_scope`,
    and the schema requires `write_scope` to be non-empty when present. A delegation that
    is read-only by construction -- investigation, review, audit, the three kinds `OR-2`
    names as the ones that parallelise best -- has an empty write surface, and there is no
    way to say so. Recording it live requires either inventing a write surface it will not
    use or omitting the delegation entirely.

    The invariant's intent is sound: a running delegation with an undeclared write surface
    is a coordinator not knowing what may change underneath it. The gap is that "nothing"
    is a legitimate answer the encoding cannot express, and it is the answer for exactly
    the delegations `OR-2` most encourages.
  consequence: >-
    Session-045 delegated four read-only sub-agents and recorded `delegations: []` while
    they ran, filling them in on completion. That understates parallelism in the live
    record: a reader of the running session cannot see that four investigations are in
    flight, which is the one thing the field exists to show.

    Neutral rather than flattering. Nothing is claimed that is not true; something true is
    unsayable.
  fix: >-
    Not fixed. Contained by recording the delegations retrospectively on completion, which
    is what session-045 does, and by this defect naming why the live record is thinner than
    the session was.

    The repair is a schema decision rather than a code change, and it belongs to whoever
    owns the session contract: either allow an empty `write_scope` when a delegation
    declares itself read-only, or add an explicit `read_only: true` that the invariant
    accepts in place of a write surface. The second is better -- an empty list is
    ambiguous between "writes nothing" and "nobody filled this in", and that ambiguity is
    the reason the invariant exists.
  regression: >-
    None. A defect in what a schema can express is not caught by running anything; it is
    caught by a session trying to record something true and finding it cannot. The next
    session to delegate read-only work will hit it identically, which is the intended
    signal.
  bead: think-s424
  recorded_in: packing/campaign/agent-sessions/session-045-agenda008-queue-and-identity.md
- id: D-378
  title: No retained control can separate the surviving identity relation from merging everything
  date: '2026-08-30'
  layer: record
  class: validity
  direction: flattering
  detected_by: review
  latent_for: 'from X-005 on 2026-08-30 until a review asked what the relation reads'
  severity: medium
  status: contained
  what: >-
    `contact + closure` is the declared surviving relation: two endpoints are the same
    terminal component when their contact certificates agree, or when the strata those
    certificates name lie in one closure. Its only distinguishing verdict is `agrees` on
    the `n = 3` quotient control, and that verdict cannot test it.

    The record carries exactly one closure set, `closure(G) = [C, G, M]`, and it covers
    every stratum the `n = 3` quotient has. Any faithful implementation therefore returns
    one there whatever the certificates say -- verified by mutation: with the retained
    samples, with all four given distinct certificates, and with all four given the same
    certificate, the answer is one in every case.

    Compounding it, the implementation was not faithful either. It computed the
    certificate count and then discarded it whenever any closure existed, returning the
    number of closure classes alone. On the retained controls that is the same answer, so
    no verdict moved, but half the relation's definition was unread.
  consequence: >-
    Flattering, and it weakens the conclusion `X-005`, `D-373`, `D-375` and `X-006` all
    rest on. "`contact + closure` is the sole survivor of all four proved answers" is
    true, but the one cell that separates it from `contact alone` is a cell where the
    closure structure makes the answer one regardless.

    So the retained controls do not distinguish it from a relation that merges everything
    -- which is `D-373`'s finding at a level below the one `D-373` stated. There the
    problem was that every control's answer is one; here it is that the closure itself is
    degenerate, so even a control whose answer were not one would not separate them unless
    it carried two or more disjoint closure classes. None does.
  fix: >-
    Not fixed, and not fixable from the retained record. Contained in three ways.

    `relation_contact_with_closure` now reads both halves: certificates partition the
    samples, closure sets merge the partitions, and a certificate spanning two strata
    merges them too. No scored verdict moves. A synthetic control with two disjoint
    closure classes exercises the certificate half that no retained control reaches.

    `X-006` states the degeneracy where it matters -- it is the reason the `n = 5` pair is
    the first control to reach the relation's certificate half at all, since it carries no
    closure for the merge to hide behind.

    A real fix needs a control with two or more disjoint closure classes, which is a new
    exact classification rather than a repair.
  regression: >-
    `tests/test_identity_relation.py` asserts the degeneracy directly: every retained
    control with closure data has exactly one closure class, and that class covers every
    stratum. If a future control adds a second, disjoint class, that assertion fails --
    and the failure is the good news, because it means the relation has become testable.

    A second test pins the certificate half against a synthetic two-class control, so a
    future implementation that again discards its certificates is caught.
  bead: think-6zaz
  recorded_in: packing/campaign/explorations/X-006-the-discriminating-control-at-n5.md
- id: D-379
  title: An operating rule understated its own measured cost by quoting the transcript, not the rollup
  date: '2026-08-30'
  layer: record
  class: bookkeeping
  direction: flattering
  detected_by: review
  latent_for: 'from the OR-3 rewrite on 2026-08-30 until an audit compared it with the rollup'
  severity: low
  status: fixed
  what: >-
    `OR-3` gained a paragraph pricing the waste it exists to prevent: time spent watching a
    gate finish. It reported `233.6s` across three `.gate-running` polling calls and "about
    17% of the session".

    The retained rollup for that same session records `.gate-running` at **four** calls
    totalling `345.119s`, a test-wait command at three calls totalling `245.602s`, and
    `wall_seconds: 3187.584` -- so the share is **18.5%**, not 17%. The same commit
    reported `585.6s across 63 one-off code invocations`; the rollup's `one_off_code` block
    says `count: 72, total_seconds: 732.861`.

    Both figures were read off the transcript by hand while the rollup that measures them
    sat in the repository, which is `OR-1` inside the rule that cites `OR-1`'s sibling.
  consequence: >-
    Flattering, and pointedly so: every error understated the waste. A rule justified by a
    number is only as strong as the number, and a reader checking `OR-3` against the rollup
    would have found the rule's own evidence contradicting its source -- which is the fastest
    way to make a rule ignorable.

    Nothing downstream consumed the figures, so no other claim moved.
  fix: >-
    `OR-3` now quotes the rollup's fields and names the file, and says what the earlier
    numbers were so a reader who saw them can tell which is current.
  regression: >-
    None that runs. `check_synopsis` binds generated blocks and aggregates, not prose in
    `operating-rules.md`, and a checker that verified a sentence against a YAML field would
    have to be told which field the sentence means -- the same limit `D-372` records for
    `README.md` and `TUTORIAL.md`.

    What contains it is narrower and worth stating: a number in a rule should name the
    artifact it came from, so the next reader can check it in one lookup rather than
    re-deriving it. That is now true of this paragraph and is the pattern to copy.
  bead: think-s424
  recorded_in: operating-rules.md
- id: D-380
  title: A superseded CI run reported the required check as a hard failure
  date: '2026-08-30'
  layer: tooling
  class: robustness
  direction: conservative
  detected_by: anomaly
  latent_for: 'since packing-required was written; surfaced when pushes became frequent enough to supersede runs'
  severity: low
  status: fixed
  what: >-
    `packing-validation.yml` sets `cancel-in-progress: true`, so a push while a run is in
    flight cancels it. The `packing-required` job guarded itself with `always()`, so it
    still ran against the cancelled `validate` and evaluated
    `test "$VALIDATE_RESULT" = "success"` against `cancelled`, exiting 1.

    The required check therefore reported a hard failure for a run that had simply been
    replaced. Twice within ten minutes on 2026-08-30, at `520366d` and `2fd8a8d`, each
    waking a session to diagnose a red check whose log said only `VALIDATE_RESULT:
    cancelled`.
  consequence: >-
    Not a soundness problem and not flattering -- it errs red, not green. The cost is
    attention and trust. `OR-3` tells a session to push and keep working rather than wait,
    which makes supersession routine, so following the operating rule reliably produces
    false red on the PR. A check that cries wolf is the mechanism by which a real failure
    gets scrolled past, and the workflow's own header comment already argues that "a check
    that can never pass teaches everyone to ignore CI".
  fix: >-
    The guard is `!cancelled()` rather than `always()`. A cancelled run now reports nothing
    and the required check stays pending, which is the safe direction; a genuine `validate`
    failure is not `cancelled()`, so the job still runs and still fails.

    Pending rather than green does not reintroduce the stuck-forever case the header
    comment warns about, because supersession always starts a replacement run that supplies
    the check. A run cancelled by hand with no successor leaves the check pending, and that
    is correct: someone stopped the validation.
  regression: >-
    None that this repository can run -- the behaviour is GitHub's job-scheduling
    semantics, reproducible only by superseding a live run. What replaces a test is that
    the condition now states its intent, and the next occurrence is visible as an absent
    check rather than a red one, which is self-describing in a way the failure was not.
  bead: think-s424
  recorded_in: .github/workflows/packing-validation.yml

- id: D-381
  title: The pre-push tier is blind to a test that pins a string in the code it tests
  date: '2026-08-30'
  layer: tooling
  class: validity
  direction: conservative
  detected_by: gate
  latent_for: 'since --edit was introduced on 2026-08-30; two occurrences the same day'
  severity: low
  status: fixed
  what: >-
    `--edit` (43s) selects the fast steps that are not `broad`, and `fast behavioral tests`
    is `broad`, so the edit tier runs no tests at all. That is the deliberate design --
    `D-369` measured seven CI failures, every one a record check and none a test -- and it
    is right about record drift. It is wrong about one class it did not anticipate: a test
    that pins a **literal string emitted by the source under test**. Such a test is not a
    record check, so no record step sees it, and it is in the excluded step, so the edit
    tier does not run it either.

    Twice on 2026-08-30, five commits apart:

    - `47059fd` changed the `packing-required` guard from `always()` to `!cancelled()`;
      `tests/test_module_boundaries.py` pinned the old expression and failed in CI.
    - `a54797e` added `--since`, which lengthened the `--strict` refusal to name it;
      `tests/test_validation_cli.py:438` pinned the old sentence and failed four times over
      at `c9d768c`.

    Both were caught, both cost a CI round trip, and in both cases the code was correct and
    the pin was stale.
  consequence: >-
    Attention, and a specific bad habit. The failing assertion is always in a test the
    author has just made obsolete, so the fix is always "edit the assertion" -- which is
    indistinguishable, from inside the moment, from weakening a guard to make it pass. A
    guard that reliably fails for non-defects is a guard people learn to edit rather than
    to read.

    It is also a `BC-084` failure of use rather than of construction. `--since` selects
    every step an unattributed step could be affected by, and `fast behavioral tests` is
    unattributed, so `packing-validate --since origin/main` would have run the tests and
    caught both. The instrument existed at the second occurrence and was not used.
  fix: >-
    Two changes, neither of which is widening the edit tier.

    The stale pin is replaced by a per-flag assertion: the refusal must name the flag that
    was passed, rather than read a fixed sentence. That is strictly stronger against the
    risk the test's own docstring states -- a new tier flag added to the selector and
    forgotten in the refusal -- and it does not break when the behaviour is extended
    correctly. `--since` is now parametrized alongside the four flags that were there.

    The habit is fixed by `OR-7`'s neighbourhood rather than by a new tier: `--fast` at a
    commit boundary, not `--edit`. Widening `--edit` to include the test step would put its
    529 seconds back and recreate exactly the tier-too-expensive-to-run problem `D-369`
    records, trading a rare stale pin for a tier nobody runs.

    A refinement, measured the same day by getting it wrong again: `--records` alone is not
    enough before a push. On 2026-08-30 a push validated only at `--records` failed CI on
    the type floor, for a `reportPrivateUsage` warning that `--edit` catches in 43 seconds.
    The tiers divide the work cleanly and the division is worth stating: `--records` (6s)
    catches record drift, `--edit` (43s) adds lint and types, and only a test pinning a
    literal the source computes needs `--fast`. The pre-push floor is `--edit`, not
    `--records`.
  regression: >-
    `tests/test_validation_cli.py::test_strict_mode_refuses_a_partial_validation_surface`
    now parametrizes `--since` and asserts per flag, so a sixth narrowing flag added to the
    selector and forgotten in the refusal fails here. The class itself is not testable in
    general: what would have to be checked is that no test pins a literal the source
    computes, which is a property of every test at once.
  bead: think-s424
  recorded_in: packing/tests/test_validation_cli.py

- id: D-382
  title: A sentence asserted the rigidity its own next paragraph withdrew
  date: '2026-08-30'
  layer: record
  class: bookkeeping
  direction: flattering
  detected_by: review
  latent_for: 'one day, from 2026-08-29 to 2026-08-30'
  severity: low
  status: fixed
  what: >-
    `BC-063`'s note in `agenda-006` states, in bold, "So Goebel's `n = 5` is infinitesimally
    flexible and second-order rigid", and continues: "the packing is rigid but not
    infinitesimally so, a distinction the annotation does not make."

    The retained result it summarises says the opposite about its own reach. `bc-063`'s
    `claim_boundary` reads: "Both the rank and the walk are numerical, at the retained
    pose. ... It is consistent with local rigidity and does not establish it." The very next
    paragraph of the same note agrees, and says the frontier property stays `undetermined`
    because a rigidity property is a promotion an unattended runner may not make.

    So one paragraph asserts rigidity as established and the next withdraws it. The bold
    sentence is the quotable one.
  consequence: >-
    Small, and entirely about what a reader carries away. The qualification is a paragraph
    later and survives; nothing downstream consumed the overclaim, and the frontier record
    correctly reads `undetermined`. But it is the flattering direction, in bold, in the
    sentence a reader would quote, and this repository's own account of `D-354` is that the
    danger is a word becoming a finding by being repeated.

    It is also wrong twice over, which is what makes it worth an entry rather than a
    correction. `X-007` has since established the second-order obstruction exactly, on a
    verified self-stress rather than a sampled walk -- so the "second-order rigid" half is
    now true on evidence the note did not have. The "the packing is rigid" half is still not
    established even with that, because the step from "no arc with nonzero derivative" to
    local rigidity is a cited semi-algebraic argument that nothing here runs. A sentence can
    be overtaken by later work in one clause and still be wrong in the other.
  fix: >-
    The note is appended to rather than rewritten. Editing a completed agenda's record of
    what a past session concluded would lose the thing worth keeping, which is that the
    session concluded it. The appended correction names the two halves separately and points
    at `X-007` for the one that has since been settled.
  regression: >-
    None mechanical, and the honest reason is that no checker can read a bold sentence
    against a JSON `claim_boundary` two files away. What replaces it is that `X-007` and
    `bc-049-n5-rigidity-certificates.json` both state the remaining gap in the same words --
    "no twice differentiable feasible arc leaves this pose with a nonzero derivative", which
    is not local rigidity -- so the next summary has a phrasing to copy that does not
    overclaim.
  bead: think-xdly
  recorded_in: packing/campaign/agendas/agenda-006-overnight-research-blocks.md

- id: D-383
  title: A cleanup error in the gate's own lock discarded a completed run's entire report
  date: '2026-08-30'
  layer: tooling
  class: robustness
  direction: neutral
  detected_by: anomaly
  latent_for: 'since the activity marker was introduced; surfaced the first time two gates overlapped'
  severity: medium
  status: fixed
  what: >-
    `_validation_activity` takes a directory as a mutual-exclusion lock and releases it with
    a bare `marker.rmdir()` in a `finally`. If the directory is already gone, that raises
    `FileNotFoundError` out of the `finally` block, which replaces whatever the run was
    about to report.

    On 2026-08-30 an operator cleared what they took for a stale `.gate-running` while a
    `--fast` run held it. All 25 minutes of steps completed; the summary was never printed.
    The log contained one traceback and nothing else -- no step results, no timings, no pass
    or fail. The run had to be repeated from the beginning to learn what it had already
    found.
  consequence: >-
    Not a soundness problem and not flattering: it destroys a report rather than falsifying
    one. The cost is the whole run, and the cost is paid at the end, when the expensive part
    is already done. `--fast` is the tier `D-381` argues should run at every commit
    boundary, so this makes the most expensive gate the most fragile one, which is the wrong
    way round.

    The trigger looks like operator error and partly is. But a lock whose release path can
    destroy the thing it was protecting is a bug on its own terms: the marker exists to stop
    two gates running at once, and by the time it is being released this gate is over.
  fix: >-
    The release is `with suppress(FileNotFoundError): marker.rmdir()`. Releasing a lock that
    is already released is not a failure. Acquisition is unchanged and still refuses to
    start when a marker exists, so nothing about the mutual exclusion is weakened -- only
    the teardown stops being able to lose a report.
  regression: >-
    `test_a_vanished_activity_marker_does_not_discard_the_run` deletes the marker from
    inside the block and asserts the context manager exits cleanly, which is exactly the
    sequence that happened. The acquisition half keeps its own test, so the pair pins both
    directions: a second gate is still refused, and a lost marker is still survivable.
  bead: think-s424
  recorded_in: packing/src/sqpack/cli/validate.py

- id: D-384
  title: A count keyed on id() moved between two identical runs
  date: '2026-08-30'
  layer: tooling
  class: bookkeeping
  direction: neutral
  detected_by: control_cell
  latent_for: 'two runs, about fifteen minutes'
  severity: low
  status: fixed
  what: >-
    `devtools/price_row_jet_sharing` decides `BC-038` by counting how many
    `evaluate_stress` calls share a number field, since an inventory that cannot be shared
    saves nothing. It keyed that on `id(field)`.

    `id()` is a memory address, and CPython reuses the address of a collected object. Two
    consecutive runs of the same twenty-four tests reported 11 and then 10 distinct number
    fields, with `shareable_rebuilds` moving from 19 to 18. Both runs passed all 24 tests
    and both counted 47 rebuilds and 35 stress calls, so nothing about the work changed; a
    field built by one test was collected and a later test's field landed on its address.
  consequence: >-
    Contained, because the numbers never left the working tree: the tool was run twice
    before anything was written down, and the disagreement is what surfaced the bug. Had it
    been run once, a retained record would have carried a count that its own `--check`
    would then have contradicted at the next run, and the obvious reading of that would
    have been that the test suite had changed.

    The verdict it supports does not move -- 47 rebuilds against 17 distinct pairs is a
    1.6x ceiling either way, nowhere near the five-fold the commitment requires -- so this
    cost a re-run rather than a conclusion.
  fix: >-
    An `Identities` map that assigns small integers by `is` comparison and holds a
    reference to each object it has seen, so an address cannot be recycled underneath the
    key. Holding about a dozen degree-two fields alive for the length of a run is a
    rounding error against the row jets being measured, and it is what makes the count a
    count.
  regression: >-
    None mechanical: the tool is not a gate step, deliberately, because its driver is the
    seven-minute exhaustive-exact group and the decision it supports is taken once. What
    replaces a test is the practice that caught it -- run a new measurement twice and
    compare before retaining either answer. That is cheap, it generalizes past this tool,
    and it is the only reason this was found at all.
  bead: think-kdil
  recorded_in: packing/devtools/price_row_jet_sharing.py

- id: D-385
  title: The composite figure badges rigidity from a hard-coded set and never reads the frontier
  date: '2026-08-30'
  layer: record
  class: bookkeeping
  direction: flattering
  detected_by: review
  latent_for: 'since the figure gained a rigidity badge; surfaced when n=5 acquired first-party evidence'
  severity: medium
  status: fixed
  what: >-
    `devtools/build_composite_figure_data.py` decides each record's rigidity from `n`
    alone. A perfect square gets `state: established, basis: perfect-square-tiling`; any `n`
    in the module-level `CATALOGUE_RIGID = {5, 11, 28, 40}` gets `state: established,
    basis: catalogue-annotation`; everything else gets `not-established`. The frontier
    record's own `rigidity` block is never opened.

    Both bases then emit the same badge, glyph `R`, meaning `rigid (established)`, and both
    count toward the same `rigidity_established` total of 14.

    So the figure says "established" for four packings on the strength of the catalogue
    printing the word "Rigid.", which is the transcription half of the `D-354` split, and it
    says it in the same glyph it uses for the ten it derives from an exact tiling.
  consequence: >-
    Two errors in opposite directions, from one missing read.

    It over-credits. `n = 28` and `n = 40` have no first-party rigidity evidence at all and
    their frontier records read `undetermined`; `n = 5` now reads `undetermined` on a
    first-party exact argument that stops short of local rigidity (`X-007`). The figure
    badges all three `rigid (established)`.

    It under-credits. `n = 11` carries `E-n011-trump-local-rigidity` at `assurance:
    verified` -- 128 branchwise linearized cones over an exact field -- and the figure files
    it under `catalogue-annotation`, crediting Kingbird for this repository's own strongest
    rigidity result.

    The figure is the most widely seen artifact here, and `established` is exactly the word
    the field split exists to reserve. The provenance fields are honest and nobody reads
    them; the glyph is what a reader takes away.
  fix: >-
    The figure reads each record's own rigidity block. `established` now means the block
    says `locally-rigid` and nothing else does, so the count falls from 14 to 11 and
    `n = 11` is credited to its own `verified` argument rather than to Kingbird.
    `CATALOGUE_RIGID` is gone: the basis is keyed on the evidence id the record carries,
    because deciding from `n` what the record already states is the general form of this
    mistake.

    The annotation is kept rather than deleted, which is the part worth arguing for.
    Dropping it would lose a fact the corpus holds and would make the figure quieter than
    the evidence. It is now a `not-established` entry with `basis: catalogue-annotation`, a
    **muted** `R` badge against the solid one, and its own line in the legend and its own
    total. Two facts, two glyphs.

    `n = 5` is the case that makes the distinction earn its keep. `X-007` establishes more
    about it than the catalogue ever said -- an exact one-dimensional infinitesimal cone
    refused at second order -- and still not local rigidity, so it holds the muted badge
    while carrying first-party evidence in the frontier.

    Fixing this also surfaced that the preview renderer probed only for `magick`,
    ImageMagick 7's name, and so refused to regenerate on every Debian and Ubuntu box,
    which still ship 6 as `convert`. Both are accepted now, and 6 renders the composite at
    the same 2400x2676 the receipt records.
  regression: >-
    `test_the_figure_never_claims_a_rigidity_its_record_does_not_carry` asserts, for all
    100 entries, that the figure's `established` agrees exactly with the record's
    `locally-rigid` -- the line whose absence is this entry.
    `test_a_catalogue_annotation_is_shown_but_never_counted` pins the other half: the three
    annotated records are `not-established` with a muted badge, the totals count the two
    kinds separately, and `n = 11` is `first-party-argument` with a solid one.
  bead: think-xdly
  recorded_in: packing/devtools/build_composite_figure_data.py

- id: D-386
  title: A session declared two phases starting an hour and a half after the clock read
  date: '2026-08-30'
  layer: record
  class: bookkeeping
  direction: neutral
  detected_by: gate
  latent_for: 'about twenty minutes, until a commit timestamp was read'
  severity: low
  status: fixed
  recurrence_of: D-358
  what: >-
    While writing `session-045`, phase 7 was declared `started_at: 10:16Z` with a deadline
    of `11:06Z`, and phase 8 `started_at: 11:10Z`. The clock read `09:52Z`. Both were
    inferred from how long the work had felt rather than read, and the inference ran about
    an hour and a quarter fast over four phases.

    The mechanism is the one `D-358` records: elapsed time estimated between tool calls
    rather than measured. `D-358`'s own fix said the practice change is to "read `date -u`
    at every block boundary", which is what this session stopped doing after the first two
    boundaries.
  consequence: >-
    Small in itself and caught within the same session -- the phase records were corrected
    against the commit timestamps before anything was pushed. What makes it worth an entry
    is that it is `D-358` happening again, in the artifact whose whole purpose is to tell a
    later session what happened, one day after `D-358` was written and while its `fix` field
    was still describing the practice that would have prevented it.

    That is the `D-010` and `D-017` shape: the second occurrence is evidence that a practice
    change without a check is not a fix. It is also why this is not filed as flattering --
    the error made the run look slower than it was, not faster.
  fix: >-
    `devtools/check_session_clocks`, a records-tier gate step, refuses a session artifact
    that declares a start time later than the moment of checking. A phase cannot have begun
    after the record of it was written, which is the exact shape of both occurrences.

    Where the line is drawn is the part that took the thinking. Phases running backwards
    looked like an obvious second refusal and is not: `session-044`'s phase 7 begins
    thirteen minutes before phase 6 because it ran as a delegated lane against a worktree
    and was integrated afterwards. Position in the file is authoring order, not wall-clock
    order, and no field separates them -- so that is printed with the reason rather than
    failed. The check found that case on its first run, which is also how the line got
    drawn correctly.
  regression: >-
    `tests/test_session_clocks.py` -- nine tests, including one asserting the refusal has no
    grace period at one second, and one asserting a backwards pair is reported and not
    refused. Two entries in `devtools/controls.yaml` mutate a real session record and watch
    the guard complain. The gate step runs in `--records` at `0.17s`.
  bead: think-s424
  recorded_in: packing/devtools/check_session_clocks.py
