  date: '2026-08-23'
  layer: record
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    runner.py appended command output before parsing or guard checks, then rebuilt cells
    during `record` from only n, seed, and best_side. A row with nonzero reported overlap
    could therefore be present in the authoritative archive, and direct or recovery-path
    record invocation could turn it into a scientific verdict without replaying the
    guards.
  consequence: >-
    Guard-invalid data could survive the very failure that detected it and later acquire
    a complete-looking verdict. Unattended operation could report an invalid packing or
    criterion result as accepted.
  fix: >-
    One result-line validator now guards live ingestion and record-time replay. Invalid
    rows are refused before they become scientific cells, and a guard failure releases
    rather than records the round.
