- id: D-018
  title: One round, two hypotheses, one verdict
  date: '2026-08-23'
  layer: record
  class: bookkeeping
  detected_by: drift_check
  latent_for: four rounds
  severity: high
  status: fixed
  what: >-
    A round may name several hypotheses but carries a single verdict, which is applied
    to all of them. Four rounds naming [H-002, H-019] made the generated ledger report
    H-019 as refuted by the very rounds whose data confirmed it.
  consequence: >-
    The record asserting the opposite of its own evidence, which for an archive meant to
    outlive the session is as serious as a wrong number.
  fix: >-
    Instances split into one round each, and the schema now caps `hypotheses` at one
    entry, so the shape cannot recur. A round bearing on a second claim cites it in
    prose or is split.
  regression: 'schema maxItems, plus a negative control that gives a round two hypotheses and asserts the gate refuses it'
  recorded_in: packing/campaign/series/series-000-smoke-and-calibration/experiments/exp-010-angle-kink-n11.md
  bead: think-lksm
- id: D-019
  title: The bracketing quench does not always terminate
  date: '2026-08-23'
  layer: quench
  class: robustness
  detected_by: anomaly
  latent_for: one round
  severity: medium
  status: fixed
  direction: conservative
  what: >-
    A cell whose LP solves in 5 ms consumed 8,020 solves without converging, taking a
    sweep past 145 s where its neighbours took 1 s. The root cause is a tolerance
    compared against the wrong scale: the line search tested `hi - lo > 1e-15` on angles
    the annealer had drifted to 14.14 rad, where one ULP is 1.78e-15. The interval could
    never shrink below the bound, so the loop could not terminate.
  consequence: >-
    A quench that does not return takes the whole round with it. Now bounded, but 2-3 of
    5 seeds hit the budget in every cell, so the recorded data is censored -- and
    censored exactly on the non-converged runs, which biases any median quoted from it.
  fix: >-
    Three layers. Angles are folded into [0, pi/2) on entry, since a unit square is
    invariant under a quarter turn and the drifted representation only costs precision;
    the line search tolerance is scaled to the value it brackets; and the iteration count
    is capped, because golden section reaches machine precision in about seventy steps
    and anything beyond that is stuck rather than converging. The wall budget stays as a
    backstop. The pathological cell now finishes in 1.6 s against 145 s, and lands at
    4.4e-16 rather than timing out.
  regression: 'the iteration cap makes non-termination impossible; the wall budget catches slowness that is not non-termination'
  recorded_in: packing/campaign/series/series-000-smoke-and-calibration/experiments/exp-009-quench-bracket-n11.md
  bead: think-x40t
- id: D-020
  title: The quench's answer depends on a tuning parameter, and basin identity would inherit it
  date: '2026-08-23'
  layer: quench
  class: soundness
  direction: flattering
  detected_by: inspection
  latent_for: 'not yet consequential -- found before the atlas was built'
  severity: high
  status: fixed
  what: >-
    quench_bracket merges angles within class_tol and forces them equal, so it returned
    the optimum of a constrained problem rather than a true local optimum.
  consequence: >-
    A packing whose optimum needs two angles closer than the tolerance is unreachable;
    and the cartography plan defines a basin as where the quench lands, so basin
    identity would inherit the parameter and the atlas would be partly an artifact of it.
  fix: >-
    A free sweep over every angle individually runs once the class search converges. If
    nothing improves, the point is a coordinate-wise local optimum and the merge
    tolerance did not decide it; if something improves, the search continues from there.
    The terminal condition is now independent of class_tol, which becomes a device that
    affects speed rather than the answer. Measured over nine cells at n = 5, 10 and 11:
    the free pass never improved on the class-converged point.
  regression: 'the free pass runs by default and its verdict is carried in the result reason'
  recorded_in: docs/project/specs/active/plan-2026-08-22-minimal-packing-toolkit.md
  bead: think-0zs9
- id: D-021
  title: Floating LP refinement has a noise floor, and eight rounds sit on it
  date: '2026-08-23'
  layer: quench
  class: soundness
  direction: flattering
  detected_by: inspection
  latent_for: 'found while fixing D-014'
  severity: medium
  status: contained
  what: >-
    The post-check accepts constraint violations up to 1e-9 and HiGHS will not go
    tighter than 1e-10, so a floating LP side can be wrong by roughly 1e-11. Eight
    recorded rounds carry small negative gaps to the analytic value at exactly that
    scale.
  consequence: >-
    Any improvement claimed below about 1e-11 at this tier is meaningless, and a
    negative gap reads as beating the record if the tier is dropped from the sentence.
  fix: >-
    The post-check bound is now exactly the solver's own guarantee (1e-10) rather than
    an arbitrary 1e-9, which is the tightest defensible value and a tenfold improvement.
    Below that the floor is irreducible with a floating-point LP, so it is contained
    rather than removed: the assurance contract forbids a numerical result from carrying
    `beat_record: true`, and the soundness-perimeter check holds every emitting component
    to the same bound so the two cannot drift apart.

    An exact LP over the same cell (`packing/src/sqpack/exact_lp.py`, BC-061) now removes
    the floor where a certified answer is required. On Trump's cell it returns the
    published side with a difference of exactly zero, against `-1.80341e-16` for the float
    solve -- and that gap is *negative*, which is the shape this entry warns about, since
    read without its tier it says the record was beaten. Its `ambiguous` set is empty
    where the float path leaves three incidences undecided at this floor.

    Phase 1 is now built too (`feasible_basis`, BC-071): the starting vertex is
    constructed from the cell's own exact coefficients by a two-phase auxiliary program,
    and Trump's cell is solved end to end -- 42 phase-1 pivots to a feasible vertex at side
    `6.123390901223`, then 16 more down to the published `3.877083590022`, the difference
    exactly zero -- with no float solver anywhere on the path, asserted by an AST scan over
    every module that runs. The float seed remains a fortyfold speedup, `2.6s` against
    `100s`, and remains the right first move wherever a basis exists; it is no longer
    required.

    The status stays `contained` rather than moving to `fixed`, and what remains is no
    longer the LP. It is that the `n = 29` contact system is not yet assembled as one, so
    there is nothing at that size for the exact path to be pointed at.
  regression: 'the soundness perimeter at the same bound; every round carries assurance and method, and beat_record requires verified assurance'
  recorded_in: packing/campaign/series/series-000-smoke-and-calibration/experiments/exp-007-quench-bracket-n5.md
  bead: think-hg3u
- id: D-022
  title: A numeric field and its display duplicate could disagree in silence
  date: '2026-08-23'
  layer: record
  class: bookkeeping
  detected_by: control_cell
  latent_for: 'since the corpus was built; never consequential'
  severity: low
  status: fixed
  what: >-
    Every frontier case carries `value` and `value_str` for each bound. The generated
    tables render `value`; nothing compared the two, so an edit to one would not be
    caught by the drift check or by validation.
  consequence: 'An artifact carrying a number the report never shows, with no signal that they had parted.'
  fix: 'A cross-check that value_str parses to value, on every bound of every case.'
  regression: 'the cross-check, plus a negative control that mutates value_str and asserts it fires'
  recorded_in: packing/devtools/controls.yaml
- id: D-023
  title: Verification was done in throwaway snippets and left nothing behind
  date: '2026-08-23'
  layer: tooling
  class: bookkeeping
  detected_by: review
  latent_for: 'the whole first experiment session'
  severity: medium
  status: fixed
  what: >-
    Diagnosis, negative controls and result analysis were written as one-off heredocs,
    with the same five operations rewritten each time and none of them checked in. One
    was written wrong: a control that restored its mutation with `git checkout` reverted
    the file to HEAD and silently discarded an uncommitted backfill in the same file,
    invalidating two probes before it was noticed.
  consequence: >-
    Every guard's evidence was a claim that someone had once watched it fail. The defect
    log's own lesson -- a fix without a check comes back -- applied to the checking
    apparatus itself.
  fix: >-
    tools/negctl.py runs controls from tools/controls.yaml, mutating, asserting and
    restoring the exact bytes it saved; the 14 controls run by hand are now checked in
    and run in the gate. On its first full run it found D-022 and corrected two of its
    own control definitions.
  regression: 'the controls run in test.sh; a control whose anchor is ambiguous or absent fails loudly rather than mutating the wrong text'
  recorded_in: packing/devtools/run_negative_controls.py
- id: D-024
  title: A strategy's enum and its prose said opposite things
  date: '2026-08-23'
  layer: record
  class: bookkeeping
  detected_by: gate
  latent_for: 'since the catalogue was written'
  severity: low
  status: fixed
  what: >-
    Simulated annealing carried `outcome: untried_here` beside a note reading "Yes - the
    current workhorse. Schadt's program; Ellsworth's modified version". The enum is the
    machine-readable verdict and the note is the prose the reports render, and nothing
    compared them.
  consequence: >-
    A generated table saying a method had produced records while the structured data
    said it had never been tried here - and any query over the catalogue would have
    believed the data. Wrong on both readings of the field: annealing produced
    Ellsworth's records, and this campaign has used it for every round so far.
  fix: >-
    Corrected to `produced_records`, and the enum's four values are now defined in the
    schema rather than left to inference, with the rule that a note beginning "Yes"
    means and only means `produced_records`.
  regression: 'a cross-check in validate_schemas.py comparing every entry''s outcome against its note'
  recorded_in: packing/frontier/strategy-catalogue.schema.yaml
- id: D-025
  title: Two bead trees claimed the same spec phase after the plan was rebuilt
  date: '2026-08-23'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: 'two branches, partly reported at the time'
  severity: medium
  status: fixed
  what: >-
    When the plan was rebuilt around the quench spine, new phase epics were created but
    the pre-revision tree was left in place. `tbd list --spec` then returned two epics
    both titled "Phase 1" and two both meaning Phase 5, and one child task was complete
    but still open.
  consequence: >-
    An arriving agent could not tell which tree was live, and the stale labels described
    a build order the spec had replaced. Partly flagged as review finding F-3, where the
    fix closed two beads and left the rest.
  fix: >-
    The old verification-core epic is closed as superseded and its children re-parented
    to the revised Phase 5 epic; the old experiments epic is retitled to name the phases
    it now belongs to; the finished differential-test task is closed. The first pass
    said "seven children" and moved seven of eight: `think-gudv` (PyO3 bindings) was
    left open under the closed epic, and re-parenting the rest onto a Phase 5 that
    already carried the rebuilt spec's copies produced a duplicate pair of E1 beads.
    Both were found by the check below and fixed - `think-gudv` re-parented,
    `think-0y0g` closed as a duplicate of `think-kmwb`.
  regression: >-
