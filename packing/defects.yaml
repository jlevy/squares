- id: D-053
  title: The generic number-field API accepts reducible or multi-root certificates
  date: '2026-08-23'
  layer: verifier
  class: soundness
  direction: neutral
  detected_by: review
  severity: critical
  status: fixed
  what: >-
    NumberField documents an irreducible minimal polynomial and an interval containing
    exactly one real root but checks only an endpoint sign change. For
    (x-1)(x-2) on (0,7/5), the selected root is 1 while the quotient representation says
    alpha-1 is nonzero. Equality can be wrong and sign refinement can fail to terminate.
  consequence: >-
    The advertised API for a new packing can accept malformed field metadata and return
    unsound exact comparisons. The built-in Trump witness remains independently checked;
    the generic trust boundary does not.
  fix: >-
    NumberField now rejects unsupported metadata before constructing the quotient. It
    requires an exact modular irreducibility certificate for the primitive polynomial
    and uses a Sturm sequence to prove that the open isolating interval contains exactly
    one real root. The degree-one rational case is explicit rather than bypassing the
    precondition boundary.
  regression: >-
    tests/test_field_preconditions.py rejects reducible polynomials, intervals containing
    zero or multiple roots, and endpoint roots; the normal exact-verification gate
    replays the accepted rational and algebraic controls.
  bead: think-rsxe
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
