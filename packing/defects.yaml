- id: D-351
  title: The replay command promised byte fidelity and compared only semantics
  date: '2026-08-28'
  layer: tooling
  class: bookkeeping
  direction: flattering
  detected_by: review
  latent_for: from the loopback service commit to its first review
  severity: medium
  status: fixed
  what: >-
    `replay_trace` re-serialized the parsed file and compared that against the
    regenerated trace, so it accepted any file whose values matched however it was
    formatted. The runbook told readers the command replays a trace "byte for byte" and
    the docstring claimed it rejected byte-level drift. Reformatting the retained
    fixture from 88,914 to 171,335 bytes still reported PASS.
  consequence: >-
    A retained trace could lose canonical form and keep passing the command documented as
    the check on it, while the byte assertion readers were relying on lived only in a
    test they were not pointed at.
  fix: >-
    The command now compares the raw file text with the canonical regeneration as well,
    and reports the two failures separately: semantic drift means the numerics moved,
