  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    The research report inferred that Trump's nonzero tilt angle in radians was an
    algebraic number of degree 8 because sec(a), tan(a/2), and the side are algebraic.
