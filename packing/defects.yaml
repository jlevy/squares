    and freeze the nonredundancy mutation as removing x0 >= 1/2.
  regression: >-
    Exp-039 now requires executable mutations for omitted or misplaced slide correction
    and the missing R6 coordinate, exact feasible affine witnesses, the explicit
    x0-unboundedness mutation, input-level dual and stress perturbations, and a sharp
    global and terminal refusal boundary
  bead: think-p6j0
  recorded_in: packing/campaign/series/series-000-smoke-and-calibration/experiments/exp-039-h-023-n5-fixed-angle-polytope.md
