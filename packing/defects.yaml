  latent_for: unknown; the check has always been written this way
  severity: low
  status: outstanding
  what: >-
    `sqpack.render.motion.validate_translation_only_trajectory` asserts that each
    corner-minus-centre offset is *exactly* equal from frame to frame. Those offsets are
    differences of two independently rounded decimal projections of exact algebraic
    numbers, so they agree to about thirty-one digits rather than exactly. On the retained
    exact `n = 5` equal-side face the two disagree by `8e-32`.
