- id: D-353
  title: The lab told users the optimizer receives a container side it never sees
  date: '2026-08-28'
  layer: docs
  class: bookkeeping
  direction: flattering
  detected_by: review
  latent_for: from the served-scenario commit to its first review
  severity: medium
  status: fixed
  what: >-
    The release note under the run controls read "the optimizer receives only side,
    centers, and angles". `quench_bracket` has no side parameter: it takes centers and
    angles and re-minimizes the side itself. Substituting 19.0 for 1.6 in the retained
    request returns a bit-identical result record; only the setup frame's container side
    changes.
  consequence: >-
    A control labelled "Starting side" read as a bound the run would respect, in a tool
    whose entire purpose is to keep claims and evidence aligned. A user could have read a
    returned side as a result about their declared container.
  fix: >-
    The release note says the optimizer receives only centers and angles and that the
    side is re-minimized rather than held, the control is labelled "Starting side (setup
