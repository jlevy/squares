  date: '2026-08-24'
  layer: docs
  class: validity
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    H-010 treated a ten-point escape and the published twelve-point Figure 14
    unavoidability claim as the complete theorem. That omitted the conditional
    mechanism: the ten points localize one avoiding box, and the proof forces that same
    box to contain three of the twelve points before applying the 3+9 count.
  consequence: >-
    A tool could pass the registered known-answer control without reproducing the
