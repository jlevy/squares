<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>Lazily serialized style</title>
<style>
body { font: 20px/1.5 serif; }
.katex { text-rendering: geometricPrecision; }
.katex-html > .base { display: inline-block; position: relative; white-space: nowrap; }
.strut { display: inline-block; }
</style>
</head>
<body>
<p>Read early: <span class="kpress-math kpress-math-inline" data-kpress-math="inline" data-squares-math-key="0"><span class="kpress-math-render" aria-hidden="true"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height: 0.43em; vertical-align: 0em;"></span><span class="mord mathnormal">n</span></span></span></span></span></span>.</p>
<p>Read late: <span class="kpress-math kpress-math-inline" data-kpress-math="inline" data-squares-math-key="1"><span class="kpress-math-render" aria-hidden="true"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height: 0.43em; vertical-align: 0em;"></span><span class="mord mathnormal">n</span></span></span></span></span></span>.</p>
</body>
</html>
