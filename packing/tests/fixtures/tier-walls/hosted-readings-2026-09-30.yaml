# Every whole-tier reading of the `checks` and `suite_c` tiers that the hosted pull-request
# surface took between 2026-09-30T15:44Z and 2026-10-01T06:05Z: thirty-four pull-request
# runs across twelve branches, read out of the job logs by `devtools.read_tier_walls`, plus
# the first attempts and the superseded run that the jobs API's `filter=latest` view hides,
# read the same way. Every reading selected the same steps (54 of 85 for `checks`, 1 of 85
# for `suite_c`) at the tier's reference shape, and the walls are of the runner the job
# drew rather than of any change: the same `checks` work read 59.4 s and 137.1 s, 2.31x
# apart, and shard C 62.96 s and 143.87 s, 2.29x apart, with every test green.
#
# `test_the_day_of_2026_09_30_is_judged_on_code_not_on_the_runner` replays each wall through
# `gate_budgets.judge` three times and holds it to the three columns:
#
#   old_rule          the superseded point records below, every rule enforced -- the rule
#                     the integration line carried at d078a202, which is what failed PR #262
#                     at 62.3 s (0.54x) and PR #255 at 59.4 s (0.52x) and 140.2 s (1.58x).
#                     Branches that had not yet merged PR #250's record saw an older point
#                     and sometimes a different verdict that day; this column is the rule,
#                     not a transcript of each branch's own register.
#   relaxation_alone  the same records with the drift and stale rules advisory on a
#                     pull request: the enforcement change by itself, before any record
#                     moved. `advisory` is a run that passed with its finding printed.
#   intended          the live register with the two records as `retaken` below gives
#                     them, that day's ceilings as `superseded` gives them, and the
#                     relaxation declared. The two walls over the 154 s ceiling still
#                     fail: the ceiling is absolute (OR-17), and both jobs also failed a
#                     test outright when the slow fleet pushed it past its per-test backstop,
#                     which is why `step_failed` marks them and the record does not count
#                     them (a failed step is not a reading, `read_tier_walls` rule).
#
# `retaken` is the record as it was re-taken from these readings on 2026-10-01: the
# geometric mean of each tier's counted readings and their range, which the test recomputes
# from the rows below. It is here, and not read from the live register, because a record
# is re-taken again whenever later readings replace these, and this day's verdicts should
# not move when it is. For the same reason the `intended` column takes each tier's ceiling
# from `superseded`, the ceiling that day, rather than from the live register (suite_c's
# was raised to 168 s on 2026-10-05 and to 360 s on 2026-10-09). What the test asks of the
# live register instead is that each `retaken` figure is still in it, as the tier's current
# record or in its history.
#
# `pull_request` is the pull request whose head the run validated. `job` is the GitHub job
# name; a job id is given where the latest-attempt view would otherwise hide the reading.
