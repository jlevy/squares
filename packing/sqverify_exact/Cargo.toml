[package]
name = "sqverify-exact"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Batched exact rational rectangle-density geometry kernel"

[features]
# Retain named ablation features; --no-default-features uses the original operator.
default = ["experimental-coprime-mul"]
experimental-normalized-mul = []
experimental-coprime-mul = []

[dependencies]
num-bigint = "=0.4.6"
num-integer = "=0.1.47"
num-rational = { version = "=0.4.2", features = ["num-bigint"] }
num-traits = "=0.2.19"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
warnings = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
