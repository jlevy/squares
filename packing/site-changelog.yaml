      rationale: >-
        A project policy and capability: one conservative five-level rubric now scores
        every pull request and every News item, a week of merged work was scored and
        backfilled, and News readers filter by level. No bound or rung changes.
    topics: [project]
    categories: [site, documentation]
    pull_requests: [621]
    news_exclusion: >-
      A labelling process for News and pull requests, not a mathematical result; a
      site-only change is a Changelog line (the owner, 26 October 2026).
    summary: |-
      Every pull request now carries one significance label, S1 to S5, scored by the same
      conservative rubric that scores News items. News shows S3 to S5 with a filter by
      level, opening on S4 and S5; S1 and S2 work stays in the full changelog. All 94 pull
