  - id: october-twelve-intake-and-house-admissions
    date: '2026-10-14'
    title: "A Stronger 40-Square Bound and Four Smaller Packings"
    significance:
      score: 3
      rationale: "New certified bounds and packing admissions inherit the highest S3 rating among the announced results."
