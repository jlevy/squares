    title: Rules for Verifying Regularized Drawings
    significance:
      score: 2
      rationale: "Assesses an existing regularizer, sets adaptation/admission policy and adds a comparison helper. It regularizes no packing, admits no drawing and changes no result. Supporting project groundwork is S2; the project label does not raise it. Vendors an existing regularizer/exact solver with licensing, pin checks and provenance. No view is produced or admitted. Dependency/custody setup supports the later capability but does not itself warrant S3."
