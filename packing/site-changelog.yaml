  - id: every-selected-validation-check-runs
    date: '2026-10-15'
    title: Every Selected Validation Check Now Runs
    significance:
      score: 3
      rationale: >-
        Key verification tooling: validation no longer reuses verdicts across runs, so an
        unauthenticated artifact name or a legacy environment variable can no longer
        suppress selected checks. It weakens no scientific assertion and does not make
        validation faster.
    topics: [project, engineering]
    categories: [pipeline]
    pull_requests: [620]
    news_exclusion: >-
      Validation tooling, with nothing reader-facing and no mathematics; a tooling-only
      change is a Changelog line (the owner, 26 October 2026).
    summary: |-
      Validation now executes every check it selects. Before, a verdict could be reused
      across runs, so an unauthenticated artifact name or a legacy environment variable
      could suppress 86 checks. A change that touches only the News record selects its
      checks exactly, while the schema and synopsis checks stay unconditional.
    details: |-
      - Hosted enforcement per call moves from 12 to 45 seconds; 12 seconds stays as a
        diagnostic, and local and strict modes keep the strict budget.
      - No scientific assertion, admission rule or mathematical tolerance is weakened.
        This is a correctness and stability change, not a speed-up.
    references:
      - label: Validation tiers
        target: development.md#validation-tiers
