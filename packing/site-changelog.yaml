entries:
  - id: couzo-two-hundred-four-and-two-sixty-adopted
    date: '2026-10-21'
    title: Couzo’s Smaller Packings of 204 and 260 Squares Adopted
    significance:
      score: 3
      rationale: >-
        T-223 is an S3 finite case result: a new arrangement at each count, 2.04e-05 below
        the ceiling at 204 and 2.56e-05 below T-196 at 260, each with more than a dozen
        squares beyond a tenth of the packing it replaces. It brings no new technique and
        claims no optimality.
    topics: [upper-bound]
    categories: [records]
    pull_requests: [706]
    result_ids: [T-223]
    summary: |-
      Couzo’s exact rational packings of 204 and 260 unit squares, the two in the case
      corpus among issue 678’s 85 bounds, are confirmed at V3/C3 and are now the house
      packings at both counts. At 204 the packing lies about $2.04 \times 10^{-5}$ below
      the earlier ceiling; at 260 it lies about $2.56 \times 10^{-5}$ below de Winter’s
      packing, adopted there the day before. The 83 bounds beyond 324 are kept as dated
      rows of the source.
    details: |-
      - This project’s filtered exact replay decided both certificates on two routes that
        share the parser, the half-angle map, the pair filter and rational arithmetic, and
        refused six controls of each, one of them $10^{-30}$ past exact contact. The
        maintained all-pairs kernel decided every pair at both counts, the source’s own
        checker accepted both, and a separately prompted mathematical review, with a
        checker sharing only rational arithmetic, agreed at every number.
      - Each is a new arrangement: 14 of 204 squares lie beyond a tenth of the earlier
        packing at 204, and 24 of 260 beyond a tenth of de Winter’s at 260. The source
        credits Polkovskyi’s construction at 204, and at 260 de Winter’s packing, which it
        seeded from Daniel’s exact form.
      - The case at 204 draws a regularized view made here at the same side; at 260 the
        stronger views wait for the owner’s review. Daniel’s solved, regularized views of
        both packings lie a little lower still and are registered separately (T-225),
        pending review. No optimality, rigidity or priority is claimed.
    references:
      - label: The case record at 204
        target: packing/frontier/n-204.md
      - label: The case record at 260
        target: packing/frontier/n-260.md
      - label: Retained certificates and verification limits
        target: packing/resources/web/couzo-issue678-2026-10-18/README.md
      - label: Mathematical review of 20 October
        target: docs/project/reviews/review-2026-10-20-upper-bound-imports-678.md
      - label: Couzo’s registration request
        target: https://github.com/jlevy/squares/issues/678
  - id: de-winter-two-twenty-seven-and-two-sixty-adopted
    date: '2026-10-21'
    title: De Winter’s Smaller Packings of 227 and 260 Squares Adopted
    significance:
      score: 3
      rationale: >-
        T-196 is an S3 finite case result: de Winter’s exact certificates move the case
        ceilings at 227 and 260, the first improvement at 260 below 11 + 4√2, in a
        construction family Couzo and Daniel improved further within three days. It brings
        no new technique and claims no optimality.
    topics: [upper-bound]
    categories: [records]
    pull_requests: [704]
    result_ids: [T-196]
    summary: |-
      De Winter’s exact rational packings of 227 and 260 unit squares, reported on 17
      October, are confirmed at V3/C3 and are now the house packings at both counts. They
      lie about $7.27 \times 10^{-3}$ and $1.11 \times 10^{-2}$ below the earlier ceilings,
      $17/2 + 5\sqrt{2}$ and $11 + 4\sqrt{2}$, which the record no longer carries as
      conjectured optima. His certificate at 229 is confirmed too; Daniel’s smaller T-199
      stays the house there.
    details: |-
      - This project’s two maintained exact routes checked the three certificates, and both
        refused their duplicate-square and outside-container controls. They re-implement the
        geometry independently of the source’s code, though they share parsing, half-angle
        conversion and the separating-axis theorem. A separately prompted mathematical
        review decided them again on its own exact route and refused controls $10^{-30}$
        past contact. The source’s own checkers did not run here.
      - Each case draws Daniel’s regularized view made here at the same side. It is a
        drawing, not a second bound.
      - Smaller later reports exist at both counts, Couzo’s #672 at 227 and his #678
        (T-223) at 260; each replaces de Winter’s packing there once it is validated. No
        optimality, rigidity or priority is claimed.
    references:
      - label: The case record at 227
        target: packing/frontier/n-227.md
      - label: The case record at 260
        target: packing/frontier/n-260.md
      - label: Retained certificates and verification limits
        target: packing/resources/web/de-winter-upper-bounds-227-229-260-2026-10-17/README.md
      - label: Mathematical review of 20 October
        target: docs/project/reviews/review-2026-10-20-de-winter-668-upper-bounds.md
      - label: De Winter’s registration request
        target: https://github.com/jlevy/squares/issues/668
  - id: daniel-one-eighty-three-below-the-grid
    date: '2026-10-20'
    title: Daniel’s Packing of 183 Squares Below Side 14
    significance:
      score: 3
      rationale: >-
        T-220 is an S3 finite case result, the first packing of 183 squares below the
        side-14 grid, from an established certificate kind and replay route. It brings no
        new technique and claims no optimality.
    topics: [upper-bound]
    categories: [records]
    pull_requests: [687]
    result_ids: [T-220]
    summary: |-
      [Evan Daniel](packing/contributors/people/evan-daniel.md) packs 183 unit squares in a square of side
      $13999580178736252502081470897571/10^{30} < 14$, about $4.20 \times 10^{-4}$ below
      the trivial $14 \times 14$ grid. It is the first packing of 183 squares below side 14
      in this register. T-220 is confirmed at V3/C3 and is now the house at 183.
    details: |-
      - This project’s two maintained exact routes checked the original certificate, and
        both refused its duplicate-square and outside-container controls. They
        re-implement the geometry independently of the source’s code, though the two share
        parsing, half-angle conversion and the separating-axis theorem with each other. A
        separately prompted mathematical review accepted the bound.
      - The case draws a regularized view made here with Daniel’s regularizer at the same
        side. It is a drawing, not a second bound. The source’s own regularized
        certificate and its two checkers did not run here.
      - Credit Daniel, after [Francisco Couzo](packing/contributors/people/francisco-couzo.md)’s 182-square packing. The source’s KKT, flat-motion
        and local-minimum statements are numerical evidence that was not checked here, and
        no optimality, rigidity or priority is claimed.
    references:
      - label: The case record at 183
        target: packing/frontier/n-183.md
      - label: Retained certificate and verification limits
        target: packing/resources/web/evand-n183-subgrid-2026-10-19/README.md
      - label: Mathematical review of 19 October
        target: docs/project/reviews/review-2026-10-19-evand-n183-subgrid.md
      - label: Daniel’s registration request
        target: https://github.com/jlevy/squares/issues/680
  - id: greff-ninety-five-optimality-report
    date: '2026-10-16'
    title: Greff Reports an Optimum for 95 Squares
    significance:
      score: 3
      rationale: >-
        T-191 is an S3 report of an exact value at a new count, using an existing
        covering method. Its significance does not establish verification.
    topics: [optimality]
    categories: [records]
    pull_requests: [627]
    stack_id: 632
    result_ids: [T-191]
    summary: |-
      Greff reports that 95 unit squares require a square of side 10, matching the grid
      construction: $s(95) = 10$. T-191 remains a reported result at V0/C0, awaiting
      independent review and adoption.
    details: |-
      - Greff constructed a weighted cover of points and line segments using [Evan Daniel](packing/contributors/people/evan-daniel.md)’s
        method and checkers. He re-optimised its central cross and reused corners from
        [Hiroaki Hosono](packing/contributors/people/hiroaki-hosono.md)’s 59-square cover and the band-insertion construction.
      - The project reproduced the source’s two checker runs and retained their
        receipts. That reproduction has not yet been admitted as evidence with an
        independent review; the case’s lower bound remains $1993/200 = 9.965$.
      - The source’s Lean wrapper assumes the covering statement. It has not been built
        here, and the reported result does not yet establish a completely checked Lean
        proof.
    references:
      - label: Greff’s certificate and source checks
        target: https://github.com/bengreff/s95-certificate/tree/dd7297d06adc664268c65005369b895e4ded7547
      - label: Retained report and verification limits
        target: packing/resources/web/bengreff-s95-certificate-2026-10-15/README.md
      - label: Greff’s registration request
        target: https://github.com/jlevy/squares/issues/610
  - id: hosono-twenty-eight-continuous-bound-report
    date: '2026-10-16'
    title: Hosono Reports a Stronger Lower Bound for 28 Squares
    significance:
      score: 3
      rationale: >-
        T-192 is an S3 report of a stronger bound at one count, extending the existing
        continuous-angle covering method to a new density. Complete confirmation is
        pending.
    topics: [lower-bound]
    categories: [records]
    pull_requests: [627]
    stack_id: 632
    result_ids: [T-192]
    summary: |-
      [Hiroaki Hosono](packing/contributors/people/hiroaki-hosono.md) (wand125) reports $s(28) > 1149/200 = 5.745$ using a cover over every square
      position and angle. T-192 remains at V0/C0; complete local replay and review are
      pending.
    details: |-
      - The certificate uses a new density of 884 weighted rectangles. It applies the
        continuous-angle method from [Guzhou0806](packing/contributors/people/guzhou0806.md)’s 40-square result T-145 at a new count,
        with credit to Guzhou0806, [Tokoharu](packing/contributors/people/tokoharu.md) and [Joshua Levy](packing/contributors/people/joshua-levy.md).
      - The reported bound is $1/400$ above Hosono’s earlier report T-142 and $1/100$
        above the standing lower bound $1147/200 = 5.735$ in T-107. The standing bound
        remains unchanged.
      - Hosono reports complete checks by two source programs using the same covering
        method. The project checked exact premises and a diagnostic sample; those
        checks do not replace a complete replay or establish an independent method.
    references:
      - label: Hosono’s certificate and source checks
        target: https://github.com/wand125/square-packing/tree/8530bafb03d48444f30f241fbc1f29f01cd7c96c/problems/square-lower-bounds/certificates/continuous_n28_L5745
      - label: Retained report and verification limits
        target: packing/resources/web/wand125-continuous-n28-2026-10-15/README.md
      - label: Registered lower-bound reports
        target: packing/frontier/RESULTS.md
