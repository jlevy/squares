$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:FrontierEvidenceSet/v1
title: FrontierEvidenceSet
description: Typed reports, numerical checks, proofs, and replay dispositions for the frontier.
type: object
additionalProperties: false
required: [last_reviewed, evidence]
properties:
  last_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  evidence:
    type: array
    items: {$ref: '#/$defs/evidence'}
$defs:
  scope:
    oneOf:
      - type: object
        additionalProperties: false
        required: [n_values]
        properties:
          n_values:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [n_min, n_max]
        properties:
          n_min: {type: integer, minimum: 1}
          n_max: {type: integer, minimum: 1}
  precision:
    anyOf:
      - const: unrecorded-historical
      - type: object
        additionalProperties: false
        required: [rounding]
        properties:
          decimal_digits: {type: integer, minimum: 1}
          binary_bits: {type: integer, minimum: 1}
          rounding: {enum: [nearest, nearest-even, outward, source-defined]}
        oneOf:
          - required: [decimal_digits]
          - required: [binary_bits]
  blocker:
    type: object
    additionalProperties: false
    required: [kind, detail]
    properties:
      kind: {enum: [source-evidence, importer, checker, field-precondition, mathematics]}
      detail: {type: string, minLength: 1}
  proof:
    type: object
    additionalProperties: false
    required: [source, theorem, scope, pinpoints, assumptions]
    properties:
      source: {type: string, minLength: 1}
      theorem: {type: string, minLength: 1}
      scope: {type: string, minLength: 1}
      pinpoints: {type: string, minLength: 1}
      assumptions: {type: array, items: {type: string}}
      audit_record: {type: string, minLength: 1}
      conditional_on:
        description: >-
          The hypotheses the proved theorem takes and does not itself prove, where the
          theorem is "H implies the claim": each with the evidence entries that discharge
          it, a passing replay or audit here or a third party's replay retained here, or
          none. With none the entry is a conditional theorem, verified only as the
          implication, and every view of it says so (devtools.render_evidence_inventory);
          a verified case bound may cite it only beside an entry that discharges each
          hypothesis (sqpack.assurance).
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [hypothesis, discharged_by]
          properties:
            hypothesis: {type: string, minLength: 1}
            discharged_by:
              type: array
              uniqueItems: true
              items: {type: string, pattern: '^E-[a-z0-9-]+$'}
  independence:
    type: object
    additionalProperties: false
    description: >-
      The structured independence record of a run (epistemics.md, The Independence
      Record): its coverage, and, where no deciding program's registry entry carries
      them, what the authors read, whether the program is clean-room, the producer's
      components it shares, who wrote it and whether that authorship overlaps the
      producer's, with the meanings verifiers.schema.yaml gives them. Required, with its
      coverage, on an independent-implementation entry recorded from 14 October 2026; a
      sample derives no rung (devtools.check_results).
    required: [coverage]
    dependentRequired:
      read: [clean_room, shares, written_by, overlaps_producer]
      clean_room: [read]
      shares: [read]
      written_by: [read]
      overlaps_producer: [read]
    properties:
      coverage:
        type: object
        additionalProperties: false
        required: [extent, unit]
        description: >-
          How much of the unit the run decided. full -- every instance of the unit.
          sample -- checked of the unit's of instances, and nothing about the others.
        properties:
          extent: {enum: [full, sample]}
          unit: {type: string, minLength: 1}
          checked: {type: integer, minimum: 0}
          of: {type: integer, minimum: 1}
        allOf:
          - if: {properties: {extent: {const: sample}}}
            then: {required: [checked, of], properties: {checked: {minimum: 1}}}
      read:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [mathematics, proof-text, specification, certificate-format, producer-code, producer-output, earlier-review]
      clean_room: {type: boolean}
      shares:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      written_by:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {enum: [person, ai]}
            name: {type: string, minLength: 1}
            system: {type: string, minLength: 1}
            setting: {type: string, minLength: 1}
          allOf:
            - if: {properties: {kind: {const: person}}}
              then: {required: [name]}
            - if: {properties: {kind: {const: ai}}}
              then: {required: [system]}
      overlaps_producer:
        type: object
        additionalProperties: false
        required: [extent, separate_prompt, separate_code, note]
        properties:
          extent: {enum: [none, system-family, people, unknown]}
          separate_prompt: {type: [boolean, "null"]}
          separate_code: {type: boolean}
          note: {type: string, minLength: 1}
      note: {type: string, minLength: 1}
  evidence:
    type: object
    additionalProperties: false
    required:
      - id
      - claim
      - scope
      - assurance
      - performed_by
      - relationship_to_generator
      - replay_status
      - limitations
      - source_reviewed
    properties:
      id: {type: string, pattern: '^E-[a-z0-9-]+$'}
      claim:
        enum: [witness-feasibility, upper-bound, lower-bound, exact-value, witness-optimality, derived-structure]
      scope: {$ref: '#/$defs/scope'}
      assurance: {enum: [reported, numerically-checked, verified]}
      method:
        enum: [numerical-f64, numerical-multiprecision, interval-certified, exact-algebraic, published-proof, proof-audited, proof-assistant-checked]
      reported_method:
        enum: [numerical-f64, numerical-multiprecision, interval-certified, exact-algebraic, published-proof, proof-audited, proof-assistant-checked, source-unspecified]
      performed_by:
        enum: [source-author, independent-external, repository, unknown-historical]
      relationship_to_generator:
        enum: [generator, same-implementation, shared-components, independent-implementation, not-applicable, unknown-historical]
        description: >-
          How the code that verified this entry stands to the code that produced the
          result: its generator, and the checker its producer verified it with
          (epistemics.md, Confirmation). generator -- the producing code checked its own
          output. same-implementation -- the producer's checker, re-run: a replay that
          establishes reproducibility, not independence; for this project's own results,
          the code that produced them. shared-components -- separately written code that
          reuses named parts of the producer's code, listed in shared_components.
          independent-implementation -- code that shares none of the producer's code,
          written from the mathematics and the certificate format; a new one names the
          record of what its authors read (independence_record). not-applicable -- no
          code runs: a proof, a hand derivation, or nothing to compare with.
      shared_components:
        type: array
        minItems: 1
        description: >-
          The parts of the producer's code a shared-components verification reuses, such
          as a parser, the certificate loader or an arithmetic kernel.
        items: {type: string, minLength: 1}
      verifiers:
        type: array
        uniqueItems: true
        description: >-
          The programs that verified this entry's claim, by their ids in verifiers.yaml,
          each marked there external or first-party: for a source's report, the checker
          the source says it ran; for a replay or an audit, every program the replay
          runs, deciders and premise checks alike. Required wherever the method runs code
          or the entry names a replay. A reported entry may list none, which says the
          record holds none of the code its source used.
        items: {type: string, pattern: '^V-[a-z0-9-]+$'}
      independence_record:
        type: string
        minLength: 1
        description: >-
          For an independent-implementation entry: the repository path of the record of
          what the verifying program's authors read and used, where the program's own
          registry entry names none. devtools.verifier_registry requires one of the two
          on every independent-implementation entry not grandfathered by name.
      independence:
        $ref: '#/$defs/independence'
      origin:
        enum: [external, independently-external, replayed-here, audited-here]
      # Whose result this is, separate from assurance and origin. The values differ
      # in what they oblige, which is why each is its own value rather than an
      # absence:
      #   common-knowledge     elementary or folklore -- the area and grid bounds.
      #                        Nobody claims it and no citation is owed.
      #   previously-published a named prior source established it and this entry
      #                        reports, confirms, or replays it. Must carry
      #                        source_key; "published" covers any public attributable
      #                        artifact -- paper, preprint, record table, repository.
      #   apparently-novel     first established here and, to the best of this
      #                        project's knowledge from the archived corpus and the
      #                        sources reviewed by source_reviewed, not previously
      #                        published. A statement about the search performed,
      #                        never an assertion of priority. Must carry
      #                        source_reviewed, which dates the assessment.
      #   confirmed-novel      priority independently established. Reserved; no entry
      #                        carries it yet.
      # Absent means the entry makes no novelty statement -- not yet assessed, or the
      # record declines one. Absence never means "not novel".
      novelty:
        enum: [common-knowledge, previously-published, apparently-novel, confirmed-novel]
      source_key: {type: string, minLength: 1}
      precision: {$ref: '#/$defs/precision'}
      tolerance: {type: string, minLength: 1}
      certificate: {type: string, minLength: 1}
      replay: {type: string, minLength: 1}
      axioms_receipt:
        type: string
        minLength: 1
        description: >-
          For proof-assistant-checked evidence: the retained receipt printing the axioms
          the checked theorem depends on. Rung 5 requires it (epistemics.md).
      replay_status:
        enum: [passed, failed, unsupported, public-certificate-missing, not-attempted]
      proof: {$ref: '#/$defs/proof'}
      novelty_basis:
        type: object
        additionalProperties: false
        required: [corpus, searched, novel_object]
        description: >-
          What a novelty claim is relative to. `apparently-novel` is defined here as a
          statement about the search performed and never an assertion of priority, and a
          search is only as good as the corpus it ran over -- so the corpus, the date and
          the terms are the claim's actual content. Without them `source_reviewed` dates an
          assessment whose scope nobody can reconstruct.
          Record the gaps too. A corpus with a known hole is more useful than one presumed
          complete, because the hole is where the refutation would be.
        properties:
          corpus: {type: string, minLength: 1}
          searched: {type: string, minLength: 1}
          novel_object:
            type: string
            minLength: 1
            description: >-
              In one line, what exactly is new -- because the answer is usually narrower
              than the record's claim reads. Certifying someone else's bound is real work
              and is not the same as establishing a new bound; a systematic screen can be
              new while the idea it applies is not. Naming the object is what stops a
              defensible claim from being read as a larger one.
          gaps: {type: string, minLength: 1}
      external_review:
        type: object
        additionalProperties: false
        required: [state, date]
        description: >-
          Whether anyone here has read an argument this repository did not produce.
          A published proof establishes its claim whether or not we read it, so this does
          not change the assurance -- what it changes is whether a reader can tell. Without
          it, "verified on an external proof we transcribed" and "verified on an external
          proof we worked through" are the same record, and the difference is exactly the
          one that matters when a source turns out to be wrong. `[Stromquist 2003]` did:
          `E-n011-repaired-lower` proves that bound by a source-distinct repair, and the
          fact that the printed proof needed one lives in a prose limitation on a different
          record.
          Reviewing a proof by reading it is not a formal check and never promotes the
          method; `proof-assistant-checked` is the formal lane and it is a different thing.
        properties:
          state:
            enum: [not-reviewed, informally-verified, defect-found]
            description: >-
              not-reviewed -- the claim is transcribed and nobody here has worked through
              the argument. informally-verified -- someone here read it and found no error;
              a careful human reading, which is weaker than a machine check and stronger
              than nothing. defect-found -- someone here worked through it and found a
              problem; `note` says what, and what was done about it.
          date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
          note: {type: string, minLength: 1}
          reviewed_by: {type: string, minLength: 1}
      limitations: {type: string, minLength: 1}
      blocker: {$ref: '#/$defs/blocker'}
      source_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      migration_annotation: {type: string, minLength: 1}
    allOf:
      # shared_components belongs to, and only to, a shared-components relation.
      - if:
          required: [relationship_to_generator]
          properties: {relationship_to_generator: {const: shared-components}}
        then:
          required: [shared_components]
        else:
          not: {required: [shared_components]}
      # Which programs ran is recorded wherever code runs: a computational method, as
      # performed or as the source reports it, or a replay of any method.
      - if:
          anyOf:
            - required: [method]
              properties: {method: {enum: [numerical-f64, numerical-multiprecision, interval-certified, exact-algebraic, proof-assistant-checked]}}
            - required: [reported_method]
              properties: {reported_method: {enum: [numerical-f64, numerical-multiprecision, interval-certified, exact-algebraic, proof-assistant-checked]}}
            - required: [replay]
        then:
          required: [verifiers]
      # A replay recorded here, or an entry that is more than a report, names what ran.
      - if:
          anyOf:
            - required: [replay]
            - required: [assurance]
              properties: {assurance: {enum: [numerically-checked, verified]}}
        then:
          properties: {verifiers: {minItems: 1}}
