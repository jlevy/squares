$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:SquarePackingCase/v2
title: SquarePackingCase
description: >-
  Reported and formally supported bounds for one square-packing instance. Decimal
  literals remain strings; evidence records carry assurance and replay details.
type: object
additionalProperties: false
required:
  - n
  - reported_status
  - status
  - source_reviewed
  - reported_upper_bound
  - verified_upper_bound
  - reported_lower_bound
  - verified_lower_bound
  - rigidity
  - evidence
  - conflicts
  - blockers
  - resources
properties:
  n: {type: integer, minimum: 1}
  reported_status:
    enum: [proved, open]
    description: Literal mathematical status reported by the tracked source set.
  status:
    enum: [proved, open]
    description: Proved only when verified upper and lower bounds match exactly.
  source_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  reported_upper_bound: {$ref: '#/$defs/reportedUpper'}
  verified_upper_bound: {$ref: '#/$defs/verifiedUpper'}
  reported_lower_bound: {$ref: '#/$defs/reportedLower'}
  verified_lower_bound: {$ref: '#/$defs/verifiedLower'}
  rigidity: {$ref: '#/$defs/rigidity'}
  conjectured_optimum: {type: [string, 'null']}
  priority_notes:
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [claim]
      properties:
        claim: {type: string, minLength: 1}
        claimed_by: {type: array, items: {type: string}, default: []}
        published: {type: [string, 'null']}
        year: {type: [integer, 'null']}
  evidence:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^E-[a-z0-9-]+$'}
  conflicts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, detail, evidence]
      properties:
        kind: {enum: [source-disagreement, replay-failure, scope-ambiguity, stale-source]}
        detail: {type: string, minLength: 1}
        evidence:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^E-[a-z0-9-]+$'}
  blockers:
    type: array
    items: {$ref: '#/$defs/blocker'}
  resources:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [key, role]
      properties:
        key: {type: string, minLength: 1}
        role:
          enum:
            - upper-bound-report
            - lower-bound-proof
            - record-catalogue
            - survey
            - numerical-witness
            - formal-certificate
            - context
        local: {type: [string, 'null']}
        url: {type: [string, 'null']}
        retrieved: {type: [boolean, 'null']}
  regularization: {$ref: '#/$defs/regularization'}
$defs:
  regularization:
    type: object
    additionalProperties: false
    description: >-
      Who regularized the packing this case's atlas draws, generated by
      `devtools.regularized_drawings` from the regularized layer's index and the register,
      never written by hand (docs/project/policies/regularization-policy.md, sections 7 and
      9, question 16). Present where the layer draws a regularized view of the count, where
      a registered result holds this project's own regularization of the count, or where
      the house is itself a regularization its source published; absent otherwise.
      A pure regularization, one that proves no new bound, redraws a registered packing
      and is never a result: it changes no side, frontier value, evidence tier or credit.
      A regularization whose exact side lies below the verified upper bound is registered
      as a result, and where it is drawn the item names that result as `registered_in`;
      where an earlier certificate first stated that side, the item names its result as
      `first_certified_in` and the note says the regularization proves no new bound.
      `note` is the paragraph the site's case page prints. `items` lists the source's
      regularization of the house first, in the register's own terms (`by` the source's
      bibliography key, `of` the result that holds the packing it regularizes,
      `registered_in` the result whose `regularizations` records it, its `method` and
      `side`), then this project's (`by: project`): the layer's generator, its credit
      line, this project's `modifications` to Evan Daniel's regularizer where his method
      made the view (empty where none applied; absent for the project's own axis tool),
      the side relation, the registered result that holds the drawn packing (`of`, null
      where none does), the result that registers the drawn regularization itself where
      one does (`registered_in`) and the view's path. Last comes this project's
      regularization that a result registers but the layer does not draw, as T-155's are at
      44 counts, in the register's terms like a source's (`method`, `side`, `of`,
      `registered_in`) with the generator its method names, its credit line and its
      `modifications`, and `modifications_unrecorded` for what the item cannot establish.
    required: [note, items]
    properties:
      note: {type: string, minLength: 1}
      items:
        type: array
        minItems: 1
        maxItems: 3
        items:
          type: object
          additionalProperties: false
          required: [by, credit, side, of]
          properties:
            by: {type: string, pattern: '^(\[.+\]|project)$'}
            credit: {type: string, minLength: 1}
            generator:
              enum: [regularize_axis_components/2, evand-regularize,
                     regularize_grid_slack/0, regularize_grid_slack/1]
            modifications: {type: array, items: {type: string, minLength: 1}}
            modifications_unrecorded:
              type: array
              minItems: 1
              items: {enum: [retry rungs]}
            method: {type: string, minLength: 1}
            side: {enum: [same, bound, solved]}
            of: {type: [string, 'null'], pattern: '^T-[0-9]{3}$'}
            registered_in: {type: string, pattern: '^T-[0-9]{3}$'}
            first_certified_in: {type: string, pattern: '^T-[0-9]{3}$'}
            view:
              type: string
              pattern: '^packing/atlas/known-best/regularized/n-[0-9]{3}-regularized\.yaml\.gz$'
          allOf:
            - if: {required: [first_certified_in]}
              then: {required: [registered_in]}
            - if: {properties: {by: {const: project}}}
              then:
                required: [generator]
                if: {required: [view]}
                then: {not: {anyOf: [{required: [method]}, {required: [modifications_unrecorded]}]}}
                else: {required: [registered_in, method]}
              else:
                required: [registered_in, method]
                not:
                  anyOf:
                    - required: [generator]
                    - required: [view]
                    - required: [modifications]
                    - required: [modifications_unrecorded]
  evidenceRefs:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^E-[a-z0-9-]+$'}
  verifiedLower:
    type: object
    additionalProperties: false
    description: >-
      The largest lower bound this repository can certify on its own evidence: read it
      as "s(n) is at least this". It is a floor, not the value of s(n), and it may be
      weaker than reported_lower_bound.
    required: [value, exact_form, evidence]
    properties:
      value:
        type: string
        minLength: 1
        description: Reader display literal; exact_form is authoritative when present.
      exact_form:
        type: [string, 'null']
        description: Exact identity of the certified floor, not of s(n).
      evidence: {$ref: '#/$defs/evidenceRefs'}
  verifiedUpper:
    type: object
    additionalProperties: false
    # Named for what it is rather than for the property a reader wants it to have.
    # An agent once read "verified_upper_bound has an exact_form for all 100 cases" as
    # "all 100 side lengths are known exactly" and told a user so. The field is a
    # CEILING; the description below is the correction, and tests/test_verified_upper_
    # bound_contract.py holds it in place.
    description: >-
      An upper bound this repository can certify from its own evidence, and nothing
      more: read it as "s(n) is at most this". It is NOT the value of s(n), and it is
      NOT a copy of reported_upper_bound two fields above.
      Where no formal certificate reaches the best known construction, this falls back
      to whatever weaker bound is certifiable -- usually the trivial grid ceiling
      ceil(sqrt(n)) -- so for a third of n <= 100 it is LARGER than the reported best
      known side, by up to 0.47. Every such case also carries a mathematics blocker
      naming that gap, and its status stays open.
      A consumer that wants the best known side length must read
      reported_upper_bound. A consumer that wants a proved side length must first
      check that status is proved.
    required: [value, exact_form, evidence]
    properties:
      value:
        type: string
        minLength: 1
        description: >-
          Reader display literal for the certified ceiling; exact_form is authoritative
          when present.
      exact_form:
        type: [string, 'null']
        description: >-
          Exact identity OF THE CEILING, never of s(n). A present exact_form says the
          ceiling is an exact algebraic number -- for most open cases it is the integer
          ceil(sqrt(n)), and for n = 29 a truncated decimal written as a rational. It
          is evidence about s(n) only when status is proved, which requires this
          identity and verified_lower_bound.exact_form to coincide.
      evidence: {$ref: '#/$defs/evidenceRefs'}
  rigidity:
    type: [object, 'null']
    additionalProperties: false
    # The first-party half of the split in think-de1s. The transcription half is
    # reported_upper_bound.catalogue_rigid; the two must never be merged again.
    description: >-
      This repository's own finding on whether the recorded packing admits a
      non-trivial feasible motion, carried the way every other first-party claim in
      this schema is carried: a stated property, an assurance level, a stated scope,
      and replayable evidence.
      `null` means this repository has not assessed rigidity for this n. It never means
      the packing can move. What a source says about rigidity belongs in
      reported_upper_bound.catalogue_rigid and must not be restated here.
    required: [property, assurance, scope, evidence]
    properties:
      property:
        enum: [locally-rigid, semi-rigid, not-rigid, undetermined]
        description: >-
          locally-rigid -- no non-trivial feasible motion in some neighborhood, under
          the quotient named by scope. semi-rigid -- motion exists but is confined, in
          the sense scope defines. not-rigid -- an explicit feasible motion is
          exhibited. undetermined -- assessed and not settled, which is a result and
          differs from the field being null.
      assurance: {enum: [reported, numerically-checked, verified]}
      method:
        enum: [numerical-f64, numerical-multiprecision, interval-certified, exact-algebraic, published-proof, proof-audited, proof-assistant-checked]
      scope:
        type: string
        minLength: 1
        description: >-
          Exactly what was established and what was not: the neighborhood, the
          quotient, and the order of the argument. Rigidity claims are local and this
          field is where that stays visible.
      certificate: {type: [string, 'null']}
      replay: {type: [string, 'null']}
      evidence: {$ref: '#/$defs/evidenceRefs'}
  reportedUpper:
    type: object
    additionalProperties: false
    description: >-
      The strongest upper bound the named source set literally claims, transcribed and
      not endorsed. This is the best known side length; verified_upper_bound is the
      weaker thing this repository can certify.
    required:
      - value
      - exact_form
      - catalogue_rigid
      - construction_method
      - source_key
      - evidence
    properties:
      value: {type: string, minLength: 1}
      exact_form: {type: [string, 'null']}
      algebraic_degree: {type: [integer, 'null'], minimum: 1}
      minimal_polynomial: {type: [string, 'null']}
      analytically_optimized: {type: [boolean, 'null']}
      catalogue_rigid:
        enum: [rigid, semi-rigid, not-stated]
        # Was a boolean named `rigid`. It was non-null exactly where the catalogue
        # pictured the packing, so `false` meant "pictured, no Rigid annotation" while
        # reading as "this packing is not rigid" -- taken literally the corpus denied
        # the rigidity of n = 1, one unit square exactly filling a 1x1 container. The
        # catalogue never asserts non-rigidity anywhere, so the boolean had no true
        # negative to express. See think-de1s.
        description: >-
          What the catalogue named by source_key says about this packing's rigidity,
          transcribed and nothing more. `rigid` and `semi-rigid` are the catalogue's
          own two words. `not-stated` means the catalogue is silent -- which it is for
          all but four packings at n <= 100 -- and is the absence of a source
          statement, never a claim that the packing can move.
          Rigidity as a mathematical property of the packing belongs in the
          case-level `rigidity` field, which carries assurance and evidence. A
          catalogue's silence is not evidence and does not go there.
      construction_method:
        enum:
          - trivial-grid
          - hand-construction
          - diagonal-strip
          - pattern-family
          - extension
          - composition
          - simulated-annealing
          - inflation-billiard
          - unknown
      tilt_angles_deg:
        type: [array, 'null']
        items: {type: number}
      found_by: {type: array, items: {type: string}, default: []}
      found_year: {type: [integer, 'null']}
      improved_by: {type: array, items: {type: string}, default: []}
      catalogue_pictured: {type: boolean}
      source_key: {type: string, minLength: 1}
      source_date: {type: [string, 'null']}
      retrieved_date: {type: [string, 'null']}
      witnesses: {type: array, items: {type: string}, default: []}
      evidence: {$ref: '#/$defs/evidenceRefs'}
  reportedLower:
    type: object
    additionalProperties: false
    required: [value, exact_form, kind, source_key, evidence]
    properties:
      value: {type: string, minLength: 1}
      exact_form: {type: [string, 'null']}
      kind:
        enum: [area, perfect-square, nagamochi, monotonicity, unavoidable-points, counting]
      proved_by: {type: array, items: {type: string}, default: []}
      proved_year: {type: [integer, 'null']}
      source_key: {type: [string, 'null']}
      note: {type: [string, 'null']}
      scope: {type: [string, 'null']}
      evidence: {$ref: '#/$defs/evidenceRefs'}
  blocker:
    type: object
    additionalProperties: false
    required: [kind, detail]
    properties:
      kind: {enum: [source-evidence, importer, checker, field-precondition, mathematics]}
      detail: {type: string, minLength: 1}
      evidence:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^E-[a-z0-9-]+$'}
