$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ResultsRegister/v1
title: ResultsRegister
description: >-
  First-party and load-bearing results classified on the four epistemic axes.
  The vocabulary is owned by epistemics.md at the repository root: V and C are
  declared here and re-derived from the cited evidence atoms by
  devtools/check_results.py, which fails on any declared rung the atoms do not
  support or understate; S is a judged, anchored, dated score that never
  gates; N adopts the evidence contract's novelty enum.
type: object
additionalProperties: false
required: [last_reviewed, results]
properties:
  last_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  results:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/result'}
  regularized_drawings:
    type: object
    additionalProperties: false
    required: [index, unregistered, items]
    description: >-
      This project's own regularizations of packings the register already holds, as the
      atlas's regularized layer draws them (docs/project/policies/regularization-policy.md):
      one item a drawn count, in the terms of a result's `regularizations` item, with
      `of` the registered result that holds the packing and `view` the layer's view it is
      drawn from. A drawing changes no side, frontier value, evidence tier or credit: a
      pure regularization, one that proves no new bound, is no result, so these carry no
      rung. A regularization whose side lies below the verified upper bound is a result
      first and is listed by that result's `regularizations`; it proves a new bound
      unless an earlier certificate already stated that side, which the item names as
      `first_certified_in` (T-155's 33 counts at the side of Evan Daniel's certificates,
      T-101). Counts the layer draws whose packing no registered result holds
      are `unregistered`, each with the reason, and their record stays in the layer's
      index alone. Where Evan Daniel's regularizer or the grid-slack port of his placement
      made the view, `modifications` names this project's modifications to it (the
      retry rungs, the vendored copy's patches, the exact re-solve, the port itself),
      empty where his regularizer ran unmodified (the owner, 13 October 2026). Generated
      by `devtools.regularized_drawings` from the layer's `index`, which
      `devtools.check_results` holds it to: each `of` registered with the count in its
      scope, `by` this project, the measurements numbers no lower than zero, and each
      `measured_in` a repository file; the layer's own check holds each `view`.
    properties:
      index: {const: packing/atlas/known-best/regularized/index.json}
      unregistered:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [n, reason]
          properties:
            n: {type: integer, minimum: 1}
            reason: {type: string, minLength: 1}
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [n, of, by, method, side, identity, view]
          properties:
            n: {type: integer, minimum: 1}
            of: {type: string, pattern: '^T-[0-9]{3}$'}
            by: {const: project}
            method: {type: string, minLength: 1}
            modifications: {type: array, items: {type: string, minLength: 1}}
            side: {enum: [same, solved]}
            changes: {$ref: '#/$defs/result/properties/regularizations/items/properties/changes'}
            identity: {$ref: '#/$defs/result/properties/regularizations/items/properties/identity'}
            view:
              type: string
              pattern: '^packing/atlas/known-best/regularized/n-[0-9]{3}-regularized\.yaml\.gz$'
$defs:
  review:
    type: object
    additionalProperties: false
    required: [path, kind, reviewer, reviewer_kind, date, scope, verdict]
    # Who reviewed, what they examined and what they concluded, as the document itself
    # says (epistemics.md, Review Records). A human reviewer states a relation to the
    # project; a formalization review states that the reviewer is not the author.
    if: {properties: {reviewer_kind: {const: human}}}
    then: {required: [relation]}
    properties:
      path: {type: string, minLength: 1}
      kind: {enum: [adversarial, confirming, oversight, formalization]}
      reviewer: {type: string, minLength: 1}
      reviewer_kind: {enum: [ai, human]}
      relation: {enum: [owner, project, external, source]}
      date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      scope: {type: string, minLength: 1}
      verdict: {enum: [accepted, defects-resolved, defect-open, refuted]}
      checked:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [trust-boundary, certificate-meaning, ai-findings, statement-fidelity, definitions, axioms, build]
      independent_of_author: {type: boolean}
      covers:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^T-[0-9]{3}$'}
  open_review:
    type: object
    additionalProperties: false
    required: [sources, terms, replay, retained]
    # C5's openness: the proof, its formalization and everything needed to replay it are
    # publicly available, so any other expert can review and replay it. No review venue
    # is required (epistemics.md, Review Records).
    properties:
      sources: {type: string, minLength: 1, description: The public location of the sources at a pinned revision.}
      terms: {type: string, minLength: 1, description: The licence or terms under which the sources may be inspected and run.}
      replay: {type: string, minLength: 1, description: Where the public replay instructions are.}
      retained: {type: string, minLength: 1, description: The repository-relative path of the copy retained here.}
  scope:
    oneOf:
      - type: object
        additionalProperties: false
        required: [n_values]
        properties:
          n_values:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [n_min, n_max]
        properties:
          n_min: {type: integer, minimum: 1}
          n_max: {type: integer, minimum: 1}
  significance:
    type: object
    additionalProperties: false
    required: [score, rationale, scored, by]
    properties:
      score: {type: integer, minimum: 1, maximum: 5}
      rationale: {type: string, minLength: 1}
      scored: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      by: {type: string, minLength: 1}
  result:
    type: object
    additionalProperties: false
    required:
      - id
      - kind
      - registered
      - headline
      - claim
      - scope
      - verification
      - confirmation
      - significance
      - novelty
      - evidence
      - artifacts
      - next_rung
    # A result of this project carries the day it was established; a result by others
    # carries its source's date in attribution.published instead, and never both.
    # `builds_on` is this project's own `after`; a result by others takes its whole
    # credit line from the bibliography.
    if: {required: [attribution]}
    then: {not: {anyOf: [{required: [established]}, {required: [builds_on]}]}}
    else: {required: [established]}
    properties:
      id: {type: string, pattern: '^T-[0-9]{3}$'}
      kind:
        type: string
        enum:
          - lower-bound
          - upper-bound
          - optimality
          - uniqueness
          - simplification
          - rigidity
          - case-exclusion
          - restricted-optimality
          - method-limit
          - correction
          - audit
        description: >-
          What the result is, named for what its claim concludes (epistemics.md, Result
          Kinds): a lower or an upper bound on s(n); optimality, an exact value settled;
          uniqueness, every packing that attains s(n) classified; a simplification, a
          second and simpler proof of a result the record holds; the rigidity of one
          packing; the exclusion of one class of configurations; the
          best packing within a restricted family; the limit of a method; a correction
          to a published statement; or an audit of an existing proof or certificate.
          One kind per result, written right after `id`. Declared, and cross-checked by
          `devtools.check_results` against the headline's and the claim's relations and
          the cited evidence's claims.
      registered:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        description: >-
          The date the result entered this register, which is not the date it was
          last assessed (`significance.scored`) nor, for a result by others, the date
          it was published (`attribution.published`). Entries registered before the
          field existed carry the author date of the commit that added them, backfilled
          once by `devtools.backfill_result_registration`.
      headline:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^\S(.*\S)?$'
        description: >-
          The result stated short enough for a table cell, one line of inline Markdown
          with the mathematics in backticks. It keeps the claim's relation exactly (`≥`
          is not `>`), its exact form with the claim's decimal or a truncation of it
          marked `…`, and its n values, and states no number the claim does not; the
          checker holds it to that and to 100 characters. The claim stays the statement
          the rungs attach to.
      established:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        description: >-
          The day this result was first established in this repository: the day its
          certificate or proof first passed here, read from the commit that landed it.
          Required on every result without `attribution` and refused on one with it,
          whose date is `attribution.published`. Never before 22 August 2026, the day
          this project's square-packing work began.
      claim:
        type: string
        minLength: 1
        description: The one stated claim the levels attach to, in full.
      scope: {$ref: '#/$defs/scope'}
      verification:
        type: string
        enum: [V0, V1, V2, V3, V4, V5]
        description: >-
          The verification the result carries as certified by its own source; derived
          from the cited entries of any origin and the retained reviews (epistemics.md).
      confirmation:
        type: string
        enum: [C0, C1, C2, C3, C4, C5]
        description: >-
          How far that verification has been independently confirmed, here or by a third
          party; derived from the confirming-origin entries and the confirming-side
          reviews per epistemics.md, and never above the verification rung.
      significance: {$ref: '#/$defs/significance'}
      novelty:
        type: string
        enum: [common-knowledge, previously-published, apparently-novel, confirmed-novel]
      composition:
        type: string
        minLength: 1
        description: >-
          Required prose when the claim is compound or derived: names the
          load-bearing parts and which one sets the minimum, or the inputs a
          derived claim takes its minimum from.
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^E-[a-z0-9-]+$'}
      artifacts:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
        description: Repository-relative paths of the certificates, cases, and documents the result rests on.
      controls:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
        description: >-
          Repository-relative paths of the adversarial-control tests behind a
          C3-or-better rung; the checker requires this field at those rungs and
          verifies the paths exist.
      reviews:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/review'}
        description: >-
          The retained review documents the rungs rest on (epistemics.md, Review
          Records): adversarial AI reviews and a human oversight record at rung 4, human
          formalization reviews at rung 5. Each path is mapped in the document map as a
          non-superseded review; the checker counts, distinguishes and dates them.
      open_review:
        $ref: '#/$defs/open_review'
        description: Required at C5; the public sources, terms, replay instructions and the retained copy.
      next_rung:
        type: string
        minLength: 1
        description: The next evidence-improving action, or why no independent rung change applies.
      notes: {type: string, minLength: 1}
      superseded_by:
        type: array
        minItems: 1
        description: >-
          The later results that imply this one, in whole or in part, declared on a result
          whose kind is no bound (epistemics.md, Status). A bound's supersession is derived
          from the case records, as the results its cases' bounds rest on now
          (`render_recent_results.superseding`), and is never declared, so the checker
          refuses this field on a lower bound, an upper bound or an optimality result.
          `extent` is `whole` where the later result implies everything this one states,
          which marks it superseded wherever results are listed, or `part` where it
          implies some of it and this one still holds the rest, which marks it superseded
          in part and keeps it current. `what` says what the later result implies and,
          for a part, what this one still holds alone. `devtools.check_results` holds each
          named result to the register: it exists, is not this one, is named once, is
          dated no earlier (its source's publication, or the day this project established
          it), and shares a case with it.
        items:
          type: object
          additionalProperties: false
          required: [result, extent, what]
          properties:
            result: {type: string, pattern: '^T-[0-9]{3}$'}
            extent: {enum: [whole, part]}
            what: {type: string, minLength: 1}
      activity:
        type: object
        additionalProperties: false
        required: [state, what, since, link]
        description: >-
          Who has the next move on this result, when the record shows it (epistemics.md,
          Status): this project, with a replay, review or audit under way
          (`in-analysis`), or another party, with a request or a missing artifact on
          file (`waiting`, and `party` says who). It is the one hand-recorded workflow
          fact, so it is dated, links the bead, issue, branch or file that shows it, and
          expires: `devtools.check_results` refuses one more than 30 days older than
          `last_reviewed`. Removed when the work lands or the answer arrives; a result
          with nothing in hand carries none, and its `next_rung` says what is queued.
          The status itself (recorded, reviewed, confirmed, incomplete) is derived by
          `devtools.result_status` and never stored.
        if: {properties: {state: {const: waiting}}}
        then: {required: [party]}
        else: {not: {required: [party]}}
        properties:
          state: {enum: [in-analysis, waiting]}
          party: {enum: [source, owner, third-party]}
          what: {type: string, minLength: 1}
          since: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
          link: {type: string, minLength: 1}
      unfinished_confirmations:
        type: array
        minItems: 1
        description: >-
          The confirmations of this result that the record names and that have not been
          run or not finished (epistemics.md, Status): `what` the confirmation is, the
          confirmation `rung` it would reach, and the bead, issue or file that owns it
          (`link`). Optional, and listed only where the record knows the work concretely.
          `estimated_cost` is filled wherever a price is known, in CPU-hours: the central
          estimate, the upper end where the source gives one, how it was priced and the
          day. `next_rung` stays the prose of the next evidence-improving action; this is
          the structured, priced list of the confirmations it names that are not yet run.
          `activity` is work under way; an unfinished confirmation is work not yet started
          or not yet finished, and one that is under way is both. `devtools.check_results`
          refuses an item at or below the result's `confirmation`, so an item is removed
          when its confirmation lands, and refuses an upper end below the estimate, a
          price dated after `last_reviewed`, and an item listed twice.
        items:
          type: object
          additionalProperties: false
          required: [what, rung]
          properties:
            what: {type: string, minLength: 1}
            rung: {type: string, enum: [C1, C2, C3, C4, C5]}
            link: {type: string, minLength: 1}
            estimated_cost:
              type: object
              additionalProperties: false
              required: [cpu_hours, basis, priced]
              properties:
                cpu_hours: {type: number, exclusiveMinimum: 0}
                cpu_hours_high: {type: number, exclusiveMinimum: 0}
                basis: {type: string, minLength: 1}
                priced: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      regularizations:
        type: array
        minItems: 1
        description: >-
          The counts at which the certificate this result states is a regularization of a
          packing the register already credits (epistemics.md, Results by Others): at `n`,
          the packing result `of` holds there, rearranged for display without changing
          what the packing is meant to be. The packing's finder keeps its credit through
          `of`'s own attribution; the regularizer, `by`, is credited with the
          regularization, and is a bibliography key among this result's
          `attribution.source_keys`, or `project` for this project's own regularization
          of a result without `attribution`. `method` is the regularizer's own name for
          the procedure or its variant. `side` is `same` where the packing was regularized
          at its own side, or `solved` where it was first solved to an exact side and
          regularized at that side. `changes` is what the regularization did, as its
          source reports it: the largest angle by which determined rotation groups were
          merged, in degrees, and how many free squares were turned to the axis
          (`straightened`) or to another angle (`re_angled`). `identity` says what the
          claim that the certificate is still the same packing rests on: the source's own
          statement (`source-claim`), or a decision made here (`measured`). Either may
          carry the measurements made here under the best symmetry of the box: whether
          nearest centres pair the squares one to one (`one_to_one`), how many moved
          beyond 1e-3 (`moved`), the largest move (`max_move`) and the largest turn in
          degrees (`max_turn_deg`), with the review or receipt they come from in
          `measured_in`. The record states a regularization as the same packing in its
          own voice only where the basis is `measured`. On this project's own
          regularization (`by: project`) only, `modifications` names this project's
          modifications to Evan Daniel's regularizer that made the view, as a drawing's
          do (the owner, 13 October 2026): the vendored copy's patches its `method` names
          and the same-side exact re-solve of a view at the witness's side, or for a
          grid-slack view the port of his placement and its re-solve; it is empty where
          none applied and absent for the project's own axis tool. An item records no
          solve, so where his regularizer made the view `modifications_unrecorded` names
          what the item cannot establish: whether the solve climbed `retry rungs`. Where
          the atlas's regularized layer draws the very solve the item registered (the run
          and output the result's registration receipt names, at the same side), the
          layer's entry records its rungs, and the item reads them from it instead, with
          nothing unrecorded. `devtools.regularized_drawings` writes both and holds them
          there. `first_certified_in` names the earlier registered result whose
          certificate first stated this item's exact side, where one did: the item then
          registers that side exactly and proves no new bound, as T-155's do at the 33
          counts where its side is that of Evan Daniel's certificate (T-101); at its
          other 26 the side is new. `devtools.regularized_drawings` holds it to the case
          record, whose verified upper bound then rests on both results.
          `devtools.check_results` holds `n` to this result's scope, once each; `of` and
          `first_certified_in` to a registered result other than this one whose scope
          holds `n` and whose date is no later than this result's; `by` to this result's
          sources; and a `measured` identity to at least one measurement.
        items:
          type: object
          additionalProperties: false
          required: [n, of, by, method, side, identity]
          properties:
            n: {type: integer, minimum: 1}
            of: {type: string, pattern: '^T-[0-9]{3}$'}
            by: {type: string, pattern: '^(\[.+\]|project)$'}
            method: {type: string, minLength: 1}
            modifications: {type: array, items: {type: string, minLength: 1}}
            modifications_unrecorded:
              type: array
              minItems: 1
              items: {enum: [retry rungs]}
            side: {enum: [same, solved]}
            first_certified_in: {type: string, pattern: '^T-[0-9]{3}$'}
            changes:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                merged_rotation_groups_deg: {type: number, minimum: 0}
                straightened: {type: integer, minimum: 0}
                re_angled: {type: integer, minimum: 0}
            identity:
              type: object
              additionalProperties: false
              required: [basis]
              properties:
                basis: {enum: [source-claim, measured]}
                measured_in: {type: string, minLength: 1}
                one_to_one: {type: boolean}
                moved: {type: integer, minimum: 0}
                max_move: {type: number, minimum: 0}
                max_turn_deg: {type: number, minimum: 0}
          if: {properties: {by: {not: {const: project}}}}
          then:
            not:
              anyOf:
                - required: [modifications]
                - required: [modifications_unrecorded]
      attribution:
        type: object
        additionalProperties: false
        required: [source_keys, published]
        description: >-
          Whose result this is, when it is not this project's. Required on every
          `previously-published` result and refused on `apparently-novel` and
          `confirmed-novel` ones. The keys resolve in `resources/bibliography.yaml`,
          which is the one home of the authors, the credit line and the lineage, so the
          credit on an original result is never restated here. `published` is the date
          the result entered its source, which can precede the date this record first
          saw it. The rungs stay this repository's: `V` is the strongest verification
          anywhere and `C` what this repository has done, so a result by others is
          registered when it is taken in and rises as the replay and review land.
        properties:
          source_keys:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, pattern: '^\[.+\]$'}
          published:
            type: string
            pattern: '^\d{4}(-\d{2}-\d{2})?$'
            description: A date, or a year alone for a source that carries no date.
      builds_on:
        type: object
        additionalProperties: false
        required: [credit, source_keys]
        description: >-
          Whose proof, method or tool a result of this project rests on directly: what
          its credit prints after `Levy after`, as a result by others prints the work its
          source says it builds on (epistemics.md, Parallel Projects and Their Credit).
          Refused beside `attribution`. `credit` is the names as a credit line prints
          them, surnames or handles, in the order to print. `source_keys` resolve in
          `resources/bibliography.yaml`, each is the `source_key` of an evidence entry
          this result cites, and every credited name is an author of one of them, so
          the field says only what the record already holds; the checker verifies all
          three. A proof the result repairs or corrects is a basis. A packing whose
          property the result proves is its subject, not its basis, and is not listed.
        properties:
          credit:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, pattern: '^\S(.*\S)?$'}
          source_keys:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, pattern: '^\[.+\]$'}
      corrects:
        type: object
        additionalProperties: false
        required: [source_key, result, what]
        description: >-
          The published work this result corrects, where it stands in for a published
          result found unsound: `source_key` resolves in `resources/bibliography.yaml` to
          the work corrected, `result` is the register's record of that published result,
          and `what` says in a few words what in it failed. It names the outside work, so
          a page can say "corrects Nagamochi 2005" beside the bound. It is not where a
          correction to this register is recorded: that is a defect entry in
          `defects.yaml` under this project's own process, which the dated corrections in
          the case records cite.
        properties:
          source_key: {type: string, pattern: '^\[.+\]$'}
          result: {type: string, pattern: '^T-\d{3}$'}
          what: {type: string, minLength: 1, maxLength: 80}
      produced_by:
        type: object
        additionalProperties: false
        minProperties: 1
        description: >-
          The campaign records this result came out of, as ids the checker resolves
          to existing records and refuses when dangling. Every key is optional: a
          result names only the provenance the record itself states. Before this
          field existed the join ran through prose alone -- a `by:` line inside
          significance, cell ids inside next_rung -- which no ledger could read, so a
          hypothesis with a registered result standing on it reported as untouched.
        properties:
          hypothesis: {type: string, pattern: '^H-[0-9]{3}$'}
          agenda_cell: {type: string, pattern: '^BC-[0-9]{3}$'}
          session: {type: string, pattern: '^session-[0-9]{3}$'}
          experiment: {type: string, pattern: '^exp-[0-9]{3}$'}
