$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:SourceCoverage/v1
title: SourceCoverage
description: Dated coverage of the named public sources used for the square-packing frontier.
type: object
additionalProperties: false
required:
  - last_reviewed
  - coverage_scope
  - case_corpus
  - sources
  - selected_overrides
  - beyond_horizon_claims
properties:
  last_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  coverage_scope: {type: string, minLength: 1}
  case_corpus:
    type: object
    additionalProperties: false
    required: [n_min, n_max, reader_view]
    properties:
      n_min: {type: integer, minimum: 1}
      n_max: {type: integer, minimum: 1}
      reader_view: {type: string, minLength: 1}
  sources:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/source'}
  selected_overrides:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [n, source_id, value, evidence, reason]
      properties:
        n: {type: integer, minimum: 1}
        source_id: {type: string, pattern: '^[a-z0-9-]+$'}
        value: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        evidence: {type: string, pattern: '^E-[a-z0-9-]+$'}
        reason: {type: string, minLength: 1}
  beyond_horizon_claims:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [n, source_id, claim, value, assurance, disposition]
      properties:
        n: {type: integer, minimum: 1}
        source_id: {type: string, pattern: '^[a-z0-9-]+$'}
        claim: {enum: [upper-bound, lower-bound, exact-value]}
        value: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        assurance: {enum: [reported, numerically-checked, verified]}
        disposition: {enum: [tracked-outside-case-corpus, deferred-conflict, superseded]}
$defs:
  scope:
    oneOf:
      - type: object
        additionalProperties: false
        required: [n_min, n_max]
        properties:
          n_min: {type: integer, minimum: 1}
          n_max: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [n_values]
        properties:
          n_values:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: integer, minimum: 1}
  source:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - role
      - url
      - local
      - source_key
      - scope
      - reviewed
      - source_date
      - disposition
      - replay_disposition
      - represented_by
      - evidence
      - notes
    properties:
      id: {type: string, pattern: '^[a-z0-9-]+$'}
      title: {type: string, minLength: 1}
      role: {enum: [current-catalogue, first-party-release, source-repository]}
      url: {type: string, minLength: 1}
      local: {type: string, minLength: 1}
      source_key: {type: string, minLength: 1}
      scope: {$ref: '#/$defs/scope'}
      reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      source_date: {type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$'}
      disposition: {enum: [baseline-current, current-report, superseded-covered]}
      replay_disposition:
        enum:
          - case-specific
          - public-certificate-missing
          - numerically-checked-and-exact-relaxed
      represented_by:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^E-[a-z0-9-]+$'}
      notes: {type: string, minLength: 1}
