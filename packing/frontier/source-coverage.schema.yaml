$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:SourceCoverage/v1
title: SourceCoverage
description: Dated coverage of the named public sources used for the square-packing frontier.
type: object
additionalProperties: false
required:
  - last_reviewed
  - coverage_scope
  - case_corpus
  - sources
  - selected_overrides
  - superseded_reports
  - beyond_horizon_claims
properties:
  last_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  coverage_scope: {type: string, minLength: 1}
  case_corpus:
    type: object
    additionalProperties: false
    required: [n_min, n_max, reader_view]
    properties:
      n_min: {type: integer, minimum: 1}
      n_max: {type: integer, minimum: 1}
      reader_view: {type: string, minLength: 1}
  sources:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/source'}
  selected_overrides:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [n, source_id, value, evidence, reason]
      properties:
        n: {type: integer, minimum: 1}
        source_id: {type: string, pattern: '^[a-z0-9-]+$'}
        value: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        evidence: {type: string, pattern: '^E-[a-z0-9-]+$'}
        reason: {type: string, minLength: 1}
  superseded_reports:
    description: >-
      Retained claims a selected override at the same n beats, or, where none is
      selected, the catalogue baseline beats. Each names its own source, the side that
      source prints, and the source whose report supersedes it; check_source_coverage
      holds the first to the source's reparsed record and requires the second to be
      strictly smaller.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [n, source_id, value, superseded_by, reason]
      properties:
        n: {type: integer, minimum: 1}
        source_id: {type: string, pattern: '^[a-z0-9-]+$'}
        value: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        superseded_by: {type: string, pattern: '^[a-z0-9-]+$'}
        reason: {type: string, minLength: 1}
  pending_catalogue_intake:
    description: >-
      Counts where a later capture of the Kingbird catalogue prints a side below the one
      the record reports, and taking it is an intake of its own because the register must
      first hold the result. Each names the side the record still reports, the side the
      current capture prints, and the capture the record still transcribes;
      check_source_coverage reads that capture for the count, requires the record to
      carry a source-evidence blocker naming pending_catalogue_intake and the newer side,
      and fails the declaration once either capture or the record stops agreeing with it.
      A deferral is work, so each also names the open bead that owns the intake and the
      day it was recorded: the three entries of 2026-09-30 named neither, and sat five
      days with nothing listing them. check_bead_tree fails an entry whose bead is not
      open, and devtools.intake_sweep reports each with its age.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [n, record_value, catalogue_value, capture, reason, bead, recorded]
      properties:
        n: {type: integer, minimum: 1}
        record_value: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        catalogue_value: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        capture: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        reason: {type: string, minLength: 1}
        bead: {$ref: '#/$defs/bead'}
        recorded: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  beyond_horizon_claims:
    description: >-
      Claims beyond the case corpus, one row per count and source. A count may carry
      several dated rows: at most one current row, and each earlier report that a later
      one beats, kept as it was printed, with `disposition: superseded` and
      `superseded_by` naming the source of the row that beats it, as a superseded report
      names its source. check_source_coverage holds every row to its source's reparsed
      record byte for byte, and each successor to be a row at the same count, of the same
      claim, from a source dated no earlier, strictly better by exact decimal comparison,
      and never a cycle back to the row it supersedes.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [n, source_id, claim, value, assurance, disposition]
      description: >-
        A `deferred-conflict` is a deferral, like a pending intake, so it names the open
        bead that owns resolving it. A `superseded` row names its successor, and only a
        superseded row names one.
      allOf:
        - if: {properties: {disposition: {const: deferred-conflict}}}
          then: {required: [bead]}
        - if: {properties: {disposition: {const: superseded}}}
          then: {required: [superseded_by]}
          else: {not: {required: [superseded_by]}}
      properties:
        n: {type: integer, minimum: 1}
        source_id: {type: string, pattern: '^[a-z0-9-]+$'}
        claim: {enum: [upper-bound, lower-bound, exact-value]}
        value: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$'}
        assurance: {enum: [reported, numerically-checked, verified]}
        disposition: {enum: [tracked-outside-case-corpus, deferred-conflict, superseded]}
        superseded_by: {type: string, pattern: '^[a-z0-9-]+$'}
        bead: {$ref: '#/$defs/bead'}
$defs:
  bead:
    type: string
    pattern: '^think-[a-z0-9]{4}$'
  scope:
    oneOf:
      - type: object
        additionalProperties: false
        required: [n_min, n_max]
        properties:
          n_min: {type: integer, minimum: 1}
          n_max: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [n_values]
        properties:
          n_values:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: integer, minimum: 1}
  source:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - role
      - url
      - local
      - source_key
      - scope
      - reviewed
      - source_date
      - disposition
      - replay_disposition
      - represented_by
      - evidence
      - notes
    properties:
      id: {type: string, pattern: '^[a-z0-9-]+$'}
      title: {type: string, minLength: 1}
      role: {enum: [current-catalogue, first-party-release, source-repository]}
      url: {type: string, minLength: 1}
      local: {type: string, minLength: 1}
      source_key: {type: string, minLength: 1}
      scope: {$ref: '#/$defs/scope'}
      reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      source_date: {type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$'}
      disposition: {enum: [baseline-current, current-report, superseded-covered]}
      replay_disposition:
        enum:
          - case-specific
          - public-certificate-missing
          - numerically-checked-and-exact-relaxed
      represented_by:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      claims_record:
        description: >-
          A retained machine-readable record of the source's upper-bound claims --
          a UnitSquare results release, a packet's acquisition/sources.json, or a
          directory of exact certificates whose headers state their sides -- which
          check_source_coverage reparses so every claim in it is accounted for.
        type: string
        minLength: 1
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^E-[a-z0-9-]+$'}
      notes: {type: string, minLength: 1}
