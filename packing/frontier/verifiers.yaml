softschema:
  contract: packing.squares:VerifierRegistry/v1
  schema: verifiers.schema.yaml
  status: enforced

# Every verification program the evidence register names, external first and then this
# repository's own. An evidence entry names the programs that verified it in `verifiers`,
# and its `relationship_to_generator` says how they stand to the code its result's
# producer used; epistemics.md (Confirmation) defines the relations and VERIFIERS.md is
# the rendered view. `devtools.backfill_verifier_relation` fills `verifiers` from replay
# commands, packets and digests, audits the relation, and prints what it cannot decide.

last_reviewed: '2026-10-10'
