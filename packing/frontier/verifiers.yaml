      Decides a measure-capture lower-bound certificate of format T, M or L on the
      201-direction net, of format M on the uniform net its file declares (proof_net,
      lemma N0), or of format T on the uniform net its certificate metadata sets (D and
      angle_count, admitted under lemma N0's premises): exact admission of its premises,
      then an exact-event vertex sweep
      at the axis and outward-rounded interval branch and bound at every other direction,
      every shrunk square at every centre of its domain capturing at least the threshold.
    source:
      - packing/sqverify_fast
      - packing/devtools/sqverify_fast_census.py
      - packing/devtools/check_sqverify_fast.py
      - packing/src/sqpack/rectangle_density.py
    independence_record: packing/sqverify_fast/independence-record.yaml
    note: >-
      A clean-room verifier, written from the mathematics without opening the authors'
      checkers (packing/sqverify_fast/INDEPENDENCE.md), its lemmas proved in
      packing/sqverify_fast/SOUNDNESS.md, and accepted at 4ddf37d9c by the two adversarial
      reviews of 3 October 2026, of its soundness and of its testing and independence. Its
      declared-net change (f007d7afd and 910b6b12c, source_sha256 d97758bb...) was
      accepted by the soundness review of 6 October 2026
      (docs/project/reviews/review-2026-10-06-sqverify-fast-declared-net-soundness.md),
      for a declared net once the control's exact evaluator read that net (its DR-1),
      which the same day's re-check confirmed. Its format T metadata-net path, by which a
      format T file's certificate block sets D and angle_count, has no review of its own:
      lemma N0 is stated for every net admission accepts, and the review of 10 October
      2026 of Guzhou0806's s(40) bound
      (docs/project/reviews/review-2026-10-10-guzhou-n40-clipped-corner-bound.md, its
      GN-6) read the admission path and every use of the admitted step and found the
      admitted net used wherever the net enters; admission refuses a metadata net that
      stops short of pi/4 (control D there). Since 0b5a62ca5 the census driver and the
      control evaluator read such a net as admission does (that review's GN-5), and no
      census case holds one yet. Its census drives the binary, keeps every
      direction's receipt and puts negative controls on a certificate: for format M the
      original and a near-threshold mutant at its least-bound direction, and since the
      review of 6 October of FC-1's fix
      (docs/project/reviews/review-2026-10-06-sqverify-fast-census-control-fc1.md) the
      99/100 mutant at every direction of the net, with check_sqverify_fast's exact
      evaluator and mutation helpers; for format T the original and both mutants at the
      least-bound leaf centre of least exact capture, evaluated by
      sqpack.rectangle_density, which was written before the crate and which its authors
      read (the format T route review of 6 October 2026,
      docs/project/reviews/review-2026-10-06-sqverify-fast-format-t-route.md). None of
      these decides coverage. tests/test_sqverify_fast_census.py admits a census row as
      evidence only for a build of a reviewed source.

