      and a human oversight record, and none is retained.

      The bound
      itself: the ladder 19/5, 77/20, 97/25, 39/10, 393/100, 197/50, 79/20, 99/25 was
      climbed once the separation oracle was corrected to score the cells the verifier
      decides (D-434), and every rung is retained.

      The retained certificate's total is 149987/12500 = 11.998960, leaving 0.001040
      below twelve -- the tightest margin of any rung in the record, and it survived on
      the sign of a rounding rather than by design. The next tightest, two rungs below
      at 197/50, is about seven times wider.

      Rationalisation rounds each orbit up to a multiple of 1/scale, so its cost is at
      most atoms/scale; at 2097 atoms and scale 200,000 it took 0.005314, five times what
      remained. Raising the scale twentyfold would have cost about 0.00027 and would not
      have changed the atom count. That is a defaults question and it is BC-191's.

      Margin does not shrink monotonically as the ladder climbs -- the
      197/50 rung two below this one has 0.007175 and 79/20 has 0.029410, so a tight
      rung is evidence about that run and not about how much room is left.

      This rung also cost the exhaustive tier, when it was retained: 2097 atoms is 1.8 times the next largest
      retained certificate, the 1184-atom n = 17 rung, and the exact sweep is quadratic in the atom
      count, so deciding it took 4866 s where the interval route took 110 s. The sweep
      was rewritten the same day to decide in integers on the weights' common scale, in
      parallel over directions, and returns the same verdict in well under a minute;
      BC-195 owns whether the tier can still afford what it holds.

      What is left is bounded, though, and by the method rather than by the search.
      A certificate for n cannot exist above ceil(sqrt(n)) * B, since a container wider
      than that holds ceil(sqrt(n))^2 pairwise disjoint axis-parallel B-squares, each
      carrying mass at least 1 by Condition 5, which forces the total past n and breaks Condition 2.
      Here that ceiling is 4B = 3.9908 on this certificate's own B, and it is what
      binds: 4/(1 + D) = 3.990816 is the supremum over every shrink the 181-direction net
      admits, and the grid packing's 4 sits above both. So the retained 99/25 has 0.0308
      of runway left.

      The consequence for this case is structural and worth stating exactly: the grid
      packing gives s(12) <= 4, the ceiling sits strictly below 4, and 4 is the
      conjectured value -- so no single certificate of this shape certifies s(12) >= 4,
      however fine the net or the site set. What the ceiling does not exclude is a
      proved family of certificates with sides tending to 4 and a limit argument on top
      of it; whether such a family exists is a question about the covering value, and
      an earlier version of this sentence overstated the ceiling into a method-wide
      impossibility (PR 78's adversarial review, F14). What remains is how close to 4 a
      certificate can get.
    notes: >-
