      convergence and finished at an objective of exactly 11.000000, descending to it
      from 11.6 over twelve rounds and never crossing below.

      The set seeded from this certificate's own 1121 atoms, 24069 sites, has not
      converged and does not need to. Its objective has stood at 11.000000 through
      twenty-four row rounds and 30240 rows while the loop's least covered mass climbed
      from 0.8490 towards 1, reaching 0.9997 at the round the run was stopped -- so
      violated placements remained and the loop had not exhausted.
      Adding rows can only raise a restricted optimum, so the
      optimum for that site set is at least eleven whatever the loop does next, and no
      certificate exists on it. Reading the objective alone would have understated this:
      the loop's stopping state is what makes the conclusion independent of finishing.

      A certificate needs mass strictly below eleven, so neither site set yields one. The rejection route does not close
      either, and it is much further from closing than the search's own progress
      figures suggest. H-061's object was built and decided exactly: the converged dual
      is 76 squares, 608 after the D4 images, with a raw total of exactly 11, and
      sqpack.fractional.ceiling checked all 1650944 vertices of their arrangement,
      272244 of them in exact arithmetic. The maximum pointwise depth is 1925/1152 =
      1.671007, so the feasible total -- the raw total scaled to make the family a
      packing -- is 1152/175 = 6.5829 against the eleven a ceiling needs.

      The gap between that and the search's running estimate is the thing to carry
      forward. Column generation prices against a grid sample and reported a depth of
      12/11 = 1.0909, which would have made the feasible total 121/12 = 10.08. The exact
      maximum is 53 per cent higher, because depth peaks at vertices of the arrangement
      that no grid samples. A ceiling must therefore be judged on the exact check and
      never on the sampled depth, which flatters it.

