  - id: T-006
    kind: optimality
    registered: '2026-08-31'
    headline: "`s(13) = 4`"
    claim: >-
      s(13) = 4 (Bentz 2010, Theorem 9). Proved again, without cases, by Evan Daniel's
      weighted closed cover of [0,4]^2.

      The second proof was kernel-checked in Lean 4 here on 30 September 2026:
      SquarePacking.s13_eq_4 : minSide 13 = 4, depending only on propext, Classical.choice and
      Quot.sound, built from the retained source with Mathlib's official cache. The cover's
      zero-margin property was also certified here by the source's zmx2 over every root of its
      D4 region.

      The theorem is Bentz's. The case-free proof is Evan Daniel's,
      [evand/square-packing](https://github.com/evand/square-packing/tree/6aa82ba457e9eaeaaa3af0833600f27f91a2fce3),
      building on Burns's and Massaccesi's method, with an AI agent under human direction as
      his CREDITS.md says.
    scope: {n_values: [13]}
    verification: V3
    confirmation: C3
    significance:
      score: 3
      rationale: >-
        A published exact value in the m^2 - 3 family; the score is the
        theorem's, not ours.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: previously-published
    attribution:
      source_keys: ['[Bentz 2010]', '[evand square-packing 2026-09-28]']
      published: '2010-09-13'
    composition: >-
      Two independent proofs of one value. Bentz's is compound, with Sections 3.1-3.2's
      case analysis read rather than machine-checked. Evan Daniel's case-free proof is
      complete as it stands: the Lean kernel checked s13_eq_4 from the definitions,
      including every one of the 209 cover chunks (E-n013-evand-casefree-cover-lean-kernel). A
      kernel check is machine evidence at V3: V5 also needs a human expert's review of the
      formalization, and the retained review of s13_eq_4 was written by an AI lane. The
      confirmation rung comes from the machine-method replay
      E-n013-evand-casefree-cover-zmx2-replay (C3); whether a kernel check itself counts
      toward C is the owner's open question.
    evidence:
      - E-bentz-2010-proof
      - E-bentz13-figure2-audit
      - E-n013-evand-casefree-cover-zmx2-replay
      - E-n013-evand-casefree-cover-lean-kernel
    artifacts:
      - packing/cases/bentz13/verify_cover.py
      - packing/resources/papers/bentz-2010-optimal-packings-13-and-46.md
      - packing/resources/web/evand-square-packing-2026-09-28/receipts/lean/axioms_s13.log
      - packing/resources/web/evand-square-packing-2026-09-28/receipts/lean/s13_table.txt
      - packing/resources/web/evand-square-packing-2026-09-28/receipts/s13_zmx2_d4.log
      - docs/project/reviews/review-2026-09-30-lean-s13.md
    controls:
      - packing/tests/test_evand_mixed_covers.py
    notes: >-
      2026-09-30: held V5/C3 under the ladder in force from 2026-08-31 to 2026-09-30 (V5
      proof-assistant checked). It stands at V3/C3, machine-checked with the review record
      pending: rung 5 now needs a human expert's review of the formalization, and the
      review of the kernel-checked s13_eq_4 retained here
      (docs/project/reviews/review-2026-09-30-lean-s13.md) was written by an AI lane of
      this session. One named human expert's formalization review restores V5; C5 needs
      two, with the open-review pointer, beside the rebuild already done here.
    next_rung: >-
      One named human expert's review of the formalization restores V5; C5 needs two, with the
      open-review pointer, beside the rebuild already done here. V4 and C4 need two
      adversarial AI reviews by distinct reviewers and a human oversight record, and none is
      retained. A second machine method on the same cover, for example a complete
      zeromargin.py sweep (1 h 42 min on 8 processes at the source) beside the zmx2 replay,
      would be shown beside the rung. Bentz's own route would reach C3 by machine-checking
