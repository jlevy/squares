  - id: T-006
    kind: optimality
    registered: '2026-08-31'
    headline: "`s(13) = 4`"
    claim: >-
      s(13) = 4 (Bentz 2010, Theorem 9). Proved again, without cases, by Evan Daniel's
      weighted closed cover of [0,4]^2.

      The second proof was kernel-checked in Lean 4 here on 30 September 2026:
      SquarePacking.s13_eq_4 : minSide 13 = 4, depending only on propext, Classical.choice and
      Quot.sound, built from the retained source with Mathlib's official cache. The cover's
      zero-margin property was also certified here by the source's zmx2 over every root of its
      D4 region.

      The theorem is Bentz's. The case-free proof is Evan Daniel's,
      [evand/square-packing](https://github.com/evand/square-packing/tree/6aa82ba457e9eaeaaa3af0833600f27f91a2fce3),
      building on Burns's and Massaccesi's method, with an AI agent under human direction as
      his CREDITS.md says.
    scope: {n_values: [13]}
    verification: V3
    confirmation: C3
    significance:
      score: 3
      rationale: >-
        A published exact value in the m^2 - 3 family; the score is the
        theorem's, not ours.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: previously-published
    attribution:
      source_keys: ['[Bentz 2010]', '[evand square-packing 2026-09-28]']
      published: '2010-09-13'
    composition: >-
      Two independent proofs of one value. Bentz's is compound, with Sections 3.1-3.2's
      case analysis read rather than machine-checked. Evan Daniel's case-free proof is
      complete as it stands: the Lean kernel checked s13_eq_4 from the definitions,
      including every one of the 209 cover chunks (E-n013-evand-casefree-cover-lean-kernel). A
      kernel check is machine evidence at V3: V5 also needs a human expert's review of the
      formalization, and the retained review of s13_eq_4 was written by an AI lane. The
      confirmation rung comes from the machine-method replay
      E-n013-evand-casefree-cover-zmx2-replay (C3); whether a kernel check itself counts
      toward C is the owner's open question.
    evidence:
