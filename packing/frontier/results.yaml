  - id: T-083
    kind: lower-bound
    registered: '2026-10-02'
    headline: "`s(n) ≥ 1/2 + √(n − ⌊√n⌋ + 1/4)` for every nonsquare `8 ≤ n ≤ 324`"
    claim: >-
      For every nonsquare integer 8 <= N <= 324, Karakuş 2026, Corollary 6.2 gives
      s(N) >= 1/2 + sqrt(N - floor(sqrt(N)) + 1/4), which is strictly above sqrt(N).

      The bound is his rectangle bound, Theorem 1.1, at a square container whose side t
      solves t^2 - (t - floor(sqrt(N))) = N. The rectangle bound is proved by a strip
      measure that uses neither the scoring lemma nor the technical lemmas of Nagamochi
      2005. It equals ceil(sqrt(N)) exactly at N = m^2 - 1, which is T-084, and is strictly
      below Nagamochi's Theorem 2, T-007, at every other nonsquare N.

      The proof was read in full and re-derived here. Its Proposition 5.1, the strip
      measure's per-square bound on which the rectangle bound rests, is machine-checked
      here, independently re-implemented: an exact branch and bound over the square's
      orientation, side and cut height (devtools.check_karakus_strip_measure), by its own
      decomposition rather than the paper's Lemma 5.2. Hakan Karakuş,
      [arXiv:2609.37410](https://arxiv.org/abs/2609.37410), 29 September 2026.
