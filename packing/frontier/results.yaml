      808514697/200000000000 now carries an exact-algebraic entry of its own,
      E-n011-trump-isolation-radius (replayed-here, same-implementation, passed), and
      C3 for the radius is derived. It does not set the composed theorem's minimum,
      because the closed-tree review's question, whether BC-240's audited prose steps are
      load-bearing for confirmation, is answered yes.

      The replay and the BC-241 checker confirm the quantities the proof consumes (the
      moduli, the curvature constants, the stresses, the caps and their aggregate
      arithmetic) and not the steps that use them. Those steps are prose, and the first
      clause rests on each: that the second-order
