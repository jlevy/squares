      If tau*(3.82) is exactly eleven then this is the one configuration where neither
      pre-registered route can close, since a certificate needs mass below n and a
      ceiling needs the scaled dual to reach n, and both fail by an infinitesimal at
      exactly n. That is a limit on the reach of the rejection route rather than a
      stalled search. It is recorded as measurement: two LP runs agreeing to six
      decimals is evidence about the restricted optima, not a proof that tau* equals
      eleven, and nothing here rules out a site set neither run found.
