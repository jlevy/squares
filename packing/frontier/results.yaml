    composition: >-
      Two machine entries decide all 77 bounds, each at its case's verified value: the
      exact decision here by two checkers of this repository that share no code with each
      other or the source (exact-algebraic, independently re-implemented), and the source's
      own two checkers run here (exact-algebraic, reproduced with the producer's code).
      Both are exact rational decisions of the same certificates, one method, so C3 with
      one machine method beside it. Each case record's verified value is S' rounded up at
      the printed precision, which s(n) <= S' implies. The comparisons with the printed
      sides, the closed forms and the witnesses' poses are recorded values and set no
      rung, and the source's numerical KKT reports are outside the claim.
    next_rung: >-
      V4 and C4 need two adversarial AI reviews of the complete claim by distinct
      reviewers and a human oversight record. A method-distinct second route, such as an
      interval decision of each certificate's pose, would be shown beside the rung. No
      certificate here has yet been decided by code of a reviewer's own. At the 49 counts
      whose report is an irrational closed form, the verified upper bound reaches the report
      only through an exact algebraic certificate of the packing at that side. At the six
      rational ones, n = 50, 171, 198, 230, 261 and 293, an exact certificate at that side
      would reach it, rational where the packing's exact point is; at n = 50 the source's
      own exact point, before its outward rounding, appears to be a rational one (the
      review's EC-1, think-l8gt). This entry gives neither.
    notes: >-
      Registered on 6 October 2026 by lane R8 of the 6 October intake (think-70bh, under
      think-wyf4), on the owner's decision of that day, under the provisional id T-118.
      It is an entry of its own rather than a wider T-098: T-098 registers the 48
      certificates that lower a printed side, as #375 asked, and its claim, score and two
      reviews are about those; these 77 lower only a verified ceiling, and the author
      asked for none of them.

      That departs from two rows of result-import.md's register table. "Bounds of one kind
      at several counts in one release", which T-046's widening of 6 October followed,
      would here have widened T-098's reviewed claim; and "below the standing bound and
      asking for no work" gives way to the owner's decision to act on these certificates.
      T-088 and T-089 keep their claims and are superseded at n = 69, 83 and 87 as
      ceilings; the packings they registered stay the best known and the reported bounds.

      devtools.apply_exact_ceilings survey selects the counts from the receipts and the
      records: of the 272 certificates beside the 48 and the held n = 17, these 77 are
      exactly those whose side rounded up at the printed precision lies below the verified
      ceiling the record held (receipts/ceiling-survey.json). The one other count whose
      ceiling trailed its report, n = 29, keeps it: its interval-certified bound,
      E-n029-interval-certified-upper, lies 5e-21 below S' there. The 77
      certificates, decided on 5 October with the rest, were retained on 6 October from a
      second clone at the pin, byte for byte the pinned ones, and their controls were run
      then. The n = 17 certificate is held by the owner for the n = 17 work
      (think-x4v4) and was neither retained nor replayed.

      The separately prompted review of 6 October, whose session refused the project
      interpreter, ended defect-open on one blocking finding, EC-1: the record said no
      rational certificate reaches a catalogue closed form, false at the six rational ones.
      That and its six other findings were handled the same day, and a second separately
      prompted reviewer's fix check ended defects-resolved; its four non-blocking findings
      were handled after it, n = 50's grid structure now held by a test. Neither reviewer
      could run code, so no certificate here has yet been decided by a reviewer's own.

