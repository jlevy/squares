      - packing/resources/web/evand-square-packing-2026-09-28/receipts/lean/axioms_s13.log
      - packing/resources/web/evand-square-packing-2026-09-28/receipts/lean/s13_table.txt
      - packing/resources/web/evand-square-packing-2026-09-28/receipts/s13_zmx2_d4.log
      - docs/project/reviews/review-2026-09-30-lean-s13.md
    controls:
