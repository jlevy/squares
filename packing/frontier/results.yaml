      distinct reviewer and a human oversight record. An outside mathematical review and an
      archival release
      would strengthen the priority record without changing this rung.

      The bound itself: 3.81 converged with margin -- objective 10.8603 against eleven,
      rationalised to 434547/40000 = 10.863675 -- so the next rung is a search question
      rather than a limit of the method. Getting there took two attempts at the same
      side, and the difference between them is worth keeping. The first stopped with its
      row loop still finding violated placements (final least 0.9764) and was refused by
      the exact sweep at directions 55 to 63, least cell 199531/200000. The second ran
      the loop to convergence -- three row rounds, 25318 rows, final oracle least mass
      exactly 1 -- and was accepted at every direction. An objective below n proves
      nothing on its own; the loop's stopping condition is the thing to read.

      Where it stops: 3.82 was then attacked from both sides and neither route closes.
      The covering LP was run on two independent site sets, and the two stop at exactly
      eleven for different reasons, which is worth separating because only one of them
      converged.

      The grid-built set, 6637 sites and 14820 rows at the end, ran its row loop to
      convergence and finished at an objective of exactly 11.000000, descending to it
      from 11.6 over twelve rounds and never crossing below.

      The set seeded from this certificate's own 1121 atoms, 24069 sites, has not
      converged and does not need to. Its objective has stood at 11.000000 through
      twenty-four row rounds and 30240 rows while the loop's least covered mass climbed
      from 0.8490 towards 1, reaching 0.9997 at the round the run was stopped -- so
      violated placements remained and the loop had not exhausted.
      Adding rows can only raise a restricted optimum, so the
      optimum for that site set is at least eleven whatever the loop does next, and no
      certificate exists on it. Reading the objective alone would have understated this:
      the loop's stopping state is what makes the conclusion independent of finishing.

      A certificate needs mass strictly below eleven, so neither site set yields one. The rejection route does not close
      either, and it is much further from closing than the search's own progress
      figures suggest. H-061's object was built and decided exactly: the converged dual
      is 76 squares, 608 after the D4 images, with a raw total of exactly 11, and
      sqpack.fractional.ceiling checked all 1650944 vertices of their arrangement,
      272244 of them in exact arithmetic. The maximum pointwise depth is 1925/1152 =
      1.671007, so the feasible total -- the raw total scaled to make the family a
      packing -- is 1152/175 = 6.5829 against the eleven a ceiling needs.

      The gap between that and the search's running estimate is the thing to carry
      forward. Column generation prices against a grid sample and reported a depth of
      12/11 = 1.0909, which would have made the feasible total 121/12 = 10.08. The exact
      maximum is 53 per cent higher, because depth peaks at vertices of the arrangement
      that no grid samples. A ceiling must therefore be judged on the exact check and
      never on the sampled depth, which flatters it.

      One thing 3.82 is not: the method's ceiling. A certificate for n cannot exist
      above ceil(sqrt(n)) * B, because a wider container holds ceil(sqrt(n))^2 pairwise
      disjoint axis-parallel B-squares whose masses Condition 5 forces past n; for n = 11 that is
      4B = 3.9908, leaving 0.1808 of runway above the retained 381/100. The wall at 3.82
      is a covering wall, met far below where the method stops working.

      If tau*(3.82) is exactly eleven then this is the one configuration where neither
      pre-registered route can close, since a certificate needs mass below n and a
      ceiling needs the scaled dual to reach n, and both fail by an infinitesimal at
      exactly n. That is a limit on the reach of the rejection route rather than a
      stalled search. It is recorded as measurement: two LP runs agreeing to six
      decimals is evidence about the restricted optima, not a proof that tau* equals
      eleven, and nothing here rules out a site set neither run found.

