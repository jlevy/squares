  - id: T-007
    kind: lower-bound
    registered: '2026-08-31'
    headline: "`s(n) ≥ min(⌈√n⌉, √(n - 2⌊√n⌋ + 1) + 1)` for `4 ≤ n ≤ 100`"
    claim: >-
      For every integer 4 <= N <= 100, Nagamochi 2005, Theorem 2 gives
      s(N) >= min(ceil(sqrt(N)), sqrt(N - 2*floor(sqrt(N)) + 1) + 1).
    scope: {n_min: 4, n_max: 100}
    verification: V0
    confirmation: C1
    significance:
      score: 3
      rationale: >-
        The workhorse lower bound until 2026-10-02, and no less important for being
        unproved: 95 of the hundred case records cite this result, and since that date it
        supplies the operative verified lower bound in 0 of them. It supplied 88 until
        2026-08-31, when this project's certificates began displacing it; replayed external
        certificates displaced 18 more case values on 2026-09-22, one more, n = 32, on
        2026-09-27, and another, n = 45, on 2026-09-29, leaving 63 at n <= 100 and 287 in
        all when its proof was found incomplete. Replayed certificates recorded in parallel
        and merged on 2026-10-03 have since raised 51 of those floors, 38 of them at
        n <= 100, above the ones that replaced it. Its values remain recorded as reported
        bounds.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: previously-published
    attribution:
      source_keys: ['[Nagamochi 2005]']
      published: '2005'
    evidence:
      - E-nagamochi-lower
    artifacts:
      - packing/resources/papers/nagamochi-2005-packing-unit-squares-in-a-rectangle.pdf
      - packing/devtools/check_nagamochi_bounds.py
      - packing/devtools/check_nagamochi_lemma1_counterexample.py
      - docs/project/reviews/review-2026-10-02-nagamochi-lemma1-karakus.md
    next_rung: >-
      A checkable proof of Theorem 1, or of Theorem 2 by another route, restores a rung: for
      the m^2 - 2 family a measure on [0,m]^2 of total at most m^2 - 2 that gives every
      square of side in (1, 1.01] more than one, or a replay of chelokot's Lean
      compensation proof with its axiom receipt; for the general floor, a proof at full
      strength. The read that found the defect is what stands, and the transcribed values
      are still re-derived in the gate.
    notes: >-
      2026-10-02: held V3/C1 from its registration, V3 on the published proof and C1 on the
      read of 2026-08-30. Lemma 1 of the paper, from which Theorem 1 is summed, is false for
      every container with a > 3 and b > 2 (Karakuş 2026 and chelokot 2026; T-085), and the
      paper has no other proof of Theorem 1, so at every N >= 10 this result has no
      checkable proof. It is recorded, V0, and the read that found the defect keeps C1,
      which makes its status incomplete. Nothing is disproved, and no packing beating any of
      its values is known.

      The verified floors that rested on it were re-grounded the same day: the perfect
      squares on the area bound, s(m^2 - 1) = m on Karakuş's Corollary 1.2 (T-084),
      s(m^2 - 2) = m on chelokot's Lean proof, replayed here (T-086), and the general floor
      on Karakuş's weaker Corollary 6.2 (T-083), except at n = 54, 57 and 73, where
      registered T-044 bounds it had masked are stronger. Its values stay in the case
      records as reported bounds. The record of the finding is the review of 2 October
      2026 listed among the artifacts.

      2026-10-03: merged with the replayed certificates recorded in parallel on 2 and 3
      October, which raised 51 of those re-grounded floors, n = 54, 57 and 73 among them:
      wand125's rectangle-density, mixed and linear certificates (T-048, T-069 to T-072,
      T-074, T-075, T-076 at n = 82 and, at n = 101 to 105, T-080), the mixed covers proving s(59), s(60), s(61) = 8 and s(77), s(78) = 9 (T-062, T-063,
      T-066, T-067), and the s(k^2 - 3) = k family (T-064). None of them rests on this
      result.
