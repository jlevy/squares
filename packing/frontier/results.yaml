    established: '2026-09-24'
    claim: >-
      Every packing of eleven unit squares in a square container, six at orientation 0
      and five sharing one orientation modulo pi/2 with half-tangent in
      [91442076901/250000000000, 73154061521/200000000000] (an interval containing
      [t* - 10^-6, t* + 10^-6] for Trump's exact half-tangent t*), has container side at
      least U = 3.877083590022814..., the exact side of Trump's packing, and a packing in
      the family has side exactly U only if it is a quarter-turn image of Trump's pose
      with the squares relabelled within the two classes.

      Reflections leave the family, since they send the tilt theta* to pi/2 - theta*,
      whose half-tangent 0.464 is outside the box, so that Z/4 x S6 x S5 orbit is the
      whole equality set. The statement is T-035's reduction composed with the first
      clause of the BC-240 local theorem at Trump's pose. It says nothing about any other
      tilt, about packings whose orientation classes are not six plus five, or about
      s(11).
