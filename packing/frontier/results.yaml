results:
  - id: T-001
    claim: >-
      Sixteen points make [0, 4426213/1000000]^2 unavoidable for open squares of
      side above one, so s(17) >= 4426213/1000000 = 4.426213.
    scope: {n_values: [17]}
    verification: V4
    confirmation: C4
    significance:
      score: 3
      rationale: >-
        The first verified lower-bound movement in the register since Nagamochi
        2005 at these n, and the repository's strongest first-party theorem to
        date; a two-case improvement in a specialist literature, 0.019 below
        Green's reported but sourceless value.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: apparently-novel
    evidence:
      - E-green17-sixteen-point-lower
      - E-green17-interval-audit
    artifacts:
      - packing/cases/green17/packing.py
      - packing/cases/green17/verify_cover.py
      - packing/cases/green17/interval_audit.py
    controls:
      - packing/tests/test_green17.py
    next_rung: >-
      C5 by assembling the review artifact (statement, hypotheses, proof
      narrative, code map, replays); V5 by a proof-assistant port. The stronger
      side at the exact ceiling is T-003's business.
  - id: T-002
    claim: >-
      s(18) >= 4426213/1000000, by monotonicity from T-001 (a packing of 18
      unit squares contains a packing of 17).
    scope: {n_values: [18]}
    verification: V4
    confirmation: C4
    significance:
      score: 3
      rationale: >-
        The same movement carried to n = 18, above Nagamochi's 4.316625; the
        derivation adds nothing beyond T-001 but the case's frontier field
        moved for the first time since 2005.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: apparently-novel
    composition: >-
      Derived: the minimum over T-001 and the monotonicity step, which is one
      recorded line (any 18-packing contains a 17-packing) carried in the
      evidence limitations and the n-018 case body; both inputs sit at V4/C4,
      so the derived claim keeps the rungs.
    evidence:
      - E-green17-sixteen-point-lower
      - E-green17-interval-audit
    artifacts:
      - packing/cases/green17/packing.py
      - packing/cases/green17/verify_cover.py
      - packing/cases/green17/interval_audit.py
    controls:
      - packing/tests/test_green17.py
    next_rung: >-
      Rises with T-001; a bespoke n = 18 set stronger than the inherited bound
      would be a new result, not a rung change.
  - id: T-003
    claim: >-
      The sixteen-point set's unavoidability ceiling lies in
      [4426213/1000000, 4427/1000): certification at the left endpoint,
      an exact escaping pose at the right, with the top strips'
      a + 2b <= 2*sqrt(2) hypothesis identifying the closing mechanism at
      753/250 + sqrt(2), inside the bracket.
    scope: {n_values: [17, 18]}
    verification: V4
    confirmation: C3
    significance:
      score: 2
      rationale: >-
        Sharpens what T-001's construction can and cannot give; the exact
        equality claim at 753/250 + sqrt(2) remains analysis until the
        Q(sqrt 2) certificate lands.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: apparently-novel
    composition: >-
      Compound: the lower side of the bracket carries T-001's two methods, but
      the refutation side rests on the interval audit alone, so the bracket
      takes the single-method minimum C3. The equality reading is deliberately
      not this claim.
    evidence:
      - E-green17-sixteen-point-lower
      - E-green17-interval-audit
    artifacts:
      - packing/cases/green17/interval_audit.py
      - packing/tests/test_green17.py
    controls:
      - packing/tests/test_green17.py
    next_rung: >-
      think-iye2: the shared certifier generalized to a Q(sqrt 2) scalar
      certifies at the ceiling exactly and an exact escape family above it
      turns the bracket into an equality at C3.
