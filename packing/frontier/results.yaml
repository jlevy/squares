      converged and does not need to. Its objective has stood at 11.000000 through
      twenty-four row rounds and 30240 rows while the loop's least covered mass climbed
      from 0.8490 towards 1, reaching 0.9997 at the round the run was stopped -- so
      violated placements remained and the loop had not exhausted.
