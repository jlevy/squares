      October 2026, over centres [0, 9/2]^2 and u in [0, 7/16] with no symmetry used, in
      28,350 roots and 9,537,343 leaves, none uncertified. Its read log says qx2_zm.py was
      not read; both checkers were written with Claude models, by their sources' own
      statements.

      Here the bundle's fast verify.sh passed on the retained bytes; it recomputes no
      tilted leaf. wand125's verify_tilt9.sh and an audit of its records passed here, 30 of
