  - id: T-101
    kind: upper-bound
    registered: '2026-10-06'
    headline: "Exact certificates of 77 catalogue packings: `s(n) ≤ S'`, `1.2e-16` to `9.8e-15` above each side"
    claim: >-
      For each of 77 counts n from 28 to 300, s(n) <= S', where S' is the side of an exact
      rational packing Evan Daniel published on 5 October 2026: this register's own
      known-best packing at that count, the one the Kingbird catalogue prints, solved to a
      nearby exact point of minimizing the side. The counts are 28, 37, 39, 41, 50, 51, 53
      to 55, 69 to 71, 83, 87, 88, 101, 104, 107 to 109, 122, 124, 125, 127 to 129, 145 to
      151, 153, 170, 171, 173 to 176, 178, 179, 197, 198, 200 to 205, 226, 227, 229 to 235,
      257, 258, 260 to 262, 264 to 267, 290, 291, 293 to 296 and 298 to 300.

      Each S' lies 1.2e-16 to 9.8e-15 above the side the catalogue prints, and each case
      record carries S' rounded up at the fourteen decimals printed as its verified upper
      bound, from 5.82444461667406 at n = 28 to 17.82412338847855 at n = 300.

      Before this the verified upper bound was the integer grid at 74 of the counts, above
      the printed side by up to 0.464 at n = 101, 122, 145, 170, 197, 226, 257, 290 and 291,
      and at n = 69, 83 and 87 the rounded-up sides of exact certificates of a binary64
      parse of the catalogue's pictures (T-088, T-089), 2e-14 to 8.9e-13 above it. At the
      22 counts whose printed side is a decimal alone, the verified upper bound now agrees
      with the report to one unit of its last place.

      At the other 55 the catalogue also gives the side as a closed form, and S' lies
      7.6e-20 to 1.8e-19 above it, the certificate's outward rounding, so the verified
      upper bound trails the report by one unit of the fourteenth decimal. Forty-nine of
      those closed forms are irrational, which no rational certificate reaches; the other
      six, at n = 50, 171, 198, 230, 261 and 293, are rational, and an exact certificate of
      the packing at that side would reach them; at n = 50 a rational one appears to
      exist.

      Every certificate is decided here exactly: converted without rounding, by sqpack's
      exact separating-axis test and by devtools.check_rational_witness_independent, which
      share no code with each other or with the source, so independently re-implemented.
      The source's own checkers, verify_cert.py and verify_cert2.py, run here as retained,
      accept every one as well, reproduced with the producer's code. All four refuse each
      certificate with its tightest pair moved one unit of the side's denominator past its
      separating-axis gap, and each with its box shrunk that unit past its least clearance.

      Matched square for square with the known-best witness, every pose lies within 7.1e-4
      of it, and every square the source does not list as free within 1.2e-7; four of the
      77 were solved from the witness after the source's unpublished local squeeze (n =
      127, 129, 260 and 299). The source's report that 75 of the exact points are KKT local
