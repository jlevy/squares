  - id: T-081
    kind: optimality
    registered: '2026-10-03'
    headline: "`s(k² − 4) = k` for every integer `k` from 5 up; `k = 5…18` are the cases held here"
    claim: >-
      Evan Daniel's theorem s(k^2 - 4) = k for every integer k >= 5, published in his
      repository on 3 October 2026: the lower half at k = 5, 6 and 7 by his s(21), s(32) and
      s(45) certificates, and at every k >= 8 by one family of periodic measures; the upper
      half by the k x k grid.

      This entry's scope is the projection of that theorem onto the cases this record
      holds, n <= 324, which is k = 5 to 18: s(21) = 5, s(32) = 6, s(45) = 7, s(60) = 8,
      s(77) = 9, s(96) = 10, s(117) = 11, s(140) = 12, s(165) = 13, s(192) = 14, s(221) =
      15, s(252) = 16, s(285) = 17 and s(320) = 18. The reported theorem does not end at
      k = 18. New to this record are k = 10 to 18; s(21), s(32) and s(45) are T-052, T-051
      and T-053, with T-054 a second route at k = 7, s(60) = 8 is T-062, and wand125 published s(77) = 9 first, on 1 October
      (T-067).

      For each k >= 8 the measure on [0,k]^2 is a corner module on [0,3]^2 in each corner,
      a profile of period one in a band of width 3 along each wall, and Lebesgue measure on
      [14/5, k - 14/5]^2, of total mass k^2 - 4D with D = 214770225571/200000000000, so
      that 4D exceeds 4. The source states that every closed unit square in [0,k]^2 has mass
      at least one, and reduces that, for every k >= 8, to one finite statement on the
      9 x 9 box, Valid9.

      Its Lean development kernel-checks, the source reports, that the
      tilted part, ValidTilt9, implies the theorem for every k >= 8, with the D4 reduction
      and the axis-parallel face proved; it does not prove ValidTilt9. ValidTilt9 is the
      claim of the source's exact-rational checker qx2_zm.py, the program that decided
      T-064's Valid7, which the source reports accepting all 16,200 root boxes in 115,268
