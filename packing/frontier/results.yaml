      The bound itself: 3.81 converged with margin -- objective 10.8603 against eleven,
      rationalised to 434547/40000 = 10.863675 -- so the next rung is a search question
      rather than a limit of the method. Getting there took two attempts at the same
      side, and the difference between them is worth keeping. The first stopped with its
      row loop still finding violated placements (final least 0.9764) and was refused by
      the exact sweep at directions 55 to 63, least cell 199531/200000. The second ran
