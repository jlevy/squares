  - id: T-085
    kind: correction
    registered: '2026-10-02'
    headline: "Nagamochi 2005, Lemma 1 is false for every container with `a > 3` and `b > 2`"
    claim: >-
      Lemma 1 of Nagamochi 2005 -- every square of side in (1, 1.01] inside [0,a] x [0,b]
      scores more than one against the paper's unavoidable set -- is false for every
      container with a > 3 and b > 2. Karakuş's square K_t at the lower-left corner,
      0 < t <= 1/50, scores 19/20 + t + t^2/2 + t^3/2 < 1 after a concentric shrink, and
      chelokot's square of side 10001/10000 in [0,4]^2 scores exactly
      25009470849041/25584000000000 < 1. The gap is in Section 5.5, Case 6, where Lemma 6
      is applied to a contact configuration its hypothesis does not cover.

      What holds in its place is Karakuş's strip measure, of total ab - (a + 1 - ceil a),
      which gives every such square more than one for a >= 2 and b >= 3 (his Proposition
      5.1), and the rectangle bound it yields (T-083, T-084). Nagamochi's Theorem 1 at full
      strength, and so T-007, is unproved and not disproved.

      Every printed quantity of both counterexamples was recomputed here in exact rational
      arithmetic. Hakan Karakuş, [arXiv:2609.37410](https://arxiv.org/abs/2609.37410), 29
      September 2026; chelokot,
      [square-packing-archive](https://github.com/chelokot/square-packing-archive), 4
      September 2026, the earlier public record, which Karakuş's paper does not cite.
      wand125 first reported both, and the defect, to this project in jlevy/squares#295,
      2 October 2026.
