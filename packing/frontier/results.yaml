      - packing/src/sqpack/local_rigidity/instrument.py
      - packing/devtools/assess_n5_rigidity.py
    controls:
      - packing/tests/test_n5_local_rigidity.py
      - packing/tests/test_n5_rigidity.py
    review_artifact: docs/project/reviews/review-2026-09-03-bc153-h060-proof-independent-review.md
    next_rung: >-
      V4 by mechanising the closing steps rather than only the quantities they
      consume, or V5 by a proof-assistant port. C5 was reached on 2026-09-03 by
      installing BC-153's review as a mapped review document; the round record
      carries it as an amendment as well. Reaching the printed BCR page, or citing
      the Basu-Pollack-Roy plus Puiseux derivation the review writes out, would
      close the one cited hypothesis this rests on.
    notes: >-
      Not established and not claimed: any numerical isolation radius; rigidity
      when the container side is a variable, which X-007 measured to be false;
