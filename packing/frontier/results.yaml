  - id: T-012
    claim: >-
      Goebel's n = 5 optimal packing is not infinitesimally rigid but is
      second-order rigid at fixed side: the cone of infinitesimal motions is
      exactly the middle square's rotation about its own centre, and that one
      direction is refused at second order by a verified non-negative
      self-stress, all exactly over Q(sqrt 2).
    scope: {n_values: [5]}
    verification: V4
    confirmation: C3
    significance:
      score: 3
      rationale: >-
        A structural theorem at the smallest nontrivial case, proved exactly
        where the catalogue asserts 'Rigid.' with no definition or argument
        and the corpus contains none of the machinery for deciding it.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: apparently-novel
    evidence:
      - E-n005-second-order-rigidity
    artifacts:
      - packing/devtools/assess_n5_rigidity.py
      - packing/campaign/series/series-000-smoke-and-calibration/results/bc-049-n5-rigidity-certificates.json
      - packing/campaign/explorations/X-007-the-n5-optimum-flexes-once-and-that-once-is-shut.md
    controls:
      - packing/tests/test_n5_rigidity.py
    next_rung: >-
      Local rigidity needs the curve-selection argument written out in X-007
      to become a computation; V5 by a proof-assistant port.
  - id: T-013
    claim: >-
      Goebel's n = 40 packing is infinitesimally flexible -- seven verified
      independent first-order flexes turn the sixteen-square tilted block --
      and every retained flex is refused at second order by a verified
      non-negative self-stress, exactly over Q(sqrt 2), so no first-order
      argument can establish rigidity here.
    scope: {n_values: [40]}
    verification: V4
    confirmation: C3
    significance:
      score: 3
      rationale: >-
        The first separation of infinitesimal from finite rigidity in this
        literature's cases: the sources assert rigidity without the
        distinction, and this refines rather than contradicts them.
      scored: '2026-08-31'
      by: session-061 review (repository)
    novelty: apparently-novel
    evidence:
