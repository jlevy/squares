      E-n011-h236-rung0-reduction, is V3/C3. The first clause, on
      E-n011-trump-local-theorem-first-clause, is an audited proof whose steps are prose
      and whose radius computation alone is machine-checked, so method proof-audited with
      a proof block supports V3 and nothing higher, which fixes the composed theorem at
      V3. The checker derives C3 from the reduction's entry; this note is why the declared
      confirmation is C2.

      The composing step is the one the closed-tree review derived again: undoing the
      quarter turn carries a Trump-degenerate leaf's packing at side s' <= U to a
      translate by (0, U - s') inside [0,U]^2, a sup-norm isometry on centre
      differences, so the first clause forces Trump's labelled pose and the four wall
      contacts force s' = U. The angle window, 2.0e-6 radians, is below rho_row.

      Confirmation is C2 by the C table: the clause's replay command, the source-distinct
      BC-241 checker, passes at this head, and a proof-audited entry does not derive
      above C2.

