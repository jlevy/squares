      above ceil(sqrt(n)) * B, because a wider container holds ceil(sqrt(n))^2 pairwise
      disjoint axis-parallel B-squares whose masses Condition 5 forces past n; for n = 11 that is
      4B = 3.9908, leaving 0.1808 of runway above the retained 381/100. The wall at 3.82
