  - id: T-112
    kind: uniqueness
    registered: '2026-10-06'
    headline: "Trump's packing is the only optimal packing of eleven squares, up to symmetry"
    established: '2026-10-06'
    claim: >-
      Every packing of eleven unit squares in a square of side T =
      3.8770835900228141773…, the least side T-060 proves possible, is Walter Trump's 1979 packing
      after one of the eight symmetries of the container and a relabelling of the squares.
      Independent rotations and boundary contact are allowed. A quarter-turn
      reparametrization of one square is the same physical square and does not count as
      another packing. No symmetry of the container maps Trump's packing to itself, so
      there are exactly eight optimal packings as unlabelled configurations, the images
      of one another.

      This is a direct corollary of T-060 and adds no computation. T-060's proof embeds
      any packing of side S <= T concentrically in the rational cap U > T, where its
      2,180 exclusions, the D4 reduction to case 438, the closed capture partition and
      pose inclusion all apply, and maps it rigidly into the fixed side-T frame, where
      the local isolation lemma forces the exact construction. For S < T the
      construction's span T is a contradiction, which is T-060. For S = T nothing is
      contradicted: the packing is the construction after the alignment, a D4 element
      composed with the case-438 quarter turn, which is this result.

      It is T-036's equality clause without T-036's restriction to six squares at angle
      0 and five near Trump's tilt, and with reflections, which leave that family.
    scope: {n_values: [11]}
    verification: V3
    confirmation: C2
    significance:
      score: 3
      rationale: >-
        A substantive case result: it completes the classification at eleven squares,
        the optimum being a single rigid packing up to symmetry, with no sliding family
        and no second contact type at T, in the case T-060 settled. It moves no bound and
        adds no method, since it is T-060's argument read at equality, which is what an
        S4 would need; it is one step above T-036's restricted equality case.
      scored: '2026-10-06'
      by: docs/project/reviews/review-2026-10-06-n11-uniqueness-adversarial.md (U-5; the registration proposed S4)
    novelty: apparently-novel
    builds_on:
      credit: [Queuingtheorydotcom]
      source_keys: ['[Queuingtheorydotcom n11 optimality 2026]']
    evidence: [E-n011-optimum-uniqueness]
    composition: >-
      One entry, E-n011-optimum-uniqueness, proof-audited, which cites the completed
      exact executions of E-n011-global-optimality-independent unchanged and adds one
      prose step, that every premise of T-060's endpoint is stated for side S <= T and
      at S = T yields the construction rather than a contradiction. Proof-audited with a
      proof block supports V3. The step is prose and not mechanised, so the declared
      confirmation is C2, as for T-036's composing step, though every quantity it
      consumes is T-060's and re-implemented sharing named components.

      T-060's evidence, E-n011-global-optimality-independent, is a premise of the entry and
      is not cited here beside it: it claims the exact value, which would give this
      result a bound's standing that it does not have.
