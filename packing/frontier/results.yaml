      the modulus forces the norm to be at least 2 kappa/K; that every packing in the ball
      selects one of the 128 branches, which needs the inactive-feature gap cap, itself a
      single-source computation; and the composing step through the quarter turn.

      A mutation or a perturbed radius is refused by the replay, but a wrong prose step
