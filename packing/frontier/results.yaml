    next_rung: >-
      A second machine method decides it, the interval-certified decision, which is
      independent in method
      and, deciding coverage on the doubled net, never invokes the D4 reflection and so
      does not need Condition 1 at all. One adversarial AI review is retained, PR 78's, ported
