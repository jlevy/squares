$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:CoveringValues/v1
title: CoveringValues
description: >-
  Every restricted optimum of the covering program that the record reports, one row
  per (n, side, site set). A row is a measurement of the restricted program on one
  site set and never a claim about the covering value tau*(L) itself: adding sites can
  only lower a restricted optimum, and a run that stopped short of convergence is an
  upper bound on nothing but its own site set. The register exists so that whether a
  report converged is a field the reach renderer reads rather than a phrase it carried
  by hand, which is how it came to count stop reasons its sources never recorded
  (D-443). Every path is repository-relative.
type: object
additionalProperties: false
required: [last_reviewed, values]
properties:
  last_reviewed: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  values:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/value'}
$defs:
  value:
    type: object
    additionalProperties: false
    required:
      - n
      - side
      - side_decimal
      - objective
      - site_set
      - sites
      - rows
      - rounds
      - converged
      - stop_reason
      - least_covered_mass
      - frozen_artifact
      - recorded_in
      - notes
    properties:
      n:
        type: integer
        minimum: 1
        description: >-
          The size the run was declared for. A frozen certificate's mass may certify
          other sizes as well (least_size_certified); this is the run's own n.
      side:
        type: string
        pattern: '^[0-9]+/[0-9]+$'
        description: The container side L, as the exact rational the run used.
      side_decimal:
        type: string
        pattern: '^[0-9]+\.[0-9]+$'
        description: The same side as the decimal the record quotes it by; equal to side exactly.
      objective:
        type: string
        pattern: '^[0-9]+\.[0-9]+$'
        description: The restricted optimum as the record reports it, verbatim.
      site_set:
        type: string
        minLength: 1
        description: >-
          Which site set the optimum is over: grid, certificate-seeded, the label the
          record gives it (an orbit count, say), or unrecorded where the record names
          none. Distinct within one (n, side).
      sites: {type: [integer, 'null'], minimum: 1}
      rows: {type: [integer, 'null'], minimum: 1}
      rounds: {type: [integer, 'null'], minimum: 1}
      converged:
        type: boolean
        description: >-
          True only where the record says the row loop ran to convergence. A run stopped
          for any other reason, or whose stopping is not recorded at all, is false and
          stands as an upper bound only.
      stop_reason:
        type: string
        minLength: 1
        description: Why the run stopped, in the record's own terms, or that nothing records it.
      least_covered_mass:
        type: [string, 'null']
        pattern: '^[0-9]+(\.[0-9]+)?(/[0-9]+)?$'
        description: The least covered mass the row loop reported at the stop, where the record gives one.
      frozen_artifact:
        type: [string, 'null']
        pattern: '^packing/cases/.+\.json$'
        description: >-
          The certificate frozen at this side, if one was, whose mass the renderer
          recomputes from its atoms; null where nothing was frozen.
      recorded_in:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
        description: Repository-relative paths of every document that states the value.
      notes:
        type: string
        minLength: 1
        description: What the record does not hold for this row, and anything a reader of the objective needs beside it.
