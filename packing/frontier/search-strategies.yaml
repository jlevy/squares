softschema:
  contract: packing.squares:StrategyCatalogue/v1
  schema: strategy-catalogue.schema.yaml
  status: enforced
kind: search
description: 'Strategies used to FIND packings, i.e. to establish upper bounds on s(n). Entries 1 to
  20 are ordered roughly from human to machine; 21 and 22, then 23 to 28, were appended in 2026-09
  rather than inserted, because reports cite these entries by id and renumbering would silently move
  those citations. Entries 23 to 28 are the physics- and simulation-mechanism family, catalogued
  after the 2026-09-09 survey; 23 is deliberately separate from 11 because the two are different
  objects. Every upper bound in this subject is a construction: no non-constructive upper bound has
  ever been obtained.'
count: 28
strategies:
- id: 1
  name: Axis-aligned grid
  family: constructive
  mechanism: The `⌈√n⌉` trivial packing
  outcome: produced_records
  note: Yes — optimal for perfect squares and the general `m²−1`, `m²−2` families;
    `m²−3` is proved only for `m = 3, 4, 5, 6, 7`
  refs: []
- id: 2
  name: Hand geometric insight
  family: constructive
  mechanism: Human construction, often on paper
  outcome: produced_records
  note: Yes — Trump `n=11`, Göbel, Hämäläinen, Bidwell `n=17`
  refs: []
- id: 3
  name: 45° tilted families
  family: constructive
  mechanism: A block of squares rotated a half-turn diagonal
  outcome: produced_records
  note: Yes — `n=5`, `n=10`
  refs: []
- id: 4
  name: Diagonal strips of width `k`
  family: constructive
  mechanism: A tilted band crossing the container, corners filled
  outcome: produced_records
  note: Yes — Stenlund `n=66` (width-3 strip)
  refs: []
- id: 5
  name: Strip + “L” augmentation
  family: constructive
  mechanism: Extend a strip packing with an L-shaped border block
  outcome: produced_records
  note: Yes — best known `n=83` from the `n=66` strip
  refs: []
- id: 6
  name: Rational-slope tilts
  family: constructive
  mechanism: Tilts at `arctan(p/q)` making contacts commensurate
  outcome: produced_records
  note: Yes — e.g. `arctan(8/15)`, `arcsin((√7−1)/4)` for `n=18`
  refs: []
- id: 7
  name: Composition / self-similarity
  family: constructive
  mechanism: Combine copies of a smaller good packing
  outcome: produced_records
  note: Yes — Ellsworth Dec 2025 joined two `s(50)` copies for `s = 13 + 4/7`
  refs: []
- id: 8
  name: Parametric families for structured `n`
  family: constructive
  mechanism: Formulas for `n = m²−k`, `n = m²−m`, `n(n−1)`
  outcome: produced_records
  note: Yes — Arslanov et al. on `n(n−1)`
  refs: []
- id: 9
  name: Asymptotic border constructions
  family: constructive
  mechanism: Tilt squares near the boundary to absorb fractional waste
  outcome: produced_records
  note: Yes — Erdős–Graham and successors, asymptotic only
  refs: []
- id: 10
  name: Simulated annealing
  family: stochastic_search
  mechanism: Stochastic perturbation with a cooling schedule
  outcome: produced_records
  note: >-
    Yes — the current workhorse. Schadt's program; Ellsworth's modified version. The
    qualification the record-holders supply themselves: the `n = 55` provenance comment
    says that without special modifications the annealer almost always gets stuck just
    above the trivial size, and that record was found from a cherry-picked state
    produced by a reimplementation of entry 11 rather than from randomness. Nothing in
    the surveyed literature makes the cooling schedule the interesting variable —
    Johnson et al.'s Observations 4 and 5 found no schedule worth having, while their
    Observation 6 and Part II's 91-versus-89-colour result both moved on the
    neighbourhood alone.
  refs:
  - Kingbird run statistics
  - Schadt n29 2025
  - Johnson et al. Part I
  - Johnson et al. Part II
  - Blair et al. 2012
  - Xu–Xiao–Amos 2008
- id: 11
  name: Billiard / inflation
  family: stochastic_search
  mechanism: Grow squares to a jammed state, perturb, repeat
  outcome: produced_records
  note: >-
    Yes — Gensane–Ryckelynck (`n = 29, 37`; alternative `n = 18`), and the `n = 29`
    record stood from 2004 to December 2025. It is not an annealer: the acceptance rule
    is strictly greedy and there is no temperature. The "perturb" in the mechanism above
    is the load-bearing step and is specific — a *simultaneous* displacement of every
    object at once, which is what walks the search along a path of solid configurations
    to a genuine local optimum. Gensane's open companion paper on spheres in a cube
    states all four procedures verbatim and reports that plain billiards suffices in two
    dimensions while perturbation is indispensable in three; a freely rotating square in
    the plane also has three degrees of freedom. `sqsearch` has the single-object moves
    and not this one.
  refs:
  - Gensane 2004
  - Gensane–Ryckelynck 2005
  - Friedman DS7
- id: 12
  name: Basin hopping / multistart
  family: stochastic_search
  mechanism: Many random starts into local optimisation
  outcome: used_in_field
  note: >-
    Standard in packing generally, and better evidenced on circles than the tidy story
    suggests. Addis, Locatelli and Schoen built monotonic basin hopping on a conjectured
    funnelling landscape and improved 32 instances at `n <= 130`; Grosso et al. then
    counted why plain multistart is the wrong shape, finding roughly 16,000 distinct
    local minimisers by `n = 40` out of 50,000 random-start local searches, and swept
    the perturbation magnitude to a sharp optimum at 0.8. What no source establishes is
    that it beats annealing: Ye, Huang and Lü's Table 3 has population basin hopping
    losing every non-tie on the 30 contest instances while the annealer tied 7 and won
    3.
  refs:
  - Addis–Locatelli–Schoen 2008
  - Grosso et al. 2010
  - Ye–Huang–Lü 2013
- id: 13
  name: Nonlinear programming
  family: stochastic_search
  mechanism: Continuous variables with pairwise non-overlap constraints
  outcome: used_in_field
  note: Standard; scales poorly with `n`
  refs: []
- id: 14
  name: SAT / constraint programming
  family: stochastic_search
  mechanism: Reduce feasibility at a fixed side to a Boolean or CP instance
  outcome: used_elsewhere
  note: Used for 2D orthogonal packing; awkward under free rotation
  refs: []
- id: 15
  name: Branch and bound over contact classes
  family: stochastic_search
  mechanism: Enumerate combinatorial structures, optimise within each
  outcome: used_elsewhere
  note: Used in exact cutting-and-packing
  refs: []
- id: 16
  name: Genetic / evolutionary search
  family: stochastic_search
  mechanism: Population methods over configurations
  outcome: used_elsewhere
  note: >-
    Used in the wider packing literature. The nearest first-party application to this
    problem is a learned policy rather than a population: Sam Burns's Squarl (August
    2026) trains a graph-transformer policy by REINFORCE over contact-group actions on
    17 squares with a CUDA wall-pressure polisher, reached a near-record basin at
    4.677648 (eleven axis-aligned squares and six at one tilt of 39.6319 degrees, a
    topology the author reports as distinct from Bidwell's) from four separate
    searches, and did not beat Bidwell's 4.675530 in its final nine-hour run; the
    arrangement is retained, its contact graph not reconstructed here.
  refs:
  - Burns n17 addendum 2026-09-07
  - Burns–Massaccesi n17
  - Squarl n17 2026
- id: 17
  name: Exact algebraic refinement
  family: exact_refinement
  mechanism: Fix the contact graph, solve the polynomial system
  outcome: used_in_field
  note: >-
    Used in the field to derive algebraic records and now exercised in this repository's
    exact lift and promotion cases. A reported exact side still does not supply an exact
    pose or a solvable contact system.
  refs: []
- id: 18
  name: Rigidity-guided enumeration
  family: exact_refinement
  mechanism: Enumerate rigid contact graphs, then solve each
  outcome: used_in_field
  note: Standard in sphere/disk packing; the natural analogue here
  refs: []
- id: 19
  name: Interval-verified local optima
  family: exact_refinement
  mechanism: Certify a local optimum with interval arithmetic
  outcome: used_elsewhere
  note: Used for circle packing; not seen applied to `s(11)`
  refs: []
- id: 20
  name: Catalogue-driven record chasing
  family: workflow
  mechanism: Human-computer loop against a public record table
  outcome: produced_records
  note: Yes — how the tables actually advance
  refs: []
- id: 21
  name: Replica exchange over a pressure ladder
  family: stochastic_search
  mechanism: Many parallel chains at different inflation pressures, swapping configurations
    between neighbouring levels
  outcome: used_elsewhere
  note: >-
    Not here, but it is the annealing-family method currently setting packing records on
    the sibling problem, which is why it is catalogued separately from entry 10. Hard
    particles are athermal, so raising the temperature exchanges nothing; the parameter
    worth exchanging is the pressure (Odriozola, J. Chem. Phys. 131:144107, 2009).
    Basurto, Gurin, Specht and Odriozola (J. Chem. Phys. 161(4):044110, 2024) ran hard
    disks in a circular cavity at N = 300 to 720 and identified 108 novel maximal
    packings, some beating the existing configuration by more than 0.001 in packing
    fraction, with Packomania's maintainer as a coauthor; a 2026 out-of-equilibrium
    successor (Comput. Phys. Commun. 320:109990) reports new records to N <= 1000. Never
    pointed at squares in a square. It is a shorter step from the current record engine
    than it looks: Ellsworth's 65,536 GPU threads are already independent replicas
    without the exchange. Both 2024 and 2026 papers are unretrieved, so the replica
    count, the ladder spacing and the cost per record are not in hand.
  refs:
  - Odriozola 2009
  - Annealing methods audit 2026-09-08
  - Kingbird run statistics
- id: 22
  name: Thresholding search / threshold accepting
  family: stochastic_search
  mechanism: Accept any move no worse than a decaying threshold; no temperature and no
    Metropolis exponential
  outcome: used_elsewhere
  note: >-
    Not here. On equal circles and spheres, Lai, Hao, Xiao and Glover's
    perturbation-based thresholding search improved 156 best-known circle results for
    2 <= n <= 400 and 66 best-known sphere results. Its measurement is the reason this
    entry is catalogued at all: with the acceptance rule held fixed, changing only the
    perturbation operator moved the success rate over 100 runs from 0% to 100% on one
    sphere instance and reversed that on one circle instance, which is the sharpest
    published evidence that the acceptance rule is not what separates these methods.
    TAMSASS-PECS had earlier reported forty new equal-circles-in-a-square results on the
    same acceptance rule. Never applied to squares in a square.
  refs:
  - Lai et al. 2023
  - Annealing methods audit 2026-09-08
- id: 23
  name: Lubachevsky-Stillinger inflation and event-driven molecular dynamics
  family: stochastic_search
  mechanism: Grow particles among elastic collisions, event by event, until the collision
    rate diverges and the system jams
  outcome: used_elsewhere
  note: >-
    Not here, and the 2026-09-09 simulation survey concludes it cannot be. It is
    catalogued separately from entry 11 because conflating the two is the error that
    makes it look available: Gensane and Ryckelynck's inflation FACTOR for two rotated
    squares is closed form (their Proposition 1), while the COLLISION TIME under rotation
    is not. Klement, Lee, Anderson and Engel (arXiv:2104.06829) state that event-driven
    dynamics for anisotropic particles requires solving collision equations involving
    trigonometric functions, solvable "only ... numerically by iteration with
    approximations and ... necessarily slow"; the only non-spherical generalisation
    (Donev, Torquato and Stillinger 2005) restricts itself to shapes with continuously
    differentiable overlap potentials; and Jiao, Stillinger and Torquato could not run
    the superdisk family into the square limit for numerical reasons. Torquato and
    Stillinger's review adds the decisive two-dimensional fact: the protocol "typically
    yields a highly crystalline collectively jammed packing in two dimensions", which for
    congruent squares is the trivial grid. Published growth rates run 1e-2 down to 1e-9
    with jamming declared at reduced pressure above 1e12. The one square case that works
    is the non-rotating one, which is the trivial packing.
  refs:
  - Lubachevsky 1991
  - Donev-Torquato-Stillinger 2005
  - Skoge et al. 2006
  - Torquato-Stillinger 2010
  - Klement et al. 2021
  - Simulation methods audit 2026-09-09
- id: 24
  name: Adaptive shrinking cell
  family: stochastic_search
  mechanism: Make the container a degree of freedom, so a trial move can strain or shrink
    it, with overlap forbidden by an exact separating-axis test and the shrink rejected
    when it collides
  outcome: used_elsewhere
  note: >-
    Not here, and never run on congruent squares: Torquato and Jiao exclude the cube as
    "the only Platonic solid that tiles space", and Maher, Stillinger and Torquato
    simulate rhombi only at intermediate angles, recording maximal density 1 for the
    whole family. That degeneracy is the periodic formulation's, not the mechanism's. The
    mechanism is the one Torquato and Jiao name as load-bearing in their own words: the
    cell strain "corresponds to non-trivial collective motions of the particle centroids
    ... It is this collective motion that enables the algorithm to explore the
    configuration space more efficiently", which is exactly the defect exp-134 measured
    here seventeen years later. Its two-dimensional protocol is fully published:
    acceptance-ratio target 50 percent, strictly downhill strain, compression schedules
    of 1000, 100 and 10 trial moves per particle, termination when density gains fall
    below 1e-10 over 100 strain steps, and a contact pass to 6e-10 of the characteristic
    length for shapes with flat edges, excluding rattlers. Its linear-programming form
    beat Lubachevsky-Stillinger at matched density from 1.5 hours to 10 minutes in three
    dimensions and 193.5 hours to 8.3 hours in six, reaching the densest known in
    dimensions two to six where the inflation runs reached it only in two and three. One
    bounded-container adaptation exists, for spheres in a cylinder, and it adds the wall
    as one more linear inequality.
  refs:
  - Torquato-Jiao 2009
  - Torquato-Jiao 2010
  - Atkinson-Jiao-Torquato 2012
  - Maher-Stillinger-Torquato 2021
  - Fu et al. 2016
  - Simulation methods audit 2026-09-09
- id: 25
  name: Constraint projection (divide and concur, relaxed-reflect-reflect)
  family: stochastic_search
  mechanism: Resolve overlap by projecting bodies apart and iterating, with reflections
    rather than plain alternation so the iteration does not stall at a
    consistent-but-infeasible point
  outcome: used_elsewhere
  note: >-
    Not here, and it is the 2026-09-09 survey's first-ranked candidate. It is the only
    mechanism in either survey with a published cold, whole-benchmark result on the
    sibling problem: Gravel and Elser ran divide and concur on n equal disks in a unit
    square for every n from 2 to 200, up to 400 random starts each, using "No information
    about the known packings ... apart from their densities", and reached the best known
    within 1e-9 on 143 of 197 values while BEATING it on 38, the smallest at n = 91. The
    same framework with the cell parameters folded into the configuration space produced
    new densest packings of tetrahedra and of four-dimensional simplices, so it also
    works on non-spherical bodies. Kallus's 2011 thesis specifies the convex-polytope
    non-overlap projection the square case needs; at d = 2 with eight vertices across a
    pair it is trivially cheap. Published settings: the RRR map with beta = 0.5 for
    nonconvex constraints, metric update rate 1e-3, success at a normalised error below
    1e-4, and an m-monotone restart rule that also measures per-instance difficulty. The
    two halves, a bounded round container on the disk side and unbounded periodic
    polytopes on the shape side, have never been joined; squares in a square sits between
    them. The graphics form of the same idea, position-based dynamics, has never been
    used as a packing optimiser at all: the arXiv query returns zero.
  refs:
  - Gravel-Elser 2008
  - Kallus-Elser-Gravel 2010
  - Kallus 2011
  - Elser 2023
  - Lal 2025
  - Simulation methods audit 2026-09-09
- id: 26
  name: Non-smooth contact dynamics
  family: stochastic_search
  mechanism: Perfectly rigid bodies under the Signorini graph and the Coulomb cone,
    stepped implicitly, solved by Gauss-Seidel sweeps over the contact list
  outcome: used_elsewhere
  note: >-
    Not here, and the 2026-09-09 survey judges it a dead end for search while keeping one
    job for it. Three reasons it cannot be the searcher. It has never been used as one:
    an OpenAlex sweep for contact dynamics with densest packing and optimisation returns
    seven records, none of them a packing-optimisation paper, and the nearest variant,
    which couples a periodic cell to an external pressure, produces random close packings
    whose density is INSENSITIVE to every dial it exposes. Its non-penetration is exact
    in the contact law and approximate in the discrete gap, which the container's
    measured 3.7e-33 slack ceiling here disqualifies. And its force field is indeterminate
    at exactly edge-to-edge polygon contact, which Dubois, Acary and Jean name explicitly
    and which is every interior contact at the trivial grid. The job it keeps is the
    necessary-condition test: load a retained best-known packing, run the law with no
    target, and check the four fully immobile non-grid records hold still while the other
    thirty move only the squares the translation-escape screen already lists. The only
    rigid complementarity solver with 2D convex polygons as a first-class primitive is
    LMGC90, whose public repository declares no licence.
  refs:
  - Unger-Kertesz 2003
  - Dubois-Acary-Jean 2018
  - Shaebani-Unger-Kertesz 2008
  - Olsen-Kamrin 2018
  - Simulation methods audit 2026-09-09
- id: 27
  name: Continuation on a smoothed overlap penalty
  family: stochastic_search
  mechanism: Replace the non-smooth overlap by a smooth surrogate, minimise it with a
    gradient or quasi-Newton method, then sharpen the surrogate and re-minimise from the
    previous solution
  outcome: used_elsewhere
  note: >-
    Not here. Nurmela and Ostergard's equal-circles-in-a-square engine is the cleanest
    instance and every part of it is published: energy (lambda / d^2)^m, a sin
    reparameterisation that removes the container constraint rather than penalising it,
    steepest descent with a Goldstein-Armijo line search then a modified Newton method,
    m started between 10 and 100 and DOUBLED per level to about 1e6 (1e50 in some cases),
    lambda reset each level to the square of the shortest distance, and at least 50
    random starts per n. It produced 21 new best-known packings over 21 <= n <= 50, and
    the 1999 exhaustive proof later confirmed its answers were optimal at every n from 21
    to 27. More and Wu give the alternative schedule shape, a LINEAR ramp of a Gaussian
    smoothing radius to zero over 10 to 20 levels, and the measured comparison:
    continuation succeeded on every problem where multistart failed at the two largest
    sizes. The obstruction for squares is that every record-quality disk potential is a
    function of one scalar per pair and a rotating square has no such scalar. The
    alternative to smoothing is to remove the maximum EXACTLY, by making each pair's
    separating-line angle a continuous variable, which is exact for convex pieces and
    admits free rotation (Peralta, Andretta and Oliveira 2018) - the continuous version
    of what Squarl and exp-006 both do discretely.
  refs:
  - Nurmela-Ostergard 1997
  - More-Wu 1995
  - Birgin-Sobral 2008
  - Peralta-Andretta-Oliveira 2018
  - Simulation methods audit 2026-09-09
- id: 28
  name: Differentiable simulation as an optimiser
  family: stochastic_search
  mechanism: Differentiate through a physics or geometry simulator and descend on the
    resulting gradient
  outcome: used_elsewhere
  note: >-
    Not here, and the 2026-09-09 survey judges it a dead end on measurements rather than
    on argument. Suh, Simchowitz, Zhang, Tedrake and Zhang prove the first-order estimator
    is biased wherever the dynamics are discontinuous and, worse, biased with LOW
    empirical variance, so the usual diagnostic does not detect it; their
    geometric-discontinuity example is a ball against a rectangular wall. Zhong, Han and
    Brikis measured two independent position-based implementations returning a position
    gradient of 0.0000 and -0.0020 where the analytic answer is -1.0000, because the
    projection that resolves interpenetration destroys the dependence on the initial
    condition, which rules out the obvious hybrid with entry 25. The one differentiable
    PACKING system found (Gupta and Raman 2026) computes overlap on axis-aligned bounding
    boxes: two unit squares tilted 45 degrees have bounding boxes of side sqrt(2), so the
    surrogate would hold them about 41 percent too far apart, and every interesting record
    here uses tilted squares. This repository has its own version of the same finding:
    exp-006 measured a kink at the n = 11 optimum where Powell and Nelder-Mead both lost
    to plain descent.
  refs:
  - Suh et al. 2022
  - Zhong-Han-Brikis 2022
  - Metz et al. 2021
  - Gupta-Raman 2026
  - Simulation methods audit 2026-09-09
families:
  constructive: Human or closed-form constructions; every record before 2000 came from here.
  stochastic_search: Numerical search over the continuous configuration space; the current record
    engine.
  exact_refinement: Turning a numerical packing into an exact algebraic one, once the contact graph
    is fixed.
  workflow: The human-computer loop around a public record table.
