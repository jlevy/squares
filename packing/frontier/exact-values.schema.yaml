$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ExactValues/v1
title: Exact side values register
description: >-
  Every exact fact the frontier records hold about the side of each best known packing,
  one entry per n, with the exact checks this repository ran on each. Generated by
  `python -m devtools.build_exact_values` from the frontier records, the retained Kingbird
  catalogue, Evan Daniel's KKT batch and retained upper-bound certificate/replay packets;
  the paper on exact side values renders from it and from nothing else. An open record
  without a reported algebraic identity may supply a rational bound through exact
  source/count/certificate/replay custody. Rehwaldt projections require equality with
  both current decimals; Daniel's new arrangements retain the native fraction and its
  independently checked least upward 16-place verified display. Source-only polynomial
  notes retain their V0/C0 geometry status and never become current bounds.

  The records are the system of record and this file is a view of them: `--check`
  rebuilds it and compares bytes, so an entry cannot drift from its record. Every check
  here is exact -- a certificate of irreducibility over Q, a rational interval holding
  exactly one real root, and that root's agreement with the recorded decimal -- and a
  polynomial that fails one fails the build rather than reaching this file. The
  register.sources paths are packing-relative; source occurrences and acquisition or
  manifest paths inside reported_source are repository-relative.
type: object
additionalProperties: false
required: [generated_by, range, sources, totals, entries]
properties:
  generated_by: {type: string, minLength: 1}
  range:
    type: object
    additionalProperties: false
    required: [first, last]
    properties:
      first: {type: integer, minimum: 1}
      last: {type: integer, minimum: 1}
  sources:
    type: object
    additionalProperties: false
    required: [records, catalogue, kkt]
    properties:
      records: {type: string, minLength: 1}
      catalogue: {type: string, minLength: 1}
      kkt:
        type: object
        additionalProperties: false
        description: >-
          Evan Daniel's exact-contact batch: an exact KKT point per count, solved at 80
          digits and printed to `digits` significant digits, cited by its bibliography key.
        required: [path, key, digits]
        properties:
          path: {type: string, minLength: 1}
          key: {type: string, pattern: '^\[.+\]$'}
          digits: {type: integer, minimum: 1}
  totals:
    type: object
    additionalProperties: false
    description: >-
      Counts over the entries, recomputed on every build. The six states partition the
      range; `irreducible-certified` and `root-isolated` count the entries whose
      polynomial carries each certificate, which is every entry with a polynomial.
    required:
      - integer
      - rational
      - closed-form
      - minimal-polynomial
      - degree-only
      - numeric-only
      - proved
      - irreducible-certified
      - root-isolated
    properties:
      integer: {type: integer, minimum: 0}
      rational: {type: integer, minimum: 0}
      closed-form: {type: integer, minimum: 0}
      minimal-polynomial: {type: integer, minimum: 0}
      degree-only: {type: integer, minimum: 0}
      numeric-only: {type: integer, minimum: 0}
      proved: {type: integer, minimum: 0}
      irreducible-certified: {type: integer, minimum: 0}
      root-isolated: {type: integer, minimum: 0}
  entries:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/entry'}
  historical_entries:
    type: array
    items: {$ref: '#/$defs/historical_entry'}
$defs:
  source_certificate:
    type: object
    additionalProperties: false
    required:
    - result
    - source_key
    - revision
    - facts
    - original_certificate
    - receipt
    - verification
    - confirmation
    - algebraic_identity
    - geometry_replay
    - adoption
    - global_optimality
    properties:
      result:
        enum:
        - T-125
        - T-127
        - T-128
        - T-129
        - T-130
        - T-131
      source_key:
        type: string
        minLength: 1
      revision:
        type: string
        pattern: ^[0-9a-f]{40}$
      facts:
        type: string
        pattern: ^packing/
      original_certificate:
        type: string
        minLength: 1
      receipt:
        oneOf:
        - type: 'null'
        - type: string
          pattern: ^packing/
      verification:
        enum:
        - V0
        - V3
      confirmation:
        enum:
        - C0
        - C3
      algebraic_identity:
        const: independently-checked
      geometry_replay:
        enum:
        - native-replay-retained
        - not-replayed
      adoption:
        enum:
        - pending
        - not-selected
      global_optimality:
        const: not-established
    allOf:
    - if:
        properties:
          result:
            enum:
            - T-125
            - T-127
      then:
        properties:
          verification:
            const: V3
          confirmation:
            const: C3
          geometry_replay:
            const: native-replay-retained
          receipt:
            type: string
            minLength: 1
          adoption:
            const: not-selected
    - if:
        properties:
          result:
            enum:
            - T-128
            - T-130
            - T-131
      then:
        properties:
          verification:
            const: V0
          confirmation:
            const: C0
          geometry_replay:
            const: native-replay-retained
          receipt:
            type: string
            minLength: 1
    - if:
        properties:
          result:
            enum:
            - T-129
      then:
        properties:
          verification:
            const: V0
          confirmation:
            const: C0
          geometry_replay:
            const: not-replayed
          receipt:
            type: 'null'
          adoption:
            const: not-selected
  historical_entry:
    type: object
    additionalProperties: false
    required:
    - n
    - kind
    - algebraic_source
    - current_side
    - side
    - degree
    - polynomial
    - checks
    - sources
    - source_statuses
    - attribution
    - bead
    - text
    properties:
      n:
        type: integer
        minimum: 1
      kind:
        enum:
        - superseded
        - unreconciled-source
      algebraic_source:
        enum:
        - derived-from-source-closed-form
        - reported-source-polynomial
      current_side:
        $ref: '#/$defs/decimal'
      side:
        $ref: '#/$defs/decimal'
      exact_form:
        $ref: '#/$defs/rational'
      degree:
        type: integer
        minimum: 1
      polynomial:
        $ref: '#/$defs/polynomial'
      checks:
        $ref: '#/$defs/source_root_checks'
      sources:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/source_occurrence'
      source_statuses:
        type: array
        items:
          type: string
      attribution:
        $ref: '#/$defs/source_attribution'
      bead:
        oneOf:
        - type: 'null'
        - type: string
          pattern: ^think-[0-9a-z]+$
      text:
        type: string
        minLength: 1
      reported_source:
        $ref: '#/$defs/reported_source'
      assurance:
        $ref: '#/$defs/source_assurance'
      source_certificate:
        $ref: '#/$defs/source_certificate'
    allOf:
    - if:
        required:
        - source_certificate
        properties:
          kind:
            const: unreconciled-source
      then:
        properties:
          source_certificate:
            properties:
              adoption:
                const: pending
    - if:
        required:
        - source_certificate
        properties:
          kind:
            const: superseded
      then:
        properties:
          source_certificate:
            properties:
              adoption:
                const: not-selected
    oneOf:
    - required:
      - reported_source
      - assurance
      properties:
        algebraic_source:
          const: reported-source-polynomial
        degree:
          enum:
          - 8
          - 32
          - 40
      not:
        required:
        - source_certificate
    - required:
      - source_certificate
      - exact_form
      properties:
        algebraic_source:
          const: derived-from-source-closed-form
        degree:
          const: 1
      not:
        anyOf:
        - required:
          - reported_source
        - required:
          - assurance
  source_occurrence:
    type: object
    additionalProperties: false
    required: [path, url, kind, locator, source_flags]
    properties:
      path: {type: string, minLength: 1}
      url: {type: string, minLength: 1}
      kind: {type: string, minLength: 1}
      source_flags: {type: array, items: {type: string}}
      locator:
        type: object
        additionalProperties: false
        required: [line, section]
        properties:
          line: {type: integer, minimum: 1}
          line_end: {type: integer, minimum: 1}
          section: {type: string}
  source_attribution:
    type: object
    additionalProperties: false
    required: [date_mentions, source_text]
    properties:
      date_mentions: {type: array, items: {type: string}}
      source_text: {type: array, items: {type: string}}
  reported_source:
    type: object
    additionalProperties: false
    required: [revision, sha256, acquisition, manifest, row, interval_root_count, isolated_root_contained]
    properties:
      revision: {type: string, pattern: '^[0-9a-f]{40}$'}
      sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      acquisition: {type: string, minLength: 1}
      manifest: {type: string, minLength: 1}
      interval_root_count: {const: 1}
      isolated_root_contained: {const: true}
      row:
        type: object
        additionalProperties: false
        required: [n, status, S, S_poly_ascending, S_interval, S_degree, height_digits, field_poly_ascending, field_degree, verify_exact, lean_packs, lean_local_min, crosscheck, new, data]
        properties:
          n: {enum: [102, 106, 152, 177]}
          status: {const: exact}
          S: {$ref: '#/$defs/decimal'}
          S_poly_ascending: {$ref: '#/$defs/reported_coefficients'}
          S_interval:
            type: array
            minItems: 2
            maxItems: 2
            items: {$ref: '#/$defs/rational'}
          S_degree: {enum: [8, 32, 40]}
          height_digits: {type: integer, minimum: 1}
          field_poly_ascending: {$ref: '#/$defs/reported_coefficients'}
          field_degree: {type: integer, minimum: 1}
          verify_exact: {type: boolean}
          lean_packs: {type: boolean}
          lean_local_min: {type: string}
          crosscheck: {type: string}
          new: {const: true}
          data: {type: string, minLength: 1}
  reported_coefficients:
    type: array
    minItems: 2
    items: {type: string, pattern: '^-?[0-9]+$'}
  source_root_checks:
    type: object
    additionalProperties: false
    required: [irreducible, root, decimal, kkt_agreement_digits, recorded_agreement_digits, catalogue, galois]
    properties:
      irreducible: {$ref: '#/$defs/checks/properties/irreducible/oneOf/1'}
      root: {$ref: '#/$defs/checks/properties/root/oneOf/1'}
      decimal: {$ref: '#/$defs/decimal'}
      kkt_agreement_digits: {type: 'null'}
      recorded_agreement_digits: {$ref: '#/$defs/checks/properties/recorded_agreement_digits'}
      catalogue: {const: not-in-catalogue}
      galois: {type: 'null'}
  source_assurance:
    type: object
    additionalProperties: false
    required: [verification, confirmation, algebraic_identity, geometry_replay, lean_replay, current_pose_identity, global_optimality]
    properties:
      verification: {const: V0}
      confirmation: {const: C0}
      algebraic_identity: {const: independently-checked}
      geometry_replay: {const: not-attempted}
      lean_replay: {const: not-attempted}
      current_pose_identity: {const: not-established}
      global_optimality: {const: not-established}
  rational:
    type: string
    pattern: '^-?[0-9]+/[0-9]+$'
  decimal:
    type: string
    pattern: '^-?[0-9]+(\.[0-9]+)?$'
  note:
    type: object
    additionalProperties: false
    required: [kind, text, bead, degree]
    allOf:
      - if:
          properties:
            kind: {const: unreconciled-source-polynomial}
        then:
          required: [side, polynomial, checks, sources, source_statuses, attribution, reported_source, assurance]
          properties:
            degree: {enum: [8, 32, 40]}
            checks: {$ref: '#/$defs/source_root_checks'}
    properties:
      side:
        description: The reported source root, which establishes no current packing bound.
        $ref: '#/$defs/decimal'
      polynomial: {$ref: '#/$defs/polynomial'}
      checks: {$ref: '#/$defs/checks'}
      sources: {type: array, minItems: 1, items: {$ref: '#/$defs/source_occurrence'}}
      source_statuses: {type: array, items: {type: string}}
      attribution: {$ref: '#/$defs/source_attribution'}
      reported_source: {$ref: '#/$defs/reported_source'}
      assurance: {$ref: '#/$defs/source_assurance'}
      kind:
        enum:
          - superseded-catalogue-polynomial
          - unreconciled-source-polynomial
          - missing-polynomial-text
          - route
          - no-radical-form
          - relation-search-negative
          - verified-witness-side
          - verified-bound-ceiling
      text:
        type: string
        minLength: 1
        description: >-
          Verified rational provenance identifies either a native finite witness side
          or an outward upper-bound ceiling, and names its certificate and passing replay.
          Neither establishes a stationary ideal packing or global optimality.
      bead:
        description: The bead that owns the route, where the note names one.
        oneOf:
          - {type: 'null'}
          - {type: string, pattern: '^think-[0-9a-z]+$'}
      degree:
        description: >-
          The degree the note is about: the catalogue polynomial's, the missing text's,
          or the integer-relation search's reach.
        oneOf:
          - {type: 'null'}
          - {type: integer, minimum: 1}
  polynomial:
    type: object
    additionalProperties: false
    required: [coefficients, text, latex, height_digits]
    properties:
      coefficients:
        type: array
        description: Primitive integer coefficients, highest degree first, positive lead.
        minItems: 2
        items: {type: string, pattern: '^-?[0-9]+$'}
        prefixItems:
          - {type: string, pattern: '^[1-9][0-9]*$'}
      text: {type: string, pattern: ' = 0$'}
      latex: {type: string, minLength: 1}
      height_digits: {type: integer, minimum: 1}
  checks:
    type: object
    additionalProperties: false
    required:
      - irreducible
      - root
      - decimal
      - kkt_agreement_digits
      - recorded_agreement_digits
      - catalogue
      - galois
    properties:
      irreducible:
        description: >-
          The certificate of irreducibility over Q: `linear`; `factorization` (SymPy's
          factorisation returns one factor of full degree, to degree 12); or
          `modular-degree-patterns`, whose primes are the good primes, in order, whose
          distinct-degree factorisations together leave no proper factor degree.
        oneOf:
          - {type: 'null'}
          - type: object
            additionalProperties: false
            required: [method, primes]
            properties:
              method: {enum: [linear, factorization, modular-degree-patterns]}
              primes:
                type: array
                items: {type: integer, minimum: 2}
      root:
        description: >-
          An interval with rational endpoints holding exactly one real root, the one at
          the side. Degenerate at a rational root. `window` says which value the proving
          window was centred on: Daniel's KKT value, the record's decimal, or the exact
          rational root itself.
        oneOf:
          - {type: 'null'}
          - type: object
            additionalProperties: false
            required: [interval, unique, contains_recorded_side, window]
            properties:
              interval:
                type: array
                minItems: 2
                maxItems: 2
                items: {$ref: '#/$defs/rational'}
              unique: {const: true}
              contains_recorded_side:
                const: true
                description: >-
                  The recorded decimal is the root truncated or rounded to its printed
                  places. False would be a wrong polynomial, which fails the build.
              window: {enum: [kkt, record, exact]}
      decimal:
        description: The isolated root to 40 significant digits, correctly rounded.
        oneOf:
          - {type: 'null'}
          - {$ref: '#/$defs/decimal'}
      kkt_agreement_digits:
        description: >-
          The largest k, at most the batch's digits, with the root and Daniel's value
          within one unit of the k-th significant place.
        oneOf:
          - {type: 'null'}
          - {type: integer, minimum: 0}
      recorded_agreement_digits:
        description: The same agreement with the recorded decimal, at most its printed digits.
        oneOf:
          - {type: 'null'}
          - {type: integer, minimum: 0}
      catalogue:
        description: >-
          `matches`: the record transcribes the catalogue's polynomial for the same packing.
          `derived-here`: computed from the record's closed form, and recomputed on every
          build. `not-in-catalogue`: neither.
        oneOf:
          - {type: 'null'}
          - {enum: [matches, derived-here, not-in-catalogue]}
      galois:
        description: SymPy's Galois group, for degrees 2 to 6 only.
        oneOf:
          - {type: 'null'}
          - type: object
            additionalProperties: false
            required: [group, order, solvable]
            properties:
              group: {type: string, minLength: 1}
              order: {type: integer, minimum: 2}
              solvable: {type: boolean}
  entry:
    type: object
    additionalProperties: false
    required:
      - n
      - status
      - side
      - lower
      - state
      - exact_form
      - exact_form_latex
      - algebraic_source
      - degree
      - polynomial
      - checks
      - kkt
      - notes
    properties:
      n: {type: integer, minimum: 1}
      status: {enum: [proved, open]}
      side:
        type: object
        additionalProperties: false
        required: [value, relation]
        properties:
          value: {$ref: '#/$defs/decimal'}
          relation:
            enum: [equality, upper-bound]
            description: equality only where status is proved.
      lower:
        type: object
        additionalProperties: false
        required: [value]
        properties:
          value: {$ref: '#/$defs/decimal'}
      state:
        description: >-
          `integer`: an integer side; `rational`: a degree-1 side that is not an
          integer, such as 7 + 4/7 at n = 50; `closed-form`: a radical of degree 2 or more; `minimal-polynomial`: a
          polynomial and no closed form; `degree-only`: a degree with no polynomial text;
          `numeric-only`: nothing exact.
        enum: [integer, rational, closed-form, minimal-polynomial, degree-only, numeric-only]
      exact_form:
        oneOf:
          - {type: 'null'}
          - {type: string, minLength: 1}
      exact_form_latex:
        oneOf:
          - {type: 'null'}
          - {type: string, minLength: 1}
      algebraic_source:
        oneOf:
          - {type: 'null'}
          - {enum: [catalogue, derived-from-exact-form, contact-system]}
      degree:
        oneOf:
          - {type: 'null'}
          - {type: integer, minimum: 1}
      polynomial:
        oneOf:
          - {type: 'null'}
          - {$ref: '#/$defs/polynomial'}
      checks: {$ref: '#/$defs/checks'}
      kkt:
        description: Daniel's exact KKT value and its batch status, where the batch has one.
        oneOf:
          - {type: 'null'}
          - type: object
            additionalProperties: false
            required: [value, status]
            properties:
              value: {$ref: '#/$defs/decimal'}
              status: {type: string, minLength: 1}
      notes:
        type: array
        items: {$ref: '#/$defs/note'}
