$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/jlevy/squares/packing/frontier/strategy-catalogue.schema.yaml
title: StrategyCatalogue
description: >
  An inventory of the strategies used on the square-packing problem, either for
  finding packings (upper bounds) or for proving bounds. One catalogue per file.
  The status field is named differently per kind and is conditionally required,
  so a search entry cannot silently carry a proof status or vice versa.
type: object
additionalProperties: false
required: [kind, description, count, strategies, families]
properties:
  kind:
    enum: [search, proof]
    description: Which inventory this is.
  description:
    type: string
  count:
    type: integer
    minimum: 1
    description: Number of entries; checked against the length of `strategies`.
  families:
    type: object
    minProperties: 1
    additionalProperties: {type: string}
    description: Family key to one-line description. Every strategy's family must appear here.
  strategies:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, name, family, mechanism, note, refs]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string, minLength: 1}
        family: {type: string, minLength: 1}
        mechanism: {type: string, minLength: 1}
        note:
          type: string
          minLength: 1
          description: The verdict as written in the research document's table.
        refs:
          type: array
          items: {type: string}
          description: Citation keys appearing in the entry.
        outcome:
          enum: [produced_records, used_in_field, used_elsewhere, untried_here]
          description: >-
            Search catalogue only. What this method has achieved ON THIS PROBLEM, in the
            literature or here: `produced_records` set a best-known packing;
            `used_in_field` was applied to squares-in-squares without setting one;
            `used_elsewhere` belongs to adjacent packing problems; `untried_here` has
            never been pointed at this problem at all.

            The `note` beside it is the prose the reports render, and it must agree: a
            note beginning "Yes" means and only means `produced_records`. The two
            disagreed once, unnoticed, because nothing compared them -- simulated
            annealing was tagged `untried_here` beside a note calling it the current
            workhorse (defect D-024).
        status:
          enum: [used, not_applied, not_applicable, adjacent]
          description: Proof catalogue only.
allOf:
  - if:
      properties: {kind: {const: search}}
    then:
      properties:
        strategies:
          items:
            required: [outcome]
            not: {required: [status]}
  - if:
      properties: {kind: {const: proof}}
    then:
      properties:
        strategies:
          items:
            required: [status]
            not: {required: [outcome]}
