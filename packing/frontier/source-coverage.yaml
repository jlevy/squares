  notes: >-
    Issue 719's 122 certificates at 12fc4667, certificates/n-N.cert, kept as derived exact
    facts and no upstream byte, since the source states no licence: each fact was derived
    from a checkout at the pin whose bytes have the digests the packet and the issue state.
    The issue prints each side as the binary64 value of the exact header side at 16 places,
    below that side at 76 rows, so each row records the exact side rounded up at 16 places.
    The two in the corpus, at 105 and 204, are recorded by the register entry for this
    issue, pending adoption at both. Of the 112 beyond the corpus at or below 1024, the
    packet's filtered exact replay decided every one on two routes with all six controls
    refused (receipts/filtered-exact-replay.json, devtools.beyond_horizon_replay). The
    ledger of 22 October for this issue
    (campaign/issue-intake/upper-bounds-issue719-20261022) records 111 of them in report
    order, each the current row at its count, superseding the row that stood there: 42 of
    muglich-issue686-2026-10-19's, 39 of couzo-verified-bounds-2026-10-14's, 16 of
    couzo-issue715-2026-10-21's, seven of couzo-issue678-2026-10-18's, three each of
    couzo-certificates-2026-10-14's and couzo-issue670-2026-10-17's, and
    couzo-extended-range-reports-2026-10-08's at 372. At 51 of the 111 the report just
    before this source's in report order is one no row yet holds, each its own import's:
    Francisco Couzo's 4e4c8ce certificates (think-yfoo), his 5a299b4 and 23aff0c
    certificates (think-tmwt) and issue 715's re-certifications (think-fwa9); each enters
    below this source's row when it lands. Its 366 is not recorded: Couzo's 4e4c8ce
    certificate, published 15 October, is 8.19e-2 below it. The 8 rows above 1024 are pinned
    by digest and wait on the owner (think-9vr8, think-f2io). Per-row lineage is not stated
    by the source; the issue credits Mishapolk (Mikhail Polk) and names the earlier finders
    its packings build on, and discloses Gemini assistance.
