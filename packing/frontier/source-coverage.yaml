  notes: 'Pinned source 08e8a5faa54c0a7b0bb1cb0134c77d3565ce40c5 reports s(60) = 8 by a mixed cover
    checked there by zm_mixed.py and zmx2, and hence s(61) = 8 by monotonicity. It separately reports
    s(k^2 - 3) = k for every integer k >= 6. The pinned October 1 revision is the intake snapshot:
    the s60 bundle first appeared at cdd9b2a4 on September 28 by the source''s local date, and the
    k2m3 public write-up and bundle appeared at d9f79bc1 and 69999aff on September 30. This map projects
    that infinite family to the cases through n = 324; the universal claim and the conditional Lean
    reduction are recorded in T-064. The exact Valid7 premise has one source Python checker and has
    not been freshly replayed here. No verified case bound changed on this intake. The source''s CREDITS.md
    says it was produced by Claude (Anthropic) in a single session under human direction. An independent
    point-only s(61) = 8 source by Hiroaki Hosono at f8846cec is noted in the coverage review; its primary
    packet awaits separate intake. On 2026-10-01 the packet gained, from the same revision, the s60
    bundle''s run records (jlevy/squares#256, which names the earlier d9f79bc1, where no file of the
    bundle but its README differs) and the records of a zmx2 run that certifies the s(32) cover without
    the D4 fold (jlevy/squares#238), reported and not replayed. On 2026-10-02 the s(60) cover''s zmx2
    sweeps were replayed here, root for root equal to the source''s records (E-n060-evand-mixed-cover-zmx2-replay),
    which put s(60) = 8 and s(61) = 8 in the verified lane (T-062, T-063); zm_mixed.py and the k2m3
    family were not replayed. The same day the s(32) cover''s zmx2 run without the D4 fold was replayed
    here, every root equal to the source''s records (E-n032-evand-zmx2-full-sym-replay), from the
    zmx2 source that made it, retained in the evand-zmx2-sym-atoms-2026-09-30 packet; it moved no
    rung of T-051.'
