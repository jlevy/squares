  notes: Evan Daniel's repository at 6aa82ba457e9eaeaaa3af0833600f27f91a2fce3, retained on 2026-09-28
    as the 91 files that changed or were added since the 2026-09-26 packet's 167d842c; the two packets
    overlaid give the pinned tree at every path either holds. Its CREDITS.md says the work was produced
    with an AI agent under human direction. Mixed covers (weighted points plus uniform mass on interior
    grid-line segments) prove s(21) = 5 and s(45) = 7 at margin zero, each certified at the source
    by zm_mixed.py (exact) and zmx2 (Rust, binary64 enclosures widened outward), with a Lean top theorem
    for s(21) from one hypothesis. Both bundles' fast tiers passed here, and fresh zmx2 --d4 and --full
    runs certified every root with censuses equal to the source's for all 66,600 roots, so both values
    are registered at V4/C3 on the interval-certified method; a 64-root zm_mixed.py sample matched,
    and the complete zm_mixed.py re-sweeps, which would add the exact method and C4, run separately.
    The Lean build was not run (Mathlib's cache is unreachable from this session). The source's hypothesis-free
    Lean checks of s(13) = 4 and s(32) = 6 are reported, not built, and move no bound. Its zmx2, run
    here on the 2026-09-26 release's s(32) cover, is the evidence E-n032-evand-closed-cover-zmx2-replay,
    which raised s(32) = 6 to V4/C4 on 2026-09-29.
