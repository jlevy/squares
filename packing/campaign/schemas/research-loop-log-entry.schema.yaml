# Contract for one reader-facing synopsis of a bounded research-loop run.
#
# Agent sessions own the detailed phase record, experiments own scientific verdicts,
# and defects.yaml owns actual toolchain defects. This artifact joins those records into
# one checked logbook entry without replacing any of them.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ResearchLoopLogEntry/v1
title: Research loop log entry
type: object
additionalProperties: false
required:
  - id
  - title
  - date
  - status
  - objective
  - source_sessions
  - primary_bead
  - source_branch
  - source_commit
  - timebox
  - rollup
  - new_round_results
  - prior_retained_results
  - defects
  - pipeline_changes
  - validation
  - next_action
properties:
  id:
    type: string
    pattern: "^run-[0-9]{3}$"
    description: Stable, sequential logbook id; never reuse an id.
  title: {type: string, minLength: 1}
  date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
  status: {enum: [completed, stopped]}
  objective:
    type: string
    minLength: 1
    description: The user-level objective shared by the source sessions.
  source_sessions:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: "^session-[0-9]{3}$"}
  primary_bead: {type: string, pattern: "^think-[a-z0-9]+$"}
  source_branch: {type: string, minLength: 1}
  source_commit:
    type: string
    pattern: "^[0-9a-f]{40}$"
    description: Full commit for the terminal research state summarized here.
  timebox:
    type: object
    additionalProperties: false
    required:
      - target_wall_minutes
      - cycle_minutes
      - planned_cycle_slots
    properties:
      target_wall_minutes: {type: number, exclusiveMinimum: 0}
      cycle_minutes: {type: number, exclusiveMinimum: 0}
      planned_cycle_slots: {type: integer, minimum: 1}
  rollup:
    type: object
    additionalProperties: false
    required:
      - session_count
      - phase_count
      - workflow_counts
      - phase_status_counts
      - focus_counts
      - clock_role_counts
      - delegation_count
      - delegation_status_counts
      - new_round_decision_counts
    properties:
      session_count: {type: integer, minimum: 1}
      phase_count: {type: integer, minimum: 1}
      workflow_counts: {$ref: "#/$defs/workflow_counts"}
      phase_status_counts: {$ref: "#/$defs/phase_status_counts"}
      focus_counts: {$ref: "#/$defs/focus_counts"}
      clock_role_counts: {$ref: "#/$defs/clock_role_counts"}
      delegation_count: {type: integer, minimum: 0}
      delegation_status_counts: {$ref: "#/$defs/delegation_status_counts"}
      new_round_decision_counts: {$ref: "#/$defs/experiment_decision_counts"}
  new_round_results:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, decision, summary]
      properties:
        id: {type: string, pattern: "^exp-[0-9]{3}$"}
        decision: {$ref: "#/$defs/experiment_decision"}
        summary: {type: string, minLength: 1}
  prior_retained_results:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, use, summary]
      properties:
        id: {type: string, pattern: "^exp-[0-9]{3}$"}
        use: {enum: [prerequisite, control, rechecked, context]}
        summary: {type: string, minLength: 1}
        recheck_evidence:
          type: string
          minLength: 1
          description: Required by the campaign checker when use is rechecked.
  defects:
    type: object
    additionalProperties: false
    required: [opened_in_run, preexisting_relevant, note]
    properties:
      opened_in_run:
        type: array
        uniqueItems: true
        items: {type: string, pattern: "^D-[0-9]{3}$"}
      preexisting_relevant:
        type: array
        uniqueItems: true
        items: {type: string, pattern: "^D-[0-9]{3}$"}
      note: {type: string, minLength: 1}
  pipeline_changes:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, status, summary, paths]
      properties:
        name: {type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}
        status: {enum: [built, designed, retained, removed]}
        summary: {type: string, minLength: 1}
        paths:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[^/][^\\n]*$"}
  validation:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [scope, command, status, note]
      properties:
        scope: {type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}
        command: {type: string, minLength: 1}
        status: {enum: [passed, failed]}
        steps: {type: integer, minimum: 0}
        behavioral_tests: {type: integer, minimum: 0}
        negative_controls: {type: integer, minimum: 0}
        wall_seconds: {type: number, minimum: 0}
        note: {type: string, minLength: 1}
  next_action: {type: string, minLength: 1}
$defs:
  count:
    type: integer
    minimum: 0
  workflow_counts:
    type: object
    additionalProperties: false
    properties:
      research-pass: {$ref: "#/$defs/count"}
      factual-review: {$ref: "#/$defs/count"}
      insight-iteration: {$ref: "#/$defs/count"}
      process-review: {$ref: "#/$defs/count"}
      efficiency-loop: {$ref: "#/$defs/count"}
      research-loop: {$ref: "#/$defs/count"}
      pipeline-improvement: {$ref: "#/$defs/count"}
      documentation-pass: {$ref: "#/$defs/count"}
      remediation: {$ref: "#/$defs/count"}
      review-planning-oversight: {$ref: "#/$defs/count"}
      general-improvement: {$ref: "#/$defs/count"}
  phase_status_counts:
    type: object
    additionalProperties: false
    properties:
      in_progress: {$ref: "#/$defs/count"}
      completed: {$ref: "#/$defs/count"}
      stopped: {$ref: "#/$defs/count"}
  focus_counts:
    type: object
    additionalProperties: false
    properties:
      correctness: {$ref: "#/$defs/count"}
      process: {$ref: "#/$defs/count"}
      insight: {$ref: "#/$defs/count"}
      efficiency: {$ref: "#/$defs/count"}
  clock_role_counts:
    type: object
    additionalProperties: false
    properties:
      work: {$ref: "#/$defs/count"}
      finalization: {$ref: "#/$defs/count"}
  delegation_status_counts:
    type: object
    additionalProperties: false
    properties:
      queued: {$ref: "#/$defs/count"}
      in_progress: {$ref: "#/$defs/count"}
      completed: {$ref: "#/$defs/count"}
      blocked: {$ref: "#/$defs/count"}
      canceled: {$ref: "#/$defs/count"}
  experiment_decision:
    enum:
      - accepted
      - rejected
      - unresolved
      - blocked
      - abandoned
      - superseded
      - baseline
      - in-progress
  experiment_decision_counts:
    type: object
    additionalProperties: false
    properties:
      accepted: {$ref: "#/$defs/count"}
      rejected: {$ref: "#/$defs/count"}
      unresolved: {$ref: "#/$defs/count"}
      blocked: {$ref: "#/$defs/count"}
      abandoned: {$ref: "#/$defs/count"}
      superseded: {$ref: "#/$defs/count"}
      baseline: {$ref: "#/$defs/count"}
      in-progress: {$ref: "#/$defs/count"}
