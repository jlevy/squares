# Contract for one human-steered campaign agenda.
#
# This is deliberately softer than a runner queue. It records why a bounded commitment
# is next, what kind of confidence it can buy, and what evidence lets another agent take
# over. Hypotheses still own scientific claims, experiments own measurements, and tbd
# owns implementation dependencies.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ExperimentAgenda/v1
title: Experiment agenda
type: object
additionalProperties: false
required: [id, title, updated, status, objective, items]
properties:
  id:
    type: string
    pattern: "^agenda-[0-9]{3}$"
  title: {type: string, minLength: 1}
  updated: {type: string, description: ISO date of the latest priority review.}
  status: {enum: [active, paused, completed, superseded]}
  objective:
    type: string
    minLength: 1
  items:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - owner_focus
        - instances
        - state
        - priority
        - question
        - budget
        - entry
        - exit
        - bead
        - depends_on
        - next_evidence
      properties:
        id:
          type: string
          pattern: "^BC-[0-9]{3}$"
          description: Stable cell id within this agenda; never reused.
        purpose:
          enum: [tool_validation, measurement_validation, research]
          description: >-
            Tool validation tests our stack; measurement validation tests the counted
            object or estimator; research asks about the packing landscape itself.
        owner_focus: {enum: [correctness, process, insight, efficiency]}
        instances:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer, minimum: 1}
        state: {enum: [complete, in_progress, ready, blocked, tentative, stopped]}
        priority: {type: integer, minimum: 0, maximum: 4}
        question: {type: string, minLength: 1}
        hypotheses:
          type: array
          uniqueItems: true
          items: {type: string, pattern: "^H-[0-9]{3}$"}
        budget: {type: string, minLength: 1}
        entry: {type: string, minLength: 1}
        exit: {type: string, minLength: 1}
        bead: {type: string, pattern: "^think-[a-z0-9]+$"}
        workflows:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
              - research-survey
              - factual-review
              - insight-iteration
              - process-review
              - efficiency-loop
              - research-loop
              - pipeline-improvement
              - documentation-pass
              - remediation
              - review-planning-oversight
              - general-improvement
          description: >-
            Optional: the workflow entry points this commitment expects to run through.
            Previously this lived only as prose inside `budget`, for example "one
            105-minute W3-W6-W2-W3 mini-cycle", which no checker could read.
            The list is duplicated from the session schema's `$defs.workflow` rather than
            referenced, because a cross-file `$ref` does not resolve for these loaders --
            measured, not assumed. `packing-ledger check` compares the two lists so the
            duplication cannot drift silently.
        depends_on:
          type: array
          uniqueItems: true
          items: {type: string, pattern: "^BC-[0-9]{3}$"}
        blocked_on:
          type: string
          minLength: 1
          description: >-
            What a blocked commitment waits on when it is not another commitment: an
            artifact that does not exist yet, a decision, an outstanding defect. Required
            by the renderer whenever `state` is `blocked` and `depends_on` is empty,
            because four commitments sat blocked on nothing nameable and no reader could
            tell when they would clear (D-374). A commitment blocked only on other
            commitments uses `depends_on` and leaves this out.
        discharged_by:
          type: string
          pattern: "^BC-[0-9]{3}$"
          description: >-
            The commitment in a later agenda that satisfied this one's exit. Recorded as
            an edge because prose could not be read: agenda-007 declared its three
            discharges in `note` fields, and agenda-006 discharged four agenda-005
            commitments without saying so anywhere, so the queue offered finished work as
            takeable (D-374). A commitment naming this may not be `ready`; the renderer
            refuses that combination, which is the whole point of making it a field.
        next_evidence: {type: string, minLength: 1}
        outcomes:
          type: array
          minItems: 1
          description: >-
            Post-agenda results at the smallest honest scope. Required by the campaign
            checker for every item in terminal agendas from agenda-015 onward.
          items:
            type: object
            additionalProperties: false
            required: [scope, classification, result, evidence, disposition, follow_up]
            properties:
              scope: {type: string, minLength: 1}
              classification:
                enum:
                  - achieved
                  - bounded-negative
                  - time-limited
                  - guard-refused
                  - technical-failure
                  - never-opened
                  - inconclusive
              result: {type: string, minLength: 1}
              evidence:
                type: array
                minItems: 1
                items: {type: string, minLength: 1}
              disposition:
                enum:
                  - retire-success
                  - retire-negative
                  - continue
                  - fix-and-rerun
                  - defer-dependency
              follow_up:
                type: [string, "null"]
                pattern: "^think-[a-z0-9]+$"
                description: >-
                  Required for continue, fix-and-rerun, and defer-dependency; null for
                  retired work.
        artifacts:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        parallel_group:
          type: string
          minLength: 1
          description: Optional disjoint lane that another agent may own concurrently.
        program:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: >-
            Optional kebab-case slug naming the multi-block program this commitment
            belongs to. A program's cells sit in more than one agenda, and nothing
            joined them: `depends_on` may cross agendas and never has, so a program's
            open frontier was reconstructed by hand from several files. The agenda map
            lists every program's cells together, across agendas, in dependency order
            where `depends_on` gives one and by id otherwise, and names the cells not
            yet terminal as its open frontier.
        note: {type: string, minLength: 1}
  closeout:
    type: object
    additionalProperties: false
    description: >-
      Terminal W10 reconciliation. Required by the campaign checker for completed or
      superseded agendas from agenda-015 onward.
    required: [documentation_review, changes, validation, replanning]
    properties:
      documentation_review:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [path, decision, reason]
          properties:
            path: {type: string, minLength: 1}
            decision: {enum: [updated, checked-current, not-applicable]}
            reason: {type: string, minLength: 1}
      changes:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, result, paths]
          properties:
            name: {type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}
            result: {type: string, minLength: 1}
            paths:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, pattern: "^[^/][^\\n]*$"}
      validation:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [scope, status, evidence]
          properties:
            scope: {type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}
            status: {enum: [passed, failed, pending]}
            evidence: {type: string, minLength: 1}
      replanning:
        type: object
        additionalProperties: false
        required: [candidates, selected, operator_input]
        properties:
          candidates:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [bead, workflow, priority, rationale]
              properties:
                bead: {type: string, pattern: "^think-[a-z0-9]+$"}
                workflow:
                  $ref: "#/$defs/workflow"
                priority: {type: integer, minimum: 0, maximum: 4}
                rationale: {type: string, minLength: 1}
          selected:
            type: object
            additionalProperties: false
            required: [bead, workflow, rationale]
            properties:
              bead: {type: string, pattern: "^think-[a-z0-9]+$"}
              workflow:
                enum:
                  - research-survey
                  - factual-review
                  - insight-iteration
                  - process-review
                  - efficiency-loop
                  - research-loop
                  - pipeline-improvement
                  - documentation-pass
                  - remediation
                  - review-planning-oversight
                  - general-improvement
              rationale: {type: string, minLength: 1}
          operator_input:
            type: object
            additionalProperties: false
            required: [status, note]
            properties:
              status: {enum: [confirmed, revised, unavailable]}
              note: {type: string, minLength: 1}
$defs:
  workflow:
    enum:
      - research-survey
      - factual-review
      - insight-iteration
      - process-review
      - efficiency-loop
      - research-loop
      - pipeline-improvement
      - documentation-pass
      - remediation
      - review-planning-oversight
      - general-improvement
