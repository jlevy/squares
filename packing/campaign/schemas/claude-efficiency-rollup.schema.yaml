# Contract for one prose-excluding efficiency rollup over a Claude Code session log.
#
# The sibling of CodexEfficiencyRollup/v2, and deliberately a separate shape. Codex and
# Claude Code record different things, and one schema over both would either discard what
# one knows or invent fields the other cannot fill. A later unified EfficiencyRollup maps
# from these; nothing downstream should read this one directly except that mapping.
#
# The rollup is the retained artifact rather than a pointer to one: the raw JSONL is large,
# harness-private, and full of prose this repository has no reason to keep, so it will not
# always be archived. `semantics` is required for that reason -- a figure whose meaning is
# not carried beside it will be read as whatever the reader assumes.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ClaudeEfficiencyRollup/v1
title: Claude Code efficiency rollup
type: object
additionalProperties: false
required:
  - source
  - span
  - turns
  - tokens
  - tokens_by_thinking_level
  - tool_calls
  - session_events
  - semantics
properties:
  source:
    type: object
    additionalProperties: false
    required: [harness, filename, sha256, bytes, records, session_id, harness_versions]
    properties:
      harness:
        const: claude-code
        description: Fixed, so a unified rollup can tell which reader produced this record.
      filename: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: >-
          Of the source JSONL. The log itself is not retained, so this is what lets a
          later reader tell whether two rollups came from the same transcript.
      bytes: {type: integer, minimum: 0}
      records: {type: integer, minimum: 0}
      session_id: {type: string}
      harness_versions:
        type: array
        items: {type: string, minLength: 1}
        description: >-
          Every distinct harness version seen in the log. More than one means the session
          spanned an upgrade, which is a reason for a figure to shift.
  span:
    type: object
    additionalProperties: false
    required: [started_at, ended_at, wall_seconds]
    properties:
      started_at: {type: [string, "null"]}
      ended_at: {type: [string, "null"]}
      wall_seconds: {type: number, minimum: 0}
  turns:
    type: object
    additionalProperties: false
    required:
      - assistant
      - sidechain
      - by_model
      - by_thinking_level
      - by_model_and_thinking_level
      - by_branch
      - latency
    properties:
      assistant: {type: integer, minimum: 0}
      sidechain:
        type: integer
        minimum: 0
        description: Turns belonging to a delegated agent rather than the coordinator.
      by_model: {type: object, additionalProperties: {type: integer, minimum: 0}}
      by_thinking_level:
        type: object
        additionalProperties: {type: integer, minimum: 0}
        description: >-
          Effort as the harness recorded it. This is what OR-2's "matched to the task"
          claim is checkable against.
      by_model_and_thinking_level:
        type: object
        additionalProperties: {type: integer, minimum: 0}
        description: >-
          The cross of the two above. A session that ran one model at three efforts and
          a session that ran three models at one effort have identical margins and
          different meanings.
      by_branch: {type: object, additionalProperties: {type: integer, minimum: 0}}
      latency:
        allOf: [{$ref: "#/$defs/elapsed"}]
        description: >-
          Parent record to turn. The closest thing here to model time and not model time:
          it also carries queueing and any human pause before a reply.
  tokens:
    type: object
    additionalProperties: {type: integer, minimum: 0}
    description: >-
      Per-turn usage as the harness reported it, summed. No cost is derived: pricing is
      not this record's to know, and a stored price goes stale silently.
  tokens_by_thinking_level:
    type: object
    additionalProperties:
      type: object
      additionalProperties: {type: integer, minimum: 0}
    description: >-
      The same counters split by the effort each turn ran at, which is what makes the
      cost of a thinking level answerable rather than asserted.
  tool_calls:
    type: object
    additionalProperties: false
    required:
      - total
      - total_seconds
      - errors
      - denied
      - unpaired_results
      - outstanding_at_snapshot
      - one_off_code
      - by_tool
      - by_executable
      - by_shell_shape
      - by_thinking_level
      - shell_traits
    properties:
      total: {type: integer, minimum: 0}
      total_seconds: {type: number, minimum: 0}
      share_of_wall:
        type: [number, "null"]
        minimum: 0
        description: >-
          May exceed one. Concurrent calls are summed independently, so this is a load
          figure rather than an occupancy figure.
      unpaired_results:
        type: integer
        minimum: 0
        description: >-
          tool_result blocks whose tool_use was not in the log, which is normal after a
          compaction. A large count means the elapsed figures cover less than the session.
      outstanding_at_snapshot:
        type: integer
        minimum: 0
        description: Calls still in flight when the log was read.
      errors:
        type: integer
        minimum: 0
        description: >-
          Calls the harness marked is_error. A failed call still spends its elapsed time,
          so the count is separate rather than hidden inside the total.
      denied:
        type: integer
        minimum: 0
        description: Calls a permission decision refused.
      one_off_code:
        allOf: [{$ref: "#/$defs/elapsed"}]
        description: >-
          The `python_heredoc` and `python_inline` shapes together, which is what OR-1
          calls a measurement left in one-off code. Promoted out of `by_shell_shape` so
          the rule has one number rather than a sum a reader has to perform.
      by_tool: {$ref: "#/$defs/elapsed_group"}
      by_executable:
        allOf: [{$ref: "#/$defs/elapsed_group"}]
        description: >-
          Keyed by the leading executable word of a shell command, which is identity and
          not content. Nothing reconstructs a command line from this record.
      by_shell_shape:
        allOf: [{$ref: "#/$defs/elapsed_group"}]
        description: >-
          Structural classification in a fixed priority order, so a Python heredoc that
          also pipes counts as a Python heredoc.
      by_thinking_level: {$ref: "#/$defs/elapsed_group"}
      shell_traits:
        type: object
        additionalProperties: {type: integer, minimum: 0}
        description: >-
          Non-exclusive structural features, counted rather than classified: a command
          may pipe and redirect and background at once.
  session_events:
    type: object
    additionalProperties: false
    required: [compact_boundaries, stop_hook_summaries, queue_operations]
    properties:
      compact_boundaries:
        type: integer
        minimum: 0
        description: >-
          Context compactions. Each one means the figures before it describe a session
          the model can no longer see.
      stop_hook_summaries: {type: integer, minimum: 0}
      queue_operations:
        type: object
        additionalProperties: {type: integer, minimum: 0}
        description: >-
          Messages queued and withdrawn mid-turn. An enqueue is an interjection, which
          is a signal about pacing rather than about any tool.
  semantics:
    type: object
    minProperties: 1
    additionalProperties: {type: string, minLength: 1}
    description: >-
      What each figure may and may not be read as, including which measurements this
      harness cannot supply. A missing measurement is named `UNAVAILABLE` in prose here
      and is absent from the data rather than defaulted to zero, because a zero will be
      summed with a harness that reports the figure and the total will be wrong in the
      flattering direction.
$defs:
  elapsed:
    type: object
    additionalProperties: false
    required: [count, total_seconds]
    properties:
      count: {type: integer, minimum: 0}
      total_seconds: {type: number, minimum: 0}
      median_seconds: {type: number, minimum: 0}
      max_seconds: {type: number, minimum: 0}
  elapsed_group:
    type: object
    additionalProperties: {$ref: "#/$defs/elapsed"}
