  semantics:
    attribution: Codex logs carry no git-branch telemetry. This task-tree interval is not branch-attributed
      unless an AgentSession explicitly declares it.
    delta: Delta is after minus before for a fixed whitelist of cumulative additive fields; a decrease
      is rejected rather than hidden.
    cutoff_boundary: Task, tool, compaction, and model-stream timings are clipped at both cutoffs.
      Token counts and client-reported first-token waits are emitted on completion and can be charged
      wholly to the interval containing that completion.
    live_snapshot: When snapshot_incomplete is true, the after snapshot and delta are lower bounds
      on the task tree's eventual totals.
    retention: The receipt retains aggregate counts, timings, models, efforts, and tokens; it drops
      prose, private paths, agent paths, turn ids, and command history.
