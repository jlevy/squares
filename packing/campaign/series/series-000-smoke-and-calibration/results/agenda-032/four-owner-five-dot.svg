  <text x="674" y="564" font-size="22" fill="#22333d" font-weight="650" text-anchor="start">Why five dots suffice</text>
  <text x="674" y="598" font-size="18" fill="#22333d" font-weight="400" text-anchor="start">An inner core is a slightly smaller</text>
  <text x="674" y="622" font-size="18" fill="#22333d" font-weight="400" text-anchor="start">square strictly inside a unit square.</text>
  <text x="674" y="663" font-size="18" fill="#22333d" font-weight="400" text-anchor="start">Each selected remaining core contains</text>
  <text x="674" y="687" font-size="18" fill="#b63e24" font-weight="650" text-anchor="start">at least one of the five red dots.</text>
  <text x="674" y="733" font-size="18" fill="#22333d" font-weight="400" text-anchor="start">Separated cores cannot share a dot.</text>
  <rect x="30" y="799" width="1040" height="91" rx="12" fill="#f4f7f7" stroke="#d9e2e3" />
  <text x="54" y="835" font-size="24" fill="#22333d" font-weight="650" text-anchor="start">11 total − 4 owners = 7 remaining</text>
  <text x="54" y="867" font-size="18" fill="#22333d" font-weight="400" text-anchor="start">Each remaining core needs its own dot.</text>
  <text x="830" y="838" font-size="29" fill="#b63e24" font-weight="700" text-anchor="middle">7 required &gt; 5 dots</text>
  <text x="830" y="870" font-size="18" fill="#22333d" font-weight="400" text-anchor="middle">This case is impossible.</text>
