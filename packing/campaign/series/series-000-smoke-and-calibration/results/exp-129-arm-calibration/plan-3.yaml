# exp-129, third calibration pass: the control that guards arm B's interpretation.
#
# Pass 1 and 2 show that a simultaneous perturbation at high probability leaves the
# trivial grid where the stock annealer does not. Before that is read as "the collective
# move is what matters", the obvious alternative has to be excluded: a whole-square
# perturbation at scale `temperature` moves the configuration much further per proposal
# than a single-square move does, so it may simply be a hotter search wearing a
# structural costume.
#
# The ablation is a single-square-only annealer at raised temperature, at the same
# pair-test budget and the same held-out cells. If a hot control also leaves the grid,
# arm B's effect is exploration temperature and not collectivity, and the round has to
# say so. `--move-rotate` is left alone so only one factor moves.
label: exp-129-arm-calibration-3
engine: sqsearch/target/release/sqsearch
budget_pair_tests: 200000000
chains: 8
threads: 4
cells: [18, 40]
seeds: [1, 2, 3]
arms:
  A-control: []
  A-hot050: ["--t-hot", "0.50"]
  A-hot100: ["--t-hot", "1.00"]
  A-hot200: ["--t-hot", "2.00"]
  A-hot400: ["--t-hot", "4.00"]
  A-reseed0: ["--p-reseed", "0.0"]
  A-steps4M: ["--steps", "4000000"]
