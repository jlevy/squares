# exp-129 - the arm calibration pilot, written before the pilot ran.
#
# Its job is to fix the two free parameters of arm B (how often a simultaneous
# perturbation is proposed, and how large it is) and the one free parameter of arm C
# (the wall-pressure weight) BEFORE the round that scores them.
#
# The cells here are deliberately NOT the round's cells. n = 18 and n = 40 are non-grid
# cases at n < 100 -- so no arm can score by returning the incumbent grid -- and neither
# appears in the round-1 subset, so nothing tuned here was tuned on the test set.
label: exp-129-arm-calibration
engine: sqsearch/target/release/sqsearch
budget_pair_tests: 200000000
chains: 8
threads: 4
cells: [18, 40]
seeds: [1, 2, 3]
arms:
  A-control: []
  B-p002-s1: ["--p-perturb", "0.02", "--perturb-scale", "1"]
  B-p005-s1: ["--p-perturb", "0.05", "--perturb-scale", "1"]
  B-p005-s4: ["--p-perturb", "0.05", "--perturb-scale", "4"]
  B-p015-s1: ["--p-perturb", "0.15", "--perturb-scale", "1"]
  B-p050-s1: ["--p-perturb", "0.50", "--perturb-scale", "1"]
  C-mu002: ["--mu0", "0.02", "--mu1", "1e-6"]
  C-mu010: ["--mu0", "0.10", "--mu1", "1e-6"]
  C-mu050: ["--mu0", "0.50", "--mu1", "1e-6"]
