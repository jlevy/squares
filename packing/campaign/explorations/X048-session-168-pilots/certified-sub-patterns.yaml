# Sub-patterns certified infeasible on the n17 unique-state cover, and their admission.
# `devtools/census_n17_certified.py` reads this file. Its certified count uses only the
# entries marked `admitted`; a `pending` entry is a projection, reported on its own line.
# Every path is repository-relative. Admitting an entry means setting `status: admitted`
# and naming the document that admits it in `evidence`: since OR-16's amendment, the
# experiment record holding the full pass of a reviewed standing verifier. The census
# checks only that `evidence` exists. It is a pointer for readers, not a check; what
# admits an entry is its `verification`.
schema: n17-certified-sub-patterns/v3
design: ring-3-voronoi-8-tabbed-unique
# The certificate objects (228 of them, about 2.6 GB of gzip) are hosted outside Git (OR-18)
# on the release data/n17-x048-session-168-certificates-v1, listed with their assets, sizes and
# SHA-256 in this hosted-data manifest; each certificate directory keeps its small files.
# The count needs only the committed receipts; `python -m devtools.hosted_data fetch
# --manifest hosted/n17-x048-session-168-certificates.yaml`, run from packing/, puts the
# objects back so the verifiers can run again.
data_manifest: packing/hosted/n17-x048-session-168-certificates.yaml
# The standing verifiers, written separately from the producers, as reviews admitted them.
# Each entry's verification names the listing it ran under by `id`; `version` is the
# revision the review read, kept for the reader, and nothing resolves it (OR-18). A listing with
# `admits` may verify only the entries it names; the closed-cover listing says why the
# earlier kernel listings carry it. A verification is matched to its certificate by the
# content ids in the objects' file names (seed and node, or the manifest), not by
# directory, so a certificate directory can be renamed without verifying it again.
# Revisions named here were commits on PR 307's branch; they resolve at
# refs/pull/307/head.
verifiers:
  # The review verifiers: lane R3's for the kernel (W7's receipt), lane R4's for the
  # branch and bound (A's receipt).
  - id: kernel-review-r3
    certifier: kernel
    path: packing/devtools/verify_n17_kernel_certificate.py
    version: 556561586095f1eaf7952e32199f40a4d3360d20
    review: docs/project/reviews/review-2026-10-02-n17-w7-closure.md
    admits: [W7]
  - id: bb-review-r4
