results:
  - id: T-NN
    kind: lower-bound
    registered: 'YYYY-MM-DD'
    headline: "Continuous-pose lower bound `s(28) > 1149/200` reported, by two of the source's programs"
    claim: >-
      A rectangle measure of wand125/square-packing, published on 15 October 2026 and
      reported on no issue, is reported to prove s(28) > 1149/200 = 5.745.

      The certificate, continuous_n28_L5745, is a density of 884 uniform rectangles in D4
      orbits, and no point mass, of total mass 2799999/100000 on K = [0, 573351/100000]^2.
      Every closed square of side B = 499/500 in K, at every centre and every angle, is
      reported to capture mass at least 1; 28 - 2799999/100000 = 1/100000 > 0, so no 28
      squares of side B with disjoint interiors fit in K, and scaling by 1/B gives the
      claim, since L/B = 1149/200 exactly. The angle is covered continuously in
      t = tan(theta/2) up to 83/200, past tan(pi/8), by outward-rounded interval branch and
      bound, and the near-axis band by an exact check of a smaller axis-parallel square:
      T-145's method, on a new density at a new count.

      The source reports two programs deciding it: sqverify_continuous v4 (source
      619b3c00), its continuous-angle mode of this repository's sqverify_fast crate, at all
      86 root ranges (1,265,052,068 nodes, and a second complete run before publication),
      and contpose_check3 v1.2 (source f3629c29), a driver around Guzhou0806's T-145
      kernels with their caps raised, at all 43 slabs (1,912,948,689 nodes). Each refused a
      control with every mass scaled by 985/1000.

      The value is above T-142's reported 2297/400 = 5.7425 by 1/400, above the 287/50 that
      jlevy/squares#446 reported on 8 October, never adopted, by 1/200, and above T-107's
      1147/200 = 5.735, the verified and reported lower bound at n = 28, by 1/100.

      Here the exact premises hold: the mass, the scalar chain, each program's near-axis
      side and margin, both logs against their summaries, the control's scaling, and both
      of check2's kernel inputs, regenerated from the candidate with the T-145 audit's
      builders, equal to the digests the source names. A diagnostic sample agreed with the
      source's logs: three of check1's roots, its control, two slabs on the reviewed T-145
      kernel and the axis patch. A sample is not a replay. No complete replay has run here,
      so the value stands as reported.

      Hiroaki Hosono (wand125) after Guzhou0806, Tokoharu and Levy,
      [square-packing](https://github.com/wand125/square-packing/tree/8530bafb03d48444f30f241fbc1f29f01cd7c96c/problems/square-lower-bounds/certificates/continuous_n28_L5745).
      The source says parts of the work were produced with AI assistance under human
      direction; the commit names Claude as co-author, and the second program's
      specification is written for Codex.
    scope: {n_values: [28]}
    verification: V0
    confirmation: C0
    significance:
      score: 3
      rationale: >-
        Scored as a claim: if a complete replay passes, it is the strongest lower bound on
        record at n = 28, 1/400 above T-142 and 1/100 above T-107, the gap to the best
        known packing falling to about 0.0794. Its technique is T-145's continuous-pose
        cover, carried for the first time to a count other than 40 and decided at the
        source by two programs; a single-count raise on an existing technique and not a
        bound family, S3 as T-145, T-157 and T-142 are. V0/C0 says how far it stands, and
        the score gates nothing.
      scored: 'YYYY-MM-DD'
      by: 'think-zb5w import, stage 1-2 lane (repository; draft)'
    novelty: previously-published
    attribution:
      source_keys: ['[wand125 continuous n28 2026-10-15]']
      published: '2026-10-15'
    composition: >-
      One reported certificate on its reported entry. The continuous cover is reported
      decided by two of the source's programs: sqverify_continuous, which keeps this
      repository's sqverify_fast interval, exact, axis, oracle and rotated modules byte for
      byte, and contpose_check3, which runs Guzhou0806's T-145 kernels with only their
      caps and receipt echo changed. The source says they share no code; they share none
      with each other, but each shares code this record already relies on, and both
      follow T-145's method. A replay here of the second on the reviewed T-145 kernel
      would be re-implemented sharing the producer's components; no independent method
      stands beside them.
    evidence:
      - E-wand125-continuous-n28-5745-report
    artifacts:
      - packing/resources/web/wand125-continuous-n28-2026-10-15/README.md
      - packing/resources/web/wand125-continuous-n28-2026-10-15/acquisition/sources.json
      - packing/resources/web/wand125-continuous-n28-2026-10-15/square-packing/problems/square-lower-bounds/certificates/continuous_n28_L5745/bundle.json
