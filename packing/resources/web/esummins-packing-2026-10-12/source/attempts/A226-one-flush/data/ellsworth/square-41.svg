    f3 = RotationTransform[a][({s - 1, 1} + RotationTransform[-b][{-2 - u8, -r7 + v9}]) - {1, s - 1}][[1]] - (5 - u2);
    AbsoluteTiming[solution = Solve[{f1==0, f2==0, f3==0}, {s, a, b}, GeneratedParameters -> C][[4]] /. _C -> 0][[1]] (* took 3.307 seconds *)
    N[{s, a*180/Pi, b*180/Pi, r1, u2, v3, u4, v5, v6, r7, u8, v9, uA, xB} /. solution, 50]

