    Optimized by David Ellsworth on February 1, 2026, with exact polynomial root solution.

    Unset[{s, a, b, c, r1, v2, u3, u4, r5, u6, f1, f2, f3, solution}];
    r1 = 1 - (s - 7)*Cos[a];
    v2 = RotationTransform[a][{3, 1} - {1, 2}][[2]];
    u3 = RotationTransform[a][{1, s - 4} - ({3, 1} + RotationTransform[-a][{-3 - r1, -v2}])][[1]];
    u4 = Cos[a] - Sin[a];
    r5 = 2 - RotationTransform[-b][{4, s - 2} - ({3, 1} + RotationTransform[-a][{-r1 + u3 + u4, 4}])][[2]];
    u6 = Cos[b] - Sin[b];
    y7 = Sin[c];
    u8 = RotationTransform[c][{s, s - 2 - y7} - {s - 1, 4}][[1]];
    u9 = RotationTransform[c][{s, s - 2 - y7} - {s - 2, 3}][[1]];
    uA = u9 - RotationTransform[c][{s - 2, 3} - ({s, s - 2 - y7} + RotationTransform[-c][{-u9, -3}])][[2]]*Tan[c];
    f1 = ({3, 1} + RotationTransform[-a][{-3 - r1, -v2}])[[1]];
    f2 = RotationTransform[-b][{s - 1, s - 2} - ({3, 1} + RotationTransform[-a][{-r1 + u3 + u4, 4}])][[1]] - 2;
    f3 = Det[Grad[{s, f1, f2}, {s, a, b}]];
    f4 = RotationTransform[a][({s, s - 2 - y7} + RotationTransform[-c][{-1 - uA, -4}]) - {2, s - 3}][[1]] - 3;
    solution = FindRoot[{f1==0, f2==0, f3==0, f4==0}, {{s, 7.7}, {a, 32*Pi/180}, {b, Pi/4}, {c, 41*Pi/180}}, WorkingPrecision -> 100];
    N[{s, a*180/Pi, b*180/Pi, c*180/Pi, r1, v2, u3, u4, r5, u6, y7, u8, u9, uA, {f1, f2, f3, f4}} /. solution, 50]

