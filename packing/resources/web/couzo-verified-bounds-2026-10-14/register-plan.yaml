results.yaml:
  id: T-NNN
  kind: upper-bound
  registered: '2026-10-15'
  headline: A tighter exact certificate for 211 squares from Francisco Couzo, continuing Daniil Ostashev's
    arrangement
  claim: 'One complete rational source certificate reports a finite upper-bound improvement at the exact
    side it states: s(211) <= 14.993549626299421038935530460882. Complete native feasibility outcomes
    are retained separately; the selected standing case is unchanged pending independent review and record
    review.


    The author''s metadata (certificates/n211.json at the pin) calls the certificate an exact optimum,
    seeded from Daniil Ostashev''s issue-501 certificate and found by the author''s hop search (job 97342),
    and certificates/README.md lists it as best known; the author reports that this repository''s sqpack
    verify.py and Evan Daniel''s verify_cert.py accept his certificates in exact rational arithmetic.
    Those statements are the author''s; no source program ran here.


    Credit Francisco Couzo (https://github.com/franciscouzo/square-packing) with this refinement at 211,
    continuing Daniil Ostashev''s arrangement (issue 501, T-149), whose construction credit the author''s
    metadata keeps, after his own issue-583 and issue-586 certificates of the same arrangement. Evan Daniel''s
    optimizer, contact solver and verifier and this repository''s exact verifier were used. The pinned
    files state nothing about AI assistance; the author''s issues of 13 and 14 October state that OpenAI
    Codex assisted search and verification orchestration, and that he directed the work.'
  scope:
    n_values:
    - 211
  verification: V0
  confirmation: C0
  significance:
    score: 1
    rationale: A smaller finite construction side at n = 211, 2.79e-03 below the case ceiling; no lower
      bound or optimum.
    scored: '2026-10-15'
    by: think-nj7h Francisco Couzo import
  novelty: previously-published
  attribution:
    source_keys:
    - '[Couzo verified bounds 2026-10-14]'
    published: '2026-10-14'
  evidence:
  - E-couzo-487b058-certificate-report
  artifacts:
  - packing/resources/web/couzo-verified-bounds-2026-10-14/README.md
  - packing/resources/web/couzo-verified-bounds-2026-10-14/acquisition/claims.json
  - packing/resources/web/couzo-verified-bounds-2026-10-14/source/certificates/n211.cert
  - packing/resources/web/couzo-verified-bounds-2026-10-14/receipts/exact-certification.json.xz
  - packing/devtools/upper_bound_reports.py
  controls:
  - packing/tests/test_upper_bound_reports.py
  notes: 'A separate complete repository replay is retained for n = 211: 1 positive and 2 duplicate-square
    and outside-container controls passed their required outcomes on both routes, 132930 pair decisions;
    summed over the 3 jobs, the receipt records 50.25 route CPU seconds and 69.01 job wall seconds, the
    longest job 23.77 seconds. Every positive clears every wall by at least 5.00e-21 and every pair by
    at least 9.99e-21.


    At n = 211 the certificate is below the case''s ceiling (Daniil Ostashev, T-149) by 2.79e-03; below
    T-098 (#375) (Daniel after de Winter) by 4.41e-03; below T-163 (Fang theorem inventory) (Kevin Fang)
    by 6.40e-03; below PR #574 (PingYou Ltd (BuddenPing)) by 2.79e-03; below #575 (Daniil Ostashev) by
    1.45e-04; below #583 (Francisco Couzo) by 9.29e-06; below #586 (Francisco Couzo) by 9.29e-06; below
    #593 (Mykhailo Polkovskyi (Mishapolk)) by 9.29e-06; smallest: this certificate.


    The source''s own checkers were not run here. The two maintained routes, the sqpack rational witness
    verifier and the independent rational corner checker, share certificate parsing, half-angle conversion,
    Fraction arithmetic and the separating-axis method. No two independent methods, human oversight or
    optimality is claimed.'
  next_rung: 'Review the retained replay, then register by the per-count rule: published at its first
    commit 487b058 (2026-10-14T17:45:39Z) with no issue, the certificate is 9.29e-06 below issue 586''s,
    the smallest earlier report, and below every other report and the case''s T-149. Final exact-head
    CI remains required.'
