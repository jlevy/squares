[workspace]
members = ["seam4d_core", "replay4d"]
default-members = ["replay4d"]
resolver = "2"

[workspace.dependencies]
rug = { version = "1.24", default-features = false, features = ["integer", "rational"] }
gmp-mpfr-sys = { version = "1.6", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
