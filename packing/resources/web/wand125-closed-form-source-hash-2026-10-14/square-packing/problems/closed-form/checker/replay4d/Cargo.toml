[package]
name = "replay4d"
version = "0.1.1"
edition = "2021"

[dependencies]
rug.workspace = true
gmp-mpfr-sys.workspace = true
serde_json.workspace = true
seam4d_core = { path = "../seam4d_core" }

[features]
prof = ["seam4d_core/prof"]
system-gmp = ["gmp-mpfr-sys/use-system-libs"]

[target.'cfg(target_os = "macos")'.dependencies]
gmp-mpfr-sys = { version = "1.6", default-features = false, features = ["use-system-libs", "force-cross"] }
