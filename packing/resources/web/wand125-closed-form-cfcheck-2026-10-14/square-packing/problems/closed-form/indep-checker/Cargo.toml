[package]
name = "cfcheck"
version = "1.0.0"
license = "MIT"
authors = ["Hiroaki Hosono (wand125)"]
description = "Independent exact checker for closed-form square-packing certificates."
edition = "2021"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1"

[profile.release]
overflow-checks = true
