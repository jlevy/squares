# Proposed register entries for jlevy/squares#610 (think-ribz, stage 3).
#
# Written by the #610 intake lane on 15 October 2026 for the records lane to apply, after
# the #594 import's T-184 and in its shape. The lane changed no register: results.yaml,
# evidence.yaml, source-coverage.yaml, result-requests.yaml, intake-watch.yaml, the
# bibliography, the resources README, SYNOPSIS.md and the case records are untouched,
# because other records pull requests are open. T-NNN stands for the id the records lane
# takes in the commit that registers it; 'YYYY-MM-DD' is that commit's date. Once applied,
# the register is the record and this file is only the proposal; the records lane may
# delete it in that commit.
#
# The rung is the one the evidence supports as T-184's was: V0/C0, as reported. The
# triage's replay is complete, as #594's was when T-184 was registered at V0/C0: zmx2 over
# all 10,000 D4 roots and zm_mixed.py over all 304 sub-roots, each equal to the source's
# records, with two refused mutations and the wall control, in receipts/. It is not yet
# evidence. What the rung still needs, by T-184's next_rung: the reproduction recorded as
# an evidence entry, which wants case 95 registered in devtools.replay_evand_zmx2 and
# devtools.audit_evand_mixed_covers (the W7 slice think-ribz names, shared with #594), and
# a stage 4 review with no blocking defect; then V3/C3, reproduced with the producer's
# code. zmx2 --full is not part of it (think-eucc). No case record changes: the entry is
# pending adoption at n = 95 while wand125's 1993/200 (T-091, the sqverify-fast replay)
# holds both lower lanes of n-095.md.
#
# At n = 96 the cover gives s(96) >= 10 by monotonicity. T-081 already registers
# s(96) = 10 (k = 10 of s(k^2 - 4) = k, V0/C1), so by the register table of
# result-import.md there is no new entry and no change of scope: T-081's claim gains the
# sentence under t081_claim_addition below. n = 97 to 99 are proved on both lanes and
# n = 100 is the grid; s(94) is untouched, since the total is above 94.

results:
  - id: T-NNN
    kind: optimality
    registered: 'YYYY-MM-DD'
    headline: '`s(95) = 10`, by a mixed cover of points and grid-line segments, reported'
    claim: >-
      Benjamin Greff reports s(95) = 10: the lower half by a mixed cover, the upper half by
      the 10 x 10 grid. It is the case k = 10 of the k^2 - 5 series, after T-066 (k = 8) and
      T-184 (k = 9).

      The cover is 48,352 weighted points and 11,438 axis-parallel segments of [0,10]^2 in
      Evan Daniel's mixed format, total 3791753447/40000000 = 94.793836175 < 95, exactly
      D4-invariant. Every closed unit square in [0,10]^2 captures mass at least one, so a
      packing of 95 at side below 10, scaled up to side 10, would capture at least 95.

      The source reports the covering statement decided by two of Daniel's checkers: zmx2,
      in outward-rounded binary64, on 9,981 of the 10,000 root cells of the D4 region, and
      zm_mixed.py, in exact rationals, on the 304 cells that tile the other 19. Its Lean
      wrapper on Daniel's Sqpack takes the covering statement as a hypothesis. Those
      statements are the author's.

      At retention here the cover's data facts were recomputed, zmx2 was replayed over all
      10,000 roots and zm_mixed.py over the 304 sub-roots from the bytes the source pins,
      each equal to the source's records, with two mutations refused: a reproduction with
      the producer's code, recorded in the packet and not yet as evidence, so the value
      stands as reported. The case record holds s(95) >= 1993/200 (wand125) until a review.

      Credit Benjamin Greff (https://github.com/bengreff/s95-certificate), building on Evan
      Daniel's method at margin zero, mixed format, checkers and Lean library, and on
      wand125's s(59) = 8 cover, reused for the corners, and band-insertion construction.
      Registration was requested in jlevy/squares#610. The source says the search, LP and
      verification pipeline were built and run with Claude (Anthropic) as an AI assistant,
      under the author's direction.
    scope: {n_values: [95]}
    verification: V0
    confirmation: C0
    significance:
      score: 3
      rationale: >-
        An exact value for a case that was open, by Daniel's recipe at a new count, as T-066
        and T-184 settled s(59) = 8 and s(76) = 9: a substantive case result, not a new
        technique or a family. The third instance of the k^2 - 5 series does not make it a
        family: each cross is re-optimised by LP, and nothing carries to another k.
      scored: '2026-10-15'
      by: the #610 intake lane (think-ribz; draft)
    novelty: previously-published
    attribution:
      source_keys: ['[bengreff s95 certificate 2026-10-15]']
      published: '2026-10-15'
    composition: >-
      Compound: the lower half is the reported cover (E-bengreff-610-cover-report), the
      upper half the grid (E-basic-grid-upper); the minimum is the lower half's.
    evidence:
      - E-bengreff-610-cover-report
      - E-basic-grid-upper
    artifacts:
      - packing/resources/web/bengreff-s95-certificate-2026-10-15/README.md
      - >-
        packing/resources/web/bengreff-s95-certificate-2026-10-15/s95-certificate/cover/s95_cover_v2.txt.gz
      - packing/resources/web/bengreff-s95-certificate-2026-10-15/s95-certificate/README.md
      - >-
        packing/resources/web/bengreff-s95-certificate-2026-10-15/receipts/n95_cover_audit.json
      - packing/resources/web/bengreff-s95-certificate-2026-10-15/receipts/n95_zmx2_d4.log
      - >-
        packing/resources/web/bengreff-s95-certificate-2026-10-15/receipts/n95_triage_checks.log
    next_rung: >-
      C3 needs the retained zmx2 and zm_mixed.py reproduction recorded as evidence, with
      case 95 registered in devtools.replay_evand_zmx2 and
      devtools.audit_evand_mixed_covers, and a review that reads the cover, the two
      checkers' composite over the D4 region and the 404 wall segments.
    unfinished_confirmations:
      - what: >-
          an adversarial review of the cover, the zmx2 and zm_mixed.py composite over the D4
          region and the reduction, recorded under docs/project/reviews/
        rung: C1
        link: think-ribz
    notes: >-
      V0 because the cited lower-half entry is the source's public claim, assurance
      reported. C0 because no review is on file; the retention's reproduction of the
      source's two checkers is in the packet's receipts. The case lanes are unchanged, so
      the entry is pending adoption at n = 95 while wand125's 1993/200 holds the lower
      lanes. At n = 96 it gives s(96) >= 10 by monotonicity, which T-081 registers already.
      No full zm_mixed.py pass over the 160,000 D4 roots is at the pinned revision
      (think-zn7s), and the Lean wrapper is unbuilt here (think-ojr9).

