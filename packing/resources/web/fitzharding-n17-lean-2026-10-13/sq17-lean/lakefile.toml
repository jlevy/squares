name = "sq17-lean"
version = "0.1.0"
defaultTargets = ["Sq17Lean"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Sq17Lean"
roots = ["Sq17Lean.Square17Optimality"]
