name = "sq19-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Sq19Lean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Sq19Lean"

[[require]]
name = "sq17-lean"
git = "https://github.com/ofitzharding/sq17-lean"
rev = "0a7167efa8dcae7fa73855890630fb7e2de550ed"

# The 17 project's half-plane checker modules, compiled in place from the pinned package (not copied). Its own
# library declares only the final theorem as a root, so its other modules are not importable through it.
[[lean_lib]]
name = "Sq17Checker"
srcDir = ".lake/packages/sq17-lean"
globs = ["Sq17Lean.+"]

# Preserve the module names used by the verified certificate replay.
[[lean_lib]]
name = "Sq19EndgameChecks"
srcDir = "s19/certificates/endgame_reduction/canonical"
roots = [
  "Shard0000", "Shard0032", "Shard0064", "Shard0096", "Shard0128", "Shard0160",
  "Shard0192", "Shard0224", "Shard0256", "Shard0288", "Shard0320", "Shard0352",
  "Shard0384", "Shard0416", "Shard0448", "Shard0480", "Shard0512", "Shard0544",
