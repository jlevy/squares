name: 新支撑完整复验 / Complete new-support replay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 公开目录检查 / Public-tree audit
        run: python3 -B verifier/audit.py --check
      - name: 依赖可用性 / Dependency availability
        run: |
          if ! test -f /usr/include/boost/rational.hpp; then
            sudo apt-get update
            sudo apt-get install -y libboost1.83-dev
          fi
      - name: 全域证明与精确对偶 / Full cover and exact dual
        run: python3 -B verifier/run.py --output "$RUNNER_TEMP/replay" --workers 4
      - name: 归档与复查 / Archive and audit
        run: python3 -B verifier/audit.py --package --runtime "$RUNNER_TEMP/replay" --output "$RUNNER_TEMP/publication"
      - name: 已复跑成果 / Replayed results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n40-6718-${{ github.sha }}
          path: |
            ${{ runner.temp }}/publication/n40-6718.zip
            ${{ runner.temp }}/publication/n40-6718.zip.sha256
            ${{ runner.temp }}/publication/audit.json
          retention-days: 30
          if-no-files-found: error
