results.yaml:
  id: T-NNN
  kind: upper-bound
  registered: '2026-10-14'
  headline: A smaller packing of 146 squares from Evan Daniel's chain search, started from Ryan Xu's packing,
    certified exactly
  claim: 'One complete rational source certificate reports a finite upper-bound improvement at the exact
    side it states: s(146) <= 12.583782190151860342292508597077. Complete native feasibility outcomes
    are retained separately; the selected standing case is unchanged pending independent review and record
    review.


    The author reports that his two exact rational checkers, verify_cert.py (separating axes) and verify_cert2.py
    (polygon intersection), accept the certificate and its regularized drawing. The side is the 80-digit
    KKT point S* = 12.58378219015186034216... scaled by 1 + 1e-20 about the origin corner; the source
    reports a local minimum strict modulo 59 exact flat motions, 69 corner-corner contacts with no corner-corner
    MILP descent, and 13 rattlers, and measures it against #505''s packing as a different local minimum
    that agrees to about 1e-7 except a cluster of 10 squares tilted near 42 degrees. Those are numerical
    evidence, as the source says, not proofs. No source program ran here.


    Credit Evan Daniel (https://github.com/evand/square-packing), whose chain search found the packing
    in a time-travel test started from the public packings of 10 October, and credit Ryan Xu''s packing
    of 146 (issue 432, T-125) as its start, as the author asks: two random large perturbations of it and
    a re-polish, then one exact descent step. The author names Robert Barnett''s refinement (T-150, issue
    505) as the record it improves and calls the result a different local minimum from it. The search,
    the checks and the request were done with Claude (Claude Code), which Evan Daniel directed and reviewed.'
  scope:
    n_values:
    - 146
  verification: V0
  confirmation: C0
  significance:
    score: 2
    rationale: A smaller finite construction side at n = 146, 1.38e-08 below the case ceiling; no lower
      bound or optimum.
    scored: '2026-10-14'
    by: think-rvv7 Evan Daniel import
  novelty: previously-published
  attribution:
    source_keys:
    - '[Daniel n146 2026-10-14]'
    published: '2026-10-14'
  evidence:
  - E-evand-606-n146-report
  artifacts:
  - packing/resources/web/evand-n146-2026-10-14/README.md
  - packing/resources/web/evand-n146-2026-10-14/acquisition/claims.json
  - packing/resources/web/evand-n146-2026-10-14/source/search/packer/candidates/tt2_n146.cert
  - packing/resources/web/evand-n146-2026-10-14/receipts/exact-certification.json.xz
  - packing/devtools/upper_bound_reports.py
  controls:
  - packing/tests/test_upper_bound_reports.py
  notes: 'A separate complete repository replay is retained for n = 146: 1 positive and 2 duplicate-square
    and outside-container controls passed their required outcomes on both routes, 63510 pair decisions;
    summed over the 3 jobs, the receipt records 21.14 route CPU seconds and 21.33 job wall seconds, the
    longest job 7.24 seconds. Every positive clears every wall by at least 5.00e-21 and every pair by
    at least 9.99e-21.


    At n = 146 the certificate is below the case''s ceiling (Ryan Xu, improved by Robert Barnett, T-150)
    by 1.38e-08; below T-101 (#375) (the Kingbird catalogue, verified by Evan Daniel''s exact ceiling)
    by 1.71e-02; below T-125 (#432) (Ryan Xu) by 8.74e-08; below T-146 (no issue) (Evan Daniel) by 8.73e-08;
    below T-168 (#566) (PingYou Ltd) by 1.38e-08; below T-174 (PR #574) (PingYou Ltd) by 1.38e-08; below
    #593 (Mykhailo Polkovskyi (Mishapolk)) by 1.38e-08; smallest: this certificate.


    The source''s own checkers were not run here. The two maintained routes, the sqpack rational witness
    verifier and the independent rational corner checker, share certificate parsing, half-angle conversion,
    Fraction arithmetic and the separating-axis method. No two independent methods, human oversight or
    optimality is claimed.'
  next_rung: 'Independently review the retained replay, then decide adoption at 146: the certificate is
    below the case''s ceiling (T-150) by 1.38e-8 and below every report at 146, PR 574''s T-174 included.
    Final exact-head CI remains required.'
