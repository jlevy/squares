# The citation fields a generator needs, keyed by the source keys the frontier records
# use. The Markdown tables in README.md stay the human index; this file holds only what
# a line of citation text is built from, for the keys something cites.
# `devtools.build_bound_citations` reads it, and `tests/test_bound_citations.py` checks
# that every key here is defined in README.md and that a paper's year and authors agree
# with the Papers table there.
#
# `authors` are surnames as a citation prints them, in the source's own order; `year` is
# null where the source carries none (a maintained web page); `venue` is the short form
# printed after them, and `short_venue`, where given, the shorter one a line falls back to
# when this project's "(confirmed, T-NNN)" would not otherwise fit. `credit`, where given,
# is printed in place of the joined authors, for a source whose credit is joint with the
# lineage it builds on: last names, or handles where no name is published, this project
# as "Square Packing Project (Levy)" where that fits and "Levy" where it does not, never an AI
# agent, and every link the source names. Where `credit year, venue`, or the line with this
# project's note, would not fit the atlas stage's 66 characters, `short_credit` is what the
# stage prints instead: the same authors, `after`, the first of the same links, and
# `et al.` (`Tokoharu after Levy, wand125 et al.`). Only the atlas stage shortens, and the
# explainer's figure, which prints the stage's own line; every other renderer prints
# `credit` whole. `devtools.build_bound_citations` checks both the
# width and that shape. `lineage`, required on the source of a result
# by others published on or after 22 August 2026, is `builds-on-project`,
# `credits-project` or `independent`, as the source's own attribution files say; the
# policy is epistemics.md, Results by Others. A web source's authors are
# not in the README's Web Sources table, so its `note` says which retained bytes they
# were read from.
