      sharpens the fundamental lemma of Roth and Vaughan (1978). The README and the
      preprint name Ryu as sole author and say the work was developed with extensive
      assistance from Claude (Anthropic), including the proofs, the text, the programs
      and the computation for Lemma 4.10, and that it is not peer reviewed. Code and data
      MIT, the paper CC BY 4.0. Retained whole in
