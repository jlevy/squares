      (https://x.com/ojoshe/status/2107513739222380935), calling it "a Lean formalization
      from @ManassehA06 assembled over the last few days, with assistance from @ctjlewis
      @guzhou0806 and others"; both posts are retained in the intake's
      receipts/announcement/. Authors as read from ACKNOWLEDGEMENTS.md: Queuingtheorydotcom (the underlying
      computer-assisted proof, and the formalization's development and integration),
      EvolvingPrograms and ctjlewis (verification infrastructure and the complete replay),
      wand125 (n11-optimality-lean, certificate checkers, generated proofs), Benjamin
      Gurevitch (T03), Julian-JJ (running the proof on an HPC cluster) and Guzhou0806
      (proof, transport and verification work); it credits jlevy/squares for the exact
      packing formulas, Evan Daniel for the square-packing definitions, and Walter Trump
      for the packing. No licence at the root; MIT notices for the incorporated wand125
      and Daniel work. Retained intake: web/queuingtheorydotcom-n11-lean-2026-10-06/.
