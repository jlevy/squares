- id: geometry
  command: packing-validate --geometry
  # The other half of the `checks` queue, and the entry that carries the arithmetic for
  # the split. Local, 2026-09-06, four cpus, `--checks --jobs 4 --inner-jobs 1` over the
  # undivided 57 steps: 545.08s of step time. These nine are 275.48s of it -- the n=5
  # identity pair 62.62s, historical regressions 42.35s, the decimal route 39.43s, the
  # SVG renderer 39.36s, small-n exact models 28.34s, Trump's cones 20.94s, the
  # independent LP 15.84s, the basin atlas 13.94s, the basin event replay 12.66s -- which
  # leaves 269.60s in `checks`. Two halves within two per cent of each other.
  #
  # Measured at the reference shape on the same box: 93.27s of wall over 243.81s of step
  # time, `--geometry --jobs 3 --inner-jobs 1`, 2026-09-06 -- against `checks`' 86.20s
  # over 244.77s, which is what a balanced split is supposed to look like. This job
  # compiles nothing: none of the nine is `needs_engine` and none runs cargo, so it skips
  # the serial `cargo build --release` that `checks` pays and its wall is step time
  # divided from the first second. Its longest single step is historical regressions at
  # 42.73s, well under the 81s the queue divides to, so this tier does not set its own
  # floor either.
  #
  # 180s is 1.75x the current 102.73s hosted mean. It clears a runner a third slower
  # (about 137s), stays inside the pull-request wall, and remains below the 243.81s of
  # step time this tier costs if its pool stops parallelising -- the regression a
  # ceiling on an outer-parallel tier is actually for.
