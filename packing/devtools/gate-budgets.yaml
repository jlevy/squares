- id: suite_b
  command: packing-validate --suite-b
  # 154s, and the first ceiling this entry has set for itself. The three before it were
  # all 180: OR-14's pull-request wall, borrowed as an absolute bound because a shard
  # job's wall is a share of that wall. That is the loosest a per-tier ceiling can be --
  # it says only that this one job of seven may spend the whole surface's budget -- and
  # `OR-17` is the rule that a routine gate carries a ceiling of its own rather than the
  # surface's. 26s of the pull-request wall go back to the surface with it.
  #
  # 154s is 1.50x of the record below, which is where the drift rule already sits
  # (154.37s). The two bounds coincide on purpose, the way the `fast` entry argues: an
  # absolute ceiling looser than the record-relative rule never gets to speak, and one
  # tighter than it fails a run the drift rule was willing to explain. Rule 2 would
  # permit 205s; the tier has no use for it.
  #
  # It is a band and not a target, and the band is the runner pool's rather than the
  # tier's. This tier has no known cost -- it has a distribution, and 2026-09-21 measured
  # it directly. Three runs of one byte-identical shard that day, 3,140 passed and 6
  # skipped each time, read 73.90s, 74.98s and 133.81s, on 240.2, 240.2 and 449.9
  # test-seconds of accumulated test time. 1.81x, on work that did not change at all.
  # So the record is placed at the centre of what five readings span and both edges are
  # what is left: 1.15x of margin above the slowest wall this tier has read and 1.20x
  # below the fastest. Those margins are thin, and they are the honest width of the
  # pool -- `think-be1s` is the recorded band that would replace a recorded point, and
  # `D-472` is why neither edge of this one may be bought by moving the record toward
  # the other. What the absolute number still adds is the failure the ratios cannot see:
  # 154s is well under the 240-450 test-seconds this shard accumulates, so the job still
  # fails here if `-n 4 --dist=loadfile` stops dividing, which is the regression an
  # absolute ceiling on a pre-collection shard is actually for.
  #
  # 2026-10-01: 154 s stands, at 1.35x of the record below. The day's eleven readings
  # all held it (139.35 s the slowest); the shard they measured is retired by the
  # four-way partition recorded that day (`suite_d`), which packs this shard at 327.9
  # of 1,213.6 recorded test-seconds, about 98 s predicted, so the ceiling is about
  # 1.57x of what the first hosted cohort of the new partition should read.
  # 2026-10-05: 168 s, raised from 154 s by the owner's decision of 2026-10-05 under
  # think-p684, and selected on purpose, as `OR-17` requires of anything above a routine
  # ceiling. PR 347 adds 133.9 recorded test-seconds to the behavioural lane, about 10%:
  # the n17 stack's median four-shard sum is 505.5 s against main's 464 s, a slow runner
  # needs about 558 s of the 570 s the four shard ceilings allowed, and 16 of 24 stack
