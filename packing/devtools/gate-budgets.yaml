# The deep gate's hosted jobs, clocked the way the tiers above are clocked (`OR-17`).
#
# Why this section exists, in one measurement. `deep-gate.yml` and
# `test_deep_gate_workflow.py` price the exhaustive tier at 1943.05s -- the figure that
# refused its promotion into `--fast`. On 2026-09-21 the job that runs it cost 2674s on
# two complete deep-gate runs of PR 208, 1.38x its own declared price. That is under the
# 1.5x that fails a local tier, and it was read by nothing at all: the rules above judge
# `packing-validate`'s own wall, and a hosted job's wall was judged by no rule in this
# file. A tier does not become unbounded by being deferred.
#
# Read it:    ... python -m devtools.check_ci_gate_walls --gate deep-gate --run-id N
# Record it:  ... python -m devtools.check_ci_gate_walls --gate deep-gate --sample --recent 8
#
# Same four rules and the same `policy` block, with one substitution: `drift_ratio` is
# per gate, because the policy's 1.5x was measured against local tiers and these walls
# are not local tiers.
#
# WHAT THE BAND IS CHOSEN AGAINST, which is the one thing this section would get wrong if
# it were copied from the tiers. A hosted wall carries the queue, the checkout and the
# toolchain, and it is drawn from a pool of machines that are not the same speed. Both
# halves were measured on 2026-09-22 from the retained `validation-timings-*` artifacts
# rather than assumed:
#
#   * setup is negligible here. On run 35579234418 `exhaustive-tier` spent 23s of its
#     2674s on `Set up job`, checkout, uv and `uv sync`, 67s queueing before the job
#     started at all, and 2648s inside the gate step. A 45-minute job does not have a
#     setup problem, and the split is printed on every run so that stays checkable.
#   * the runner is not negligible. Run 35480905141's `exhaustive-tier` ran the SAME 58
#     tests as run 35579234418's -- none added, none removed, compared by name across the
#     two JUnit records -- and every one of them was slower on the second: 1836.1s of
#     test time against 2621.4s, a uniform 1.43x. `deferred-steps` tells the same story
#     over its eight steps between runs 35012089923 and 35579234418: the same eight
#     names, 1543.5s against 2435.7s, 1.58x, each step between 1.49x and 1.76x.
#
# So the 1.38x is not drift. About 1940s is what this job costs on the faster class of
# hosted runner and about 2650s is what it costs on the slower one, and the declared
# 1943.05s was one reading of a two-class pool written down as the job's cost. The
# same-tree control says it from the other side: runs 35632055808 and 35627075872 are the
# identical commit 030d109a and read 2608s and 2771s, 1.06x apart.
#
# `measured_seconds` is therefore the geometric mean over the runner mix rather than one
# reading, with the observed `spread` and the readings themselves beside it. The cost of
# that honesty is stated rather than hidden: a single hosted reading cannot separate a
# 1.5x regression from a slow draw. `drift_ratio: 1.25` sits above the largest reading
# any job has shown against its own record (1.12x, `deferred-steps`) with margin, and
# below the 1.5x that fails a tier, so a real 1.5x regression fails on a typical draw and
# is missed on a fast one. That is the limit of a one-run rule, not a claim about this
# gate; what removes it is a recorded median over samples, which `pull_request_walls`
# already has and `think-haam` owns for these.
#
# `enforcement: reporting` for the reason `pull_request_walls` went advisory on
# 2026-09-17. A false red on a 45-minute pre-merge gate costs another 45 minutes to
# clear, and a gate people cannot afford to re-run is a gate that stops reporting
# (`OR-14`). Every band is measured, diagnosed and printed; none of them fails the run.
#
# And the number this section deliberately does not make red: 2540.6s of gate wall is 42
# minutes on the merge path, which `OR-17` says is unacceptable whatever a band says. The
# ceiling belongs around the measurement and the target belongs in the agenda (`OR-14`),
# so those 42 minutes are `think-haam`'s to remove and not this file's to fail.
ci_gates:
- id: deep-gate
  file: .github/workflows/deep-gate.yml
  aggregate: deep-gate-required
  selected_by: >-
    The `deep-gate` label on a pull request, or a `workflow_dispatch`. `OR-17` requires
    the selection to be per invocation and recorded; a label is recorded but it is not
    yet a statement of the evidence wanted, which is the gap `think-haam` closes.
  reference: {runner: ubuntu-latest, cpus: 4}
  drift_ratio: 1.25
  enforcement: reporting
  tracking_bead: think-haam
  reporting_reason: >-
    First landing of a hosted-wall band on the pre-merge path, on a gate whose own
    runner spread is 1.47x. Reporting until think-haam has a median over samples to
    judge against; an enforcing band built on one reading would fail runs for the
    machine rather than for the change.
  argument: >-
    The deferred surface, run against a pull request before it merges. Its workers preserve
    every deferred Step; only the exhaustive Step repeats across three disjoint file shards,
    which `test_the_deep_gate_runs_exactly_what_the_pull_request_surface_defers` holds.
    The aggregate has no entry: it is four seconds of `test` commands, and putting a
    four-second script under the same band as a 44-minute tier measures nothing.
  wall:
    measured_seconds: 1133.0
    measured_on: '2026-09-29'
    measured_where: >-
      Workflow dispatch run 36636552951 at 9174140a, testing merge
      0376416ec9ab3220bb87e52888ddb72919d3e861; run start to last gating job.
      One complete observation; declared workers total 7408 seconds (123.47 runner-minutes).
    # One reading gives sample max/min = 1.00; runner-to-runner variance is unknown.
    spread: 1.00
    ceiling_seconds: 1900.0
    argument: >-
      The first complete fanout measured 1133s of wall and 7408 declared worker-seconds
      on run 36636552951. The 1900s reporting ceiling is 1.68x that single reading,
      within the 2x headroom rule; runner spread and a repeat-run baseline remain unknown.
      The predecessor topology's eight-run 2540.6s record stays in history below and is
      not a like-for-like speedup control.
    history:
    - measured_seconds: 2540.6
      measured_on: '2026-09-22'
      measured_where: >-
        In order, run 35632055808, 35627075872, 35579234418, 35480905141, 35213757305,
        35078581840, 35012089923 and 34997041426, read by `devtools.check_ci_gate_walls`
        on 2026-09-22 and reduced to their geometric mean.
        Each reading is the run starting to its last gating job completing: 2611, 2773,
        2762, 1882, 2590, 2635, 2581 and 2618 s.
  jobs:
  - id: resolve-tree
    measured_seconds: 17.0
    measured_on: '2026-09-29'
    measured_where: Workflow dispatch run 36636552951 at 9174140a; one complete reading.
    spread: 1.00
    ceiling_seconds: 30.0
    argument: >-
      Resolves a moving dispatch merge ref once. The first hosted wall was 17s; the
      30s reporting ceiling is 1.76x that reading and replaces a predecessor-derived
      36s estimate that would exceed the 2x headroom rule.
  - id: deferred-threshold-1440
    measured_seconds: 778.0
    measured_on: '2026-09-29'
    measured_where: Workflow dispatch run 36636552951 at 9174140a; one complete reading.
    spread: 1.00
    ceiling_seconds: 1150.0
    argument: >-
      One whole threshold replay, with its prior process shape unchanged. The first
      hosted wall was 778s. The 1150s reporting ceiling was derived from predecessor
      run 35579234418 Step time (695.757s), its 24s setup, and prior runner spread;
      it is 1.48x this single new-topology reading.
  - id: deferred-atlas-grid
    measured_seconds: 475.0
    measured_on: '2026-09-29'
    measured_where: Workflow dispatch run 36636552951 at 9174140a; one complete reading.
    spread: 1.00
    ceiling_seconds: 900.0
    argument: >-
