      has also read over 180 s on PR 188 itself (182 s, run 35182460356), so it is
      reported rather than enforced until think-g4n9 re-enforces both walls.
    argument: >-
      The page build and browser checks through pages-required. Saved-font variants run
      in two bounded pairs so the slow WebKit cell no longer carries four serial draws.
    kinds:
    # 2026-09-17: replaced PR 180's single reading, 189 s on run 35078515689, measured
