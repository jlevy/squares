    ceiling_seconds: 8.0
    argument: The same notice for the workbench half.
  - id: pages-required
    measured_seconds: 3.0
    measured_on: 2026-09-16
    measured_where: run 35050591623, job 104650434209, on the exact PR head
    ceiling_seconds: 6.0
    argument: >-
      The required-check aggregator. It runs under `always()` even though it needs jobs
      that are intentionally dispatch-only, so it is part of the pull-request surface
      and must be budgeted with the jobs whose results it reduces.

# The wall is the run start through the start of the wall-check step inside the job that
# aggregates every required prerequisite. It therefore includes prerequisite queues,
# checkout, setup, work and artifact transfer, plus the aggregator's queue, blobless
# checkout and pinned Python setup, without including the check itself. The absolute
# budget is OR-14's 180-second outer edge. The recorded medians below are PR 188's
# exact-head readings at that wall-step-start endpoint, at be28ad5a and 16d5e14d.
#
# `enforcement` is `enforcing` when absent. `enforcement: advisory` keeps the wall
# measured, diagnosed and reported on every pull request, but a wall over its budget or
# regression ratio warns instead of failing the aggregator. It must name a
# `tracking_bead` and an `advisory_reason`; `devtools.check_gate_budgets` refuses one
# whose bead is closed or unknown, and an enforcing wall may name neither. Nothing
# else is relaxed: an unmeasurable run, a missing prerequisite and a malformed entry
# still fail, and the budget stays at OR-14's edge. On 2026-09-17 the owner made both
# walls advisory under think-g4n9, after five hosted Packing walls on PR 188 read 194,
# 189, 178, 166 and 216 s: runner speed varied 1.6-1.8x on identical code, and the
# frontend job alone ran 158-180 s. think-g4n9 switches both back once five consecutive
# exact-head hosted runs hold both walls at or under 180 s.
pull_request_walls:
  policy:
    regression_ratio: 1.2
    min_samples: 15
    main_branch: main
    setup_steps:
    - '^(Set up job|Complete job)$'
    - '^Post '
    - '^Check out '
    - '^Install '
    - '^Synchroni[sz]e '
    - '^Cache '
    - '^(Use|Share) the prepared '
    - '^Download '
    - '^(Preserve|Retain|Upload) '
  workflows:
  - id: packing-validation
    file: .github/workflows/packing-validation.yml
    aggregator: packing-required
    not_gating: [macos-portability]
    budget_seconds: 180.0
    enforcement: advisory
    tracking_bead: think-g4n9
    advisory_reason: >-
      Owner decision 2026-09-17: five hosted runs read 194, 189, 178, 166 and 216 s on
      1.6-1.8x runner variance, so the wall is reported rather than enforced until
      think-g4n9 holds it at or under 180 s.
    argument: >-
      The required Linux pull-request surface. The two suite shards use the recorded
      pre-collection partition, and the type floor has its own runner; packing-required
      waits for every lane and judges this wall.
    kinds:
    # 2026-09-17: replaced PR 180's single reading, 208 s on run 35078515837, measured
    # 2026-09-16 to the predecessor aggregator-start endpoint. A kind record keeps no
    # history, so the superseded reading is kept here.
    - kind: main
      median_seconds: 175.5
      measured_on: '2026-09-17'
      samples:
      - {run: 35182460400, seconds: 168}
      - {run: 35187007544, seconds: 183}
  - id: certificate-page
    file: .github/workflows/pages.yml
    aggregator: pages-required
    not_gating: []
    budget_seconds: 180.0
    enforcement: advisory
    tracking_bead: think-g4n9
    advisory_reason: >-
      Owner decision 2026-09-17 covers the pull-request wall generally, and this wall
      has also read over 180 s on PR 188 itself (182 s, run 35182460356), so it is
      reported rather than enforced until think-g4n9 re-enforces both walls.
    argument: >-
      The page build and browser checks through pages-required. Saved-font variants run
      in two bounded pairs so the slow WebKit cell no longer carries four serial draws.
    kinds:
    # 2026-09-17: replaced PR 180's single reading, 189 s on run 35078515689, measured
    # 2026-09-16 to the predecessor aggregator-start endpoint. A kind record keeps no
    # history, so the superseded reading is kept here.
    - kind: main
      median_seconds: 176
      measured_on: '2026-09-17'
      samples:
      - {run: 35182460356, seconds: 182}
      - {run: 35187007572, seconds: 170}
