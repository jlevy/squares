  # pull-request ceiling the stack overran rises about 9% together (A and D 131 -> 143 s,
  # B and C 154 -> 168 s, frontend 150 -> 165 s, checks 140 -> 150 s). The 12 s per-test
  # wall, the suite_files planning capacities 131/154/154/131 (frozen weights of the
  # recorded assignment, not ceilings) and every recorded cost below are unchanged.
