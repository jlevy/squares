- id: sweeps
  command: packing-validate --sweeps
  # Measured rather than argued from the parts since run 34010470187: `--sweeps --jobs 4
  # --inner-jobs 1` was 110.66s of wall over 313.95s of step time -- the translation-escape
  # screen 110.66s, the known-best chunk census 90.38s, the known-best atlas 75.88s, the
  # prospective seed 37.03s. Four units on four cpus, so the wall is the longest unit's
  # wall exactly, and 78.5s is what an evenly divisible 313.95s would have cost.
  #
  # 240s, down from the 430s argued when the prospective seed was thought to be 213.2s.
  # That is 2.17x of the reading, and it is below the 313.95s this tier costs if the pool
  # stops parallelising -- so serial degeneration fails here instead of passing.
  #
  # Local, 2026-09-06, at the old `--inner-jobs 1` shape with other agent lanes on the
  # same four cpus: 141.30s, of which the escape screen was 141.27s -- the same shape as
  # the CI reading, one step being the whole wall, at a contended box's prices.
  #
  # The reference has since moved to `--inner-jobs 2`, and that is a change to this
  # tier's floor rather than to its schedule. `screen_translation_escape` was given a
  # process pool on 2026-09-06 but the pool reads `PACK_JOBS`, which this job was setting
  # to 1, so the parallelism was dormant. Best of five rounds on a four-cpu box: 103.94s
  # at one worker, 52.11s at two, 35.40s at three, 27.50s at four. Two rather than four,
  # because the outer pool already has four slots on four cpus and a fifth process is the
  # oversubscription that cost `checks` thirty to eighty per cent per step at `--jobs 4`.
  # Of the eleven modules this tier runs, only that one imports `sqpack.workers`, so the
  # blast radius of the flag is exactly one step -- checked per process rather than by
  # eye, since a transitive import would be invisible to a grep of the four entry points.
  #
  # Measured whole at the new reference shape, 2026-09-06, four cpus: 79.52s of wall over
  # 220.37s of step time -- the chunk census 79.51s, the escape screen 65.27s, the
  # known-best atlas 50.52s, the prospective seed 25.07s. 65.27s rather than the 52.11s
  # of the isolated round, because two inner workers beside three other outer steps is
  # not two workers alone; that gap is the same contention the `checks` table above
  # prices, and it is why the flag is 2 and not 4. The screen is no longer this job's
  # longest unit either way: the census is, and it is now both this job's floor and the
  # floor under the whole pull-request surface.
  #
  # 240s stands through that. It is still below the roughly 258s of step time this tier
  # costs if the pool stops parallelising, so serial degeneration still fails here, and
  # it still has to hold whatever the escape screen costs on a bad day -- which is why it
  # is not tightened to the new prediction.
  #
  # Historical calibration of the former n=1..100, four-full-sweep workload: 108.91,
  # 108.62, 106.15 and 104.57s in runs 34023002068, 34032566385, 34037168378 and
  # 34040196689, plus 109.16s at c3a4e8ec in run 34164869950 and 58.38s at d6f0c403
  # in run 34166034785. Six-sample geometric mean 97.07455s (recorded as 97.07), spread
  # 1.87x. The two added runs shared the workload, jobs 4, inner_jobs 2, runner image,
  # Python version and successful dependency-cache key; hardware and load equivalence
  # remain unknown. This was a baseline refresh, with no optimization claim. Neither
  # that baseline nor its 194s ceiling calibrates the sampled n=1..324 tier below.
  #
  # --- 2026-09-07: the corpus tripled and two of these four steps are new -----------
  #
  # `KNOWN_BEST_CORPUS` widened from n=1..100 to n=1..324 -- 324 cases and 52,650
  # squares against 100 and 5,050 -- and the record above measures a tier that no longer
  # exists, for the third time in this entry's life and for the first time on a reason
  # that is not the gate's own. Measured on an idle ten-cpu box at this tier's own shape,
  # on commit `2841eec9`, with every reading retained under
  # `benchmarks/gate-cost-at-324/runs/`. Each is at n=1..324 under the step name the tier
  # carried that day -- the atlas step was still called `known-best n=1..100 atlas` when
  # it was clocked, and renaming it in a record of what it cost would misstate what was
  # measured.
  #
  #   `single-square translation escape screen`   766.26s  (110.66s at n=1..100)
  #   `known-best n=1..100 atlas`                 703.28s  ( 75.88s at n=1..100)
  #     of which `build_known_best_atlas --check`  691.19s
  #     the seven other subcommands                12.09s
  #   `known-best chunk census`                     40.03s (geometric mean of three)
  #
  # Two things follow, and the second is the one that keeps the coverage. The screen is
  # not merely dear: 766.26s is within 134s of the gate's own 900s per-step subprocess
  # timeout, on a box faster than the runner that timeout was set for. And the atlas step
  # is one member and seven passengers -- 98.3 per cent in `build_known_best_atlas
  # --check`, and five of the seven pinned at CALIBRATION_CORPUS by `D4` so they cannot
  # grow with the corpus at all.
  #
  # So the two re-derivations moved to the deferred surface and their record layers
  # stayed, as `known-best atlas records and sample` and `translation escape screen
  # records and sample`. Each rebuilds everything that is not per-case geometry and then
  # re-derives a fixed recorded sample of the cases; `think-lmlr` and
  # `test_the_pull_request_surface_defers_only_what_was_measured` carry the argument.
  #
  # The sample strides are set against this tier's floor rather than chosen. The floor is
  # `known-best chunk census`, which `D4` pins so it will not grow. Measured at
  # `PACK_JOBS=2` on the same box: the atlas sample 47.01s of wall over 86.81s of cpu at
  # every ninth case (36 of 324), and the screen sample 43.83s over 63.84s at every
  # twenty-seventh record (12 of 324). A screened record's work grows with the square of
  # n, which is why the two strides differ: the same 36 records cost 220.43s of cpu in
  # the screen against 86.81s in the atlas.
  #
  # Measured whole afterwards at this tier's shape on the same box, lightly contended:
  # 58.48s of wall over 145.39s of step time -- the atlas sample 58.48s, the screen
  # sample 44.65s, the census 42.11s, the retired prospective seed 0.15s. So the atlas
  # sample does set this tier's wall rather than sitting under the census, by about a
  # third of it, and the tier lands at 28 per cent of its ceiling. That is the headroom
  # the stride is allowed to spend and no more: a denser sample would start buying cases
  # the deferred rebuild already covers, at a tier wall that is not the surface's floor
  # in either case.
  #
  # `build_known_best_atlas` also gained the `--jobs` option the escape screen already
  # had, so `--inner-jobs 2` now reaches three of the four steps rather than one. On the
  # same idle box its whole check went 691.19s serial to 184.34s at four workers -- 3.75x
  # -- over 688.74s of cpu against the 691.19s the serial run spent, so the pool divided
  # the work rather than adding any, and `--check` still passed, which is what makes the
  # parallel build byte-identical rather than merely fast.
  ceiling_seconds: 210.0
  # Cleared, and the reason is the one that cleared 1369.60s and 409.0s from the `fast`
  # entry: the figure measured a tier that no longer exists. Two of these four steps are
  # new names running different work, so 107.05s is not a record of this tier, and
  # leaving it here would fail the stale rule on every honest run of the new one. The
  # gate prints the line to paste the first time it runs at the reference shape.
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 4, inner_jobs: 2, cpus: 4}
  argument: >-
    The pull request's record sweeps, on their own runner: the known-best atlas's record
    layer and a sampled rebuild, its chunk census, the prospective safe seed, and the
    translation-escape screen's record layer and a sampled replay. Each re-derives a
    retained atlas from the witnesses under it and compares it byte for byte, which is
    both why they are expensive and why they stay on every pull request -- a change that
    retains a witness or edits a source map is exactly what breaks them.
    Two things about this tier are worth not rediscovering. Its wall is one step's wall:
    four units on four cpus saturates the outer pool, so `--jobs` is already spent and
    the only lever left is the longest unit's own cost -- which is why `--inner-jobs 2`
    is set here and nowhere else on the surface, and why the floor it moves is the
    surface's floor. And this tier is what removes the contention that failed five
    ordinary tests against the quick lane's 5s per-test ceiling -- those tests were never
    slow, they were sharing four cpus with 468s of atlas rendering.
    210s stands through the 2026-09-07 re-scoping without being re-tightened, and that is
    a decision rather than an oversight. The predicted wall is the census's, near 90s on
    this runner, so a ceiling at 210s has real margin for a slow day; and it is still
    below the step time this tier costs if its pool stops parallelising altogether --
    about 400s once the two sampled steps lose their inner workers -- so serial
    degeneration fails here rather than passing quietly, which is the regression a
    ceiling on an outer-parallel tier is actually for. Tightening it against a prediction
    rather than a reading is what `OR-14` calls advertising an aspiration.

- id: push
  command: packing-validate --push
  ceiling_seconds: 1800.0
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 2, inner_jobs: 1, cpus: 2}
  argument: >-
    The edit tier plus the behavioural tests reachable from the change. Its cost is a
    function of the diff, and a change nothing narrower can be said about expands the
    selector to the whole non-exhaustive suite -- slow lane included, which is why this
    ceiling is `FAST_SUITE_BUDGET_SECONDS` and not the `fast` tier's. Left
    unmeasured deliberately: a tier whose cost depends on the diff has no single recorded
    figure, and inventing one would make the drift and stale rules lie.

- id: full
  command: packing-validate
  ceiling_seconds: 3600.0
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 2, inner_jobs: 1, cpus: 2}
  argument: >-
    The complete gate. Never clocked end to end on the reference runner in one piece -- CI
    splits it across jobs -- so only the ceiling applies, and it is argued from the parts
    rather than from another tier: the pull-request surface at 409s, the exhaustive tier
