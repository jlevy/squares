# Tier ceilings the gate enforces against its own wall clock.
#
# Why this file exists, in one measurement. On 2026-08-30 `packing-validate --fast` cost
# 499s and validate.py recorded that figure in a docstring, beside a 1800s cap. Six days
# later the same tier cost 1369.60s on CI (run 33982455466) and nothing objected, because
# 1370 is inside 1800 and because 499 was prose. A number a machine does not read is a
# number that drifts.
#
# So the number lives here, and the gate reads it. Every run of a whole tier compares its
# own wall against this register and fails when it is out of band -- in BOTH directions,
# because a record bounded only from above rots downward, which is exactly what happened
# to the 499.
#
# Read it:   uv run --frozen --all-extras --group dev packing-validate --budgets
# Check it:  uv run --frozen --all-extras --group dev python -m devtools.check_gate_budgets
#
# The four rules, all applied by sqpack/gate_budgets.py:
#
#   1. ceiling      wall > ceiling_seconds                    -> the run fails
#   2. slack        ceiling_seconds > max_headroom * measured -> the DECLARATION fails,
#                                                                without running anything
#   3. drift        wall > drift_ratio * measured_seconds     -> the run fails
#   4. stale        wall < stale_ratio * measured_seconds     -> the run fails, and prints
#                                                                the figure to write here
#
# Rule 2 is the one that would have caught 2026-08-30 on the day: 1800 against a measured
# 499 is 3.61x of headroom, and a ceiling with 3.61x of headroom cannot detect a 2.65x
# regression. It is a static check over this file, so it costs nothing and cannot be
# noisy. Rules 1, 3 and 4 need a clock and are enforced only on a run whose shape matches
# the tier's `reference`; every other run reports and does not fail. See the `policy`
# block below for what that buys and what it costs.
policy:
  # A ceiling more than this multiple of the tier's own recorded cost is not a ceiling.
  # 2.0 is chosen against the incident: it catches a 2.65x regression with margin, and it
  # tolerates a runner a third slower than the one that set the record.
  max_headroom: 2.0
  # A run this multiple of the recorded cost has regressed. The figure this comment used
  # to cite -- a contended box moving a tier by a quarter -- was measured on a development
  # box and is not what the hosted runners do. Two runs of identical code on 2026-09-06
  # put every step of the sweeps tier up about 1.35x, `known-best n=1..100 atlas` worst at
  # 1.39x on code no commit had touched. Against that, 1.5 has eight per cent of margin.
  # What buys the margin back is the baseline rather than the ratio: `measured_seconds` is
  # the geometric mean of the readings seen at the reference shape, not one sample and not
  # their maximum. The maximum was tried first and is worse in a way worth recording: it
  # puts the record at the top of the band, so it starves the stale rule by exactly as much
  # as it feeds the drift rule, and run 34037168378 -- a fast runner at 0.72 of the record
  # -- left `geometry` 1.21x from failing CI for being quick. The mean leaves both rules
  # about 1.35x. `D-472` is the entry, `think-be1s` the remaining work: a recorded band
  # beats a recorded point, whichever point is chosen.
  drift_ratio: 1.5
  # A run this far *below* the recorded cost means the record is stale in the flattering
  # direction. The run fails and prints the number to write, so nobody has to remember to.
  stale_ratio: 0.6
  # Under this wall, the ratios are measuring scheduler noise rather than the tier. The
  # ceiling still applies; the drift and stale ratios do not.
  min_wall_seconds: 20.0
  # A record may move this far above the lowest record since the last attributed rise.
  # Larger rises name the steps or files that grew, their costs, and the cause.
  max_unattributed_rise: 1.2
  attribution_required_from: '2026-09-16'
  # Rules 3 and 4 on a hosted pull-request run. `enforcing` when absent. `advisory` keeps
  # both rules computed, printed word for word and annotated on the run, and does not fail
  # the run for them; it must name a `tracking_bead` and an `advisory_reason`, and
  # `devtools.check_gate_budgets` refuses one whose bead is closed or unknown, as it does
  # for an advisory pull-request wall. Rule 1, the ceiling, is outside this block; its own
  # relaxation is `pull_request_ceiling` below. `--enforce-budget` overrides both for an
  # operator asking on purpose, and nothing a contributor runs by hand is a pull-request run.
  #
  # The measurement, 2026-09-30, read from the job logs of thirty-four pull-request runs
  # on twelve branches (`tests/fixtures/tier-walls/hosted-readings-2026-09-30.yaml`): the
  # `checks` tier read 59.4 to 137.1 s on unchanged steps, 2.31x, and shard C 62.96 to
  # 143.87 s, 2.29x, both at the reference shape with every test green. Four of those runs
  # failed on these two rules and nothing else -- PR #262 at 62.3 s (0.54x of the record),
  # PR #255 at 59.4 s (0.52x) and at 140.2 s (1.58x), PR #254 at 141.3 s -- and a re-run of
  # the identical commit at 106 s passed. The policy's window around a point is 2.5x
  # (drift_ratio / stale_ratio), the pool's spread on one day is 2.3x, and the spread keeps
  # producing new extremes (typecheck 1.63x, suite_b 1.81x, sweeps 1.97x, now 2.31x), so
  # the next widening fails the next honest run. A single hosted reading cannot tell a
  # slow draw from a slow change. What can: a median over several hosted readings, which
  # the `pull_request_walls` register already judges and `think-be1s` owns for the tiers,
  # or a wall normalised by the runner's own measured speed. Until one of those judges a
  # pull request, the ceiling is the rule a pull request is held to, and it held both
  # slow-fleet shard-C walls that day (170.3 s and 172.5 s against 154 s).
  pull_request_relative_rules:
    enforcement: advisory
    tracking_bead: think-be1s
    advisory_reason: >-
      Owner decision 2026-10-01 under think-53a2: on 2026-09-30 the checks tier read 59.4
      to 137.1 s and shard C 62.96 to 143.87 s across one day's hosted runs of unchanged
      work, 2.3x on identical code, and the drift and stale rules failed four runs with
      every test green. On a pull request both rules report and do not fail until
      think-be1s arms them against run-to-run spread -- a median over hosted samples or a
      runner-normalised wall -- rather than one reading; the ceiling is enforced throughout.
  # Rule 1 and the per-test call-wall rule on a hosted pull-request run. `enforcing` when
  # absent. `advisory` reports a ceiling breach, and a test call of 12 s or more, word for
  # word with a `Cost` warning, and does not fail the run for them, up to a hang detector:
  # a tier wall above `hang_ratio` times its ceiling, or one test call of
  # `per_test_hang_seconds` or more, still fails it. Main, scheduled and deep runs keep the
  # ceiling enforced, so the record and the ceiling still move only with evidence.
  pull_request_ceiling:
    enforcement: advisory
    tracking_bead: think-6erz
    hang_ratio: 2.0
    per_test_hang_seconds: 45.0
    advisory_reason: >-
      Owner decision 2026-10-05 in session 182. Of 36 red pushes to stack pull requests that
      day, 28 failed on a wall verdict alone with every test green (CI stabilization
      evaluation, 2026-10-05); the +9% raise of 3d89c6fa5 was breached again within hours,
      shard C at 171.2 s against 168 s on #356 (run 37380844925); hosted runner speed varies
      1.6 to 1.8x (think-g4n9) and 2.3x on identical code (think-53a2). A single hosted wall
      cannot tell a slow runner from a slow change, so on a pull request it reports until
      think-6erz judges the ceiling against a median or a runner-normalised wall.

# One entry per tier `packing-validate` can select as a whole. A tier with no entry here
# fails `devtools.check_gate_budgets`, so a new tier cannot arrive without a ceiling.
tiers:

- id: records
  command: packing-validate --records
  ceiling_seconds: 300.0
  # Never yet clocked at the reference shape. The gate prints the line to paste the first
  # time it runs there; until then only the ceiling applies.
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 2, inner_jobs: 1, cpus: 2}
  argument: >-
    Registries, generated views and declared contracts, and nothing that runs a solver.
    About 14s on a contended local box, so 300s is a hang detector rather than a target;
    the tier is bounded by what it contains, and what it contains is enumerated by
    `Step.records`.

- id: edit
  command: packing-validate --edit
  # Four times the only reading this tier has, and it is still the loosest edge in the
  # register per second of tier. Left as it is because rule 2 has nothing to say about a
  # tier with no record: the number to fix is a measurement, not a ceiling.
  ceiling_seconds: 240.0
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 2, inner_jobs: 1, cpus: 2}
  argument: >-
    Every floor and every record check, without the broad behavioural suite: 59.35s on a
    contended four-core box on 2026-09-05, never yet clocked on CI's two-core runner. So
    this ceiling is still an unmeasured one, and it is the last one in the register that
    is -- it says only that a tier of floors and record checks has no business taking a
    pull request's whole budget. It is a strict subset of `fast`, whose ceiling is
    measured, so it cannot be the looser of the two; what would make it a real band is a
    clock on the reference runner, and the run that first provides one prints the line to
    write here.

- id: fast
  command: packing-validate --fast
  # 210s, a band around the 140.79s below rather than a target. Built from the same three
  # edges the 550s was: it clears the quarter a contended runner adds (176s), it sits
  # under the drift rule's 1.5x (211s) so the ceiling never waits for a larger number than
  # the record-relative rule, and it leaves rule 2's slack real margin (which permits
  # 281s). 210s is 1.49x against the 2.0x allowed. The band is 69s wide on a 141s tier, so
  # it catches a regression of a half -- looser in ratio than the old 550/409 because the
  # tier is now small enough that runner noise is a larger share of it.
  # 700s, a band around the 502.3s below. The tier is not what it was when it measured
  # 177.02s: main promoted twenty-one steps into `--fast` on 2026-09-05, and two of them
  # cost more between them (468.11s) than the entire tier did before they arrived. That
  # is a deliberate coverage trade -- D-455 escaped through exactly that gap -- and it is
  # recorded here rather than argued with.
  #
  # 1.39x of the record, the same shape of band as before: above the quarter a contended
  # runner adds (628s), under the drift rule's 1.5x (753s) so the ceiling never speaks
  # after the record-relative rule, and inside rule 2's slack (1005s).
  #
  # Third figure this entry has held and the third re-scoping behind it: 1369.60s,
  # 409.0s, 177.02s, now 502.3s. The register has been right every time and the tier has
  # kept moving underneath it, which is what a cost register on a subsystem two sessions
  # are editing at once actually looks like.
  #
  # 600s from 2026-09-07, and the reason is that the tier lost its two most expensive
  # steps. `known-best n=1..324 atlas rebuild` and `single-square translation escape
  # screen` moved to the deferred surface and two sampled steps arrived; run whole on an
  # idle ten-cpu box at this reference's flags the tier is now 229.05s, of which the two
  # samples are 103.59s and 69.70s because `--inner-jobs 1` gives each pool one worker.
  # 700s against that is a hang detector rather than a ceiling. 600s is about 2.6x the
  # local reading, which is the room a tier nobody clocks on CI needs for a runner of
  # unknown speed, and it is still under the step time this tier costs serially. It is
  # not tightened further because no reading at the reference shape exists to tighten it
  # against -- that is a measurement to take, not a number to guess, which is `OR-14`.
  #
  # A third step left the same day and this ceiling did not move for it either. `exact
  # verification` now runs the grid replay sampled and `exact rational grid replay` runs
  # it whole on the deferred surface, which takes 30.61s of local step time out of this
  # tier -- the `checks` entry below carries the readings. The tier was not re-clocked
  # whole for it: a 229.05s reading that a step-time subtraction predicts at about 198s
  # is not a reading, and the number that matters here is still the missing one at the
  # reference shape.
  ceiling_seconds: 600.0
  # Cleared twice for the same reason, and the reason is a good one both times: the figure
  # measured a tier that no longer exists. BC-214 cleared 1369.60s (CI run 33982455466)
  # when it moved every test at or above QUICK_TEST_WALL_BACKSTOP_SECONDS out of the quick lane.
  # BC-218 cleared 409.0s (CI run 33985984585, job 101359470209, commit 88f7e5f8) because
  # `fast behavioral tests` no longer runs in one process: it asks pytest for one worker
  # per core, and the tier's wall stopped being that step's wall as a result.
  #
  # This is the reading that follows, and the tier is a third of what that 409s measured.
  # Two changes account for it: the shared atlas builds left the quick lane (306s -> 56s
  # locally), and the surface moved to `--jobs 3`, which took the wall from 170.58s to
  # 140.79s at 2.74x parallel against 1.87x.
  # 177.02s, not the 140.79s that stood here for one commit. That figure came from a
  # configuration this project no longer runs and could not have kept: the same shape gave
  # 192.26s on its next run and failed 19 tests against the 5s per-test ceiling, because
  # the quick lane was asking for one worker per cpu while two other steps ran beside it.
  # Recording the faster of two readings from an unstable configuration is how a band gets
  # set to a number the tier cannot hold, so the record is the stable configuration's.
  # Cleared a third time on 2026-09-07, on the same rule and a new cause: the corpus
  # widened to n=1..324 and the two sweeps that grew with it were split, so `--fast` is
  # not the union it was when 502.3s was taken. `known-best n=1..100 atlas` and
  # `single-square translation escape screen` left the surface for the deferred one and
  # two sampled steps arrived in their place; the `sweeps` entry below carries the
  # readings and the argument. The gate prints the line to paste the first time a run at
  # this reference shape measures the tier whole again.
  measured_seconds: null
  measured_on: null
  measured_where: null
  # The reference moves with the invocation it describes. A record taken at `--jobs 3`
  # cannot be compared against a `--jobs 2` reference, and leaving the old one here is how
  # a band stays permanently unenforced: every run reports "not the reference shape" and
  # nothing is ever judged. `cpus: 4` because that is what the runner reports and what the
  # quick lane sizes itself from, not what the tier of machine is nominally sold as.
  reference: {jobs: 3, inner_jobs: 1, cpus: 4}
  argument: >-
    Since 2026-09-06 no CI job runs this tier whole: a pull request now runs `checks`,
    `frontend`, `typecheck`, `geometry`, `suite_a`, `suite_b`, `suite_c`, `suite_d`,
    `sweeps`, and `measure_verifier` concurrently, and this is their union. The ten parts
    are where the live bands now are. It is still a real tier -- it is what a contributor
    runs before a block boundary, and it is the thing the ten parts have to add up to -- which is why
    it keeps a ceiling rather than being retired.
    The edit tier plus the behavioural tests under the per-test ceiling: every floor,
    every record check, and the quick lane. What it excludes is a rule rather than a list
    -- `fast behavioral tests` passes the ceiling to pytest as `--durations-min` and fails
    when a retained test reports at or above it -- so this tier cannot regress the way it
    did between 2026-08-30 and 2026-09-05 without a named test failing first.
    The ceiling is a measurement's band and not a target, which is the correction this
    entry carries. It read 240s, which is the operator's four minutes; that number is
    agenda-023's TARGET and belongs there, and BC-218 is the cell that has to reach it. A
    ceiling the tier fails on the day it is written measures nothing -- it advertises an
    aspiration, and it makes the gate red for a reason unrelated to any regression, which
    is how a check gets ignored.
    Why the 409s that stood here is gone rather than adjusted, and this is BC-218's whole
    finding. That figure was 408.09s of `fast behavioral tests` and 0.46s of everything
    else: `--jobs 2` had already absorbed the other 37 steps into the second lane, so the
    tier was not a queue of steps waiting on one runner, it was one step with the rest
    hidden underneath it. No arrangement of GitHub jobs shortens a wall of that shape -- a
    second job would repeat 11s of checkout, uv install and `uv sync` to run work that
    already costs nothing on the clock -- so the parallelism went inside the step instead.
    Measured on a four-core box, `PACK_JOBS=1`, over the same lane: 306.4s in one process,
    135.0s at `-n 4`. Two tests account for 121s of what remains, both of them shared
    cached builds that BC-214's split re-billed rather than tests that grew; with those
    121s removed the lane measured 56.6s at `-n 4`. They are named in
    `test_the_slow_marker_is_declared_only_by_measured_nodes` and deliberately not marked,
    because marking moves their failure to the deep surface instead of removing it.
    That is a different tier from the one 409s described, in the way that matters here:
    its wall is no longer any single step's wall, so the next number written here should
    be read as a whole-tier figure again and the drift rule will mean what it says.

- id: checks
  command: packing-validate --checks
  # Re-argued twice on 2026-09-06, and the second time is the one worth reading, because
  # it is the reading that refused the obvious move.
  #
  # When the behavioural lane first left for the former `suite` job, this tier was 57
  # steps of pure outer-parallel work with nothing large enough to floor it, so it was
  # given the freed
  # cpu: `--jobs 4` on a four-cpu runner. Run 34016999060 priced that at 198.22s of tier
  # wall over roughly 790 worker-seconds, against 221.70s for the three-worker job that
  # still had the 142.43s lane inside it. Removing the largest step on the surface and
  # adding a worker bought 23.5s, because saturating the runner inflated every step by
  # thirty to eighty per cent against the same steps at `--jobs 3` on the run before:
  # the perimeter 60.62s to 84.41s, exact verification 61.75s to 79.98s, the type floor
  # 40.37s to 72.31s, the SVG renderer 41.30s to 65.36s. So the reference here is back at
  # `--jobs 3`, with the fourth cpu left for the OS, for the pool-backed steps, and for
  # `build_n5_identity_pair`, which asks `ProcessPoolExecutor` for the whole machine.
  #
  # What actually shortens a queue that size is cpus, so the queue was halved: `geometry`
  # below is the other nine steps, on a runner of its own. Local, 2026-09-06, four cpus,
  # `--checks --jobs 4 --inner-jobs 1` over the undivided 57: 148.49s of wall over
  # 545.08s of step time, of which the 48 steps left here are 269.60s -- the type floor
  # 75.42s, the perimeter 73.70s, exact verification 48.52s, and 71.96s in the other 45.
  #
  # Measured at the reference shape on the same box: 86.20s of wall over 244.77s of step
  # time, `--checks --jobs 3 --inner-jobs 1`, 2026-09-06. Step time falls as well as wall
  # when the fourth worker goes -- 269.60s at `--jobs 4` against 244.77s at 3 -- which is
  # the same nine per cent the CI table above shows the other way round. On CI add the
  # serial `cargo build --release` every job with an engine step pays first (about 25s on
  # a cold runner, 18.46s with a warm registry), so this job should land near 110-120s.
  # Its longest single step is the perimeter at 68.52s, under that, so nothing in this
  # tier sets its own floor.
  #
  # 240s is a shade over twice that prediction. It clears a runner a third slower, it is
  # a third of the 700s the whole tier is allowed, and -- the edge that matters for an
  # outer-parallel tier -- it is below the 244.77s of step time this tier costs if its
  # pool stops parallelising altogether, so serial degeneration fails here rather than
  # passing quietly. The old 300s no longer had that last property once nine steps left
  # the tier, which is why it moved down rather than staying put.
  #
  # --- 2026-09-07: the corpus tripled and the drift rule said so ---------------------
  #
  # This is the first entry in the register whose record was cleared by its own rule
  # firing rather than by a re-scoping noticed by hand. `KNOWN_BEST_CORPUS` widened from
  # n=1..100 to n=1..324, and on commit `2841eec9` this job ran 189.09s against the
  # 99.39s below -- 1.90x, where 1.5x fails -- and 6s under a 195s ceiling. The gate's
  # own verdict named the step: `exact verification` was 133.4s of it, 70.6 per cent.
  #
  # Measured on an idle ten-cpu box, three readings apiece, everything retained under
  # `benchmarks/gate-cost-at-324/runs/`:
  #
  #   `--checks --jobs 3 --inner-jobs 1`   120.03s wall over 219.76s of step time
  #     `exact verification`                86.71s of it (84.21s run alone)
  #       `check_basic_bounds`              34.81s -- the only member that grew
  #       the sixteen other subcommands     49.40s -- fixed cases, corpus-independent
  #
  # The CI ratio this box shows is 1.58 in both places at once, which is what makes it
  # usable: 189.09/120.03 for the tier and 133.4/84.21 for the step.
  #
  # `check_basic_bounds` was pooled before it was thinned, as `OR-13` asks. It now sizes
  # a `ProcessPoolExecutor` from `sqpack.workers.worker_count`: 34.81s serial, 18.58s at
  # two workers, 9.97s at four, over 34.8s, 36.6s and 38.5s of cpu, and the whole run's
  # stdout is byte-for-byte identical at one worker and at four. That bought this job
  # nothing and was still worth doing -- every pull-request tier passes `--inner-jobs 1`,
  # so `PACK_JOBS` is 1 here by design, and what the pool decides is that the deferred
  # copy costs the deep gate 18.79s at its `--jobs 2 --inner-jobs 2` rather than 34.81s,
  # measured there.
  #
  # So the replay is sampled here and whole on the deferred surface, as `exact rational
  # grid replay`. Every case's declared bounds are still compared against their closed
  # forms -- 0.14s, never left -- and every ninth grid case is still replayed exactly, at
  # 4.15s in place of 34.81s. Measured whole afterwards on the same box, three readings:
  #
  #   `--checks --jobs 3 --inner-jobs 1`    87.56s wall over 186.86s of step time
  #     `exact verification`                55.10s, and no longer this tier's floor
  #
  # 195s stands, and it is a decision rather than an oversight. Scaled by that same 1.58
  # the prediction for the reference runner is about 138s, so the ceiling is a 1.41x band
  # around it: it clears a runner a third slower (184s), and it is far below the roughly
  # 295s of step time this tier costs on that runner if its pool stops parallelising, so
  # serial degeneration fails here rather than passing quietly. Tightening it against a
  # prediction rather than a reading is what `OR-14` calls advertising an aspiration --
  # and the first run at the reference shape prints the line to write, at which point
  # rule 2 re-argues this number against a real one.
  #
  # 2026-09-13: the first ceiling failure was a regression, so 195s still stands. PR
  # #160 failed this tier twice at `f9099096`: 197.56s (run 34745318688, attempt 1)
  # and 195.15s (attempt 2). Its direct parent `e13ff926` read 177.36s (run
  # 34742738884), and the 44 pull-request readings since the tier took its 49- and
  # 50-step form have a geometric mean of 166.46s and a maximum of 186.63s (run
  # 34634071600), so both #160 readings sit above every earlier one. The cause was the
  # browser floor, which went from below the eighth-ranked step to 40.63s and 37.31s:
  # type-aware ESLint, `node --test`, and `typescript-eslint`'s peer range moving every
  # `tsc -p` from the native 7.0.2 compiler to 6.0.2 (locally 7.79s over 15.0 cpu-s
  # against 2.80s over 5.5). Exact verification rose 11% with no change to its inputs,
  # which is contention for the runner rather than new work. The step moved to
  # `frontend` and the ceiling stayed, because raising it would turn the check that
  # caught this into slack. At that point `measured_seconds` stayed empty: those
  # readings included a step this tier no longer runs.
  # 2026-09-16: the exact reconciliation topology removed the standalone type floor
  # from this tier. Run 35127260063 measured the resulting 50-step selection at 94.65 s
  # and tripped the stale-record rule against 158.82 s. The 189 s ceiling written that
  # day was just under rule 2's 2x headroom against that record.
  #
  # 2026-09-17: 140 s, and the ceiling came down because the record did rather than
  # because anything about this tier got worse. PR #185 (`think-5hfr`, merged as
  # d7f9d94d) runs `exact verification`'s subprocesses concurrently, and the step read
  # 67.51 s and 46.01 s in the two hosted runs of that code against 82.90 s and 96.29 s
  # serial. Against the 75.67 s record below, 189 s would be 2.50x of headroom where
  # rule 2 allows 2.0x, so the declaration check refuses it: a tightened ceiling is not
  # optional here, it is what the register's own static rule demands.
  #
  # 2026-09-30: the tier now selects 54 of 85 steps, rather than the 50 of 80 that
  # produced the 2026-09-17 record. The newly measured 114.34 s makes 140 s 1.22x
  # the record, while preserving the absolute cap. The cap now speaks before the
  # record-relative 1.5x rule; neither limit was raised to accommodate these runs.
  #
  # 2026-10-01: 140 s stands, at 1.35x of the 103.70 s record below, and it is now the
  # only rule that fails this tier on a pull request (`policy.pull_request_relative_rules`).
  # It held every one of the day's thirty-three readings; the slowest, 137.10 s in run
  # 36802005114, was 98 per cent of it on the slow class of runner. A slow-fleet day can
  # put this tier over 140 s with no change to its steps, and that is `OR-17`'s decision
  # to take on purpose rather than this entry's to pre-empt: the ceiling is still under
  # the 244.77 s of step time the tier costs if its pool stops parallelising, which is
  # the regression it is for.
  #
  # It remains outside the 180 s required-workflow wall, which includes checkout, setup,
  # queueing and the aggregator as well as this tier.
  # 2026-10-05: 150 s, raised from 140 s by the owner's decision of 2026-10-05 under
  # think-p684, and selected on purpose, as `OR-17` requires of anything above a routine
  # ceiling. PR 347 adds 133.9 recorded test-seconds to the behavioural lane, about 10%:
  # the n17 stack's median four-shard sum is 505.5 s against main's 464 s, a slow runner
