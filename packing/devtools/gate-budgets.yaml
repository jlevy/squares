# Tier ceilings the gate enforces against its own wall clock.
#
# Why this file exists, in one measurement. On 2026-08-30 `packing-validate --fast` cost
# 499s and validate.py recorded that figure in a docstring, beside a 1800s cap. Six days
# later the same tier cost 1369.60s on CI (run 33982455466) and nothing objected, because
# 1370 is inside 1800 and because 499 was prose. A number a machine does not read is a
# number that drifts.
#
# So the number lives here, and the gate reads it. Every run of a whole tier compares its
# own wall against this register and fails when it is out of band -- in BOTH directions,
# because a record bounded only from above rots downward, which is exactly what happened
# to the 499.
#
# Read it:   uv run --frozen --all-extras --group dev packing-validate --budgets
# Check it:  uv run --frozen --all-extras --group dev python -m devtools.check_gate_budgets
#
# The four rules, all applied by sqpack/gate_budgets.py:
#
#   1. ceiling      wall > ceiling_seconds                    -> the run fails
#   2. slack        ceiling_seconds > max_headroom * measured -> the DECLARATION fails,
#                                                                without running anything
#   3. drift        wall > drift_ratio * measured_seconds     -> the run fails
#   4. stale        wall < stale_ratio * measured_seconds     -> the run fails, and prints
#                                                                the figure to write here
#
# Rule 2 is the one that would have caught 2026-08-30 on the day: 1800 against a measured
# 499 is 3.61x of headroom, and a ceiling with 3.61x of headroom cannot detect a 2.65x
# regression. It is a static check over this file, so it costs nothing and cannot be
# noisy. Rules 1, 3 and 4 need a clock and are enforced only on a run whose shape matches
# the tier's `reference`; every other run reports and does not fail. See the `policy`
# block below for what that buys and what it costs.
policy:
  # A ceiling more than this multiple of the tier's own recorded cost is not a ceiling.
  # 2.0 is chosen against the incident: it catches a 2.65x regression with margin, and it
  # tolerates a runner a third slower than the one that set the record.
  max_headroom: 2.0
  # A run this multiple of the recorded cost has regressed. The figure this comment used
  # to cite -- a contended box moving a tier by a quarter -- was measured on a development
  # box and is not what the hosted runners do. Two runs of identical code on 2026-09-06
  # put every step of the sweeps tier up about 1.35x, `known-best n=1..100 atlas` worst at
  # 1.39x on code no commit had touched. Against that, 1.5 has eight per cent of margin.
  # What buys the margin back is the baseline rather than the ratio: `measured_seconds` is
  # the geometric mean of the readings seen at the reference shape, not one sample and not
  # their maximum. The maximum was tried first and is worse in a way worth recording: it
  # puts the record at the top of the band, so it starves the stale rule by exactly as much
  # as it feeds the drift rule, and run 34037168378 -- a fast runner at 0.72 of the record
  # -- left `geometry` 1.21x from failing CI for being quick. The mean leaves both rules
  # about 1.35x. `D-472` is the entry, `think-be1s` the remaining work: a recorded band
  # beats a recorded point, whichever point is chosen.
  drift_ratio: 1.5
  # A run this far *below* the recorded cost means the record is stale in the flattering
  # direction. The run fails and prints the number to write, so nobody has to remember to.
  stale_ratio: 0.6
  # Under this wall, the ratios are measuring scheduler noise rather than the tier. The
  # ceiling still applies; the drift and stale ratios do not.
  min_wall_seconds: 20.0

# One entry per tier `packing-validate` can select as a whole. A tier with no entry here
# fails `devtools.check_gate_budgets`, so a new tier cannot arrive without a ceiling.
tiers:

- id: records
  command: packing-validate --records
  ceiling_seconds: 300.0
  # Never yet clocked at the reference shape. The gate prints the line to paste the first
  # time it runs there; until then only the ceiling applies.
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 2, inner_jobs: 1, cpus: 2}
  argument: >-
    Registries, generated views and declared contracts, and nothing that runs a solver.
    About 14s on a contended local box, so 300s is a hang detector rather than a target;
    the tier is bounded by what it contains, and what it contains is enumerated by
    `Step.records`.

- id: edit
  command: packing-validate --edit
  # Four times the only reading this tier has, and it is still the loosest edge in the
  # register per second of tier. Left as it is because rule 2 has nothing to say about a
  # tier with no record: the number to fix is a measurement, not a ceiling.
  ceiling_seconds: 240.0
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 2, inner_jobs: 1, cpus: 2}
  argument: >-
    Every floor and every record check, without the broad behavioural suite: 59.35s on a
    contended four-core box on 2026-09-05, never yet clocked on CI's two-core runner. So
    this ceiling is still an unmeasured one, and it is the last one in the register that
    is -- it says only that a tier of floors and record checks has no business taking a
    pull request's whole budget. It is a strict subset of `fast`, whose ceiling is
    measured, so it cannot be the looser of the two; what would make it a real band is a
    clock on the reference runner, and the run that first provides one prints the line to
    write here.

- id: fast
  command: packing-validate --fast
  # 210s, a band around the 140.79s below rather than a target. Built from the same three
  # edges the 550s was: it clears the quarter a contended runner adds (176s), it sits
  # under the drift rule's 1.5x (211s) so the ceiling never waits for a larger number than
  # the record-relative rule, and it leaves rule 2's slack real margin (which permits
  # 281s). 210s is 1.49x against the 2.0x allowed. The band is 69s wide on a 141s tier, so
  # it catches a regression of a half -- looser in ratio than the old 550/409 because the
  # tier is now small enough that runner noise is a larger share of it.
  # 700s, a band around the 502.3s below. The tier is not what it was when it measured
  # 177.02s: main promoted twenty-one steps into `--fast` on 2026-09-05, and two of them
  # cost more between them (468.11s) than the entire tier did before they arrived. That
  # is a deliberate coverage trade -- D-455 escaped through exactly that gap -- and it is
  # recorded here rather than argued with.
  #
  # 1.39x of the record, the same shape of band as before: above the quarter a contended
  # runner adds (628s), under the drift rule's 1.5x (753s) so the ceiling never speaks
  # after the record-relative rule, and inside rule 2's slack (1005s).
  #
  # Third figure this entry has held and the third re-scoping behind it: 1369.60s,
  # 409.0s, 177.02s, now 502.3s. The register has been right every time and the tier has
  # kept moving underneath it, which is what a cost register on a subsystem two sessions
  # are editing at once actually looks like.
  ceiling_seconds: 700.0
  # Cleared twice for the same reason, and the reason is a good one both times: the figure
  # measured a tier that no longer exists. BC-214 cleared 1369.60s (CI run 33982455466)
  # when it moved every test at or above QUICK_TEST_WALL_BACKSTOP_SECONDS out of the quick lane.
  # BC-218 cleared 409.0s (CI run 33985984585, job 101359470209, commit 88f7e5f8) because
  # `fast behavioral tests` no longer runs in one process: it asks pytest for one worker
  # per core, and the tier's wall stopped being that step's wall as a result.
  #
  # This is the reading that follows, and the tier is a third of what that 409s measured.
  # Two changes account for it: the shared atlas builds left the quick lane (306s -> 56s
  # locally), and the surface moved to `--jobs 3`, which took the wall from 170.58s to
  # 140.79s at 2.74x parallel against 1.87x.
  # 177.02s, not the 140.79s that stood here for one commit. That figure came from a
  # configuration this project no longer runs and could not have kept: the same shape gave
  # 192.26s on its next run and failed 19 tests against the 5s per-test ceiling, because
  # the quick lane was asking for one worker per cpu while two other steps ran beside it.
  # Recording the faster of two readings from an unstable configuration is how a band gets
  # set to a number the tier cannot hold, so the record is the stable configuration's.
  measured_seconds: 502.3
  measured_on: '2026-09-06'
  measured_where: >-
    CI run for commit 5cad7540, job `validate`, GitHub's Linux runner reporting 4 cpus,
    at `--jobs 3 --inner-jobs 1`. 502.30s of wall over roughly 1,100s of step time, of
    which `known-best n=1..100 atlas` is 254.92s and `prospective n=101..324 source map
    and safe seed` is 213.19s -- the two steps main promoted on 2026-09-05, and together
    more than the whole tier cost before they arrived.
  # The reference moves with the invocation it describes. A record taken at `--jobs 3`
  # cannot be compared against a `--jobs 2` reference, and leaving the old one here is how
  # a band stays permanently unenforced: every run reports "not the reference shape" and
  # nothing is ever judged. `cpus: 4` because that is what the runner reports and what the
  # quick lane sizes itself from, not what the tier of machine is nominally sold as.
  reference: {jobs: 3, inner_jobs: 1, cpus: 4}
  argument: >-
    Since 2026-09-06 no CI job runs this tier whole: a pull request runs `checks`,
    `suite` and `sweeps` concurrently and this is their union, so the record below is the
    last figure CI took of it and the three parts are where the live bands now are. It is
    still a real tier -- it is what a contributor runs before a block boundary, and it is
    the thing the three parts have to add up to -- which is why it keeps a ceiling rather
    than being retired.
    The edit tier plus the behavioural tests under the per-test ceiling: every floor,
    every record check, and the quick lane. What it excludes is a rule rather than a list
    -- `fast behavioral tests` passes the ceiling to pytest as `--durations-min` and fails
    when a retained test reports at or above it -- so this tier cannot regress the way it
    did between 2026-08-30 and 2026-09-05 without a named test failing first.
    The ceiling is a measurement's band and not a target, which is the correction this
    entry carries. It read 240s, which is the operator's four minutes; that number is
    agenda-023's TARGET and belongs there, and BC-218 is the cell that has to reach it. A
    ceiling the tier fails on the day it is written measures nothing -- it advertises an
    aspiration, and it makes the gate red for a reason unrelated to any regression, which
    is how a check gets ignored.
    Why the 409s that stood here is gone rather than adjusted, and this is BC-218's whole
    finding. That figure was 408.09s of `fast behavioral tests` and 0.46s of everything
    else: `--jobs 2` had already absorbed the other 37 steps into the second lane, so the
    tier was not a queue of steps waiting on one runner, it was one step with the rest
    hidden underneath it. No arrangement of GitHub jobs shortens a wall of that shape -- a
    second job would repeat 11s of checkout, uv install and `uv sync` to run work that
    already costs nothing on the clock -- so the parallelism went inside the step instead.
    Measured on a four-core box, `PACK_JOBS=1`, over the same lane: 306.4s in one process,
    135.0s at `-n 4`. Two tests account for 121s of what remains, both of them shared
    cached builds that BC-214's split re-billed rather than tests that grew; with those
    121s removed the lane measured 56.6s at `-n 4`. They are named in
    `test_the_slow_marker_is_declared_only_by_measured_nodes` and deliberately not marked,
    because marking moves their failure to the deep surface instead of removing it.
    That is a different tier from the one 409s described, in the way that matters here:
    its wall is no longer any single step's wall, so the next number written here should
    be read as a whole-tier figure again and the drift rule will mean what it says.

- id: checks
  command: packing-validate --checks
  # Re-argued twice on 2026-09-06, and the second time is the one worth reading, because
  # it is the reading that refused the obvious move.
  #
  # When the behavioural lane left for `suite` this tier was 57 steps of pure
  # outer-parallel work with nothing large enough to floor it, so it was given the freed
  # cpu: `--jobs 4` on a four-cpu runner. Run 34016999060 priced that at 198.22s of tier
  # wall over roughly 790 worker-seconds, against 221.70s for the three-worker job that
  # still had the 142.43s lane inside it. Removing the largest step on the surface and
  # adding a worker bought 23.5s, because saturating the runner inflated every step by
  # thirty to eighty per cent against the same steps at `--jobs 3` on the run before:
  # the perimeter 60.62s to 84.41s, exact verification 61.75s to 79.98s, the type floor
  # 40.37s to 72.31s, the SVG renderer 41.30s to 65.36s. So the reference here is back at
  # `--jobs 3`, with the fourth cpu left for the OS, for the pool-backed steps, and for
  # `build_n5_identity_pair`, which asks `ProcessPoolExecutor` for the whole machine.
  #
  # What actually shortens a queue that size is cpus, so the queue was halved: `geometry`
  # below is the other nine steps, on a runner of its own. Local, 2026-09-06, four cpus,
  # `--checks --jobs 4 --inner-jobs 1` over the undivided 57: 148.49s of wall over
  # 545.08s of step time, of which the 48 steps left here are 269.60s -- the type floor
  # 75.42s, the perimeter 73.70s, exact verification 48.52s, and 71.96s in the other 45.
  #
  # Measured at the reference shape on the same box: 86.20s of wall over 244.77s of step
  # time, `--checks --jobs 3 --inner-jobs 1`, 2026-09-06. Step time falls as well as wall
  # when the fourth worker goes -- 269.60s at `--jobs 4` against 244.77s at 3 -- which is
  # the same nine per cent the CI table above shows the other way round. On CI add the
  # serial `cargo build --release` every job with an engine step pays first (about 25s on
  # a cold runner, 18.46s with a warm registry), so this job should land near 110-120s.
  # Its longest single step is the perimeter at 68.52s, under that, so nothing in this
  # tier sets its own floor.
  #
  # 240s is a shade over twice that prediction. It clears a runner a third slower, it is
  # a third of the 700s the whole tier is allowed, and -- the edge that matters for an
  # outer-parallel tier -- it is below the 244.77s of step time this tier costs if its
  # pool stops parallelising altogether, so serial degeneration fails here rather than
  # passing quietly. The old 300s no longer had that last property once nine steps left
  # the tier, which is why it moved down rather than staying put.
  ceiling_seconds: 195.0
  # Hosted samples at the reference shape establish the baseline below.
  measured_seconds: 99.39
  measured_on: '2026-09-06'
  measured_where: >-
    The geometric mean of four readings at the reference shape -- 106.35, 106.02, 80.62 and 107.33 --
    across runs 34023002068, 34032566385, 34037168378 and 34040196689.
    Observed spread 1.33x. The centre of the band, not an edge: recording the
    maximum was tried first and left `geometry` 1.21x from failing the stale rule on a
    fast runner, because a record at the top of the band starves that rule by as much
    as it feeds the drift rule. At four samples every margin is at least 1.25x.
    **Refresh this when samples accumulate** -- a mean moves as they arrive, which is
    the argument for `think-be1s` rather than a property of these numbers.
  reference: {jobs: 3, inner_jobs: 1, cpus: 4}
  argument: >-
    The part of the pull-request surface that is none of the other three: every floor,
    every record check, and everything that needs the Rust engine. That last clause is a
    rule rather than an accident -- `_build_engine` puts a serial `cargo build --release`
    in front of every step of any job that selects an engine step, so keeping all three
    engine steps and the Rust lint floor here is what stops the fourth job paying for a
    toolchain it never uses. It is 48 steps of pure outer-parallel work at `--jobs 3`,
    which is three units on four cpus and one cpu of headroom, and its wall is step time
    divided rather than any one step's own cost. `checks`, `geometry`, `suite` and
    `sweeps` are a partition of `--fast` by construction in `_select_steps`, and
    `test_the_pull_request_jobs_partition_the_surface` checks that the workflow really
    invokes all four. What the fourth job bought is on the `geometry` entry below.

- id: geometry
  command: packing-validate --geometry
  # The other half of the `checks` queue, and the entry that carries the arithmetic for
  # the split. Local, 2026-09-06, four cpus, `--checks --jobs 4 --inner-jobs 1` over the
  # undivided 57 steps: 545.08s of step time. These nine are 275.48s of it -- the n=5
  # identity pair 62.62s, historical regressions 42.35s, the decimal route 39.43s, the
  # SVG renderer 39.36s, small-n exact models 28.34s, Trump's cones 20.94s, the
  # independent LP 15.84s, the basin atlas 13.94s, the basin event replay 12.66s -- which
  # leaves 269.60s in `checks`. Two halves within two per cent of each other.
  #
  # Measured at the reference shape on the same box: 93.27s of wall over 243.81s of step
  # time, `--geometry --jobs 3 --inner-jobs 1`, 2026-09-06 -- against `checks`' 86.20s
  # over 244.77s, which is what a balanced split is supposed to look like. This job
  # compiles nothing: none of the nine is `needs_engine` and none runs cargo, so it skips
  # the serial `cargo build --release` that `checks` pays and its wall is step time
  # divided from the first second. Its longest single step is historical regressions at
  # 42.73s, well under the 81s the queue divides to, so this tier does not set its own
  # floor either.
  #
  # 200s is a shade over twice that reading, on the same three edges the entry above
  # uses: it clears a runner a third slower (124s), it is under the drift rule's reach,
  # and it is below the 243.81s of step time this tier costs if its pool stops
  # parallelising -- which is the regression a ceiling on an outer-parallel tier is
  # actually for.
  ceiling_seconds: 180.0
  # Unmeasured for the same reason as `checks` and `suite`: this box reports the same four
  # cpus CI does, so a local reading would match the reference shape and arm the drift and
  # stale rules against the wrong machine. The first CI run at the reference shape prints
  # the line to paste.
  measured_seconds: 91.55
  measured_on: '2026-09-06'
  measured_where: >-
    The geometric mean of four readings at the reference shape -- 104.12, 106.07, 76.76 and 82.86 --
    across runs 34023002068, 34032566385, 34037168378 and 34040196689.
    Observed spread 1.38x. The centre of the band, not an edge: recording the
    maximum was tried first and left `geometry` 1.21x from failing the stale rule on a
    fast runner, because a record at the top of the band starves that rule by as much
    as it feeds the drift rule. At four samples every margin is at least 1.25x.
    **Refresh this when samples accumulate** -- a mean moves as they arrive, which is
    the argument for `think-be1s` rather than a property of these numbers.
  reference: {jobs: 3, inner_jobs: 1, cpus: 4}
  argument: >-
    The nine steps that re-derive geometry without the engine: the basin atlas and its
    event replay, the historical regressions, the small-n exact models, the deterministic
    SVG renderer, the independently rebuilt fixed-angle LP, Trump's branchwise cones,
    D-034's n=5 identity pair, and the decimal route's refusal to price an exact pose.
    It exists for cpus rather than for kind. `checks` was 57 steps of outer-parallel work
    at `--jobs 4` and 198.22s of wall on CI, and the measurement said that queue is
    shortened by runners and by nothing else -- a fourth worker on a four-cpu box
    inflated every step by thirty to eighty per cent and bought 23.5s. Two jobs at
    `--jobs 3` put eight cpus and two cores of headroom behind work that had four and
    none. `Step.geometry` carries the two rules that bound which steps may move here --
    only a `broad` step, so `--edit` stays wholly inside `--checks`; and nothing that
    needs the engine or runs cargo, so only one of the two jobs compiles Rust -- and
    `test_the_pull_request_runs_its_sweeps_and_its_suite_apart` is where a tenth name has
    to be typed next to a number.

- id: suite
  command: packing-validate --suite
  # One step, so this ceiling is a step's ceiling and not a queue's. On CI (run
  # 34010470187) the lane cost 142.43s inside `checks` at two xdist workers, which is what
  # `_pytest_workers`' `cpus - jobs + 1` gives it beside 57 other steps at `--jobs 3`. On
  # its own runner at `--jobs 1` the same formula gives four workers and nothing to
  # contend with, and BC-218's measurement of the same lane on a four-core box was 306.4s
  # in one process against 135.0s at `-n 4`. So this job should land near 90-110s on CI.
  #
  # 240s is the band, and it is set against the *old* figure rather than the new
  # prediction on purpose: 1.68x of the 142.43s this step already cost in a slower
  # configuration. A lane that ever runs longer with twice the workers than it did with
  # two has regressed in a way worth failing for, and a lane that grows a test at a time
  # has room before it gets there. It is also under the 306s the lane costs in one
  # process, so losing xdist altogether fails here rather than passing quietly.
  #
  # Local, 2026-09-06, at this shape on a four-cpu box with other agent lanes running
  # beside it: 99.83s over 2,146 tests and 130.08s over 2,152 an hour later, both with no
  # test at or above the per-test ceiling. That last part is the second thing this
  # configuration had to prove and the more important one, since `BC-218`'s objection to
  # four workers was the ceiling rather than the clock: nineteen ordinary tests went over
  # it when the lane asked for every cpu beside two other steps, and none does when it
  # asks for every cpu with nothing beside it.
  #
  # The same lane on the same box measured 256.00s at one worker and 205.22s at two, so
  # four are worth about 2.6x against one here. The two readings 30 per cent apart are
  # why 240s is not tightened to the faster of them: that is what a shared box does to a
  # wall, and a band set to a good day fails on an ordinary one.
  ceiling_seconds: 205.0
  # Unmeasured for the same reason as `checks`: this box reports the same four cpus CI
  # does, so a local reading would match the reference shape and arm the drift and stale
  # rules against the wrong machine. The first CI run at the reference shape prints the
  # line to paste.
  measured_seconds: 102.83
  measured_on: '2026-09-06'
  measured_where: >-
    The geometric mean of four readings at the reference shape -- 102.50, 123.53, 108.44 and 81.43 --
    across runs 34023002068, 34032566385, 34037168378 and 34040196689.
    Observed spread 1.52x. The centre of the band, not an edge: recording the
    maximum was tried first and left `geometry` 1.21x from failing the stale rule on a
    fast runner, because a record at the top of the band starves that rule by as much
    as it feeds the drift rule. At four samples every margin is at least 1.25x.
    **Refresh this when samples accumulate** -- a mean moves as they arrive, which is
    the argument for `think-be1s` rather than a property of these numbers.
  # `inner_jobs: 1`, not 4, because that is what the workflow passes. The xdist worker
  # count comes from `--jobs` through `_pytest_workers`, not from `--inner-jobs`, and a
  # reference that named the worker count instead of the invocation would match no run
  # CI ever makes -- so every run would report "not the reference shape" and the band
  # would never be enforced. `test_every_tier_band_is_declared_for_the_shape_ci_runs`
  # is what keeps this honest.
  reference: {jobs: 1, inner_jobs: 1, cpus: 4}
  argument: >-
    The pull request's quick behavioural lane, alone on a runner. It is one step, and it
    is a tier for two reasons that are the same reason: a job cannot be shorter than its
    longest step, and this step was 142.43s of a 221.70s job it shared with 57 others. On
    its own it stops setting that job's wall and it stops being throttled to two xdist
    workers, because `_pytest_workers` sizes the lane to what the runner has free. What
    it is not is a coverage change -- the step runs on every pull request either way,
    which `test_the_pull_request_surface_defers_only_what_was_measured` re-checks from
    the workflow. `--suite` rather than `--fast --only` because a slice of a tier has no
    declared cost and this job needed one, which is `D-466`.

- id: sweeps
  command: packing-validate --sweeps
  # Measured rather than argued from the parts since run 34010470187: `--sweeps --jobs 4
  # --inner-jobs 1` was 110.66s of wall over 313.95s of step time -- the translation-escape
  # screen 110.66s, the known-best chunk census 90.38s, the known-best atlas 75.88s, the
  # prospective seed 37.03s. Four units on four cpus, so the wall is the longest unit's
  # wall exactly, and 78.5s is what an evenly divisible 313.95s would have cost.
  #
  # 240s, down from the 430s argued when the prospective seed was thought to be 213.2s.
  # That is 2.17x of the reading, and it is below the 313.95s this tier costs if the pool
  # stops parallelising -- so serial degeneration fails here instead of passing.
  #
  # Local, 2026-09-06, at the old `--inner-jobs 1` shape with other agent lanes on the
  # same four cpus: 141.30s, of which the escape screen was 141.27s -- the same shape as
  # the CI reading, one step being the whole wall, at a contended box's prices.
  #
  # The reference has since moved to `--inner-jobs 2`, and that is a change to this
  # tier's floor rather than to its schedule. `screen_translation_escape` was given a
  # process pool on 2026-09-06 but the pool reads `PACK_JOBS`, which this job was setting
  # to 1, so the parallelism was dormant. Best of five rounds on a four-cpu box: 103.94s
  # at one worker, 52.11s at two, 35.40s at three, 27.50s at four. Two rather than four,
  # because the outer pool already has four slots on four cpus and a fifth process is the
  # oversubscription that cost `checks` thirty to eighty per cent per step at `--jobs 4`.
  # Of the eleven modules this tier runs, only that one imports `sqpack.workers`, so the
  # blast radius of the flag is exactly one step -- checked per process rather than by
  # eye, since a transitive import would be invisible to a grep of the four entry points.
  #
  # Measured whole at the new reference shape, 2026-09-06, four cpus: 79.52s of wall over
  # 220.37s of step time -- the chunk census 79.51s, the escape screen 65.27s, the
  # known-best atlas 50.52s, the prospective seed 25.07s. 65.27s rather than the 52.11s
  # of the isolated round, because two inner workers beside three other outer steps is
  # not two workers alone; that gap is the same contention the `checks` table above
  # prices, and it is why the flag is 2 and not 4. The screen is no longer this job's
  # longest unit either way: the census is, and it is now both this job's floor and the
  # floor under the whole pull-request surface.
  #
  # 240s stands through that. It is still below the roughly 258s of step time this tier
  # costs if the pool stops parallelising, so serial degeneration still fails here, and
  # it still has to hold whatever the escape screen costs on a bad day -- which is why it
  # is not tightened to the new prediction.
  ceiling_seconds: 210.0
  measured_seconds: 107.05
  measured_on: '2026-09-06'
  measured_where: >-
    The geometric mean of four readings at the reference shape -- 108.91, 108.62, 106.15 and 104.57 --
    across runs 34023002068, 34032566385, 34037168378 and 34040196689.
    Observed spread 1.04x. The centre of the band, not an edge: recording the
    maximum was tried first and left `geometry` 1.21x from failing the stale rule on a
    fast runner, because a record at the top of the band starves that rule by as much
    as it feeds the drift rule. At four samples every margin is at least 1.25x.
    **Refresh this when samples accumulate** -- a mean moves as they arrive, which is
    the argument for `think-be1s` rather than a property of these numbers.
  reference: {jobs: 4, inner_jobs: 2, cpus: 4}
  argument: >-
    The pull request's record sweeps, on their own runner: the known-best atlas, its
    chunk census, the prospective safe seed, and the translation-escape screen. Each
    re-derives a retained atlas from the witnesses under it and compares it byte for
    byte, which is both why they are expensive and why they stay on every pull request --
    a change that retains a witness or edits a source map is exactly what breaks them.
    Two things about this tier are worth not rediscovering. Its wall is one step's wall:
    four units on four cpus saturates the outer pool, so `--jobs` is already spent and
    the only lever left is the longest unit's own cost -- which is why `--inner-jobs 2`
    is set here and nowhere else on the surface, and why the floor it moves is the
    surface's floor. And this tier is what removes the contention that failed five
    ordinary tests against the quick lane's 5s per-test ceiling -- those tests were never
    slow, they were sharing four cpus with 468s of atlas rendering.

- id: push
  command: packing-validate --push
  ceiling_seconds: 1800.0
  measured_seconds: null
  measured_on: null
  measured_where: null
  reference: {jobs: 2, inner_jobs: 1, cpus: 2}
  argument: >-
    The edit tier plus the behavioural tests reachable from the change. Its cost is a
    function of the diff, and a change nothing narrower can be said about expands the
    selector to the whole non-exhaustive suite -- slow lane included, which is why this
    ceiling is `FAST_SUITE_BUDGET_SECONDS` and not the `fast` tier's. Left
    unmeasured deliberately: a tier whose cost depends on the diff has no single recorded
    figure, and inventing one would make the drift and stale rules lie.

