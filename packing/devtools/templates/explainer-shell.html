<!doctype html>
<html lang="en" data-kpress-viewport data-kpress-theme="system" data-kpress-resolved-theme="light"
      data-kpress-palette="neutral" data-kpress-prose-font="serif" data-kpress-math-text="prose"
      data-kpress-mono-font="{{MONO_FONT}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="kpress">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<!-- What a shared link shows. Everything the page itself loads is inlined or relative,
     because it has to open the same way from a file, from Pages and from an artifact
     host; these are the exception, and they are not loads. A crawler reads them off the
     markup with no base to resolve against, so each URL is absolute, and no browser
     fetches any of them to display the page. The image is the atlas composite served
     beside this file: portrait, so X and Facebook crop it to a band of the grid and
     Slack, Discord and iMessage scale all hundred packings down whole. The width and
     height are read from that PNG, so a consumer can reserve the box before it has the
     bytes. -->
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{CARD_IMAGE_URL}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{CARD_IMAGE_WIDTH}}">
<meta property="og:image:height" content="{{CARD_IMAGE_HEIGHT}}">
<meta property="og:image:alt" content="{{CARD_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="{{CARD_IMAGE_URL}}">
<meta name="twitter:image:alt" content="{{CARD_ALT}}">
<style>{{KPRESS_CSS}}</style>
<!-- The relation, the approximation sign and the arrow, subset out of KaTeX_Main and
     declared on the sans families the page already ships. Source Sans 3 carries none of
     the three, so without these the reader's own machine draws them: a different face
     for every reader, and outline paths in the PDF. See `relation_face_css`. -->
<style>{{RELATION_CSS}}</style>
<script>{{THEME_BOOTSTRAP}}</script>
<script>
/* CoreText uses linear advances with native hinting. Select it before body paint;
   other platforms retain the explicit linear rendering policy below. */
if (navigator.platform.startsWith('Mac')) {
  document.documentElement.dataset.squaresNativeMathMetrics = 'true';
}
</script>
<style>
/* ============================================================
   This page on top of the kpress design system.

   Everything typographic -- the reading measure, the type ramp, headings,
   lists, code, the color roles and both themes -- comes from the kpress
   stylesheets above. What follows is only what kpress has no component for:
   the certificate's figures and the two interactive panels. Every value here
   is a kpress token, so the figures move with the system rather than beside
   it.
   ============================================================ */

/* This standalone article scrolls the document, so the browser preserves its
   reading position on reload and history traversal. KPress also supports host
   panes, but its pane reset would leave the document at scroll position zero.
   Keep main's width-query container without creating a second scroll context. */
html, body { height: auto; overflow: visible; }
.kpress-page-main.kpress-viewport { block-size: auto; overflow: visible; }

/* One accent, everywhere. kpress ships a separate link blue and sets it on
   `:root`, on `.kpress`, and again per theme and palette on attribute selectors,
   all of which outrank `body`; the popovers it appends carry `.kpress-tooltip`
   and their own resolved-theme attribute. Redeclare the token in the same
   places kpress does, so links and controls inside those popovers resolve the
   same accent as the surrounding page. */
:root,
.kpress,
.kpress-page-main,
.kpress-tooltip,
:is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-resolved-theme],
:is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-palette][data-kpress-resolved-theme],
body {
  --kpress-doc-link: var(--kpress-doc-accent);
  --color-primary-light: var(--kpress-doc-accent);
}
/* kpress declares `--kpress-doc-accent` once, for both themes, and gives
   `--kpress-doc-link` a value per theme. Aliasing the link to the accent above
   therefore took the light teal into dark mode as well, where it measured 3.37:1 on
   the page ground against the 4.5:1 AA needs -- every link on the page, plus the
   footnote references and the pressed chooser label at 2.99:1 and 3.07:1 on their
   tinted grounds. The accent is what carries the alias, so the accent is what gains a
   dark value: the same hue and chroma lifted to the lightness kpress's own dark link
   uses, which brings everything that reads the accent up together rather than fixing
   links and leaving the borders and the range control behind. Scoped exactly as kpress
   scopes its own dark tokens, on the resolver's output attribute, so an explicit
   choice and the system default both land here. */
:root:where([data-kpress-resolved-theme="dark"]),
:where([data-kpress-resolved-theme="dark"]) :is(.kpress, .kpress-page-main, .kpress-tooltip),
:is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-resolved-theme="dark"] {
  --kpress-doc-accent: oklch(76.68% 0.0861 186.4);
}
.cert-page {
  --kpress-measure: calc(var(--kpress-font-size-base) * 40);
  --kpress-font-size-h2: calc(var(--kpress-font-size-base) * 1.2);
  padding-block-end: calc(var(--kpress-font-size-base) * 6);
}
/* Paper typography profile; see paper-design.md beside this template.
   Keep the values and their scope together for review upstream to KPress:
   a 19px sans base against 18px prose, regular 410, medium 550, bold 680.
   Captions and footnotes share a slightly smaller size than figure labels.
   Print keeps the same size ratio.
   Scope the bold token to sans components because KPress also uses it for serif
   emphasis. Diagram labels with explicit SVG weights join the same scale.

   Three weights and no others, which is the rule rather than the tally: one bold
   everywhere in the sans, one medium everywhere, one light for supporting text.
   `sans_instances --weights` lists what the page asks for in both media with the
   declaration behind each request, and it is how a fourth weight is found. Two used
   to be there: the caption label sat at the medium while the title credits were bold,
   and the footnote controls at KPress's literal 600, which is neither token. */
:root {
  --cert-font-scale-sans: calc(19 / 18);
  --cert-font-weight-sans-light: var(--kpress-font-weight-sans-regular);
  --cert-font-weight-sans-medium: 550;
  --cert-font-weight-sans-bold: 680;
  --paper-title-scale: 1.5;
  --paper-subtitle-scale: 1.25;
  --paper-support-scale: 0.95;
  --paper-note-scale: 0.92;
  --paper-note-inset: 1.4rem;
  --paper-support-leading: 1.4;
}
/* Resolve the sans base in the prose scope so nested sans components all use
   the same size instead of multiplying the scale at each level. */
:root, .cert-page {
  --cert-font-size-sans-base: calc(var(--kpress-font-size-base) * var(--cert-font-scale-sans));
  --paper-font-size-support: calc(var(--cert-font-size-sans-base) * var(--paper-support-scale));
  --paper-font-size-note: calc(var(--cert-font-size-sans-base) * var(--paper-note-scale));
  --paper-support-color: var(--kpress-doc-muted);
}
.cert-page :is(.credits, .kpress-figcaption, .kpress-footnotes, .colophon,
  .mass-line, .panel, .tip-panel, .caps, .tag, button, .doc-links .chip,
  .hero h1, .hero .subtitle),
.kpress-tooltip {
  --kpress-font-size-base: var(--cert-font-size-sans-base);
  --kpress-font-size-normal: var(--kpress-font-size-base);
  --kpress-font-size-large: calc(var(--kpress-font-size-base) * 1.2);
  --kpress-font-size-small: calc(var(--kpress-font-size-base) * 0.95);
  --kpress-font-size-smaller: calc(var(--kpress-font-size-base) * 0.9);
  --kpress-font-size-tiny: calc(var(--kpress-font-size-base) * 0.85);
  --kpress-caps-label-size: calc(var(--kpress-font-size-smaller) * var(--kpress-caps-heading-size-multiplier));
}
.cert-page .panel { font-size: var(--kpress-font-size-normal); }
.cert-page .hero h1 {
  font-size: calc(var(--cert-font-size-sans-base) * var(--paper-title-scale));
}
.cert-page, .kpress-tooltip {
  --kpress-font-weight-sans-light: var(--cert-font-weight-sans-light);
  /* The medium is mapped at this scope rather than at the sans components' because it
     is the same 550 KPress already uses, so nothing the page does not own can change
     under it; naming it here is what lets every medium on the page read as a token. */
  --kpress-font-weight-sans-medium: var(--cert-font-weight-sans-medium);
}
.cert-page :is(.credits, .kpress-figcaption, .kpress-footnotes, .colophon,
  .mass-line, .panel, .tip-panel, .line-fig, .chart, button),
.kpress-tooltip {
  --kpress-font-weight-sans-bold: var(--cert-font-weight-sans-bold);
  font-weight: var(--cert-font-weight-sans-light);
}
/* Diagram labels carry their weight as an SVG presentation attribute, because that is
   what an `<svg>` written by `render_explainer` can say about one `<text>`. The two
   numbers it emits are markers, not weights: they select the scale's medium and its
   bold here, so a token moves them with everything else. */
.cert-page :is(.line-fig, .chart) [font-weight="550"] {
  font-weight: var(--kpress-font-weight-sans-medium);
}
.cert-page :is(.line-fig, .chart) [font-weight="650"] {
  font-weight: var(--cert-font-weight-sans-bold);
}
@media print {
  /* Keep small sans text compact as its letter size increases. */
  :root { --paper-support-leading: 1.32; }
}
.cert-page a, .cert-page .kpress-footnote-ref a, .cert-page a.kpress-footnote-backref,
.cert-page a:hover, .kpress a.kpress-footnote-backref:hover,
.kpress-tooltip a, .kpress-tooltip a:hover, .kpress-tooltip .kpress-footnote-nav-link { color: var(--kpress-doc-accent); }
.cert-page a, .kpress-tooltip a { text-decoration: none; }

/* Supporting text shares its family, weight and color in both media.
   KPress's print text-role reset below turns the inherited gray into black. */
.cert-page :is(.kpress-figcaption, .kpress-footnotes, .mass-line, .line-fig,
  .chart, .panel, .tip-panel),
.cert-page figure :is(.caps, .hint, .legend, .kv, .val, .mass-val, .mass-dec,
  .verdict, .tag, button) {
  font-family: var(--kpress-font-sans);
  font-size: var(--paper-font-size-support);
  font-weight: var(--cert-font-weight-sans-light);
  line-height: var(--paper-support-leading);
  color: var(--paper-support-color);
}
.cert-page :is(.kpress-figcaption, .kpress-footnotes) {
  font-size: var(--paper-font-size-note);
  padding-inline: var(--paper-note-inset);
}
.cert-page :is(.kpress-figcaption, .kpress-footnotes) strong { color: inherit; }
/* Sources, not controls: the ↑ after each footnote is kpress's footnote control and
   keeps the control styling (accent here, through the link alias above). */
.cert-page :is(figure, .kpress-footnotes) a:not(.kpress-footnote-backref),
.cert-page :is(figure, .kpress-footnotes) a:not(.kpress-footnote-backref):hover {
  color: var(--paper-support-color);
  text-decoration: none;
}
.cert-page :is(.kpress-figcaption, .kpress-footnotes, .mass-line, .panel) .katex {
  color: inherit;
}
.cert-page .kpress-footnotes code { color: inherit; }
.cert-page :is(.line-fig, .chart) svg text {
  font-family: var(--kpress-font-sans);
  font-size: var(--paper-diagram-font-size, var(--paper-font-size-support));
  fill: var(--paper-support-color);
}
.cert-page figure .figure-note {
  font: inherit;
  color: inherit;
  margin-block: 0.25rem 0;
}
.cert-page figure .verdict.ok { color: var(--kpress-doc-accent); }
.cert-page figure .verdict.no { color: var(--cert-below); }
/* Diagram geometry scales with its viewport; the shared script compensates
   label sizes. Narrow screens scroll the diagram instead of shrinking its text. */
.cert-page :is(.line-fig, .chart) {
  overflow-x: auto;
  margin-block-end: 0;
}
.cert-page :is(.line-fig, .chart) svg { min-width: calc(var(--paper-font-size-support) * 34); }
@media print {
  .cert-page a, .cert-page a:hover { text-decoration: none; }
  .cert-page :is(.line-fig, .chart) { overflow: visible; }
  /* Fix the drawing width before pagination so label compensation sees the
     same viewport as the PDF: Letter text column minus figure side padding. */
  .cert-page :is(.line-fig, .chart) svg {
    min-width: 0;
    width: calc(8.5in - 2 * var(--kpress-print-page-margin) - 2.2rem);
  }
}

/* The footnote controls -- the reference in the body, the arrow back from each source,
   the tooltip's next and previous -- at the scale's medium. KPress sets all three from
   one literal 600, which is neither of this page's tokens and was the page's fourth sans
   weight: two instanced faces in the PDF for thirty superscript figures. 550 is 50 units
   below it and still reads as a mark rather than as body text at the 0.75em these run
   at; if a control ever needs more presence than that, the answer is the bold token and
   not a number between the two.

   The tooltip's link is named at KPress's own specificity and comes later in the
   cascade, which is how it wins; the two in the page win on `.cert-page`. */
.cert-page .kpress-footnote-ref a, .cert-page a.kpress-footnote-backref,
.kpress-tooltip .kpress-footnote-nav-link {
  font-weight: var(--kpress-font-weight-sans-medium);
}

/* One transition for every hover and every replaced readout: fast, and the
   same everywhere. The scripts set `.swap` on a readout whose text they
   replace, so it fades in rather than flicking. */
.cert-page a, .cert-page button, .cert-page .verdict, .cert-page .mass-dec,
.cert-page .kpress-footnote-ref a, .cert-page a.kpress-footnote-backref {
  transition: color 120ms ease-out, background-color 120ms ease-out, border-color 120ms ease-out;
}
@keyframes cert-swap { from { opacity: 0; } to { opacity: 1; } }
.cert-page .swap { animation: cert-swap 160ms ease-out; }
@media (prefers-reduced-motion: reduce) {
  .cert-page a, .cert-page button, .cert-page .verdict, .cert-page .mass-dec, .cert-page .swap {
    animation: none;
    transition: none;
  }
}

/* Prose keeps the kpress measure; figures are allowed a wider track. The
   Markdown body has no column wrappers, so every direct child of the page and
   of an article takes the measure unless it is a figure. kpress indents a list
   with a margin, which the measure resets; the indent comes back as padding
   inside the measured box, so a list's text is narrower by the same amount. */
.cert-page > :is(ul, ol) { box-sizing: border-box; padding-inline-start: 1.8rem; }
.cert-page > :not(figure, .cert-figure, .kpress-figure),
.col {
  margin-inline: auto;
  max-width: calc(var(--kpress-measure) + 2 * var(--kpress-column-inset));
}
.cert-page figure {
  margin-inline: auto;
  margin-block: calc(var(--kpress-font-size-base) * 1.8) 0;
  max-width: calc(var(--kpress-measure) + 14rem);
  border: 1px solid var(--kpress-doc-border);
}

/* A section label, in the kpress caps idiom. */
.caps {
  color: var(--kpress-doc-muted);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-caps-label-size);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  text-transform: var(--kpress-caps-transform);
}
/* A section starts with room above its heading, so it reads as a new step. */
.section-head { margin-block: calc(var(--kpress-font-size-base) * 2.6) 0.9rem; text-align: center; }
/* A section starts with room above its heading and a breath below it. */
.cert-page h2 { margin-block: calc(var(--kpress-font-size-base) * 2.8) 1.3rem; text-align: center; }
/* A box holds discrete statements rather than continuous argument, so its
   paragraphs stand a little further apart than running prose, which kpress sets at
   0.75rem. One rule serves both boxes on the page, the five conditions and the
   contradiction, so they cannot drift into two rhythms.

   The conditions were a bulleted list and are now paragraphs. The bold lead already
   numbers and names each one, so a marker beside it said the same thing twice, and
   losing the list's hanging indent lets each condition start on the measure with
   everything else. `.conditions ol` and `.conditions li` styled an ordered list this
   page had stopped emitting; they are gone with it. */
.cert-page .boxed-text { margin-block: calc(1rem + 0.5lh); }
.cert-page .boxed-text p { margin-block: 0.95rem; }
.intro .section-head { margin-block-start: 0; }

.hero { padding-block-start: calc(var(--kpress-font-size-base) * 3); }
/* The heading is set in caps by kpress; its s(n) run is mathematics and keeps both
   mathematical italic and lowercase rather than inheriting the heading transform. */
.hero h1 .tex { letter-spacing: 0; text-transform: none; }
/* Mathematical relations set in a sans line: `≥` in the title and the certificate
   buttons, `≈` in two captions and in the chart labels, `→` in Figure 7's label.
   Source Sans 3 carries none of the three, so the browser used to resolve them to
   whatever family on the reader's machine had them.

   That was drawn as a weight bug first. The hero is set at 550 and CSS weight matching
   searches upward from anything above 500, so the fallback family, offering 400 and
   700, answered with Bold: one bold character in a semibold line, 18% heavier in stroke
   and up to twice the ink of the digits beside it, from DejaVu Sans Bold in the printed
   file while every other glyph on the line came from Source Sans 3. A `.rel { 400 }`
   class fixed the weight and left the family to the host, and the three treatments
   compared then -- the host sans at 400, the page's own KaTeX_Main, and the whole line
   set as mathematics -- picked the host sans, because it is drawn like the digits beside
   it and a Computer Modern relation is a hairline against Source Sans.

   The rule that the page resolves every run to a face it ships retires that choice: a
   glyph from the reader's machine is a different glyph for every reader, and on macOS
   the PDF writes it as outline paths. Setting the whole title as mathematics would
   hand the relation and bound to formula-specific glyph selection, spacing, and weight
   rather than the established title typography, so the relation comes from KaTeX_Main,
   subset to those three code points and declared on the sans families themselves
   (`relation_face_css`) rather than named by a class. The title's `s(11)` is separately
   set as mathematics, where the italic `s` carries meaning, while the relation and
   value remain part of the sans title line. The relation face also reaches the chart
   labels and the caption prose, which no class did.

   KaTeX_Main-Bold, not Regular, and the comparison is the reason. Measured with
   `compare_math_fonts metrics`, in units of a thousandth of an em, the rule thickness of
   the minus -- which is the bar every relation here is drawn on -- is 40 in
   KaTeX_Main-Regular and 60 in its Bold, against Source Sans 3's own 62 at the 410 the
   captions run at and 78 at the 550 of the title. Bold lands within 3% of the sans at
   410 and at 77% of it at 550; Regular is at 65% and 51%, which is the hairline the
   earlier comparison saw. One face for all of them, declared across the whole weight
   range, so the relation cannot change weight between the title and a caption the way
   the host's fallback did -- the same rule as one bold in the sans.

   Scaled to 70% by `size-adjust`, because a mathematics face draws its relations for a
   mathematics line and this one's `≈` is 1.7 times the size of the arithmetic beside it:
   `RELATION_SIZE_ADJUST` carries the measurements and what the scale costs. Scaling takes
   the stroke down with the width, so the sign is lighter than the sans's own `=` at every
   size. That is the price of the rule, and it is stated rather than hidden: the route it
   replaces gave a different relation to every reader.

   `.rel` is gone with the class-based fix: it marked three of the sites and the face
   reaches all of them. */
/* Under the title: the description in sans caps, a step below the title's
   size, then the deck in the prose face, italic. */
.cert-page .hero .subtitle {
  color: var(--kpress-doc-text);
  font-family: var(--kpress-font-sans);
  font-feature-settings: var(--kpress-font-features-sans);
  font-size: calc(var(--cert-font-size-sans-base) * var(--paper-subtitle-scale));
  font-style: normal;
  font-variant-caps: var(--kpress-caps-variant);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  line-height: 1.2;
  margin-block: 0.5rem 0;
  text-transform: var(--kpress-caps-transform);
}
/* `.centred` is the page's one word for "this block is centred, in every medium".
   It exists because the print block left-aligns prose wholesale, and the elements that
   must escape that need to be nameable in one place: the rule there carves them out by
   `:not(.centred)` and `check_print_layout` holds them to it. The hero's `h1` is named
   separately because a Markdown heading carries no class of its own.
   The hero is centred -- title, subtitle and credits; the deck below reads as prose. */
.centred, .cert-page .hero h1 { text-align: center; }
.credits {
  display: grid;
  font-family: var(--kpress-font-sans);
  font-feature-settings: var(--kpress-font-features-sans);
  font-size: var(--kpress-font-size-normal);
  gap: 0.2rem;
  line-height: 1.45;
  margin-block: 2rem 2.2rem;
}
.credits strong { font-weight: var(--kpress-font-weight-sans-bold); }
.credits .publication-date { margin-block-start: 1lh; }
.cert-page .hero .deck { font-family: var(--kpress-font-prose); font-style: italic; margin-block: 0; }
/* Where this page came from and how to take it away, at the top corner and out of
   the way. Chips rather than prose: they are tools, not part of the argument. */
.doc-links {
  display: flex;
  float: inline-end;
  gap: 0.4rem;
  margin-block-start: 0.15rem;
  margin-inline-start: 1rem;
}
.doc-links .chip {
  align-items: center;
  border: 1px solid var(--kpress-doc-border);
  border-radius: var(--kpress-radius-sm);
  color: var(--kpress-doc-muted);
  display: inline-flex;
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  font-weight: var(--kpress-font-weight-sans-medium);
  gap: 0.3rem;
  letter-spacing: 0.02em;
  /* `normal`, not `1`, and the padding is what it is because of that.

     `line-height: 1` makes the line box 15.3px while the sans content area at that size
     is 17.28px. The half-leading is then negative, and negative leading is not shared
     evenly the way positive leading is -- ascent and descent are not symmetric about the
     em box -- so the text sat 0.65px above the chip's centre: 2.11px of space over it and
     3.41px under. Small, and a reader saw it.

     A line box at least as tall as the content area centres exactly, so the height comes
     back from the padding instead: `normal` gives a 23.98px content area, and 0.11rem
     either side puts the chip at 27.50px against the 27.52px it had. Measured after:
     2.75px above, 2.75px below, offset 0. `check_print_layout` holds it there. */
  line-height: normal;
  padding: 0.11rem 0.5rem;
  text-decoration: none;
}
.doc-links .chip:hover {
  background: var(--kpress-doc-surface-hover);
  border-color: var(--kpress-doc-accent);
  color: var(--kpress-doc-accent);
  /* kpress underlines a link on hover, which is right for a link in a sentence and
     wrong for a bordered chip: the rule lands inside the box and reads as a defect.
     The chip already answers the hover with its border, its ground and its colour,
     all three on the page's shared 120ms transition. */
  text-decoration: none;
}
.doc-links .chip svg { display: block; }

/* The deck is a div so its footnote renders; the paragraph inside keeps its edges. */
.cert-page .hero .deck > p { margin-block: 0; }

/* The certificate switch sits at the foot of every figure it changes; the articles
   are whole documents, so they are hidden outright. */
/* Wrapping, because the two buttons are 148px and 176px and the page's scroller
   clips rather than scrolls: at 320px they spilled about five pixels off each edge and
   the labels were cut. They fit on one line from 360px up, which is where wrapping
   costs nothing. */
.cert-toggle { display: inline-flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; }
.cert-toggle button { white-space: nowrap; }
.intro { margin-block-start: 1.6rem; }
/* The atlas rendering is inlined: its ground and strokes take the page's
   theme, and its own caption is replaced by the figure's. */
.trump a { display: block; width: min(100%, 24rem); }
.trump svg { display: block; height: auto; width: 100%; }
.trump svg rect[fill="#ffffff"] { fill: var(--kpress-doc-bg); }
.trump svg [stroke="#000000"] { stroke: var(--kpress-doc-text); }
.trump svg text { display: none; }
.cert-figure[hidden] { display: none; }
/* Separate the closing credit with whitespace. Qualify the selector so its
   margins take precedence over kpress's paragraph rules in both media. */
.cert-page .colophon {
  border-block-start: 0;
  color: var(--kpress-doc-muted);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  margin-block: 4rem 0;
  padding-block-start: 0;
}

/* KPress paints a 0.226em square. Keep its actual height: the old glyph-era
   height:1lh stretched that square into a full-line vertical bar.

   The item's resolved line-height keeps the marker's lh tied to the first text
   line. Centre the square there, then lower its optical centre by 0.04 of the
   body base: 0.72px at the 18px screen size and 0.64px at the 16px print size.
   In the shipped PT Serif outlines, the A and E crossbars are centred 0.262em
   and 0.357em above the baseline. The adjusted prose marker sits between them,
   about 0.32em above the baseline in both media. */
.cert-page.kpress-prose ul > li { line-height: 1lh; }
.cert-page.kpress-prose ul > li::before {
  height: 0.226em;
  top: calc(0.5lh - 0.113em + var(--kpress-font-size-base) * 0.04);
}

.line-fig { padding: 1.3rem 1.1rem 0.4rem; }
/* `.kpress-diagram svg` sets display, height and centring; these figures also
   need full width and labels allowed outside the viewBox. */
.line-fig svg, .chart svg { overflow: visible; width: 100%; }
.line-fig svg text, .chart svg text {
  fill: var(--kpress-doc-muted);
  font-family: var(--kpress-font-sans);
}

/* Figure chrome. The figure carries no title: the caption names it, and repeating
   the number above the frame said the same thing twice. What the head did carry that
   the caption cannot is the certificate chooser, which belongs with the diagram it
   changes, so it sits at its foot. */
.fig-choose {
  border-block-start: 1px solid var(--kpress-doc-border);
  display: flex;
  justify-content: center;
  padding: 0.7rem 1.1rem;
}
.tag {
  background: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
  border-radius: var(--kpress-radius-sm);
  color: var(--kpress-doc-accent);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  padding: 0.05rem 0.4rem;
}
/* Pure charts and packing drawings need no outer box. Composite apparatus uses the
   same hairline as its internal panel so its diagram, readout and controls read as one
   figure.

   Caption padding keeps borderless figures inset from the measure, so a reader can see
   where the figure ends and the prose resumes. */
.cert-page .kpress-figure { border: 0; }
.cert-page .kpress-figure.apparatus {
  border: 1px solid var(--kpress-doc-border);
}
.cert-page .kpress-figcaption {
  border-block-start: 0;
  margin-block-start: 0;
  padding-block: 0.85rem 1rem;
}
/* The "Figure N." prefix is the caption label. It uses the title-credit bold so a
   reader scanning for Figure 7 can find it; the condition and caption text stay at the
   caption's regular weight. */
.cert-page .kpress-figcaption strong {
  font-weight: var(--kpress-font-weight-sans-bold);
}

/* The mass budget. */
.mass-line {
  color: var(--kpress-doc-muted);
  display: flex;
  flex-wrap: wrap;
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  gap: 1rem;
  justify-content: space-between;
  margin-block-start: 0.6rem;
  padding: 0 1.1rem 0.9rem;
}
.mass-line .v { display: block; margin-block-start: 0.15rem; }

/* The two interactive stages. */
.split { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(14rem, 1fr); }
/* Figures sit on the page's own ground, and the canvases take the room the
   figure track gives them. */
.stage {
  align-items: center;
  background: var(--kpress-doc-bg);
  display: flex;
  justify-content: center;
  padding: 0.6rem;
  position: relative;
}
/* A canvas is 40% of a phone's viewport height and there are three of them, so what
   it does with a touch decides whether the page can be read on a phone at all. The
   blanket `touch-action: none` here took every gesture: a 250px upward swipe starting
   on a canvas scrolled the page 0px, against 338px for the same swipe two centimetres
   to the left, leaving 26px of gutter either side as the only way past three dead
   zones. Keep vertical scrolling on the canvases; only the small native rotation
   handles capture a two-axis touch gesture. The atom field, which only taps,
   restricts nothing. */
.stage canvas {
  display: block;
  height: auto;
  max-width: 42rem;
  width: 100%;
}
.stage canvas.draggable {
  cursor: grab;
  touch-action: pan-y;
}
.stage canvas.draggable:active { cursor: grabbing; }
/* The atom readout: a fixed panel beside the canvas, in the sans face. */
.tip-panel {
  color: var(--kpress-doc-text);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-small);
  line-height: 1.5;
}
.tip-panel .tip-w { color: var(--kpress-doc-muted); display: block; margin-block-start: 0.1rem; }
.panel {
  border-inline-start: 1px solid var(--kpress-doc-border);
  display: flex;
  flex-direction: column;
  font-family: var(--kpress-font-sans);
  gap: 1.1rem;
  padding: 1.1rem;
}
@media (max-width: 52rem) {
  .split { grid-template-columns: 1fr; }
  .panel { border-block-start: 1px solid var(--kpress-doc-border); border-inline-start: 0; }
}

.readout { padding: 0.2rem 0 0.7rem; }
.readout .caps { display: block; margin-block-end: 0.5rem; }
.mass-val {
  align-items: center;
  display: flex;
  font-size: calc(var(--kpress-font-size-base) * 1.9);
  line-height: 1.1;
  min-height: 2.4em;
}
.mass-row { align-items: baseline; display: flex; flex-wrap: wrap; gap: 0.15rem 0.7rem; }
.mass-dec {
  color: var(--kpress-doc-text);
  font-size: var(--kpress-font-size-large);
}
/* Figure 5 needs room for a mass fraction and three separate direction values.
   Keep its controls below the drawing even on a wide screen. */
.prover .split { display: block; }
.prover .stage canvas { max-width: 36rem; }
.prover .panel {
  border-inline-start: 0;
  border-block-start: 1px solid var(--kpress-doc-border);
  text-align: left;
}
.prover .readout, .prover .ctl { text-align: center; }
.prover .mass-row { justify-content: center; align-items: center; gap: 0.6rem 1rem; }
.cert-page .prover .mass-val { font-size: var(--kpress-font-size-large); min-height: 0; }
.prover .mass-val .katex { white-space: nowrap; }
.prover .ctl { align-items: center; gap: 0.8rem; }
.prover input[type="range"] { max-width: 34rem; }
.prover .direction-values { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.8rem 1.6rem; }
.prover :is(.math-item, .mass-dec) { display: inline-block; white-space: nowrap; }
.prover .btns { justify-content: center; }
.prover .shading-toggle { display: inline-flex; align-items: center; gap: 0.45rem; cursor: pointer; }
.prover .shading-toggle input { accent-color: var(--kpress-doc-accent); }
.prover .legend { flex-direction: row; flex-wrap: wrap; gap: 0.5rem 1.4rem; }
.prover .control-status { border-inline-start: 2px solid var(--kpress-doc-accent); padding-inline-start: 0.8rem; }
.prover .fig-choose { flex-direction: column; gap: 0.5rem; }
.prover .fig-choose > .screen-only { display: block; }
.prover [hidden] { display: none; }
.verdict {
  border-radius: var(--kpress-radius-sm);
  display: inline-block;
  font-size: var(--kpress-font-size-tiny);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  margin-block-start: 0.6rem;
  padding: 0.1rem 0.4rem;
  text-transform: var(--kpress-caps-transform);
}
.verdict.ok {
  background: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
  color: var(--kpress-doc-accent);
}
.verdict.no {
  background: color-mix(in srgb, var(--cert-below) 16%, transparent);
  color: var(--cert-below);
}
.verdict.out { background: var(--kpress-doc-code-bg); color: var(--kpress-doc-muted); }

.ctl { display: flex; flex-direction: column; gap: 0.4rem; }
.ctl .val {
  color: var(--kpress-doc-text);
  font-size: var(--kpress-font-size-tiny);
  line-height: 1.6;
}
.cert-page input[type="range"] { accent-color: var(--kpress-doc-accent); margin: 0; width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.cert-page button {
  background: var(--kpress-doc-bg);
  border: 1px solid var(--kpress-doc-border-hairline);
  border-radius: var(--kpress-radius-sm);
  color: var(--kpress-doc-text);
  cursor: pointer;
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  padding: 0.3rem 0.55rem;
}
/* The theme's dark surface-hover is mostly muted text, which washes out a
   button's pale label. Tint the document ground instead. */
.cert-page button:hover { background: color-mix(in srgb, var(--kpress-doc-text) 10%, var(--kpress-doc-bg)); }
.cert-page button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
  border-color: var(--kpress-doc-accent);
  color: var(--kpress-doc-accent);
}
/* A visible native target works before hover and keeps touch rotation local.
   Its position follows the canvas, while its hit area stays finger-sized. */
.cert-page figure .rotation-handle {
  align-items: center;
  background: var(--kpress-doc-bg);
  border: 2px solid var(--cert-probe);
  border-radius: 50%;
  box-shadow: 0 0 0 3px var(--kpress-doc-bg);
  box-sizing: border-box;
  color: var(--cert-probe);
  cursor: grab;
  display: flex;
  font-size: 25px;
  height: 44px;
  justify-content: center;
  line-height: 1;
  min-height: 44px;
  min-width: 44px;
  padding: 0;
  position: absolute;
  touch-action: none;
  transform: translate(-50%, -50%);
  user-select: none;
  width: 44px;
}
.cert-page .rotation-handle:hover { background: color-mix(in srgb, var(--cert-probe) 12%, var(--kpress-doc-bg)); }
.cert-page .rotation-handle:focus-visible { outline: 2px solid var(--kpress-doc-accent); outline-offset: 3px; }
.cert-page .rotation-handle[data-dragging] { cursor: grabbing; }
.cert-page .rotation-handle[hidden] { display: none; }
.hint {
  color: var(--kpress-doc-muted);
  font-size: var(--kpress-font-size-tiny);
  line-height: 1.55;
  margin: 0;
}
.legend {
  color: var(--kpress-doc-muted);
  display: flex;
  flex-direction: column;
  font-size: var(--kpress-font-size-tiny);
  gap: 0.3rem;
}
.legend > span { align-items: center; display: flex; gap: 0.5rem; }
.legend i { display: block; flex: none; height: 0.7rem; width: 0.9rem; }

.kv {
  align-items: baseline;
  display: grid;
  font-size: var(--kpress-font-size-tiny);
  gap: 0.3rem 0.9rem;
  grid-template-columns: auto 1fr;
}
.kv dt { color: var(--kpress-doc-muted); }
.kv dd { margin: 0; text-align: end; }
.kv dd.hi { color: var(--cert-probe); }

.chart { padding: 0.5rem 1.1rem 0.4rem; }

/* One role kpress has no token for: the square the reader drags, which must
   read as a separate instrument from the mass it measures. */
:root {
  /* kpress derives every size from this one token, so the page reads larger
     everywhere without any element being restyled. */
  --kpress-host-font-size-base: 18px;
  --cert-probe: oklch(55% 0.145 52);
  --cert-below: {{BELOW_ONE}};
  --cert-near: {{NEAR_LIMIT}};
  --cert-probe-wash: color-mix(in srgb, var(--cert-probe) 14%, transparent);
  --cert-accent-wash: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
}
:root:where([data-kpress-resolved-theme="dark"]) { --cert-probe: oklch(76% 0.13 60); }

/* Keep an inline result, its punctuation and its source reference together. */
.math-reference { white-space: nowrap; }

/* Every outer formula uses its surrounding text size, including displays and
   saved system-font settings. KaTeX still controls scripts and large operators
   inside that em. Override the stock face's legacy display-size compensation. */
.cert-page .katex, .kpress-tooltip .katex { font-size: inherit !important; }

/* Published math reserves widths in em. Linux Chromium's hinted advances can
   round each glyph to a whole pixel, so a width measured there is wrong on
   another platform or at another size. Override KaTeX's explicit `auto` for
   both preparation and reading, including print. */
.kpress .katex, .kpress-tooltip .katex { text-rendering: geometricPrecision; }
/* On macOS, geometricPrecision also disables native hinting and visibly lightens
   the unchanged PT Serif and Source Sans glyphs. CoreText already gives linear
   advances under auto; the preparation guard verifies them at 16x as well. */
@media screen {
  html[data-squares-native-math-metrics] .kpress .katex,
  html[data-squares-native-math-metrics] .kpress-tooltip .katex { text-rendering: auto; }
}

/* Measured bases reserve ascent and descent too. Empty inline carriers must not
   add a font-dependent strut when a fallback face changes, especially in print's
   tighter lines. Preparation copies each base's measured height and depth onto
   its existing KaTeX strut, which also fixes the glyph baseline when print
   changes the font size. */
.kpress [data-kpress-math-prepared="true"] .katex,
.kpress [data-kpress-math-prepared="true"] .katex-html { line-height: 0 !important; }
.kpress [data-kpress-math-prepared="true"] .base { line-height: 0 !important; }

/* Math is held until KaTeX has typeset it, so no raw TeX flashes. */
/* Saved preferences are stamped in the head. Select their measured math before
   first paint; inactive variants occupy no space and are never hydrated. */
.squares-math-variant { display: none; }
html:not([data-kpress-font-set="system"]):not([data-kpress-prose-font="sans"])
  .squares-math-variant[data-squares-math-contexts~="custom-serif"],
html:not([data-kpress-font-set="system"])[data-kpress-prose-font="sans"]
  .squares-math-variant[data-squares-math-contexts~="custom-sans"],
html[data-kpress-font-set="system"]:not([data-kpress-prose-font="sans"])
  .squares-math-variant[data-squares-math-contexts~="system-serif"],
html[data-kpress-font-set="system"][data-kpress-prose-font="sans"]
  .squares-math-variant[data-squares-math-contexts~="system-sans"] { display: inline; }
/* The head bootstrap marks pending enhancement and clears it on failure. Without
   JavaScript, raw TeX remains legible alongside KPress's semantic MathML. */
html[data-kpress-math-pending]
  :is(.tex, .tex-d, [data-kpress-math-prepared="true"]):not([data-squares-math-ready="true"]) {
  visibility: hidden;
}
/* Once startup has queued a wrapper, the root watchdog cannot expose it before
   its render runs. Include native MathML and descendants with explicit visibility. */
.kpress [data-squares-math-queued], .kpress [data-squares-math-queued] * {
  visibility: hidden !important;
}
/* Wide equations scroll sideways; the block keeps headroom for fractions, since
   overflow-x: auto also clips vertically and the display margin is zeroed. */
.tex-d { margin-block: 1.1rem; overflow-x: auto; overflow-y: hidden; padding-block: 0.45rem; }
.tex-d .katex-display { margin: 0; }
.caps .katex, .fig-title .katex, .legend .katex, .hint .katex { text-transform: none; }
.caps .katex { letter-spacing: 0; }
/* ============================================================
   Print. kpress prints a document well: page margins, 11pt type,
   forced-light tokens, break rules for headings, figures, boxes and
   display math, hidden buttons and popovers. It cannot know this page
   carries canvases, control panels and a figure chooser, so what
   follows is only what kpress does not cover.
   ============================================================ */
@media print {
  /* Print shows one certificate, always the one the page opens on, so a
     printed copy does not depend on what the reader last clicked. */
  .cert-figure[data-cert="{{DEFAULT_SLUG}}"][hidden] { display: block !important; }
  .cert-figure:not([data-cert="{{DEFAULT_SLUG}}"]) { display: none !important; }

  /* Nothing on paper can be dragged, hovered or chosen. The buttons kpress
     already hides; these are the rest of the apparatus, including the empty
     rule the chooser would otherwise leave under every figure. */
  .panel, .fig-choose, .cert-page input[type="range"], .screen-only,
  .cert-page figure .rotation-handle { display: none; }

  /* Paper keeps inline code's Planetaire metrics and text role without drawing the
     screen chip behind it. Only decoration changes, so family, color, size, weight,
     baseline and wrapping continue to come from kpress and the surrounding role. */
  .cert-page code:not(pre code) {
    background: transparent;
    border: 0;
  }

  /* Stack the printable figure body and cap canvases so their captions fit. */
  .split { display: block; }
  .stage canvas { max-height: 3.2in; width: auto; max-width: 100%; margin-inline: auto; }
  .trump a { width: min(100%, 3in); }
  .cert-page figure img { max-height: 6.5in; width: auto; max-width: 100%; }

  /* The hundred-packing atlas gets a page of its own. With 0.75in vertical
     margins, its full six-inch width leaves room for the caption. Remove the
     stage's side padding and the old height cap that narrowed the graphic. */
  .cert-page .stage:has(img[src="known-best-1-100.svg"]) { padding-inline: 0; }
  .cert-page .stage > a:has(img[src="known-best-1-100.svg"]) { width: 100%; }
  .cert-page figure img[src="known-best-1-100.svg"] { max-height: none; width: 100%; }

  /* Link targets are deliberately not spelled out after each link: a URL set in
     the middle of a sentence breaks the line badly and reads worse than the
     sentence it interrupts. The footnotes carry the sources, and the colophon
     carries the repository. */

  /* kpress forces its light tokens on `:root` and `.kpress`, which leaves the
     page's own main element and this page's one extra token on their dark
     values. A dark-mode reader would otherwise print prose on a dark ground
     and lose the Figure 7 threshold line entirely. */
  .kpress-page-main {
    --kpress-doc-bg: oklch(100% 0 0);
    --kpress-doc-border: oklch(78.26% 0 0);
    background: oklch(100% 0 0);
    color-scheme: light;
  }
  /* Print prose, captions, labels and the colophon in solid black. Reset both
     text roles at every KPress scope so screen theme tokens cannot shadow them. */
  :root, .kpress, .kpress-page-main, .kpress-tooltip,
  :is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-resolved-theme],
  :is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-palette][data-kpress-resolved-theme] {
    --kpress-doc-muted: #000;
    --kpress-doc-text: #000;
    color: var(--kpress-doc-text);
  }
  :root { --cert-probe: oklch(55% 0.145 52); }

  /* The accent, which the block above forgot. The dark rule near the top of this sheet
     lifts `--kpress-doc-accent` to L=76.68% so links clear 4.5:1 on a dark ground; the
     print reset puts the ground back to white and left the accent where it was, so a
     dark-mode reader printed #6ec5bc links on paper at 2.02:1 against the 5.47:1 the
     light accent gives. Restored to kpress's own light value.

     Declared on the same elements the dark rule names, including the attribute form at
     (0,2,0). Putting it on `.kpress-page-main` alone would be shadowed by the dark
     rule's own declaration on `.kpress` -- exactly how the print type size went missing
     two rules down. */
  :root, .kpress, .kpress-page-main, .kpress-tooltip,
  :is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-resolved-theme] {
    --kpress-doc-accent: oklch(51.09% 0.0861 186.4);
  }

  /* Legend chips carry their meaning in colour alone, so they keep it even
     when the reader prints without background graphics. */
  .legend i { border: 1px solid currentColor; print-color-adjust: exact; }

  /* The title block is a title page. */
  .intro { break-before: page; }

  /* Inline math is hidden until KaTeX finishes; on paper it should fall back
     to its source rather than to nothing. */
  .tex, .tex-d { visibility: visible; }

  /* Unrounded advances. This is what made the serif text look loose and, worse,
     uneven. Chromium's default `text-rendering: auto` rounds every glyph advance
     to a whole CSS pixel at layout time and then writes that rounded position
     into the PDF: measured here, 98.44% of the 11,177 glyph moves in the printed
     file sat on integers. At the print size the rounding is not small. PT Serif
     at 11pt is 14.6667px, where the word space gains 12.3% and `i` and `l` gain
     13.3% while the comma and the full stop lose about 10% -- a spread of 1.395px,
     or 9.5% of an em, between adjacent gaps. The true metrics are identical to the
     screen's; a sweep across 9pt to 14pt puts 11pt at the worst of the range.
     `geometricPrecision` is the only value that turns linear metrics on, it
     inherits, so one declaration covers prose, captions, tables, code and KaTeX,
     and being print-only it leaves the screen's hinted rendering alone. */
  .kpress { text-rendering: geometricPrecision; }

  /* Quotation marks used to be overridden here. kpress borrowed Georgia's into the PT
     Serif stack through a `LocalPunct` @font-face whose `src` was `local("Georgia")`,
     so on the Mac and Windows machines most readers print from, every apostrophe and
     quotation mark came from a face the reader happened to own -- at its own metrics,
     and impossible to embed in the PDF. This scope replaced the prose stack for print
     to keep that out of the printed page.

     kpress ships the marks now (`KPress Quotes`, six glyphs of Source Serif 4 at about
     700 bytes, leading the prose stack through `--kpress-font-punctuation`), so the
     override would do the opposite of what it was for: naming the stack again would
     drop the shipped face and send print back to PT Serif's own marks. It is gone, and
     `render_explainer_pdf --fonts` is what holds the result -- no Georgia in the
     export, and `KPressQuotes` embedded. */

  /* Ragged right. kpress justifies printed prose and asks for automatic
     hyphenation to keep the lines even, but hyphenation needs dictionaries the
     printing engine may not carry: headless Chromium has none, so `hyphens: auto`
     is inert there and justification has nothing to stretch but the word spaces.
     Even word spacing is worth more here than a straight right edge.

     `!important` and the wider selector are deliberate. kpress's rule and this one
     have the same specificity, so this one wins on nothing but the order the two
     stylesheets are inlined in; a kpress release that adds `!important` or narrows
     its selector to `.kpress-prose p` would silently restore justification. The
     extra elements are not justified by kpress today and cost nothing to name.

     What is centred by design carries `.centred` and is carved out of the selector
     rather than restated after it. Restating it is what shipped the bug: the exemption
     was `.colophon { text-align: center !important }` at (0,1,0) against this rule's
     (0,2,0), both `!important` in one stylesheet, so the more specific one won and the
     colophon printed flush left. An exemption that has to out-shout the rule it exempts
     is a race the rule can win; an exemption the rule does not match is not a race at
     all, which is why this one is written with `:not()`. `:is()` takes the specificity
     of its most specific argument -- all type selectors here -- so the selector is

     on the vendor's `justify` instead of on its own centring, which is (0,1,0) and
     loses. This is the restatement the rule above refuses to be, and the difference is

  tex(fieldTip.querySelector('.tip-xy'), `(${fracTex(xn, xd)},\\; ${fracTex(yn, yd)})`);
  tex(fieldTip.querySelector('.tip-w'), `w = ${fracTex(wn, wd)}`);
  swap(fieldTip);
}
const ATOM_PROMPT = 'Hover or tap an atom for its position and weight.';

/* One selection path for every pointer. A mouse selects by moving over an atom; a
   touch has nothing to hover with, so it selects on the way down and keeps what it
   picked, because lifting a finger destroys the pointer and fires `pointerleave`
   at once. Clearing on leave is therefore for the mouse alone. */
const pickAtom = e => {
  const box = fc.getBoundingClientRect();
  const cx = (e.clientX - box.left) / box.width * FS, cy = (e.clientY - box.top) / box.height * FS;
  const i = atomAt(cx, cy);
  fc.style.cursor = i < 0 ? 'default' : 'crosshair';
  if (i === hovered) return;
  hovered = i; drawField();
  if (i < 0) setText(fieldTip, ATOM_PROMPT); else showAtomTip(i);
};
fc.addEventListener('pointermove', pickAtom);
fc.addEventListener('pointerdown', pickAtom);
fc.addEventListener('pointerleave', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;
  if (hovered !== -1) { hovered = -1; drawField(); }
  setText(fieldTip, ATOM_PROMPT);
});

/* ---------- Figure 5: covered mass ---------- */
const pv = document.getElementById('prove-{{SLUG}}'), pg = pv.getContext('2d');
const PS = pv.width, PM = PS * 0.06, PPX = PS - 2 * PM, PSC = PPX / L;
const RES = 230, TIGHT = {{TIGHT_JS}};
let probe = [L * 0.22, L * 0.64], curK = Math.round(STEPS / 3), showHeat = true, heat = null;
let heatQueued = false;
/* Handle geometry in container units, so it scales with the drawing. */
const HGAP = 0.3;
let mode = 'none';

function buildHeat() {
  const img = pg.createImageData(RES, RES), d = img.data;
  const parse = v => { const m = document.createElement('canvas').getContext('2d');
    m.fillStyle = v; m.fillRect(0, 0, 1, 1); return Array.from(m.getImageData(0, 0, 1, 1).data).slice(0, 3); };
  const cLo = parse(css('--cert-below')), cTight = parse(css('--cert-near')),
        cA = parse(css('--cert-accent-wash')), cB = parse(css('--kpress-doc-accent')), cOut = parse(css('--kpress-doc-border'));
  const h = inset();
  const vals = new Float32Array(RES * RES); let hi = 1;
  for (let j = 0; j < RES; j++) { const y = L * (RES - 1 - j) / (RES - 1);
    for (let i = 0; i < RES; i++) { const x = L * i / (RES - 1), m = massAt(x, y) / SCALE;
      vals[j * RES + i] = m;
      if (x >= h && x <= L - h && y >= h && y <= L - h && m > hi) hi = m; } }
  const span = Math.max(hi - TIGHT, 0.25);
  for (let j = 0; j < RES; j++) { const y = L * (RES - 1 - j) / (RES - 1);
    for (let i = 0; i < RES; i++) {
      const x = L * i / (RES - 1), o = 4 * (j * RES + i), m = vals[j * RES + i];
      let col, a;
      if (!(x >= h && x <= L - h && y >= h && y <= L - h)) { col = cOut; a = 45; }
      else if (m < 1) { col = cLo; a = 235; }
      else if (m < TIGHT) { col = cTight; a = 155; }
      else { const t = Math.sqrt(Math.min(1, (m - TIGHT) / span));
             col = [cA[0] + (cB[0] - cA[0]) * t, cA[1] + (cB[1] - cA[1]) * t, cA[2] + (cB[2] - cA[2]) * t];
             a = 70 + 165 * t; }
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = a;
    } }
  const off = document.createElement('canvas'); off.width = off.height = RES;
  off.getContext('2d').putImageData(img, 0, 0);

}

function drawProver() {
  pg.clearRect(0, 0, PS, PS);
  pg.fillStyle = css('--kpress-doc-bg'); pg.fillRect(0, 0, PS, PS);
  const X = x => PM + x * PSC, Y = y => PM + (L - y) * PSC;
  if (showHeat && heat) pg.drawImage(heat, PM, PM, PPX, PPX);
  pg.strokeStyle = css('--kpress-doc-border-hairline'); pg.lineWidth = 2; pg.strokeRect(PM, PM, PPX, PPX);
  const h = inset();
  pg.strokeStyle = css('--kpress-doc-muted'); pg.lineWidth = 1.5; pg.setLineDash([7, 6]);
  pg.strokeRect(X(h), Y(L - h), (L - 2 * h) * PSC, (L - 2 * h) * PSC);
  pg.setLineDash([]);
  const maxw = Math.max(...ATOMS.map(a => a[2]));
  const pu = cs * probe[0] + sn * probe[1], pvv = -sn * probe[0] + cs * probe[1];
  for (const [x, y, w] of ATOMS) {
    const u = cs * x + sn * y, v = -sn * x + cs * y;
    const hit = covered(u, v, pu, pvv);
    pg.fillStyle = hit ? css('--cert-probe') : css('--kpress-doc-accent');
    pg.globalAlpha = hit ? 1 : 0.42;
    const r = Math.sqrt(w / maxw) * PSC * 0.1 + PSC * 0.007;
    pg.beginPath(); pg.arc(X(x), Y(y), r, 0, 6.2832); pg.fill();
  }
  pg.globalAlpha = 1;

  pg.translate(X(probe[0]), Y(probe[1])); pg.rotate(-Math.atan2(sn, cs));
  pg.strokeStyle = css('--kpress-doc-bg'); pg.lineWidth = 7;
  pg.strokeRect(-HALF * PSC, -HALF * PSC, B * PSC, B * PSC);
  pg.strokeStyle = css('--cert-probe'); pg.lineWidth = 4;
  pg.strokeRect(-HALF * PSC, -HALF * PSC, B * PSC, B * PSC);
  pg.restore();

  const [hx, hy] = proverHandle.update();
  if (!window.matchMedia('print').matches) {
    const ex = probe[0] - sn * HALF, ey = probe[1] + cs * HALF;
    pg.strokeStyle = css('--cert-probe'); pg.lineWidth = 2.5;
    pg.beginPath(); pg.moveTo(X(ex), Y(ey)); pg.lineTo(hx, hy); pg.stroke();
  }
}

/* The rotation handle sits off the square's own top edge, so it turns with it. */
function handlePoint() {
  return [probe[0] - sn * (HALF + HGAP), probe[1] + cs * (HALF + HGAP)];
}

/* Any direction reduces onto the net's arc [0, pi/4] by the container's own
   symmetry, which is the reduction Condition 1 pays for. This names the net
   direction nearest to that reduced angle; the readout reports it and the
   slider follows it, while the square itself stays exactly where it was put. */
function nearestNet(phi) {
  let a = ((phi % (Math.PI / 2)) + Math.PI / 2) % (Math.PI / 2);
  if (a > Math.PI / 4) a = Math.PI / 2 - a;
  let best = 0, bestGap = Infinity;
  for (let k = 0; k <= STEPS; k++) {
    const gap = Math.abs(2 * Math.atan(netT(k)) - a);
    if (gap < bestGap) { bestGap = gap; best = k; }
  }
  return best;
}

function updateReadout() {
  const m = massAt(probe[0], probe[1]);
  /* Always over SCALE, never reduced: the denominator is the unit the whole
     certificate is counted in, and a reduced one would change under the reader
     as they drag, which is the opposite of what the readout is for. The six
     places are exact rather than rounded, because SCALE divides a million; the
     renderer refuses a certificate for which it does not. */
  tex(document.getElementById('mv-{{SLUG}}'), `\\dfrac{${m}}{${SCALE}}`);
  /* The comparison sits on the equality line; the pill speaks only when there
     is more to say than the comparison. */
  const covers = m >= SCALE, md = document.getElementById('md-{{SLUG}}');
  tex(md, `= ${(m / SCALE).toFixed(6)} ${covers ? '\\ge' : '\\lt'} 1`);
  md.style.color = covers ? css('--kpress-doc-accent') : css('--cert-below');
  const vd = document.getElementById('vd-{{SLUG}}');
  let cls = 'verdict out', text = '';
  if (!admissible(probe[0], probe[1])) text = 'Outside the domain';
  else if (covers && onNet) text = '';
  else if (covers) text = 'Off the net';
  else if (onNet) { cls = 'verdict no'; text = 'Below 1 in this preview'; }
  else text = 'Off the net: no condition tested';
  const shown = vd.hidden ? '' : vd.textContent;
  vd.hidden = !text;
  if (text && (shown !== text || vd.className !== cls)) { vd.className = cls; vd.textContent = text; swap(vd); }
}
function updateK() {
  const el = document.getElementById('kval-{{SLUG}}');
  /* The half-tangent t is the exact rational the net is built from; the degree
     measure beside it is not, so only the second one carries a mark. */
  const [n, d] = reduce(LIMIT_N * curK, LIMIT_D * STEPS);
  const parts = onNet
    ? [`k = ${curK}`, `t = ${curK === 0 ? '0' : `\\dfrac{${n}}{${d}}`}`,
       `\\theta ${degRel(angle, 4)}^{\\circ}`]
    : [`\\theta ${degRel(angle, 4)}^{\\circ}`, `\\text{nearest net } k = ${curK}`,
       `\\theta_k ${degRel(2 * Math.atan(netT(curK)), 4)}^{\\circ}`];
  /* Attached before it is typeset, not after. `tex` asks the cascade which face the
     words around the expression are in, and a detached span has no cascade: `closest`
     finds no ancestor and `getComputedStyle` answers with nothing, so these three
     readouts came out of the serif composite inside a sans panel. Reuse prepared
     children on startup, retaining their measured boxes while fonts decode. */
  let spans = [...el.children];
  if (spans.length !== parts.length || spans.some(span => !span.classList.contains('math-item'))) {
    spans = parts.map(() => {
      const span = document.createElement('span'); span.className = 'math-item'; return span;
    });
    el.replaceChildren(...spans);
  }
  parts.forEach((part, index) => tex(spans[index], part));
  document.getElementById('kslider-{{SLUG}}').setAttribute('aria-valuetext', onNet
    ? `Direction ${curK} of ${STEPS}; angle ${deg(angle, 4)} degrees`

}
function setProverStatus(text = '') {
  const el = document.getElementById('status-{{SLUG}}');
  el.hidden = !text; setText(el, text);
}
function refresh(rebuild) {
  if (onNet) setDir(curK); else setAngle(angle);
  const h = inset();
  probe[0] = Math.min(L - h, Math.max(h, probe[0]));
  probe[1] = Math.min(L - h, Math.max(h, probe[1]));
  if (rebuild && showHeat) buildHeat();
  drawProver(); updateReadout(); updateK();
}

/* The initial readouts must get a paint before the 53,000-cell preview occupies
   the main thread. The hidden certificate does no heat-map work until selected. */
function scheduleHeat() {
  const visible = () => !pv.closest('.cert-figure').hidden;
  if (heatQueued || heat || !showHeat || !visible()) return;
  heatQueued = true;
  squaresMath.settled().then(() => requestAnimationFrame(() => setTimeout(() => {
    heatQueued = false;
    if (!heat && showHeat && visible()) { buildHeat(); drawProver(); }
  }, 0)));
}

function toWorld(e) {
  const box = pv.getBoundingClientRect();
  return [((e.clientX - box.left) / box.width * PS - PM) / PSC,
          L - ((e.clientY - box.top) / box.height * PS - PM) / PSC];
}
function place(x, y) {
  setProverStatus();
  probe = [Math.min(L, Math.max(0, x)), Math.min(L, Math.max(0, y))];
  drawProver(); updateReadout();
}
function rotateProbe(a) {
  setProverStatus();
  setAngle(a);
  curK = nearestNet(angle);
  document.getElementById('kslider-{{SLUG}}').value = String(curK);
  drawProver(); updateReadout(); updateK();
}

/* Inside the square a drag holds it where it was grabbed; elsewhere a press
   puts the center under the pointer. */
let grabOffset = [0, 0];
function insideProbe(x, y) {
  const u = cs * x + sn * y, v = -sn * x + cs * y;
  const pu = cs * probe[0] + sn * probe[1], pvv = -sn * probe[0] + cs * probe[1];
  return Math.abs(u - pu) <= HALF && Math.abs(v - pvv) <= HALF;
}
pv.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0) return;
  const [x, y] = toWorld(e);
  mode = 'move';
  grabOffset = insideProbe(x, y) ? [probe[0] - x, probe[1] - y] : [0, 0];
  pv.setPointerCapture(e.pointerId);

});
pv.addEventListener('pointermove', e => {
  const [x, y] = toWorld(e);

pv.addEventListener('pointerup', () => { mode = 'none'; });
pv.addEventListener('pointercancel', () => { mode = 'none'; });
const proverHandle = rotationHandle(pv, {
  id: 'prove-rotate-{{SLUG}}', label: 'Rotate the covered square',
  point: () => { const [x, y] = handlePoint(); return [PM + x * PSC, PM + (L - y) * PSC]; },
  angleAt: e => { const [x, y] = toWorld(e); return Math.atan2(-(x - probe[0]), y - probe[1]); },
  getAngle: () => angle, rotate: rotateProbe, redraw: drawProver,
  /* The 53,000-cell field is rebuilt on release, after a tap or a key step. */

document.getElementById('kslider-{{SLUG}}').addEventListener('input', e => {
  setProverStatus(); setDir(+e.target.value); refresh(true);
});
document.getElementById('btn-tight-{{SLUG}}').addEventListener('click', () => {
  setDir(0); document.getElementById('kslider-{{SLUG}}').value = 0;
  probe = [{{WITNESS_X_JS}}, {{WITNESS_Y_JS}}]; refresh(true);
  setProverStatus('Showing the minimum over all {{N_DIRECTIONS}} net directions: k = 0, covered mass {{LEAST_DEC}}.');
});
document.getElementById('btn-scan-{{SLUG}}').addEventListener('click', () => {
  const h = inset(); let best = Infinity, bx = 0, by = 0, N = 300;
  for (let j = 0; j <= N; j++) { const y = h + (L - 2 * h) * j / N;
    for (let i = 0; i <= N; i++) { const x = h + (L - 2 * h) * i / N;
      const m = massAt(x, y); if (m < best) { best = m; bx = x; by = y; } } }
  probe = [bx, by]; drawProver(); updateReadout();

  const lowest = (best / SCALE).toFixed(6);
  setProverStatus('Sampled ' + ((N + 1) ** 2).toLocaleString('en-US') + ' allowed centers ' + (onNet
    ? 'at direction k = ' + curK
    : 'at ≈' + deg(angle, 4) + '°, off the net') + ': lowest sampled mass ' + lowest +
    '. The square now marks one of those sampled minima.');
});
document.getElementById('btn-heat-{{SLUG}}').addEventListener('change', e => {
  showHeat = e.currentTarget.checked;
  if (showHeat && !heat) buildHeat();
  drawProver();
});

/* ---------- Figure 6: the shrink ---------- */
let KNET = 3;
const sk = document.getElementById('shrink-{{SLUG}}'), skg = sk.getContext('2d');
const SKS = sk.width, SKC = SKS / 2, SKSIDE = SKS * 0.62, SKGAP = SKS * 0.055;
sk.style.cursor = 'default';

const phiInput = () => document.getElementById('phi-{{SLUG}}');
/* The unit square's angle. The slider covers the net's arc; the handle turns
   through the whole circle, and the slider then shows the arc angle the
   container's symmetry reduces the square to. */
let phiVal = (+phiInput().value / 10) * Math.PI / 180;
/* The slider moves in tenths of a degree, so an angle it sets is an exact
   number of degrees and the readout prints it as one; the handle turns to
   wherever the pointer is, and from then on the degree readouts are marked. */
let phiExact = true;
const phiNow = () => phiVal;
const arcOf = phi => { const psi = phi % (Math.PI / 2); return psi > Math.PI / 4 ? Math.PI / 2 - psi : psi; };
/* The handle rides the square's own top edge, so it turns with it. */
function phiHandlePoint(phi) {
  const r = SKSIDE / 2 + SKGAP;
  return [SKC - r * Math.sin(phi), SKC - r * Math.cos(phi)];
}
function skToCanvas(e) {
  const box = sk.getBoundingClientRect();
  return [(e.clientX - box.left) / box.width * SKS, (e.clientY - box.top) / box.height * SKS];
}
function setPhiAngle(a) {
  const TAU = 2 * Math.PI;
  phiVal = ((a % TAU) + TAU) % TAU;
  phiExact = false;
  phiInput().value = String(Math.round(arcOf(phiVal) * 180 / Math.PI * 10));
  shrinkDraw();
}
const shrinkHandle = rotationHandle(sk, {
  id: 'shrink-rotate-{{SLUG}}', label: 'Rotate the unit square',
  point: () => phiHandlePoint(phiNow()),
  angleAt: e => { const [x, y] = skToCanvas(e); return Math.atan2(SKC - x, SKC - y); },
  getAngle: phiNow, rotate: setPhiAngle, finish: null, redraw: shrinkDraw,
});
function shrinkDraw() {
  const c = sk, g = skg, S = SKS;
  const phi = phiNow(), psi = phi % (Math.PI / 2), mirrored = psi > Math.PI / 4;
  const arc = arcOf(phi);
  let bestK = 0, bestD = Infinity;
  for (let k = 0; k <= KNET; k++) { const th = 2 * Math.atan(LIMIT * k / KNET);
    if (Math.abs(th - arc) < bestD) { bestD = Math.abs(th - arc); bestK = k; } }
  const theta = 2 * Math.atan(LIMIT * bestK / KNET), d = Math.abs(theta - arc);
  /* The net direction drawn inside the square is theta's image under the same
     symmetry that took phi to the arc, so the two squares stay together. */
  const thetaDrawn = (phi - psi) + (mirrored ? Math.PI / 2 - theta : theta);
  let D = 0;
  for (let k = 0; k < KNET; k++) { const a = LIMIT * k / KNET, b2 = LIMIT * (k + 1) / KNET;
    D = Math.max(D, (b2 - a) / (1 + a * b2)); }
  const Bk = Math.floor(1e7 / (1 + D) - 1) / 1e7;
  const prod = Bk * (Math.cos(d) + Math.sin(d));

  g.clearRect(0, 0, S, S);
  g.fillStyle = css('--kpress-doc-bg'); g.fillRect(0, 0, S, S);
  const sc = S * 0.62;
  g.save(); g.translate(S / 2, S / 2);
  g.save(); g.rotate(-phi);
  g.strokeStyle = css('--kpress-doc-border-hairline'); g.lineWidth = 3;
  g.strokeRect(-sc / 2, -sc / 2, sc, sc);
  g.restore();
  g.save(); g.rotate(-thetaDrawn);
  g.fillStyle = css('--cert-probe-wash'); g.globalAlpha = .8;
  g.fillRect(-Bk * sc / 2, -Bk * sc / 2, Bk * sc, Bk * sc); g.globalAlpha = 1;
  g.strokeStyle = css('--cert-probe'); g.lineWidth = 3;
  g.strokeRect(-Bk * sc / 2, -Bk * sc / 2, Bk * sc, Bk * sc);
  g.restore(); g.restore();

  const [hx, hy] = shrinkHandle.update();
  if (!window.matchMedia('print').matches) {
    const ex = SKC - (SKSIDE / 2) * Math.sin(phi), ey = SKC - (SKSIDE / 2) * Math.cos(phi);
    g.strokeStyle = css('--kpress-doc-border-hairline'); g.lineWidth = 2;
    g.beginPath(); g.moveTo(ex, ey); g.lineTo(hx, hy); g.stroke();
  }

  /* What each of these six can and cannot claim: phi is exact while the slider
     owns it; theta is a net angle, exact only at zero; d is their difference,
     exact only when both are; D is a rational whose decimal does not
     terminate; Bk is a whole multiple of 1e-7 by construction, so seven places
     print it in full; and the product is irrational whatever the other two are. */
  const thetaExact = theta === 0, dExact = phiExact && thetaExact;
  tex(document.getElementById('s-phi-{{SLUG}}'),
      `${degTex(phi, 3, phiExact)}^{\\circ}` +
      (Math.abs(arc - phi) > 1e-9 ? ` \\equiv ${degTex(arc, 3, phiExact)}^{\\circ}` : ''));
  tex(document.getElementById('s-theta-{{SLUG}}'), `${degTex(theta, 3, thetaExact)}^{\\circ}`);
  tex(document.getElementById('s-d-{{SLUG}}'), `${degTex(d, 4, dExact)}^{\\circ}`);
  tex(document.getElementById('s-D-{{SLUG}}'), nearly(D.toFixed(7)));
  tex(document.getElementById('s-B-{{SLUG}}'), Bk.toFixed(7));
  const pe = document.getElementById('s-prod-{{SLUG}}');
  tex(pe, `\\approx ${prod.toFixed(6)} ${prod < 1 ? '\\lt' : '\\ge'} 1`);
  pe.style.color = prod < 1 ? '' : css('--kpress-doc-danger');
}
document.getElementById('phi-{{SLUG}}').addEventListener('input', e => {
  phiVal = (+e.target.value / 10) * Math.PI / 180; phiExact = true; shrinkDraw();
});
const knets = document.querySelectorAll('.cert-figure[data-cert="{{SLUG}}"] .knet');
knets.forEach(b => b.addEventListener('click', () => {
  knets.forEach(o => o.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true'); KNET = +b.dataset.k; shrinkDraw();
}));

/* ---------- boot ---------- */
function boot() {
  drawField(); document.getElementById('kslider-{{SLUG}}').value = String(curK);
  refresh(false); shrinkDraw();
  if (window.matchMedia('print').matches) {
    if (showHeat && !heat && pv.getClientRects().length) buildHeat();
    drawProver();
  } else scheduleHeat();
}
/* Each render validates its actual faces; a prepared formula retains its measured
   box while it hydrates. No unrelated font or heat map delays the first readout. */
boot();
document.addEventListener('squares:certificatechange', scheduleHeat);
const repaint = () => { heat = null; boot(); };
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', repaint);
  /* A canvas is a bitmap, so print CSS cannot recolour one: a reader printing in
     dark mode would get three near-black squares on white paper. Redrawing once
     print media is active picks up the light tokens kpress forces for print. The
     media listener covers a headless render, `beforeprint` the print dialog, and
     `afterprint` puts the screen colours back. */
  const pm = window.matchMedia('print');
  if (pm.addEventListener) pm.addEventListener('change', repaint);
}
window.addEventListener('beforeprint', repaint);
window.addEventListener('afterprint', repaint);
})();
</script>
