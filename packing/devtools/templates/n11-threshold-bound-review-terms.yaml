# Part II's terms, each defined before it is used, in reading order.
#
# Read by `devtools.paper_terms` against the rendered page, and held to it by
# `tests/test_paper_terms.py`; the module's docstring states the six rules. Seeded from
# the series plan's concept spine (docs/project/specs/active/plan-2026-10-05-n11-explainer-
# series.md, §5.3) and from every bold definition in the article.
#
# Fields: `term`; `uses`, a regular expression over prose, or over a formula's TeX when
# `symbol` is true; `defined_by`, an exact substring of the defining sentence as the page
# reads, with each formula written $TeX$ and caption facts filled; `anchor`, the heading id
# of the section that sentence stands in; `requires`, terms defined first; `forward`,
# earlier uses allowed, each an exact substring of the page's text with its reason
# (roadmap, heading, link-to-definition); `series`, the shared concept the term owns or
# recaps (templates/n11-series-terms.yaml). The Result's change list and figures and the
# inventory of What Is New name later concepts by design, each use linked or marked, so
# most forward allowances are theirs; the symbols A, ρ and C are the series' listed
# clashes with Part III.


