# Retained JSON is one record per line: the threshold, and the files that keep their bytes.
#
# Read by `devtools.check_retained_json`, where the rule is argued. Every JSON file the
# repository tracks with more lines than `threshold_lines` must equal its re-layout by
# `sqpack.retained_json.dumps`, unless an entry below exempts it. Each entry is a `path`
# or a `glob` (repository-relative; `**` crosses directories), a `reason`, and `bound_by`,
# what holds its bytes where they are. A `pending` entry is a conversion not yet made, and
# names its bead. An entry that no longer exempts anything fails the check.
#
# Run, from `packing/`:
#   uv run --frozen --all-extras --group dev python -m devtools.check_retained_json
#   uv run --frozen --all-extras --group dev python -m devtools.check_retained_json --inventory

# 5,000 lines is where the 2026-10-03 inventory (think-k131) drew the line: 99 tracked
# JSON files over it, 1.5 million lines of them retained results written a scalar a line.
# The 65 files between 2,001 and 5,000 lines are the next band to inventory, and a lower
# threshold is the ratchet once they are decided.
threshold_lines: 5000

exempt:

# --- Archived source -------------------------------------------------------------------
- glob: packing/resources/**
  reason: archive
  bound_by: >-
    Archived source material is never edited (AGENTS.md, Conventions). A large
    third-party file there is stored with devtools.retained_data as deterministic gzip
    instead, which keeps its bytes.

