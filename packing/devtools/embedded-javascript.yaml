# No JavaScript in Python: what counts as JavaScript, and the files that still hold some.
#
# Read by `devtools.check_no_embedded_js`, where the three rules are argued. The patterns
# are data rather than Python constants for a reason the rule itself creates: a regular
# expression that recognises `querySelector` is a Python string containing `querySelector`,
# and the guard would refuse its own source.
#
# Run, from `packing/`:
#   uv run --frozen --all-extras --group dev python -m devtools.check_no_embedded_js
#   uv run --frozen --all-extras --group dev python -m devtools.check_no_embedded_js --inventory

# A Python string whose literal text matches any of these is JavaScript. Each names a
# construct that is code in JavaScript and prose nowhere in this repository's Python: tuned
# on 2026-09-14 over the 888 Python files at the workbench stack's tip, where every string
# they matched was JavaScript -- page probes, Node test scripts, init scripts, and inline
# page bundles -- and none was a message, a comment or a regular expression. A pattern
# added here has to meet the same bar, measured with `--inventory`.
signatures:
  - '\bdocument\.[A-Za-z_$]'
  - '\bwindow\.[A-Za-z_$]'
  - '\bglobalThis\b'
  - '\bquerySelector(?:All)?\('
  - '\bgetBoundingClientRect\('
  - '\bgetComputedStyle\('
  - '\bgetElementById\('
  - '\baddEventListener\('
  - '\brequestAnimationFrame\('
  # An arrow function: a parameter list or a bare parameter, then `=>`.
  - '(?:\([^()]*\)|\b[A-Za-z_$][\w$]*)\s*=>'
  - '\b(?:const|let)\s+[A-Za-z_$][\w$]*\s*='
  - '\bfunction\s*[A-Za-z_$]*\s*\([^)]*\)\s*\{'
  - '\bnew Promise\b'
  - '\bperformance\.now\('
  - '\bconsole\.(?:log|warn|error)\('
  - '\bJSON\.(?:stringify|parse)\('

# An opening script tag. A JSON data island (`type="application/json"`) is data, not script,
# and a tag must be followed by whitespace or `>`, so a regular expression such as
# `<script[^>]*>` that a Python tool uses to find tags is not itself a tag.
script_tag: '<script(?:\s(?![^>]*\btype\s*=\s*["'']?application/(?:ld\+)?json)[^<>]*)?>'

# What makes the text after a script tag, in the same string, a script body: an identifier
# followed by a call, a member access, an assignment or a statement end. A body that is
# only an interpolation -- a generator inlining a `.js` file -- has none, and passes; so
# does a regular expression's capture group.
script_code: '[A-Za-z_$][\w$]*\s*[(.=;]'

# The ratchet: each file that still embeds JavaScript, the number of sites the guard counts
# in it, and the bead that removes them. The check fails when a count grows, when a count
# shrinks without its entry being lowered to match, when a file not listed here offends, and
# when a listed file no longer offends. Entries only ever leave, and the list is empty when
# think-m0zb closes.
#
# Written from `--inventory` on 2026-09-14 at 477 sites in 48 files, and lowered as files
# came off it. Now 460 sites in 42 files:
#   think-3pox  packing/devtools and packing/tests       324 sites in 25 files
#   think-53dt  the video spikes                          123 sites in 13 files
#   think-xvjf  packages/workbench tools and tests         13 sites in  4 files
