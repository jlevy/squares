# Verified certificates a register entry cites that no case record cites yet, each by a
# recorded decision to defer the case records' adoption of it.
#
# `devtools.check_certificate_citations` fails such an orphan unless it is listed here.
# Each entry names the evidence, the register entries that cite it, the open bead that
# owns the adoption, what the adoption waits on (`blocked_on`, a pull request, an issue or
# a bead), the day it was recorded and why. An entry fails as soon as a case record cites
# its evidence (remove it in that change), a named entry stops citing it, or it is more
# than 30 days older than the evidence register's `last_reviewed`, so the list cannot
# outlive what it defers.
deferrals:
  - evidence: E-wand125-closed-form-cfcheck-sample
    results: [T-180]
    bead: think-3n1x
    blocked_on: think-tsox
    recorded: '2026-10-14'
    reason: >-
      cfcheck's sample replay decides 2,909 leaves of the closed form's intervals 1 and 34
      and no count: a sample sets no rung, and the 33 counts those intervals carry are
      proved by T-064, T-084 and T-086, whose case records the generator drafts. A case
      record cites it once a complete replay moves the closed form's verified lane.
