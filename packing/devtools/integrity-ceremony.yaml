# Integrity ceremony: digest checks of the repository against itself, counted per file
# and only ever falling. Read by `devtools.check_integrity_ceremony`, where the two forms
# and the rule are argued (OR-16). The audit that seeded it is
# docs/project/reviews/review-2026-10-03-integrity-ceremony-audit.md.
#
# Run, from `packing/`:
#   uv run --frozen --all-extras --group dev python -m devtools.check_integrity_ceremony
#   ... --inventory   every site, allowlisted files marked
#   ... --update      rewrite the baseline block once counts have fallen

# What names a digest, matched against identifiers, subscript keys and callees: a `sha`
# token with any suffix of digits, `digest` and `hexdigest`, `blake2`, `md5`, `checksum`,
# `hashes`. Data rather than a Python constant so that the guard's own source holds no
# name it would match. The lookarounds keep `shape`, `shared` and `shard` out.
mark: '(?i)(?<![a-z])(?:sha\d*s?|(?:hex)?digests?|blake2[bs]?|md5|checksum|hashes)(?![a-z])'

# Files whose sites cross a boundary OR-16 admits, each with the boundary's kind:
#   download            bytes acquired from another party, held against the value the
#                       review pinned
#   external-checkout   another repository at a revision
#   generated-artifact  a build product no Git revision names, so a digest is its name
#                       (cache correctness, not an integrity claim)
#   legacy-manifest     retained evidence, not extended
# There is no kind for a file this repository wrote, which is the point. An entry whose
# file holds no site is refused, so the list cannot outlive the code. The letters cite
# the audit's inventory.
allowlist:
  - path: packing/src/sqpack/fractional/parent_core.py
    kind: download
    boundary: Kleddamag's n11 release, read against the digest the review pinned (H1).
  - path: packing/devtools/audit_kleddamag_n11.py
    kind: download
    boundary: Kleddamag's certificate and source manifest against their pinned values (H1).
  - path: packing/src/sqpack/research/unitsquare_precision.py
    kind: download
    boundary: A Kingbird SVG fetched by URL and held against its pinned digest (H2).
  - path: packing/devtools/audit_wand125_point_and_mixed.py
    kind: download
    boundary: wand125's acquired packets, their upstream listings and checker files (H3).
  - path: packing/devtools/audit_wand125_rectangles.py
    kind: download
    boundary: wand125's rectangle certificates and the reviewed upstream checker (H3).
  - path: packing/devtools/audit_wand125_tools.py
    kind: download
    boundary: wand125's published input digests against the regenerated input (H3).
  - path: packing/devtools/audit_tokoharu_density.py
    kind: download
    boundary: Tokoharu's density packet against its file manifest (H4).
  - path: packing/devtools/audit_guzhou_r068.py
    kind: download
    boundary: Guzhou's release certificate against its pin (H5).
  - path: packing/devtools/audit_evand_mixed_covers.py
    kind: download
    boundary: Evan D's run headers against the retained upstream files (H7).
  - path: packing/cases/n54_source_contract/contract.py
    kind: download
    boundary: The retained n54 source and its clean-room copy, BC-141's contract (H8).
  - path: packing/cases/n54_source_contract/verify.py
    kind: download
    boundary: The retained n54 source and its clean-room copy, BC-141's contract (H8).
  - path: packing/devtools/build_known_best_atlas.py
    kind: download
    boundary: Upstream's declared digest of a known-best packing it publishes (H9).
  - path: packing/devtools/check_general_pose_tree_census.py
    kind: external-checkout
    boundary: The general_pose_tree checker, another repository passed by --checker (C3).
  - path: packing/devtools/checkpoint_manifest.py
    kind: legacy-manifest
    boundary: The two retained checkpoint manifests; `pack` writes no new sidecar (F6).
  - path: packages/workbench/tools/workbench_tools/cadence.py
    kind: generated-artifact
    boundary: A video receipt names the built page it was drawn from (G1).
  - path: packages/workbench/tools/workbench_tools/check_animate_view.py
    kind: generated-artifact
    boundary: The built page names the citation file it was built from (G1).
  - path: packages/workbench/tools/workbench_tools/poster.py
    kind: generated-artifact
    boundary: A poster names the captured video it is cut from (G1).

