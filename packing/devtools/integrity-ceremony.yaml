# a fall passes, and `--update` rewrites everything after this comment whenever convenient.
# The merge of origin/main at f864a576a brought in four n = 11 tools written on main before
# OR-16's amendment reached it. Their sites are recorded here as inherited, not new; their
# removal is its own slice (think-vre9).
# The third merge of origin/main on 2026-10-03 brought in more tools written on
