# The baseline: every other file holding sites, by count. First seeded on 2026-10-03 from
# the tree at f4642c051; `--inventory` prints the current total. Only growth is a finding:
# a fall passes, and `--update` rewrites everything after this comment whenever convenient.
# The merge of origin/main at f864a576a brought in four n = 11 tools written on main before
# OR-16's amendment reached it. Their sites are recorded here as inherited, not new; their
# removal is its own slice (think-vre9).
# The third merge of origin/main on 2026-10-03 brought in more tools written on
# main before OR-16's amendment reached it, many replaying third-party certificates whose
# pins may be real boundaries. Recorded as inherited; their review is think-vre9.
# The fourth merge of origin/main on 2026-10-03 (e8aee5177) brought in
# plan_valid9_replay.py, main's ValidTilt9 replay planner, which pins its record and
