# Integrity ceremony: digest checks of the repository against itself, counted per file
# and only ever falling. Read by `devtools.check_integrity_ceremony`, where the two forms
# and the rule are argued (OR-16). The audit that seeded it is
# docs/project/reviews/review-2026-10-03-integrity-ceremony-audit.md.
#
# Run, from `packing/`:
#   uv run --frozen --all-extras --group dev python -m devtools.check_integrity_ceremony
#   ... --inventory   every site, allowlisted files marked
#   ... --update      rewrite the baseline block once counts have fallen

# What names a digest, matched against identifiers, subscript keys and callees: a `sha`
# token with any suffix of digits, `digest` and `hexdigest`, `blake2`, `md5`, `checksum`,
# `hashes`. Data rather than a Python constant so that the guard's own source holds no
# name it would match. The lookarounds keep `shape`, `shared` and `shard` out.
mark: '(?i)(?<![a-z])(?:sha\d*s?|(?:hex)?digests?|blake2[bs]?|md5|checksum|hashes)(?![a-z])'

# Files whose sites cross a boundary OR-16 admits, each with the boundary's kind:
#   download            bytes acquired from another party, held against the value the
#                       review pinned
#   external-checkout   another repository at a revision
#   generated-artifact  a build product no Git revision names, so a digest is its name
#                       (cache correctness, not an integrity claim)
#   legacy-manifest     retained evidence, not extended
# There is no kind for a file this repository wrote, which is the point. An entry whose
# file holds no site is refused, so the list cannot outlive the code. The letters cite
# the audit's inventory.
allowlist:
  - path: packing/devtools/ryxu_arrangement_reports.py
    kind: external-checkout
    boundary: >-
      All 25 immutable external ry-xu certificate strings are held against the
      acquisition pins when acquired and when recovered from copied private facts.
      These digests bind external source bytes; complete geometry and actual deciding
      outcomes are separately reconstructed and admitted, never inferred from a hash.
  - path: packing/devtools/ryxu_radical_n51.py
    kind: external-checkout
    boundary: >-
      The acquired external source root and its full selected n51 record are matched
      to their reviewed acquisition pins. Complete generated native input/result
