type: object
additionalProperties: false
required: [id, hypotheses, measurement, correctness, judgment]
properties:
  id: {type: string, pattern: '^exp-[0-9]{3}$'}
  hypotheses:
    type: array
    minItems: 1
    uniqueItems: true
    items: {const: H-001}
  measurement: {type: string, minLength: 1}
  correctness: {const: passed}
  judgment: {type: string, minLength: 1}
