type: object
additionalProperties: false
required: [id, title, kind, measurements, judgment, correctness]
properties:
  id: {type: string, pattern: '^exp-[0-9]{3}$'}
  title: {type: string, minLength: 1}
  kind: {enum: [baseline, geometry, comparison]}
  hypotheses:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^H-[0-9]{3}$'}
  measurements:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  judgment: {type: string, minLength: 1}
  correctness: {enum: [pending, passed, failed]}
  needs_review: {type: boolean}
