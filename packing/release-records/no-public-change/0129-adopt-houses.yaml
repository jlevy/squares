reason: >-
  The intake's regularization step (think-g3q7) adds `regularization_owed` to the house-adoption
  writer, which its command line prints after a write and a dry run, and a docstring paragraph.
  The builders reach the module through `generate_frontier_case` and `source_supersession`,
  which call `holds`, `adopt_case`, `held_note` and `carries_held_note`, never `main` or the
  new functions; no case record, coverage row, deferral or prose the writer produces changes,
  and its new import of `default_drawings` is one the site's builders already make. In `default_drawings`
  (reviews A1 and B1 of #641), `count_state` no longer reads a count `PENDING_ALLOWED` names
  as regular as published, which changes no state today, since every listed count is pending:
  `default_drawings --check` passes on the committed record byte for byte. The new `--compare`
  report reads two records and no builder calls it; the builders read `decisions`, `regularized_defaults`,
  `held_reasons` and `credit_line`, none of them changed. No render was taken, and every component
  keeps its version.
