reason: >-
  News and result pages link their GitHub issues (think-i8ks): `github_references` gains `reporting_issues`,
  `issues_reporting`, `issue_url` and `cited_issues`, and no existing function changes; `render_changelog`
  gains the `issues` check and backfill and renders an entry's issues beside its PRs in `_entry_lines`;
  `result_overview.links_section` adds an Issues row. The papers reach `render_changelog`
  only through `site_documents`, which calls `entry_anchor`, unchanged, reach `github_references`
  only through `overview_sections`' `parse_github_reference`, unchanged, and no paper builder
  calls `links_section`, `result_popover_html` or the News renderers, which only the site's
  pages and result pages call. Measured at link revision f2341b95: the four papers rendered
  into empty site directories twice from this tree and once with main's three changed modules
  swapped in, 69 files each, all byte-identical across the three, and again after the opening-day
  rule was added to the three modules, byte-identical again. Every paper keeps its version:
  v0.4.30, v0.1.11, v0.1.4 and v0.2.7.
