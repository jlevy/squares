reason: >-
  Reviewed October 20, 2026 against main ded4727b (think-uomm): check_squares now takes each
  square's intervals on its own two edge normals once rather than once per pair, and builds
  the same eight exact Fraction gaps in the same order, so every pair gap and verdict it returns
  is unchanged. test_rational_witness_independent_contract holds it to the old pair_gap, kept
  verbatim, by Fraction equality on adversarial cases and retained views, and regularize_axis_components
  --verify-atlas passed with it, re-deriving the regularized index (which records the checker's
  verdict and pair count) and every retained view byte-identical. The checker is a candidate
  input only as a member of the site builders' import closure; no retained record changes,
  and the atlas, home and results pages draw those records. This is a measured disposition
  of the checker's outputs; no site rebuild byte comparison is claimed.
