reason: >-
  PR406 (review H1) moves stored_size, OR-18's size of a blob as Git stores it, from upper_bound_houses
  into the new devtools.git_storage, so that the added-blob guard shares it without importing
  the house tooling. The function body is unchanged and upper_bound_houses imports it under
  the same name; the module's other change is its docstring. Re-measured on main e929137a8
  with this branch merged: six modules in each paper's producer import closure, the explainer's
  and the survey's PDF producer included, import upper_bound_houses: adopt_houses, build_known_best_atlas,
  check_results, check_source_coverage, register_regularized_bounds and run_negative_controls
  (review J1). Every one of them leaves stored_size, staged_sizes and print_sizes uncalled;
  only the module's own sizes command runs them, and the rest of git_storage serves only the
  added-blob guard, which no paper producer imports. Manuscripts, scientific inputs, figures
  and paper metadata are unchanged, so the explainer keeps v0.4.19, the optimality review
  v0.1.10, the threshold review v0.1.3 and the methods survey v0.2.6. Source-reviewed; no
  render or byte identity is claimed.
