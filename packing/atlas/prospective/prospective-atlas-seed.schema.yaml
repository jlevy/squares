$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ProspectiveAtlasSeed/v1
title: Annotation-free prospective square-packing atlas seed
type: object
additionalProperties: false
required:
- status
- generated_by
- source_map
- selection
- excluded
- retained_sources
- rendering_policy
- annotation_policy
- entries
properties:
  status: {const: partial-prospective-corpus-seed-not-hypothesis-evidence}
  generated_by: {const: python -m devtools.build_prospective_atlas}
  source_map:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {const: packing/atlas/prospective/source-availability-101-324.json}
  selection:
    type: object
    additionalProperties: false
    required: [count, exact_generated_grid_cases, unitsquare_rendering_cases]
    properties:
      count: {const: 101}
      exact_generated_grid_cases: {const: 97}
      unitsquare_rendering_cases: {const: 4}
  excluded:
    type: object
    additionalProperties: false
    required: [count, source_key, reason]
    properties:
      count: {const: 123}
      source_key: {const: kingbird-current-catalogue}
      reason: {type: string, minLength: 1}
  retained_sources:
    type: array
    minItems: 4
    maxItems: 4
    items:
      type: object
      additionalProperties: false
      required: [n, path, url, retrieved, bytes, creator, license]
      properties:
        n: {enum: [103, 105, 110, 131]}
        path:
          type: string
          pattern: '^packing/resources/web/prospective-packings/unitsquare/n[0-9]{3}\.svg$'
        url: {type: string, format: uri}
        retrieved: {type: string, format: date}
        bytes: {type: integer, minimum: 1}
        creator: {const: UnitSquare Project}
        license: {const: CC-BY-4.0-in-dataset-page-metadata}
  rendering_policy: {const: repository deterministic house renderer}
  annotation_policy: {type: string, minLength: 1}
  entries:
    type: array
    minItems: 101
    maxItems: 101
    items:
      type: object
      additionalProperties: false
      required: [n, source, witness, rendering, annotation_status]
      properties:
        n: {type: integer, minimum: 101, maximum: 324}
        annotation_status: {const: prohibited-uncomputed}
        source:
          oneOf:
          - $ref: '#/$defs/grid_source'
          - $ref: '#/$defs/unitsquare_source'
        witness:
          type: object
          additionalProperties: false
          required: [id, path, coordinate_provenance, method]
          properties:
            id: {type: string, pattern: '^W-prospective-source-n[0-9]{3}$'}
            path: {type: string, pattern: '^witnesses/prospective/n-[0-9]{3}\.yaml$'}
            coordinate_provenance:
              enum: [numerically-checked, verified]
              description: >-
                Mirrors the witness claim field of the same name: how this record's
                coordinates were established, never the standing of s(n).
            method: {enum: [numerical-multiprecision, exact-algebraic]}
            tolerance: {type: string, minLength: 1}
        rendering:
          type: object
          additionalProperties: false
          required: [path, renderer]
          properties:
            path:
              type: string
              pattern: '^atlas/prospective/rendering/n-[0-9]{3}\.svg$'
            renderer: {const: sqpack deterministic house renderer}
$defs:
  grid_source:
    type: object
    additionalProperties: false
    required: [kind, source_key, derivation]
    properties:
      kind: {const: exact-generated-grid}
      source_key: {const: catalogue-trivial-grid-rule}
      derivation: {type: string, minLength: 1}
  unitsquare_source:
    type: object
    additionalProperties: false
    required: [kind, source_key, derivation, path, url]
    properties:
      kind: {const: unitsquare-rendering}
      source_key: {const: unitsquare-release-1}
      derivation: {type: string, minLength: 1}
      path:
        type: string
        pattern: '^packing/resources/web/prospective-packings/unitsquare/n[0-9]{3}\.svg$'
      url: {type: string, format: uri}
