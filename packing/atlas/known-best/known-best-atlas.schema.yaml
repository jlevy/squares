$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:KnownBestAtlas/v1
title: Known-best square-packing atlas
type: object
additionalProperties: false
required: [range, generated_by, policy, entries]
properties:
  range:
    type: object
    additionalProperties: false
    required: [first_n, last_n, count]
    properties:
      first_n: {const: 1}
      last_n: {const: 100}
      count: {const: 100}
  generated_by: {type: string, minLength: 1}
  policy:
    type: object
    additionalProperties: false
    required: [source_layer, witness_layer, rendering_layer, annotation_layer]
    properties:
      source_layer: {type: string, minLength: 1}
      witness_layer: {type: string, minLength: 1}
      rendering_layer: {type: string, minLength: 1}
      annotation_layer: {type: string, minLength: 1}
  composite:
    type: object
    additionalProperties: false
    required:
      [
        layout,
        renderer,
        square_count,
        svg,
        png_preview,
        png_high_resolution,
        png_link_preview_card,
      ]
    properties:
      layout: {const: '10 by 10, row-major n=1..100'}
      renderer: {const: sqpack deterministic composite renderer}
      square_count: {const: 5050}
      svg:
        type: object
        additionalProperties: false
        required: [path, width, height]
        properties:
          path: {const: atlas/known-best/known-best-1-100.svg}
          width: {const: 2400}
          height: {const: 2896}
      png_preview:
        type: object
        additionalProperties: false
        required: [path, derived_from, scale, width, height]
        properties:
          path: {const: atlas/known-best/known-best-1-100.png}
          derived_from: {const: atlas/known-best/known-best-1-100.svg}
          scale: {const: 1}
          width: {const: 2400}
          height: {const: 2896}
      png_link_preview_card:
        # The one export that is a crop rather than a scale. Every unfurler shows a
        # landscape card and centre-crops what it is handed, so a portrait canvas
        # arrives as a band from the middle of the grid with the title gone. 2400x1256
        # is 1.91:1 to the nearest whole pixel, which is the ratio those platforms
        # want, so the crop here is the crop shown. Same width as the canvas, because
        # it is the top of the same drawing and not a second one.
        type: object
        additionalProperties: false
        required: [path, derived_from, scale, top_crop, width, height]
        properties:
          path: {const: atlas/known-best/known-best-1-100-card.png}
          derived_from: {const: atlas/known-best/known-best-1-100.svg}
          scale: {const: 1}
          top_crop: {const: true}
          width: {const: 2400}
          height: {const: 1256}
      png_high_resolution:
        # The whole-number scale is the load-bearing constant, not the pixel counts:
        # a fractional scale lands every edge on a fractional pixel boundary and the
        # antialiasing shades it invents cost more bytes than the extra pixels do.
        type: object
        additionalProperties: false
        required: [path, derived_from, scale, width, height]
        properties:
          path: {const: 'atlas/known-best/known-best-1-100@2x.png'}
          derived_from: {const: atlas/known-best/known-best-1-100.svg}
          scale: {const: 2}
          width: {const: 4800}
          height: {const: 5792}
  entries:
    type: array
    minItems: 100
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required:
        [n, frontier_path, reported_side, source, witness, rendering, chunk_annotation]
      properties:
        n: {type: integer, minimum: 1, maximum: 100}
        frontier_path: {type: string, pattern: '^frontier/n-[0-9]{3}\.md$'}
        reported_side: {type: string, minLength: 1}
        source:
          type: object
          additionalProperties: false
          required: [kind, path, source_n, listed_n, derivation]
          properties:
            kind: {enum: [exact-grid, kingbird-derived-facts, unitsquare-rendering]}
            path: {type: string, minLength: 1}
            url: {type: string, minLength: 1}
            source_n: {type: integer, minimum: 1, maximum: 100}
            listed_n:
              type: array
              minItems: 1
              items: {type: integer, minimum: 1, maximum: 100}
            derivation: {type: string, minLength: 1}
        witness:
          type: object
          additionalProperties: false
          required: [id, path, coordinate_provenance, method]
          properties:
            id: {type: string, pattern: '^W-known-best-n[0-9]{3}$'}
            path: {type: string, pattern: '^witnesses/known-best/n-[0-9]{3}\.yaml$'}
            coordinate_provenance:
              enum: [numerically-checked, verified]
              description: >-
                Mirrors the witness claim field of the same name: how this record's
                coordinates were established, never the standing of s(n). Optimality
                and exactness live in frontier/n-NNN.md.
            method: {enum: [numerical-multiprecision, exact-algebraic]}
            tolerance: {type: string, minLength: 1}
        rendering:
          type: object
          additionalProperties: false
          required: [path, renderer]
          properties:
            path: {type: string, pattern: '^atlas/known-best/rendering/n-[0-9]{3}\.svg$'}
            renderer: {const: sqpack deterministic house renderer}
        chunk_annotation:
          type: object
          additionalProperties: false
          required: [status, path, note]
          properties:
            status: {enum: [unreviewed, calibration, holdout, annotated]}
            path: {type: [string, 'null']}
            note: {type: string, minLength: 1}
