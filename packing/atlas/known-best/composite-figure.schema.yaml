$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:CompositeFigure/v1
title: Composite figure record
description: >-
  Every fact the known-best composites state, one entry per case, with the
  provenance of each. The figures render from this record and from nothing else,
  so what a drawing asserts and what this file asserts cannot drift apart.

  Provenance is carried per fact rather than inferred, because a missing value
  has several distinct meanings that a bare null cannot separate: transcribed
  from a source, missed in transcription, the source is silent, or nobody knows.
  Reviewing the corpus programmatically means asking which facts are "derived"
  or "absent" here while a source could supply them.
type: object
additionalProperties: false
required: [range, composites, generated_by, provenance_vocabulary, totals, entries]
properties:
  range:
    # The corpus this record carries, as values rather than as constants in a schema:
    # widening it is a change to the builder's corpus range and to these numbers, not
    # to this file. What the schema cannot state -- that count is last_n - first_n + 1,
    # and that entries carries exactly that many cases -- is checked against the data by
    # `devtools.build_known_best_atlas --check`, which rebuilds both records from the
    # same range, so a case that goes missing still fails a gate rather than passing
    # quietly.
    $ref: '#/$defs/range'
  composites:
    # Which figures state these facts, and at what grid. A list, because the corpus can
    # publish more than one composite of itself and a second is a second entry rather
    # than a second shape. Pixels are deliberately absent: the canvas belongs to the
    # builder and is recorded in atlas/known-best/manifest.json.
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [stem, range, columns, rows, layout, square_count, totals]
      properties:
        stem: {type: string, pattern: '^known-best-[0-9]+-[0-9]+$'}
        # The legend counts over the cases this composite draws, so the 1-100 figure's
        # legend is fixed by its own cases rather than by the corpus.
        totals: {$ref: '#/$defs/totals'}
        range: {$ref: '#/$defs/range'}
        columns: {type: integer, minimum: 1}
        rows: {type: integer, minimum: 1}
        layout: {type: string, pattern: '^[0-9]+ by [0-9]+, row-major n=[0-9]+\.\.[0-9]+$'}
        square_count: {type: integer, minimum: 1}
    # The published figure's grid is pinned, the way this file used to pin the range
    # with constants. A composite under any other stem does not match and is free.
    contains:
      type: object
      required: [stem, columns, rows, layout, square_count]
      properties:
        stem: {const: known-best-1-100}
        columns: {const: 10}
        rows: {const: 10}
        layout: {const: '10 by 10, row-major n=1..100'}
        square_count: {const: 5050}
  generated_by: {type: string, minLength: 1}
  provenance_vocabulary:
    type: object
    additionalProperties: false
    description: What each provenance value asserts. Kept in the data so a reader need not consult code.
    required: [frontier, catalogue, derived, absent]
    properties:
      frontier: {type: string, minLength: 1}
      catalogue: {type: string, minLength: 1}
      derived: {type: string, minLength: 1}
      absent: {type: string, minLength: 1}
  totals: {$ref: '#/$defs/totals'}
  entries:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/entry'}
$defs:
  totals:
    type: object
    additionalProperties: false
    description: Counts the figure's legend prints. Recomputed on every build, so a legend cannot go stale against the entries.
    required:
      - proved_optimal
      - exact_value_known
      - only_known_numerically
      - rigidity_established
      - rigidity_catalogue_annotated
      - lower_bound_first_proved_here
      - degree_known
      - degree_recorded_upstream
      - degree_derived_here
    # Each is a count over the entries, so none can exceed how many there are. The
    # ceiling is the corpus size rather than a hundred, and it is checked where the
    # totals are recomputed on every build.
    properties:
      proved_optimal: {type: integer, minimum: 0}
      exact_value_known: {type: integer, minimum: 0}
      only_known_numerically: {type: integer, minimum: 0}
      rigidity_established: {type: integer, minimum: 0}
      rigidity_catalogue_annotated: {type: integer, minimum: 0}
      lower_bound_first_proved_here: {type: integer, minimum: 0}
      degree_known: {type: integer, minimum: 0}
      degree_recorded_upstream: {type: integer, minimum: 0}
      degree_derived_here: {type: integer, minimum: 0}
  range:
    type: object
    additionalProperties: false
    required: [first_n, last_n, count]
    properties:
      first_n: {type: integer, minimum: 1}
      last_n: {type: integer, minimum: 1}
      count: {type: integer, minimum: 1}
  provenance:
    enum: [frontier, catalogue, derived, absent]
  entry:
    type: object
    additionalProperties: false
    required: [n, side, lower, optimality, exactness, rigidity, badges]
    properties:
      n: {type: integer, minimum: 1}
      side:
        type: object
        additionalProperties: false
        description: The number under the packing, and whether it is an equality or a bound.
        required: [value, relation, display, provenance]
        properties:
          value: {type: string, minLength: 1}
          relation:
            enum: [equality, upper-bound]
            description: equality only where optimality.status is proved.
          display: {type: string, minLength: 1}
          provenance: {$ref: '#/$defs/provenance'}
      lower:
        type: object
        additionalProperties: false
        description: >-
          The certified floor under the packing, and whether this project proved it.
          `display` is cut off rather than rounded, so the printed bound stays true as
          written; `shown` is false where optimality.status is proved and the equality
          on the line above already says it.
        required: [value, shown, display, first_proved_here, evidence, provenance]
        properties:
          value: {type: string, minLength: 1}
          shown: {type: boolean}
          display: {type: string, minLength: 1}
          first_proved_here:
            type: boolean
            description: >-
              True where verified_lower_bound cites first-party evidence the register
              scores as novel. Read from evidence.yaml, never inferred from the numbers.
          evidence:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
          provenance: {$ref: '#/$defs/provenance'}
      optimality:
        type: object
        additionalProperties: false
        required: [status, provenance]
        properties:
          status: {enum: [proved, open]}
          provenance: {$ref: '#/$defs/provenance'}
      exactness:
        type: object
        additionalProperties: false
        description: >-
          Whether s(n) is pinned exactly. state is closed-form when a radical is
          on record, minimal-polynomial when only a defining polynomial is, and
          numeric-only when neither is. numeric-only is a statement about what
          the sources give, never a claim that the value is not algebraic.
        required: [state, degree, degree_provenance]
        properties:
          state: {enum: [closed-form, minimal-polynomial, numeric-only]}
          exact_form: {type: [string, 'null']}
          minimal_polynomial: {type: [string, 'null']}
          degree: {type: [integer, 'null'], minimum: 1}
          degree_provenance: {$ref: '#/$defs/provenance'}
          degree_recorded_upstream:
            type: boolean
            description: >-
              False with a non-null degree marks a fact this repository can
              compute but does not store. That pairing is the review target.
      rigidity:
        type: object
        additionalProperties: false
        description: >-
          established means THIS REPOSITORY holds a sound argument -- the record's own
          rigidity block reads locally-rigid. not-established means no such argument is on
          hand, NEVER that the packing is known to have play, and in particular a
          catalogue-annotation basis under not-established means a source calls it rigid
          and we have not shown it (D-385).
        required: [state, basis, provenance]
        properties:
          state: {enum: [established, not-established]}
          basis:
            enum: [perfect-square-tiling, first-party-argument, catalogue-annotation, none]
          evidence: {type: [string, 'null']}
          provenance: {$ref: '#/$defs/provenance'}
      badges:
        type: array
        maxItems: 3
        description: Rendered left to right. Each is fully determined by the facts above.
        items:
          type: object
          additionalProperties: false
          required: [glyph, meaning, style]
          properties:
            glyph: {enum: ['O', '=', "≈", 'R']}
            meaning: {type: string, minLength: 1}
            style: {enum: [solid, muted]}
