$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:BoundCitations/v1
title: Bound citations
description: >-
  Where each bound the stage shows comes from, one entry per case: the upper bound is
  the case's reported_upper_bound and the lower bound its verified_lower_bound, the two
  values composite-figure.json draws. Generated by devtools.build_bound_citations from
  the frontier register and resources/bibliography.yaml, never written by hand.

  A null citation is a line deliberately left out: the bound is derived from
  common-knowledge evidence alone (the grid, the area bound, center counting), which
  the evidence schema says no citation is owed. What the schema cannot state -- that
  each value equals composite-figure.json's for the same n and bound, that the recent
  lower bounds are exactly the starred cases and the project ones exactly those
  first_proved_here, that a lower bound's corrects is what the results it lists say
  they correct, that every source key is defined in
  resources/README.md, and that each listed result carries one of the bound's own
  evidence entries, with confirmed_by a subset of results in id order -- is checked by
  tests/test_bound_citations.py.
type: object
additionalProperties: false
required: [generated_by, entries]
properties:
  generated_by: {type: string, minLength: 1}
  entries:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/entry'}
$defs:
  entry:
    type: object
    additionalProperties: false
    required: [n, record, upper, lower]
    properties:
      n: {type: integer, minimum: 1}
      # The frontier case record both lines come from, packing/frontier/<record>.md. Every
      # case has one, including a case whose two lines are both left out.
      record: {type: string, pattern: '^n-[0-9]{3}$'}
      upper:
        oneOf:
          - {type: 'null'}
          - {$ref: '#/$defs/citation'}
      # A lower bound on the stage is always the certified one, so its citation is too.
      lower:
        oneOf:
          - {type: 'null'}
          - allOf:
              - {$ref: '#/$defs/citation'}
              - required: [recent, corrects]
                properties:
                  assurance: {const: verified}
  citation:
    type: object
    additionalProperties: false
    required: [text, note, basis, assurance, source_key, result, results, confirmed_by, value]
    properties:
      # The reference the stage draws: where the bound comes from, and nothing else.
      text: {type: string, minLength: 1, maxLength: 66}
      # Everything this project has to say about the bound, as the one parenthesis drawn
      # after the reference, or null where there is nothing: "(reported)" where the
      # register has not certified it, "(confirmed T-009)" where a result of ours checks
      # it, "(reported; confirmed T-009)" where both. The reference and the note together
      # are what must fit the stage's line, which the builder checks.
      note:
        oneOf:
          - {type: string, pattern: '^\((reported|confirmed T-[0-9]{3}(, T-[0-9]{3})*|reported; confirmed T-[0-9]{3}(, T-[0-9]{3})*)\)$'}
          - {type: 'null'}
      basis: {enum: [external, project]}
      # `verified` only where the register certifies the value shown; an upper bound it
      # reports but has not certified is `reported`.
      assurance: {enum: [verified, reported]}
      source_key:
        oneOf:
          - {type: string, pattern: '^\[.+\]$'}
          - {type: 'null'}
      # The result that established the bound, where it is this project's own.
      result:
        oneOf:
          - {type: string, pattern: '^T-[0-9]{3}$'}
          - {type: 'null'}
      # Every result for this n that carries one of the bound's own evidence entries, in id
      # order: the one that established it, or those that confirm, replay or cite it.
      results: {$ref: '#/$defs/result_ids'}
      # The results among those that confirm an external bound -- they carry an entry this
      # project performed -- and so are named in the line's note.
      confirmed_by: {$ref: '#/$defs/result_ids'}
      # The bound's stored value, as the frontier record and composite-figure.json print it.
      value: {type: string, minLength: 1}
      # A lower bound's only: whether it is a recent result, which the stage and the atlas
      # star. This project's own new bounds are recent by construction; an external one is
      # recent where its source's bibliography `dated` is on or after RECENT_SINCE in
      # devtools.build_bound_citations. It says when, not whose: the line says whose.
      recent: {type: boolean}
      # A lower bound's only: the published work it corrects, or null. Read from the
      # `corrects` field of the results in `results` (frontier/results.yaml): the
      # corrected work's bibliography key, its short citation as the bibliography prints
      # it, which a page writes as "corrects Nagamochi 2005", and the register's record of
      # that publication. A correcting bound is still recent and starred; this says which
      # publication it stands in for. Not a correction to this project's own record,
      # which is a defect entry in defects.yaml. The stage sets the tag between the
      # reference and the note, so it counts toward the line's width.
      corrects:
        oneOf:
          - {type: 'null'}
          - type: object
            additionalProperties: false
            required: [source_key, credit, result]
            properties:
              source_key: {type: string, pattern: '^\[.+\]$'}
              credit: {type: string, minLength: 1}
              result: {type: string, pattern: '^T-[0-9]{3}$'}
    # This project's result cites its result id and no external key, and has nothing to
    # confirm; an external source cites its key and no result.
    allOf:
      - if:
          properties: {basis: {const: project}}
        then:
          properties:
            result: {type: string}
            source_key: {type: 'null'}
            results: {minItems: 1}
            confirmed_by: {maxItems: 0}
        else:
          properties:
            result: {type: 'null'}
            source_key: {type: string}
  result_ids:
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^T-[0-9]{3}$'}
