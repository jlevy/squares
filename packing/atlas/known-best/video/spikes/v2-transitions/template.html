<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best known packings: transition review candidate</title>
<style>
__FONT_CSS__
:root {
  --ink: #17202a;
  --muted: #5c6673;
  --label: #47525f;
  --quiet: #8a939e;
  --quiet-rule: #c9cfd5;
  --new: #a3123f;
  /* Revision 8: the one green on the page, and it means one thing — the arrangement on the stage
     is the best known one. Nothing else is ever drawn in it. */
  --met: #17794a;
  --paper: #ffffff;
  --panel: #f7f8fa;
  --chrome: #e6e8eb;
  --rule: #d5d9de;
  --track: #dfe3e7;
  /* "Atlas Symbols" is KaTeX_Main restricted to the relation code points (≤ ≥ √ ≈ …) that the
     latin subsets do not carry; it follows PT Serif so those glyphs never fall back to Georgia. */
  --serif: "PT Serif", "Atlas Symbols", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Atlas Symbols", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--chrome);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  overflow: hidden;
}
body.capture { background: var(--paper); }
#viewport {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
}
#stage-wrap { position: relative; flex: none; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  background: var(--paper); transform-origin: 0 0;
  box-shadow: 0 8px 40px rgba(23, 32, 42, 0.18);
}
body.capture #stage { box-shadow: none; }
/* Revision 9: the squares can be picked up, so the surface takes pointer gestures rather than the
   browser's pan and zoom, and says so with the cursor. */
#packing-svg { position: absolute; left: 60px; top: 24px; width: 1000px; height: 1000px; display: block; touch-action: none; }
#packing-svg #squares { cursor: grab; }
body.dragging #packing-svg #squares { cursor: grabbing; }
#links line { stroke: var(--paper); stroke-opacity: 0.85; stroke-width: 2; }
/* Revision 11: the relationship graph drawn on the stage — a faint line on every pair the
   attraction is actually reaching. It rides the correspondence overlay's own control rather than
   adding a second one, and a general relationship (every pair attracts) draws nothing, there being
   no mask to show. */
#mask-links line { stroke: var(--paper); stroke-opacity: 0.9; stroke-width: 2.5; stroke-dasharray: 5 4; }
/* Revision 12: a target contact graph is drawn in two classes, because the difference between them
   is the measurement. An edge whose two squares share a whole side right now is solid and white —
   it lies across the pair it joins, so white reads against the fill. One that is only wanted is
   dashed and dark: it is usually long and crosses paper, where white would be invisible. */
#mask-links line.met { stroke: var(--paper); stroke-opacity: 1; stroke-width: 4.5; stroke-dasharray: none; }
#mask-links line.unmet { stroke: var(--ink); stroke-opacity: 0.62; stroke-width: 3; stroke-dasharray: 7 6; }
/* The edge being drawn, following the cursor from the square it started on. */
#draw-line { stroke: var(--ink); stroke-opacity: 0.75; stroke-width: 3.5; stroke-dasharray: 2 7; }
/* Drawing mode: no square is ever picked up, and the cursor says which gesture is live. */
body.drawing #packing-svg #squares { cursor: crosshair; }
#ghost rect { stroke: var(--muted); }
#mark rect { stroke: none; }
#facts { position: absolute; left: 1160px; top: 0; width: 700px; height: 1080px; }
.facts-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; will-change: opacity; }
/* Type scale, revision 4: four sizes on the stage, 28 / 34 / 44 / 96 px, nothing smaller than
   28 so the page reads on video. 28 is every small line (the PROVED and OPEN heads, the
   small-caps note, the badge labels, the open group, the progress bar's labels); 34 the exact
   line; 44 both bound lines, one size because they are one kind of fact; 96 the `n =` line and
   the numeral, PT Serif Regular, 3.4 times the smallest.
   The badge glyphs are drawn marks in the poster's boxes, not stage text. */
/* Revision 8, feature 4: how close the arrangement on the stage is to the best known, drawn on a
   scale that runs from the proved lower bound to comfortably past the record. The panel's top 200 px
   were empty, and this is what goes in them: the head row at 24, the bar at 66, the two tick numbers
   below it, the whole thing ending at 166, clear of the `n =` line at 196.
   Revision 9 folds the two tabs into one view, so the bar is always drawn: the range is the spine and
   its `to` end is the n the bar measures.
   The two numbers are the ones the panel itself prints, s(n) <= and s(n) >=, read from the record. */
.gapbar { position: absolute; left: 6px; top: 24px; width: 694px; height: 150px; }
.gapbar-head {
  position: relative; height: 34px; line-height: 34px; font-family: var(--sans); font-size: 28px;
  font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--quiet); white-space: nowrap;
}
.gapbar-excess {
  position: absolute; right: 48px; top: 0; letter-spacing: 0.01em; text-transform: none;
  font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted);
}
.gapbar.is-met .gapbar-excess { color: var(--met); }
/* The checkbox: empty and grey until the picture is the record, then filled and green. */
.gapbar-box { position: absolute; right: 0; top: 1px; width: 34px; height: 34px; display: block; }
.gapbar-box .check-box { fill: none; stroke: var(--quiet-rule); stroke-width: 2; }
.gapbar-box .check-mark { fill: none; }
.gapbar.is-met .gapbar-box .check-box { stroke: var(--met); }
.gapbar.is-met .gapbar-box .check-mark { fill: var(--met); }
.gapbar-plot { position: absolute; left: 0; top: 42px; width: 680px; height: 100px; display: block; }
.gapbar-plot .track { fill: var(--track); }
/* The open territory: everything between what is proved and what is known. */
/* Named `gap-open`, not `open`: `height` is a CSS property on an SVG rect, so the panel's own
   `.open` group (a 76 px slot) silently stretched this band to 76 px when it shared the name. */
.gapbar-plot .gap-open { fill: var(--quiet); opacity: 0.34; }
.gapbar-plot .edge { stroke: var(--muted); stroke-width: 2; }
.gapbar-plot .edge.record { stroke: var(--ink); stroke-width: 3; }
.gapbar-plot .hand { fill: var(--ink); }
.gapbar-plot .hand-stem { stroke: var(--ink); stroke-width: 2; }
.gapbar.is-met .gapbar-plot .hand { fill: var(--met); }
.gapbar.is-met .gapbar-plot .hand-stem { stroke: var(--met); }
.gapbar-num { font-family: var(--sans); font-size: 28px; font-weight: 450; fill: var(--muted); }
.gapbar-num.record { fill: var(--ink); font-weight: 600; }
/* The headline, on one line: `n = 11`, the label and the value reading as one statement rather
   than as a caption stacked over a number. They are two elements because only one of them
   changes -- `n =` is constant, so it lives outside the two fading layers and never blinks,
   while the numeral rolls with the rest of the facts.
   That split is also why the numeral's left is not in this stylesheet. It has to begin where the
   constant line's ink ends, and the width of `n =` depends on the faces the browser actually
   got, so the script measures that line once the faces are in and puts the numeral
   `metrics.headline_gap_px` past it, less the median digit's left side bearing so the GAP is
   between ink and ink rather than between boxes.
   The eyebrow that used to sit above the headline said "Best known packing", which every packing
   on screen already is, so it named nothing and has been dropped.
   Every slot below is fixed, so nothing jumps between n. */
.nline { position: absolute; left: 6px; top: 196px; height: 104px; font-family: var(--serif); font-size: 96px; line-height: 104px; color: var(--muted); white-space: nowrap; }
.nline .n-var { font-style: italic; font-weight: 400; margin-right: 0.22em; }
.nline .n-eq { font-weight: 400; }
.numeral { position: absolute; left: 0; top: 196px; font-family: var(--serif); color: var(--ink); line-height: 104px; white-space: nowrap; will-change: transform; }
.numeral .n-val { font-weight: 400; font-size: 96px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
/* The panel says two things about n, and says them under headings: what is proved, then what
   is open. The heads are the gap bar's head style, so the three headings in the column read as
   one set. Every slot below is fixed, so nothing jumps between n; a slot with nothing to say
   for this n stays empty at its height rather than closing up. */
.section-head {
  position: absolute; left: 6px; height: 34px; line-height: 34px; font-family: var(--sans);
  font-size: 28px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--quiet); white-space: nowrap;
}
.head-proved { top: 348px; }
.head-open { top: 664px; }
/* The two bounds, one above the other at one size: a best known side and a proved lower bound
   are the same kind of fact about the same quantity, and a reader is meant to compare them, so
   showing one larger than the other would rank them. Both are proved -- a construction proves
   its upper bound -- which is why both sit under PROVED and only the questions sit under OPEN. */
.side  { position: absolute; left: 6px; top: 384px; height: 56px; font-family: var(--serif); font-size: 44px; line-height: 1.2; color: var(--ink); white-space: nowrap; }
.lower { position: absolute; left: 6px; top: 440px; height: 56px; font-family: var(--serif); font-size: 44px; line-height: 1.2; color: var(--ink); white-space: nowrap; }
.side .fn, .lower .fn { font-style: italic; }
.side .arg, .lower .arg { margin-left: 0.04em; }
.side .rel, .lower .rel { margin: 0 0.3em; color: var(--label); }
/* A bound first proved here, in scarlet on the line directly under the bound it is about --
   the digits themselves are never coloured, so this line is what says it. */
.star-line { position: absolute; left: 6px; top: 498px; height: 40px; display: flex; align-items: center; white-space: nowrap; }
/* Under both bounds, annotating the value above them: the closed form in the text face, or a
   small-caps note giving its degree. Never to the right of a value. */
.exact { position: absolute; left: 6px; top: 540px; height: 46px; font-family: var(--serif); font-size: 34px; line-height: 1.3; color: var(--muted); white-space: nowrap; }
.exact .rel { margin-right: 0.3em; }
.exact .note { font-family: var(--sans); font-size: 28px; font-weight: 500; font-variant-caps: all-small-caps; letter-spacing: 0.09em; color: var(--muted); }
/* The poster's badges, in a row with short labels: what this record establishes. Fixed height,
   so the row never reflows. */
.badges { position: absolute; left: 6px; top: 596px; height: 40px; display: flex; align-items: center; gap: 34px; white-space: nowrap; }
.badge-item { display: inline-flex; align-items: center; gap: 11px; font-family: var(--sans); font-size: 28px; font-weight: 500; color: var(--label); letter-spacing: 0.01em; }
.badge-item svg { width: 36px; height: 36px; display: block; flex: none; }
.badge-item.is-star .label { color: var(--new); font-weight: 600; }
.badge .box { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.badge-solid .box { fill: var(--muted); stroke: none; }
.badge-query .box { stroke: var(--quiet-rule); }
.badge .glyph { font-family: var(--sans); font-weight: 650; font-size: 15px; fill: var(--muted); }
.badge-solid .glyph { fill: var(--paper); }
.badge-query .glyph { fill: var(--quiet); }
/* The approximately-equal sign is KaTeX_Main's outline in font units, filled and thickened by a
   stroke in the same units (the stroke width scales with the path), as the slideshow draws it. */
.badge .glyph-path { fill: var(--muted); stroke: var(--muted); stroke-linejoin: round; }
.badge .star { fill: var(--new); }
/* OPEN: what the record leaves unsettled for this n, in the same badge row shape, a step quieter. */
.open-items { position: absolute; left: 6px; top: 704px; height: 40px; display: flex; align-items: center; gap: 28px; white-space: nowrap; }
.open-item { display: inline-flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 28px; font-weight: 450; color: var(--quiet); }
.open-item svg { width: 32px; height: 32px; display: block; flex: none; }
.open-none { font-family: var(--sans); font-size: 28px; font-weight: 450; color: var(--quiet); }
/* Revision 9: the three legend lines that sat here (the scarlet convention, the active style, what a
   free or blind run was doing) are gone. The stage carries facts about the packing and nothing that
   explains itself; what they said is written down in NOTES.md instead. The live readout moves up
   into the room they leave, 826 to 978, with the progress bar still beginning at 1034.
   Revision 7, feature 3: how far off the best known the picture is, at every frame. */
/* Revision 11 adds a fifth row, what the force law is doing: 826 + 5 x 38 = 1016, still clear of
   the progress bar at 1034. */
.gap-read { position: absolute; left: 6px; top: 826px; width: 694px; height: 190px; }
/* max-content so the row's box is its ink, which is what the fit checks have to measure. */
.gap-line { width: max-content; font-family: var(--sans); font-size: 28px; font-weight: 450; line-height: 38px; color: var(--muted); letter-spacing: 0.01em; white-space: nowrap; }
/* The progress bar: a pure function of the clock, along the bottom of the stage. Revision 7 gives
   the track a scale instead of two end labels — a numeral every 25 with a major tick, a minor tick
   every 5 — and brings the riding n down into the numeral row, where it is the only bold, inked
   numeral and carries a cursor on the track. The whole apparatus is the band 1034-1080; the panel
   above it ends at 1032. */
#progress { position: absolute; left: 0; top: 1034px; width: 1920px; height: 46px; font-family: var(--sans); color: var(--label); }
#progress .p-track { position: absolute; left: 100px; top: 4px; width: 1720px; height: 4px; border-radius: 2px; background: var(--track); }
#progress .p-fill { position: absolute; left: 0; top: 0; width: 0; height: 4px; border-radius: 2px; background: var(--label); }
/* Ticks: the majors in the muted grey the numerals use, the minors a step quieter so the scale
   reads as a scale rather than a comb. */
#progress .p-tick { position: absolute; top: 9px; width: 2px; margin-left: -1px; height: 5px; border-radius: 1px; background: var(--quiet); }
#progress .p-tick.p-major { height: 9px; background: var(--muted); }
#progress .p-num { position: absolute; top: 14px; transform: translateX(-50%); font-size: 28px; line-height: 32px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); }
#progress .p-cursor { position: absolute; top: 2px; width: 3px; margin-left: -1.5px; height: 14px; border-radius: 1.5px; background: var(--ink); }
#progress .p-n { position: absolute; top: 14px; left: 100px; transform: translateX(-50%); font-size: 28px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
#kind-tag {
  position: absolute; left: 60px; top: 14px; font-family: var(--sans); font-size: 18px;
  color: var(--label); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
}
body.capture #kind-tag { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Revision 9: one view, no tabs. Stepping one n and running a range are the same operation over a
   different span, so the range is the single spine: `from` and `to` are values of n stepped into,
   and setting them equal is the old Single step tab. */
#controls {
  flex: none; width: 100%; box-sizing: border-box; padding: 7px 14px 8px;
  background: var(--chrome); border-top: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 6px;
}
body.capture #controls { display: none; }
#panel { display: flex; flex-direction: column; gap: 6px; }
[hidden] { display: none !important; }
.row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
/* Revision 15: boxes in a row differ in height, and centring them made the panel read as
   scattered rather than as rows. They hang from a common top instead. */
.row label { display: inline-flex; align-items: center; gap: 5px; color: var(--label); white-space: nowrap; }
button, select, input[type=number] {
  font: inherit; color: var(--ink); background: var(--paper); border: 1px solid #b9c0c8; border-radius: 4px;
  padding: 3px 9px; cursor: pointer;
}
button:hover { background: #f3f5f7; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 84px; }
button.primary:hover { background: #2b3947; }
/* Revision 9: the transport is the tape convention — a right-pointing triangle to play, two bars to
   pause — drawn as inline SVG on one button that toggles. The glyphs are `fill: currentColor`, so
   they take the button's ink in both states, and the accessible name is set from the script beside
   the class that swaps them. Previous and next are `-` and `+`: they were solid triangles, which on
   a transport row read as play. */
button.transport {
  min-width: 44px; padding: 5px 14px; display: inline-flex; align-items: center; justify-content: center;
}
button.transport svg { width: 18px; height: 18px; display: block; fill: currentColor; }
button.transport .glyph-pause { display: none; }
button.transport.is-playing .glyph-play { display: none; }
button.transport.is-playing .glyph-pause { display: inline; }
button.step-nudge { min-width: 36px; font-weight: 700; font-size: 15px; line-height: 1.1; text-align: center; }
input[type=number] { width: 64px; padding: 4px 6px; }
/* Revision 10: a small tabbed sub-panel naming which of the two aspects the page is showing — Pack,
   one fixed n run open-endedly, or Animate, a range played end to end. It is drawn as tabs and
   exposed as two `aria-pressed` buttons inside a group, not as ARIA tabs: revision 9's property
   that no tab role survives anywhere on the page still holds, so a checker can keep asserting it
   and nobody can mistake this for the two full-page tabs coming back. */
.subpanel { border: 1px solid #b9c0c8; border-radius: 6px; background: var(--paper); align-self: flex-start; }
.mode-tabs { display: flex; border-bottom: 1px solid #b9c0c8; }
.mode-tabs button {
  border: 0; border-radius: 0; background: transparent; padding: 5px 18px; font-weight: 600;
  color: var(--label); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.mode-tabs button + button { border-left: 1px solid #dfe3e8; }
.mode-tabs button.on { color: var(--ink); border-bottom-color: var(--ink); background: #eef1f4; }
.mode-body { padding: 5px 12px 6px; }
/* Revision 9: how fast the virtual clock runs during playback, 0.05x to 2x on a logarithmic slider
   so the slow end has as much travel as the fast one. It scales playback only — `seek(t)` is still a
   pure function of its argument, so every instant renders identically and captures are untouched. */
/* Revision 12: **a readout that changes at runtime never changes size.** The defect it closes is a
   real one: the numbers sat inline with the buttons, so as a figure gained a digit the controls
   after it slid sideways under the cursor while a run was playing. Every live readout now either
   takes a fixed slot wide enough for the widest value it can hold, or — the owner's own suggestion,
   and the better rule for anything that changes often — moves onto its own line *below* the control
   it belongs to. Figures are tabular throughout, so a slot's width is a character count and not a
   guess, and anything that overruns is clipped rather than allowed to push. `check_workbench.py`
   holds it down by comparing every button's bounding box at two instants of a run. */
.readout {
  display: inline-block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums; vertical-align: middle; box-sizing: border-box;
}
/* The below-its-control form: a full-width line of its own inside a wrapping flex row. */
.readout-line { display: block; flex: 0 0 100%; width: 100%; height: 16px; line-height: 16px; }
#speed { width: 130px; accent-color: var(--ink); }
#speed-info { color: var(--label); width: 54px; }
#clock { font-family: var(--mono); font-size: 13px; color: var(--label); width: 200px; text-align: right; }
/* 'Optimize' becomes 'Restart optimize' the moment a run starts: one slot holds both, so the button
   the owner just pressed does not change size under the cursor. */
#optimize { width: 152px; }
#range-duration { width: 292px; }
#range-position { width: 252px; }
#step-label { width: 216px; }
/* The one-line note about the n on show. Its own line at a fixed height, so appearing and
   disappearing cannot change how tall the controls are and therefore how big the stage is. */
#step-note { flex: 0 0 100%; width: 100%; height: 16px; line-height: 16px; }
#continuous-info { color: var(--muted); }
/* A line of its own, but a fixed one: the annealing readout gains '(styles B and C only)'
   under style A, and with no width of its own that text widened the box it sits in and slid
   the whole view box — colour chooser and all — sideways on a style change. */
#anneal-info { color: var(--muted); width: 396px; }
/* A flex row's intrinsic width is the sum of its items whether they wrap or not, so a line placed
   *below* the controls still widens the box that holds it unless the box has a width of its own.
   The shake box is given one, and the readout drops under the dial instead of beside it. */
#shake-box { width: 478px; box-sizing: border-box; }
#law-info, #rel-info, #grow-info { width: 300px; height: 15px; line-height: 15px; }
/* Revision 14: **controls sit with the axis they belong to.** A mode is a choice on three
   independent axes — scope (one n, or a range), strategy (the law, the graph, growth, annealing and
   which solver runs) and presentation (colour, timing, phasing, desaturation) — and which solver
   runs is strategy, not animation, so the select left the step-animation group for the row that
   holds the law and the graph. It is given a width of its own because a `select` is as wide as its
   widest *option*, and Pack offers one option fewer: without this, hiding `tween` would resize the
   control. */
#solver-box { width: 232px; box-sizing: border-box; }
/* Revision 15: the note under the select was clipping mid-word in a 152px box. A fixed
   slot keeps the controls still; it has to be wide enough to hold what it is given. */
#solver-note { white-space: normal; }
#style-select { width: 118px; }
#solver-note { height: 15px; line-height: 15px; }
/* The step animation's own group — dwell, move, settle, the motion phasing and the full beat —
   describes a step, and Pack has no steps, so it is hidden there. Hidden *in place*: `display: none`
   would take its box out of this wrapping row, the boxes after it would rewrap onto fewer lines, the
   controls would get shorter and the stage would grow — which is exactly the reflow revision 12
   forbids and step 13 measures. `visibility: hidden` leaves the footprint, takes the group off the
   hit test and out of the tab order, and moves nothing on the page. */
/* Revision 15: `visibility: hidden` kept this box's 1145px in the flow, so the row wrapped
   around a box nobody could see and the view fell to a line of its own. It is a whole group
   in its own row, so removing it moves nothing beside it. */
#step-anim-box.is-off { display: none; }
#pair-select { max-width: 480px; }
.hint { color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid #b9c0c8; border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; }
.seg button + button { border-left: 1px solid #b9c0c8; }
.seg button.on { background: var(--ink); color: var(--paper); }
#pair-info { color: var(--label); font-size: 13px; }
/* The chooser for n, and the sparse cases worth looking at as a row of chips. A chip sets both ends
   of the range to the same value, which is one step. */
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chips button { padding: 3px 9px; font-size: 13px; min-width: 38px; text-align: center; }
.chips button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.step-label { font-weight: 600; color: var(--ink); white-space: nowrap; }
.hint.readout-line { font-style: italic; }
/* The range: two boxes of n, its length in wall-clock seconds, and where a run stands in it. */
/* Revision 11: the force law, drawn and edited. The plot is the law itself — force against the
   signed gap, both sides of zero, the crossing marked — and its two handles are the four numbers:
   the knee's position is the rigidity and its height the repulsion, the pull's position is the
   range and its depth the attraction. The sliders and the handles are two views of one state. */
.lawbox { display: flex; align-items: stretch; }
.law-plot-wrap { padding: 3px 8px 4px 6px; border-right: 1px solid #e2e6ea; }
#law-plot { display: block; width: 264px; height: 116px; touch-action: none; cursor: crosshair; }
#law-plot .lp-field { fill: #fbfcfd; }
#law-plot .lp-zero { stroke: #9aa3ad; stroke-width: 1; }
#law-plot .lp-axis { stroke: #c8ced4; stroke-width: 1; }
#law-plot .lp-curve { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
#law-plot .lp-cross { fill: var(--new); }
#law-plot .lp-handle { fill: var(--paper); stroke: var(--ink); stroke-width: 2; cursor: grab; }
#law-plot .lp-handle.is-pull { stroke: #7a5aa8; }
#law-plot text { font-family: var(--sans); font-size: 9px; fill: var(--quiet); }
#law-plot text.lp-side { fill: var(--label); font-weight: 600; }
.law-body { padding: 4px 10px; display: flex; flex-direction: column; gap: 1px; }
.law-body .law-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--label); }
.law-body .law-row > span:first-child { min-width: 88px; text-align: right; }
.law-body input[type=range] { width: 118px; accent-color: var(--ink); }
.law-val { font-variant-numeric: tabular-nums; color: var(--ink); display: inline-block; width: 56px; }
.law-presets { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
.relbox { display: flex; flex-direction: column; }
/* Revision 11: the panel reads as one instrument rather than as a wall of labels. Every control is
   in a named box — what the step animation does, how hard it shakes, what the view shows, the force
   law, who attracts whom, and growth — and the boxes lay out in one row that wraps. */
.groupbox { display: flex; flex-direction: column; align-self: flex-start; }
.group-body { padding: 1px 10px 5px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.group-body.stack { flex-direction: column; align-items: stretch; gap: 2px; }
.group-body.stack .law-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--label); }
.group-body.stack .law-row > span:first-child { width: 66px; text-align: right; }
.group-body.stack .law-row input[type=range] { width: 118px; }
.group-body label { display: inline-flex; align-items: center; gap: 5px; color: var(--label); white-space: nowrap; }
.rel-body { padding: 1px 10px 5px; display: flex; flex-direction: column; gap: 2px; }
.rel-body .law-row > span:first-child { min-width: 42px; }
.rel-body label { font-size: 12.5px; }
.law-presets .hint { font-size: 12px; }
.box-title {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--quiet); padding: 3px 10px 1px; display: block;
}
#range-from, #range-to { width: 72px; font-weight: 600; }
.range-sep { color: var(--label); }
.range-figure { color: var(--label); white-space: nowrap; }
.range-figure strong { color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage-wrap">
    <div id="stage" aria-label="Animated transition between consecutive best known packings">
      <svg id="packing-svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="true">
        <g id="world" transform="scale(1 -1)">
          <rect id="container" x="0" y="0" width="1" height="1" fill="none" stroke="#000000" stroke-width="2" vector-effect="non-scaling-stroke" />
          <g id="squares"></g>
          <g id="links"></g>
          <g id="mask-links"></g>
          <line id="draw-line" x1="0" y1="0" x2="0" y2="0" vector-effect="non-scaling-stroke" stroke-linecap="round" style="display: none" />
          <g id="ghost" opacity="0"><rect x="-0.5" y="-0.5" width="1" height="1" fill="none" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke" /></g>
          <g id="mark" opacity="0"><rect x="-0.5" y="-0.5" width="1" height="1" fill="none" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" /></g>
        </g>
      </svg>
      <div id="facts">
        <div class="gapbar" id="gapbar">
          <div class="gapbar-head">
            <span class="gapbar-title">gap to the best known</span>
            <span class="gapbar-excess" id="gapbar-excess"></span>
            <svg class="gapbar-box" viewBox="0 0 34 34" aria-hidden="true">
              <rect class="check-box" x="2" y="2" width="30" height="30" rx="5" />
              <path class="check-mark" id="gapbar-check" d="M6.5 17.8 L13.6 25 L27.2 9.4 L30 12.1 L13.8 30.6 L4 20.5 Z" />
            </svg>
          </div>
          <svg class="gapbar-plot" viewBox="0 0 680 100" aria-hidden="true">
            <rect class="track" x="0" y="34" width="680" height="18" rx="3" />
            <rect class="gap-open" id="gapbar-open" x="0" y="34" width="0" height="18" />
            <line class="edge" id="gapbar-lower" x1="1" y1="27" x2="1" y2="59" />
            <line class="edge record" id="gapbar-record" x1="0" y1="24" x2="0" y2="62" />
            <g id="gapbar-hand">
              <path class="hand" d="M -10 8 L 10 8 L 0 23 Z" />
              <line class="hand-stem" x1="0" y1="21" x2="0" y2="53" />
            </g>
            <text class="gapbar-num" id="gapbar-lower-label" x="0" y="88" text-anchor="start"></text>
            <text class="gapbar-num record" id="gapbar-record-label" x="0" y="88" text-anchor="middle"></text>
          </svg>
        </div>
        <div class="nline" aria-hidden="true"><span class="n-var">n</span><span class="n-eq">=</span></div>
        <div class="facts-layer" id="facts-a"></div>
        <div class="facts-layer" id="facts-b"></div>
        <div class="gap-read" id="gap-read">
          <div class="gap-line" id="gap-a"></div>
          <div class="gap-line" id="gap-b"></div>
          <div class="gap-line" id="gap-c"></div>
          <div class="gap-line" id="gap-d"></div>
          <div class="gap-line" id="gap-e"></div>
        </div>
      </div>
      <div id="progress" aria-hidden="true">
        <div class="p-track"><div class="p-fill" id="p-fill"></div></div>
        <div id="p-scale"></div>
        <span class="p-cursor" id="p-cursor"></span>
        <span class="p-n" id="p-n"></span>
      </div>
      <div id="kind-tag"></div>
    </div>
  </div>
  <div id="controls">
    <div id="panel">
      <div class="subpanel">
        <div class="mode-tabs" id="mode-tabs" role="group" aria-label="what the page is showing">
          <button type="button" id="mode-pack" data-mode="pack" aria-pressed="true" title="One fixed n: press play and the chosen strategy packs it until you pause">Pack</button>
          <button type="button" id="mode-animate" data-mode="animate" aria-pressed="false" title="A range of n, played from end to end">Animate</button>
        </div>
        <div class="mode-body row" id="mode-panel">
          <label for="range-from"><strong>n</strong></label>
          <button id="prev" class="step-nudge" title="The step before (left arrow)" aria-label="the step before">&minus;</button>
          <input type="number" id="range-from" step="1" aria-label="the packing size n">
          <span class="range-sep" id="range-sep">to</span>
          <input type="number" id="range-to" step="1" aria-label="the last value of n to step into">
          <button id="next" class="step-nudge" title="The step after (right arrow)" aria-label="the step after">+</button>
          <button id="range-all" title="Widen the range to every step this page carries">whole corpus</button>
          <span class="step-label readout" id="step-label"></span>
          <span class="chips" id="step-chips"></span>
        </div>
      </div>
      <div class="row">
        <button id="play" class="primary transport" title="Play or pause (space)" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="glyph-play" d="M7.5 4.5 L19.5 12 L7.5 19.5 Z" />
            <g class="glyph-pause"><rect x="6.6" y="4.5" width="4.2" height="15" rx="1.1" /><rect x="13.2" y="4.5" width="4.2" height="15" rx="1.1" /></g>
          </svg>
        </button>
        <button id="restart" class="transport" title="Back to the beginning of what play would play: in Pack the starting arrangement with every setting kept, in Animate the first step of the range" aria-label="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g class="glyph-play"><rect x="4.6" y="4.5" width="3.4" height="15" rx="1.1" /><path d="M20 4.5 L20 19.5 L9.4 12 Z" /></g>
            <g class="glyph-pause"><path d="M12 5.2 a6.8 6.8 0 1 1 -6.8 6.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /><path d="M5.2 12 L5.2 6.6 L10.6 12 Z" /></g>
          </svg>
        </button>
        <span id="clock" class="readout">0.00 s &middot; 0 steps</span>
        <label title="How fast the clock runs while playing: 0.05x to watch a settle closely, 2x to skim">speed
          <input type="range" id="speed" min="0" max="1000" step="1" aria-label="playback speed">
          <span class="hint readout" id="speed-info"></span>
        </label>
        <span class="range-figure readout" id="range-duration"></span>
        <span class="range-figure readout" id="range-position"></span>
        <button id="refresh-gap" title="Redraw the gap bar against what is on the stage now">update gap bar</button>
        <label>start
          <span class="seg" id="initial-seg">
            <button data-initial="previous" title="The retained packing of n-1 with the new square added">previous packing</button>
            <button data-initial="random" title="n squares at seeded pseudo-random centres and angles in a box larger than the record">random</button>
            <button data-initial="grid" title="n squares axis-aligned in rows from the bottom-left, in the grid's own box">ordered fill</button>
            <button data-initial="record" title="The retained best-known packing of n itself, in its own box. Press play to see whether the current law holds a known optimum still">best known</button>
          </span>
        </label>
        <button id="optimize" class="primary" title="Run the current settings from the chosen start until pause">Optimize</button>
      </div>
      <div class="row">
        <div class="subpanel lawbox" id="law-box">
          <div class="law-plot-wrap">
            <span class="box-title">force law</span>
            <svg id="law-plot" viewBox="0 0 300 132" role="img" aria-label="the force against the signed gap between two squares">
              <rect class="lp-field" x="0" y="0" width="300" height="132" />
              <line class="lp-axis" id="lp-vaxis" x1="0" y1="0" x2="0" y2="132" />
              <line class="lp-zero" x1="0" y1="88" x2="300" y2="88" />
              <path class="lp-curve" id="lp-curve" d="" />
              <circle class="lp-cross" id="lp-cross" r="2.6" cx="0" cy="88" />
              <circle class="lp-handle" id="lp-knee" r="5" cx="0" cy="0" />
              <circle class="lp-handle is-pull" id="lp-pull" r="5" cx="0" cy="0" />
              <text class="lp-side" id="lp-label-push" x="4" y="10">push</text>
              <text class="lp-side" id="lp-label-pull" x="4" y="128">pull</text>
              <text id="lp-top" x="296" y="10" text-anchor="end"></text>
              <text id="lp-left" x="4" y="98"></text>
              <text id="lp-right" x="296" y="98" text-anchor="end"></text>
            </svg>
          </div>
          <div class="law-body">
            <div class="law-rows" data-law="pair"></div>
            <div class="law-presets">
              <span class="seg" id="law-preset-seg">
                <button data-law="rigid" title="A knee at four thousandths of a side and a strong push: effectively rigid">rigid</button>
                <button data-law="soft" title="A third of a side of interpenetration before the push reaches its knee">soft</button>
                <button data-law="sticky" title="A firm push with a pull that reaches a quarter of a side">sticky</button>
              </span>
              <span class="hint readout readout-line" id="law-info"></span>
            </div>
          </div>
        </div>
        <div class="subpanel groupbox" id="wall-box">
          <span class="box-title">walls</span>
          <div class="group-body stack">
            <div class="law-rows" data-law="wall"></div>
          </div>
        </div>
      </div>
      <!-- Revision 15: the law gets a line of its own; the solver and the two graphs share
           the next, so a wide plot is not squeezed beside three narrow boxes. -->
      <div class="row">
        <div class="subpanel groupbox" id="solver-box">
          <span class="box-title">solver</span>
          <div class="group-body">
            <select id="style-select" aria-label="which solver runs">
              <option value="tween">A · tween</option>
              <option value="physics">B · physics</option>
              <option value="bodies">C · bodies</option>
            </select>
            <span class="hint readout readout-line" id="solver-note"></span>
          </div>
        </div>
        <div class="subpanel relbox">
          <span class="box-title">who attracts whom</span>
          <div class="rel-body">
            <div class="law-row"><span>graph</span>
              <span class="seg" id="rel-seg">
                <button data-rel="general" title="Every pair attracts: the shipped behaviour">general</button>
                <button data-rel="groups" title="Squares in the same block attract each other and nothing across blocks">groups</button>
                <button data-rel="contact" title="Exactly the edges of the target contact graph attract">contact graph</button>
              </span>
            </div>
            <div class="law-row"><span>chart</span>
              <label title="End the step animation on the record's own poses. Ends on the record by construction, and proves nothing about the physics"><input type="checkbox" id="snap-toggle"> snap to the known solution at the end</label>
            </div>
            <div class="law-row"><span></span>
              <label title="Attract exactly the pairs that touch in the retained packing, and let the settle find the geometry itself"><input type="checkbox" id="bias-toggle"> bias toward the known contact graph</label>
            </div>
            <div class="law-row"><span>target</span>
              <span class="seg" id="target-seg">
                <button data-target="record" title="The contact graph of the retained packing of this n, read off the record">record</button>
                <button data-target="drawn" title="The edges drawn by hand between squares on the stage">hand-drawn</button>
              </span>
              <button id="clear-edges" title="Forget every edge drawn at this n">clear</button>
            </div>
            <div class="law-row"><span></span><span class="hint readout" id="rel-info"></span></div>
          </div>
        </div>
        <div class="subpanel relbox">
          <span class="box-title">start small and grow</span>
          <div class="rel-body">
            <div class="law-row"><span>size</span><input type="range" id="grow-size" aria-label="the size every square starts at, as a fraction of a unit side"><span class="law-val" id="grow-size-val"></span></div>
            <div class="law-row"><span>rate</span><input type="range" id="grow-rate" aria-label="how fast the squares grow, per simulated second"><span class="law-val" id="grow-rate-val"></span></div>
            <div class="law-row"><span>rule</span>
              <span class="seg" id="grow-rule-seg">
                <button data-grow-rule="constant" title="The size climbs whatever the arrangement is doing">constant</button>
                <button data-grow-rule="clean" title="The size climbs only while the deepest overlap is inside the tolerance">while clean</button>
              </span>
              <label title="Grow the squares as the run goes"><input type="checkbox" id="grow-toggle"> grow</label>
            </div>
            <div class="law-row"><span></span><span class="hint readout" id="grow-info"></span></div>
            <div class="law-row"><span></span>
              <button id="reset-physics" title="Every physics parameter back to its default, and the run restarted from the arrangement on the stage">reset physics</button>
            </div>
          </div>
        </div>
        <span class="hint readout readout-line" id="step-note"></span>
      </div>
    </div>
    <div class="row">
      <div class="subpanel groupbox" id="step-anim-box">
        <span class="box-title">the step animation</span>
        <div class="group-body">
          <label>motion
            <span class="seg" id="phase-seg">
              <button data-phase="add-then-move">add, then move</button>
              <button data-phase="move-then-add">move, then add</button>
              <button data-phase="simultaneous">simultaneous</button>
              <button data-phase="rotate-first">rotate first</button>
              <button data-phase="slide-first">slide first</button>
            </span>
          </label>
          <label>dwell <input type="number" id="t-dwell" min="0" max="10" step="0.1"> s</label>
          <label>move <input type="number" id="t-move" min="0.1" max="10" step="0.1"> s</label>
          <label>settle <input type="number" id="t-settle" min="0" max="5" step="0.1"> s</label>
          <label><input type="checkbox" id="fullbeat-toggle"> full beat for static appends</label>
        </div>
      </div>
      </div>
      <!-- Revision 15: the timing group is alone in its row, so removing it in Pack
           cannot reflow anything beside it. -->
      <div class="row">
      <div class="subpanel groupbox" id="shake-box">
        <span class="box-title">the shake</span>
        <div class="group-body">
          <label title="How hard and how long the two physical styles shake: 0 none, 3 the default, 10 the loudest and longest">annealing
            <input type="range" id="anneal" min="0" max="10" step="1" style="width: 130px">
          </label>
          <label><input type="checkbox" id="blind-toggle"> blind, no target</label>
          <label>inflate <input type="number" id="blind-inflate" min="1" max="2" step="0.01"></label>
          <span class="hint readout readout-line" id="anneal-info"></span>
        </div>
      </div>
      <div class="subpanel groupbox">
        <span class="box-title">the view</span>
        <div class="group-body">
          <label>colour
            <span class="seg" id="colour-seg">
              <button data-scheme="identity" title="Every square keeps one colour of its own, for the whole session: the same square is the same green wherever it goes">identity</button>
              <button data-scheme="angle-stable" title="The atlas convention: right angles teal, forty-five citron, the rest in five-degree bands, shaded by full-side contacts">angle</button>
              <button data-scheme="angle-continuous" title="A continuous ramp from teal at a right angle to citron at forty-five">angle ramp</button>
            </span>
          </label>
          <label title="In Animate only: repaint the frame the step comes to rest on in the standard angle colours, leaving the motion itself identity-coloured"><input type="checkbox" id="animate-standard-toggle" checked> animate rests in angle colours</label>
          <label><input type="checkbox" id="desat-toggle" checked> desaturate while moving</label>
          <label title="Faint lines on what the physics is relating: the step's correspondence, or the relationship graph's own attracting pairs"><input type="checkbox" id="links-toggle"> show correspondence</label>
          <label title="Press on one square and release on another to add an edge to the contact graph, or to take it away again. While this is on no square can be picked up and moved."><input type="checkbox" id="draw-toggle"> draw links</label>
          <label><input type="checkbox" id="capture-toggle"> capture preview</label>
        </div>
      </div>
      <span class="hint readout readout-line" id="continuous-info"></span>
    </div>
  </div>
</div>
<div class="sr-only" aria-live="polite" id="live"></div>
<script id="atlas-data" type="application/json">__DATA__</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
  const FRAMES = DATA.frames;
  const PAIRS = DATA.pairs;
  const FACTS = DATA.facts;
  const METRICS = DATA.metrics;
  const N_MAX = DATA.n_max;             // 324: the progress bar always maps to 1..N_MAX
  const PHASES = DATA.motion_phases;    // add-then-move (the default), move-then-add, simultaneous, rotate-first, slide-first
  const ARRIVAL_FRACTION = DATA.arrival_fraction;  // the share of the move the new square takes to arrive in the two staged modes
  const PAD = 0.045;                    // container-side fraction of breathing room inside the 1000 px box
  const NEW_FRACTION = 1 / 3;           // in the three unstaged modes the new square fades in over the last third of the move
  const ROLL_MAX = 0.4;                 // seconds for the panel's out-then-in sequence, from the moment the new square starts to appear
  const MARK_FADE = 0.15;               // fraction of the move over which the previous pair's scarlet outline gives way to the normal stroke
  const MARK_WIDE = 4, MARK_THIN = 2;   // scarlet outline widths, px: at arrival, and through the following dwell
  const TINT = 1.0;                     // the arriving square starts at the tint colour and settles to its own fill
  const TINT_CHROMA = 0.6;              // the share of the accent's chroma that tint colour carries
  // Revision 6: while a pair is in motion the fills lose chroma, and lock back in over the settle,
  // so the resting frame is exactly the retained colours and only the moving picture is muted.
  const DESAT = 0.15;                   // the chroma a fill keeps at full desaturation
  // **Chroma and hue move one at a time, and the hue always moves in the grey.** A square's
  // colour changes twice a beat -- it drains and comes back, and it swaps between the scheme a
  // viewer chose and the atlas's own answer for a finished picture. Doing both at once is what
  // made the change read as a lurch: a hue rotation at full chroma is a different colour arriving,
  // where the same rotation at a tenth of the chroma is invisible. So the order is
  //
  //     leaving rest   drain, THEN rotate            (grey out, then quietly become identity)
  //     returning      rotate, THEN saturate         (quietly become the atlas's, then colour up)
  //
  // and at every instant at most one of the two is moving. Each end is a `smootherstep`, which has
  // zero second derivative at both ends, so there is no corner where a change starts or stops.
  const DESAT_IN = 0.2;                 // fraction of the move the chroma takes to drain
  const HUE_OUT = 0.45;                  // fraction of the move the hue takes to leave, once drained
  const HUE_IN = 0.6;                  // fraction of the settle the hue takes to return, before the chroma
  // Continuous play (revision 6, feature 4): the beat the whole sequence runs at, back to back.
  // A static append (a grid prefix or a shared picture, where nothing moves) gets a dwell and no
  // move at all, unless the full beat is asked for.
  // A static append used to be a dwell and nothing else, which meant the new square appeared
  // between one frame and the next with no time to be seen arriving -- the owner's report, and
  // exactly right: `move: 0` collapses `arrive` and `arrived` onto the same instant. It now gets
  // a short move and a settle of its own, so the scarlet square comes in and takes its colour.
  // Nothing rearranges (that is what makes it static), and the drain stays off for the same
  // reason: there is no motion to mute.
  const CONTINUOUS = {
    dwell: 0.7, move: 1.2, settle: 0.5,
    staticDwell: 0.4, staticMove: 0.4, staticSettle: 0.35,
  };
  // Revision 7, feature 2: the annealing dial, 0 to 10, default 3. The default is exactly the
  // revision-6 shake, so nothing about the shipped picture moves when the dial is not touched.
  // Three things rise with the level, and all three are stated here rather than in the simulator:
  //   amplitude  0 at level 0, 1 (the shipped jiggle) at 3, 3 at 10, linear on each side of 3;
  //   decay      the shake falls as (1 - tau)^p over the run, p = 1.5 at levels 0..3 easing to
  //              0.35 at 10, so at 10 the shake is still at 57% of its amplitude four fifths of
  //              the way through instead of 9%;
  //   span       the run is 1 move long up to level 3 and lengthens by a tenth of a move a level
  //              after that, to 1.7 moves at 10 — extra sub-steps at the same dt (the wall clock
  //              of a step stays 1/120 s), so a high level buys more simulated time to settle in
  //              rather than a faster shake in the same time. The move on the clock lengthens with
  //              it, which is why `timing` takes the style: only B and C are annealed.
  const ANNEAL = {
    min: 0, max: 10, dflt: 3,
    amplitude: (L) => (L <= 3 ? L / 3 : 1 + (L - 3) * (2 / 7)),

  // One law, a function of the signed gap `d` between two squares along the separating axis the
  // collision test already computes: negative is penetration, zero is touching, positive is a gap.
  // It replaces the hard-coded stiffness and cap; the damping term stays and is added to it.
  //
  //     d <= 0   (depth p = -d)   f = repulsion * ( min(p, rigidity) + steep * max(0, p - rigidity) )
  //     0 < d < range             f = -attraction * 4u(1 - u),  u = d / range
  //     d >= range                f = 0
  //
  // Positive pushes the pair apart, negative pulls it together, which is the sign the push-apart
  // already used. The three pieces meet at zero — f(0) = 0 from both sides — and the attraction is
  // zero again at the edge of its range, so the law is continuous everywhere. Attraction and
  // repulsion never overlap, so **the net force at any penetration is repulsive whatever the
  // attraction is set to**: two squares can be pulled up to touching and never through each other.
  //
  // `steep` is not a fifth parameter: it is derived from the rigidity so that the shipped value is
  // exactly the old law. The old law was `contact * min(p, contactCap)` — linear to a cap and flat
  // past it — so rigidity 0.15 (the old `contactCap`) with steep 0 reproduces it to the bit, which
  // is why the four defaults below are what they are and why every cached trajectory, every blind
  // run and every measurement in revisions 6 to 10 is unchanged until the law is touched.
  // Below the shipped rigidity the slope past the knee climbs linearly to LAW_STEEP_MAX, so the
  // hardest setting is a knee at two thousandths of a side with eight times the stiffness past it:
  // effectively rigid at this timestep, and measured stable.
  // ------------------------------------------------------------------ the laws, declared once
  //
  // A law is four numbers describing a force against a signed gap, and there are two of them,
  // because a square has two relationships: with another square, and with a wall. They were
  // written out twice -- markup, sync loop, wiring, cache key, reset, API -- and every one of
  // those was a place to forget one. The wall law's controls did nothing on their first build
  // for exactly that reason: the setter existed and was never exposed.
  //
  // So the parameters are a table and everything else reads it. Adding a fifth parameter, or a
  // third law, is a row here; the sliders, their labels and steps, the readouts, the trajectory
  // cache key, the reset and the API method all follow. Nothing downstream enumerates them, so
  // nothing downstream can fall out of step -- and a check that wanted to know "what parameters
  // are there" asks this rather than listing what it saw.
  const LAW_PARAMS = [
    { key: 'rigidity',   label: 'rigidity',   step: 0.001, decimals: 3,
      says: 'the penetration tolerated before the repulsion climbs' },
    { key: 'repulsion',  label: 'repulsion',  step: 50,    decimals: 0,
      says: 'the push when penetrating' },
    { key: 'attraction', label: 'attraction', step: 5,     decimals: 0,
      says: 'the pull when separated but close; zero is none' },
    { key: 'range',      label: 'range',      step: 0.005, decimals: 3,
      says: 'the gap width the attraction acts over; zero beyond' },
  ];
  const LAW_KEYS = LAW_PARAMS.map((d) => d.key);
  const LAW_TOL0 = 0.15, LAW_STEEP_MAX = 8;
  const LAW_DEFAULT = { rigidity: 0.15, repulsion: 2500, attraction: 0, range: 0 };
  const LAW_BOUNDS = {
    rigidity: [0.002, 0.4],   // the penetration tolerated before the repulsion climbs steeply
    repulsion: [200, 8000],   // the push per unit of tolerated penetration
    attraction: [0, 400],     // the pull when separated but close; zero is none
    range: [0, 0.5],          // the gap width the attraction acts over; zero beyond
  };
  const LAW = Object.assign({}, LAW_DEFAULT);
  // The named shapes the owner asked for. `rigid` is a knee at a hundredth of a side with a strong
  // push and seven and a half times the slope past it; `soft` lets a pair sink a third of a side
  // before the push even reaches its knee, and its push is weak enough that the resting overlap of
  // a settle is visibly deeper; `sticky` keeps a firm push and adds a pull reaching a quarter of a
  // side. Measured over 2,400 steps from the grid start (`measure_law.py --laws`).
  //
  // The rigid preset stops at a hundredth of a side rather than at the slider's own hard end
  // because the timestep is fixed at 1/120 s: below about that knee the law is stiffer than the
  // integrator can hold and the run throws squares out of the box — at rigidity 0.004 with
  // repulsion 4000, n = 17 ends needing a side of 6.82 around a box of 5.34 with a 0.21 overlap.
  // The slider still reaches there; the readout says what happened, and the notes say why.
  const LAW_PRESETS = {
    rigid: { rigidity: 0.01, repulsion: 4000, attraction: 0, range: 0 },
    soft: { rigidity: 0.35, repulsion: 400, attraction: 0, range: 0 },
    sticky: { rigidity: 0.08, repulsion: 2500, attraction: 120, range: 0.25 },
  };
  // Revision 15: the law is a function of the signed gap, and there are two relationships it can
  // describe -- square against square, and square against wall. They are the same shape and want
  // different numbers, so the shape takes the law it is evaluating rather than reading one global.
  // The owner's reasoning: a wall is not a neighbour, so borrowing the pair's settings for it was
  // a coincidence of implementation rather than a claim about the physics.
  const steepOf = (L) => LAW_STEEP_MAX * Math.max(0, 1 - L.rigidity / LAW_TOL0);

  // steepening past it, since a rigidity above LAW_TOL0 gives a slope of zero there. Attraction is
  // off, so a wall still only pushes until the owner asks otherwise.
  const WALL_DEFAULT = { rigidity: 0.25, repulsion: 2500, attraction: 0, range: 0 };
  const WALL_BOUNDS = {
    rigidity: [0.002, 0.5],
    repulsion: [0, 8000],     // zero is a legitimate setting here: walls that do not push at all
    attraction: [0, 400],
    range: [0, 0.5],
  };
  const WALLLAW = Object.assign({}, WALL_DEFAULT);
  // The two laws, and everything a generic routine needs to serve either: where its controls
  // live, what its bounds are, and what it means. `pair` is masked by the relationship graph;
  // `wall` never is, because a wall is not something a square can be told to ignore.
  const LAWS = {
    pair: { name: 'pair', law: LAW,     bounds: LAW_BOUNDS,  defaults: LAW_DEFAULT,
            prefix: 'law',  says: 'square against square, masked by the relationship graph' },
    wall: { name: 'wall', law: WALLLAW, bounds: WALL_BOUNDS, defaults: WALL_DEFAULT,

      // law reached twice keys the cache identically both times.

    // needs its run rebuilt exactly as a changed pair law does.

  // How many substeps the integrator needs to hold this law.
  //

  // a stiff spring and wants projection instead (think-r2qd); this makes the spring honest in the
  // meantime rather than letting the slider reach settings the integrator cannot hold.

  const LAW_SUB_MAX = 12;       // a run stays interactive; past here the law is reported as beyond the step

  // Everything a run has to be keyed by: two runs with the same signature draw the same trajectory.
  const lawKey = () => lawsKey();
  // The blind run (revision 6, feature 3): the simulation is told nothing about where the squares
  // are meant to end up. It starts from the packing of n in a container inflated by `inflate`,
  // drops the new square into the emptiest place a coarse grid can find, and then closes the walls
  // in on the record's side with no target springs at all — only contacts, walls and the decaying
  // jiggle. The contraction clock only runs while the deepest overlap is within `overlapTol`, so a
  // jammed packing stops the squeeze rather than crushing through it.
  const BLIND = {
    inflate: 1.12,     // the container starts at this multiple of the record side (adjustable)
    inflateDefault: 1.12,   // ... and what `reset` puts it back to
    open: 0.12,        // the fraction of the move the picture takes to open from the record of n to that box
    hold: 0.2,         // the container holds while the new square inflates, then contraction begins
    close: 0.9,        // and would reach the record's side here, if nothing jammed
    overlapTol: 0.08,  // contraction pauses while two full-size squares overlap by more than this
    gridStep: 0.25,    // the coarse grid of candidate centres for the new square
  };

  const isPhysical = (style) => style === 'physics' || style === 'bodies';
  const physicsCache = new Map();
  const PHYS_CACHE_MAX = 16;
  const smoothstep = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));

  // smoothstep only zeroes the first. Used where a change has to start and stop invisibly.
  const smootherstep = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * x * (x * (x * 6 - 15) + 10));
  const containerCurve = (u) => easeOut(clamp01(u / PHYS.grow));

  // side it starts from and the side it lands on are exactly the record's.
  function containerOpen(u) {
    const shutSpan = Math.max(1e-6, (1 - PHYS.blend) - PHYS.shutFrom);
    const open = smootherstep(clamp01(u / PHYS.openBy));

    return PHYS.open * open * (1 - shut);

  const containerSide = (a, b, u) => lerp(a, b, containerCurve(u)) + containerOpen(u);
  // The spring's stiffness multiplier at tau: one until the tightening window, then rising to
  // PHYS.tighten by the time the blend takes over.
  function tightenScale(tau) {
    const span = Math.max(1e-6, (1 - PHYS.blend) - PHYS.tightenFrom);

  // A trajectory is computed in one of three modes. 'snap' is the shipped behaviour: the last
  // PHYS.blend of the move eases every square onto the record's pose and the final state is the
  // record. 'free' runs the same simulation to the end of the move with no blend and no snap, so
  // the panel can say how far the physics landed from the record by itself. 'blind' (revision 6,
  // feature 3) is the honest run: no target springs at all.
  const MODES = ['snap', 'free', 'blind'];
  function simMode() { return state.blind ? 'blind' : (state.snap ? 'snap' : 'free'); }

  // centres, inset half a side from the walls so an upright square fits, scored by the distance to
  // the nearest square's centre. Ties go to the first cell in scan order, so it is deterministic.
  function emptiestSpot(X, Y, count, side) {
    const lo = 0.5, hi = side - 0.5;

    let bx = lo, by = lo, best = -1;
    for (let a = 0; a <= cells; a++) {
      const px = lerp(lo, hi, a / cells);
      for (let b = 0; b <= cells; b++) {

        for (let i = 0; i < count; i++) {

          const d = dx * dx + dy * dy;

        if (near > best) { best = near; bx = px; by = py; }
      }
    }

  }

  function simulate(pairIndex, steps, style, mode, level) {
    const p = PAIRS[pairIndex];
    const A = FRAMES[String(p.n)];
    const B = FRAMES[String(p.n + 1)];
    const n = p.n, N = n + 1;
    const rigid = style === 'bodies';
    // The law's furthest reach past touching. Zero with no attraction, which is the shipped default
    // and the fast path in `collide`; the broad phase's cell and the pair test both widen by it.
    const lawReach = lawAttracts() ? LAW.range : 0;

    // and the world velocity of its centre (for the contact damping).

    const X = new Float64Array(N), Y = new Float64Array(N), TH = new Float64Array(N);
    const VX = new Float64Array(N), VY = new Float64Array(N);
    const TX = new Float64Array(N), TY = new Float64Array(N), TT = new Float64Array(N);
    const COS = new Float64Array(N), SIN = new Float64Array(N), SZ = new Float64Array(N);

      TX[i] = b[0]; TY[i] = b[1];
