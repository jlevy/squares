<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best known packings: transition review candidate</title>
<style>
__FONT_CSS__
:root {
  --ink: #17202a;
  --muted: #5c6673;
  --label: #47525f;
  --quiet: #8a939e;
  --quiet-rule: #c9cfd5;
  --new: #a3123f;
  /* Revision 8: the one green on the page, and it means one thing — the arrangement on the stage
     is the best known one. Nothing else is ever drawn in it. */
  --met: #17794a;
  --paper: #ffffff;
  --panel: #f7f8fa;
  --chrome: #e6e8eb;
  --rule: #d5d9de;
  --track: #dfe3e7;
  /* "Atlas Symbols" is KaTeX_Main restricted to the relation code points (≤ ≥ √ ≈ …) that the
     latin subsets do not carry; it follows PT Serif so those glyphs never fall back to Georgia. */
  --serif: "PT Serif", "Atlas Symbols", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Atlas Symbols", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--chrome);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  overflow: hidden;
}
body.capture { background: var(--paper); }
#viewport {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
}
#stage-wrap { position: relative; flex: none; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  background: var(--paper); transform-origin: 0 0;
  box-shadow: 0 8px 40px rgba(23, 32, 42, 0.18);
}
body.capture #stage { box-shadow: none; }
/* Revision 9: the squares can be picked up, so the surface takes pointer gestures rather than the
   browser's pan and zoom, and says so with the cursor. */
#packing-svg { position: absolute; left: 60px; top: 24px; width: 1000px; height: 1000px; display: block; touch-action: none; }
#packing-svg #squares { cursor: grab; }
body.dragging #packing-svg #squares { cursor: grabbing; }
#links line { stroke: var(--paper); stroke-opacity: 0.85; stroke-width: 2; }
#ghost rect { stroke: var(--muted); }
#mark rect { stroke: none; }
#facts { position: absolute; left: 1160px; top: 0; width: 700px; height: 1080px; }
.facts-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; will-change: opacity; }
/* Type scale, revision 4: four sizes on the stage, 28 / 34 / 44 / 96 px, nothing smaller than
   28 so the page reads on video. 28 is every small line (the eyebrow, the small-caps notes, the
   badge labels, the open group, the legend, the progress bar's labels); 34 the `n =` line, the
   exact line and the lower bound; 44 the side line; 96 the numeral, PT Serif Regular, 3.4 times
   the smallest. The badge glyphs are drawn marks in the poster's boxes, not stage text. */
/* Revision 8, feature 4: how close the arrangement on the stage is to the best known, drawn on a
   scale that runs from the proved lower bound to comfortably past the record. The panel's top 200 px
   were empty, and this is what goes in them: the head row at 24, the bar at 66, the two tick numbers
   below it, the whole thing ending at 166 with the eyebrow at 200.
   Revision 9 folds the two tabs into one view, so the bar is always drawn: the range is the spine and
   its `to` end is the n the bar measures.
   The two numbers are the ones the panel itself prints, s(n) <= and s(n) >=, read from the record. */
.gapbar { position: absolute; left: 6px; top: 24px; width: 694px; height: 150px; }
.gapbar-head {
  position: relative; height: 34px; line-height: 34px; font-family: var(--sans); font-size: 28px;
  font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--quiet); white-space: nowrap;
}
.gapbar-excess {
  position: absolute; right: 48px; top: 0; letter-spacing: 0.01em; text-transform: none;
  font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted);
}
.gapbar.is-met .gapbar-excess { color: var(--met); }
/* The checkbox: empty and grey until the picture is the record, then filled and green. */
.gapbar-box { position: absolute; right: 0; top: 1px; width: 34px; height: 34px; display: block; }
.gapbar-box .check-box { fill: none; stroke: var(--quiet-rule); stroke-width: 2; }
.gapbar-box .check-mark { fill: none; }
.gapbar.is-met .gapbar-box .check-box { stroke: var(--met); }
.gapbar.is-met .gapbar-box .check-mark { fill: var(--met); }
.gapbar-plot { position: absolute; left: 0; top: 42px; width: 680px; height: 100px; display: block; }
.gapbar-plot .track { fill: var(--track); }
/* The open territory: everything between what is proved and what is known. */
/* Named `gap-open`, not `open`: `height` is a CSS property on an SVG rect, so the panel's own
   `.open` group (a 76 px slot) silently stretched this band to 76 px when it shared the name. */
.gapbar-plot .gap-open { fill: var(--quiet); opacity: 0.34; }
.gapbar-plot .edge { stroke: var(--muted); stroke-width: 2; }
.gapbar-plot .edge.record { stroke: var(--ink); stroke-width: 3; }
.gapbar-plot .hand { fill: var(--ink); }
.gapbar-plot .hand-stem { stroke: var(--ink); stroke-width: 2; }
.gapbar.is-met .gapbar-plot .hand { fill: var(--met); }
.gapbar.is-met .gapbar-plot .hand-stem { stroke: var(--met); }
.gapbar-num { font-family: var(--sans); font-size: 28px; font-weight: 450; fill: var(--muted); }
.gapbar-num.record { fill: var(--ink); font-weight: 600; }
.eyebrow {
  position: absolute; left: 6px; top: 200px;
  font-family: var(--sans); font-weight: 550; font-size: 28px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--label);
}
/* The headline: `n =` on its own small line (italic n, upright equals, muted) above the numeral,
   the two left-aligned on their ink. The numeral's box offset is not in this stylesheet: the
   build reads the digits' left side bearings from the regular face (median 49 units, 4.7 px at
   96 px) and the italic n's (43 units, 1.5 px at 34 px) and emits `metrics.numeral_left_px`,
   which the script applies, so the ink of the median digit begins where the n's does.
   The `n =` line is constant, so it lives outside the two fading layers and never blinks.
   Every slot below is fixed, so nothing jumps between n. */
.nline { position: absolute; left: 6px; top: 250px; height: 40px; font-family: var(--serif); font-size: 34px; line-height: 40px; color: var(--muted); white-space: nowrap; }
.nline .n-var { font-style: italic; font-weight: 400; margin-right: 0.22em; }
.nline .n-eq { font-weight: 400; }
.numeral { position: absolute; left: 0; top: 300px; font-family: var(--serif); color: var(--ink); line-height: 1; white-space: nowrap; will-change: transform; }
.numeral .n-val { font-weight: 400; font-size: 96px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.side { position: absolute; left: 6px; top: 424px; font-family: var(--serif); font-size: 44px; line-height: 1.2; color: var(--ink); white-space: nowrap; }
.side .fn, .lower .fn { font-style: italic; }
.side .arg, .lower .arg { margin-left: 0.04em; }
.side .rel, .lower .rel { margin: 0 0.3em; color: var(--label); }
/* One line under the value it annotates: the closed form in the text face, or a small-caps note. */
.exact { position: absolute; left: 6px; top: 488px; height: 46px; font-family: var(--serif); font-size: 34px; line-height: 1.3; color: var(--muted); white-space: nowrap; }
.exact .rel { margin-right: 0.3em; }
.exact .note, .lower-note .note { font-family: var(--sans); font-size: 28px; font-weight: 500; font-variant-caps: all-small-caps; letter-spacing: 0.09em; color: var(--muted); }
/* The proved lower bound for an open n, `s(n) ≥ value` in the side line's style at the exact
   line's size, with its small-caps note on its own line directly below. Proved n leave both
   slots empty at their fixed heights. The digits are never coloured: when the bound was first
   proved here the star badge already says so, in scarlet. */
.lower { position: absolute; left: 6px; top: 552px; height: 46px; font-family: var(--serif); font-size: 34px; line-height: 1.3; color: var(--ink); white-space: nowrap; }
.lower-note { position: absolute; left: 6px; top: 598px; height: 36px; line-height: 36px; white-space: nowrap; }
/* The poster's badges, in a row with short labels. Fixed height: the row never reflows. */
.badges { position: absolute; left: 6px; top: 664px; height: 40px; display: flex; align-items: center; gap: 34px; white-space: nowrap; }
.badge-item { display: inline-flex; align-items: center; gap: 11px; font-family: var(--sans); font-size: 28px; font-weight: 500; color: var(--label); letter-spacing: 0.01em; }
.badge-item svg { width: 36px; height: 36px; display: block; flex: none; }
.badge-item.is-star .label { color: var(--new); font-weight: 600; }
.badge .box { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.badge-solid .box { fill: var(--muted); stroke: none; }
.badge-query .box { stroke: var(--quiet-rule); }
.badge .glyph { font-family: var(--sans); font-weight: 650; font-size: 15px; fill: var(--muted); }
.badge-solid .glyph { fill: var(--paper); }
.badge-query .glyph { fill: var(--quiet); }
/* The approximately-equal sign is KaTeX_Main's outline in font units, filled and thickened by a
   stroke in the same units (the stroke width scales with the path), as the slideshow draws it. */
.badge .glyph-path { fill: var(--muted); stroke: var(--muted); stroke-linejoin: round; }
.badge .star { fill: var(--new); }
/* What the record leaves open for this n. Quieter, and a fixed two-line height. */
.open { position: absolute; left: 6px; top: 740px; height: 76px; }
.open-head { height: 34px; line-height: 34px; font-family: var(--sans); font-size: 28px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--quiet); }
.open-items { position: absolute; left: 0; top: 40px; height: 36px; display: flex; align-items: center; gap: 28px; white-space: nowrap; }
.open-item { display: inline-flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 28px; font-weight: 450; color: var(--quiet); }
.open-item svg { width: 32px; height: 32px; display: block; flex: none; }
.open-none { font-family: var(--sans); font-size: 28px; font-weight: 450; color: var(--quiet); }
/* Revision 9: the three legend lines that sat here (the scarlet convention, the active style, what a
   free or blind run was doing) are gone. The stage carries facts about the packing and nothing that
   explains itself; what they said is written down in NOTES.md instead. The live readout moves up
   into the room they leave, 826 to 978, with the progress bar still beginning at 1034.
   Revision 7, feature 3: how far off the best known the picture is, at every frame. */
.gap-read { position: absolute; left: 6px; top: 826px; width: 694px; height: 152px; }
/* max-content so the row's box is its ink, which is what the fit checks have to measure. */
.gap-line { width: max-content; font-family: var(--sans); font-size: 28px; font-weight: 450; line-height: 38px; color: var(--muted); letter-spacing: 0.01em; white-space: nowrap; }
/* The progress bar: a pure function of the clock, along the bottom of the stage. Revision 7 gives
   the track a scale instead of two end labels — a numeral every 25 with a major tick, a minor tick
   every 5 — and brings the riding n down into the numeral row, where it is the only bold, inked
   numeral and carries a cursor on the track. The whole apparatus is the band 1034-1080; the panel
   above it ends at 1032. */
#progress { position: absolute; left: 0; top: 1034px; width: 1920px; height: 46px; font-family: var(--sans); color: var(--label); }
#progress .p-track { position: absolute; left: 100px; top: 4px; width: 1720px; height: 4px; border-radius: 2px; background: var(--track); }
#progress .p-fill { position: absolute; left: 0; top: 0; width: 0; height: 4px; border-radius: 2px; background: var(--label); }
/* Ticks: the majors in the muted grey the numerals use, the minors a step quieter so the scale
   reads as a scale rather than a comb. */
#progress .p-tick { position: absolute; top: 9px; width: 2px; margin-left: -1px; height: 5px; border-radius: 1px; background: var(--quiet); }
#progress .p-tick.p-major { height: 9px; background: var(--muted); }
#progress .p-num { position: absolute; top: 14px; transform: translateX(-50%); font-size: 28px; line-height: 32px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); }
#progress .p-cursor { position: absolute; top: 2px; width: 3px; margin-left: -1.5px; height: 14px; border-radius: 1.5px; background: var(--ink); }
#progress .p-n { position: absolute; top: 14px; left: 100px; transform: translateX(-50%); font-size: 28px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
#kind-tag {
  position: absolute; left: 60px; top: 14px; font-family: var(--sans); font-size: 18px;
  color: var(--label); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
}
body.capture #kind-tag { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Revision 9: one view, no tabs. Stepping one n and running a range are the same operation over a
   different span, so the range is the single spine: `from` and `to` are values of n stepped into,
   and setting them equal is the old Single step tab. */
#controls {
  flex: none; width: 100%; box-sizing: border-box; padding: 10px 16px 12px;
  background: var(--chrome); border-top: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 8px;
}
body.capture #controls { display: none; }
#panel { display: flex; flex-direction: column; gap: 8px; }
[hidden] { display: none !important; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row label { display: inline-flex; align-items: center; gap: 5px; color: var(--label); white-space: nowrap; }
button, select, input[type=number] {
  font: inherit; color: var(--ink); background: var(--paper); border: 1px solid #b9c0c8; border-radius: 4px;
  padding: 4px 10px; cursor: pointer;
}
button:hover { background: #f3f5f7; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 84px; }
button.primary:hover { background: #2b3947; }
/* Revision 9: the transport is the tape convention — a right-pointing triangle to play, two bars to
   pause — drawn as inline SVG on one button that toggles. The glyphs are `fill: currentColor`, so
   they take the button's ink in both states, and the accessible name is set from the script beside
   the class that swaps them. Previous and next are `-` and `+`: they were solid triangles, which on
   a transport row read as play. */
button.transport {
  min-width: 44px; padding: 5px 14px; display: inline-flex; align-items: center; justify-content: center;
}
button.transport svg { width: 18px; height: 18px; display: block; fill: currentColor; }
button.transport .glyph-pause { display: none; }
button.transport.is-playing .glyph-play { display: none; }
button.transport.is-playing .glyph-pause { display: inline; }
button.step-nudge { min-width: 36px; font-weight: 700; font-size: 15px; line-height: 1.1; text-align: center; }
input[type=number] { width: 64px; padding: 4px 6px; }
#scrub { flex: 1; min-width: 240px; accent-color: var(--ink); }
/* Revision 9: how fast the virtual clock runs during playback, 0.05x to 2x on a logarithmic slider
   so the slow end has as much travel as the fast one. It scales playback only — `seek(t)` is still a
   pure function of its argument, so every instant renders identically and captures are untouched. */
#speed { width: 130px; accent-color: var(--ink); }
#speed-info { font-variant-numeric: tabular-nums; color: var(--label); min-width: 52px; }
#clock { font-family: var(--mono); font-size: 13px; color: var(--label); min-width: 120px; text-align: right; }
#pair-select { max-width: 480px; }
.hint { color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid #b9c0c8; border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; }
.seg button + button { border-left: 1px solid #b9c0c8; }
.seg button.on { background: var(--ink); color: var(--paper); }
#pair-info { color: var(--label); font-size: 13px; }
/* The chooser for n, and the sparse cases worth looking at as a row of chips. A chip sets both ends
   of the range to the same value, which is one step. */
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chips button { padding: 3px 9px; font-size: 13px; min-width: 38px; text-align: center; }
.chips button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.step-label { font-weight: 600; color: var(--ink); white-space: nowrap; }
#step-note { font-style: italic; }
/* The range: two boxes of n, its length in wall-clock seconds, and where a run stands in it. */
#range-from, #range-to { width: 72px; font-weight: 600; }
.range-sep { color: var(--label); }
.range-figure { color: var(--label); white-space: nowrap; }
.range-figure strong { color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage-wrap">
    <div id="stage" aria-label="Animated transition between consecutive best known packings">
      <svg id="packing-svg" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="true">
        <g id="world" transform="scale(1 -1)">
          <rect id="container" x="0" y="0" width="1" height="1" fill="none" stroke="#000000" stroke-width="2" vector-effect="non-scaling-stroke" />
          <g id="squares"></g>
          <g id="links"></g>
          <g id="ghost" opacity="0"><rect x="-0.5" y="-0.5" width="1" height="1" fill="none" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke" /></g>
          <g id="mark" opacity="0"><rect x="-0.5" y="-0.5" width="1" height="1" fill="none" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" /></g>
        </g>
      </svg>
      <div id="facts">
        <div class="gapbar" id="gapbar">
          <div class="gapbar-head">
            <span class="gapbar-title">gap to the best known</span>
            <span class="gapbar-excess" id="gapbar-excess"></span>
            <svg class="gapbar-box" viewBox="0 0 34 34" aria-hidden="true">
              <rect class="check-box" x="2" y="2" width="30" height="30" rx="5" />
              <path class="check-mark" id="gapbar-check" d="M6.5 17.8 L13.6 25 L27.2 9.4 L30 12.1 L13.8 30.6 L4 20.5 Z" />
            </svg>
          </div>
          <svg class="gapbar-plot" viewBox="0 0 680 100" aria-hidden="true">
            <rect class="track" x="0" y="34" width="680" height="18" rx="3" />
            <rect class="gap-open" id="gapbar-open" x="0" y="34" width="0" height="18" />
            <line class="edge" id="gapbar-lower" x1="1" y1="27" x2="1" y2="59" />
            <line class="edge record" id="gapbar-record" x1="0" y1="24" x2="0" y2="62" />
            <g id="gapbar-hand">
              <path class="hand" d="M -10 8 L 10 8 L 0 23 Z" />
              <line class="hand-stem" x1="0" y1="21" x2="0" y2="53" />
            </g>
            <text class="gapbar-num" id="gapbar-lower-label" x="0" y="88" text-anchor="start"></text>
            <text class="gapbar-num record" id="gapbar-record-label" x="0" y="88" text-anchor="middle"></text>
          </svg>
        </div>
        <div class="eyebrow">Best known packing</div>
        <div class="nline" aria-hidden="true"><span class="n-var">n</span><span class="n-eq">=</span></div>
        <div class="facts-layer" id="facts-a"></div>
        <div class="facts-layer" id="facts-b"></div>
        <div class="gap-read" id="gap-read">
          <div class="gap-line" id="gap-a"></div>
          <div class="gap-line" id="gap-b"></div>
          <div class="gap-line" id="gap-c"></div>
          <div class="gap-line" id="gap-d"></div>
        </div>
      </div>
      <div id="progress" aria-hidden="true">
        <div class="p-track"><div class="p-fill" id="p-fill"></div></div>
        <div id="p-scale"></div>
        <span class="p-cursor" id="p-cursor"></span>
        <span class="p-n" id="p-n"></span>
      </div>
      <div id="kind-tag"></div>
    </div>
  </div>
  <div id="controls">
    <div id="panel">
      <div class="row">
        <label for="range-from"><strong>n</strong></label>
        <button id="prev" class="step-nudge" title="The step before (left arrow)" aria-label="the step before">&minus;</button>
        <input type="number" id="range-from" step="1" aria-label="the first value of n to step into">
        <span class="range-sep">to</span>
        <input type="number" id="range-to" step="1" aria-label="the last value of n to step into">
        <button id="next" class="step-nudge" title="The step after (right arrow)" aria-label="the step after">+</button>
        <button id="range-all" title="Widen the range to every step this page carries">whole corpus</button>
        <span class="step-label" id="step-label"></span>
        <span class="chips" id="step-chips"></span>
      </div>
      <div class="row">
        <button id="play" class="primary transport" title="Play or pause (space)" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="glyph-play" d="M7.5 4.5 L19.5 12 L7.5 19.5 Z" />
            <g class="glyph-pause"><rect x="6.6" y="4.5" width="4.2" height="15" rx="1.1" /><rect x="13.2" y="4.5" width="4.2" height="15" rx="1.1" /></g>
          </svg>
        </button>
        <input id="scrub" type="range" min="0" max="10000" step="1" value="0" aria-label="Scrub the current step">
        <span id="clock">0.000 / 0.000 s</span>
        <label title="How fast the clock runs while playing: 0.05x to watch a settle closely, 2x to skim">speed
          <input type="range" id="speed" min="0" max="1000" step="1" aria-label="playback speed">
          <span class="hint" id="speed-info"></span>
        </label>
        <span class="range-figure" id="range-duration"></span>
        <span class="range-figure" id="range-position"></span>
        <button id="refresh-gap" title="Redraw the gap bar against what is on the stage now">update gap bar</button>
      </div>
      <div class="row">
        <label>start
          <span class="seg" id="initial-seg">
            <button data-initial="previous" title="The retained packing of n-1 with the new square added">previous packing</button>
            <button data-initial="random" title="n squares at seeded pseudo-random centres and angles in a box larger than the record">random</button>
            <button data-initial="grid" title="n squares axis-aligned in rows from the bottom-left, in the grid's own box">ordered fill</button>
          </span>
        </label>
        <button id="optimize" class="primary" title="Run the current settings from the chosen start until pause">Optimize</button>
      </div>
      <div class="row">
        <span class="hint" id="step-note"></span>
      </div>
    </div>
    <div class="row">
      <label>Style
        <select id="style-select" aria-label="Animation style">
          <option value="tween">A · tween</option>
          <option value="physics">B · physics</option>
          <option value="bodies">C · bodies</option>
        </select>
      </label>
      <label>Colour

      <label>settle <input type="number" id="t-settle" min="0" max="5" step="0.1"> s</label>

<script id="atlas-data" type="application/json">__DATA__</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
  const FRAMES = DATA.frames;
  const PAIRS = DATA.pairs;
  const FACTS = DATA.facts;
  const METRICS = DATA.metrics;
  const N_MAX = DATA.n_max;             // 324: the progress bar always maps to 1..N_MAX
  const PHASES = DATA.motion_phases;    // add-then-move (the default), move-then-add, simultaneous, rotate-first, slide-first
  const ARRIVAL_FRACTION = DATA.arrival_fraction;  // the share of the move the new square takes to arrive in the two staged modes
  const PAD = 0.045;                    // container-side fraction of breathing room inside the 1000 px box
  const NEW_FRACTION = 1 / 3;           // in the three unstaged modes the new square fades in over the last third of the move
  const ROLL_MAX = 0.4;                 // seconds for the panel's out-then-in sequence, from the moment the new square starts to appear
  const MARK_FADE = 0.15;               // fraction of the move over which the previous pair's scarlet outline gives way to the normal stroke
  const MARK_WIDE = 4, MARK_THIN = 2;   // scarlet outline widths, px: at arrival, and through the following dwell
  const TINT = 1.0;                     // the arriving square starts fully scarlet and settles to its own fill
  // Revision 6: while a pair is in motion the fills lose chroma, and lock back in over the settle,
  // so the resting frame is exactly the retained colours and only the moving picture is muted.
  const DESAT = 0.5;                    // the chroma a fill keeps at full desaturation (half of it)
  const DESAT_IN = 0.15;                // the fraction of the move over which the colour drains
  // Continuous play (revision 6, feature 4): the beat the whole sequence runs at, back to back.
  // A static append (a grid prefix or a shared picture, where nothing moves) gets a dwell and no
  // move at all, unless the full beat is asked for.
  const CONTINUOUS = { dwell: 0.8, move: 1.2, settle: 0.3, staticDwell: 0.5 };
  // Revision 7, feature 2: the annealing dial, 0 to 10, default 3. The default is exactly the
  // revision-6 shake, so nothing about the shipped picture moves when the dial is not touched.
  // Three things rise with the level, and all three are stated here rather than in the simulator:
  //   amplitude  0 at level 0, 1 (the shipped jiggle) at 3, 3 at 10, linear on each side of 3;
  //   decay      the shake falls as (1 - tau)^p over the run, p = 1.5 at levels 0..3 easing to
  //              0.35 at 10, so at 10 the shake is still at 57% of its amplitude four fifths of
  //              the way through instead of 9%;
  //   span       the run is 1 move long up to level 3 and lengthens by a tenth of a move a level
  //              after that, to 1.7 moves at 10 — extra sub-steps at the same dt (the wall clock
  //              of a step stays 1/120 s), so a high level buys more simulated time to settle in
  //              rather than a faster shake in the same time. The move on the clock lengthens with
  //              it, which is why `timing` takes the style: only B and C are annealed.
  const ANNEAL = {
    min: 0, max: 10, dflt: 3,
    amplitude: (L) => (L <= 3 ? L / 3 : 1 + (L - 3) * (2 / 7)),
    decayPower: (L) => (L <= 3 ? 1.5 : 1.5 - (L - 3) * (1.15 / 7)),
    span: (L) => (L <= 3 ? 1 : 1 + (L - 3) * 0.1),
  };
  // Revision 9: the playback speed. The ends are the owner's — slow enough to watch a settle
  // (0.05x, twenty seconds of wall clock for a one-second move) and fast enough to skim (2x). The
  // slider is logarithmic between them, so half way is the geometric mean rather than 1.02x, and
  // 1x is a value the slider can actually land on because the readout rounds to two places.
  const SPEED = { min: 0.05, max: 2, steps: 1000 };
  const speedToSlider = (m) => Math.round((Math.log(m / SPEED.min) / Math.log(SPEED.max / SPEED.min)) * SPEED.steps);
  const sliderToSpeed = (v) => SPEED.min * Math.pow(SPEED.max / SPEED.min, v / SPEED.steps);
  const DEG = Math.PI / 180;
  // Scarlet is defined once, in the stylesheet, and read back here for the fill tint.
  const SCARLET = getComputedStyle(document.documentElement).getPropertyValue('--new').trim();

  const state = {
    // Revision 9: one view. Revision 8's two tabs were the same operation over a different span, so
    // the range below is the single spine and `tab` is gone from the page. The API keeps `setTab`
    // and `tab` as no-ops for anything that still calls them.
    pair: 0,
    t: 0,
    playing: false,
    timing: { dwell: DATA.timing.dwell, move: DATA.timing.move, settle: DATA.timing.settle },
    rule: 'continuous',
    phase: PHASES[0],
    style: 'tween',                     // 'tween' (style A, the block tween), 'physics' (B) or 'bodies' (C)
    desaturate: true,                   // drain the fills' chroma while the pair moves, lock the colour back in over the settle
    snap: true,                         // blend the physics onto the record's poses over the last of the move, and end on them exactly
    blind: false,                       // run the physics with no knowledge of the target poses at all
    anneal: 3,                          // how hard and how long the physical styles shake: 0 none, 3 the shipped default, 10 the loudest
    links: false,
    capture: false,
    autoAdvance: true,
    // Continuous play across the whole sequence: on, whether static appends take the full beat, and
    // whether the next pair is simulated during this one's dwell.
    continuous: { on: false, fullBeat: false, prefetch: true },
    // Revision 9: the range, stated as the values of n stepped *into*, which is the unit the chooser
    // and the chips have always used. 17 to 17 is the one step 16 -> 17 (the page's default), 2 to
    // 324 is the whole corpus. Clamped to what the page carries by `setRange`.
    range: { from: 17, to: 17 },
    // Revision 9: the playback rate. It multiplies the wall-clock delta the animation clock is
    // advanced by and the simulated time an open-ended run covers per frame, and nothing else.
    speed: 1,
    // Revision 9: what an open-ended Optimize run starts from, and whether one is on the stage.
    initial: 'previous',
    optimizing: false,
    liveN: null,
  };

  // ---------------------------------------------------------------- maths
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const easeOut = (u) => 1 - Math.pow(1 - u, 3);
  // Shortest signed turn modulo 90, in (-45, 45]; an exact 45 degree tie turns counter-clockwise, so
  // the direction is a rule rather than a rounding accident (the symmetric colour sweep looks the same
  // either way).
  function angleDelta(a, b) {
    let d = ((b - a) % 90 + 90) % 90;
    if (d > 45 + 1e-9) d -= 90;
    return d;
  }
  // A block member's own turn: the block's turn plus the correction from where the block leaves
  // it to its own final tilt, the correction taken the way round that keeps the total turn
  // smallest. (A square that rides a 45 degree block but ends upright is an exact tie for the
  // correction; the rule above would send it round by 90 rather than let it stay upright.)
  function memberTurn(blockTurn, a, b) {
    const d = ((b - a - blockTurn) % 90 + 90) % 90;
    const one = blockTurn + d, other = blockTurn + d - 90;
    return Math.abs(one) <= Math.abs(other) + 1e-9 ? one : other;
  }
  const fmt = (v, d) => v.toFixed(d);

  // ---------------------------------------------------------------- colour (OkLab / OkLCh)
  const srgbToLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const linearToSrgb = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
  const labCache = new Map();
  function hexToLab(hex) {
    let lab = labCache.get(hex);
    if (lab) return lab;
    const r = srgbToLinear(parseInt(hex.slice(1, 3), 16) / 255);
    const g = srgbToLinear(parseInt(hex.slice(3, 5), 16) / 255);
    const b = srgbToLinear(parseInt(hex.slice(5, 7), 16) / 255);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    lab = [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s,
    ];
    labCache.set(hex, lab);
    return lab;
  }
  function labToLinear(L, a, b) {
    const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    const s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
    return [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
    ];
  }
  const hex2 = (v) => {
    const n = Math.max(0, Math.min(255, Math.round(linearToSrgb(Math.max(0, Math.min(1, v))) * 255)));
    return (n < 16 ? '0' : '') + n.toString(16);
  };
  function labToHex(L, a, b) {
    const rgb = labToLinear(L, a, b);
    return '#' + hex2(rgb[0]) + hex2(rgb[1]) + hex2(rgb[2]);
  }
  function inGamut(L, C, h) {
    const rgb = labToLinear(L, C * Math.cos(h), C * Math.sin(h));
    return rgb.every((v) => v >= -1e-4 && v <= 1 + 1e-4);
  }
  function oklchHex(L, C, hDeg) {
    const h = (hDeg * Math.PI) / 180;
    if (!inGamut(L, C, h)) {
      let lo = 0, hi = C;
      for (let i = 0; i < 14; i++) {
        const mid = (lo + hi) / 2;
        if (inGamut(L, mid, h)) lo = mid; else hi = mid;
      }
      C = lo;
    }
    return labToHex(L, C * Math.cos(h), C * Math.sin(h));
  }
  function mixHex(x, y, u) {
    if (u <= 0) return x;
    if (u >= 1) return y;
    const p = hexToLab(x), q = hexToLab(y);
    return labToHex(lerp(p[0], q[0], u), lerp(p[1], q[1], u), lerp(p[2], q[2], u));
  }
  // Revision 6: drain a fill's chroma, keeping its lightness and hue. Scaling the OkLab a and b by
  // the same factor is exactly scaling C in OkLCh, so this is the page's own colour space and the
  // hue never drifts. At level 0 the hex is returned unchanged, so a resting frame is byte-identical
  // to the build that had no desaturation at all.
  function desatHex(hex, level) {
    if (level <= 0) return hex;
    const lab = hexToLab(hex);
    const k = 1 - (1 - DESAT) * level;
    return labToHex(lab[0], lab[1] * k, lab[2] * k);
  }
  function lchOf(hex) {
    const lab = hexToLab(hex);
    return { L: lab[0], C: Math.hypot(lab[1], lab[2]), h: ((Math.atan2(lab[2], lab[1]) * 180) / Math.PI + 360) % 360 };
  }
  // The two pinned house families, stated as the house states them: the OkLCh hue of the base fill
  // and the perceptual shade ramp (PERCEPTUAL_SHADE_RAMPS in sqpack/render/color.py), lightness from
  // the four-contact dark end to the zero-contact light end at a fixed chroma.
  const TEAL = Object.assign(lchOf('#1faa8e'), { dark: 0.50, light: 0.70, chroma: 0.080 });     // slot 0, right angles
  const CITRON = Object.assign(lchOf('#c3c45f'), { dark: 0.68, light: 0.862, chroma: 0.150 }); // slot 1, 45 degree tilts
  // Continuous rule, revision 3: a symmetric sweep. Hue is a function of the tilt's distance from
  // the grid, min(angle, 90 - angle) in 0..45, teal at 0 and citron at 45 along the short arc between
  // them (65 degrees of hue), so a tilt and its mirror get the same colour and no fill is ever red,
  // orange or blue: scarlet is reserved for the new square. (Revision 2 went the long way round the
  // hue circle from 45 to 90 and painted 58-65 degree tilts salmon and orange beside the mark.)
  // At 0 and 45 degrees the fills are exactly the house families, so grid frames look as the atlas does.
  // Lightness is shaded by the frame's full-side contact count, darkest at four, as the house rule does;
  // lightness, chroma and hue interpolate in OkLCh and chroma is clipped to the sRGB gamut.
  function continuousFill(angle, contacts) {
    const shade = (4 - contacts) / 4;
    const u = Math.min(angle, 90 - angle) / 45;
    const dark = lerp(TEAL.dark, CITRON.dark, u);
    const light = lerp(TEAL.light, CITRON.light, u);
    const C = lerp(TEAL.chroma, CITRON.chroma, u);
    const h = TEAL.h + (CITRON.h - TEAL.h) * u;
    return oklchHex(lerp(dark, light, shade), C, (h + 720) % 360);
  }

  // ---------------------------------------------------------------- DOM
  const svg = document.getElementById('packing-svg');
  const containerRect = document.getElementById('container');
  const linksGroup = document.getElementById('links');
  const squaresGroup = document.getElementById('squares');
  const ghost = document.getElementById('ghost');
  const mark = document.getElementById('mark');
  const markRect = mark.firstElementChild;
  const factsA = document.getElementById('facts-a');
  const factsB = document.getElementById('facts-b');
  const kindTag = document.getElementById('kind-tag');
  const live = document.getElementById('live');
  const progressFill = document.getElementById('p-fill');
  const progressN = document.getElementById('p-n');
  const progressCursor = document.getElementById('p-cursor');
  const progressScale = document.getElementById('p-scale');
  const SVG_NS = svg.namespaceURI;
  const TRACK_LEFT = 100, TRACK_WIDTH = 1720;

  // Revision 7, feature 1: the bar carries the whole 1..N_MAX scale rather than two end labels.
  // The interval: the track is 1720 px for 324 values, 5.32 px a step, and a three-digit numeral at
  // 28 px tabular is about 47 px wide. A numeral every 25 puts 133 px between neighbours (86 px of
  // clear paper); every 10 would put 53 px between them and they would touch; every 50 would leave
  // the middle of the movie unlabelled. So 25, with the last value (324) labelled as well, and an
  // unlabelled minor tick every 5. The riding n shares the numeral row and hides whichever scale
  // numeral it would touch, so the two never collide; it is the only bold, inked numeral there and
  // carries a cursor on the track itself.
  // Revision 8 makes the span a variable rather than 1..N_MAX: on the sequence tab the bar spans the
  // range the owner picked, so a 1..100 run fills the whole track instead of the first third of it.
  // The interval is chosen from a ladder by the same rule that picked 25 for the full span — the
  // smallest step that leaves SCALE_MIN_SPACING between neighbouring numerals — and 1..324 still
  // lands on 25 with a minor tick every 5, so the shipped bar is unchanged where the span is.
  const SCALE_LADDER = [1, 2, 5, 10, 25, 50, 100, 250];
  const SCALE_MIN_SPACING = 120, SCALE_GAP = 14;
  let scaleLo = 1, scaleHi = N_MAX;
  const trackX = (n) => TRACK_LEFT + ((n - scaleLo) / (scaleHi - scaleLo)) * TRACK_WIDTH;
  const scaleLabels = [];
  let digitWidth = 15.6;   // measured below, once the faces are in; the fallback is Source Sans 3's figure at 28 px
  function buildScale(lo, hi) {
    scaleLo = lo;
    scaleHi = Math.max(lo + 1, hi);
    progressScale.textContent = '';
    scaleLabels.length = 0;
    const span = scaleHi - scaleLo;
    let major = SCALE_LADDER[SCALE_LADDER.length - 1];
    for (const s of SCALE_LADDER) {
      if ((s / span) * TRACK_WIDTH >= SCALE_MIN_SPACING) { major = s; break; }
    }
    const minor = major >= 5 ? major / 5 : 0;
    const majors = [scaleLo];
    for (let v = Math.ceil(scaleLo / major) * major; v < scaleHi; v += major) if (v > scaleLo) majors.push(v);
    majors.push(scaleHi);
    const isMajor = new Set(majors);
    if (minor > 0) {
      for (let v = scaleLo; v <= scaleHi; v += minor) {
        if (isMajor.has(v)) continue;
        const tick = document.createElement('i');
        tick.className = 'p-tick';
        tick.style.left = trackX(v) + 'px';
        progressScale.appendChild(tick);
      }
    }
    for (const v of majors) {
      const x = trackX(v);
      const tick = document.createElement('i');
      tick.className = 'p-tick p-major';
      tick.style.left = x + 'px';
      progressScale.appendChild(tick);
      const num = document.createElement('span');
      num.className = 'p-num';
      num.textContent = String(v);
      num.style.left = x + 'px';
      progressScale.appendChild(num);
      scaleLabels.push({ v: v, x: x, digits: String(v).length, node: num });
    }
  }
  buildScale(1, N_MAX);
  // One measurement of one numeral gives the figure width; the numerals are tabular, so every
  // label's width follows from its digit count and no frame ever has to ask the layout engine. A
  // three-digit label is preferred because it is the least relative error, but a shorter one will
  // do where the span carries no numeral that long.
  function measureDigit() {
    for (const want of [3, 0]) {
      for (const s of scaleLabels) {
        if ((want === 0 || s.digits === want) && s.node.offsetWidth > 0) { digitWidth = s.node.offsetWidth / s.digits; return; }
      }
    }
  }

  function el(tag, attrs) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }
  function text(tag, cls, content) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (content !== undefined) node.textContent = content;
    return node;
  }

  // Every square is one DOM element keyed by its global identity: identity k is born as the new
  // square of step k and is carried through every later pair by the identity chain the build
  // composed from the per-pair maps. An element is created once, the first time its identity is
  // shown, and is never re-keyed; a pair shows identities 1..n+1 and hides the rest. Because
  // identities are created in increasing order, the drawing order is birth order, so the newest
  // square always sits on top.
  const pool = new Map();
  function nodeFor(identity) {
    let g = pool.get(identity);
    if (!g) {
      g = el('g', { class: 'sq', 'data-identity': String(identity) });
      g.appendChild(el('rect', {
        x: '-0.5', y: '-0.5', width: '1', height: '1',
        stroke: '#000000', 'stroke-width': '1.5', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke',
      }));
      squaresGroup.appendChild(g);
      pool.set(identity, g);
    }
    return g;
  }

  // ---------------------------------------------------------------- badges (the poster's own marks)
  // A badge is the atlas's 19-unit rounded box (rx 4.5, stroke 1.2) with its glyph, scaled by the
  // panel. The star is the atlas's polygon; the approximately-equal sign is KaTeX_Main's U+2248
  // outline (the latin subset of Source Sans 3 has none), extracted at build time and drawn as a
  // path centred on its own ink, as the slideshow candidate draws it.
  const BADGE_LABELS = { 'O/solid': 'optimal', '=/solid': 'exact', '≈/muted': 'numerical', 'R/solid': 'rigid', 'R/muted': 'rigid (catalogue)' };
  const STAR_LABEL = 'new lower bound';
  const OPEN_LABELS = { optimality: 'optimality', 'exact value': 'exact value', rigidity: 'rigidity' };
  function glyphBaseline(glyph) {
    const b = METRICS.badge_baseline;
    return /[A-Za-z]/.test(glyph) ? b.letter : (glyph === '?' ? b.query : b.math);
  }
  function approxPath() {
    const a = METRICS.approx;
    const k = a.font_size / 1000;
    const baseline = 9.5 + ((a.y0 + a.y1) / 2) * k;
    const tx = 9.5 - (a.advance * k) / 2;
    return el('path', {
      d: a.d, class: 'glyph-path', 'stroke-width': String(a.stroke_units),
      transform: 'translate(' + tx.toFixed(3) + ' ' + baseline.toFixed(3) + ') scale(' + k.toFixed(4) + ' -' + k.toFixed(4) + ')',
    });
  }
  function badgeSvg(glyph, style) {
    const s = el('svg', { viewBox: '-1 -1 21 21', class: 'badge badge-' + style, 'aria-hidden': 'true' });
    if (style === 'star') {
      const k = 19 * METRICS.star_span / (2 * METRICS.star_inset);
      const pts = DATA.star_points.map((p) => (9.5 + p[0] * k).toFixed(3) + ',' + (9.5 + p[1] * k).toFixed(3)).join(' ');
      s.appendChild(el('polygon', { points: pts, class: 'star' }));
      return s;
    }
    s.appendChild(el('rect', { x: '0', y: '0', width: '19', height: '19', rx: '4.5', class: 'box' }));
    if (glyph === '≈') {
      s.appendChild(approxPath());
    } else {
      const t = el('text', { x: '9.5', y: String(glyphBaseline(glyph)), 'text-anchor': 'middle', class: 'glyph' });
      t.textContent = glyph;
      s.appendChild(t);
    }
    return s;
  }
  function badgeItem(cls, glyph, style, label) {
    const item = text('span', cls);
    item.appendChild(badgeSvg(glyph, style));
    item.appendChild(text('span', 'label', label));
    return item;
  }

  function buildFacts(layer, n) {
    const f = FACTS[String(n)];
    layer.textContent = '';
    // The numeral alone: the `n =` line above it is static, outside the layers. Its box offset
    // comes from the build, which read the regular face's digit bearings (see the stylesheet).
    const numeral = text('div', 'numeral');
    numeral.style.left = METRICS.numeral_left_px + 'px';
    numeral.appendChild(text('span', 'n-val', String(n)));
    layer.appendChild(numeral);
    function functionLine(cls, relation, value) {
      const line = text('div', cls);
      line.appendChild(text('span', 'fn', 's'));
      line.appendChild(text('span', 'arg', '(' + n + ')'));
      line.appendChild(text('span', 'rel', relation));
      line.appendChild(text('span', 'val', value));
      return line;
    }
    layer.appendChild(functionLine('side', f.relation, f.side));
    // The line under the value: the closed form when there is one the value does not already
    // state, or the degree note in small caps. Never to the right of the value.
    const exact = text('div', 'exact');
    if (f.exact && f.exact !== f.side) {

      // (a single square: to its own target angle). A block takes a contact's whole torque about its
      // centroid; a single square takes the fraction B applies.
      BX[b] = cx; BY[b] = cy; BPH[b] = 0;
      BTX[b] = tx; BTY[b] = ty;
      BTT[b] = blk !== null ? blk.turn * DEG : TT[ms[0]] - TH[ms[0]];
      BTF[b] = blk !== null ? 1 : PHYS.contactTorque;
      BM[b] = ms.length;
      let inertia = 0;
      for (const i of ms) {
        OX[i] = X[i] - cx; OY[i] = Y[i] - cy; OT[i] = TH[i];
        inertia += PHYS.inertia * SZ[i] * SZ[i] + OX[i] * OX[i] + OY[i] * OY[i];
      }
      BI[b] = inertia;
    }
    const newBody = BODY[n];
    // Numerical Recipes' LCG, seeded from the pair's n (so a pair jiggles the same way in index.html
    // and index-all.html); the page never draws from the browser's random source.
    let seed = (Math.imul(p.n, 2654435761) + 0x9e3779b9) >>> 0;
    const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    const [hzLo, hzHi] = PHYS.jiggleHz;
    for (let b = 0; b < NB; b++) {
      FQX[b] = 2 * Math.PI * lerp(hzLo, hzHi, rnd()); PHX[b] = 2 * Math.PI * rnd();
      FQY[b] = 2 * Math.PI * lerp(hzLo, hzHi, rnd()); PHY[b] = 2 * Math.PI * rnd();
      FQT[b] = 2 * Math.PI * lerp(hzLo, hzHi, rnd()); PHT[b] = 2 * Math.PI * rnd();
    }
    const k = PHYS.omega * PHYS.omega;
    const c = 2 * PHYS.zeta * PHYS.omega;
    // dt is in move units, and the run covers `span` of them, so a longer run is more sub-steps at
    // the same dt: at 120 steps a second of the annealed move this is always 1 / (120 * base move).
    const dt = span / steps;
    const states = new Float64Array((steps + 1) * N * 3);
    const store = (s) => {
      let o = s * N * 3;
      for (let i = 0; i < N; i++) { states[o++] = X[i]; states[o++] = Y[i]; states[o++] = TH[i]; }
    };
    // Every square's world pose and centre velocity from its body.
    function worldPoses() {
      for (let i = 0; i < N; i++) {
        const b = BODY[i], cs = Math.cos(BPH[b]), sn = Math.sin(BPH[b]);
        const rx = cs * OX[i] - sn * OY[i], ry = sn * OX[i] + cs * OY[i];
        X[i] = BX[b] + rx; Y[i] = BY[b] + ry; TH[i] = BPH[b] + OT[i];
        VX[i] = BVX[b] - BW[b] * ry; VY[i] = BVY[b] + BW[b] * rx;
      }
    }
    worldPoses();
    store(0);

    // Broad phase: a grid of PHYS.cell cells over the larger container with a two-unit margin.
    const cell = PHYS.cell;
    const gridOrigin = -2;
    const gridDim = Math.ceil((Math.max(A.side, B.side, side0) + 4) / cell) + 1;
    const head = new Int32Array(gridDim * gridDim);
    const next = new Int32Array(N);
    const cellOf = (v) => Math.max(0, Math.min(gridDim - 1, Math.floor((v - gridOrigin) / cell)));

    // A force (fx, fy) at the world point (px, py) on the body of square i, with its torque about
    // the body's centroid (the whole of it for a block, the fraction for a single square).
    function push(i, px, py, fx, fy) {
      const b = BODY[i];
      BFX[b] += fx; BFY[b] += fy;
      BTQ[b] += BTF[b] * ((px - BX[b]) * fy - (py - BY[b]) * fx);
    }
    // The corner of square i furthest along (nx, ny), into spx / spy.
    let spx = 0, spy = 0;
    let contactScale = 1;   // the push-apart's fade as the packing locks in
    let maxPenetration = 0; // diagnostic: the deepest overlap of two full-size squares while contacts are firm ...
    let maxPenetrationLate = 0; // ... and after they begin to soften at lock-in
    let stepPenetration = 0; // the deepest overlap in the step just taken, which gates the blind contraction
    function support(i, nx, ny) {
      const h = SZ[i] / 2, cs = COS[i], sn = SIN[i];
      const s1 = nx * cs + ny * sn >= 0 ? 1 : -1;
      const s2 = -nx * sn + ny * cs >= 0 ? 1 : -1;
      spx = X[i] + h * (s1 * cs - s2 * sn);
      spy = Y[i] + h * (s1 * sn + s2 * cs);
    }
    // Separating-axis test for two rotated squares; on overlap, push apart along the axis of least
    // penetration, the force acting at the incident square's deepest corner (so it also turns them).
    // Two members of one rigid body never push each other.
    function collide(i, j) {
      if (BODY[i] === BODY[j]) return;
      const dx = X[j] - X[i], dy = Y[j] - Y[i];
      const reach = 0.70711 * (SZ[i] + SZ[j]);
      if (dx * dx + dy * dy >= reach * reach) return;
      let best = Infinity, bnx = 0, bny = 0, owner = -1;
      for (let a = 0; a < 4; a++) {
        const own = a < 2 ? i : j;
        const cs = COS[own], sn = SIN[own];
        const ax = a & 1 ? -sn : cs, ay = a & 1 ? cs : sn;
        const ri = SZ[i] * (Math.abs(ax * COS[i] + ay * SIN[i]) + Math.abs(-ax * SIN[i] + ay * COS[i])) / 2;
        const rj = SZ[j] * (Math.abs(ax * COS[j] + ay * SIN[j]) + Math.abs(-ax * SIN[j] + ay * COS[j])) / 2;
        const d = dx * ax + dy * ay;
        const pen = ri + rj - Math.abs(d);
        if (pen <= 1e-9) return;
        if (pen < best) { best = pen; bnx = d < 0 ? -ax : ax; bny = d < 0 ? -ay : ay; owner = own; }
      }
      // (bnx, bny) points from i to j. The incident square is the one that does not own the axis.
      if (owner === i) support(j, -bnx, -bny); else support(i, bnx, bny);
      if (SZ[i] === 1 && SZ[j] === 1) {
        if (contactScale >= 1) { if (best > maxPenetration) maxPenetration = best; }
        else if (best > maxPenetrationLate) maxPenetrationLate = best;
        if (best > stepPenetration) stepPenetration = best;
      }
      const vn = (VX[j] - VX[i]) * bnx + (VY[j] - VY[i]) * bny;
      const f = contactScale * (PHYS.contact * Math.min(best, PHYS.contactCap) + (vn < 0 ? -PHYS.contactDamping * vn : 0));
      const fx = f * bnx, fy = f * bny;
      push(j, spx, spy, fx, fy);
      push(i, spx, spy, -fx, -fy);
    }

    // The container's side at every stored step. A blind run needs it drawn, since its box is not a
    // function of the clock: the contraction stalls whenever the packing jams.
    const sides = new Float64Array(steps + 1);
    sides[0] = blind ? side0 : A.side;
    let squeeze = 0;      // how far the blind contraction has got, 0 at the inflated box, 1 at the record's side
    let squeezeDone = false;
    for (let s = 1; s <= steps; s++) {
      const tau = (s - 1) / steps;
      let side;
      if (blind) {
        // The contraction clock runs only while the packing is not jamming, so "reached the record"
        // and "could not close any further" are the same test on `squeeze`.
        if (tau >= BLIND.hold && stepPenetration <= BLIND.overlapTol && squeeze < 1) {
          squeeze = Math.min(1, squeeze + (1 / steps) / (BLIND.close - BLIND.hold));
          if (squeeze >= 1) squeezeDone = true;
        }
        side = lerp(side0, B.side, smoothstep(squeeze));
        // The walls close on the packing rather than on the origin: shifting every body by half the
        // change keeps the contents centred in the box, so the squeeze comes from all four sides.
        const shift = (side - sides[s - 1]) / 2;
        if (shift !== 0) {
          for (let b = 0; b < NB; b++) { BX[b] += shift; BY[b] += shift; }
          worldPoses();
        }
      } else {
        side = lerp(A.side, B.side, containerCurve(tau));
      }
      sides[s] = side;
      stepPenetration = 0;
      // tau is the fraction of the whole run, so the shake decays over the run however long the
      // annealing has made it, and the exponent stretches it further at the high levels.
      const decay = Math.pow(1 - tau, decayPower);
      const tauMoves = tau * span;   // the jiggle's frequencies are cycles per move, not per run
      // A blind run has no target to spring toward: only the contacts, the walls and the jiggle.
      const ks = blind ? 0 : k * smoothstep(tau / PHYS.springRamp);
      // The push-apart fades only because the blend is about to carry the squares onto their exact
      // targets; with no blend to hand over to, the contacts stay firm to the last step.
      contactScale = mode === 'snap' ? 1 - clamp01((tau - PHYS.lockIn) / (1 - PHYS.blend - PHYS.lockIn)) : 1;
      SZ[n] = lerp(PHYS.inflateFrom, 1, clamp01(tau / PHYS.appear));
      BI[newBody] = PHYS.inertia * SZ[n] * SZ[n];
      for (let b = 0; b < NB; b++) { BFX[b] = 0; BFY[b] = 0; BTQ[b] = 0; }
      for (let i = 0; i < N; i++) {
        COS[i] = Math.cos(TH[i]); SIN[i] = Math.sin(TH[i]);
        // The walls, at each corner: a push back inside, with damping against the outward speed.
        const h = SZ[i] / 2, cs = COS[i], sn = SIN[i];
        for (let q = 0; q < 4; q++) {
          const s1 = q & 1 ? -1 : 1, s2 = q & 2 ? -1 : 1;
          const vx = X[i] + h * (s1 * cs - s2 * sn), vy = Y[i] + h * (s1 * sn + s2 * cs);
          if (vx < 0) push(i, vx, vy, PHYS.wall * Math.min(-vx, PHYS.wallCap) + (VX[i] < 0 ? -PHYS.contactDamping * VX[i] : 0), 0);
          if (vx > side) push(i, vx, vy, -(PHYS.wall * Math.min(vx - side, PHYS.wallCap) + (VX[i] > 0 ? PHYS.contactDamping * VX[i] : 0)), 0);
          if (vy < 0) push(i, vx, vy, 0, PHYS.wall * Math.min(-vy, PHYS.wallCap) + (VY[i] < 0 ? -PHYS.contactDamping * VY[i] : 0));
          if (vy > side) push(i, vx, vy, 0, -(PHYS.wall * Math.min(vy - side, PHYS.wallCap) + (VY[i] > 0 ? PHYS.contactDamping * VY[i] : 0)));
        }
      }
      // Pairwise push-apart, each unordered pair once, through the grid.
      head.fill(-1);
      for (let i = 0; i < N; i++) {
        const cidx = cellOf(X[i]) + cellOf(Y[i]) * gridDim;
        next[i] = head[cidx]; head[cidx] = i;
      }
      for (let i = 0; i < N; i++) {
        const cx = cellOf(X[i]), cy = cellOf(Y[i]);
        for (let oy = -1; oy <= 1; oy++) {
          const yy = cy + oy;
          if (yy < 0 || yy >= gridDim) continue;
          for (let ox = -1; ox <= 1; ox++) {
            const xx = cx + ox;
            if (xx < 0 || xx >= gridDim) continue;
            for (let j = head[xx + yy * gridDim]; j !== -1; j = next[j]) if (j > i) collide(i, j);
          }
        }
      }
      // Integrate each body: the contacts and walls over its mass and inertia, the spring to its
      // target pose and the fading jiggle as accelerations, so a block arrives at a single square's pace.
      for (let b = 0; b < NB; b++) {
        const ax = BFX[b] / BM[b] - ks * (BX[b] - BTX[b]) - c * BVX[b] + jiggle * decay * Math.cos(FQX[b] * tauMoves + PHX[b]);
        const ay = BFY[b] / BM[b] - ks * (BY[b] - BTY[b]) - c * BVY[b] + jiggle * decay * Math.cos(FQY[b] * tauMoves + PHY[b]);
        BVX[b] += ax * dt; BVY[b] += ay * dt;
        const sp = Math.hypot(BVX[b], BVY[b]);
        if (sp > PHYS.maxSpeed) { BVX[b] *= PHYS.maxSpeed / sp; BVY[b] *= PHYS.maxSpeed / sp; }
        BX[b] += BVX[b] * dt; BY[b] += BVY[b] * dt;
        const alpha = BTQ[b] / BI[b] - ks * (BPH[b] - BTT[b]) - c * BW[b] + jiggleTorque * decay * Math.cos(FQT[b] * tauMoves + PHT[b]);
        BW[b] += alpha * dt;
        if (BW[b] > PHYS.maxSpin) BW[b] = PHYS.maxSpin; else if (BW[b] < -PHYS.maxSpin) BW[b] = -PHYS.maxSpin;
        BPH[b] += BW[b] * dt;
      }
      worldPoses();
      store(s);
    }
    // The last fraction of the move eases every square onto its exact target: for a block's member
    // that is the residual its target keeps from the block's rigid image, blended in with whatever
    // the body's spring has not yet closed; the final state is the target itself, so the frame at
    // n + 1 is the retained packing.
    const b0 = 1 - PHYS.blend;
    if (mode === 'snap') {
      for (let s = 0; s <= steps; s++) {
        const tau = s / steps;
        if (tau <= b0) continue;
        const w = s === steps ? 1 : smoothstep((tau - b0) / PHYS.blend);
        let o = s * N * 3;
        for (let i = 0; i < N; i++, o += 3) {
          if (w >= 1) { states[o] = TX[i]; states[o + 1] = TY[i]; states[o + 2] = TT[i]; }
          else { states[o] = lerp(states[o], TX[i], w); states[o + 1] = lerp(states[o + 1], TY[i], w); states[o + 2] = lerp(states[o + 2], TT[i], w); }
        }
      }
    }
    const ms = performance.now() - t0;
    console.timeEnd(label);
    return {
      pair: pairIndex, n, steps, style, mode, bodies: NB, states, sides, ms, maxPenetration, maxPenetrationLate,
      squeeze, squeezeDone, side0, anneal: level, annealAmplitude: amp, annealSpan: span, annealDecay: decayPower,
      miss: measureMiss(states, steps, N, TX, TY, TT, SZ, B.side, blind),
    };
  }
  // What the run actually reached, from its final state: the largest distance a square's centre
  // ends from the record's, the largest angle error (modulo 90 degrees, since a square landing a
  // quarter turn round is the same square), and the side of the smallest axis-aligned square box
  // that holds the poses reached, against the record's side. Under 'snap' every one of these is
  // zero by construction; under 'free' and 'blind' they are the honest report.
  function measureMiss(states, steps, N, TX, TY, TT, SZ, recordSide, align) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    const o0 = steps * N * 3;
    for (let i = 0; i < N; i++) {
      const x = states[o0 + i * 3], y = states[o0 + i * 3 + 1], th = states[o0 + i * 3 + 2];
      const h = SZ[i] / 2, cs = Math.cos(th), sn = Math.sin(th);
      for (let q = 0; q < 4; q++) {
        const s1 = q & 1 ? -1 : 1, s2 = q & 2 ? -1 : 1;
        const vx = x + h * (s1 * cs - s2 * sn), vy = y + h * (s1 * sn + s2 * cs);
        if (vx < x0) x0 = vx; if (vx > x1) x1 = vx;
        if (vy < y0) y0 = vy; if (vy > y1) y1 = vy;
      }
    }
    // A blind run floats in a box of its own, so its poses are compared with the record's after
    // both are pushed into the corner of their own bounding box.
    const ox = align ? x0 : 0, oy = align ? y0 : 0;
    let centre = 0, angle = 0;
    for (let i = 0; i < N; i++) {
      const x = states[o0 + i * 3] - ox, y = states[o0 + i * 3 + 1] - oy, th = states[o0 + i * 3 + 2];
      const d = Math.hypot(x - TX[i], y - TY[i]);
      if (d > centre) centre = d;
      const da = Math.abs(angleDelta(TT[i] / DEG, th / DEG));
      if (da > angle) angle = da;
    }
    const side = Math.max(x1 - x0, y1 - y0);
    return { centre, angle, side, record: recordSide, excess: (side / recordSide - 1) * 100 };
  }
  // The step count: 120 a second of the annealed move, so a level that lengthens the move buys sub-
  // steps at the same dt rather than a finer integration of the same span.
  function physicsSteps(pairIndex, style) {
    return Math.max(1, Math.round(PHYS.stepsPerSecond * timing(pairIndex, style).move));
  }
  function ensureTrajectory(pairIndex, style, mode) {
    mode = MODES.includes(mode) ? mode : simMode();
    const steps = physicsSteps(pairIndex, style);
    const key = style + '/' + mode + (mode === 'blind' ? ':' + BLIND.inflate : '') + '/a' + state.anneal + '/' + pairIndex + '/' + steps;
    let tr = physicsCache.get(key);
    if (!tr) {
      tr = simulate(pairIndex, steps, style, mode, state.anneal);
      if (physicsCache.size >= PHYS_CACHE_MAX) physicsCache.delete(physicsCache.keys().next().value);
      physicsCache.set(key, tr);
    }
    return tr;
  }
  // The pose of square i at move fraction u in (0, 1), linearly interpolated between cached steps.
  const samplePoseOut = [0, 0, 0];
  function samplePose(tr, u, i) {
    const N = tr.n + 1;
    const f = u * tr.steps;
    let s0 = Math.floor(f);
    if (s0 >= tr.steps) s0 = tr.steps - 1;
    const w = f - s0;
    const o0 = (s0 * N + i) * 3, o1 = ((s0 + 1) * N + i) * 3;
    const st = tr.states;
    samplePoseOut[0] = lerp(st[o0], st[o1], w);
    samplePoseOut[1] = lerp(st[o0 + 1], st[o1 + 1], w);
    samplePoseOut[2] = lerp(st[o0 + 2], st[o1 + 2], w) / DEG;
    return samplePoseOut;
  }
  // The container's side at move fraction u, from the same cache: a blind run's box is not a
  // function of the clock, so it has to be read back rather than recomputed.
  function sampleSide(tr, u) {
    const f = u * tr.steps;
    const s0 = Math.floor(f);
    if (s0 >= tr.steps) return tr.sides[tr.steps];
    return lerp(tr.sides[s0], tr.sides[s0 + 1], f - s0);
  }

  // Revision 9: the three legend lines are gone from the stage. What a free or blind run reached is
  // still on the API — `physics(index, style, mode).miss` — and the live readout below carries the
  // same numbers frame by frame, so nothing had to be measured differently to drop the prose.

  // ---------------------------------------------------------------- the live gap (revision 7, feature 3)
  // How far off the best known the picture on the stage is, this frame: the largest distance a
  // square's centre is from the record's, the largest angle error modulo 90 degrees, and the side
  // of the smallest axis-aligned box that holds the squares as drawn, against the record's side.
  // It is measured from the poses the scene drew, so it means the same thing under every style: an
  // interpolation shows it closing to nothing, a snapped run reaches nothing at the end, a free run
  // rests at its residual. In a blind run the squares have no correspondence to the record's
  // labelling, so the centre and angle errors are meaningless and only the box is reported.
  const gapA = document.getElementById('gap-a');
  const gapB = document.getElementById('gap-b');
  const gapC = document.getElementById('gap-c');
  const gapD = document.getElementById('gap-d');
  const gapOut = { centre: 0, angle: 0, side: 0 };
  function gapOf(px, py, pa) {
    let centre = 0, angle = 0, x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < px.length; i++) {
      const dx = px[i] - tgtX[i], dy = py[i] - tgtY[i];
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > centre) centre = d;
      const da = Math.abs(angleDelta(tgtA[i], pa[i]));
      if (da > angle) angle = da;
      const cs = Math.cos(pa[i] * DEG) * 0.5, sn = Math.sin(pa[i] * DEG) * 0.5;
      for (let q = 0; q < 4; q++) {
        const s1 = q & 1 ? -1 : 1, s2 = q & 2 ? -1 : 1;
        const vx = px[i] + s1 * cs - s2 * sn, vy = py[i] + s1 * sn + s2 * cs;
        if (vx < x0) x0 = vx; if (vx > x1) x1 = vx;
        if (vy < y0) y0 = vy; if (vy > y1) y1 = vy;
      }
    }
    gapOut.centre = centre;
    gapOut.angle = angle;
    gapOut.side = Math.max(x1 - x0, y1 - y0);
    return gapOut;
  }

  // ---------------------------------------------------------------- the gap bar (revision 8, feature 4)
  // One horizontal bar for the n the range steps into: the proved lower bound at the left, the best
  // known as a labelled tick, the span between them shaded because that is the territory nobody has
  // closed, and a hand on the side the arrangement on the stage would actually need. Both numbers
  // are the ones the panel prints two lines further down, `s(n) <= ...` and `s(n) >= ...`, read
  // straight off the record rather than re-derived.
  // Revision 9: the hand is not redrawn every frame. The motion is already visible in the packing,
  // so a second animated readout of it is noise. The bar redraws when the picture is not moving —
  // through the dwell and from the moment the settle ends — at a step boundary, whenever a setting
  // that changes the answer is touched, and on demand (`refreshGap()` and the button beside it).
  // The two text rows below the bar stay live: they are numbers, not a moving indicator, and a drag
  // has to show its effect on the required side at once.
  let gapBarDirty = true;
  function markGapBar() { gapBarDirty = true; }
  const GAPBAR = {
    width: 680,
    // The scale's headroom past the record: two and a half times the open gap, but never less than
    // one per cent of the record (n = 321's gap is 0.16 per cent and would otherwise fill the bar)
    // and never more than ten (n = 26's is 8.9 per cent, and a blind run reaches about seven).
    headGap: 2.5, headMin: 0.01, headMax: 0.10,
    // A proved n has no gap at all, so its record tick is set this far in from the left instead of
    // sitting on the edge.
    provedInset: 0.3,
  };
  // What it takes to say the picture *is* the record: every square on its own target, not merely a
  // box that happens to be small enough. A blind run has no correspondence to the record's
  // labelling, so there the box is the whole test — and it never wins it.
  const GAP_MET = { centre: 0.02, angle: 0.5, side: 0.002 };
  const gapbar = document.getElementById('gapbar');
  const gapbarExcess = document.getElementById('gapbar-excess');
  const gapbarOpen = document.getElementById('gapbar-open');
  const gapbarLower = document.getElementById('gapbar-lower');
  const gapbarRecord = document.getElementById('gapbar-record');
  const gapbarHand = document.getElementById('gapbar-hand');
  const gapbarLowerLabel = document.getElementById('gapbar-lower-label');
  const gapbarRecordLabel = document.getElementById('gapbar-record-label');
  let gapbarInfo = null;
  const gapbarOut = { n: 0, record: 0, lower: 0, lo: 0, hi: 0, side: 0, x: 0, excess: 0, met: false };
  // The scale and the static marks, once per n rather than once per frame.
  function gapbarSetup(p) {
    const n = p.n + 1;
    if (gapbarInfo !== null && gapbarInfo.n === n) return gapbarInfo;
    const f = FACTS[String(n)];
    const record = Number(f.side);
    // A proved n carries no separate lower bound: the bound is the value, and the gap is nothing.
    const lower = f.lower === null ? record : Number(f.lower);
    const head = Math.min(record * GAPBAR.headMax, Math.max(record * GAPBAR.headMin, (record - lower) * GAPBAR.headGap));
    const hi = record + head;
    const lo = lower < record - 1e-9 ? lower : record - head * GAPBAR.provedInset;
    gapbarInfo = { n, record, lower, lo, hi, proved: f.lower === null };
    const xr = gapbarX(record);
    gapbarOpen.setAttribute('x', fmt(gapbarX(lower), 2));
    gapbarOpen.setAttribute('width', fmt(Math.max(0, xr - gapbarX(lower)), 2));
    gapbarLower.setAttribute('x1', fmt(gapbarX(lower) + 1, 2));
    gapbarLower.setAttribute('x2', fmt(gapbarX(lower) + 1, 2));
    gapbarRecord.setAttribute('x1', fmt(xr, 2));
    gapbarRecord.setAttribute('x2', fmt(xr, 2));
    // The two numbers, in the relations the panel states them with. The record's sits under its
    // tick unless that would put it on top of the lower bound's, in which case it steps aside: the
    // tick is the mark, the numeral only has to be next to it.

    gapbarRecordLabel.textContent = '≤ ' + fmt(record, 2);
    const lowerWidth = gapbarLowerLabel.textContent === '' ? 0 : gapbarLowerLabel.textContent.length * digitWidth * 0.92;
    const recordHalf = (gapbarRecordLabel.textContent.length * digitWidth * 0.92) / 2;
    let lx = xr;
    if (lx - recordHalf < lowerWidth + 16) lx = lowerWidth + 16 + recordHalf;

  function updateGapBar(p, B, g, mode) {

      ? g.side <= info.record * (1 + GAP_MET.side)
      : g.centre <= GAP_MET.centre && g.angle <= GAP_MET.angle && g.side <= info.record * (1 + GAP_MET.side);
    // On a hit the hand locks to the record's tick rather than hovering a pixel off it.

  // `still` is true where the picture is not in motion: through the dwell, and from the instant the

    const excess = (g.side / B.side - 1) * 100;

    if (state.optimizing && opt !== null) {

  // ---------------------------------------------------------------- initial conditions and Optimize (revision 9)
  // The cached simulator above answers one question: what does the step from n - 1 to n look like?
  // Optimize answers a different one: from some arrangement of n squares, how small a box can this
  // physics get them into, given as long as you like? That is an open-ended run, so it cannot be a
  // precomputed span: state advances, in chunks sized to hold the frame budget, until pause.
  //
  // It is a separate stepper rather than a generalisation of `simulate`. `simulate` is a closed
  // precompute whose output is cached, keyed and byte-compared by four checkers; opening it up to
  // continuation would put every one of those measurements at risk for no gain here. The physics is
  // the same physics — the same constants, the same separating-axis push-apart, the same walls, the
  // same seeded jiggle — with one difference in the clock: the optimizer's time unit is one second

  // as per-second ones.

  const INITIALS = ['previous', 'random', 'grid'];
  const OPT = {

    maxChunk: 400,
    minChunk: 1,
    // The walls close while the packing is not jamming and ease back out when it is, which is the
    // inflate-and-contract cycle revision 7's annealing survey said the side actually responds to.
    squeezeRate: 0.03,     // fraction of the side taken per simulated second while nothing overlaps

    // The squeeze runs only while the arrangement is essentially clean and gives room back once it

    tau: 2.0, floor: 0.15,
    randomInflate: 1.25,   // the random start's box, comfortably larger than the record

    // squares keep nudging into each other by a thousandth or two for as long as the run goes, and
    // there is no instant at which the overlap is exactly nothing. Which is why the readout prints

    feasible: 0.008,

  const initialLabel = { previous: 'previous packing', random: 'random', grid: 'ordered fill' };

  //             always shown; with the target springs on, in the record's own box.
  //   random    N squares at seeded pseudo-random centres and angles in a box a quarter larger than

  function initialArrangement(kind, p, A, B, springs) {
    const N = p.n + 1;
    const X = new Float64Array(N), Y = new Float64Array(N), TH = new Float64Array(N);
    let side;
    if (kind === 'grid') {
      const cols = Math.ceil(Math.sqrt(N));
      side = Math.max(cols, Math.ceil(N / cols));
      for (let i = 0; i < N; i++) {

        Y[i] = Math.floor(i / cols) + 0.5;

    } else if (kind === 'random') {
      side = B.side * OPT.randomInflate;

      for (let i = 0; i < N; i++) {

    } else if (springs) {
      side = B.side;
      for (let i = 0; i < p.n; i++) { X[i] = A.squares[i][0]; Y[i] = A.squares[i][1]; TH[i] = A.squares[i][2] * DEG; }

  }

  let opt = null;   // the live run, or null

  // by not having one, so both of those are pure compaction — contacts, walls and the shake.
  function optSprings(kind) { return kind === 'previous' && !state.blind; }

  function measureOptimizer(o) {

      const head = o.head, next = o.next;

      for (let i = 0; i < N; i++) {

      // neighbours are pushed aside by it rather than the other way round.
      for (let i = 0; i < N; i++) {
        if (i === o.held) {
          X[i] = o.heldX; Y[i] = o.heldY; TH[i] = o.heldTH;
          VX[i] = 0; VY[i] = 0; W[i] = 0;

        }
        const wob = jig * decay;
        const ax = FX[i] - ks * (X[i] - o.TX[i]) - c * VX[i] + wob * Math.cos(o.FQX[i] * o.time + o.PHX[i]);
        const ay = FY[i] - ks * (Y[i] - o.TY[i]) - c * VY[i] + wob * Math.cos(o.FQY[i] * o.time + o.PHY[i]);
        VX[i] += ax * dt; VY[i] += ay * dt;
        const sp = Math.hypot(VX[i], VY[i]);
        if (sp > PHYS.maxSpeed) { VX[i] *= PHYS.maxSpeed / sp; VY[i] *= PHYS.maxSpeed / sp; }
        X[i] += VX[i] * dt; Y[i] += VY[i] * dt;
        const alpha = TQ[i] / PHYS.inertia - ks * angleDelta(o.TT[i] / DEG, TH[i] / DEG) * DEG - c * W[i]
          + jigT * decay * Math.cos(o.FQT[i] * o.time + o.PHT[i]);
        W[i] += alpha * dt;
        if (W[i] > PHYS.maxSpin) W[i] = PHYS.maxSpin; else if (W[i] < -PHYS.maxSpin) W[i] = -PHYS.maxSpin;
        TH[i] += W[i] * dt;
      }
      // The walls, where there is no target to hold the packing at the record's side: in while the
      // squares are clear of each other, back out while something is jammed, so the run is an
      // inflate-and-contract cycle rather than a one-way squeeze that can only fail.
      if (!o.springs) {

        if (pen <= OPT.squeezeTol) nextSide = Math.max(OPT.minSide, o.side * (1 - OPT.squeezeRate * dt));
        else if (pen > OPT.jamTol) nextSide = o.side * (1 + OPT.relaxRate * dt);
        if (nextSide !== o.side) {
          const shift = (nextSide - o.side) / 2;
          for (let i = 0; i < N; i++) { X[i] += shift; Y[i] += shift; }
          if (o.held >= 0) { o.heldX += shift; o.heldY += shift; }

  }
  function optPush(o, i, px, py, fx, fy) {
    o.FX[i] += fx; o.FY[i] += fy;
    o.TQ[i] += PHYS.contactTorque * ((px - o.X[i]) * fy - (py - o.Y[i]) * fx);

  // The separating-axis test of the cached simulator, on unit squares, returning the penetration.
  let optSpx = 0, optSpy = 0;
  function optSupport(o, i, nx, ny) {
    const h = 0.5, cs = o.COS[i], sn = o.SIN[i];
    const s1 = nx * cs + ny * sn >= 0 ? 1 : -1;
    const s2 = -nx * sn + ny * cs >= 0 ? 1 : -1;

    optSpy = o.Y[i] + h * (s1 * sn + s2 * cs);
