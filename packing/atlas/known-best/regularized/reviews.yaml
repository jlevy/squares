# record; `python -m devtools.regularize_axis_components --check-atlas` holds each
# admitting record and its entry to each other. A record names its source witness as the
# witness identifies itself (its id, its source's key, path and revision, and its side),
# never by a digest of its bytes (OR-16). It lapses when the witness or the generator's
# version changes, and then admits nothing.
