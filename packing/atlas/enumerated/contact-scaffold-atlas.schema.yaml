$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:ContactScaffoldAtlas/v1
title: Abstract size-five contact-scaffold atlas
type: object
additionalProperties: false
required: [generated_by, claim_status, scope, counts, encoding, rendering, topologies]
properties:
  generated_by: {const: python -m devtools.build_contact_scaffold_atlas}
  claim_status: {const: abstract-contact-scaffolds-no-geometry-no-packing-verdict}
  scope: {type: string, minLength: 1}
  counts:
    type: object
    additionalProperties: false
    required: [topology_count, topology_coloring_candidates, orbit_action_images, orbit_count]
    properties:
      topology_count: {const: 21}
      topology_coloring_candidates: {const: 1533696}
      orbit_action_images: {const: 1705312}
      orbit_count: {const: 11013}
  encoding:
    type: object
    additionalProperties: false
    required: [identity, edge_order, color_digits]
    properties:
      identity: {const: <topology-id>/<representative-digit-string>}
      edge_order: {type: string, minLength: 1}
      color_digits:
        type: object
        additionalProperties: false
        required: ['0', '1', '2', '3']
        properties:
          '0': {const: u-normal-minus}
          '1': {const: u-normal-plus}
          '2': {const: v-normal-minus}
          '3': {const: v-normal-plus}
  rendering:
    type: object
    additionalProperties: false
    required: [path, semantics]
    properties:
      path: {const: atlas/enumerated/rendering/contact-scaffolds-size5-overview.svg}
      semantics: {const: abstract-topology-count-overview-not-packing-geometry}
  topologies:
    type: array
    minItems: 21
    maxItems: 21
    items:
      type: object
      additionalProperties: false
      required: [id, edge_count, edges, orbit_count, representatives]
      properties:
        id: {type: string, pattern: '^T5-[0-9]{2}$'}
        edge_count: {type: integer, minimum: 4, maximum: 10}
        edges:
          type: array
          minItems: 4
          maxItems: 10
          items:
            type: array
            prefixItems:
            - {type: integer, minimum: 0, maximum: 4}
            - {type: integer, minimum: 0, maximum: 4}
            minItems: 2
            maxItems: 2
        orbit_count: {type: integer, minimum: 1}
        representatives:
          type: array
          minItems: 1
          items: {type: string, pattern: '^[0-3]{4,10}$'}
