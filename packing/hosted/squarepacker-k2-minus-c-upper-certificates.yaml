description: >-
  The two largest Theorem 1.6 end-packing certificates of Sungjoon Ryu's preprint
  squarepacker/k2-minus-c-upper (issues 471 and 486), upstream gzip files of 2.6 and
  4.5 MB kept out of Git under OR-18. They are byte-identical at tags v1.0
  (700668795e6b95f0bf2a2c6de104adaf3a3ebce0) and v1.1, carry the digests of the source's
  SHA256SUMS, and are also in the Zenodo archives 10.5281/zenodo.23256655 and
  10.5281/zenodo.23278927. Both packets pin them; cases/asymptotic/ryu_upper_certificates.py
  reads them through this manifest. MIT licence (the source's LICENSE).
