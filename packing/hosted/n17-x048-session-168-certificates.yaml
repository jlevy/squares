repository: jlevy/squares
tag: data/n17-x048-session-168-certificates-v1
description: 'The n17 sub-pattern certificate objects of X-048 session 168, by certificate directory:
  the interval branch-and-bound certificate of A and the kernel certificates of W7, SW9 (flag 3) and residue
  state N1. The standing verifiers (devtools.verify_n17_bb_certificate, devtools.verify_n17_kernel_certificate)
  re-check them once fetched; devtools.census_n17_certified counts from the committed receipts without
  them. Session 182 adds the kernel certificates its lanes admit, by directory: s182-k<J> for lane K''s
  flags and s182-m<mask> for lane A''s residue states. Issue 472 (H-341, exp-317) adds wand125''s twelve
  kernel certificates, by directory w125-k-m<mask>, also listed in n17-issue-472-kernel-certificates.yaml.'
